# Isolated Studio identities: memberId=m-alpha, workflowId=wf-alpha,
# publishedServiceId=svc-alpha. They are not aliases for user_service_id=usvc-alpha.
name: finance-budget-nosend
steps:
  - id: read_budget
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: usvc-alpha
        method: GET
        path_template: /v1/budget/status
        query_parameters: [period]
        header_parameters: [If-None-Match]
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: '{}'
