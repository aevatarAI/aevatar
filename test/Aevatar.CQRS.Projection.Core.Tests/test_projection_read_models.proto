syntax = "proto3";

package aevatar.cqrs.projection.core.tests;

option csharp_namespace = "Aevatar.CQRS.Projection.Core.Tests";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";

message TestStoreReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  string value = 6;
}

message TestDynamicStoreReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  string document_index_scope = 6;
}

message TestProviderStoreSmokeReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  string value = 6;
  int64 updated_at_epoch_ms = 7;
}

message TestRecursiveWellKnownReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  google.protobuf.Struct fields_value = 6;
  string value = 7;
  google.protobuf.Any open_payload = 8;
  map<string, string> labels = 9;
  repeated TestOpenPayloadEntry entries = 10;
  repeated string tags = 11;
  TestOpenPayloadEntry primary_entry = 12;
  repeated TestOpenPayloadEntry child_entries = 13;
}

message TestOpenPayloadEntry {
  string entry_id = 1;
  map<string, string> attributes = 2;
  TestOpenPayloadLeaf leaf = 3;
}

message TestOpenPayloadLeaf {
  string leaf_id = 1;
  map<string, string> annotations = 2;
}
