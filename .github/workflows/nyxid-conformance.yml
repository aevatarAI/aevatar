name: NyxID Assistant Conformance

on:
  pull_request:
    paths:
      - '.github/workflows/nyxid-conformance.yml'
      - 'agents/Aevatar.GAgents.NyxidChat/**'
      - 'docs/contracts/nyxid-assistant-conformance/**'
      - 'src/Aevatar.AI.ToolProviders.NyxId/**'
      - 'src/Aevatar.Mainnet.Host.Api/Hosting/MainnetHostBuilderExtensions.cs'
      - 'tools/ci/nyxid_conformance_guard.py'
      - 'tools/ci/nyxid_conformance_guard.sh'
      - 'tools/nyxid-conformance/**'
  workflow_dispatch:

jobs:
  pinned-source-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned NyxID source
        uses: actions/checkout@v4
        with:
          repository: ChronoAIProject/NyxID
          ref: fa157bc4160c27922f49f8f498ccac755843a15a
          path: external/nyxid

      - name: Checkout pinned support contract
        run: |
          git clone --quiet https://gist.github.com/b4dd5182c5ac1efc2ad546ecb5f948f3.git external/support-contract
          git -C external/support-contract checkout --quiet f45febb057a7182dab2495d4c739d2bb8d7026f5

      - name: Validate manifest and pinned sources
        run: >-
          bash tools/ci/nyxid_conformance_guard.sh
          --nyxid-root external/nyxid
          --gist-root external/support-contract

