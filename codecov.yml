ignore:
  - "tools/**"
  - "agents/**"
  # Host/composition layer: inline-HTML console pages render UI strings and wire
  # endpoints (CLAUDE.md: API 仅做宿主与组合). They carry no business logic and
  # must not gate patch coverage.
  - "**/*Page.cs"
  - "src/Aevatar.Mainnet.Host.Api/BackendConsole/**"

coverage:
  status:
    patch:
      default:
        target: auto
        threshold: 5%
        flags:
          - ci
        only_pulls: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
