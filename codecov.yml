ignore:
  - "tools/**"
  - "agents/**"

coverage:
  status:
    patch:
      default:
        target: auto
        threshold: 5%
        flags:
          - ci
        only_pulls: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
