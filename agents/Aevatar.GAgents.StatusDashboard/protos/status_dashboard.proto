syntax = "proto3";

package aevatar.gagents.status_dashboard;

option csharp_namespace = "Aevatar.GAgents.StatusDashboard";

import "google/protobuf/timestamp.proto";

// ─── Domain model ───

// Outcome categories surfaced on the status board. Mirrored to the JSON API
// and HTML dashboard. "unknown" means the actor has never produced a result.
enum HealthOutcomeStatus {
  HEALTH_OUTCOME_STATUS_UNSPECIFIED = 0;
  HEALTH_OUTCOME_STATUS_UNKNOWN = 1;
  HEALTH_OUTCOME_STATUS_OK = 2;
  HEALTH_OUTCOME_STATUS_DEGRADED = 3;
  HEALTH_OUTCOME_STATUS_DOWN = 4;
}

// One probe execution result. Held on actor state and projected to readmodel.
message HealthProbeOutcome {
  HealthOutcomeStatus status = 1;
  int32 latency_ms = 2;
  string detail = 3;             // free-form upstream signal (status code, error code)
  string error_message = 4;      // present only on degraded/down
  google.protobuf.Timestamp observed_at = 5;
}

// Immutable target descriptor seeded from the host manifest. Lives on actor
// state so the probe loop can re-arm itself across restarts without needing
// to re-read the manifest on every tick. Reconfigure command replaces it.
message HealthProbeTargetDescriptor {
  string slug = 1;               // stable identifier; also the actor id suffix
  string display_name = 2;
  string category = 3;           // "upstream" | "self" | "feature"
  string probe_kind = 4;         // executor strategy key
  int32 interval_seconds = 5;
  int32 timeout_ms = 6;
  bool enabled = 7;
  map<string, string> parameters = 8;
}

// ─── Persisted actor state ───

// One actor per probe target — current state replica is the source of truth for
// the read model. Configuration lives alongside the latest outcome so the actor
// is self-sufficient across restarts.
message HealthProbeTargetState {
  HealthProbeTargetDescriptor spec = 1;
  HealthProbeOutcome last_outcome = 2;
  int32 consecutive_failures = 3;
  google.protobuf.Timestamp last_success_at = 4;
  google.protobuf.Timestamp last_check_at = 5;
  repeated HealthProbeOutcome recent_outcomes = 6;
  HealthProbeExecutionState active_execution = 7;
}

message HealthProbeExecutionState {
  string operation_id = 1;
  string slug = 2;
  google.protobuf.Timestamp started_at = 3;
  int32 timeout_ms = 4;
}

// ─── Commands (envelope payloads) ───

// Idempotent (re)initialization. Startup service replays this every boot;
// the actor diffs against current descriptor and rearms the self-timer only
// when the descriptor actually changes.
message HealthProbeConfigureCommand {
  HealthProbeTargetDescriptor spec = 1;
}

// Self-message produced by the durable timer scheduler — handled by the same
// actor to invoke the registered probe executor and persist the outcome.
message HealthProbeTickRequested {
  string slug = 1;               // for diagnostic correlation only
  google.protobuf.Timestamp scheduled_for = 2;
}

message HealthProbeTimeoutFiredEvent {
  string slug = 1;
  string operation_id = 2;
  google.protobuf.Timestamp timed_out_at = 3;
  int32 timeout_ms = 4;
}

message HealthProbeCompletedEvent {
  string slug = 1;
  string operation_id = 2;
  HealthProbeOutcome outcome = 3;
}

// ─── Domain events ───

message HealthProbeConfigured {
  HealthProbeTargetDescriptor spec = 1;
  google.protobuf.Timestamp configured_at = 2;
}

message HealthProbeObserved {
  HealthProbeOutcome outcome = 1;
}

message HealthProbeExecutionStarted {
  HealthProbeExecutionState execution = 1;
}

message HealthProbeExecutionCleared {
  string operation_id = 1;
}

// ─── Projection read model ───

message HealthProbeTargetDocument {
  string id = 1;                                 // = slug (also document key)
  string slug = 2;
  string display_name = 3;
  string category = 4;
  string probe_kind = 5;
  int32 interval_seconds = 6;
  bool enabled = 7;
  HealthOutcomeStatus status = 8;
  int32 latency_ms = 9;
  string detail = 10;
  string error_message = 11;
  int32 consecutive_failures = 12;
  google.protobuf.Timestamp last_check_at = 13;
  google.protobuf.Timestamp last_success_at = 14;
  int64 state_version = 15;
  string last_event_id = 16;
  string actor_id = 17;
  google.protobuf.Timestamp updated_at_utc = 18;
  repeated HealthProbeOutcome recent_outcomes = 19;
}
