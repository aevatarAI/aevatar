<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>渠道接入 · Channels · aevatar</title>
<style>
  /* =========================================================================
     aevatar 渠道接入 / Channels —— 高保真视觉交互稿
     由 host 直出于 /channels（和 /workflow/studio、observatory 同源）。
     framework-agnostic：语义化 HTML + CSS 变量 + 少量 vanilla JS（仅状态切换）。
     设计令牌与 studio/observatory 一字不差。
     ========================================================================= */

  /* ---- Design tokens : 暗色（默认）------------------------------------- */
  :root {
    --bg:#0f1115; --bg-grad:radial-gradient(1200px 600px at 78% -10%,#161b26 0%,#0f1115 60%);
    --panel:#171a21; --panel-2:#1f232c; --panel-3:#252b36;
    --border:#2a2f3a; --border-soft:#22272f;
    --fg:#e6e9ef; --fg-strong:#f4f6fb; --muted:#9aa3b2; --muted-2:#6c7585;
    --accent:#5b8cff; --accent-ink:#0b1020; --accent-soft:rgba(91,140,255,.14); --accent-line:rgba(91,140,255,.40);
    --ok:#3fb950; --ok-soft:rgba(63,185,80,.14); --warn:#d29922; --warn-soft:rgba(210,153,34,.15);
    --err:#f85149; --err-soft:rgba(248,81,73,.14); --run:#58a6ff; --run-soft:rgba(88,166,255,.16);
    --shadow:0 8px 30px rgba(0,0,0,.40); --shadow-sm:0 1px 2px rgba(0,0,0,.30);
    --ring:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
    --r-sm:6px; --r:9px; --r-lg:13px; --r-pill:999px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --topbar-h:56px; color-scheme:dark;
  }
  /* ---- 浅色：@media + .theme-light（令牌同 studio 浅色组）-------------- */
  @media (prefers-color-scheme: light) {
    html:not(.theme-dark) {
      --bg:#f5f7fa; --bg-grad:radial-gradient(1100px 560px at 80% -12%,#eef2f8 0%,#f5f7fa 58%);
      --panel:#ffffff; --panel-2:#f3f5f9; --panel-3:#eaeef4; --border:#dde2ea; --border-soft:#e7ebf1;
      --fg:#1c2128; --fg-strong:#0b0f14; --muted:#57606b; --muted-2:#828b97;
      --accent:#2f63e0; --accent-ink:#ffffff; --accent-soft:rgba(47,99,224,.10); --accent-line:rgba(47,99,224,.34);
      --ok:#1a7f37; --ok-soft:rgba(26,127,55,.12); --warn:#9a6700; --warn-soft:rgba(154,103,0,.12);
      --err:#cf222e; --err-soft:rgba(207,34,46,.10); --run:#2f6fed; --run-soft:rgba(47,111,237,.12);
      --shadow:0 10px 30px rgba(16,24,40,.10); --shadow-sm:0 1px 2px rgba(16,24,40,.06);
      color-scheme:light;
    }
  }
  html.theme-light {
    --bg:#f5f7fa; --bg-grad:radial-gradient(1100px 560px at 80% -12%,#eef2f8 0%,#f5f7fa 58%);
    --panel:#ffffff; --panel-2:#f3f5f9; --panel-3:#eaeef4; --border:#dde2ea; --border-soft:#e7ebf1;
    --fg:#1c2128; --fg-strong:#0b0f14; --muted:#57606b; --muted-2:#828b97;
    --accent:#2f63e0; --accent-ink:#ffffff; --accent-soft:rgba(47,99,224,.10); --accent-line:rgba(47,99,224,.34);
    --ok:#1a7f37; --ok-soft:rgba(26,127,55,.12); --warn:#9a6700; --warn-soft:rgba(154,103,0,.12);
    --err:#cf222e; --err-soft:rgba(207,34,46,.10); --run:#2f6fed; --run-soft:rgba(47,111,237,.12);
    --shadow:0 10px 30px rgba(16,24,40,.10); --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    color-scheme:light;
  }
  html.theme-dark { color-scheme:dark; }

  /* ---- base ------------------------------------------------------------- */
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); background-image:var(--bg-grad); background-attachment:fixed;
    color:var(--fg); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  ::selection { background:var(--accent-soft); }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:none; box-shadow:var(--ring); border-radius:var(--r-sm); }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .scroll::-webkit-scrollbar { width:10px; height:10px; }
  .scroll::-webkit-scrollbar-thumb { background:var(--panel-3); border-radius:999px; border:2px solid transparent; background-clip:content-box; }

  /* ---- status primitives (observatory/studio) --------------------------- */
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .dot.s-active, .dot.s-registered, .dot.s-bound, .dot.s-done, .dot.s-ok { background:var(--ok); }
  .dot.s-pending, .dot.s-running { background:var(--run); animation:pulse 2.4s ease-out infinite; }
  .dot.s-warn { background:var(--warn); }
  .dot.s-error, .dot.s-failed { background:var(--err); }
  .dot.s-soon, .dot.s-unknown { background:var(--neutral,#9aa3b2); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 var(--run-soft);} 70%{box-shadow:0 0 0 7px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }

  .badge { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:var(--r-pill); font-size:12px; font-weight:600; border:1px solid transparent; white-space:nowrap; }
  .badge .dot { width:7px; height:7px; }
  .b-active, .b-registered, .b-bound, .b-done { color:var(--ok); background:var(--ok-soft); border-color:color-mix(in oklab,var(--ok) 30%,transparent); }
  .b-pending, .b-running { color:var(--run); background:var(--run-soft); border-color:color-mix(in oklab,var(--run) 30%,transparent); }
  .b-warn { color:var(--warn); background:var(--warn-soft); border-color:color-mix(in oklab,var(--warn) 30%,transparent); }
  .b-error, .b-failed { color:var(--err); background:var(--err-soft); border-color:color-mix(in oklab,var(--err) 30%,transparent); }
  .b-soon { color:var(--muted); background:color-mix(in oklab,var(--muted) 12%,transparent); border-color:var(--border); }

  /* one-click copy button (studio) */
  .copybtn { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r-sm); padding:4px 9px; white-space:nowrap; }
  .copybtn:hover { color:var(--fg); border-color:var(--muted-2); }
  .copybtn.done { color:var(--ok); border-color:color-mix(in oklab,var(--ok) 40%,transparent); }
  .copybtn.err { color:var(--err); border-color:color-mix(in oklab,var(--err) 40%,transparent); }

  /* =========================================================================
     Top bar (thin header) — 同 studio/observatory topbar 模式
     ========================================================================= */
  .topbar { position:sticky; top:0; z-index:40; height:var(--topbar-h); display:flex; align-items:center; gap:12px; padding:0 16px;
    background:color-mix(in oklab,var(--panel) 88%,transparent); backdrop-filter:saturate(140%) blur(12px); -webkit-backdrop-filter:saturate(140%) blur(12px);
    border-bottom:1px solid var(--border); }
  /* Fixed-width brand region keeps the shared suite-nav's start position independent of the
     active page title length, so the five entries don't shift when switching console pages. */
  .brand { display:flex; align-items:center; gap:10px; flex:0 0 268px; width:268px; min-width:0; overflow:hidden; }
  .brand-mark { width:26px; height:26px; border-radius:7px; flex:0 0 auto; display:grid; place-items:center; color:#fff; box-shadow:var(--shadow-sm);
    background:linear-gradient(150deg,var(--accent),color-mix(in oklab,var(--accent) 55%,#7c4dff)); }
  .brand-name { font-weight:650; letter-spacing:-.01em; color:var(--fg-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub { color:var(--muted-2); font-size:12px; white-space:nowrap; }
  /* ---- shared suite navigation (identical across the five console pages) -- */
  .suite-nav { display:flex; align-items:center; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .suite-nav::-webkit-scrollbar { display:none; }
  .suite-nav a { display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:var(--r-pill); font-size:12.5px; font-weight:600; color:var(--muted); text-decoration:none; border:1px solid transparent; white-space:nowrap; transition:color .15s,background .15s,border-color .15s; }
  .suite-nav a:hover { color:var(--fg); background:var(--panel-2); }
  .suite-nav a[aria-current="page"] { color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .suite-nav svg { width:14px; height:14px; flex:0 0 auto; }
  @media (max-width:760px) { .suite-nav .nav-label { display:none; } .suite-nav a { padding:6px 8px; } }
  .scope-chip { display:inline-flex; align-items:center; gap:7px; padding:4px 10px; border-radius:var(--r-pill); background:var(--panel-2); border:1px solid var(--border); font-size:12px; color:var(--muted); }
  .scope-chip .sid { font-family:var(--mono); font-size:11.5px; color:var(--fg); }
  .scope-chip svg { color:var(--ok); }
  .spacer { flex:1 1 auto; }
  .iconbtn { width:34px; height:34px; display:grid; place-items:center; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r); color:var(--muted); transition:color .15s,border-color .15s; }
  .iconbtn:hover { color:var(--fg); border-color:var(--muted-2); }
  .account { display:inline-flex; align-items:center; gap:8px; padding:4px 6px 4px 4px; border-radius:var(--r-pill); background:var(--panel-2); border:1px solid var(--border); }
  .avatar { width:24px; height:24px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; font-size:12px; font-weight:700; color:#fff; background:linear-gradient(140deg,#6f9bff,#9b6bff); }
  .account .who { font-size:12.5px; color:var(--fg); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* =========================================================================
     Page shell
     ========================================================================= */
  .page { max-width:1080px; margin:0 auto; padding:30px 24px 80px; }
  .crumb { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:18px; }
  .crumb button { display:inline-flex; align-items:center; gap:6px; background:transparent; border:0; color:var(--accent); font-weight:600; padding:2px 4px; border-radius:var(--r-sm); }
  .crumb button:hover { text-decoration:underline; }
  .crumb .sep { color:var(--border); }

  .page-h { font-size:24px; font-weight:760; letter-spacing:-.02em; color:var(--fg-strong); margin:0; }
  .page-sub { color:var(--muted); font-size:14px; margin:9px 0 0; line-height:1.6; max-width:64ch; }
  .sec-title { font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:34px 0 14px; display:flex; align-items:center; gap:10px; }
  .sec-title .count { font-family:var(--mono); font-size:12px; color:var(--muted-2); }

  /* ---- channel grid ----------------------------------------------------- */
  .ch-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px; }
  .ch-card { text-align:left; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--panel); padding:18px; display:flex; flex-direction:column; gap:13px; transition:border-color .15s,transform .15s,box-shadow .15s; }
  .ch-card.available { cursor:pointer; }
  .ch-card.available:hover { border-color:var(--accent-line); transform:translateY(-2px); box-shadow:var(--shadow); }
  .ch-card.soon { opacity:.62; cursor:not-allowed; }
  .ch-logo { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; color:#fff; }
  .ch-top { display:flex; align-items:flex-start; justify-content:space-between; }
  .ch-name { font-weight:680; color:var(--fg-strong); font-size:15.5px; letter-spacing:-.01em; }
  .ch-en { font-family:var(--mono); font-size:11px; color:var(--muted-2); margin-top:2px; }
  .ch-desc { font-size:12.5px; color:var(--muted); flex:1; line-height:1.55; }
  .ch-foot { display:flex; align-items:center; justify-content:space-between; }
  .ch-cta { font-size:12px; font-weight:600; color:var(--accent); display:inline-flex; align-items:center; gap:5px; }

  /* ---- connected list --------------------------------------------------- */
  .reg-row { display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:center; padding:13px 15px; border:1px solid var(--border); border-radius:var(--r); background:var(--panel); margin-bottom:8px; }
  .reg-row .rl { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:#fff; flex:0 0 auto; }
  .reg-row .rn { font-weight:640; color:var(--fg-strong); }
  .reg-row .rm { font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:2px; }
  .reg-row .rm .id { font-family:var(--mono); font-size:11.5px; color:var(--muted-2); }
  .reg-row .rm .sep { color:var(--border); }
  .reg-row .ra { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .manage-btn { font-size:12.5px; font-weight:600; color:var(--fg); background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r-sm); padding:6px 12px; }
  .manage-btn:hover { border-color:var(--muted-2); }

  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; color:var(--muted); padding:40px 22px; border:1px dashed var(--border); border-radius:var(--r-lg); }
  .empty .ic { width:40px; height:40px; color:var(--muted-2); opacity:.8; }
  .empty .et { font-weight:600; color:var(--fg); }
  .empty .es { font-size:12.5px; max-width:240px; }

  /* =========================================================================
     Wizard : stepper + main
     ========================================================================= */
  .wiz { display:grid; grid-template-columns:262px minmax(0,1fr); gap:0; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--panel); overflow:hidden; }
  .stepper { padding:20px 14px; border-right:1px solid var(--border); background:color-mix(in oklab,var(--panel-2) 40%,transparent); }
  .stepper-h { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); padding:0 8px; margin-bottom:12px; }
  .step-item { position:relative; display:grid; grid-template-columns:auto 1fr; gap:12px; padding:9px 8px; border-radius:var(--r); border:1px solid transparent; }
  .step-item.clickable { cursor:pointer; }
  .step-item.clickable:hover { background:var(--panel-2); }
  .step-item[aria-current="step"] { background:var(--accent-soft); border-color:var(--accent-line); }
  .step-num { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border); display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--muted); background:var(--panel); z-index:1; }
  .step-item::before { content:""; position:absolute; left:21px; top:39px; height:calc(100% - 30px); width:2px; background:var(--border); }
  .step-item:last-child::before { display:none; }
  .step-item.done .step-num { border-color:var(--ok); color:var(--ok); background:var(--ok-soft); }
  .step-item.done::before { background:var(--ok); }
  .step-item.current .step-num { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .step-item.failed .step-num { border-color:var(--err); color:var(--err); background:var(--err-soft); }
  .step-item .st-title { font-weight:640; color:var(--fg-strong); font-size:13.5px; }
  .step-item.pending .st-title { color:var(--muted); }
  .step-item .st-sub { font-size:11px; color:var(--muted-2); margin-top:1px; font-family:var(--mono); }

  .step-main { padding:26px 30px 36px; min-width:0; }
  .step-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .step-kicker { font-family:var(--mono); font-size:12px; color:var(--accent); }
  .step-h { font-size:20px; font-weight:720; letter-spacing:-.01em; color:var(--fg-strong); margin:4px 0 0; }
  .step-desc { color:var(--muted); font-size:13.5px; margin:10px 0 18px; line-height:1.65; max-width:64ch; }
  .step-foot { display:flex; gap:10px; align-items:center; margin-top:26px; padding-top:18px; border-top:1px solid var(--border-soft); flex-wrap:wrap; }
  .step-foot .spacer { flex:1 1 auto; }

  /* forms */
  .field { margin-bottom:16px; }
  .field > label { display:block; font-size:13px; font-weight:600; color:var(--fg); margin-bottom:6px; }
  .field .req { color:var(--accent); margin-left:2px; }
  .input { width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r); padding:10px 12px; color:var(--fg-strong); font-family:var(--mono); font-size:13px; outline:none; transition:border-color .15s,box-shadow .15s; }
  .input::placeholder { color:var(--muted-2); }
  .input:focus { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .input.bad { border-color:color-mix(in oklab,var(--err) 55%,var(--border)); }
  .field .help { font-size:11.5px; color:var(--muted-2); margin-top:6px; line-height:1.5; }
  .field .err-msg { font-size:12px; color:var(--err); margin-top:6px; display:inline-flex; gap:5px; align-items:center; }

  /* copy rows */
  .crow { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:11px 13px; border:1px solid var(--border); border-radius:var(--r); background:var(--panel-2); margin-bottom:8px; }
  .crow .ck { font-size:11.5px; color:var(--muted-2); margin-bottom:3px; }
  .crow .cv { font-family:var(--mono); font-size:12.5px; color:var(--fg-strong); word-break:break-all; }
  .perm-pill { font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:var(--r-pill); background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line); margin-right:6px; }

  /* callouts */
  .callout { display:flex; gap:11px; padding:12px 14px; border-radius:var(--r); font-size:13px; line-height:1.6; margin:16px 0; }
  .callout svg { flex:0 0 auto; margin-top:2px; }
  .callout .ct-title { font-weight:650; color:var(--fg-strong); display:block; margin-bottom:2px; }
  .callout.info { background:var(--accent-soft); border:1px solid var(--accent-line); }
  .callout.info svg { color:var(--accent); }
  .callout.warn { background:var(--warn-soft); border:1px solid color-mix(in oklab,var(--warn) 38%,transparent); }
  .callout.warn svg { color:var(--warn); }
  .callout.err { background:var(--err-soft); border:1px solid color-mix(in oklab,var(--err) 38%,transparent); }
  .callout.err svg { color:var(--err); }
  .callout .body { color:var(--muted); }
  .callout .body b { color:var(--fg); font-weight:600; }

  /* buttons */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:var(--r); font-size:13.5px; font-weight:650; border:1px solid transparent; transition:filter .15s,border-color .15s,background .15s; }
  .btn-primary { background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-ghost { background:var(--panel-2); border-color:var(--border); color:var(--fg); }
  .btn-ghost:hover { border-color:var(--muted-2); }
  .btn-danger { background:transparent; border-color:color-mix(in oklab,var(--err) 45%,transparent); color:var(--err); }
  .btn-danger:hover { background:var(--err-soft); }
  .btn:disabled { opacity:.5; cursor:default; }

  /* register progress */
  .reg-steps { display:flex; flex-direction:column; gap:1px; margin:6px 0 4px; }
  .reg-line { display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--r-sm); font-size:13px; color:var(--muted-2); }
  .reg-line .ic { width:18px; height:18px; display:grid; place-items:center; flex:0 0 auto; color:var(--muted-2); }
  .reg-line.done { color:var(--fg); } .reg-line.done .ic { color:var(--ok); }
  .reg-line.run { color:var(--fg-strong); } .reg-line.run .ic { color:var(--run); }
  .spin { width:13px; height:13px; border-radius:50%; border:1.7px solid color-mix(in oklab,var(--run) 35%,transparent); border-top-color:var(--run); animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .result-card { border:1px solid color-mix(in oklab,var(--ok) 30%,var(--border)); border-radius:var(--r-lg); background:var(--panel); padding:14px; margin:6px 0 2px; }
  .result-card .rc-h { display:flex; align-items:center; gap:8px; font-weight:650; color:var(--ok); font-size:13.5px; margin-bottom:10px; }

  /* LLM select */
  .select-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .sel { position:relative; }
  .sel select { width:100%; appearance:none; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r); padding:10px 34px 10px 12px; color:var(--fg-strong); font-family:var(--mono); font-size:13px; outline:none; }
  .sel select:focus { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .sel .chev { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted-2); pointer-events:none; }

   one inline self-contained page, gated behind NyxID OIDC (PKCE), then wired to
   the live facade. Authoritative flow = published aevatar-lark-bot-registration
   skill (facade path that writes the api_key_id→scope_id mirror).

   Live wiring (all relative URLs, Bearer from OIDC):
     POST   /api/channels/registrations                register via facade
     GET    /api/channels/registrations                connected list
     DELETE /api/channels/registrations/{id}            delete / recreate
     GET    /api/channels/registrations/{id}/status     live NyxID bot status
     POST   /api/channels/registrations/{id}/workflow-result-delivery/repair
     GET/PUT /api/user-config/llm                        owner reply-model config

const DEFAULT_LLM = { route: "chrono-llm-public", model: "gpt-5.5" };
const USER_LLM_GATEWAY_ROUTE = "/api/v1/llm/gateway/v1";
const USER_LLM_GATEWAY_SELECTION = "gateway";
const USER_LLM_SERVICE_SELECTION_PREFIX = "user-service:";
const USER_LLM_SAVE_OBSERVATION_DELAYS_MS = [0,250,500,1000,2000,3000,5000];
const USER_LLM_SAVE_FINAL_ATTEMPT_SETTLE_MS = 5000;

function llmServiceSelectionValue(userServiceId){
  return USER_LLM_SERVICE_SELECTION_PREFIX + encodeURIComponent(userServiceId);
}
function buildLlmSelectionOptions(llm){
  const routeOptions = (llm && llm.routeOptions) || [];
  const gateway = routeOptions.find(option=>option.source==="gateway_provider");
  const options = [];
  if(gateway && gateway.ready && gateway.allowed){
    options.push({
      value:USER_LLM_GATEWAY_SELECTION,
      label:gateway.label || "NyxID Gateway",
      kind:"gateway",
      routeValue:USER_LLM_GATEWAY_ROUTE,
      userServiceId:null,
      defaultModel:normalizeOptionalLlmModel(gateway.defaultModel),
      ready:true,
      allowed:true
    });
  }
  const seenUserServiceIds = new Set();
  routeOptions.forEach(option=>{
    if(option.source!=="user_service") return;
    const userServiceId=String(option.userServiceId||"").trim();
    if(!userServiceId || seenUserServiceIds.has(userServiceId) || !option.ready || !option.allowed) return;
    seenUserServiceIds.add(userServiceId);
    options.push({
      value:llmServiceSelectionValue(userServiceId),
      label:String(option.label||option.serviceSlug||userServiceId),
      kind:"nyx_id_user_service",
      routeValue:String(option.routeValue||"").trim(),
      userServiceId,
      defaultModel:normalizeOptionalLlmModel(option.defaultModel),
      ready:true,
      allowed:true
    });
  });
  return options;
}
function savedLlmSelectionValue(llm){
  if(!llm) return null;
  if(llm.savedRouteKind==="gateway"){
    return String(llm.savedRoute||"").trim()===USER_LLM_GATEWAY_ROUTE
      ? USER_LLM_GATEWAY_SELECTION
      : null;
  }
  if(llm.savedRouteKind!=="nyx_id_user_service") return null;
  const userServiceId=String(llm.savedUserServiceId||"").trim();
  return userServiceId ? llmServiceSelectionValue(userServiceId) : null;
}
function normalizeLlmModel(value){
  return String(value==null?"":value).trim();
}
function normalizeOptionalLlmModel(value){
  const normalized=normalizeLlmModel(value);
  return normalized || null;
}
function expectedLlmModel(option,requestedModel,llm){
  const explicitModel=normalizeLlmModel(requestedModel);
  if(explicitModel) return { known:true, value:explicitModel };
  if(option.kind==="gateway") return { known:true, value:"" };
  if(requestedModel==null) return { known:false, value:"" };
  return { known:true, value:option.defaultModel || "" };
}
function llmSelectionObserved(target,llm){
  if(!target || !llm) return false;
  let identityObserved=false;
  if(target.kind==="gateway"){
    identityObserved=llm.savedRouteKind==="gateway" &&
      String(llm.savedRoute||"").trim()===USER_LLM_GATEWAY_ROUTE;
  } else {
    identityObserved=llm.savedRouteKind==="nyx_id_user_service" &&
      String(llm.savedUserServiceId||"").trim()===target.userServiceId;
  }
  if(!identityObserved || !target.expectedModelKnown) return false;
  return normalizeLlmModel(llm.defaultModel)===target.expectedCommittedDraft.model;
}

/* ===========================================================================
   Auth layer — OIDC Authorization Code + PKCE against nyxid (same console-web
   client as studio/observatory). No server-side cookie/session, no NyxID change.
   NyxID rejects any redirect_uri it hasn't pre-registered (verified: a fresh
   /channels/callback returns invalid_redirect_uri) and we can't register one
   (NyxID is external). So we reuse studio's already-registered callback AND share
   studio's PKCE + token storage key — which also means a live studio session
   signs you in here automatically. returnTo carries our path so the shared shell
   can route back to /channels once it supports cross-page return.
   =========================================================================== */
const BACKEND_CONSOLE_CONFIG = __BACKEND_CONSOLE_CONFIG__;
const CFG = {
  authority: BACKEND_CONSOLE_CONFIG.authority || "",
  clientId: BACKEND_CONSOLE_CONFIG.clientId || "",
  scope: BACKEND_CONSOLE_CONFIG.scope || "",
  resources: Array.isArray(BACKEND_CONSOLE_CONFIG.resources) ? BACKEND_CONSOLE_CONFIG.resources : [],
  redirectUri: location.origin + "/auto/callback",
  storageKey: BACKEND_CONSOLE_CONFIG.storageKey || ""
};
const TOKEN_KEY = CFG.storageKey + ":token";
const PKCE_KEY  = CFG.storageKey + ":pkce";

function b64url(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function sha256(text){ return b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text))); }
function randomString(len){ const a=new Uint8Array(len); crypto.getRandomValues(a); return b64url(a.buffer).slice(0, len); }

function getToken(){ const raw=localStorage.getItem(TOKEN_KEY); if(!raw) return null; try { return JSON.parse(raw); } catch(e){ console.warn("channels: token parse failed", e); } return null; }
function setToken(t){ localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

async function beginLogin(){
  const verifier = randomString(64);
  const st = randomString(32);
  const challenge = await sha256(verifier);
  // returnTo matches studio's shared-shell PKCE blob shape so the studio callback
  // can route back here once cross-page return lands; harmless meanwhile.
  sessionStorage.setItem(PKCE_KEY, JSON.stringify({ verifier, state: st, returnTo: location.pathname }));
  const u = new URL(CFG.authority + "/oauth/authorize");
  u.searchParams.set("response_type", "code");
  u.searchParams.set("client_id", CFG.clientId);
  u.searchParams.set("redirect_uri", CFG.redirectUri);
  u.searchParams.set("scope", CFG.scope);
  CFG.resources.forEach(resource => u.searchParams.append("resource", resource));
  u.searchParams.set("state", st);
  u.searchParams.set("code_challenge", challenge);
  u.searchParams.set("code_challenge_method", "S256");
  location.assign(u.toString());
}

async function completeLoginIfCallback(){
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  if(!code) return false;
  const returnedState = params.get("state");
  const pending = JSON.parse(sessionStorage.getItem(PKCE_KEY) || "null");
  history.replaceState({}, "", "/channels");
  if(!pending || pending.state !== returnedState){ console.warn("channels: login state mismatch"); return false; }
  const form = new URLSearchParams();
  form.set("grant_type", "authorization_code");
  form.set("code", code);
  form.set("redirect_uri", CFG.redirectUri);
  form.set("client_id", CFG.clientId);
  form.set("code_verifier", pending.verifier);
  CFG.resources.forEach(resource => form.append("resource", resource));
  const res = await fetch(CFG.authority + "/oauth/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body: form.toString() });
  sessionStorage.removeItem(PKCE_KEY);
  if(!res.ok){ console.warn("channels: token exchange failed", res.status); return false; }
  const token = await res.json();
  token.obtained_at = Date.now();
  setToken(token);
  return true;
}

async function fetchUserInfo(){
  const token = getToken(); if(!token) return null;
  try { const res = await fetch(CFG.authority + "/oauth/userinfo", { headers:{ Authorization:"Bearer " + token.access_token } }); return res.ok ? await res.json() : null; }
  catch(e){ console.warn("channels: userinfo fetch failed", e); }
  return null;
}
function toAccount(info){ return info ? { label: info.email || info.preferred_username || info.sub || "已登录" } : null; }

/* Decode the scope_id claim from the access token (the facade resolves the
   registration scope from this same claim). Display-only. */
function decodeJwt(token){
  try { const p=token.access_token.split("."); if(p.length<2) return null;
    const b=p[1].replace(/-/g,"+").replace(/_/g,"/"); const pad=b+"=".repeat((4-b.length%4)%4);
    return JSON.parse(decodeURIComponent(escape(atob(pad)))); } catch(e){ return null; }
}
function resolveScopeId(){ const t=getToken(); if(!t) return null; const c=decodeJwt(t); return c ? (c.scope_id||c.scopeId||c.sub||null) : null; }

function signOut(){ clearToken(); beginLogin(); }
function signOutSilent(){ clearToken(); state.signedIn=false; state.llmSaveToken+=1; state.llmPending=null; stopStatusPolling(); render(); }

/* ===========================================================================
   API helpers (relative, scope-gated bearer)
   =========================================================================== */
async function apiGet(path,signal){
  const token = getToken(); if(!token) throw new Error("not-authenticated");
  const opts = { headers:{ Authorization:"Bearer " + token.access_token } };
  if(signal) opts.signal=signal;
  const res = await fetch(path, opts);
  if(signal && signal.aborted) throw new Error("aborted");
  if(res.status === 401){ signOutSilent(); throw new Error("unauthorized"); }
  if(res.status === 404) return null;
  if(!res.ok) throw new Error("api-error-" + res.status);
  const txt = await res.text(); if(!txt) return null;
  if(signal && signal.aborted) throw new Error("aborted");
  try { return JSON.parse(txt); } catch(e){ return null; }
}
async function apiSend(path, method, body){
  const token = getToken(); if(!token) throw new Error("not-authenticated");
  const opts = { method, headers:{ Authorization:"Bearer " + token.access_token } };
  if(body != null){ opts.headers["Content-Type"]="application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if(res.status === 401){ signOutSilent(); throw new Error("unauthorized"); }
  let data=null; const txt = await res.text();
  if(txt){ try { data = JSON.parse(txt); } catch(e){ data = { raw:txt }; } }
  return { ok: res.ok, status: res.status, data };
}

async function loadRegistrations(){

  try { state.registrations = (await apiGet("/api/channels/registrations"+q)) || []; }
  catch(e){

    if(state.scopeView==="all"){ state.scopeView="mine"; return loadRegistrations(); } // not admin → fall back
    state.registrations = [];
  }

  render();
  pollAllStatuses();
}
async function loadLlm(force){
  if(state.llm && !force) return state.llm;
  try {
    const loadedLlm=await readLlm();
    if(loadedLlm) state.llm=loadedLlm;
  }
  catch(e){ if(e.message!=="unauthorized") console.warn("channels: llm read failed", e); }
  return state.llm;
}
async function readLlm(signal){

async function fetchStatus(regId){
  try { return await apiGet("/api/channels/registrations/" + encodeURIComponent(regId) + "/status"); }

function pollAllStatuses(){
  (state.registrations||[]).forEach(r=>{
    fetchStatus(r.id).then(s=>{ if(s){ state.statuses[r.id]=s; render(); } });
  });
}
function normStatus(s){
  if(!s) return "loading";          // status not fetched yet (honest: querying)
  const v=(s.status||"").toLowerCase();
  if(v==="active") return "active";
  if(v==="foreign") return "foreign";   // bot owned by another account — not queryable here
  if(v==="pending_webhook"||v==="pending"||v==="") return "pending";
  if(v.includes("error")||v.includes("fail")) return "error";
  return "unknown";                 // fetched but status couldn't be determined
}
const BADGE_BY_STATUS = { active:["b-active","s-active"], pending:["b-pending","s-pending"], error:["b-error","s-error"], loading:["b-soon","s-running"], foreign:["b-soon","s-unknown"], unknown:["b-warn","s-warn"] };

function workflowDeliveryStatus(registration){
  if(!registration) return "repair_required";
  const live = state.statuses[registration.id];
  return (live && live.workflow_result_delivery_status) ||
    registration.workflow_result_delivery_status || "repair_required";
}
function workflowDeliveryView(registration){
  const status = workflowDeliveryStatus(registration);
  if(status==="repair_required" && (registration.platform||"").toLowerCase()!=="lark"){
    return { label:"工作流回传未启用", badge:"soon" };
  }
  return WORKFLOW_DELIVERY_STATUS[status] || WORKFLOW_DELIVERY_STATUS.repair_required;
}
function applyWorkflowDeliveryResult(registration, data, fallbackStatus){
  const status = (data && data.workflow_result_delivery_status) || fallbackStatus;
  registration.workflow_result_delivery_status = status;
  registration.workflow_result_delivery_failure_phase = data && data.failure_phase || null;
  registration.workflow_result_delivery_failure_reason = data && data.failure_reason || null;
  const live = state.statuses[registration.id];
  if(live){
    live.workflow_result_delivery_status = status;
    live.workflow_result_delivery_failure_phase = registration.workflow_result_delivery_failure_phase;
    live.workflow_result_delivery_failure_reason = registration.workflow_result_delivery_failure_reason;
  }
}
async function repairWorkflowReplies(registration){
  if(!registration || !registration.id || state.workflowRepairing[registration.id]) return;
  state.workflowRepairing[registration.id] = true;
  state.workflowRepairNotice = null;
  render();
  let result;
  try {
    result = await apiSend(
      "/api/channels/registrations/" + encodeURIComponent(registration.id) +
        "/workflow-result-delivery/repair",
      "POST",
      null);
  } catch(e) {
    state.workflowRepairing[registration.id] = false;
    if(e.message!=="unauthorized"){
      applyWorkflowDeliveryResult(registration, null, "repair_failed");
      state.workflowRepairNotice = { registrationId:registration.id, message:"工作流回传修复请求失败，请重试。" };
      render();
    }
    return;
  }

  state.workflowRepairing[registration.id] = false;
  const data = result.data || {};
  applyWorkflowDeliveryResult(
    registration,
    data,
    result.ok ? "enabled" : "repair_failed");
  if(result.ok && workflowDeliveryStatus(registration)==="enabled"){
    state.workflowRepairNotice = { registrationId:registration.id, message:"工作流回传已恢复，无需修改 Lark 后台配置。" };
  } else if(workflowDeliveryStatus(registration)==="repairing") {
    state.workflowRepairNotice = { registrationId:registration.id, message:"工作流回传修复正在完成。" };
  } else {
    state.workflowRepairNotice = { registrationId:registration.id, message:data.note || "工作流回传修复未完成，请重试。" };
  }
  render();
}

/* ---- register / delete / llm save ---- */
async function doRegister(){
  state.step=2; state.s="running"; state.err=null; state.errMsg=null; render();
  const c=state.cred;
  const body = curP().buildBody(c);
  let r;
  try { r = await apiSend("/api/channels/registrations", "POST", body); }
  catch(e){ if(e.message==="unauthorized") return; state.s="failed"; state.err="network"; state.errMsg=String(e.message||e); render(); return; }
  if(r.ok){
    const d = r.data || {};
    state.reg = {
      registrationId: d.registration_id || "",
      botId: d.nyx_channel_bot_id || "",
      apiKeyId: d.nyx_agent_api_key_id || "",
      routeId: d.nyx_conversation_route_id || "",
      webhookUrl: d.webhook_url || "",
      relayCallbackUrl: d.relay_callback_url || "",
      workflowDeliveryStatus: d.workflow_result_delivery_status || "repair_required",
      scope: state.scopeId || (r.data && r.data.scope_id) || "",
      verificationToken: (c.verification_token||"").trim(),
      encryptKey: (c.encrypt_key||"").trim(),
      label: (c.label||"").trim()
    };
    state.s="done"; render();
    loadRegistrations();
    return;
  }
  const errText = ((r.data && r.data.error) || "") + " " + ((r.data && r.data.note) || "");
  state.err = classifyRegError(r.status, errText);
  state.errMsg = (r.data && (r.data.error || r.data.note)) || ("HTTP " + r.status);
  state.s="failed"; render();
}
function classifyRegError(status, errText){
  const t=(errText||"").toLowerCase();
  if(status===401) return "auth";
  if(t.includes("nyx_status=409") || t.includes("already")) return "409";
  if(t.includes("nyx_status=401") || t.includes("nyx_status=400") || t.includes("secret") || t.includes("invalid")) return "cred";
  if(t.includes("nyx_base_url")) return "infra";
  return "other";
}
async function doDelete(regId){
  state.registrationActionError=null;
  let result;
  try { result=await apiSend("/api/channels/registrations/" + encodeURIComponent(regId), "DELETE", null); }
  catch(e){
    if(e.message==="unauthorized") return false;
    state.registrationActionError="删除失败，请重试。";
    render();
    return false;
  }
  if(!result.ok){
    state.registrationActionError=(result.data && (result.data.error||result.data.note)) || ("删除失败 · HTTP " + result.status);
    render();
    return false;
  }
  delete state.statuses[regId];
  await loadRegistrations();
  return true;
}
function freezeLlmPending(target){
  return Object.freeze({
    ...target,
    submittedDraft:Object.freeze({...target.submittedDraft}),
    expectedCommittedDraft:Object.freeze({...target.expectedCommittedDraft})
  });
}
function snapshotLlmSelectionOption(option){
  if(!option) return null;
  return Object.freeze({
    value:option.value,
    label:option.label,
    kind:option.kind,
    routeValue:option.routeValue,
    userServiceId:option.userServiceId,
    defaultModel:option.defaultModel
  });
}
function isCurrentLlmSave(target){
  return !!target && state.llmSaveToken===target.saveToken &&
    !!state.llmPending && state.llmPending.saveToken===target.saveToken;
}
function llmDraftStillMatches(target){
  return state.llmDraftRevision===target.submittedRevision &&
    state.llmSel.value===target.submittedDraft.value &&
    normalizeLlmModel(state.llmSel.model)===target.submittedDraft.model;
}
function completeLlmObservation(target){
  if(!isCurrentLlmSave(target)) return;
  const draftStillMatches=llmDraftStillMatches(target);
  state.llmPending=null;
  state.llmSaveState="observed";
  state.llmSaveError=null;
  state.llmSaved=draftStillMatches;
  if(draftStillMatches){
    state.llmSel={
      value:target.expectedCommittedDraft.value,
      model:target.expectedCommittedDraft.model
    };
    state.llmDraftOption=null;
  }
  render();
}
function startLlmObservation(target){
  return new Promise(resolve=>{
    let active=true;
    let attemptGeneration=0;
    let currentController=null;
    let foregroundSettled=false;
    let elapsedMilliseconds=0;
    const timers=[];
    const settleForeground=()=>{
      if(foregroundSettled) return;
      foregroundSettled=true;
      resolve();
    };
    const stopObservation=()=>{
      if(!active) return;
      active=false;
      attemptGeneration+=1;
      timers.forEach(timer=>clearTimeout(timer));
      if(currentController) currentController.abort();
      currentController=null;
      settleForeground();
    };
    const schedule=(callback,milliseconds)=>{
      const timer=setTimeout(callback,milliseconds);
      if(timer && typeof timer.unref==="function") timer.unref();
      timers.push(timer);
    };
    const launchRead=(attemptIndex)=>{
      if(!active) return;
      if(!isCurrentLlmSave(target)){
        stopObservation();
        return;
      }

      if(currentController) currentController.abort();
      currentController=null;
      attemptGeneration+=1;
      const generation=attemptGeneration;
      const controller=new AbortController();
      currentController=controller;
      const isAuthoritative=()=>active && generation===attemptGeneration &&
        !controller.signal.aborted && currentController===controller;
      const handleError=(error)=>{
        if(!isAuthoritative()) return;
        currentController=null;
        if(!isCurrentLlmSave(target)){
          stopObservation();
          return;
        }
        if(error.message!=="unauthorized") console.warn("channels: llm observation read failed", error);
        if(attemptIndex===0) settleForeground();
      };

      let pendingRead;
      try { pendingRead=readLlm(controller.signal); }
      catch(error){ handleError(error); return; }
      void pendingRead.then(observedLlm=>{
        if(!isAuthoritative()) return;
        currentController=null;
        if(!isCurrentLlmSave(target)){
          stopObservation();
          return;
        }
        if(observedLlm){
          state.llm=observedLlm;
          if(llmSelectionObserved(target,observedLlm)){
            completeLlmObservation(target);
            stopObservation();
            return;
          }
          render();
        }
        if(attemptIndex===0) settleForeground();
      },handleError);
    };

    USER_LLM_SAVE_OBSERVATION_DELAYS_MS.forEach((delayMilliseconds,attemptIndex)=>{
      elapsedMilliseconds+=delayMilliseconds;
      schedule(()=>launchRead(attemptIndex),elapsedMilliseconds);
    });
    schedule(()=>{
      const stillCurrent=isCurrentLlmSave(target);
      stopObservation();
      if(!stillCurrent) return;
      state.llmPending=freezeLlmPending({...state.llmPending,phase:"accepted_unobserved"});
      state.llmSaveState="accepted_unobserved";
      state.llmSaved=false;
      render();
    },elapsedMilliseconds+USER_LLM_SAVE_FINAL_ATTEMPT_SETTLE_MS);
  });
}
function retryLlmObservation(){
  const pending=state.llmPending;
  if(!pending || pending.phase!=="accepted_unobserved" || !isCurrentLlmSave(pending)) return;
  const acceptedTarget=freezeLlmPending({...pending,phase:"accepted"});
  state.llmPending=acceptedTarget;
  state.llmSaveState="accepted";
  state.llmSaved=false;
  render();
  void startLlmObservation(acceptedTarget);
}
function noteLlmDraftEdit(){
  state.llmDraftRevision+=1;
  state.llmSaveError=null;
  state.llmSaved=false;
  if(!state.llmPending) state.llmSaveState="idle";
}
function completeLlmWriteFailure(target,message){
  if(!isCurrentLlmSave(target)) return;
  const draftStillMatches=llmDraftStillMatches(target);
  state.llmPending=null;
  state.llmSaveState=draftStillMatches ? "failed" : "idle";
  state.llmSaveError=draftStillMatches ? message : null;
}
async function saveLlm(){
  const option=buildLlmSelectionOptions(state.llm).find(item=>item.value===state.llmSel.value);
  if(!option) return;
  const requestedModel=normalizeLlmModel(state.llmSel.model);
  const modelExpectation=expectedLlmModel(option,state.llmSel.model,state.llm);
  const saveToken=state.llmSaveToken+1;
  state.llmSaveToken=saveToken;
  const pending=freezeLlmPending({
    saveToken,
    submittedRevision:state.llmDraftRevision,
    submittedDraft:{ value:option.value, model:requestedModel },
    expectedCommittedDraft:{ value:option.value, model:modelExpectation.value },
    selectionLabel:option.label,
    phase:"saving",
    kind:option.kind,
    userServiceId:option.userServiceId,
    routeValue:option.routeValue,
    requestedModel,
    expectedModelKnown:modelExpectation.known
  });
  state.llmPending=pending;
  state.llmDraftOption=snapshotLlmSelectionOption(option);
  state.llmSel.model=requestedModel;
  state.llmSaveState="saving"; state.llmSaveError=null; state.llmSaved=false; render();
  try {
    const body=option.kind==="gateway"
      ? { routeValue:USER_LLM_GATEWAY_ROUTE, model:requestedModel }
      : { userServiceId:option.userServiceId, model:requestedModel };
    const result=await apiSend("/api/user-config/llm", "PUT", body);
    if(!isCurrentLlmSave(pending)) return;
    if(!result.ok || !result.data || result.data.accepted!==true){
      completeLlmWriteFailure(
        pending,
        (result.data && (result.data.error||result.data.note)) ||
          (result.ok ? "保存请求未被接受" : ("HTTP " + result.status))
      );
      return;
    }

    const acceptedTarget=freezeLlmPending({...pending,phase:"accepted"});
    state.llmPending=acceptedTarget;
    state.llmSaveState="accepted";
    await startLlmObservation(acceptedTarget);
  } catch(e){
    if(isCurrentLlmSave(pending) && e.message!=="unauthorized"){
      console.warn("channels: llm save failed", e);
      completeLlmWriteFailure(pending,String(e.message||e));
    }
  } finally { if(state.llmSaveToken===saveToken) render(); }
}

// Legacy fallback for non-secure contexts where navigator.clipboard is absent.
function execCommandCopy(value){
  const ta=document.createElement("textarea");
  ta.value=value; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; ta.style.pointerEvents="none";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,value.length);
  let ok=false; try{ ok=document.execCommand("copy"); }catch(_){ ok=false; }
  ta.remove(); return ok;
}
function bindCopy(btn,value){
  btn.addEventListener("click",()=>{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(value)
        .then(()=>flashCopyResult(btn,true))
        .catch(()=>flashCopyResult(btn,execCommandCopy(value)));
    } else {
      flashCopyResult(btn,execCommandCopy(value));
    }
  });
}

function captureCred(scope){
  const g=(n)=>{ const e=scope.querySelector("#f_"+n); return e?e.value:""; };
  curP().credFields.forEach(fd=>{ state.cred[fd.name]=g(fd.name); });
}
function field(fd,val){
  const f=el("div",{class:"field"});
  const type = fd.secret ? "password" : "text";
  f.innerHTML=`<label for="f_${fd.name}">${esc(fd.name)} ${fd.optional?'<span style="color:var(--muted-2);font-weight:500">· 可选</span>':'<span class="req">*</span>'}</label>

}

/* ---- Step 2 : 一键注册（facade）---- */
function renderStep2(){
  const wrap=el("section",{});
  const map={ idle:["pending","待注册"], running:["running","注册中"], done:["registered","已注册"], failed:["failed", state.err==="409"?"已被接入":state.err==="cred"?"凭据无效":"注册失败"] };

  wrap.insertAdjacentHTML("beforeend",`<p class="step-desc">注册走 aevatar <b style="color:var(--fg)">facade</b>：它会建好 NyxID channel-bot、relay api-key、入站路由，并写入 <code class="kbd">api_key_id → scope_id</code> mirror —— 这是入站消息路由的<b style="color:var(--fg)">唯一依据</b>，只有 facade 会写它，所以注册不能用 CLI/工具代替。</p>`);

  if(state.s==="idle"){
    wrap.appendChild(el("div",{class:"callout info"},`${ICON.info}<div class="body">点击注册后，facade 会自动完成 4 件事：建 channel-bot、建 relay key、写 mirror、建路由。约几秒。</div>`));
    wrap.appendChild(footer([ btn("一键注册","primary",ICON.bolt,doRegister), "spacer",
      btn("上一步","ghost",ICON.back,()=>{ goStep(1); }) ]));

    wrap.appendChild(regProgress(["run","run","run","run"]));
    wrap.appendChild(el("div",{class:"live-chip",style:"margin-top:8px"},`<span class="dot s-running"></span><span>正在调用 facade · POST /api/channels/registrations</span>`));
  } else if(state.s==="failed"){
    if(state.err==="409"){
      const P=curP();
      const msg = P.consoleStep
        ? `同一个 app_id 在 NyxID 全局只能有一个 active channel-bot。可以删旧重建 —— 但<b>重建会换一个新的 bot_id 和 webhook_url</b>，你需要回 ${esc(P.connect)} 后台把回调地址改成新的。`
        : `同一个 bot token 在 NyxID 全局只能有一个 active channel-bot。删旧重建即可 —— Telegram 无需任何后台改动，NyxID 会自动重新注册 webhook。`;
      wrap.appendChild(el("div",{class:"callout err"},`${ICON.warn}<div class="body"><span class="ct-title">该 ${esc(P.connect)} bot 已被接入（NyxID 409）</span>${msg}</div>`));
      wrap.appendChild(footer([ btn("删旧重建","danger",ICON.refresh,()=>{ deleteExistingThenRegister(); }),
        btn("取消","ghost",null,()=>{ goStep(1); }) ]));
    } else if(state.err==="cred"){
      const P=curP();
      const detail = P.consoleStep
        ? "facade 用 app_id / app_secret 向 Lark 换 token 失败（多半是 app_secret 错误）。"
        : "facade 用 bot token 向 Telegram 校验失败（多半是 bot token 错误或已失效）。";
      wrap.appendChild(el("div",{class:"callout err"},`${ICON.warn}<div class="body"><span class="ct-title">凭据无效</span>${detail}<div class="errnote mono">${esc(state.errMsg||"")}</div>回上一步修改后重试。</div>`));
      wrap.appendChild(footer([ btn("返回修改凭据","primary",ICON.back,()=>{ goStep(1); }) ]));
    } else if(state.err==="auth"){
      wrap.appendChild(el("div",{class:"callout err"},`${ICON.warn}<div class="body"><span class="ct-title">登录已失效</span>请重新登录后再注册。</div>`));
      wrap.appendChild(footer([ btn("重新登录","primary",null,()=>signOut()) ]));
    } else {
      wrap.appendChild(el("div",{class:"callout err"},`${ICON.warn}<div class="body"><span class="ct-title">注册失败</span><div class="errnote mono">${esc(state.errMsg||"未知错误")}</div></div>`));
      wrap.appendChild(footer([ btn("重试","primary",ICON.refresh,doRegister), "spacer", btn("上一步","ghost",ICON.back,()=>{ goStep(1); }) ]));
    }
  } else { // done
    const P=curP();
    const workflowReady = state.reg && state.reg.workflowDeliveryStatus === "enabled";
    wrap.appendChild(regProgress(["done","done","done","done"]));
    const rc=el("div",{class:"result-card"});
    rc.innerHTML=`<div class="rc-h">${ICON.check} ${workflowReady?"注册完成":"入站接入完成 · 工作流回传待修复"} · mirror 已写入</div>`;
    rc.appendChild(copyRow("bot_id", state.reg.botId));
    if(P.consoleStep) rc.appendChild(copyRow("webhook_url（回调地址）", state.reg.webhookUrl));
    if(state.reg.scope) rc.appendChild(copyRow("scope", state.reg.scope));
    wrap.appendChild(rc);
    if(!workflowReady){
      const capabilityCopy = P.id==="lark"
        ? `完成接入后可在管理页选择 <b>Repair workflow replies</b>；修复会保留当前 bot 和 webhook。`
        : `当前渠道尚未提供工作流结果回传修复操作。`;
      wrap.appendChild(el("div",{class:"callout warn"},`${ICON.warn}<div class="body"><span class="ct-title">部分配置已完成</span>bot 已具备消息入站能力，但工作流结束后的结果回传尚未启用。${capabilityCopy}</div>`));
    }
    if(P.consoleStep){
      wrap.appendChild(el("div",{class:"callout info"},`${ICON.info}<div class="body">下一步要把上面的 <b>webhook_url</b> 和 Verification Token 填到 Lark 后台 —— 这一步只能你手动做。</div>`));
    } else {
      wrap.appendChild(el("div",{class:"callout info"},`${ICON.info}<div class="body"><span class="ct-title">已自动接入 · 无需手动配置</span>NyxID 已用你的 bot token 向 Telegram 注册好 webhook 和 secret_token。<b>不要</b>自己再调 setWebhook，否则会覆盖 NyxID 的 secret_token、弄坏入站校验。直接进入下一步配回复模型即可。</div>`));
    }
    wrap.appendChild(footer([ btn(P.step2Next,"primary",ICON.arrow,()=>{ goStep(3); }) ]));
  }
  return wrap;
}
function regProgress(states){
  const labels=["创建 NyxID channel-bot","创建 relay api-key","写入 api_key_id → scope_id mirror","建立入站路由"];
  const box=el("div",{class:"reg-steps"});
  labels.forEach((l,i)=>{
    const stt=states[i]||"pending";
    const ic = stt==="done"?ICON.check : stt==="run"?'<span class="spin"></span>' : '<span class="dot s-pending" style="width:8px;height:8px"></span>';
    box.appendChild(el("div",{class:`reg-line ${stt}`},`<span class="ic">${ic}</span><span>${l}</span>`));
  });
  return box;
}
/* delete-then-recreate for the 409 path: find the existing registration for the
   active platform, delete it, then re-register with the captured credentials. */
async function deleteExistingThenRegister(){
  state.s="running"; state.err=null; render();
  try {
    const list = (await apiGet("/api/channels/registrations")) || [];
    const existing = list.filter(r => (r.platform||"").toLowerCase()===state.platform);
    for(const r of existing){
      if(!await doDelete(r.id)){
        state.s="failed"; state.err="other"; state.errMsg=state.registrationActionError||"删除旧接入失败"; render(); return;
      }
    }
  } catch(e){ if(e.message==="unauthorized") return; }
  doRegister();
}

/* ---- Step 4 : 配回复模型（owner LLM）---- */
function renderStep4(){
  const wrap=el("section",{});
  const llm = state.llm;
  const unset = !savedLlmSelectionValue(llm) || !!(llm && llm.routeFallbackActive);
  const saveState=state.llmSaveState||"idle";
  const saveBadgeLabel=state.llmSaved
    ? "已保存"
    : saveState==="accepted" || saveState==="accepted_unobserved"
      ? "待确认"
      : saveState==="failed"
        ? "保存失败"
        : unset
          ? "未设置"
          : "已设置";
  wrap.innerHTML=stepHead("STEP 4 / 5 · reply model", "配回复模型（owner LLM）", badge(state.llmSaved?"registered":"pending", saveBadgeLabel));
  wrap.insertAdjacentHTML("beforeend",`<p class="step-desc">bot 收到消息后，要用<b style="color:var(--fg)">一个 LLM</b> 生成回复 —— 用的是<b style="color:var(--fg)">你账户（bot owner）的回复模型配置</b>。没有模型，bot 收得到消息但回不了话。</p>`);

  if(saveState==="failed"){
    wrap.appendChild(el("div",{class:"callout err"},`${ICON.warn}<div class="body"><span class="ct-title">保存失败</span>回复模型没有保存，请检查选择后重试。${state.llmSaveError?`<div class="errnote mono">${esc(state.llmSaveError)}</div>`:""}</div>`));
  } else if(saveState==="accepted" || saveState==="accepted_unobserved"){
    const pendingLabel=state.llmPending ? state.llmPending.selectionLabel : "所选服务";
    const pendingCopy=saveState==="accepted_unobserved"
      ? `服务端暂未确认 ${esc(pendingLabel)} 的精确服务和模型，保存请求仍然有效。`
      : `正在等待服务端确认 ${esc(pendingLabel)} 的精确服务和模型。`;
    wrap.appendChild(el("div",{class:"callout warn"},`${ICON.warn}<div class="body"><span class="ct-title">保存请求已接受</span>${pendingCopy}</div>`));
  }

  if(!llm){
    wrap.appendChild(el("div",{class:"live-chip"},`<span class="dot s-running"></span><span>正在读取你的回复模型配置…</span>`));
    wrap.appendChild(footer([ btn("上一步","ghost",ICON.back,()=>{ goStep(3); }) ]));
    return wrap;
  }

  if(unset){
    wrap.appendChild(el("div",{class:"callout warn"},`${ICON.warn}<div class="body"><span class="ct-title">你还没有设置回复模型</span>bot 现在会用平台<b>默认模型</b> <code class="kbd">${esc(DEFAULT_LLM.route)} / ${esc(DEFAULT_LLM.model)}</code> 回复。可以保持默认，也可以在下面选你偏好的模型。${llm.fallbackReason?`<div class="errnote mono">${esc(llm.fallbackReason)}</div>`:""}</div>`));
  } else {
    wrap.appendChild(el("div",{class:"callout info"},`${ICON.info}<div class="body"><span class="ct-title">当前回复模型</span><span class="mono">${esc(llm.effectiveRoute||llm.savedRoute||"")}</span>${llm.effectiveRouteLabel?` · ${esc(llm.effectiveRouteLabel)}`:""}。下面可以修改。</div>`));
  }

  // Exact service identity drives persistence; route only scopes model choices.
  const liveSelectionOpts = buildLlmSelectionOptions(llm);
  const selectionOpts = liveSelectionOpts.slice();
  const addRetainedOption=(value,label,kind,routeValue,userServiceId,defaultModel)=>{
    if(!value || selectionOpts.some(option=>option.value===value)) return;
    selectionOpts.push({
      value,
      label:`${label||userServiceId||"LLM 服务"}（暂不可用）`,
      kind,
      routeValue,
      userServiceId,
      defaultModel:normalizeOptionalLlmModel(defaultModel),
      ready:false,
      allowed:false,
      disabled:true
    });
  };
  if(state.llmDraftOption && state.llmDraftOption.value===state.llmSel.value){
    addRetainedOption(
      state.llmDraftOption.value,
      state.llmDraftOption.label,
      state.llmDraftOption.kind,
      state.llmDraftOption.routeValue,
      state.llmDraftOption.userServiceId,
      state.llmDraftOption.defaultModel
    );
  }
  if(state.llmPending){
    addRetainedOption(
      state.llmPending.submittedDraft.value,
      state.llmPending.selectionLabel,
      state.llmPending.kind,
      state.llmPending.routeValue,
      state.llmPending.userServiceId,
      state.llmPending.expectedCommittedDraft.model
    );
  }
  const committedSelectionValue=savedLlmSelectionValue(llm);
  if(committedSelectionValue){
    const committedKind=llm.savedRouteKind;
    addRetainedOption(
      committedSelectionValue,
      llm.savedRouteLabel,
      committedKind,
      String(llm.savedRoute||"").trim(),
      committedKind==="nyx_id_user_service" ? String(llm.savedUserServiceId||"").trim() : null,
      llm.defaultModel
    );
  }
  const initializingSavedDraft=state.llmSel.value==null;
  if(initializingSavedDraft){
    state.llmSel.value = savedLlmSelectionValue(llm);
    if(state.llmSel.model==null) state.llmSel.model=normalizeLlmModel(llm.defaultModel);
  }
  const selectedOption = selectionOpts.find(option=>option.value===state.llmSel.value);
  const liveSelectedOption = liveSelectionOpts.find(option=>option.value===state.llmSel.value);
  const curRoute = selectedOption ? selectedOption.routeValue : String(llm.effectiveRoute||"").trim();
  const modelsForRoute = (llm.modelGroupsByRoute||[]).filter(g=>g.routeValue===curRoute).flatMap(g=>g.models||[]);
  // No fabricated model names: only offer what NyxID actually lists for this route.
  // When the live catalog has a defaultModel it is a real option; otherwise the only honest
  // choice is the platform default (empty value -> server resolves it on save).
  const liveModels = modelsForRoute.length
    ? modelsForRoute.slice()
    : (selectedOption && selectedOption.defaultModel ? [selectedOption.defaultModel] : []);
  if(state.llmSel.model==null) state.llmSel.model = liveModels[0] || "";

  const grid=el("div",{class:"select-grid"});
  const selectionChoices = (state.llmSel.value==null ? [{value:"",label:"请选择 LLM 服务",disabled:true}] : []).concat(selectionOpts);
  const serviceSel=selField("LLM 服务", selectionChoices, state.llmSel.value||"");
  serviceSel.querySelector("select").addEventListener("change",(e)=>{ state.llmSel.value=e.target.value; state.llmSel.model=null; state.llmDraftOption=snapshotLlmSelectionOption(selectionOpts.find(option=>option.value===e.target.value)); noteLlmDraftEdit(); render(); });
  grid.appendChild(serviceSel);
  // Always offer the genuine "(平台默认)" sentinel; append real models when the catalog has them.
  const currentModel=normalizeLlmModel(state.llmSel.model);
  const currentModelChoice=currentModel && !liveModels.includes(currentModel)
    ? [{value:currentModel,label:currentModel}]
    : [];
  const modelChoices = [{value:"",label:"（平台默认）"}].concat(currentModelChoice,liveModels.map(m=>({value:m,label:m})));
  const modelSel=selField("模型 model", modelChoices, state.llmSel.model);
  modelSel.querySelector("select").addEventListener("change",(e)=>{ state.llmSel.model=e.target.value; noteLlmDraftEdit(); render(); });
  grid.appendChild(modelSel);
  wrap.appendChild(grid);

  const saveLabel=saveState==="saving"
    ? "保存中…"
    : state.llmSaved
      ? "已保存 ✓"
      : saveState==="accepted_unobserved" && state.llmPending && llmDraftStillMatches(state.llmPending)
        ? "重新检查"
      : saveState==="accepted"
        ? "重新确认保存"
        : saveState==="failed"
          ? "重试保存"
          : "保存回复模型";
  const retryingObservation=saveLabel==="重新检查";
  const saveBtn = btn(saveLabel,"ghost",ICON.gear, retryingObservation?()=>retryLlmObservation():()=>saveLlm(), {disabled:saveState==="saving"||(!retryingObservation&&!liveSelectedOption)});
  const nextBtn = btn("下一步：验证","primary",ICON.arrow,()=>{ goStep(5); });
  wrap.appendChild(footer([ saveBtn, nextBtn, "spacer", btn("上一步","ghost",ICON.back,()=>{ goStep(3); }) ]));
  return wrap;
}
function selField(label,opts,sel){
  const f=el("div",{class:"field",style:"margin-bottom:0"});
  f.innerHTML=`<label>${esc(label)}</label><div class="sel"><select aria-label="${esc(label)}">${opts.map(o=>`<option value="${esc(o.value)}" ${o.value===sel?"selected":""} ${o.disabled?"disabled":""}>${esc(o.label)}</option>`).join("")}</select><span class="chev">${ICON.chev}</span></div>`;
  return f;
}

/* ---- Step 5 : 验证（实时状态轮询）---- */
function renderStep5(){
  const wrap=el("section",{});
  const reg = state.reg || {};
  const st = normStatus(state.statuses[reg.registrationId]);
  const active = st==="active";
  const received = active || (state.statuses[reg.registrationId] && state.statuses[reg.registrationId].last_event_at);
  const bs = active?["registered","已激活"] : ["running","等待消息"];
  const P=curP();
  wrap.innerHTML=stepHead("STEP 5 / 5 · verify","验证：发一条消息试试", badge(bs[0],bs[1]));
  wrap.insertAdjacentHTML("beforeend",`<p class="step-desc">去 ${esc(P.connect)} 里给 bot 发一条消息（私聊直接发，或群里 <b>@它</b>）。<b style="color:var(--fg)">第一条验证过的入站消息会把 bot 翻为「已激活」</b> —— 激活和验证是同一件事。下面会实时轮询 bot 状态。</p>`);

  const lightDefs=[
    ["收到首条入站消息",`NyxID 记录到来自 ${P.connect} 的事件`, received],
    ["bot 已激活","状态从 pending_webhook 翻为 active", active]
  ];
  const lights=el("div",{class:"lights",role:"status","aria-live":"polite"});
  lightDefs.forEach(d=>{
    const ok=!!d[2];
    const ic = ok?ICON.check : '<span class="spin"></span>';
    const stat = ok?"通过":"等待中";
    lights.appendChild(el("div",{class:`light ${ok?"ok":"pending"}`},`<span class="lic">${ic}</span><div><div class="lt">${d[0]}</div><div class="ls">${d[1]}</div></div><span class="lstat">${stat}</span>`));
  });
  wrap.appendChild(lights);

  if(active){
    wrap.appendChild(el("div",{class:"callout info"},`${ICON.check.replace('width="13" height="13"','width="16" height="16"')}<div class="body"><span class="ct-title">bot 已激活 🎉</span>已经能在 ${esc(P.connect)} 里收消息了。如果<b>收到消息却不回复</b>，多半是回复模型没配好 —— 回第 4 步检查（默认用 ${esc(DEFAULT_LLM.route)} / ${esc(DEFAULT_LLM.model)}）。</div>`));
    wrap.appendChild(footer([ btn("完成 · 去管理","primary",ICON.arrow,()=>{ stopStatusPolling(); state.view="manage"; state.manageReg=findReg(reg.registrationId); render(); }) ]));
  } else {
    wrap.appendChild(el("div",{class:"live-chip"},`<span class="dot s-running"></span><span>等待你的消息 · 每 3.5s 轮询 bot 状态…</span>`));
    wrap.appendChild(footer([
      btn("立即刷新状态","ghost",ICON.refresh,()=>{ if(reg.registrationId) fetchStatus(reg.registrationId).then(s=>{ if(s){ state.statuses[reg.registrationId]=s; render(); } }); }),
      "spacer",
      btn("上一步","ghost",ICON.back,()=>{ goStep(4); })
    ]));
  }
  return wrap;
}
function findReg(regId){ return (state.registrations||[]).find(r=>r.id===regId) || null; }

async function replaceRegistration(registration){
  if(!registration || !registration.id) return;
  const platform=(registration.platform||"lark").toLowerCase();
  const manual=hasConsole(platform)
    ? "替换会生成新的 bot_id 和 Request URL，你必须随后更新 Lark Event Subscriptions。"
    : "替换会删除当前 bot 和路由，再创建一个新的接入。";
  if(!confirm("替换该接入？\n\n"+manual)) return;
  if(!await doDelete(registration.id)) return;
  enterWizard((registration.platform||"lark").toLowerCase());
}

/* ===========================================================================
   Manage
   =========================================================================== */
function renderManage(){
  const p=el("main",{class:"page"});
  const r = state.manageReg || {};
  const st = normStatus(state.statuses[r.id]);
  const repairInFlight = !!state.workflowRepairing[r.id];
  const committedDeliveryStatus = workflowDeliveryStatus(r);
  const deliveryStatus = repairInFlight ? "repairing" : committedDeliveryStatus;
  const delivery = repairInFlight
    ? WORKFLOW_DELIVERY_STATUS.repairing
    : workflowDeliveryView(r);
  const liveStatus = state.statuses[r.id] || {};
  const failurePhase = liveStatus.workflow_result_delivery_failure_phase || r.workflow_result_delivery_failure_phase || "";
  const failureReason = liveStatus.workflow_result_delivery_failure_reason || r.workflow_result_delivery_failure_reason || "";
  const crumb=el("nav",{class:"crumb"});
  const back=el("button",{},`${ICON.back}<span>渠道目录</span>`); back.addEventListener("click",()=>{ state.view="catalog"; render(); });
  crumb.appendChild(back); crumb.insertAdjacentHTML("beforeend",`<span class="sep">/</span><span>${esc(connectName(r.platform))} · 管理</span>`);
  p.appendChild(crumb);

  const badgeCls = st==="active"?"active":st==="error"?"error":st==="pending"?"pending":"soon";
  const card=el("div",{class:"status-card"});
  card.innerHTML=`
    <div class="sc-top">
      <div class="sc-logo" style="background:linear-gradient(150deg,var(--accent),color-mix(in oklab,var(--accent) 55%,#7c4dff))">${chLogo(r.platform||"lark")}</div>
      <div style="flex:1;min-width:0"><div class="sc-name">${esc(r.platform||"lark")} · ${esc(r.nyx_channel_bot_id||r.id||"")}</div><div class="sc-sub">registration ${esc(r.id||"")}</div></div>
      ${badge(badgeCls, STATUS_LABEL[st]||st)}
    </div>`;
  const rows=[
    ["渠道", r.platform||"lark","plain"],
    ["消息入站", STATUS_LABEL[st]||st,"plain"],
    ["工作流回传", delivery.label,"plain"],
    ["bot_id", r.nyx_channel_bot_id||""],
    ["scope", r.scope_id||""],
    ["provider", r.nyx_provider_slug||""],
    ["api_key_id", r.nyx_agent_api_key_id||""]
  ];
  rows.forEach(([k,v,pl])=> card.appendChild(el("div",{class:"kv"},`<span class="k">${esc(k)}</span><span class="v ${pl||""}">${esc(v||"—")}</span>`)) );
  p.appendChild(card);

  const ownedLark = r.owned === true && (r.platform||"").toLowerCase()==="lark";
  if(ownedLark && st==="pending"){
    const recovery=el("section",{class:"status-card",style:"margin-top:16px"});
    recovery.appendChild(el("div",{class:"sec-title",style:"margin:0 0 10px"},"Lark pending_webhook 恢复清单"));
    recovery.appendChild(copyRow("Event Subscriptions Request URL", r.webhook_url||""));
    recovery.appendChild(el("div",{class:"callout warn",style:"margin-top:12px"},`${ICON.warn}<div class="body"><ol style="margin:0;padding-left:20px"><li>把上面的精确 Request URL 粘贴到 Lark <b>Event Subscriptions</b>。</li><li>确认 Lark 中的 Verification Token，以及启用加密时的 Encrypt Key，与本次注册输入完全一致；Aevatar 不保存或回显这些秘密。</li><li>在权限管理中导入页面提供的权限 JSON。</li><li>订阅事件 <code class="kbd">im.message.receive_v1</code>。</li><li>创建、发布并由管理员批准应用版本。</li><li>给 bot 发送一条测试消息，刷新状态直到 <code class="kbd">active</code>。</li></ol><div style="margin-top:10px"><b>只有收到验证通过的入站消息并变为 active 才算完成</b>；Aevatar 无法代替你修改 Lark 后台。</div></div>`));
    const actions=el("div",{style:"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px"});
    const copyPermissions=el("button",{class:"copybtn"},`${ICON.copy}<span>复制权限 JSON</span>`);
    bindCopy(copyPermissions,LARK_SCOPE_IMPORT_JSON);
    actions.appendChild(copyPermissions);
    actions.appendChild(el("a",{class:"copybtn",href:"https://open.larksuite.com/app",target:"_blank",rel:"noopener"},`${ICON.ext}<span>打开 Lark 开发者后台</span>`));
    recovery.appendChild(actions);
    p.appendChild(recovery);
  }

  if(st!=="active"){
    const pf=(r.platform||"lark").toLowerCase();
    const cn=esc(connectName(pf));
    const warnBody = hasConsole(pf)
      ? `还没收到验证过的入站消息。去 ${cn} 给 bot 发条消息；如果一直 pending，多半是 ${cn} 后台的<b>权限/事件没发布</b>（回向导第 3 步核对 Tier-1 scope 并发布版本）。`
      : `还没收到入站消息。去 ${cn} 私聊 bot 发条消息试试 —— NyxID 已自动配置好 webhook，通常一发就会激活。`;
    p.appendChild(el("div",{class:"callout warn",style:"margin-top:16px"},`${ICON.warn}<div class="body"><span class="ct-title">bot 还没激活</span>${warnBody}</div>`));
  }

  if(ownedLark && (deliveryStatus==="repair_required" || deliveryStatus==="repair_failed")){
    const failedDetail = deliveryStatus==="repair_failed" && (failurePhase || failureReason)
      ? `<div class="repair-detail">${esc(failurePhase||"unspecified")} · ${esc(failureReason||"unspecified")}</div>`
      : "";
    p.appendChild(el("div",{class:`callout ${deliveryStatus==="repair_failed"?"err":"warn"}`,style:"margin-top:16px"},`${ICON.warn}<div class="body"><span class="ct-title">工作流结果回传${deliveryStatus==="repair_failed"?"修复未完成":"尚未启用"}</span>消息入站状态与工作流回传能力相互独立；当前 bot 仍可接收消息。使用下方修复操作会保留现有 bot、webhook 和 Lark 后台配置。${failedDetail}</div>`));
  } else if(ownedLark && deliveryStatus==="repairing") {
    p.appendChild(el("div",{class:"callout info",style:"margin-top:16px",role:"status","aria-live":"polite"},`${ICON.refresh}<div class="body"><span class="ct-title">工作流回传修复中</span>正在轮换内部回传凭据并更新现有路由。</div>`));
  }

  if(state.workflowRepairNotice && state.workflowRepairNotice.registrationId===r.id){
    const noticeKind = deliveryStatus==="enabled" ? "info" : "warn";
    p.appendChild(el("div",{class:`callout ${noticeKind}`,style:"margin-top:16px",role:"status","aria-live":"polite"},`${deliveryStatus==="enabled"?ICON.check:ICON.info}<div class="body">${esc(state.workflowRepairNotice.message)}</div>`));
  }

  if(state.registrationActionError){
    p.appendChild(el("div",{class:"callout err",style:"margin-top:16px",role:"alert"},`${ICON.warn}<div class="body"><span class="ct-title">操作未完成</span>${esc(state.registrationActionError)}</div>`));
  }

  const foot=el("div",{class:"step-foot",style:"border-top:0;margin-top:18px;padding-top:0"});
  if(ownedLark && (committedDeliveryStatus==="repair_required" || committedDeliveryStatus==="repair_failed")){
    foot.appendChild(btn(
      "Repair workflow replies",
      "primary",
      repairInFlight ? '<span class="spin"></span>' : ICON.refresh,
      ()=>repairWorkflowReplies(r),
      {disabled:repairInFlight}));
  }
  foot.appendChild(btn("刷新状态","ghost",ICON.refresh,()=>{ if(r.id) fetchStatus(r.id).then(s=>{ if(s){ state.statuses[r.id]=s; render(); } }); }));
  foot.appendChild(btn("替换接入","ghost",ICON.gear,()=>replaceRegistration(r)));
  foot.appendChild(btn("删除接入","danger",ICON.trash,async()=>{ const recover = hasConsole((r.platform||"lark").toLowerCase()) ? "如需恢复要重新注册并回后台改回调。" : "如需恢复重新注册即可（Telegram 无需后台改动）。"; if(confirm("删除该接入？\n\n这会删除 registration 和 mirror，bot 将不再路由。"+recover) && await doDelete(r.id)){ state.view="catalog"; state.manageReg=null; render(); } }));
  p.appendChild(foot);
  return p;
}

/* ===========================================================================
   Compose / render
   =========================================================================== */
function enterWizard(platformId){ state.llmSaveToken+=1; state.llmDraftRevision+=1; state.platform=(platformId&&PLATFORMS[platformId])?platformId:"lark"; state.view="wizard"; state.step=1; state.s="idle"; state.err=null; state.reg=null; state.manageReg=null; state.registrationActionError=null; state.llmSel={ value:null, model:null }; state.llmDraftOption=null; state.llmPending=null; state.llmSaveState="idle"; state.llmSaveError=null; state.llmSaved=false; state.cred={ app_id:"", app_secret:"", verification_token:"", encrypt_key:"", bot_token:"", label:"" }; render(); }
function render(){
  const app=$("#app"); app.innerHTML="";
  app.appendChild(renderTopbar());
  if(!state.signedIn){ app.appendChild(renderLogin()); return; }
  if(state.view==="catalog") app.appendChild(renderCatalog());
  else if(state.view==="wizard") app.appendChild(renderWizard());
  else app.appendChild(renderManage());
}

/* init */
(async function init(){
  applyTheme();
  try { await completeLoginIfCallback(); }
  catch(e){ console.warn("channels: login callback failed", e); }
  if(!getToken()){ state.signedIn=false; render(); return; }
  state.signedIn=true;
  state.scopeId = resolveScopeId();
  render();
  await loadMe();          // platform-admin flag + authoritative scope (drives the all-accounts toggle)
  loadRegistrations();
  loadLlm();
  (async()=>{ const acct=toAccount(await fetchUserInfo()); if(acct){ state.account=acct; render(); } })();
})();
if(window.matchMedia){ window.matchMedia("(prefers-color-scheme: light)").addEventListener?.("change",()=>{ if(!curTheme())render(); }); }

</script>
