syntax = "proto3";
package aevatar.gagents.registry;
option csharp_namespace = "Aevatar.GAgents.Registry";

import "google/protobuf/timestamp.proto";
import "gagent_registry_lifecycle.proto";

// ─── State ───

message GAgentRegistryEntry {
  reserved "gagent_type";
  string agent_kind = 1;
  repeated string actor_ids = 2;
}

message GAgentRegistryState {
  repeated GAgentRegistryEntry groups = 1;
  map<string, GAgentRegistryUnregistrationOperation> unregistration_operations = 2;
  repeated string unregistration_operation_order = 3;
}

message GAgentRegistryUnregistrationOperation {
  string operation_id = 1;
  string registry_actor_id = 2;
  string scope_id = 3;
  string agent_kind = 4;
  string actor_id = 5;
  string completion_actor_id = 6;
  aevatar.gagent_service.scope_gagents.GAgentRegistryUnregistrationOutcome outcome = 7;
  google.protobuf.Timestamp completed_at = 8;
  google.protobuf.Timestamp completion_dispatch_accepted_at = 9;
}

// ─── Events ───

message ActorRegisteredEvent {
  reserved "gagent_type";
  string agent_kind = 1;
  string actor_id = 2;
  repeated string removed_legacy_keys = 3;
}

message ActorUnregisteredEvent {
  reserved "gagent_type";
  string agent_kind = 1;
  string actor_id = 2;
}

message ActorRegistrationKeyCanonicalizedEvent {
  string previous_registry_key = 1;
  string agent_kind = 2;
  string actor_id = 3;
}

message GAgentRegistryUnregistrationCommittedEvent {
  string operation_id = 1;
  string registry_actor_id = 2;
  string scope_id = 3;
  string agent_kind = 4;
  string actor_id = 5;
  string completion_actor_id = 6;
  aevatar.gagent_service.scope_gagents.GAgentRegistryUnregistrationOutcome outcome = 7;
  google.protobuf.Timestamp completed_at = 8;
}

message GAgentRegistryUnregistrationCompletionDispatchAcceptedEvent {
  string operation_id = 1;
  google.protobuf.Timestamp accepted_at = 2;
}

// ─── Admission ───

enum GAgentRegistryOperation {
  UNKNOWN = 0;
  USE = 1;
  DELETE = 2;
  CHAT = 3;
  STREAM = 4;
  APPROVE = 5;
  JOIN = 6;
  LIST_PARTICIPANTS = 7;
  DRAFT_RUN_REUSE = 8;
  CONTROL = 9;
}

message ScopeResourceAdmissionRequested {
  reserved "gagent_type";
  string agent_kind = 1;
  string actor_id = 2;
  GAgentRegistryOperation operation = 3;
  string scope_id = 4;
}
