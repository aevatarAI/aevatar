syntax = "proto3";

package aevatar.gagents.scheduled;

option csharp_namespace = "Aevatar.GAgents.Scheduled";

import "google/protobuf/timestamp.proto";
import "agent_messages.proto";
import "delivery_ledger.proto";

// ─── Skill Runner (persistent scheduled agent) ───

enum SkillRunnerSkillSource {
  SKILL_RUNNER_SKILL_SOURCE_UNSPECIFIED = 0;
  SKILL_RUNNER_SKILL_SOURCE_ORNN = 1;
}

enum SkillRunnerExecutionKind {
  SKILL_RUNNER_EXECUTION_KIND_UNSPECIFIED = 0;
  SKILL_RUNNER_EXECUTION_KIND_PROMPT = 1;
  SKILL_RUNNER_EXECUTION_KIND_WORKFLOW = 2;
}

enum SkillRunnerOutputFormat {
  SKILL_RUNNER_OUTPUT_FORMAT_AUTO = 0;
  SKILL_RUNNER_OUTPUT_FORMAT_TEXT = 1;
  SKILL_RUNNER_OUTPUT_FORMAT_FEISHU_DOC = 2;
}

enum SkillRunnerScheduleMode {
  SKILL_RUNNER_SCHEDULE_MODE_UNSPECIFIED = 0;
  SKILL_RUNNER_SCHEDULE_MODE_CRON = 1;
  SKILL_RUNNER_SCHEDULE_MODE_ONE_SHOT = 2;
}

enum SkillRunnerExecutionErrorCode {
  SKILL_RUNNER_EXECUTION_ERROR_CODE_UNSPECIFIED = 0;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_SKILL_REFERENCE_REQUIRED = 1;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_INLINE_FALLBACK_DISABLED = 2;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_SKILL_FETCHER_UNAVAILABLE = 3;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_SKILL_NOT_FOUND = 4;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_SKILL_VERSION_UNSUPPORTED = 5;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_WORKFLOW_SELECTION_REQUIRED = 6;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_WORKFLOW_NOT_FOUND = 7;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_WORKFLOW_DISPATCH_UNAVAILABLE = 8;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_WORKFLOW_DISPATCH_REJECTED = 9;
  SKILL_RUNNER_EXECUTION_ERROR_CODE_SKILL_ACCESS_DENIED = 10;
}

enum ExternalTriggerSourceKind {
  EXTERNAL_TRIGGER_SOURCE_KIND_UNSPECIFIED = 0;
  EXTERNAL_TRIGGER_SOURCE_KIND_WEBHOOK = 1;
  EXTERNAL_TRIGGER_SOURCE_KIND_CHANNEL_INBOUND = 2;
}

enum SkillRunnerExternalTriggerDeliveryStatus {
  reserved 3;
  reserved "SKILL_RUNNER_EXTERNAL_TRIGGER_DELIVERY_STATUS_RUNNING";

  SKILL_RUNNER_EXTERNAL_TRIGGER_DELIVERY_STATUS_UNSPECIFIED = 0;
  SKILL_RUNNER_EXTERNAL_TRIGGER_DELIVERY_STATUS_ADMITTED = 1;
  SKILL_RUNNER_EXTERNAL_TRIGGER_DELIVERY_STATUS_DISPATCH_REQUESTED = 2;
  SKILL_RUNNER_EXTERNAL_TRIGGER_DELIVERY_STATUS_COMPLETED = 4;
  SKILL_RUNNER_EXTERNAL_TRIGGER_DELIVERY_STATUS_FAILED = 5;
  SKILL_RUNNER_EXTERNAL_TRIGGER_DELIVERY_STATUS_REJECTED = 6;
  SKILL_RUNNER_EXTERNAL_TRIGGER_DELIVERY_STATUS_DUPLICATE_IGNORED = 7;
}

message SkillRunnerSkillReference {
  string name = 1;
  string version = 2;
  SkillRunnerSkillSource source = 3;
  string workflow_id = 4;
  bool allow_inline_fallback = 5;
}

message ExternalTriggerSource {
  string source_id = 1;
  ExternalTriggerSourceKind kind = 2;
  bool enabled = 3;
  string display_name = 4;
}

message SkillRunnerExternalTriggerIdentity {
  string source_id = 1;
  string delivery_id = 2;
  string admission_id = 3;
  ExternalTriggerSourceKind kind = 4;
  google.protobuf.Timestamp received_at = 5;
  string payload_summary = 6;
  string payload_ref = 7;
}

message SkillRunnerExternalTriggerDeliveryRecord {
  SkillRunnerExternalTriggerIdentity identity = 1;
  SkillRunnerExternalTriggerDeliveryStatus status = 2;
  google.protobuf.Timestamp admitted_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  string reason = 5;
  int32 dispatch_attempt = 6;
}

message SkillRunnerCronOccurrenceTerminalRecord {
  string cron_occurrence_key = 1;
  google.protobuf.Timestamp terminal_at = 2;
}

message SkillRunnerOutboundConfig {
  string conversation_id = 1;
  string nyx_provider_slug = 2;
  string nyx_api_key = 3;
  // Deprecated: superseded by owner_scope.nyx_user_id. Issue #466.
  string owner_nyx_user_id = 4 [deprecated = true];
  string api_key_id = 5;
  // Deprecated: superseded by owner_scope.platform. Issue #466.
  string platform = 6 [deprecated = true];
  // Authoritative Lark outbound delivery target captured at create time. When
  // both fields are present, SkillRunnerGAgent.SendOutputAsync uses them
  // verbatim; conversation_id stays for LLM metadata propagation only.
  string lark_receive_id = 7;
  string lark_receive_id_type = 8;
  // Secondary outbound delivery target. Used by SkillRunnerGAgent.SendOutputAsync
  // when the primary chat_id-typed send is rejected with Lark `230002 bot not in
  // chat` — the failure mode for cross-app same-tenant deployments where the
  // outbound app is not a member of the inbound DM. See
  // UserAgentCatalogEntry.lark_receive_id_fallback for the recommended pinning.
  string lark_receive_id_fallback = 9;
  string lark_receive_id_type_fallback = 10;
  // Caller scope captured at create time. Replaces owner_nyx_user_id+platform
  // for new agents; the deprecated scattered fields remain for legacy state.
  aevatar.OwnerScope owner_scope = 11;
  // NyxID outbound proxy slug to use when delivering a failure-notification
  // message after a primary outbound delivery has been rejected. Captured at
  // agent-create time from the inbound channel-bot's slug — by definition
  // the user can be reached through that bot, since they just messaged it
  // (issue #423 §C). Empty when (a) the agent was created before this field
  // existed, (b) the inbound slug equals the primary slug (no benefit), or
  // (c) the inbound slug is not registered as a per-user UserService row
  // and therefore cannot be added to the agent API key's allowed_service_ids.
  // SkillRunnerGAgent.TrySendFailureAsync attempts the failure-notification
  // slug FIRST when set, then falls back to the primary slug.
  string failure_notification_provider_slug = 12;
  SkillRunnerOutputFormat output_format = 13;
}

message SkillRunnerState {
  string skill_name = 1;
  string template_name = 2;
  string skill_content = 3;
  string execution_prompt = 4;
  string schedule_cron = 5;
  string schedule_timezone = 6;
  SkillRunnerOutboundConfig outbound_config = 7;
  google.protobuf.Timestamp last_run_at = 8;
  google.protobuf.Timestamp next_run_at = 9;
  int32 error_count = 10;
  string last_output = 11;
  string last_error = 12;
  bool enabled = 13;
  string scope_id = 14;
  string provider_name = 15;
  string model = 16;
  optional double temperature = 17;
  optional int32 max_tokens = 18;
  optional int32 max_tool_rounds = 19;
  optional int32 max_history_messages = 20;
  // When true, a run that completes with zero successful nyxid_proxy calls is
  // treated as a failure (the LLM bypassed tools and produced output from prior
  // context, which for fetch-and-summarize skills means the
  // report was hallucinated). Issue #439 review follow-up — closes the gap left
  // by the original safety net, which only fired when ≥1 nyxid_proxy call had
  // failed. Skills that don't fan out to nyxid_proxy at all leave this false.
  bool requires_nyxid_proxy_success = 21;
  SkillRunnerSkillReference skill_ref = 22;
  repeated ExternalTriggerSource external_trigger_sources = 23;
  repeated SkillRunnerExternalTriggerDeliveryRecord recent_external_trigger_deliveries = 24;
  SkillRunnerScheduleMode schedule_mode = 25;
  google.protobuf.Timestamp one_shot_run_at = 26;
  google.protobuf.Timestamp retired_at = 27;
  string retirement_reason = 28;
  string one_shot_message = 29;
  repeated SkillRunnerCronOccurrenceTerminalRecord recent_cron_occurrence_terminals = 30;
  repeated aevatar.gagents.channel.abstractions.DeliveryLedgerEntry recent_deliveries = 31;
  aevatar.gagents.channel.abstractions.DeliveryLedgerEntry last_successful_delivery = 32;
  string team_id = 33;
  string member_id = 34;
}

message SkillRunnerExecutionDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at_utc = 5;
  google.protobuf.Timestamp created_at_utc = 6;
  string template_name = 7;
  string scope_id = 8;
  string schedule_cron = 9;
  string schedule_timezone = 10;
  string status = 11;
  google.protobuf.Timestamp last_run_at_utc = 12;
  google.protobuf.Timestamp next_run_at_utc = 13;
  int32 error_count = 14;
  string last_error = 15;
  SkillRunnerScheduleMode schedule_mode = 16;
  google.protobuf.Timestamp run_at_utc = 17;
  google.protobuf.Timestamp retired_at_utc = 18;
  string retirement_reason = 19;
  repeated aevatar.gagents.channel.abstractions.DeliveryLedgerEntry recent_deliveries = 20;
  aevatar.gagents.channel.abstractions.DeliveryLedgerEntry last_successful_delivery = 21;
}

message InitializeSkillRunnerCommand {
  string skill_name = 1;
  string template_name = 2;
  string skill_content = 3;
  string execution_prompt = 4;
  string schedule_cron = 5;
  string schedule_timezone = 6;
  SkillRunnerOutboundConfig outbound_config = 7;
  bool enabled = 8;
  string scope_id = 9;
  string provider_name = 10;
  string model = 11;
  optional double temperature = 12;
  optional int32 max_tokens = 13;
  optional int32 max_tool_rounds = 14;
  optional int32 max_history_messages = 15;
  // See SkillRunnerState.requires_nyxid_proxy_success for semantics.
  bool requires_nyxid_proxy_success = 16;
  SkillRunnerSkillReference skill_ref = 17;
  repeated ExternalTriggerSource external_trigger_sources = 18;
  SkillRunnerOutputFormat output_format = 19;
  SkillRunnerScheduleMode schedule_mode = 20;
  google.protobuf.Timestamp one_shot_run_at = 21;
  string one_shot_message = 22;
  string team_id = 23;
  string member_id = 24;
}

message SkillRunnerInitializedEvent {
  string skill_name = 1;
  string template_name = 2;
  string skill_content = 3;
  string execution_prompt = 4;
  string schedule_cron = 5;
  string schedule_timezone = 6;
  SkillRunnerOutboundConfig outbound_config = 7;
  bool enabled = 8;
  string scope_id = 9;
  string provider_name = 10;
  string model = 11;
  optional double temperature = 12;
  optional int32 max_tokens = 13;
  optional int32 max_tool_rounds = 14;
  optional int32 max_history_messages = 15;
  // See SkillRunnerState.requires_nyxid_proxy_success for semantics.
  bool requires_nyxid_proxy_success = 16;
  SkillRunnerSkillReference skill_ref = 17;
  repeated ExternalTriggerSource external_trigger_sources = 18;
  SkillRunnerScheduleMode schedule_mode = 19;
  google.protobuf.Timestamp one_shot_run_at = 20;
  string one_shot_message = 21;
  string team_id = 22;
  string member_id = 23;
}

message TriggerSkillRunnerExecutionCommand {
  string reason = 1;
  // 0 = first attempt, 1 = backoff retry after a failed first attempt.
  // Bounded by SkillRunnerDefaults.MaxRetryAttempts; retries are event-ified
  // via ScheduleSelfDurableTimeoutAsync and never block the actor turn.
  int32 retry_attempt = 2;
  SkillRunnerExternalTriggerIdentity external_trigger_identity = 3;
}

message AdmitSkillRunnerExternalTriggerCommand {
  SkillRunnerExternalTriggerIdentity identity = 1;
}

message SkillRunnerNextRunScheduledEvent {
  google.protobuf.Timestamp next_run_at = 1;
}

message SkillRunnerOneShotRetiredEvent {
  google.protobuf.Timestamp retired_at = 1;
  string reason = 2;
}

message SkillRunnerExecutionCompletedEvent {
  google.protobuf.Timestamp completed_at = 1;
  string output = 2;
  SkillRunnerExecutionKind execution_kind = 3;
  string skill_name = 4;
  string skill_version = 5;
  string workflow_id = 6;
  string workflow_actor_id = 7;
  string workflow_name = 8;
  string workflow_command_id = 9;
  string workflow_correlation_id = 10;
  SkillRunnerExternalTriggerIdentity external_trigger_identity = 11;
  string cron_occurrence_key = 12;
}

message SkillRunnerExecutionFailedEvent {
  google.protobuf.Timestamp failed_at = 1;
  string error = 2;
  SkillRunnerExecutionKind execution_kind = 3;
  string skill_name = 4;
  string skill_version = 5;
  string workflow_id = 6;
  SkillRunnerExecutionErrorCode error_code = 7;
  SkillRunnerExternalTriggerIdentity external_trigger_identity = 8;
  string cron_occurrence_key = 9;
}

message SkillRunnerExecutionRejectedEvent {
  google.protobuf.Timestamp rejected_at = 1;
  string reason = 2;
  SkillRunnerExternalTriggerIdentity external_trigger_identity = 3;
  string cron_occurrence_key = 4;
}

message SkillRunnerExternalTriggerAdmittedEvent {
  SkillRunnerExternalTriggerIdentity identity = 1;
  google.protobuf.Timestamp admitted_at = 2;
}

message SkillRunnerExternalTriggerDispatchRequestedEvent {
  SkillRunnerExternalTriggerIdentity identity = 1;
  google.protobuf.Timestamp requested_at = 2;
  int32 dispatch_attempt = 3;
}

message SkillRunnerExternalTriggerRejectedEvent {
  SkillRunnerExternalTriggerIdentity identity = 1;
  google.protobuf.Timestamp rejected_at = 2;
  string reason = 3;
}

message SkillRunnerExternalTriggerDuplicateIgnoredEvent {
  SkillRunnerExternalTriggerIdentity identity = 1;
  google.protobuf.Timestamp ignored_at = 2;
  string reason = 3;
}

message SkillRunnerCronOccurrenceDuplicateIgnoredEvent {
  string cron_occurrence_key = 1;
  google.protobuf.Timestamp ignored_at = 2;
}

message DisableSkillRunnerCommand {
  string reason = 1;
}

message EnableSkillRunnerCommand {
  string reason = 1;
}

message SkillRunnerDisabledEvent {
  string reason = 1;
}

message SkillRunnerEnabledEvent {
  string reason = 1;
}
