syntax = "proto3";

package aevatar.gagents.nyxid_chat;

option csharp_namespace = "Aevatar.GAgents.NyxidChat";

import "chat_activity.proto";
import "conversation_events.proto";
import "delivery_ledger.proto";
import "ai_messages.proto";
import "workflow_execution_messages.proto";
import "nyxid_chat_task.proto";
import "agent_profiles.proto";
import "ToolProviders/agent_tool_admission.proto";
import "Credentials/credential_secret_references.proto";
import "google/protobuf/timestamp.proto";

enum AgentRunStatus {
  AGENT_RUN_STATUS_UNSPECIFIED = 0;
  AGENT_RUN_STATUS_STARTED = 1;
  // The LLM run has produced an immutable reply payload (success or failure
  // terminal state) and persisted it, but the LlmReplyReadyEvent has not yet
  // been accepted by the target conversation actor. Output-dispatch retries
  // that happen in this status must re-deliver the persisted payload rather
  // than re-run the LLM / tool chain.
  AGENT_RUN_STATUS_REPLY_PRODUCED = 2;
  AGENT_RUN_STATUS_DROPPED = 3;
  AGENT_RUN_STATUS_FAILED = 4;
  // The LlmReplyReadyEvent has been accepted by the target conversation
  // actor. This is the AgentRunGAgent-side terminal: from here on the run
  // actor only schedules cleanup; it never re-runs the LLM or re-dispatches.
  // NOTE: REPLY_HANDED_OFF != chain.delivered. The chain-level delivered
  // phase (user-visible) is owned by ConversationGAgent and observed via
  // ConversationGAgentState.last_reply_delivery; REPLY_HANDED_OFF is a
  // necessary-not-sufficient precondition. See ADR-0021.
  AGENT_RUN_STATUS_REPLY_HANDED_OFF = 5;
  // The run actor has committed the generation request and handed the
  // transient LLM/tool/streaming work to the stateless generation executor.
  // Duplicate starts in this status must not start a second executor. The
  // executor reports back through typed completion/failure commands; the run
  // actor remains the sole owner of produced/dispatched/terminal facts.
  AGENT_RUN_STATUS_REPLY_GENERATION_REQUESTED = 6;
}

message AgentRunGAgentState {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  AgentRunStatus status = 4;
  int64 started_at_unix_ms = 5;
  int64 completed_at_unix_ms = 6;
  string error_code = 7;
  string error_summary = 8;
  // Produced LLM reply payload, persisted before dispatch so output-dispatch
  // retries never re-invoke the LLM/tool chain.
  string produced_reply_text = 9;
  aevatar.gagents.channel.abstractions.MessageContent produced_outbound = 10;
  aevatar.gagents.channel.runtime.LlmReplyTerminalState produced_terminal_state = 11;
  // Field 12 (`reply_dispatched`) was a bool flag promoted to the explicit
  // AGENT_RUN_STATUS_REPLY_HANDED_OFF status in ADR-0021. Reserved here so
  // accidental reuse of the field number, or a stale serializer built before
  // the split, fails loudly instead of silently masking the new status.
  reserved 12;
  reserved "reply_dispatched";
  // Wall-clock when the terminal-state cleanup callback completed. Combined
  // with status ∈ {DROPPED, FAILED, REPLY_HANDED_OFF}, a non-zero value
  // marks the run as finalized (chain.finalized) — late ready/dropped/failed
  // /cleanup signals must no-op from this point.
  int64 cleanup_completed_at_unix_ms = 13;
  // Generation stage request facts. Runtime-only credentials remain outside
  // this state; the values here only gate duplicate starts and stale
  // completion/timeout continuations.
  int64 generation_requested_at_unix_ms = 14;
  int32 generation_attempt = 15;
  // Drop notification outbox facts. AgentRunDroppedEvent is persisted before
  // notifying the target actor; retry callbacks carry only stable IDs and the
  // actor replays the DeferredLlmReplyDroppedEvent from these state fields.
  string pending_drop_notification_run_id = 16;
  string pending_drop_notification_correlation_id = 17;
  string pending_drop_notification_target_actor_id = 18;
  string pending_drop_notification_reason = 19;
  int64 pending_drop_notification_dropped_at_unix_ms = 20;
  int64 drop_notification_dispatched_at_unix_ms = 21;
  AgentRunReplyStepState generation_step = 22;
  // Immutable history entries produced by the LLM run. Output-dispatch retries
  // re-deliver these entries without re-running the LLM/tool chain.
  repeated aevatar.gagents.channel.runtime.ConversationHistoryEntry produced_appended_history = 23;
  repeated aevatar.ai.AgentToolReceipt tool_receipts = 24;
  AgentRunLarkCardDeliveryState lark_card_delivery = 25;
  AgentRunLarkCardDeliveryCompletion pending_card_delivery_completion = 26;
  repeated aevatar.gagents.channel.abstractions.DeliveryLedgerEntry recent_deliveries = 27;
  aevatar.gagents.channel.abstractions.DeliveryLedgerEntry last_successful_delivery = 28;
  AgentRunPendingToolApprovalState pending_tool_approval = 29;
  AgentRunToolApprovalResolutionState last_tool_approval_resolution = 30;
  bool produced_use_source_activity_delivery_context = 31;
  // Typed ownership handoff to WorkflowRunDeliveryGAgent. When present, the
  // produced reply is intentionally invisible: output retries re-dispatch this
  // receipt to ConversationGAgent instead of re-running the LLM/tool chain.
  aevatar.ai.WorkflowRunBackgroundDeliveryReceipt produced_workflow_run_delivery = 32;
  // Encrypted, TTL-bound handle only. The raw NyxID user bearer remains outside
  // actor state and is resolved solely for Lark CardKit timeout compensation.
  aevatar.credentials.RuntimeSecretReference relay_user_access_token_ref = 33;
}

enum AgentRunToolApprovalDecision {
  AGENT_RUN_TOOL_APPROVAL_DECISION_UNSPECIFIED = 0;
  AGENT_RUN_TOOL_APPROVAL_DECISION_APPROVED = 1;
  AGENT_RUN_TOOL_APPROVAL_DECISION_REJECTED = 2;
}

// Actor-owned suspension identity for exactly one tool call. Runtime
// credentials and raw argument values are deliberately excluded.
message AgentRunPendingToolApprovalState {
  string run_id = 1;
  string correlation_id = 2;
  int32 attempt = 3;
  int32 step_index = 4;
  string approval_request_id = 5;
  string tool_request_id = 6;
  string tool_call_id = 7;
  string tool_name = 8;
  string arguments_sha256 = 9;
  bool is_destructive = 10;
  string side_effect_kind = 11;
  string subject_kind = 12;
  string subject_id = 13;
  string sender_id = 14;
  string registration_scope_id = 15;
  string conversation_key = 16;
  int64 requested_at_unix_ms = 17;
  int64 notification_dispatched_at_unix_ms = 18;
  AgentRunToolApprovalDecision decision = 19;
  int64 decided_at_unix_ms = 20;
}

message AgentRunToolApprovalResolutionState {
  string approval_request_id = 1;
  string tool_call_id = 2;
  string arguments_sha256 = 3;
  AgentRunToolApprovalDecision decision = 4;
  int64 decided_at_unix_ms = 5;
}

enum AgentRunLarkCardDeliveryPhase {
  AGENT_RUN_LARK_CARD_DELIVERY_PHASE_UNSPECIFIED = 0;
  AGENT_RUN_LARK_CARD_DELIVERY_PHASE_IDLE = 1;
  AGENT_RUN_LARK_CARD_DELIVERY_PHASE_CREATING = 2;
  AGENT_RUN_LARK_CARD_DELIVERY_PHASE_STREAMING = 3;
  AGENT_RUN_LARK_CARD_DELIVERY_PHASE_COMPLETED = 4;
  AGENT_RUN_LARK_CARD_DELIVERY_PHASE_ABORTED = 5;
  AGENT_RUN_LARK_CARD_DELIVERY_PHASE_TERMINATED = 6;
  AGENT_RUN_LARK_CARD_DELIVERY_PHASE_CREATION_FAILED = 7;
}

enum AgentRunLarkCardTextFallbackPhase {
  AGENT_RUN_LARK_CARD_TEXT_FALLBACK_PHASE_UNSPECIFIED = 0;
  AGENT_RUN_LARK_CARD_TEXT_FALLBACK_PHASE_IDLE = 1;
  AGENT_RUN_LARK_CARD_TEXT_FALLBACK_PHASE_STATUS_FORWARDED = 2;
  AGENT_RUN_LARK_CARD_TEXT_FALLBACK_PHASE_FINAL_FORWARDED = 3;
  AGENT_RUN_LARK_CARD_TEXT_FALLBACK_PHASE_FAILED = 4;
}

message AgentRunLarkCardDeliveryState {
  AgentRunLarkCardDeliveryPhase phase = 1;
  string card_id = 2;
  string card_message_id = 3;
  string original_card_id = 4;
  string last_flushed_text = 5;
  int64 sequence = 6;
  string streaming_element_id = 7;
  string terminal_reason = 8;
  aevatar.gagents.channel.runtime.LarkCardOperationPhase in_flight_operation = 9;
  int64 in_flight_sequence = 10;
  int64 operation_generation = 11;
  string pending_accumulated_text = 12;
  string pending_finalize_text = 13;
  string pending_finalize_command_id = 14;
  repeated aevatar.gagents.channel.runtime.ConversationHistoryEntry pending_appended_history = 15;
  AgentRunLarkCardTextFallbackPhase text_fallback_phase = 16;
  string nyx_provider_slug = 17;
  aevatar.gagents.channel.runtime.LarkCardAbortReason pending_abort_reason = 18;
  int64 pending_abort_triggered_at_unix_ms = 19;
}

message AgentRunLarkCardDeliveryChangedEvent {
  string run_id = 1;
  string correlation_id = 2;
  int64 changed_at_unix_ms = 3;
  AgentRunLarkCardDeliveryPhase previous_phase = 4;
  AgentRunLarkCardDeliveryPhase phase = 5;
  optional aevatar.gagents.channel.runtime.LarkCardOperationPhase in_flight_operation = 6;
  optional int64 operation_sequence = 7;
  optional int64 operation_generation = 8;
  optional string card_id_assigned = 9;
  optional string card_message_id_assigned = 10;
  optional string original_card_id_assigned = 11;
  optional string flushed_text = 12;
  optional int64 sequence = 13;
  optional string streaming_element_id = 14;
  optional string terminal_reason = 15;
  optional string queued_accumulated_text = 16;
  optional string finalize_text = 17;
  optional string finalize_command_id = 18;
  repeated aevatar.gagents.channel.runtime.ConversationHistoryEntry appended_history = 19;
  optional AgentRunLarkCardTextFallbackPhase text_fallback_phase = 20;
  optional string nyx_provider_slug = 21;
  optional aevatar.gagents.channel.runtime.LarkCardAbortReason pending_abort_reason = 22;
  optional int64 pending_abort_triggered_at_unix_ms = 23;
}

message AgentRunLarkCardDeliveryCompletion {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  string command_id = 4;
  aevatar.gagents.channel.abstractions.ChatActivity activity = 5;
  string card_message_id = 6;
  string outbound_text = 7;
  int64 completed_at_unix_ms = 8;
  aevatar.gagents.channel.runtime.LlmReplyDeliveryFailedEvent delivery_failure = 9;
  repeated aevatar.gagents.channel.runtime.ConversationHistoryEntry appended_history = 10;
  AgentRunLarkCardDeliveryCompletionOutcome outcome = 11;
}

message AgentRunCardDeliveryCompletionPreparedEvent {
  AgentRunLarkCardDeliveryCompletion completion = 1;
}

enum AgentRunLarkCardDeliveryCompletionOutcome {
  AGENT_RUN_LARK_CARD_DELIVERY_COMPLETION_OUTCOME_UNSPECIFIED = 0;
  AGENT_RUN_LARK_CARD_DELIVERY_COMPLETION_OUTCOME_COMPLETED = 1;
  AGENT_RUN_LARK_CARD_DELIVERY_COMPLETION_OUTCOME_FAILED = 2;
}

enum AgentRunReplyStepKind {
  AGENT_RUN_REPLY_STEP_KIND_UNSPECIFIED = 0;
  AGENT_RUN_REPLY_STEP_KIND_LLM = 1;
  AGENT_RUN_REPLY_STEP_KIND_TOOL = 2;
}

message AgentRunReplyTokenUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message AgentRunToolCall {
  string id = 1;
  string name = 2;
  string arguments_json = 3;
}

message AgentRunPendingToolAuthorization {
  AgentRunToolCall call = 1;
  bool has_requires_approval = 2;
  bool requires_approval = 3;
  bool is_read_only = 4;
  bool is_destructive = 5;
  string side_effect_kind = 6;
  string tool_definition_fingerprint = 7;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 8;
}

enum AgentRunToolResultViewStatus {
  AGENT_RUN_TOOL_RESULT_VIEW_STATUS_UNKNOWN = 0;
  AGENT_RUN_TOOL_RESULT_VIEW_STATUS_SUCCESS = 1;
  AGENT_RUN_TOOL_RESULT_VIEW_STATUS_NO_MATCH = 2;
  AGENT_RUN_TOOL_RESULT_VIEW_STATUS_NOT_FOUND = 3;
  AGENT_RUN_TOOL_RESULT_VIEW_STATUS_ERROR = 4;
}

message AgentRunSkillSearchMatchView {
  string skill_name = 1;
  string description = 2;
  bool is_private = 3;
  string category = 4;
  repeated string tags = 5;
}

message AgentRunSkillSearchToolResultView {
  AgentRunToolResultViewStatus status = 1;
  bool has_matches = 2;
  repeated AgentRunSkillSearchMatchView matches = 3;
  string error = 4;
  optional int32 http_status = 5;
  string display_text = 6;
}

message AgentRunSkillLoadToolResultView {
  AgentRunToolResultViewStatus status = 1;
  string skill_name = 2;
  bool loaded = 3;
  string error = 4;
  optional int32 http_status = 5;
  string display_text = 6;
}

message AgentRunToolFailureResultView {
  aevatar.ai.AgentToolReceiptStatus status = 1;
  string error_code = 2;
  string safe_message = 3;
}

message AgentRunToolResultView {
  string tool_name = 1;
  AgentRunSkillSearchToolResultView skill_search = 2;
  AgentRunSkillLoadToolResultView skill_load = 3;
  AgentRunToolFailureResultView failure = 4;
}

message AgentRunChatMessage {
  string role = 1;
  string content = 2;
  string reasoning_content = 3;
  repeated aevatar.ai.ChatContentPart content_parts = 4;
  string tool_call_id = 5;
  repeated AgentRunToolCall tool_calls = 6;
  AgentRunToolResultView tool_result_view = 7;
}

message AgentRunReplyStepState {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int32 attempt = 4;
  int32 next_step_index = 5;
  int32 round = 6;
  int32 max_tool_rounds = 7;
  int32 length_recovery_count = 8;
  bool has_streamed_text_content = 9;
  string accumulated_text = 10;
  AgentRunReplyTokenUsage aggregated_usage = 11;
  string last_finish_reason = 12;
  repeated AgentRunChatMessage messages = 13;
  repeated AgentRunChatMessage pending_history_messages = 14;
  repeated AgentRunToolCall pending_tool_calls = 15;
  bool final_no_tools_step = 16;
  aevatar.ai.LLMControlContextPayload llm_control = 17;
  aevatar.ai.AgentToolExecutionContextPayload tool_context = 18;
  map<string, string> external_metadata = 19;
  aevatar.gagents.channel.abstractions.MessageContent outbound_intent = 20;
  repeated aevatar.gagents.channel.runtime.ConversationHistoryEntry appended_history = 21;
  repeated aevatar.ai.AgentToolReceipt tool_receipts = 22;
  aevatar.ai.LLMControlContextPayload owner_fallback_llm_control = 23;
  aevatar.ai.AgentToolExecutionContextPayload owner_fallback_tool_context = 24;
  // One-shot empty-reply recovery marker. Gates re-recovery (recover at most once) WITHOUT the
  // tool-stripping / server-default-routing semantics of final_no_tools_step: the recovery retry
  // keeps tools + the user's routing + channel-context and only trims history to the recent floor.
  bool empty_reply_retry = 25;
  repeated AgentRunPendingToolAuthorization pending_tool_authorizations = 26;
  bool pending_tool_authorization_consumed = 27;
  // Immutable authority pinned before the first user-facing model call. Exact tool objects are
  // request-local and are therefore re-materialized from these typed facts on replay/retry.
  aevatar.ai.AgentProfileSnapshot agent_profile_snapshot = 28;
  aevatar.ai.AgentProfileTurnAuthorityState agent_profile_turn_authority = 29;
  aevatar.ai.AgentTurnToolCatalogProofPayload tool_catalog_proof = 30;
  string tool_catalog_policy_version = 31;
}

// Typed LLM IO facts returned by the executor. The run actor reconciles these
// facts with its current AgentRunReplyStepState before persisting the next
// waterline.
message AgentRunLlmStepResult {
  reserved 9;
  reserved "tool_step_result";
  string accumulated_text = 1;
  string content = 2;
  string reasoning_content = 3;
  repeated AgentRunToolCall tool_calls = 4;
  AgentRunReplyTokenUsage usage = 5;
  string finish_reason = 6;
  aevatar.gagents.channel.abstractions.MessageContent outbound_intent = 7;
  bool has_streamed_text_content = 8;
  repeated AgentRunPendingToolAuthorization pending_tool_authorizations = 10;
  // Exact request identity used to authorize this LLM step's tool calls. The
  // initial step context predates BuildLlmStepRequest and therefore cannot
  // supply this value to a later approval continuation on its own.
  string tool_request_id = 11;
  // Exact server-authorized catalog supplied to the provider for this model
  // invocation. Empty also truthfully represents a no-tools model round.
  repeated string available_tool_names = 12;
  // Distinguishes an exact empty catalog from legacy evidence that did not
  // capture the model-visible catalog at all.
  bool tool_catalog_captured = 13;
}

// Typed tool IO facts returned after the run actor has reconciled and persisted
// the preceding LLM facts. The run actor owns round advancement and
// message/state persistence.
message AgentRunToolStepResult {
  repeated AgentRunChatMessage result_messages = 1;
  bool advance_round = 2;
  repeated aevatar.ai.AgentToolReceipt tool_receipts = 3;
  // Interactive reply intent captured while an authorized tool executed (for
  // example reply_with_interaction). The executor surfaces the captured intent
  // here for the run actor to merge into AgentRunReplyStepState.outbound_intent.
  aevatar.gagents.channel.abstractions.MessageContent outbound_intent = 4;
  AgentRunToolAuthorizationOutcome authorization_outcome = 5;
}

enum AgentRunToolAuthorizationOutcome {
  AGENT_RUN_TOOL_AUTHORIZATION_OUTCOME_UNSPECIFIED = 0;
  AGENT_RUN_TOOL_AUTHORIZATION_OUTCOME_TRANSIENT_MATCHED = 1;
  AGENT_RUN_TOOL_AUTHORIZATION_OUTCOME_DURABLE_MATCHED = 2;
  AGENT_RUN_TOOL_AUTHORIZATION_OUTCOME_REJECTED = 3;
}

// Transient command for the run actor. The nested NeedsLlmReplyEvent may carry
// a short-lived relay reply_token; AgentRunGAgent must never persist that
// credential into AgentRunGAgentState, AgentRun*Event facts, or durable
// scheduler callback payloads.
message AgentRunStartRequested {
  aevatar.gagents.channel.runtime.NeedsLlmReplyEvent request = 1;
  // Refactor (iter101/cluster-105):
  //   Old pattern: derive run_id by parsing AgentRun actor id prefix.
  //   New principle: start command carries run_id as typed data; actor id remains opaque.
  string run_id = 2;
}

// Durable output-dispatch retry signal emitted by the callback scheduler.
// Refactor (iter73/cluster-073-durable-callback-runtime-credentials):
//   Old pattern: durable callback envelope clones full command/chunk payload, may embed transient runtime credentials (reply_token)
//   New principle: callback payload carries only stable IDs + actor-owned lease keys; actor reconciles from current actor state on fire
message AgentRunOutputDispatchRetryRequested {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int32 attempt = 4;
  int64 generation = 5;
  int64 requested_at_unix_ms = 6;
  bool requires_runtime_reply_token = 7;
}

// Durable drop-notification retry signal emitted by the callback scheduler.
// Refactor (iter99/cluster-605-drop-outbox):
//   Old pattern: drop notification failure reused the ready-output retry command, which had different state and credential semantics.
//   New principle: callback payload carries only stable drop IDs; AgentRunGAgent replays the drop notification from actor-owned state.
message AgentRunDropNotificationRetryRequested {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int32 attempt = 4;
  int64 requested_at_unix_ms = 5;
}

message AgentRunCleanupRequested {
  string run_id = 1;
  int64 requested_at_unix_ms = 2;
}

message AgentRunStartedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int64 started_at_unix_ms = 4;
}

message AgentRunReplyProducedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  aevatar.gagents.channel.runtime.LlmReplyTerminalState terminal_state = 4;
  string error_code = 5;
  string error_summary = 6;
  int64 produced_at_unix_ms = 7;
  // Immutable reply payload produced by the LLM run. Persisting these lets the
  // dispatch retry path re-deliver the same reply without re-running the LLM
  // chain (which would otherwise repeat tool side-effects like SSH exec or
  // external API calls and incur duplicate billing).
  string reply_text = 8;
  aevatar.gagents.channel.abstractions.MessageContent outbound = 9;
  repeated aevatar.gagents.channel.runtime.ConversationHistoryEntry appended_history = 10;
  repeated aevatar.ai.AgentToolReceipt tool_receipts = 11;
  bool use_source_activity_delivery_context = 12;
  // Successful background-delivery registration transfers all user-visible
  // approval and terminal output ownership away from AgentRunGAgent.
  aevatar.ai.WorkflowRunBackgroundDeliveryReceipt workflow_run_delivery = 13;
}

message AgentRunToolApprovalRequestedEvent {
  AgentRunPendingToolApprovalState pending = 1;
}

message AgentRunToolApprovalNotificationDispatchedEvent {
  string approval_request_id = 1;
  int64 dispatched_at_unix_ms = 2;
}

message AgentRunToolApprovalDecisionRecordedEvent {
  string approval_request_id = 1;
  string tool_call_id = 2;
  string arguments_sha256 = 3;
  AgentRunToolApprovalDecision decision = 4;
  int64 decided_at_unix_ms = 5;
}

// Transient card-callback command. The nested request may carry the fresh
// callback reply token and NyxID user bearer and must never be persisted.
message AgentRunToolApprovalDecisionRequested {
  string run_id = 1;
  string approval_request_id = 2;
  string tool_call_id = 3;
  string tool_name = 4;
  string arguments_sha256 = 5;
  bool approved = 6;
  string sender_id = 7;
  string registration_scope_id = 8;
  string conversation_key = 9;
  aevatar.gagents.channel.runtime.NeedsLlmReplyEvent request = 10;
}

// Persisted after admission gates pass and before the transient generation
// executor is asked to start. This event intentionally carries no reply_token,
// user access token, Activity, or other runtime-only credentials.
message AgentRunReplyGenerationRequestedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int64 requested_at_unix_ms = 4;
  int32 attempt = 5;
  aevatar.credentials.RuntimeSecretReference relay_user_access_token_ref = 6;
}

// Persisted per-step waterline owned by AgentRunGAgent. Runtime-only
// credentials remain only on the transient self-message request.
message AgentRunReplyStepStateUpdatedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int32 attempt = 4;
  AgentRunReplyStepState step_state = 5;
}

// Typed self-message: request the next single LLM IO step. The nested request
// may carry command-only relay credentials and must not be persisted.
message AgentRunNextLlmStepRequestedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int32 attempt = 4;
  int32 step_index = 5;
  aevatar.gagents.channel.runtime.NeedsLlmReplyEvent request = 6;
  reserved 7;
  reserved "step_state";
  AgentRunLlmStepResult llm_step_result = 8;
}

// Typed self-message: request the next single tool IO step. The nested request
// may carry command-only relay credentials and must not be persisted.
message AgentRunNextToolStepRequestedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int32 attempt = 4;
  int32 step_index = 5;
  aevatar.gagents.channel.runtime.NeedsLlmReplyEvent request = 6;
  reserved 7;
  reserved "step_state";
  AgentRunToolStepResult tool_step_result = 8;
}

// Transient command for executor failures that did not produce a normal reply
// payload. It is not a persisted fact; the run actor converts it into its
// existing failed/produced terminal facts.
message AgentRunReplyGenerationFailed {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  string error_code = 4;
  string error_summary = 5;
  int64 failed_at_unix_ms = 6;
  int32 attempt = 7;
  aevatar.gagents.channel.runtime.NeedsLlmReplyEvent request = 8;
}

// Transient self-message used when a sender-owned LLM/tool-enabled attempt is
// rejected before it produces a useful reply. The actor converts it into a
// persisted AgentRunReplyStepStateUpdatedEvent that clears sender binding and
// disables tools, then continues through the normal LLM-step chain.
message AgentRunOwnerFallbackStepRequested {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int32 attempt = 4;
  int32 step_index = 5;
  string reason = 6;
  aevatar.gagents.channel.runtime.NeedsLlmReplyEvent request = 7;
}

// Transient timeout signal emitted by the callback scheduler. It carries only
// stable identifiers so runtime-only credentials are never written into the
// scheduler backend.
message AgentRunReplyGenerationTimedOut {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int64 timed_out_at_unix_ms = 4;
  int32 attempt = 5;
}

// Persisted after the LlmReplyReadyEvent has been successfully delivered to
// the target conversation actor. Until this event lands, output-dispatch
// retries must re-deliver the persisted produced payload from
// AgentRunGAgentState rather than re-run the LLM / tool chain.
message AgentRunReplyDispatchedEvent {
  string run_id = 1;
