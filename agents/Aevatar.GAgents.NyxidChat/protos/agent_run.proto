  // ConversationReference; identity is deliberately separate from the
  // delivery credential handle above.
  string bot_registration_id = 27;
  string expected_workflow_command_id = 28;
  int64 reservation_expires_at_unix_ms = 29;
  aevatar.workflow.WorkflowRunTerminalNotification pending_terminal_notification = 30;
