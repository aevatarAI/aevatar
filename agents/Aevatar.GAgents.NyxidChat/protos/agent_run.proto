  int64 pending_terminal_buffered_at_unix_ms = 32;
  aevatar.workflow.WorkflowRunTerminalStatus terminal_outcome = 33;
  aevatar.workflow.WorkflowRunToolApprovalNotification pending_tool_approval_notification = 34;
  repeated string delivered_tool_approval_request_ids = 35;
  int32 tool_approval_delivery_attempt = 36;
  string tool_approval_retry_callback_id = 37;
  int64 tool_approval_retry_at_unix_ms = 38;
  string pending_tool_approval_publisher_actor_id = 39;
