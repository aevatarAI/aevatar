message WorkflowRunDeliveryGAgentState {
  reserved 10, 21, 25;
  reserved "bot_agent_key_id", "terminal_status", "durable_reply_credential_ref";
  string delivery_id = 1;
  string workflow_actor_id = 2;
  string workflow_run_id = 3;
  string workflow_command_id = 4;
