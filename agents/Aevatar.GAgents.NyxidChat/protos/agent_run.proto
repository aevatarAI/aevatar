  string error_code = 19;
  string error_summary = 20;
  string terminal_text = 22;
  string terminal_error_code = 23;
  int64 terminal_observed_at_unix_ms = 24;
  aevatar.ai.ChannelWorkflowResultDeliveryCredential workflow_result_delivery_credential = 26;
