syntax = "proto3";

package aevatar.gagents.nyxid_chat;

option csharp_namespace = "Aevatar.GAgents.NyxidChat";

import "chat_activity.proto";
import "conversation_events.proto";

enum AgentRunStatus {
  AGENT_RUN_STATUS_UNSPECIFIED = 0;
  AGENT_RUN_STATUS_STARTED = 1;
  // The LLM run has produced an immutable reply payload (success or failure
  // terminal state) and persisted it, but the LlmReplyReadyEvent has not yet
  // been accepted by the target conversation actor. Output-dispatch retries
  // that happen in this status must re-deliver the persisted payload rather
  // than re-run the LLM / tool chain.
  AGENT_RUN_STATUS_REPLY_PRODUCED = 2;
  AGENT_RUN_STATUS_DROPPED = 3;
  AGENT_RUN_STATUS_FAILED = 4;
  // The LlmReplyReadyEvent has been accepted by the target conversation
  // actor. This is the AgentRunGAgent-side terminal: from here on the run
  // actor only schedules cleanup; it never re-runs the LLM or re-dispatches.
  // NOTE: REPLY_HANDED_OFF != chain.delivered. The chain-level delivered
  // phase (user-visible) is owned by ConversationGAgent and observed via
  // ConversationGAgentState.last_reply_delivery; REPLY_HANDED_OFF is a
  // necessary-not-sufficient precondition. See ADR-0021.
  AGENT_RUN_STATUS_REPLY_HANDED_OFF = 5;
}

message AgentRunGAgentState {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  AgentRunStatus status = 4;
  int64 started_at_unix_ms = 5;
  int64 completed_at_unix_ms = 6;
  string error_code = 7;
  string error_summary = 8;
  // Produced LLM reply payload, persisted before dispatch so output-dispatch
  // retries never re-invoke the LLM/tool chain.
  string produced_reply_text = 9;
  aevatar.gagents.channel.abstractions.MessageContent produced_outbound = 10;
  aevatar.gagents.channel.runtime.LlmReplyTerminalState produced_terminal_state = 11;
  // Field 12 (`reply_dispatched`) was a bool flag promoted to the explicit
  // AGENT_RUN_STATUS_REPLY_HANDED_OFF status in ADR-0021. Reserved here so
  // accidental reuse of the field number, or a stale serializer built before
  // the split, fails loudly instead of silently masking the new status.
  reserved 12;
  reserved "reply_dispatched";
  // Wall-clock when the terminal-state cleanup callback completed. Combined
  // with status ∈ {DROPPED, FAILED, REPLY_HANDED_OFF}, a non-zero value
  // marks the run as finalized (chain.finalized) — late ready/dropped/failed
  // /cleanup signals must no-op from this point.
  int64 cleanup_completed_at_unix_ms = 13;
}

// Transient command for the run actor. The nested NeedsLlmReplyEvent may carry
// a short-lived relay reply_token; AgentRunGAgent must never persist that
// credential into AgentRunGAgentState or any AgentRun*Event.
message AgentRunStartRequested {
  aevatar.gagents.channel.runtime.NeedsLlmReplyEvent request = 1;
}

message AgentRunCleanupRequested {
  string run_id = 1;
  int64 requested_at_unix_ms = 2;
}

message AgentRunStartedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int64 started_at_unix_ms = 4;
}

message AgentRunReplyProducedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  aevatar.gagents.channel.runtime.LlmReplyTerminalState terminal_state = 4;
  string error_code = 5;
  string error_summary = 6;
  int64 produced_at_unix_ms = 7;
  // Immutable reply payload produced by the LLM run. Persisting these lets the
  // dispatch retry path re-deliver the same reply without re-running the LLM
  // chain (which would otherwise repeat tool side-effects like SSH exec or
  // external API calls and incur duplicate billing).
  string reply_text = 8;
  aevatar.gagents.channel.abstractions.MessageContent outbound = 9;
}

// Persisted after the LlmReplyReadyEvent has been successfully delivered to
// the target conversation actor. Until this event lands, output-dispatch
// retries must re-deliver the persisted produced payload from
// AgentRunGAgentState rather than re-run the LLM / tool chain.
message AgentRunReplyDispatchedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  int64 dispatched_at_unix_ms = 4;
}

message AgentRunDroppedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  string reason = 4;
  int64 dropped_at_unix_ms = 5;
}

message AgentRunFailedEvent {
  string run_id = 1;
  string correlation_id = 2;
  string target_actor_id = 3;
  string error_code = 4;
  string error_summary = 5;
  int64 failed_at_unix_ms = 6;
}

// Persisted by the terminal-state cleanup callback after it has finished its
// idempotent work (in-memory token eviction, scheduler unregistration, etc.).
// Combined with terminal status, this event drives
// AgentRunGAgentState.cleanup_completed_at_unix_ms to a non-zero value and
// marks the run as finalized (chain.finalized) per ADR-0021.
message AgentRunCleanupCompletedEvent {
  string run_id = 1;
  string correlation_id = 2;
  int64 completed_at_unix_ms = 3;
}

message NyxIdChatConversationCreationCompensationRequested {
  string scope_id = 1;
  string actor_id = 2;
  bool destroy_actor = 3;
  string reason = 4;
}

message NyxIdChatConversationDeletionCompensationRequested {
  string scope_id = 1;
  string actor_id = 2;
  string reason = 3;
}
