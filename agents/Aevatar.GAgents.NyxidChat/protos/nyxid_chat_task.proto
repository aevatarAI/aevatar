  NyxIdChatActionDisposition disposition = 2;
  bool verified = 3;
  NyxIdChatSafeResourceRef resource = 4;
  string failure_code = 5;
  string safe_message = 6;
}

message NyxIdChatOperationFailure {
  string failure_code = 1;
  string safe_message = 2;
  NyxIdChatEffectEvidence external_effect = 3;
}

message NyxIdChatOperationResultSignal {
  NyxIdChatOperationKey key = 1;
  oneof result {
    NyxIdChatLLMOperationResult llm = 10;
    NyxIdChatToolOperationResult tool = 11;
    NyxIdChatActionPostconditionResult action_postcondition = 12;
    NyxIdChatOperationFailure failure = 13;
    NyxIdChatToolVerificationResult tool_verification = 14;
  }
}

