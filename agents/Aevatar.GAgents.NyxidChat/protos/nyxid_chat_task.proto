  NYX_ID_CHAT_TURN_STATUS_STOPPED = 4;
  NYX_ID_CHAT_TURN_STATUS_BLOCKED = 5;
}

// Server-classified product intent committed with the turn. This admission is
// independent of optional Agent Profile routing and narrows the runtime tool
