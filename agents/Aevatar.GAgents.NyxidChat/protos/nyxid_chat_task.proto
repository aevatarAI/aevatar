  NyxIdChatConversationGAgentState state = 1;
}

// Durable child-actor waterline. It deliberately stores only reconciliation
// identity and safe terminal evidence; provider credentials, raw responses,
// tool arguments, and execution capabilities are never persisted here.
message NyxIdChatTurnGAgentState {
  NyxIdChatOperationKey admitted_operation = 1;
  NyxIdChatStepKind operation_kind = 2;
  NyxIdChatOperationPhase phase = 3;
  string terminal_code = 4;
  string safe_message = 5;
  NyxIdChatEffectEvidence external_effect = 6;
  bool result_delivered = 7;
  google.protobuf.Timestamp admitted_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  google.protobuf.Timestamp delivered_at = 10;
  repeated NyxIdChatOperationKey delivered_operations = 11;
  bool may_change_external_state = 12;
  // New admissions set NOT_STARTED. Legacy admissions remain UNSPECIFIED and
  // recover conservatively because they predate the durable dispatch waterline.
  NyxIdChatEffectEvidence effect_dispatch_waterline = 13;
  google.protobuf.Timestamp effect_dispatch_started_at = 14;
  bool idempotent = 15;
  string idempotency_key = 16;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 17;
  google.protobuf.Timestamp reconciliation_started_at = 18;
  NyxIdChatTurnPlanGateAdmissionState plan_gate_admission = 19;
  string provider_resource_id = 20;
  aevatar.ai.AgentToolRecoveryContextPayload recovery_context = 21;
  aevatar.credentials.DurableCallerCredentialRef recovery_credential = 22;
  aevatar.ai.tool_providers.AgentToolOperationReadBackPayload recovery_read_back = 23;
  string recovery_effect_step_id = 24;
  // Last exact admission revoked by the conversation actor. Retaining this
  // fence makes revoke redelivery idempotent and prevents a delayed admission
  // command from resurrecting a rejected plan.
  // Bounded exact revocation fences. A turn can admit more than one plan-gated
  // operation over its lifetime, so a singular last-revoked value would make
  // later admissions impossible to revoke safely.
  repeated NyxIdChatTurnPlanGateAdmissionState revoked_plan_gate_admissions = 25;
  // Bounded tombstones committed by delivery probes before reporting that an
  // operation was not admitted. A delayed exact command cannot execute after
  // the conversation actor has relied on that negative result.
  repeated NyxIdChatOperationKey fenced_operation_deliveries = 26;
}

