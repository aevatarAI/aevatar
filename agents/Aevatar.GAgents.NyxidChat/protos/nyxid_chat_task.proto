// Every child progress/result signal carries this complete reconciliation key.
message NyxIdChatOperationKey {
  string conversation_actor_id = 1;
  string turn_id = 2;
  string task_id = 3;
  string step_id = 4;
  string operation_id = 5;
  int64 operation_generation = 6;
}

message NyxIdChatAvailableActions {
  bool retry = 1;
  bool skip = 2;
  bool stop = 3;
}

message NyxIdChatLLMStepSource {
  string model = 1;
}

message NyxIdChatToolStepSource {
  string tool_name = 1;
  string service_slug = 2;
  string service_id = 3;
  optional string readiness_capability_id = 4;
  // Server-only exact selector and contract snapshot. Public read models map
  // only the safe labels above and never expose this admission for assembly.
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 5;
  string provider_resource_id = 6;
}

message NyxIdChatBrowserActionStepSource {
  NyxIdAssistantActionKind action = 1;
  string action_request_id = 2;
}

message NyxIdChatInputStepSource {
  string request_id = 1;
}

message NyxIdChatPostconditionStepSource {
  string action_request_id = 1;
  string check = 2;
  string effect_step_id = 3;
  aevatar.ai.tool_providers.AgentToolOperationReadBackPayload tool_read_back = 4;
  string provider_resource_id = 5;
}

message NyxIdChatRetryToolInputState {
  string call_id = 1;
  string tool_name = 2;
  google.protobuf.Struct arguments = 3;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 4;
}

message NyxIdChatApprovalStepSource {
  string approval_request_id = 1;
}

message NyxIdChatWebStepSource {}

message NyxIdChatStepSource {
  oneof source {
    NyxIdChatLLMStepSource llm = 1;
    NyxIdChatToolStepSource tool = 2;
    NyxIdChatBrowserActionStepSource browser_action = 3;
    NyxIdChatPostconditionStepSource postcondition = 4;
    NyxIdChatInputStepSource input = 5;
    NyxIdChatApprovalStepSource approval = 6;
    NyxIdChatWebStepSource web = 7;
  }
}

message NyxIdChatPlanOperationAdmission {
  NyxIdChatOperationKey key = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  bytes arguments_sha256 = 4;
  string action_request_id = 5;
  NyxIdAssistantActionKind action = 6;
  bytes action_params_sha256 = 7;
}

message NyxIdChatPlanGate {
  NyxIdChatPlanGateMode mode = 1;
  string reason = 2;
  NyxIdChatPlanGateStatus status = 3;
  string request_id = 4;
  string task_id = 5;
  int32 plan_revision = 6;
  repeated NyxIdChatPlanOperationAdmission admissions = 7;
  google.protobuf.Timestamp decided_at = 8;
  string plan_id = 9;
}

// Durable receiver-side admission for one exact plan-gate continuation. Raw
// arguments and credentials are deliberately absent; the arguments digest and
// provider-authored operation admission are sufficient to fail closed.
message NyxIdChatTurnPlanGateAdmissionState {
  NyxIdChatOperationKey key = 1;
  string gate_request_id = 2;
  string task_id = 3;
  string plan_id = 4;
  int32 plan_revision = 5;
  string tool_call_id = 6;
  string tool_name = 7;
  bytes arguments_sha256 = 8;
  bool may_change_external_state = 9;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 10;
  google.protobuf.Timestamp admitted_at = 11;
  bool rematerialize_durable_authorization = 12;
}

message NyxIdChatStepEstimate {
  NyxIdChatStepEstimateKind kind = 1;
  int32 seconds = 2;
}

message NyxIdChatSubstepState {
  string substep_id = 1;
  string title = 2;
  NyxIdChatSubstepStatus status = 3;
}

message NyxIdChatOperationState {
  NyxIdChatOperationKey key = 1;
  NyxIdChatStepKind kind = 2;
  NyxIdChatOperationPhase phase = 3;
  bool may_change_external_state = 4;
  bool idempotent = 5;
  string idempotency_key = 6;
  google.protobuf.Timestamp requested_at = 7;
  google.protobuf.Timestamp dispatched_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  string terminal_code = 10;
  string safe_message = 11;
  // Latest child-owned progress sequence reconciled for this exact operation.
  // This is distinct from the conversation-wide projection sequence.
  int64 latest_progress_sequence = 12;
  google.protobuf.Timestamp last_progress_at = 13;
  google.protobuf.Timestamp stalled_at = 14;
  // Actor-owned presentation cadence state. A due signal may publish a
  // step.changed only while pending_step_changed_progress_sequence identifies
  // genuine executor progress that has not yet been presented.
  google.protobuf.Timestamp last_step_changed_at = 15;
  int64 pending_step_changed_progress_sequence = 16;
  google.protobuf.Timestamp step_changed_due_at = 17;
}

// A Tier-B connected-service approval fact becomes knowable only after NyxID
// returns. It never represents a pre-effect or locally decidable approval.
message NyxIdChatPostReturnApprovalObservation {
  string approval_request_id = 1;
  aevatar.ai.NyxIdApprovalDecisionMode decision_mode = 2;
  aevatar.ai.AgentToolReceiptStatus receipt_status = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message NyxIdChatTaskStepState {
  string step_id = 1;
  int32 order = 2;
  NyxIdChatStepKind kind = 3;
  NyxIdChatStepStatus status = 4;
  bool required = 5;
  string description = 6;
  NyxIdChatStepSource source = 7;
  bool may_change_external_state = 8;
  NyxIdChatEffectEvidence external_effect = 9;
  NyxIdChatOperationState operation = 10;
  string approval_request_id = 11;
  string action_request_id = 12;
  string failure_code = 13;
  string safe_message = 14;
  bool safe_to_skip = 15;
  NyxIdChatAvailableActions available_actions = 16;
  google.protobuf.Timestamp updated_at = 17;
  // True only when this step's execution input can be rebuilt from typed,
  // credential-free conversation state plus a newly supplied transient
  // capability. V1 sets this for initial LLM steps, never for tool calls.
  bool retry_input_rebuildable = 18;
  NyxIdChatStepAddedBy added_by = 19;
  repeated string depends_on = 20;
  NyxIdChatStepEstimate estimate = 21;
  repeated NyxIdChatSubstepState substeps = 22;
  int32 added_in_plan_revision = 23;
  int32 cancelled_in_plan_revision = 24;
  // Internal credential-free input used only for explicit generation retry.
  // Public projections deliberately omit this field.
  NyxIdChatRetryToolInputState retry_tool_input = 25;
  NyxIdChatPostReturnApprovalObservation approval_observation = 26;
  // Actor-owned fact set only by an admitted explicit retry. Operation
  // generation is a fencing counter and must not be used to infer this mode.
  bool rematerialize_durable_authorization = 27;
  // Exact delivered Tool/Postcondition operation whose committed NotApplied
  // evidence authorizes this explicit retry.
  NyxIdChatOperationKey retry_authorization_source_key = 28;
}

message NyxIdChatPlanRevisionRecord {
  int32 plan_revision = 1;
  NyxIdChatPlanRevisionCause revision_cause = 2;
  google.protobuf.Timestamp committed_at = 3;
  repeated string added_step_ids = 4;
  repeated string cancelled_step_ids = 5;
}

message NyxIdChatTaskState {
  string task_id = 1;
  string turn_id = 2;
  NyxIdChatTaskStatus status = 3;
  repeated NyxIdChatTaskStepState steps = 4;
  string active_step_id = 5;
  string active_operation_id = 6;
  string failure_code = 7;
  string safe_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  int32 schema_version = 11;
  string actor_id = 12;
  string plan_id = 13;
  int32 plan_revision = 14;
  string title = 15;
  NyxIdChatPlanGate gate = 16;
  repeated NyxIdChatPlanRevisionRecord plan_revisions = 17;
  int32 plan_revision_history_start = 18;
}

// Public TaskPlan projection shared by live AGUI frames and current-state
// responses. Execution-only retry inputs and idempotency keys remain in the
// authoritative actor state and are deliberately absent here.
message NyxIdChatTaskPlanOperation {
  string conversation_actor_id = 1;
  string turn_id = 2;
  string task_id = 3;
  string step_id = 4;
  string operation_id = 5;
  int64 operation_generation = 6;
  NyxIdChatStepKind kind = 7;
  NyxIdChatOperationPhase phase = 8;
  bool may_change_external_state = 9;
  bool idempotent = 10;
  int64 latest_progress_sequence = 11;
  string terminal_code = 12;
  string safe_message = 13;
  google.protobuf.Timestamp requested_at = 14;
  google.protobuf.Timestamp dispatched_at = 15;
  google.protobuf.Timestamp completed_at = 16;
  google.protobuf.Timestamp last_progress_at = 17;
  google.protobuf.Timestamp stalled_at = 18;
}

message NyxIdChatTaskPlanStep {
  string step_id = 1;
  int32 order = 2;
  NyxIdChatStepKind kind = 3;
  NyxIdChatStepStatus status = 4;
  bool required = 5;
  string description = 6;
  NyxIdChatStepSource source = 7;
  bool may_change_external_state = 8;
  NyxIdChatEffectEvidence external_effect = 9;
  NyxIdChatTaskPlanOperation operation = 10;
  string approval_request_id = 11;
  string action_request_id = 12;
  string failure_code = 13;
  string safe_message = 14;
  bool safe_to_skip = 15;
  NyxIdChatAvailableActions available_actions = 16;
  google.protobuf.Timestamp updated_at = 17;
  NyxIdChatStepAddedBy added_by = 18;
  repeated string depends_on = 19;
  NyxIdChatStepEstimate estimate = 20;
  repeated NyxIdChatSubstepState substeps = 21;
  int32 added_in_plan_revision = 22;
  int32 cancelled_in_plan_revision = 23;
  NyxIdChatPostReturnApprovalObservation approval_observation = 24;
}

message NyxIdChatTaskPlan {
  string task_id = 1;
  string turn_id = 2;
  NyxIdChatTaskStatus status = 3;
  repeated NyxIdChatTaskPlanStep steps = 4;
  string active_step_id = 5;
  string active_operation_id = 6;
  string failure_code = 7;
  string safe_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  int32 schema_version = 11;
  string actor_id = 12;
  string plan_id = 13;
  int32 plan_revision = 14;
  string title = 15;
  NyxIdChatPlanGate gate = 16;
  repeated NyxIdChatPlanRevisionRecord plan_revisions = 17;
  int32 plan_revision_history_start = 18;
}

message NyxIdChatTaskStepChanged {
  string task_id = 1;
  int32 plan_revision = 2;
  NyxIdChatTaskStepState step = 3;
  NyxIdChatStepChangeKind change_kind = 4;
}

message NyxIdChatTaskPlanStepChanged {
  string task_id = 1;
  int32 plan_revision = 2;
  NyxIdChatTaskPlanStep step = 3;
  NyxIdChatStepChangeKind change_kind = 4;
}

message NyxIdChatTurnState {
  string turn_id = 1;
  string task_id = 2;
  string client_request_id = 3;
  NyxIdChatTurnStatus status = 4;
  string prompt = 5;
  repeated aevatar.ai.ChatContentPart input_parts = 6;
  string failure_code = 7;
  string safe_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp terminal_at = 10;
  // Request-scoped authority prepared from the conversation's bound profile
  // before this turn is dispatched. It contains no tool objects, prompt body,
  // credentials, or other transient runtime capability.
  aevatar.ai.AgentProfileTurnAuthorityState agent_profile_turn_authority = 11;
  // Payload-bound request identity used to distinguish exact retries from
  // conflicting reuse of the same client request id.
  string command_id = 12;
}

message NyxIdChatTurnSummary {
  string turn_id = 1;
  string task_id = 2;
  NyxIdChatTurnStatus status = 3;
  string failure_code = 4;
  string safe_message = 5;
  google.protobuf.Timestamp terminal_at = 6;
}

message NyxIdChatPendingApprovalState {
  string approval_request_id = 1;
  string turn_id = 2;
  string task_id = 3;
  string step_id = 4;
  string tool_name = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp asked_at = 7;
  NyxIdChatApprovalPresentation presentation = 8;
  string tool_call_id = 9;
}

message NyxIdChatApprovalPresentation {
  string action = 1;
  string target = 2;
  string actor_label = 3;
  NyxIdChatApprovalReversibility reversibility = 4;
  string grant_boundary = 5;
  string nyxid_request_id = 6;
}

message NyxIdChatInputOption {
