message NyxIdChatOperationRequestedEvent {
  NyxIdChatOperationState operation = 1;
}

message NyxIdChatOperationDispatchedEvent {
  NyxIdChatOperationKey key = 1;
  google.protobuf.Timestamp dispatched_at = 2;
  NyxIdChatEffectEvidence effect_dispatch_waterline = 3;
}

message NyxIdChatTurnOperationDeliveryProbeCommand {
  NyxIdChatOperationKey key = 1;
}

message NyxIdChatTurnOperationDeliveryFencedEvent {
  NyxIdChatOperationKey key = 1;
  google.protobuf.Timestamp fenced_at = 2;
}

message NyxIdChatTurnOperationDeliveryStatusSignal {
  NyxIdChatOperationKey key = 1;
  bool admitted = 2;
  NyxIdChatEffectEvidence effect_dispatch_waterline = 3;
}

message NyxIdChatOperationDeliveryProbeDispatchRequested {
  NyxIdChatOperationKey key = 1;
  int64 expected_state_version = 2;
}

// The transport threw after dispatch began, so inbox admission is unknown.
// The operation remains behind a durable delivery probe; an external effect is
// conservatively fenced as may-have-changed until the turn actor proves exact
// admission or commits a tombstone against late delivery.
message NyxIdChatOperationDispatchUncertainEvent {
  NyxIdChatOperationKey key = 1;
  google.protobuf.Timestamp observed_at = 2;
  NyxIdChatConversationGAgentState state = 3;
}

message NyxIdChatOperationProgressedEvent {
  NyxIdChatOperationProgressSignal progress = 1;
  int64 progress_sequence = 2;
  google.protobuf.Timestamp committed_at = 3;
  NyxIdChatConversationGAgentState state = 4;
  NyxIdChatStepChangeKind step_change_kind = 5;
}

message NyxIdChatOperationStepChangedCommittedEvent {
  NyxIdChatOperationKey key = 1;
  int64 genuine_progress_sequence = 2;
  google.protobuf.Timestamp committed_at = 3;
  int64 progress_sequence = 4;
  NyxIdChatConversationGAgentState state = 5;
}

message NyxIdChatOperationStalledEvent {
  NyxIdChatOperationKey key = 1;
  int64 expected_progress_sequence = 2;
  google.protobuf.Timestamp stalled_at = 3;
  int64 progress_sequence = 4;
  NyxIdChatConversationGAgentState state = 5;
}

message NyxIdChatOperationReconciledEvent {
  NyxIdChatOperationResultSignal result = 1;
  NyxIdChatTaskState task = 2;
  NyxIdChatTurnState turn = 3;
  int64 progress_sequence = 4;
  // Complete actor-derived state, including successor requested waterlines,
  // pending approval/action state, and bounded terminal summaries.
  NyxIdChatConversationGAgentState state = 5;
  // True when this event only refines evidence for an operation whose control
  // fence already published the task/turn terminal.
  bool refines_existing_terminal = 6;
}

// A fenced exact tool operation may still report typed terminal evidence. The
// evidence can refine that operation's effect/phase, but it cannot remove the
// fence, change the stopped task/turn terminal, or authorize a successor.
// Raw tool results and invocation arguments are deliberately absent.
message NyxIdChatLateOperationEvidenceCommittedEvent {
  NyxIdChatOperationKey key = 1;
  NyxIdChatOperationPhase operation_phase = 2;
  NyxIdChatEffectEvidence external_effect = 3;
  aevatar.ai.AgentToolReceipt tool_receipt = 4;
  string terminal_code = 5;
  string safe_message = 6;
  int64 progress_sequence = 7;
  google.protobuf.Timestamp committed_at = 8;
  NyxIdChatConversationGAgentState state = 9;
}

message NyxIdChatControlFenceCommittedEvent {
  NyxIdChatControlFenceState fence = 1;
  NyxIdChatTaskState task = 2;
  NyxIdChatTurnState turn = 3;
  NyxIdChatConversationGAgentState state = 4;
}

message NyxIdChatContinuationAdmissionCommittedEvent {
  NyxIdChatContinuationAdmissionState admission = 1;
  NyxIdChatConversationGAgentState state = 2;
}

message NyxIdChatStepControlCommittedEvent {
  NyxIdChatStepControlResultState result = 1;
  NyxIdChatConversationGAgentState state = 2;
}

// An ordinary start command cannot silently queue behind active work. The
// actor commits this typed fact for the requested turn so the same Projection
// Pipeline can return ACTIVE_TURN_REQUIRES_STEERING to its live observer.
message NyxIdChatTurnAdmissionRejectedEvent {
  string conversation_actor_id = 1;
  string requested_turn_id = 2;
  string active_turn_id = 3;
  string command_id = 4;
  string correlation_id = 5;
  string reason_code = 6;
  string safe_message = 7;
}

message NyxIdChatActionRequestedEvent {
  NyxIdChatActionRequestState request = 1;
  NyxIdChatTaskState task = 2;
  NyxIdChatTurnState origin_turn = 3;
  NyxIdChatConversationGAgentState state = 4;
}

message NyxIdChatInputRequestedEvent {
  NyxIdChatPendingInputState pending_input = 1;
  NyxIdChatConversationGAgentState state = 2;
}

message NyxIdChatInputResolutionCommittedEvent {
  NyxIdChatInputResolutionState resolution = 1;
  NyxIdChatConversationGAgentState state = 2;
}

message NyxIdChatApprovalResolutionCommittedEvent {
  NyxIdChatApprovalResolutionState resolution = 1;
  NyxIdChatConversationGAgentState state = 2;
}

message NyxIdChatPlanResolutionCommittedEvent {
  NyxIdChatPlanResolutionState resolution = 1;
  NyxIdChatConversationGAgentState state = 2;
}

message NyxIdChatPlanGateCapabilityExpiredCommittedEvent {
  NyxIdChatTurnPlanGateAdmissionState admission = 1;
  string failure_code = 2;
  string safe_message = 3;
  NyxIdChatConversationGAgentState state = 4;
}

message NyxIdChatPlanGateAdmissionRevocationAcknowledgedEvent {
  NyxIdChatTurnPlanGateAdmissionState admission = 1;
  google.protobuf.Timestamp acknowledged_at = 2;
}

message NyxIdChatPlanGateAdmissionDeliveryAcknowledgedEvent {
  NyxIdChatTurnPlanGateAdmissionState admission = 1;
  google.protobuf.Timestamp acknowledged_at = 2;
}

message NyxIdChatTransitionDecisionFact {
  NyxIdChatTransitionOutcome outcome = 1;
  string reason_code = 2;
  string safe_message = 3;
}
