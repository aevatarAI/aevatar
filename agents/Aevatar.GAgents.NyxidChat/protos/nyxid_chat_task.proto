  NyxIdChatToolCallSafety safety = 4;
  // Provider-authored NyxID identity provenance. The conversation actor copies
  // only its safe identity fields into the durable tool step source.
  aevatar.foundation.tools.NyxIdOperationRef nyx_id_provenance = 5;
  // Exact provider-owned selector and contract. The model never authors this
  // field; the server snapshots it beside the authorized runtime capability.
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 6;
  // Bounded provider-authored snapshot; never supplied by the model.
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 7;
}

message NyxIdChatLLMOperationResult {
  string content = 1;
  string reasoning_content = 2;
  repeated aevatar.ai.ChatContentPart content_parts = 3;
  repeated NyxIdChatToolCall tool_calls = 4;
  aevatar.ai.TokenUsagePayload usage = 5;
