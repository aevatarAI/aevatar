  aevatar.ai.AgentToolExecutionContextPayload tool_context = 7;
  bool may_change_external_state = 8;
  string plan_id = 9;
  string idempotency_key = 10;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 11;
  google.protobuf.Struct retry_arguments = 12;
  aevatar.ai.AgentProfileSnapshot agent_profile = 13;
  aevatar.ai.AgentProfileTurnAuthorityState agent_profile_turn_authority = 14;
  bool rematerialize_durable_authorization = 15;
}

message NyxIdChatOperationDispatchCommand {
  NyxIdChatOperationKey key = 1;
  oneof input {
    NyxIdChatLLMOperationInput llm = 10;
    NyxIdChatToolOperationInput tool = 11;
    NyxIdChatActionPostconditionInput action_postcondition = 12;
    NyxIdChatInputContinuationInput input_continuation = 13;
    NyxIdChatToolApprovalContinuationInput tool_approval_continuation = 14;
    NyxIdChatPlanGateContinuationInput plan_gate_continuation = 15;
    NyxIdChatToolVerificationInput tool_verification = 16;
  }
}

enum NyxIdChatToolVerificationDisposition {
  NYX_ID_CHAT_TOOL_VERIFICATION_DISPOSITION_UNSPECIFIED = 0;
  NYX_ID_CHAT_TOOL_VERIFICATION_DISPOSITION_APPLIED = 1;
  NYX_ID_CHAT_TOOL_VERIFICATION_DISPOSITION_NOT_APPLIED = 2;
  NYX_ID_CHAT_TOOL_VERIFICATION_DISPOSITION_UNAVAILABLE = 3;
}

message NyxIdChatToolVerificationResult {
  string effect_step_id = 1;
  NyxIdChatToolVerificationDisposition disposition = 2;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload read_operation = 3;
  string check_name = 4;
  string failure_code = 5;
  string safe_message = 6;
}

message NyxIdChatToolCallSafety {
  bool is_read_only = 1;
  bool is_destructive = 2;
  string side_effect_kind = 3;
  bool may_change_external_state = 4;
  bool requires_approval = 5;
}

message NyxIdChatToolCall {
  string call_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
  // Exact invocation safety is snapshotted by the authorized tool provider.
  // Its absence is fail-closed; consumers never infer safety from strings.
  NyxIdChatToolCallSafety safety = 4;
  // Provider-authored NyxID identity provenance. The conversation actor copies
  // only its safe identity fields into the durable tool step source.
  aevatar.foundation.tools.NyxIdOperationRef nyx_id_provenance = 5;
  // Exact provider-owned selector and contract. The model never authors this
  // field; the server snapshots it beside the authorized runtime capability.
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 6;
}

message NyxIdChatLLMOperationResult {
  string content = 1;
  string reasoning_content = 2;
  repeated aevatar.ai.ChatContentPart content_parts = 3;
  repeated NyxIdChatToolCall tool_calls = 4;
  aevatar.ai.TokenUsagePayload usage = 5;
  string finish_reason = 6;
}

message NyxIdChatToolOperationResult {
  string result_json = 1;
  aevatar.ai.AgentToolReceipt receipt = 2;
  NyxIdChatEffectEvidence external_effect = 3;
}

message NyxIdChatActionPostconditionResult {
  string action_request_id = 1;
  NyxIdChatActionDisposition disposition = 2;
  bool verified = 3;
  NyxIdChatSafeResourceRef resource = 4;
  string failure_code = 5;
  string safe_message = 6;
}

message NyxIdChatOperationFailure {
  string failure_code = 1;
  string safe_message = 2;
  NyxIdChatEffectEvidence external_effect = 3;
}

message NyxIdChatOperationResultSignal {
  NyxIdChatOperationKey key = 1;
  oneof result {
    NyxIdChatLLMOperationResult llm = 10;
    NyxIdChatToolOperationResult tool = 11;
    NyxIdChatActionPostconditionResult action_postcondition = 12;
    NyxIdChatOperationFailure failure = 13;
    NyxIdChatToolVerificationResult tool_verification = 14;
  }
}

// Activation never executes a continuation inline. It publishes this typed
// self signal, and the normal actor handler revalidates both the complete
// operation identity and the committed version before taking any action.
message NyxIdChatRecoveryRequestedSignal {
  NyxIdChatOperationKey key = 1;
  int64 expected_state_version = 2;
  NyxIdChatRecoveryKind kind = 3;
}

// Durable pre-expiry renewal for a server-sealed recovery credential. The
// signal carries no secret material and is rejected unless it still matches
// the actor-owned operation and credential reference.
message NyxIdChatRecoveryCredentialRenewalRequested {
  NyxIdChatOperationKey key = 1;
  string credential_ref = 2;
}

message NyxIdChatTurnOperationExecutionProgressSignal {
  NyxIdChatOperationProgressSignal progress = 1;
}

enum NyxIdChatTurnOperationCompletionSource {
  NYX_ID_CHAT_TURN_OPERATION_COMPLETION_SOURCE_UNSPECIFIED = 0;
  NYX_ID_CHAT_TURN_OPERATION_COMPLETION_SOURCE_EXECUTION = 1;
  NYX_ID_CHAT_TURN_OPERATION_COMPLETION_SOURCE_RECONCILIATION = 2;
}

message NyxIdChatTurnOperationExecutionCompletedSignal {
  NyxIdChatOperationResultSignal result = 1;
  NyxIdChatTurnOperationCompletionSource source = 2;
}

message NyxIdChatTurnOperationCancelCommand {
  NyxIdChatOperationKey key = 1;
}

message NyxIdChatTurnOperationReconciliationInput {
  NyxIdChatOperationKey key = 1;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 2;
  string idempotency_key = 3;
  NyxIdChatEffectEvidence effect_dispatch_waterline = 4;
  aevatar.ai.tool_providers.AgentToolOperationReadBackPayload read_back = 5;
  string provider_resource_id = 6;
  aevatar.ai.AgentToolRecoveryContextPayload recovery_context = 7;
  aevatar.credentials.DurableCallerCredentialRef recovery_credential = 8;
  string effect_step_id = 9;
}

message NyxIdChatTextProgress {
  string delta = 1;
}

message NyxIdChatReasoningProgress {
  string delta = 1;
}

// Ordered presentation deltas that share one actor-owned progress commit.
// Adjacent segments of the same kind may be coalesced, but text/reasoning
// transitions remain explicit so projection cannot reorder the stream.
message NyxIdChatStreamingProgressSegment {
  oneof progress {
    NyxIdChatTextProgress text = 1;
    NyxIdChatReasoningProgress reasoning = 2;
  }
}

message NyxIdChatStreamingProgressBatch {
  repeated NyxIdChatStreamingProgressSegment segments = 1;
}

message NyxIdChatToolProgress {
  string call_id = 1;
  string tool_name = 2;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 3;
}

// Presentation-only phase evidence authored by the executor. A phase cannot
// carry an operation key, effect evidence, actions, or another nested phase;
// those authoritative facts remain on the owning task step and operation.
message NyxIdChatOperationPhaseProgress {
  string substep_id = 1;
  string title = 2;
  NyxIdChatSubstepStatus status = 3;
}

message NyxIdChatOperationProgressSignal {
  NyxIdChatOperationKey key = 1;
  int64 sequence = 2;
  oneof progress {
    NyxIdChatTextProgress text = 10;
    NyxIdChatReasoningProgress reasoning = 11;
    NyxIdChatToolProgress tool_started = 12;
    NyxIdChatOperationPhaseProgress phase = 13;
    NyxIdChatStreamingProgressBatch streaming_batch = 14;
  }
}

// Durable self signal for the actor-owned stall deadline. The full operation
// key plus the expected child progress waterline rejects retry/stale signals.
message NyxIdChatOperationStallCheckSignal {
  NyxIdChatOperationKey key = 1;
  int64 expected_progress_sequence = 2;
  google.protobuf.Timestamp expected_last_progress_at = 3;
}

// Durable self signal that flushes only previously committed genuine executor
// progress into the bounded step.changed presentation cadence.
message NyxIdChatOperationStepChangedDueSignal {
  NyxIdChatOperationKey key = 1;
  google.protobuf.Timestamp expected_due_at = 2;
}

message NyxIdChatStartTurnCommand {
  string scope_id = 1;
