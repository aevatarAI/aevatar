message NyxIdChatConversationGAgentState {
  reserved 31, 32, 38, 39, 40, 44, 45;
  reserved "recent_plan_resolutions", "latest_plan_resolution",
      "active_turn_plan_gate_admission", "pending_plan_gate_admission_revocation",
      "pending_plan_gate_admission_delivery", "pending_plan_gate_continuation",
      "pending_plan_gate_continuation_key";
  string conversation_actor_id = 1;
  string scope_id = 2;
  aevatar.ai.AIAgentConfigOverrides role_configuration = 3;
  aevatar.ai.AgentProfileSnapshot agent_profile = 4;
  NyxIdChatTurnState active_turn = 5;
  NyxIdChatTurnState latest_turn = 6;
  repeated NyxIdChatTurnSummary recent_terminal_turns = 7;
  NyxIdChatTaskState active_task = 8;
  NyxIdChatPendingApprovalState pending_approval = 9;
  repeated NyxIdChatActionRequestState pending_actions = 10;
  NyxIdChatControlFenceState control_fence = 11;
  NyxIdChatContinuationAdmissionState continuation_admission = 12;
  int64 progress_sequence = 13;
  google.protobuf.Timestamp updated_at = 14;
  // Most recently committed control outcome. A rejected replay never replaces
  // the accepted execution fence that still guards the old plan.
  NyxIdChatControlFenceState latest_control_result = 15;
  // Bounded actor-owned replay/conflict facts for retry and skip request
  // identities. Runtime credentials never enter these results.
  repeated NyxIdChatStepControlResultState recent_step_control_results = 16;
  NyxIdChatStepControlResultState latest_step_control_result = 17;
  // Bounded terminal browser-action summaries. Active/waiting actions remain
  // in pending_actions; completed/declined/failed/cancelled/expired actions
  // move here without losing typed correlation and proof evidence.
  repeated NyxIdChatActionRequestState recent_actions = 18;
  // Post-registration delivery state for creating the authoritative empty
  // ChatConversationGAgent transcript. This outbox is transport state only
  // and is deliberately excluded from public current-state projections.
  NyxIdChatHistoryInitializationOutbox pending_history_initialization = 19;
  // Stable identity retained after dispatch so exact registration retries do
  // not prepare a second initialization operation.
  string history_initialization_operation_id = 20;
  // One stable reservation shared by controller recovery and terminal
  // delivery. The prompt is transcript input, not execution capability;
  // credentials and raw content parts are deliberately absent.
  NyxIdChatHistoryDeliveryReservationState history_delivery_reservation = 21;
  // Bounded at-least-once delivery transport state. Public projections must
  // not expose this field; ChatConversationGAgent remains transcript owner.
  NyxIdChatHistoryTerminalOutbox pending_history_terminal = 22;
  // Actor-owned identity fact. It is deliberately excluded from public
  // projections, AGUI frames, transcripts, and error text.
  string owner_subject = 23;
  NyxIdChatPendingInputState pending_input = 24;
  repeated NyxIdChatInputResolutionState recent_input_resolutions = 25;
  repeated NyxIdChatApprovalResolutionState recent_approval_resolutions = 26;
  NyxIdChatInputResolutionState latest_input_resolution = 27;
  NyxIdChatApprovalResolutionState latest_approval_resolution = 28;
  NyxIdChatConversationAttentionState attention = 29;
  // Durable, secret-free outbox for the self-message that materializes an
  // ask_user tool call as the exact actor-owned pending input fact.
  NyxIdChatInputRequestCommand pending_input_request = 30;
  // Server-sealed first-turn command retained only until canonical history
  // initialization is admitted. Raw credentials never enter actor state.
  aevatar.credentials.DurableCallerCredentialRef pending_creation_first_turn = 33;
  string pending_creation_first_turn_id = 34;
  // Internal transport pointer for a delayed steering continuation. The vault
  // owns the transient command capability; public projections omit both fields.
  aevatar.credentials.DurableCallerCredentialRef pending_steering_continuation = 35;
  string pending_steering_continuation_id = 36;
  google.protobuf.Timestamp pending_steering_continuation_expires_at = 37;
  // Secret-free delivery barrier retained when operation inbox admission is
  // ambiguous. Recovery cannot start until the turn actor proves that this
  // exact operation committed or durably fences it against late delivery.
  NyxIdChatOperationKey pending_operation_delivery_probe = 41;
  // Owner-only, one-shot canary fact. The actor is the sole authority; only a
  // safe status projection leaves this state boundary.
  NyxIdChatCanaryEffectFaultState canary_effect_fault = 42;
  // Exact committed-result receipts. They are retained until an explicit
  // child delivery-confirmation protocol can prove that replay authority is no
  // longer needed. Each receipt is credential-free (typed postcondition
  // terminal identity plus a SHA-256 digest); correctness must not depend on
  // evicting an older receipt from a long-lived conversation actor.
  repeated NyxIdChatOperationResultAcknowledgementFence result_acknowledgement_fences = 43;
  // Authoritative actor-owned deletion tombstone. The current-state
  // projection copies this fact; query paths must not infer deletion by
  // joining the registry or replaying events.
  bool deleted = 46;
  google.protobuf.Timestamp deleted_at = 47;
  aevatar.ai.ConversationContextAttachmentSet context_attachments = 48;
  NyxIdChatPendingWorkflowSignalState pending_workflow_signal = 49;
}

