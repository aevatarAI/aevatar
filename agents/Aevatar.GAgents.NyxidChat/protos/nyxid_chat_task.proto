    NyxIdChatOperationPhaseProgress phase = 13;
    NyxIdChatStreamingProgressBatch streaming_batch = 14;
    NyxIdChatModelStartedProgress model_started = 15;
    NyxIdChatModelCompletedProgress model_completed = 16;
  }
