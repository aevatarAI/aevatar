  // The turn's operation ledger, snapshotted once when this outbox is first
  // prepared. Retries reuse the committed snapshot so the idempotency guard
  // keeps comparing the same bytes.
  repeated NyxIdChatTurnOperationSnapshot operations = 10;
}

// Typed self-continuation and durable retry payload. Full terminal content is
// rehydrated from actor-owned state and never copied into callback messages.
message NyxIdChatHistoryTerminalDispatchRequested {
  string delivery_id = 1;
  int32 attempt = 2;
}

message NyxIdChatHistoryTerminalDispatchedEvent {
  string delivery_id = 1;
  string source_command_id = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp dispatched_at = 4;
}

message NyxIdChatHistoryTerminalRetryScheduledEvent {
  string delivery_id = 1;
  int32 attempt = 2;
  string failure_code = 3;
  google.protobuf.Timestamp scheduled_at = 4;
}

// One atomic controller commit for a newly admitted turn. The snapshot already
// contains the active turn, task, first step, and requested operation waterline;
// transient credentials remain exclusively on the later child-actor command.
message NyxIdChatTurnStartedEvent {
  NyxIdChatConversationGAgentState state = 1;
}

// Durable child-actor waterline. It deliberately stores only reconciliation
// identity and safe terminal evidence; provider credentials, raw responses,
// tool arguments, and execution capabilities are never persisted here.
message NyxIdChatTurnGAgentState {
  reserved 19, 25;
  reserved "plan_gate_admission", "revoked_plan_gate_admissions";
  NyxIdChatOperationKey admitted_operation = 1;
  NyxIdChatStepKind operation_kind = 2;
  NyxIdChatOperationPhase phase = 3;
  string terminal_code = 4;
  string safe_message = 5;
  NyxIdChatEffectEvidence external_effect = 6;
  bool result_delivered = 7;
  google.protobuf.Timestamp admitted_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  google.protobuf.Timestamp delivered_at = 10;
  repeated NyxIdChatOperationKey delivered_operations = 11;
  bool may_change_external_state = 12;
  // New admissions set NOT_STARTED. Legacy admissions remain UNSPECIFIED and
  // recover conservatively because they predate the durable dispatch waterline.
  NyxIdChatEffectEvidence effect_dispatch_waterline = 13;
  google.protobuf.Timestamp effect_dispatch_started_at = 14;
  bool idempotent = 15;
  string idempotency_key = 16;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 17;
  google.protobuf.Timestamp reconciliation_started_at = 18;
  string provider_resource_id = 20;
  aevatar.ai.AgentToolRecoveryContextPayload recovery_context = 21;
  aevatar.credentials.DurableCallerCredentialRef recovery_credential = 22;
  aevatar.ai.tool_providers.AgentToolOperationReadBackPayload recovery_read_back = 23;
  string recovery_effect_step_id = 24;
  // Bounded tombstones committed by delivery probes before reporting that an
  // operation was not admitted. A delayed exact command cannot execute after
  // the conversation actor has relied on that negative result.
  repeated NyxIdChatOperationKey fenced_operation_deliveries = 26;
  NyxIdChatCanaryEffectFaultDirective canary_effect_fault = 27;
  bool canary_effect_fault_consumed = 28;
  google.protobuf.Timestamp canary_effect_fault_consumed_at = 29;
  string canary_effect_fault_approval_request_id = 30;
  aevatar.ai.AgentToolReceiptStatus canary_effect_fault_receipt_status = 31;
  aevatar.ai.NyxIdApprovalDecisionMode canary_effect_fault_approval_decision_mode = 32;
  aevatar.ai.NyxIdApprovalTerminalOutcome canary_effect_fault_approval_terminal_outcome = 33;
  string canary_effect_fault_approval_subject_kind = 34;
  string canary_effect_fault_approval_subject_id = 35;
  string canary_effect_fault_tool_call_id = 36;
  string canary_effect_fault_tool_name = 37;
  // Durable postcondition result outbox. Only ActionPostcondition,
  // ToolVerification, and sanitized Failure variants are admitted; provider
  // raw responses, tool arguments, LLM text, and credentials are forbidden.
  // The child clears it only after the authoritative conversation actor
  // confirms that this exact result committed.
  NyxIdChatOperationResultSignal pending_result = 38;
  int32 result_delivery_attempt = 39;
  NyxIdChatExactServiceRecoveryStage exact_service_recovery_stage = 40;
  // Safe terminal evidence used to distinguish approval-required results from
  // success or authorization-required results after actor reactivation.
  aevatar.ai.AgentToolReceiptStatus tool_receipt_status = 41;
}

message NyxIdChatTurnOperationAdmittedEvent {
  reserved 9;
  reserved "consumes_plan_gate_admission";
  NyxIdChatOperationKey key = 1;
  NyxIdChatStepKind operation_kind = 2;
  google.protobuf.Timestamp admitted_at = 3;
  bool may_change_external_state = 4;
  NyxIdChatEffectEvidence effect_dispatch_waterline = 5;
  bool idempotent = 6;
  string idempotency_key = 7;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 8;
  aevatar.ai.AgentToolRecoveryContextPayload recovery_context = 10;
  aevatar.credentials.DurableCallerCredentialRef recovery_credential = 11;
  aevatar.ai.tool_providers.AgentToolOperationReadBackPayload recovery_read_back = 12;
  string recovery_effect_step_id = 13;
  NyxIdChatCanaryEffectFaultDirective canary_effect_fault = 14;
  string canary_effect_fault_tool_call_id = 15;
  string canary_effect_fault_tool_name = 16;
  NyxIdChatExactServiceRecoveryStage exact_service_recovery_stage = 17;
}

message NyxIdChatTurnEffectDispatchStartedEvent {
  reserved 3;
  reserved "consumed_canary_effect_fault_arm_id";
  NyxIdChatOperationKey key = 1;
  google.protobuf.Timestamp started_at = 2;
}

// The authoritative turn consumes the canary only after infrastructure has
// observed a real NyxID per-request denial that proves the provider mutation
// was not applied. The denial result itself is intentionally not completed to
// the turn through the normal result path.
message NyxIdChatTurnCanaryEffectFaultTriggeredEvent {
  NyxIdChatOperationKey key = 1;
  string arm_id = 2;
  string approval_request_id = 3;
  google.protobuf.Timestamp triggered_at = 4;
  aevatar.ai.AgentToolReceiptStatus receipt_status = 5;
  aevatar.ai.NyxIdApprovalDecisionMode approval_decision_mode = 6;
  aevatar.ai.NyxIdApprovalTerminalOutcome approval_terminal_outcome = 7;
  string approval_subject_kind = 8;
  string approval_subject_id = 9;
  string approval_call_id = 10;
  string approval_tool_name = 11;
}

message NyxIdChatTurnOperationReconciliationStartedEvent {
  NyxIdChatOperationKey key = 1;
  google.protobuf.Timestamp started_at = 2;
}

message NyxIdChatTurnOperationCompletedEvent {
  NyxIdChatOperationKey key = 1;
  NyxIdChatOperationPhase phase = 2;
  string terminal_code = 3;
  string safe_message = 4;
  NyxIdChatEffectEvidence external_effect = 5;
  google.protobuf.Timestamp completed_at = 6;
  string provider_resource_id = 7;
  // Populated only for a credential-free postcondition terminal result that
  // must survive accepted-but-uncommitted parent delivery.
  NyxIdChatOperationResultSignal result = 8;
  aevatar.ai.AgentToolReceiptStatus tool_receipt_status = 9;
}

message NyxIdChatTurnOperationDeliveredEvent {
  NyxIdChatOperationKey key = 1;
  google.protobuf.Timestamp delivered_at = 2;
}

message NyxIdChatTurnOperationResultRedeliveryAttemptedEvent {
  NyxIdChatOperationKey key = 1;
  int32 attempt = 2;
  google.protobuf.Timestamp attempted_at = 3;
}

message NyxIdChatTurnOperationResultAcknowledgedSignal {
  NyxIdChatOperationKey key = 1;
  bytes result_sha256 = 2;
}

message NyxIdChatLLMOperationInput {
  aevatar.ai.ChatRequestEvent request = 1;
  // Continuations reuse only the turn actor's transient provider session.
  // No credential or authorized-tool capability is persisted in actor state.
  bool continue_session = 2;
  // The immutable conversation binding and this turn's already committed
  // authority. The child executor materializes only request-local capabilities
  // from this typed pair; it never side-reads conversation actor state.
  aevatar.ai.AgentProfileSnapshot agent_profile = 3;
  aevatar.ai.AgentProfileTurnAuthorityState agent_profile_turn_authority = 4;
  NyxIdChatTurnIntent intent = 5;
  // Rebuild the request-local catalog before resuming the existing provider
  // session. This is used only after a verified browser-owned authorization
  // action may have made new exact NyxID operations available.
  bool rematerialize_turn_catalog = 6;
  // Safe typed fact for one verified browser-authorization continuation.
  // Runtime credentials remain exclusively in the transient request context.
  NyxIdChatVerifiedAuthorizationContinuation verified_authorization_continuation = 7;
  aevatar.ai.ConversationContextAttachmentSet context_attachments = 8;
  // Server-selected chat route action for this LLM operation. It is copied only
  // into the transient run request so policy-owned tool hints can be enforced
  // by the run executor without becoming actor addressing.
  aevatar.chat_routing.v1.ChatRouteAction target_ref = 9;
}

message NyxIdChatToolOperationInput {
  string tool_name = 1;
  string call_id = 2;
  string arguments_json = 3;
  aevatar.ai.AgentToolExecutionContextPayload tool_context = 4;
  bool may_change_external_state = 5;
  bool idempotent = 6;
  string idempotency_key = 7;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 8;
  aevatar.ai.AgentProfileSnapshot agent_profile = 9;
  aevatar.ai.AgentProfileTurnAuthorityState agent_profile_turn_authority = 10;
  bool rematerialize_durable_authorization = 11;
  // Exact delivered Tool/Postcondition operation whose committed NotApplied
  // evidence authorized this explicit generation retry. The turn actor checks
  // this source before the executor may rematerialize a durable capability.
  NyxIdChatOperationKey retry_authorization_source_key = 12;
  NyxIdChatTurnIntent intent = 13;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 14;
  NyxIdChatCanaryEffectFaultDirective canary_effect_fault = 15;
}

message NyxIdChatToolVerificationInput {
  string effect_step_id = 1;
  aevatar.ai.tool_providers.AgentToolOperationReadBackPayload read_back = 2;
  aevatar.ai.AgentToolExecutionContextPayload tool_context = 3;
  string provider_resource_id = 4;
}

message NyxIdChatActionPostconditionInput {
  string action_request_id = 1;
  NyxIdAssistantActionKind action = 2;
  NyxIdChatSafeResourceRef resource_hint = 3;
  string scope_id = 4;
  string owner_subject = 5;
  string origin_turn_id = 6;
  NyxIdChatActionDisposition reported_disposition = 7;
  NyxIdAssistantActionParams params = 8;
  // Authoritative action-request time captured by the conversation actor.
  // Provider evidence predating this value cannot prove the requested effect.
  google.protobuf.Timestamp requested_at = 9;
  // Transient credentials supplied by the browser after an interactive NyxID
  // authorization change. The executor refreshes only its in-memory turn
  // session from this value; actors never copy it into committed state.
  aevatar.ai.AgentToolExecutionContextPayload tool_context = 10;
}

// Transient continuation payloads. Raw user input and credentials are carried
// only to the turn actor inbox and are never copied into committed state.
message NyxIdChatInputContinuationInput {
  string request_id = 1;
  string tool_call_id = 2;
  NyxIdChatInputAnswer answer = 3;
  repeated NyxIdChatInputOption selected_options = 4;
  aevatar.ai.AgentToolExecutionContextPayload tool_context = 5;
  // Server-selected chat route action for this input continuation. It is copied
  // only into the transient run request so policy-owned tool hints can remain
  // active after a pending user-input step is resolved.
  aevatar.chat_routing.v1.ChatRouteAction target_ref = 6;
}

message NyxIdChatConditionContinuationInput {
  string tool_call_id = 1;
  NyxIdChatNumericConditionState condition = 2;
}

message NyxIdChatToolApprovalContinuationInput {
  string approval_request_id = 1;
  bool approved = 2;
  aevatar.ai.AgentToolExecutionContextPayload tool_context = 3;
  bool may_change_external_state = 4;
  string idempotency_key = 5;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 6;
  aevatar.ai.NyxIdExactServiceApprovalAuthority exact_service_approval = 7;
  string tool_call_id = 8;
  string tool_name = 9;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 10;
}

message NyxIdChatOperationDispatchCommand {
  reserved 15, 18;
  reserved "plan_gate_continuation", "domain_continuation";
  NyxIdChatOperationKey key = 1;
  oneof input {
    NyxIdChatLLMOperationInput llm = 10;
    NyxIdChatToolOperationInput tool = 11;
    NyxIdChatActionPostconditionInput action_postcondition = 12;
    NyxIdChatInputContinuationInput input_continuation = 13;
    NyxIdChatToolApprovalContinuationInput tool_approval_continuation = 14;
    NyxIdChatToolVerificationInput tool_verification = 16;
