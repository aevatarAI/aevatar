// Every child progress/result signal carries this complete reconciliation key.
message NyxIdChatOperationKey {
  string conversation_actor_id = 1;
  string turn_id = 2;
  string task_id = 3;
  string step_id = 4;
  string operation_id = 5;
  int64 operation_generation = 6;
}

// Owner-bound intent armed while the source LLM operation is still running.
// The exact effect operation does not exist yet and is sealed only when the
// LLM result materializes one direct typed Tool operation.
message NyxIdChatCanaryEffectFaultArmIntent {
  string arm_id = 1;
  string client_request_id = 2;
  NyxIdChatOperationKey source_operation_key = 3;
  string service_instance_id = 4;
  string owner_subject = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// Owner-bound, one-shot production canary directive. It is server-authored,
// secret-free, and valid only for the exact generation-1 effect operation.
message NyxIdChatCanaryEffectFaultDirective {
  string arm_id = 1;
  string client_request_id = 2;
  NyxIdChatOperationKey key = 3;
  string service_instance_id = 4;
  string catalog_digest = 5;
  string owner_subject = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message NyxIdChatCanaryEffectFaultState {
  NyxIdChatCanaryEffectFaultDirective directive = 1;
  NyxIdChatCanaryEffectFaultStatus status = 2;
  google.protobuf.Timestamp armed_at = 3;
  google.protobuf.Timestamp consumed_at = 4;
  google.protobuf.Timestamp forwarded_at = 5;
  string approval_request_id = 6;
  aevatar.ai.AgentToolReceiptStatus receipt_status = 7;
  aevatar.ai.NyxIdApprovalDecisionMode approval_decision_mode = 8;
  aevatar.ai.NyxIdApprovalTerminalOutcome approval_terminal_outcome = 9;
  string approval_subject_kind = 10;
  string approval_subject_id = 11;
  string approval_call_id = 12;
  string approval_tool_name = 13;
  NyxIdChatCanaryEffectFaultArmIntent arm_intent = 14;
}

message NyxIdChatAvailableActions {
  bool retry = 1;
  bool skip = 2;
  bool stop = 3;
}

message NyxIdChatLLMStepSource {
  string model = 1;
  // Present only for the exact LLM continuation admitted after a browser-owned
  // NyxID action has been verified through its typed postcondition.
  optional string action_request_id = 2;
  // Frozen actor-owned completion obligation for the exact verified action.
  NyxIdChatAuthorizationResumeRequirement resume_requirement = 3;
}

// Credential-free typed arguments for the platform readiness gate that may
// need to be re-run after a verified browser-owned authorization action.
message NyxIdChatRequireServiceParams {
  string service_slug = 1;
  repeated string requested_scopes = 2;
  string service_label = 3;
  string resource_uri = 4;
}

message NyxIdChatAuthorizationReadinessInput {
  string tool_name = 1;
  NyxIdChatRequireServiceParams params = 2;
}

message NyxIdChatToolStepSource {
  string tool_name = 1;
  string service_slug = 2;
  string service_id = 3;
  optional string readiness_capability_id = 4;
  // Server-only exact selector and contract snapshot. Public read models map
  // only the safe labels above and never expose this admission for assembly.
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 5;
  string provider_resource_id = 6;
  // Frozen typed expectation produced only for nyxid_require_service under a
  // committed service-connect turn admission.
  NyxIdCatalogServiceConnectParams service_connect_postcondition = 7;
  // Bounded provider-authored presentation retained for recovery and retry.
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 8;
  // Frozen independently of retry authorization. It contains no credential,
  // bearer, operation admission, or caller-supplied prose.
  NyxIdChatAuthorizationReadinessInput authorization_readiness = 9;
}

message NyxIdChatBrowserActionStepSource {
  NyxIdAssistantActionKind action = 1;
  string action_request_id = 2;
}

message NyxIdChatInputStepSource {
  string request_id = 1;
}

message NyxIdChatPostconditionStepSource {
  string action_request_id = 1;
  string check = 2;
  string effect_step_id = 3;
  aevatar.ai.tool_providers.AgentToolOperationReadBackPayload tool_read_back = 4;
  string provider_resource_id = 5;
}

message NyxIdChatRetryToolInputState {
  string call_id = 1;
  string tool_name = 2;
  google.protobuf.Struct arguments = 3;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 4;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 5;
}

message NyxIdChatApprovalStepSource {
  string approval_request_id = 1;
}

message NyxIdChatWebStepSource {}

message NyxIdChatNumericConditionState {
  reserved 11;
  reserved "source_evidence_id";
  string condition_id = 1;
  string source_input_request_id = 2;
  int64 suggested_threshold = 3;
  int64 effective_threshold = 4;
  NyxIdChatThresholdOrigin threshold_origin = 5;
  int64 observed_value = 6;
  NyxIdChatIntegerComparison comparison = 7;
  NyxIdChatConditionOutcome outcome = 8;
  google.protobuf.Timestamp evaluated_at = 9;
  string guarded_tool_name = 10;
}

message NyxIdChatConditionStepSource {
  NyxIdChatNumericConditionState condition = 1;
}

message NyxIdChatStepGuard {
  string condition_step_id = 1;
  NyxIdChatConditionOutcome required_outcome = 2;
}

message NyxIdChatStepSource {
  oneof source {
    NyxIdChatLLMStepSource llm = 1;
    NyxIdChatToolStepSource tool = 2;
    NyxIdChatBrowserActionStepSource browser_action = 3;
    NyxIdChatPostconditionStepSource postcondition = 4;
    NyxIdChatInputStepSource input = 5;
    NyxIdChatApprovalStepSource approval = 6;
    NyxIdChatWebStepSource web = 7;
    NyxIdChatConditionStepSource condition = 8;
  }
}

message NyxIdChatStepEstimate {
  NyxIdChatStepEstimateKind kind = 1;
  int32 seconds = 2;
}

message NyxIdChatSubstepState {
  string substep_id = 1;
  string title = 2;
  NyxIdChatSubstepStatus status = 3;
}

message NyxIdChatOperationState {
  NyxIdChatOperationKey key = 1;
  NyxIdChatStepKind kind = 2;
  NyxIdChatOperationPhase phase = 3;
  bool may_change_external_state = 4;
  bool idempotent = 5;
  string idempotency_key = 6;
  google.protobuf.Timestamp requested_at = 7;
  google.protobuf.Timestamp dispatched_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  string terminal_code = 10;
  string safe_message = 11;
  // Latest child-owned progress sequence reconciled for this exact operation.
  // This is distinct from the conversation-wide projection sequence.
  int64 latest_progress_sequence = 12;
  google.protobuf.Timestamp last_progress_at = 13;
  google.protobuf.Timestamp stalled_at = 14;
  // Actor-owned presentation cadence state. A due signal may publish a
  // step.changed only while pending_step_changed_progress_sequence identifies
  // genuine executor progress that has not yet been presented.
  google.protobuf.Timestamp last_step_changed_at = 15;
  int64 pending_step_changed_progress_sequence = 16;
  google.protobuf.Timestamp step_changed_due_at = 17;
}

// A Tier-B connected-service approval fact becomes knowable only after NyxID
// returns. It never represents a pre-effect or locally decidable approval.
message NyxIdChatPostReturnApprovalObservation {
  string approval_request_id = 1;
  aevatar.ai.NyxIdApprovalDecisionMode decision_mode = 2;
  aevatar.ai.AgentToolReceiptStatus receipt_status = 3;
  google.protobuf.Timestamp observed_at = 4;
  aevatar.ai.NyxIdApprovalTerminalOutcome terminal_outcome = 5;
  string subject_kind = 6;
  string subject_id = 7;
}

message NyxIdChatTaskStepState {
  string step_id = 1;
  int32 order = 2;
  NyxIdChatStepKind kind = 3;
  NyxIdChatStepStatus status = 4;
  bool required = 5;
  string description = 6;
  NyxIdChatStepSource source = 7;
  bool may_change_external_state = 8;
  NyxIdChatEffectEvidence external_effect = 9;
  NyxIdChatOperationState operation = 10;
  string approval_request_id = 11;
  string action_request_id = 12;
  string failure_code = 13;
  string safe_message = 14;
  bool safe_to_skip = 15;
  NyxIdChatAvailableActions available_actions = 16;
  google.protobuf.Timestamp updated_at = 17;
  // True only when this step's execution input can be rebuilt from typed,
  // credential-free conversation state plus a newly supplied transient
  // capability. V1 sets this for initial LLM steps, never for tool calls.
  bool retry_input_rebuildable = 18;
  NyxIdChatStepAddedBy added_by = 19;
  repeated string depends_on = 20;
  NyxIdChatStepEstimate estimate = 21;
  repeated NyxIdChatSubstepState substeps = 22;
  int32 added_in_plan_revision = 23;
  int32 cancelled_in_plan_revision = 24;
  // Internal credential-free input used only for explicit generation retry.
  // Public projections deliberately omit this field.
  NyxIdChatRetryToolInputState retry_tool_input = 25;
  NyxIdChatPostReturnApprovalObservation approval_observation = 26;
  // Actor-owned fact set only by an admitted explicit retry. Operation
  // generation is a fencing counter and must not be used to infer this mode.
  bool rematerialize_durable_authorization = 27;
  // Exact delivered Tool/Postcondition operation whose committed NotApplied
  // evidence authorizes this explicit retry.
  NyxIdChatOperationKey retry_authorization_source_key = 28;
  NyxIdChatStepGuard guard = 29;
  // Bounded, sanitized transcript facts kept so the turn's operation ledger
  // survives past the live event stream. Credentials, operation admissions and
  // raw content parts never enter this record.
  NyxIdChatOperationLedgerFacts operation_ledger_facts = 30;
}

// Sanitized, size-bounded ledger facts for one committed operation result.
// Each preview is truncated for storage; `previews_truncated` says so honestly
// instead of presenting a fragment as the complete payload.
message NyxIdChatOperationLedgerFacts {
  // Tool result bodies are untrusted external text and are deliberately absent:
  // conversation actor state is re-read when rebuilding model input.
  reserved 5;
  reserved "result_preview";
  aevatar.ai.TokenUsagePayload usage = 1;
  string input_preview = 2;
  string output_preview = 3;
  string arguments_preview = 4;
  bool previews_truncated = 6;
  string model = 7;
  string provider = 8;
  string finish_reason = 9;
  repeated string available_tool_names = 10;
  bool tool_catalog_captured = 11;
}

// One operation of a terminal turn, snapshotted from the owning task's steps so
