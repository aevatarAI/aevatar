syntax = "proto3";

package aevatar.gagents.nyxid_chat;

option csharp_namespace = "Aevatar.GAgents.NyxidChat";

import "ai_messages.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "ToolProviders/agent_tool_admission.proto";
import "Tools/tool_presentation.proto";
import "Credentials/credential_secret_references.proto";

message NyxIdDirectChatHistoryDispatchedEvent {
  string session_id = 1;
  string delivery_id = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp dispatched_at = 4;
}

message NyxIdDirectChatHistoryDeliveryRequested {
  string session_id = 1;
  string delivery_id = 2;
  int32 expected_attempt = 3;
}

// NyxIdChat owns these closed product states. Transport adapters may map them
// to JSON, but no actor, projector, or client may replace them with prose.
