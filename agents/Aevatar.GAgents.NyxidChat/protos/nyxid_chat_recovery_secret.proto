syntax = "proto3";

package aevatar.gagents.nyxid_chat;

option csharp_namespace = "Aevatar.GAgents.NyxidChat";

import "ai_messages.proto";
import "nyxid_chat_task.proto";

// Vault-only recovery material. Actor state stores only the durable secret
// reference and recovery stage, never this payload or raw tool arguments.
message NyxIdChatRecoverySecretPayload {
  // High field numbers keep this wrapper distinguishable from the legacy
  // AgentToolCredentialsPayload (fields 1-5) stored in the same vault slot.
  string format = 100;
  uint32 schema_version = 101;
  aevatar.ai.AgentToolCredentialsPayload credentials = 102;
  NyxIdChatOperationDispatchCommand exact_service_command = 103;
}
