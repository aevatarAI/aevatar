syntax = "proto3";
package aevatar.gagents.studio_member;
option csharp_namespace = "Aevatar.GAgents.StudioMember";

import "google/protobuf/timestamp.proto";
import "scheduled_invocation_authorization_evidence.proto";
import "workflow_capability_admission.proto";

// ─── Canonical enums ───
//
// StudioMember is the Studio's only first-class subject. workflow / script /
// gagent are implementation kinds for a member, not parallel member types.

enum StudioMemberImplementationKind {
  STUDIO_MEMBER_IMPLEMENTATION_KIND_UNSPECIFIED = 0;
  STUDIO_MEMBER_IMPLEMENTATION_KIND_WORKFLOW = 1;
  STUDIO_MEMBER_IMPLEMENTATION_KIND_SCRIPT = 2;
  STUDIO_MEMBER_IMPLEMENTATION_KIND_GAGENT = 3;
}

// Lifecycle stages mirror the Build/Bind/Invoke/Observe spec:
//   created      - member exists but has no implementation
//   build_ready  - implementation revision available, can bind
//   bind_ready   - bound to its publishedServiceId, can invoke
enum StudioMemberLifecycleStage {
  STUDIO_MEMBER_LIFECYCLE_STAGE_UNSPECIFIED = 0;
  STUDIO_MEMBER_LIFECYCLE_STAGE_CREATED = 1;
  STUDIO_MEMBER_LIFECYCLE_STAGE_BUILD_READY = 2;
  STUDIO_MEMBER_LIFECYCLE_STAGE_BIND_READY = 3;
}

enum StudioMemberBindingRunStatus {
  STUDIO_MEMBER_BINDING_RUN_STATUS_UNSPECIFIED = 0;
  STUDIO_MEMBER_BINDING_RUN_STATUS_ACCEPTED = 1;
  STUDIO_MEMBER_BINDING_RUN_STATUS_ADMISSION_PENDING = 2;
  STUDIO_MEMBER_BINDING_RUN_STATUS_ADMITTED = 3;
  STUDIO_MEMBER_BINDING_RUN_STATUS_PLATFORM_BINDING_PENDING = 4;
  STUDIO_MEMBER_BINDING_RUN_STATUS_SUCCEEDED = 5;
  STUDIO_MEMBER_BINDING_RUN_STATUS_FAILED = 6;
  STUDIO_MEMBER_BINDING_RUN_STATUS_REJECTED = 7;
  STUDIO_MEMBER_BINDING_RUN_STATUS_MEMBER_NOTIFICATION_PENDING = 8;
}

enum StudioMemberPlatformBindingReadinessStatus {
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_UNSPECIFIED = 0;
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_SERVICE_CATALOG_MISSING = 1;
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_SERVING_SET_MISSING = 2;
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_ELIGIBLE_SERVING_TARGET_MISSING = 3;
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_SERVICE_CATALOG_TARGET_MISSING = 4;
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_READY = 5;
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_TRAFFIC_VIEW_TARGET_MISSING = 6;
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_PREPARED_ARTIFACT_MISSING = 7;
  STUDIO_MEMBER_PLATFORM_BINDING_READINESS_STATUS_INVOCATION_CATALOG_NOT_READY = 8;
}

enum StudioMemberPlatformBindingExecutionStage {
  STUDIO_MEMBER_PLATFORM_BINDING_EXECUTION_STAGE_UNSPECIFIED = 0;
  STUDIO_MEMBER_PLATFORM_BINDING_EXECUTION_STAGE_ACCEPTANCE_PENDING = 1;
  STUDIO_MEMBER_PLATFORM_BINDING_EXECUTION_STAGE_COMMAND_PENDING = 2;
  STUDIO_MEMBER_PLATFORM_BINDING_EXECUTION_STAGE_COMMAND_IN_FLIGHT = 3;
  STUDIO_MEMBER_PLATFORM_BINDING_EXECUTION_STAGE_READINESS_PENDING = 4;
  STUDIO_MEMBER_PLATFORM_BINDING_EXECUTION_STAGE_READINESS_IN_FLIGHT = 5;
}

enum StudioMemberGAgentEndpointKind {
  STUDIO_MEMBER_GAGENT_ENDPOINT_KIND_UNSPECIFIED = 0;
  STUDIO_MEMBER_GAGENT_ENDPOINT_KIND_COMMAND = 1;
  STUDIO_MEMBER_GAGENT_ENDPOINT_KIND_CHAT = 2;
}

enum StudioMemberWorkflowScheduleProvisioningStatus {
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_PROVISIONING_STATUS_UNSPECIFIED = 0;
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_PROVISIONING_STATUS_PENDING_BINDING = 1;
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_PROVISIONING_STATUS_PROVISIONING = 2;
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_PROVISIONING_STATUS_RETRY_PENDING = 3;
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_PROVISIONING_STATUS_SUCCEEDED = 4;
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_PROVISIONING_STATUS_FAILED = 5;
}

enum StudioMemberWorkflowScheduleMode {
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_MODE_UNSPECIFIED = 0;
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_MODE_RECURRING_CRON = 1;
  STUDIO_MEMBER_WORKFLOW_SCHEDULE_MODE_ONE_SHOT_AT_UTC = 2;
}

// ─── Implementation refs ───
//
// Each implementation kind carries a typed sub-message rather than a generic
// metadata bag. Only one of these is populated at a time, matching
// implementation_kind on the parent state.

message StudioMemberWorkflowRef {
  string workflow_id = 1;
  string workflow_revision = 2;
  string definition_actor_id_prefix = 3;
}

message StudioMemberScriptRef {
  string script_id = 1;
  string script_revision = 2;
  repeated string endpoint_ids = 3;
}

message StudioMemberGAgentRef {
  string actor_type_name = 1;
  string agent_kind = 2;
}

message StudioMemberImplementationRef {
  StudioMemberWorkflowRef workflow = 1;
  StudioMemberScriptRef script = 2;
  StudioMemberGAgentRef gagent = 3;
}

// ─── Last bound contract ───
//
// Record of the last successful Bind. publishedServiceId is the stable
// per-member service identity; revisionId is the most recently published
// implementation revision routed through that service.

message StudioMemberBindingContract {
  string published_service_id = 1;
  string revision_id = 2;
  StudioMemberImplementationKind implementation_kind = 3;
  google.protobuf.Timestamp bound_at_utc = 4;
  string expected_actor_id = 5;
}

message StudioMemberBindingFailure {
  string code = 1;
  string message = 2;
  google.protobuf.Timestamp failed_at_utc = 3;
}

message StudioMemberBindingAuthorityState {
  string current_binding_run_id = 1;
  StudioMemberBindingRunStatus current_status = 2;
  string last_terminal_binding_run_id = 3;
  StudioMemberBindingFailure last_failure = 4;
  google.protobuf.Timestamp updated_at_utc = 5;
}

message StudioMemberWorkflowBindingRequest {
  repeated string workflow_yamls = 1;
  string workflow_id = 2;
  aevatar.workflow.WorkflowCapabilityAdmissionPlan capability_admission_plan = 3;
}

message StudioMemberScriptBindingRequest {
  string script_id = 1;
  optional string script_revision = 2;
}

message StudioMemberGAgentEndpointBindingRequest {
  string endpoint_id = 1;
  string display_name = 2;
  StudioMemberGAgentEndpointKind kind = 3;
  string request_type_url = 4;
  string response_type_url = 5;
  string description = 6;
}

message StudioMemberGAgentBindingRequest {
  reserved "actor_type_name";
  string agent_kind = 1;
  repeated StudioMemberGAgentEndpointBindingRequest endpoints = 2;
}

message StudioMemberBindingRequest {
  string binding_run_id = 1;
  string scope_id = 2;
  string member_id = 3;
  string request_hash = 4;
  optional string revision_id = 5;
  oneof implementation {
    StudioMemberWorkflowBindingRequest workflow = 10;
    StudioMemberScriptBindingRequest script = 11;
    StudioMemberGAgentBindingRequest gagent = 12;
  }
}

message StudioMemberBindingAdmittedSnapshot {
  string member_id = 1;
  string scope_id = 2;
  string published_service_id = 3;
  StudioMemberImplementationKind implementation_kind = 4;
  string display_name = 5;
}

message StudioMemberPlatformBindingResult {
  string published_service_id = 1;
  string revision_id = 2;
  StudioMemberImplementationKind implementation_kind = 3;
  string expected_actor_id = 4;
  StudioMemberImplementationRef implementation_ref = 5;
}

message StudioMemberPlatformBindingRecoverySnapshot {
  StudioMemberPlatformBindingResult result = 1;
  string expected_deployment_id = 2;
  repeated string expected_endpoint_ids = 3;
  string activation_attempt_id = 4;
}

message StudioMemberBindingRunState {
  string binding_run_id = 1;
  string scope_id = 2;
  string member_id = 3;
  string request_hash = 4;
  StudioMemberBindingRunStatus status = 5;
  StudioMemberBindingRequest request = 6;
  StudioMemberBindingAdmittedSnapshot admitted = 7;
  StudioMemberPlatformBindingResult platform_result = 8;
  StudioMemberBindingFailure failure = 9;
  google.protobuf.Timestamp accepted_at_utc = 10;
  google.protobuf.Timestamp updated_at_utc = 11;
  int32 attempt_count = 12;
  string platform_binding_command_id = 13;
  bool platform_execution_in_flight = 14 [deprecated = true];
  google.protobuf.Timestamp platform_execution_started_at_utc = 15 [deprecated = true];
  StudioMemberPlatformBindingRecoverySnapshot platform_binding_recovery_snapshot = 16;
  int32 platform_binding_protocol_version = 17;
  int32 platform_execution_attempt = 18;
  StudioMemberPlatformBindingExecutionStage platform_execution_stage = 19;
  google.protobuf.Timestamp platform_execution_stage_started_at_utc = 20;
  google.protobuf.Timestamp platform_readiness_deadline_at_utc = 21;
  StudioMemberPlatformBindingReadinessStatus last_platform_readiness_status = 22;
  int32 member_notification_attempt = 23;
  google.protobuf.Timestamp member_notification_attempted_at_utc = 24;
}

message StudioMemberWorkflowScheduleProvisioningIntent {
  string provisioning_id = 1;
  string scope_id = 2;
  string team_id = 3;
  string member_id = 4;
  string published_service_id = 5;
  string workflow_id = 6;
  string revision_id = 7;
  string display_name = 8;
  string prompt = 9;
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 10;
  string subject_platform = 11;
  string subject_tenant = 12;
  string subject_external_user_id = 13;
  string verified_binding_id = 14;
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity authenticated_actor = 15;
  StudioMemberWorkflowScheduleMode schedule_mode = 16;
  string cron_expression = 17;
  string timezone = 18;
  int32 one_shot_delay_seconds = 19;
  string binding_run_id = 20;
  string schedule_operation_id = 21;
  string schedule_idempotency_key = 22;
}

message StudioMemberWorkflowScheduleProvisioningFailure {
  string code = 1;
  string message = 2;
  google.protobuf.Timestamp failed_at_utc = 3;
}

message StudioMemberWorkflowScheduleProvisioningState {
  StudioMemberWorkflowScheduleProvisioningIntent intent = 1;
  StudioMemberWorkflowScheduleProvisioningStatus status = 2;
  google.protobuf.Timestamp requested_at_utc = 3;
  google.protobuf.Timestamp updated_at_utc = 4;
  google.protobuf.Timestamp deadline_at_utc = 5;
  google.protobuf.Timestamp resolved_one_shot_fire_at_utc = 6;
  int32 attempt_count = 7;
  bool attempt_in_flight = 8;
  string schedule_id = 9;
  string operation_id = 10;
  StudioMemberWorkflowScheduleProvisioningFailure failure = 11;
}

// ─── State ───
//
// State for a single StudioMember actor. Actor ID format:
//   studio-member:{scopeId}:{memberId}
//
// publishedServiceId is generated once at creation from the immutable
// memberId and never recomputed afterwards. Renaming the display name does
// not change publishedServiceId.

message StudioMemberState {
  string member_id = 1;
  string scope_id = 2;
  string display_name = 3;
  string description = 4;
  StudioMemberImplementationKind implementation_kind = 5;
  StudioMemberImplementationRef implementation_ref = 6;
  string published_service_id = 7;
  StudioMemberLifecycleStage lifecycle_stage = 8;
  google.protobuf.Timestamp created_at_utc = 9;
  google.protobuf.Timestamp updated_at_utc = 10;
  StudioMemberBindingContract last_binding = 11;
  // Async binding protocol state. `last_binding` remains the single source of
  // truth for the last successful binding contract; this sub-state owns active
  // run status, stale-run rejection, and failure details.
  StudioMemberBindingAuthorityState binding = 12;
  // Optional team membership (ADR-0017). Absent means "unassigned"; empty
  // string is rejected at the application layer. Mutated only via committed
  // StudioMemberReassignedEvent.
  optional string team_id = 50;
  // Tombstone flag for physical Studio member deletion. Once true, the member
  // authority rejects user-facing mutations and the current-state projector
  // removes the member read model so GET/list surfaces return not found.
  bool deleted = 60;
  google.protobuf.Timestamp deleted_at_utc = 61;
  // Actor-owned continuation for the deterministic schedule created by the
  // one-call workflow provisioning flow. It contains no raw credentials.
  StudioMemberWorkflowScheduleProvisioningState workflow_schedule_provisioning = 70;
  // Actor-owned revision of the member facts that participate in scheduled
  // invocation authorization. Provisioning attempts and other bookkeeping do
  // not advance it; implementation, binding, team, and delete changes do.
  int64 authorization_revision = 80;
}

// ─── Events ───
//
// One event per discrete transition. The actor materializes state from these
// events; projectors materialize the read model from the same envelope.

message StudioMemberCreatedEvent {
  string member_id = 1;
  string scope_id = 2;
  string display_name = 3;
  string description = 4;
  StudioMemberImplementationKind implementation_kind = 5;
  string published_service_id = 6;
  google.protobuf.Timestamp created_at_utc = 7;
  StudioMemberImplementationRef implementation_ref = 8;
}

// Refactor (iter1345/cluster-519-draft-member-authority):
//   Old pattern: draft member authority could be implied by API/query-side
//   orchestration instead of an explicit actor-owned command.
//   New principle: projection fanout sends this typed command through the
//   existing dispatch envelope so StudioMemberGAgent remains the authority.
