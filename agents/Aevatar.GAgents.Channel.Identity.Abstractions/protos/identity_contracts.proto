syntax = "proto3";

package aevatar.gagents.channel.identity.abstractions;

option csharp_namespace = "Aevatar.GAgents.Channel.Identity.Abstractions";

import "google/protobuf/timestamp.proto";
import "channel_contracts.proto";
import "Credentials/credential_secret_references.proto";

// ExternalSubjectRef lives in Channel.Abstractions (channel_contracts.proto)
// because Identity is a consumer of channel concepts — see ADR-0018 §Actor
// Architecture. C# callers reach it via the `Aevatar.GAgents.Channel.Abstractions`
// namespace; proto files reach it via `aevatar.gagents.channel.abstractions.ExternalSubjectRef`.

// Opaque pointer issued by NyxID broker on successful binding completion.
// aevatar holds binding_id in ExternalIdentityBindingGAgent state; the
// underlying refresh_token never leaves NyxID. See ADR-0018 §Storage Boundary.
message BindingId {
  // Opaque identifier. Format owned by NyxID#549 (suggested prefix "bnd_").
  string value = 1;
}

// Canonical business data ownership scope shared by native API login and
// channel bindings. This is deliberately separate from ExternalSubjectRef and
// channel registration scope: provider subjects and bot configuration scopes
// remain routing/audit identities, while owner_scope_id keys user-owned data.
message OwnerScopeId {
  string value = 1;
}

// Capability scope requested when issuing a short-lived access token via the
// NyxID broker. Mirrors RFC 8693 token-exchange `scope` parameter — narrow
// scope at issuance time so per-turn tokens are minimum-privilege.
message CapabilityScope {
  // Space-separated OAuth scope string (e.g. "openid profile" or
  // provider-specific scopes the LLM tool will exercise).
  string value = 1;
}

// Short-lived access token + expiry returned by IssueShortLivedAsync.
// Lives only in per-turn AsyncLocal context (see AgentToolRequestContext);
// never persisted. See ADR-0018 §Storage Boundary.
message CapabilityHandle {
  // Bearer access token for downstream LLM / tool calls.
  string access_token = 1;
  // UNIX seconds-since-epoch when the token expires (typically <= 5 min from issuance).
  int64 expires_at_unix = 2;
  // Effective scope granted by NyxID (may be narrower than requested).
  string scope = 3;
}

// Returned by StartExternalBindingAsync. Carries the OAuth authorize URL
// the caller must deliver via private channel (Lark DM, etc.) to the sender.
message BindingChallenge {
  // Fully-formed OAuth authorize URL with PKCE + HMAC-signed state token.
  string authorize_url = 1;
  // UNIX seconds-since-epoch when the challenge state_token expires.
  int64 expires_at_unix = 2;
  // True when /init is renewing service authorization by issuing a new
  // binding that may replace the current binding after callback validation.
  bool renews_existing_binding = 3;
}

enum ManagedCodexCredentialStatus {
  MANAGED_CODEX_CREDENTIAL_STATUS_UNSPECIFIED = 0;
  MANAGED_CODEX_CREDENTIAL_STATUS_ACTIVE = 1;
  MANAGED_CODEX_CREDENTIAL_STATUS_REVOKED = 2;
}

message ManagedCodexCredentialDescriptor {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef owner = 1;
  string api_key_id = 2;
  aevatar.credentials.SecretReference secret_reference = 3;
  string chrono_sandbox_user_service_id = 4;
  string chrono_sandbox_service_slug = 5;
  google.protobuf.Timestamp expires_at = 6;
  ManagedCodexCredentialStatus status = 7;
  string chrono_llm_user_service_id = 8;
}

enum ManagedCodexCredentialReadinessEvidence {
  MANAGED_CODEX_CREDENTIAL_READINESS_EVIDENCE_UNSPECIFIED = 0;
  MANAGED_CODEX_CREDENTIAL_READINESS_EVIDENCE_CURRENT_STATE_CONFIRMED = 1;
  MANAGED_CODEX_CREDENTIAL_READINESS_EVIDENCE_REMOTE_VALIDATED = 2;
}

message ManagedCodexCredentialSnapshot {
  ManagedCodexCredentialDescriptor credential = 1;
  repeated ManagedCodexCredentialCleanup pending_revocations = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  ManagedCodexCredentialReadinessEvidence readiness_evidence = 5;
}

message ManagedCodexCredentialCleanup {
  string api_key_id = 1;
  string secret_ref = 2;
  bool nyx_id_pending = 3;
  bool vault_pending = 4;
  google.protobuf.Timestamp requested_at = 5;
}

enum ManagedCodexCredentialCleanupTrack {
  MANAGED_CODEX_CREDENTIAL_CLEANUP_TRACK_UNSPECIFIED = 0;
  MANAGED_CODEX_CREDENTIAL_CLEANUP_TRACK_NYX_ID = 1;
  MANAGED_CODEX_CREDENTIAL_CLEANUP_TRACK_VAULT = 2;
}
