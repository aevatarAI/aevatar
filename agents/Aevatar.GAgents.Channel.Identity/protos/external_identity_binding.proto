syntax = "proto3";

package aevatar.gagents.channel.identity;

option csharp_namespace = "Aevatar.GAgents.Channel.Identity";

import "google/protobuf/timestamp.proto";
import "channel_contracts.proto";

// Per-(platform, tenant, external_user_id) actor state holding the opaque
// NyxID-side binding pointer. Holds NO refresh_token or any user secret —
// see ADR-0018 §Storage Boundary. binding_id is empty when no active binding;
// revoked_at is set when the most recent binding was revoked.
message ExternalIdentityBindingState {
  // Redundant with the actor's deterministic key derived from the same triple
  // via ExternalSubjectRefExtensions.ToActorId. Kept here for projection
  // ergonomics so the readmodel does not need to parse the actor id back into
  // a typed ExternalSubjectRef. ApplyBound only sets this on the first bind
  // and never overwrites it (ADR-0018 L58 review: actor identity invariant).
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  // Opaque pointer issued by NyxID broker. Empty when no active binding
  // (initial state, or after revoke). Source of truth lives in NyxID.
  string binding_id = 2;
  google.protobuf.Timestamp bound_at = 3;
  google.protobuf.Timestamp revoked_at = 4;
  // Superseded or unadopted NyxID bindings awaiting best-effort upstream
  // revocation. Keeping this work in actor state makes cleanup recoverable
  // after process failure without making an in-memory reconciler authoritative.
  repeated string pending_retirement_binding_ids = 5;
  // Canonical business-data owner scope resolved from the NyxID account bound
  // by this external subject. Separate from registration/channel scope.
  string owner_scope_id = 6;
}

// Issued by the OAuth callback handler after exchanging the authorization code
// for a binding_id. Idempotent at the actor: discarded when state already
// holds an active binding_id (concurrent /init protection,
// ADR-0018 §Implementation Notes #2).
message CommitBindingCommand {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  string binding_id = 2;
  string owner_scope_id = 3;
}

// Issued by the /unbind handler after a successful NyxID DELETE call, or by
// the turn path on `invalid_grant` from token-exchange. When state has no
// active binding, the actor leaves binding facts unchanged. Stale readmodel
// repair belongs to projection lifecycle / maintenance, not this command.
message RevokeBindingCommand {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  // Free-form reason for audit (e.g. "user_unbind", "nyx_invalid_grant",
  // "admin_revoke"). Intended for audit log only — not surfaced to senders.
  string reason = 2;
}

// Issued after a fresh authorization-code exchange returns a verified binding
// that should replace the current binding. expected_previous_binding_id gives
// the owning actor compare-and-swap semantics, so a stale callback cannot
// overwrite a newer binding selected by another authorization flow.
message ReplaceBindingCommand {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  string binding_id = 2;
  string expected_previous_binding_id = 3;
  string reason = 4;
  string owner_scope_id = 5;
}

// Operator/maintenance command: re-materialize the current-state readmodel for
// this binding from the surviving authoritative actor state — without minting or
// changing any binding_id and without appending a new domain event. Recovers a
// wiped/reset projection readmodel (disaster recovery) whose authoritative actor
// state survived. When the actor holds no active binding_id it is a no-op.
message RebuildBindingProjectionCommand {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
}

// Persisted when CommitBindingCommand is accepted by the actor.
message ExternalIdentityBoundEvent {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  string binding_id = 2;
  google.protobuf.Timestamp bound_at = 3;
  string owner_scope_id = 4;
}

// Persisted when an active binding is atomically replaced. Applying the event
// makes binding_id current and queues previous_binding_id for upstream cleanup.
message ExternalIdentityBindingReplacedEvent {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  string previous_binding_id = 2;
  string binding_id = 3;
  google.protobuf.Timestamp replaced_at = 4;
  string reason = 5;
  string owner_scope_id = 6;
}

// Persisted when a newly issued binding loses a compare-and-swap race and was
// therefore never adopted. The actor retains it until NyxID revocation succeeds.
message ExternalIdentityBindingRetirementQueuedEvent {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  string binding_id = 2;
  google.protobuf.Timestamp queued_at = 3;
  string reason = 4;
}

// Persisted only after NyxID confirms a superseded/unadopted binding is revoked
// (404/410 are treated as already retired by the infrastructure adapter).
message ExternalIdentityBindingRetiredEvent {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  string binding_id = 2;
  google.protobuf.Timestamp retired_at = 3;
}

// Persisted when RevokeBindingCommand is accepted by the actor.
message ExternalIdentityBindingRevokedEvent {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 1;
  google.protobuf.Timestamp revoked_at = 2;
  string reason = 3;
}

// Tombstone for the removed projection-only event. Keep its message name and
// field numbers reserved so old event-store payloads remain replay-safe and
// future events cannot reuse the same wire shape accidentally.
message ExternalIdentityBindingProjectionRebuildRequestedEvent {
  reserved 1, 2;
  reserved "reason", "requested_at";
}

// Stateless OAuth `state` token payload (HMAC-sealed, never in grain state).
// Carries the correlation id, the originating external subject, the PKCE
// verifier, and the absolute expiry. See ADR-0018 §Implementation Notes #1.
message StateTokenPayload {
  string correlation_id = 1;
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 2;
  string pkce_verifier = 3;
  google.protobuf.Timestamp expires_at = 4;
  // SHA-256 of the expected current binding_id for a grant-review flow. The
  // raw opaque binding credential must never be placed in browser-visible state.
  string expected_binding_hash = 5;
}

// Read model: one document per actor (= per ExternalSubjectRef). Backs
// IExternalIdentityBindingQueryPort.ResolveAsync. The id field equals the
// actor id (ExternalSubjectRefExtensions.ToActorId), so resolving from a
// subject is a direct primary-key lookup. revoked_at_utc_value is set when
// the binding has been revoked; an "active" binding has binding_id non-empty
// and revoked_at_utc_value unset.
message ExternalIdentityBindingDocument {
  // Actor id (= ExternalSubjectRef.ToActorId). Primary key.
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  // Stored as the typed subject so consumers can read fields without parsing
  // the actor id.
  aevatar.gagents.channel.abstractions.ExternalSubjectRef external_subject = 5;
  // Empty when no active binding (initial state, or after revoke).
  string binding_id = 6;
  google.protobuf.Timestamp bound_at_utc_value = 7;
  google.protobuf.Timestamp revoked_at_utc_value = 8;
  string owner_scope_id = 9;
}
