syntax = "proto3";

package aevatar.gagents.channel.identity;

option csharp_namespace = "Aevatar.GAgents.Channel.Identity";

import "google/protobuf/timestamp.proto";
import "channel_contracts.proto";
import "identity_contracts.proto";

message ManagedCodexCredentialState {
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor credential = 1;
  repeated aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup pending_revocations = 2;
  google.protobuf.Timestamp revoked_at = 3;
}

message CommitManagedCodexCredentialProvisionedCommand {
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor credential = 1;
  repeated aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup obsolete_credential_cleanups = 2;
}

message CommitManagedCodexCredentialRotatedCommand {
  string expected_previous_api_key_id = 1;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor credential = 2;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup previous_credential_cleanup = 3;
  repeated aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup obsolete_credential_cleanups = 4;
}

message CommitManagedCodexCredentialPolicyReconciledCommand {
  string expected_api_key_id = 1;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor credential = 2;
  repeated aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup obsolete_credential_cleanups = 3;
}

message ConfirmManagedCodexCredentialReadinessCommand {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef owner = 1;
  string expected_api_key_id = 2;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialReadinessEvidence readiness_evidence = 3;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor expected_credential = 4;
}

message CommitManagedCodexCredentialRevokedCommand {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef owner = 1;
  string expected_api_key_id = 2;
  google.protobuf.Timestamp revoked_at = 3;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup cleanup = 4;
}

message QueueManagedCodexCredentialCleanupCommand {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef owner = 1;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup cleanup = 2;
}

message CompleteManagedCodexCredentialCleanupTrackCommand {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef owner = 1;
  string api_key_id = 2;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanupTrack track = 3;
  google.protobuf.Timestamp completed_at = 4;
  string secret_ref = 5;
}

message ManagedCodexCredentialProvisionedEvent {
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor credential = 1;
  repeated aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup obsolete_credential_cleanups = 2;
}

message ManagedCodexCredentialRotatedEvent {
  string previous_api_key_id = 1;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor credential = 2;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup previous_credential_cleanup = 3;
  repeated aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup obsolete_credential_cleanups = 4;
}

message ManagedCodexCredentialPolicyReconciledEvent {
  string api_key_id = 1;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor credential = 2;
  repeated aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup obsolete_credential_cleanups = 3;
}

message ManagedCodexCredentialReadinessConfirmedEvent {
  string api_key_id = 1;
  google.protobuf.Timestamp verified_at = 2;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialReadinessEvidence readiness_evidence = 3;
}

message ManagedCodexCredentialRevokedEvent {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef owner = 1;
  google.protobuf.Timestamp revoked_at = 2;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup cleanup = 3;
}

message ManagedCodexCredentialCleanupQueuedEvent {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef owner = 1;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup cleanup = 2;
}

message ManagedCodexCredentialCleanupTrackCompletedEvent {
  aevatar.gagents.channel.abstractions.ExternalSubjectRef owner = 1;
  string api_key_id = 2;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanupTrack track = 3;
  google.protobuf.Timestamp completed_at = 4;
  string secret_ref = 5;
}

message ManagedCodexCredentialDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialDescriptor credential = 5;
  repeated aevatar.gagents.channel.identity.abstractions.ManagedCodexCredentialCleanup pending_revocations = 6;
  google.protobuf.Timestamp revoked_at = 7;
}
