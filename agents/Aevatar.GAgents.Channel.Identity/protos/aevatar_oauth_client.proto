syntax = "proto3";

package aevatar.gagents.channel.identity;

option csharp_namespace = "Aevatar.GAgents.Channel.Identity";

import "google/protobuf/timestamp.proto";
import "Credentials/credential_secret_references.proto";

// Cluster-singleton state for the aevatar host's own OAuth client registration
// against NyxID. Persisted by AevatarOAuthClientGAgent (well-known id
// "aevatar-oauth-client") so every silo in the cluster shares the same
// client_id and HMAC key — no appsettings, no secrets store, no per-host
// drift. See ADR-0017 §Implementation Notes #1 for the HMAC key invariant.
message AevatarOAuthClientState {
  reserved 28, 29;
  reserved "default_service_slugs", "provisioning_retry_default_service_slugs";
  // Opaque OAuth client_id returned by NyxID's RFC 7591 dynamic registration
  // endpoint. Empty when not yet provisioned.
  string client_id = 1;
  // UNIX seconds-since-epoch when NyxID issued the client registration.
  int64 client_id_issued_at_unix = 2;
  // Current HMAC key bytes used by StateTokenCodec to seal the OAuth state
  // token. Generated by the actor on first activation; rotated by
  // RotateAevatarOAuthClientHmacKeyCommand. Never leaves the cluster.
  bytes hmac_key = 3;
  // UNIX seconds-since-epoch when the current HMAC key was generated.
  int64 hmac_key_rotated_at_unix = 4;
  // NyxID base URL the client_id was registered against. Stored so a future
  // change to the runtime authority is detected (the actor MUST re-provision
  // if the authority changes).
  string nyxid_authority = 5;
  // Whether the broker capability flag has been observed enabled on this
  // client at NyxID. Updated by the OAuth callback when token responses
  // include a binding_id (broker_capability_enabled=true on the NyxID side).
  bool broker_capability_observed = 6;
  // UNIX seconds-since-epoch of the last successful broker observation.
  int64 broker_capability_observed_at_unix = 7;
  // Current key id (e.g. "v1", "v2"). Carried in the state-token header so
  // verifiers can pick the right key during a rotation grace window.
  string hmac_kid = 8;
  // Previous HMAC key + kid kept for the grace window so a `state` token
  // signed by the prior key still verifies for state_token_lifetime after
  // rotation (PR #521 review v4-pro). Empty when no rotation has happened
  // since first provision.
  bytes previous_hmac_key = 9;
  string previous_hmac_kid = 10;
  // UNIX seconds-since-epoch when previous_hmac_key was demoted from current.
  // Verifiers must reject previous_hmac_key once now() > demoted_at +
  // state_token_lifetime so the previous-key window cannot persist past the
  // longest-lived in-flight state token.
  int64 previous_hmac_demoted_at_unix = 11;
  // Redirect URI registered with NyxID at DCR. Persisted so
  // HandleEnsureProvisioned can detect drift across redeploys (e.g.
  // operator sets AEVATAR_OAUTH_REDIRECT_BASE_URL after the cluster was
  // first bootstrapped against an internal listening URL) and re-register
  // the OAuth client; otherwise NyxID would keep the wrong callback target
  // forever. Empty means legacy/unknown and forces one re-DCR on the next
  // EnsureProvisioned command so existing broken clients are healed.
  string redirect_uri = 12;
  // OAuth authorization scopes registered/requested for this client. Empty
  // means legacy/unknown and forces one re-DCR on the next EnsureProvisioned
  // command so existing clients missing the proxy scope are healed.
  string oauth_scope = 13;
  // Actor-owned OAuth provisioning retry facts. Empty/zero means no retry is
  // pending. These facts are control-flow state, so they are typed fields
  // instead of a generic bag.
  int32 provisioning_retry_attempt = 14;
  int64 provisioning_retry_due_unix_ms = 15;
  string provisioning_retry_authority = 16;
  string provisioning_retry_redirect_uri = 17;
  string provisioning_retry_client_name = 18;
  string provisioning_retry_callback_id = 19;
  int64 provisioning_retry_callback_generation = 20;
  string provisioning_retry_last_error = 21;
  // Full redirect URI allowlist that must be registered at NyxID for the
  // active client_id. redirect_uri remains the canonical backend callback used
  // by the broker callback flow; this list also includes explicitly configured
  // external callbacks such as the Console SPA /auth/callback route.
  repeated string redirect_uris = 22;
  // Full redirect URI allowlist captured for an actor-owned provisioning retry.
  repeated string provisioning_retry_redirect_uris = 23;
  // Whether the pending actor-owned provisioning retry must preserve a
  // break-glass force-DCR intent.
  bool provisioning_retry_force_reprovision = 24;
  // Actor-side one-shot guard for the startup force-DCR switch. Set after one
  // forced DCR succeeds so multi-silo startup broadcasts cannot create one
  // NyxID client per silo. Cleared by the next normal (non-force) ensure after
  // operators remove AEVATAR_OAUTH_FORCE_DCR_ON_STARTUP.
  bool force_reprovision_consumed = 25;
  // Secret-vault reference for the current HMAC signing key. New writes
  // populate this and leave [hmac_key] empty; the projection provider
  // resolves the key material from ISecretVault at read time. Legacy state
  // carries the plaintext key in [hmac_key] with this ref unset — the
  // provider falls back to the legacy bytes (dual-read migration).
  aevatar.credentials.SecretReference hmac_key_ref = 26;
  // Secret-vault reference for the demoted previous HMAC key kept for the
  // rotation grace window. Set only when a rotation demoted an existing
  // ref-backed key; empty on initial seed and for legacy state.
  aevatar.credentials.SecretReference previous_hmac_key_ref = 27;
  // Last successfully applied operator rotation request. Business idempotency
  // is actor-owned because transport envelope ids change when a lost 202 is retried.
  string last_hmac_rotation_idempotency_key = 30;
}

// Issued by the bootstrap startup service from every silo on cluster cold-
// boot. The actor's single-threaded handler turns the command into one DCR
// call (or a no-op when already provisioned) so racing silos cannot create
// duplicate OAuth clients at NyxID — see PR #521 review (codex/k2p6/v4-pro
// consensus on the cold-boot race).
message EnsureAevatarOAuthClientProvisionedCommand {
  reserved 6;
  reserved "default_service_slugs";
  string nyxid_authority = 1;
  string redirect_uri = 2;
  // Optional override for the legacy explicit DCR command path.
  string client_name = 3;
  // Full redirect URI allowlist to register at NyxID. Empty means legacy caller;
  // the actor falls back to [redirect_uri].
  repeated string redirect_uris = 4;
  // Break-glass: force DCR even when stored state appears provisioned. Operators
  // must disable the startup env switch after one successful run to avoid
  // creating a new NyxID client on every restart.
  bool force_reprovision = 5;
}

// Durable self-callback payload fired when an actor-owned OAuth provisioning
// retry becomes due. The actor validates it against typed retry facts before
// re-entering the DCR path.
message AevatarOAuthClientProvisioningRetryFiredEvent {
  reserved 11;
  reserved "default_service_slugs";
  int32 attempt = 1;
  int64 due_unix_ms = 2;
  string nyxid_authority = 3;
  string redirect_uri = 4;
  string client_name = 5;
  string callback_id = 6;
  int64 callback_generation = 7;
  int64 fired_at_unix_ms = 8;
  repeated string redirect_uris = 9;
  bool force_reprovision = 10;
}

// Issued by configured host bootstrap, operator reconciliation, and tests that
// already hold a client_id. The actor materializes the supplied deployment
// fact without calling DCR.
message ProvisionAevatarOAuthClientCommand {
  reserved 7;
  reserved "default_service_slugs";
  string client_id = 1;
  int64 client_id_issued_at_unix = 2;
  string nyxid_authority = 3;
  // Optional diagnostic scope for manually provisioned clients. Bootstrap
  // never uses this command path; an empty value means unknown. The
  // Configured bootstrap and operator reconciliation set this to
  // AevatarOAuthClientScopes.AuthorizationScope.
  string oauth_scope = 4;
  // Optional redirect URI. The operator-rebuild path (POST /api/oauth/
  // aevatar-client/rebuild) sets this to the resolver output. Tests / fixture
  // seeds may leave it empty when they do not exercise callback validation.
  string redirect_uri = 5;
  // Full redirect URI allowlist pinned for the supplied client_id. Empty means
  // preserve existing list or fall back to [redirect_uri] for legacy callers.
  repeated string redirect_uris = 6;
}

// Issued by ops to force a fresh HMAC key rotation. Old tokens signed with
// the previous key fail decode after the next provision; production rolls
// out via grace window.
message RotateAevatarOAuthClientHmacKeyCommand {
  string idempotency_key = 1;
  string expected_current_kid = 2;
}

// Issued by the operator rebuild endpoint: re-materialize the wiped/reset
// current-state readmodel from the surviving actor state. Appends no event
// and changes no OAuth client fact — disaster recovery only.
message RebuildAevatarOAuthClientProjectionCommand {}

// Issued by the OAuth callback handler when it observes binding_id in the
// token response — confirmation that NyxID admin has enabled
// broker_capability_enabled on this client.
message ObserveBrokerCapabilityCommand {}

// Tombstone for the removed projection-only event. Keep its message name and
// field numbers reserved so old event-store payloads remain replay-safe and
// future events cannot reuse the same wire shape accidentally.
message AevatarOAuthClientProjectionRebuildRequestedEvent {
  reserved 1, 2;
  reserved "reason", "requested_at";
}

// Persisted after a failed actor-owned provisioning attempt schedules a
// durable self-callback for the next retry.
message AevatarOAuthClientProvisioningRetryScheduledEvent {
  reserved 12;
  reserved "default_service_slugs";
  int32 attempt = 1;
  int64 due_unix_ms = 2;
  string nyxid_authority = 3;
  string redirect_uri = 4;
  string client_name = 5;
  string callback_id = 6;
  int64 callback_generation = 7;
  string last_error = 8;
  google.protobuf.Timestamp scheduled_at = 9;
  repeated string redirect_uris = 10;
  bool force_reprovision = 11;
}

// Persisted when provisioning reaches a terminal successful branch and the
// actor no longer owns a pending retry.
message AevatarOAuthClientProvisioningRetryClearedEvent {
  string reason = 1;
  google.protobuf.Timestamp cleared_at = 2;
}

// Persisted when the actor consumes or resets the one-shot startup force-DCR
// guard. This keeps AEVATAR_OAUTH_FORCE_DCR_ON_STARTUP cluster-idempotent
// across multi-silo bootstrap broadcasts while allowing a later normal startup
// to reset the guard after operators remove the env var.
message AevatarOAuthClientForceReprovisionConsumedEvent {
  bool consumed = 1;
  google.protobuf.Timestamp persisted_at = 2;
}

// Persisted when actor-owned drift reconciliation succeeds through DCR.
message AevatarOAuthClientDriftReconciledEvent {
  string drift_kind = 1;
  string previous_value = 2;
  string expected_value = 3;
  string active_client_id = 4;
  google.protobuf.Timestamp reconciled_at = 5;
}

// Persisted on successful provision. Carries the client_id + issuance
// timestamp + authority + redirect_uri so the projector can materialize
// the readmodel and so the actor can detect redirect-uri drift across
// redeploys.
message AevatarOAuthClientProvisionedEvent {
  reserved 8;
  reserved "default_service_slugs";
  string client_id = 1;
  int64 client_id_issued_at_unix = 2;
  string nyxid_authority = 3;
  google.protobuf.Timestamp persisted_at = 4;
  // Redirect URI registered with NyxID at this DCR call. Empty when an
  // older event predates the redirect-uri-tracking field; the actor
  // treats empty stored redirect_uri as legacy/unknown and re-DCRs once on
  // the next EnsureProvisioned command.
  string redirect_uri = 5;
  // Scopes requested at DCR/authorize time for this OAuth client. Empty when
  // an older event predates scope tracking; the actor treats empty as
  // legacy/unknown and re-DCRs once so proxy-capable bindings can be minted.
  string oauth_scope = 6;
  // Full redirect URI allowlist registered with NyxID at this DCR call.
  repeated string redirect_uris = 7;
}

// Persisted when the actor seeds or rotates its HMAC key. On rotation, the
// previous key + kid are demoted to the grace-window slot; on initial seed
// the previous_* fields are empty.
message AevatarOAuthClientHmacKeyRotatedEvent {
  bytes hmac_key = 1;
  int64 rotated_at_unix = 2;
  google.protobuf.Timestamp persisted_at = 3;
  string hmac_kid = 4;
  bytes previous_hmac_key = 5;
  string previous_hmac_kid = 6;
  int64 previous_hmac_demoted_at_unix = 7;
  // Secret-vault reference for the newly-generated HMAC key. New writes set
  // this and leave [hmac_key] empty; the reducer copies the ref into state.
  aevatar.credentials.SecretReference hmac_key_ref = 8;
  // Secret-vault reference for the demoted previous key on rotation. Empty on
  // initial seed and when the demoted key was legacy plaintext-only.
  aevatar.credentials.SecretReference previous_hmac_key_ref = 9;
  string idempotency_key = 10;
}

// Persisted when the OAuth callback observes the broker capability for
// the first time after a provision (or after a re-provision against a new
// authority).
message AevatarOAuthClientBrokerCapabilityObservedEvent {
  int64 observed_at_unix = 1;
  google.protobuf.Timestamp persisted_at = 2;
}

// Read model: one document for the cluster-singleton AevatarOAuthClientGAgent.
// Backs IAevatarOAuthClientProvider.GetAsync. id == well-known actor id.
//
// hmac_key + previous_hmac_key bytes mirror into the projection — see ADR-
// 0018 §Implementation Notes #1 for the explicit security tradeoff
// (state-token TTL ≤ 5 min, rotation command available, projection store
// access boundary equals actor event-store boundary). Production deployments
// MUST keep ES index `aevatar-oauth-client-*` access scoped to the same
// services that can read grain events.
message AevatarOAuthClientDocument {
  reserved 21;
  reserved "default_service_slugs";
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  string client_id = 5;
  int64 client_id_issued_at_unix = 6;
  bytes hmac_key = 7;
  int64 hmac_key_rotated_at_unix = 8;
  string nyxid_authority = 9;
  bool broker_capability_observed = 10;
  int64 broker_capability_observed_at_unix = 11;
  // Current key id; stays in sync with the actor's State.HmacKid. The codec
  // emits this as the kid header on outbound state tokens.
  string hmac_kid = 12;
  // Demoted previous key + kid kept for the rotation grace window so a
  // state token signed with the prior key still verifies for
  // state_token_lifetime after rotation (PR #521 review v4-pro on rotation).
  bytes previous_hmac_key = 13;
  string previous_hmac_kid = 14;
  // UNIX seconds when the previous key was demoted. Verifiers must reject it
  // once now() > demoted_at + state_token_lifetime so the previous-key
  // window cannot persist past the longest-lived in-flight state token.
  int64 previous_hmac_demoted_at_unix = 15;
  // Mirror of AevatarOAuthClientState.redirect_uri so the readmodel can
  // expose it for diagnostics (e.g. /api/oauth/aevatar-client/status) and
  // so an operator can confirm DCR registered the right callback target
  // without inspecting actor state directly.
  string redirect_uri = 16;
  // Mirror of AevatarOAuthClientState.oauth_scope for diagnostics and
  // bootstrap drift detection.
  string oauth_scope = 17;
  // Mirror of AevatarOAuthClientState.redirect_uris for diagnostics and drift
  // detection of explicitly configured external callbacks.
  repeated string redirect_uris = 18;
  // Secret-vault reference for the current HMAC key mirrored from state. When
  // set, AevatarOAuthClientProjectionProvider resolves the key material from
  // ISecretVault; legacy documents carry the plaintext key in [hmac_key] with
  // this ref unset (dual-read migration).
  aevatar.credentials.SecretReference hmac_key_ref = 19;
  // Secret-vault reference for the demoted previous HMAC key mirrored from
  // state for the rotation grace window.
  aevatar.credentials.SecretReference previous_hmac_key_ref = 20;
}
