syntax = "proto3";

package aevatar.gagents.channel.runtime;

option csharp_namespace = "Aevatar.GAgents.Channel.Runtime";

import "google/protobuf/empty.proto";
import "chat_activity.proto";
import "channel_contracts.proto";

message OutboundDeliveryReceipt {
  string reply_message_id = 1;
}

message ConversationTurnCompletedEvent {
  string processed_activity_id = 1;
  string causation_command_id = 2;
  string sent_activity_id = 3;
  string auth_principal = 4;
  aevatar.gagents.channel.abstractions.ConversationReference conversation = 5;
  aevatar.gagents.channel.abstractions.MessageContent outbound = 6;
  int64 completed_at_unix_ms = 7;
  OutboundDeliveryReceipt outbound_delivery = 8;
}

message NeedsLlmReplyEvent {
  string correlation_id = 1;
  string target_actor_id = 2;
  string registration_id = 3;
  aevatar.gagents.channel.abstractions.ChatActivity activity = 4;
  map<string, string> metadata = 5;
  int64 requested_at_unix_ms = 6;
  // Transient run-command-only credential. The actor MUST clear `reply_token` and
  // `reply_token_expires_at_unix_ms` (set them to the empty default) on the
  // copy passed to PersistDomainEventAsync; only the run-bound copy may
  // carry them so AgentRunGAgent can echo the credential back without the
  // actor's in-memory dict surviving deactivation. Never persist to event
  // store, projection, or read model.
  string reply_token = 7;
  int64 reply_token_expires_at_unix_ms = 8;
}

// Transient actor-inbox envelope used by the NyxID relay endpoint to hand a single
// inbound callback turn to ConversationGAgent together with the short-lived reply
// credential. The actor MUST NOT persist this message or any of its fields into
// event store, projection, read model, or any durable state. The handler is
// expected to immediately move `reply_token` and `reply_token_expires_at_unix_ms`
// into actor-owned in-memory runtime state (keyed by `correlation_id`) and only
// persist downstream domain events that omit the reply credential entirely.
message NyxRelayInboundActivity {
  aevatar.gagents.channel.abstractions.ChatActivity activity = 1;
  string reply_token = 2;
  int64 reply_token_expires_at_unix_ms = 3;
  string correlation_id = 4;
}

enum LlmReplyTerminalState {
  LLM_REPLY_TERMINAL_STATE_UNSPECIFIED = 0;
  LLM_REPLY_TERMINAL_STATE_COMPLETED = 1;
  LLM_REPLY_TERMINAL_STATE_FAILED = 2;
}

message LlmReplyReadyEvent {
  string correlation_id = 1;
  string registration_id = 2;
  string source_actor_id = 3;
  aevatar.gagents.channel.abstractions.ChatActivity activity = 4;
  aevatar.gagents.channel.abstractions.MessageContent outbound = 5;
  LlmReplyTerminalState terminal_state = 6;
  string error_code = 7;
  string error_summary = 8;
  int64 ready_at_unix_ms = 9;
  // Transient run-echoed credential carried back from AgentRunGAgent so the
  // actor's outbound relay reply does not depend on its in-memory token dict
  // surviving deactivation. The actor consumes these fields directly and never
  // persists them. AgentRunGAgent copies the values from the inbound
  // NeedsLlmReplyEvent verbatim.
  string reply_token = 10;
  int64 reply_token_expires_at_unix_ms = 11;
}

// Per-delta streaming signal dispatched from AgentRunGAgent to the conversation actor while
// the reply is still being generated. The actor owns the outbound reply credential and the
// placeholder message identifier for the turn, so it must be the one issuing the relay placeholder
// send and subsequent edit calls. This message carries only the cumulative accumulated text for
// the current delta; the actor tracks streaming state (placeholder message id, disabled flag)
// in-memory keyed by `correlation_id`. This event must never be persisted — it is a runtime-only
// signal.
message LlmReplyStreamChunkEvent {
  // Field 6 (`card_mode`) was a runtime-only routing flag that has been promoted to its own
  // message type (`LlmReplyCardStreamChunkEvent`) so the structural contract of this domain-
  // event-shaped envelope no longer carries any "should I re-route to a different sink?"
  // signal. Reserved here so accidental reuse of the field number, or a stale serializer
  // built before the split, fails loudly instead of silently flipping back to card mode.
  reserved 6;
  reserved "card_mode";

  string correlation_id = 1;
  string registration_id = 2;
  // Clone of the inbound activity so the actor/turn runner can resolve the platform, conversation,
  // and outbound delivery without re-reading from durable state.
  aevatar.gagents.channel.abstractions.ChatActivity activity = 3;
  // Current accumulated reply text (not a delta slice). Each chunk supersedes the previous one.
  string accumulated_text = 4;
  int64 chunk_at_unix_ms = 5;
}

// Per-delta streaming signal for the Lark CardKit (card-mode) outbound path. Identical
// payload to LlmReplyStreamChunkEvent, but a separate proto type so the routing decision is
// structural: there is no boolean a misbehaving persistence layer can flip — the actor's
// HandleLlmReplyCardStreamChunkAsync handler is reachable only via this type. Like its
// edit-message sibling, this event is a runtime-only signal and must never be persisted to
// the event store, projection, or any durable state.
message LlmReplyCardStreamChunkEvent {
  string correlation_id = 1;
  string registration_id = 2;
  // Clone of the inbound activity so the actor/runner can resolve the platform, conversation,
  // delivery context, and TransportExtras (NyxUserAccessToken, NyxLarkChatId, NyxLarkUnionId)
  // without re-reading from durable state.
  aevatar.gagents.channel.abstractions.ChatActivity activity = 3;
  // Current accumulated reply text (not a delta slice). Each chunk supersedes the previous one.
  string accumulated_text = 4;
  int64 chunk_at_unix_ms = 5;
}

message DeferredLlmReplyDispatchRequestedEvent {
  string correlation_id = 1;
  int64 requested_at_unix_ms = 2;
}

// Actor self-message fired by the durable scheduler when an inbound turn retry
// is due. The handler looks up `activity_id` in
// ConversationGAgentState.pending_inbound_turns, rebuilds the runtime context
// from the in-memory reply-token dict, and re-invokes the turn runner.
message DeferredInboundTurnRetryRequestedEvent {
  string activity_id = 1;
  int64 requested_at_unix_ms = 2;
}

// Persisted alongside each retry scheduling so that (a) pending_inbound_turns is
// driven through the standard state matcher pipeline and (b) actor rehydration
// after deactivation can walk the pending set and re-register durable timeouts.
message InboundTurnRetryScheduledEvent {
  string activity_id = 1;
  aevatar.gagents.channel.abstractions.ChatActivity activity = 2;
  int32 retry_count = 3;
  int64 first_failed_unix_ms = 4;
  int64 next_retry_unix_ms = 5;
  int64 scheduled_at_unix_ms = 6;
}

message NyxRelayReplyTokenCleanupRequestedEvent {
  string correlation_id = 1;
  int64 requested_at_unix_ms = 2;
}

// Sent by AgentRunGAgent when its pre-LLM gates (stale age,
// missing relay credential, malformed payload) refuse to process a deferred
// LLM reply. The actor consumes this to retire the matching pending entry
// from State.PendingLlmReplyRequests via a NotRetryable
// ConversationContinueFailedEvent, so the request never silently
// accumulates in actor state.
message DeferredLlmReplyDroppedEvent {
  string correlation_id = 1;
  string reason = 2;
  int64 dropped_at_unix_ms = 3;
}

message ConversationContinueRequestedEvent {
  string command_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  aevatar.gagents.channel.abstractions.PrincipalKind kind = 4;
  string principal_ref = 5;
  string on_behalf_of_user_id = 6;
  aevatar.gagents.channel.abstractions.ConversationReference conversation = 7;
  aevatar.gagents.channel.abstractions.MessageContent payload = 8;
  int64 dispatched_at_unix_ms = 9;
}

message ConversationContinueRejectedEvent {
  string command_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  RejectReason reason = 4;
  string reason_detail = 5;
  int64 rejected_at_unix_ms = 6;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_DUPLICATE_COMMAND = 1;
  REJECT_REASON_CONVERSATION_NOT_FOUND = 2;
  REJECT_REASON_CREDENTIAL_REF_INVALID = 3;
  REJECT_REASON_CREDENTIAL_REVOKED_OR_EXPIRED = 4;
  REJECT_REASON_PRINCIPAL_NOT_AUTHORIZED = 5;
}

message ConversationContinueFailedEvent {
  string command_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  FailureKind kind = 4;
  string error_code = 5;
  string error_summary = 6;
  oneof retry_policy {
    google.protobuf.Empty not_retryable = 7;
    int64 retry_after_ms = 8;
  }
  int64 failed_at_unix_ms = 9;
}

enum FailureKind {
  FAILURE_KIND_UNSPECIFIED = 0;
  FAILURE_KIND_TRANSIENT_ADAPTER_ERROR = 1;
  FAILURE_KIND_PERMANENT_ADAPTER_ERROR = 2;
  FAILURE_KIND_CREDENTIAL_RESOLUTION_FAILED = 3;
  FAILURE_KIND_PLATFORM_UNAVAILABLE = 4;
}

// Persisted by ConversationGAgent after the channel sink (e.g. Lark
// edit_message) has ack'd the final reply chunk. Drives
// ConversationGAgentState.last_reply_delivery into the Delivered outcome,
// satisfying chain.delivered per ADR-0021. Single source of user-visible
// delivery truth — downstream readers MUST NOT rely on lark API log lines
// or other side-channel signals.
message LlmReplyDeliveredEvent {
  string correlation_id = 1;
  // AgentRunGAgent run_id producing this reply (used to anchor delivery
  // against a specific committed reply).
  string run_id = 2;
  int64 acked_at_unix_ms = 3;
  // Channel-side message id from the sink ack (e.g. Lark message_id).
  string channel_message_id = 4;
}

// Persisted by ConversationGAgent when the channel sink rejects or times
// out on the reply send/edit. Drives
// ConversationGAgentState.last_reply_delivery into the DeliveryFailed
// outcome. The downstream ConversationContinueFailedEvent is the
// chain-finalizing signal — this event captures the structured cause.
message LlmReplyDeliveryFailedEvent {
  string correlation_id = 1;
  string run_id = 2;
  int64 failed_at_unix_ms = 3;
  string error_code = 4;
  string error_message = 5;
}
