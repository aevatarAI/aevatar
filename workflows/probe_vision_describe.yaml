name: probe_vision_describe
description: >-
  Capability probe — vision/read-image: the user sends an image plus a trigger, the workflow's
  vision role describes it and returns the description as the run output. Used to verify the
  chat-attachment image -> workflow llm_call (vision) path end to end before running real
  image-dependent workflows. No side effects.
when_to_use: Use to verify that an attached image reaches a workflow vision step and the model can actually see it (returns a real description, not "no image received").

# Vision in the workflow path: an Image input part is auto-attached to the llm_call content
# (WorkflowChatRequestEnvelopeFactory + WorkflowRoleGAgent); the role intentionally pins no
# provider/model so it follows the session's default LLM route. PASS = a real description of the
# sent image; FAIL = "no image received" (route not multimodal, or attachment didn't reach the run).

roles:
  - id: vision_probe
    name: Vision Probe
    # vision role: no provider/model — follows the session default route
    system_prompt: >-
      You are an image-description probe. Describe the image attached to the user's message.
      Output STRICT JSON only, no markdown fences: {"saw_image": true|false, "description":
      "<one-sentence description of what is actually in the image>", "dominant_colors":
      "<comma-separated>", "text_in_image": "<any legible text, else empty>"}. If you received
      no image at all, output {"saw_image": false, "description": "no image received", ...} and
      never invent image content.
    allowed_tools: []

steps:
  - id: describe
    type: llm_call
    target_role: vision_probe
    parameters:
      prompt_prefix: "Describe the attached image:"
    next: report

  - id: report
    type: assign
    parameters:
      target: final_summary
      value: "🖼️ vision probe → ${steps.describe.output}"
