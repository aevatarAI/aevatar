name: invoice_ocr_approval
description: >-
  Invoice OCR reimbursement: extract invoice fields from attached invoice images with a vision role, build the
  Lark payment approval body from the contract widget map, submit it through the NyxID proxy, wait for the
  terminal approval status, then return the summary as the run output (chat draft runs stream it back to the
  conversation).
when_to_use: Use when a chat message carries invoice images (plus optional department or remark notes) that should become a Lark invoice payment approval instance.

# 常量唯一来源: ~/Code/n8n-ornn-skills/invoice-ocr-approval-payload-builder/references/invoice-approval-contract.md
# (approval_code / widget ids / option ids / currencyRange / disclaimer / 提交路径逐字拷贝; token 刷新、admin webhook、调试节点按迁移设计排除)
# TODO-verify: 原 n8n 经 /open-apis/contact/v3/users/batch_get_id 解析 user_id 并按部门映射负责人; 本 workflow 直接用会话内 applicant
#   open_id, 负责人按契约默认 deptHeadId=申请人(deptHeadSource=self), 提交路径仍为契约原文 ?user_id_type=user_id。审批附件上传
#   (/approval/v4/files/upload)不在本批范围, 契约允许无 file token 时省略 attachmentV2 widget。

roles:
  - id: invoice_extractor
    name: Invoice Extractor
    # vision role: 不指定 provider/model, 跟随会话默认路由
    system_prompt: >-
      You extract invoice fields from the user's chat message and attached invoice images. Output STRICT JSON
      only, no markdown fences, with fields: applicant_open_id (requester Lark open_id from the message
      context, empty string when unavailable), department (from the user's note, empty string when not given),
      remark (optional user note, empty string when absent), invoices (array; one object per invoice with
      vendor, amount (number), currency, date (YYYY-MM-DD), invoice_number, buyer, description, bank_name,
      bank_account, swift_code; use empty strings for unreadable fields). Currency rules: "S$", a Singapore
      vendor address or "Pte Ltd" imply SGD; explicit "US$"/"USD" imply USD; "RM"/"MYR" imply MYR; "RMB"/"CNY"
      or a mainland China issuer imply CNY; a bare "$" from a Singapore issuer is SGD. Copy amount digits
      exactly as printed; never compute, convert or round amounts. If no invoice image was received, state
      that explicitly and output {"error":"<why the request cannot be parsed>"}; never invent data.
  - id: approval_builder
    name: Approval Builder
    system_prompt: |
      You turn extracted invoice JSON into the exact Lark approval request body. Output STRICT JSON only, no markdown fences, shaped as:
      {"approval_code":"F640097D-0A68-47C1-A7BC-86659BC4B06F","user_id":"<applicant_open_id>","form":"<form array serialized as a JSON string>"}
      The form array is: (1) {"id":"widget17168633868040001","type":"fieldList","value":[<one row array per invoice>]}; (2) {"id":"widget16487161430270001","type":"textarea","value":"<remark widget value>"}. Each invoice row array contains, in order:
      {"id":"widget17168644567560001","type":"contact","value":["<applicant_open_id>"]}
      {"id":"widget17168638060470001","type":"radioV2","value":"lwpsdr33-27z0rv3m3t4-0"}
      {"id":"widget17270803199920001","type":"radioV2","value":"m1er13p8-jy4c1eb1le-0"}
      {"id":"widget17643090840670001","type":"radioV2","value":"miig2pwk-4bx8l7d96pf-0"}
      {"id":"widget17168643792430001","type":"radioV2","value":"lwpsq1d7-72ixwmka1jh-0"}
      {"id":"widget17168645326090001","type":"textarea","value":"<finalDesc> (Invoice: <invoice_number or N/A>)"}
      {"id":"widget17168645408360001","type":"radioV2","value":"lwpsti1z-5ogmo0ul3vb-0"}
      {"id":"widget17168648705100001","type":"amount","value":<amount as number>,"currency":"<currency>","ext":{"currency":"<currency>","currencyRange":["USD","CNY","SGD"]}}
      {"id":"widget16487160384360001","type":"date","value":"<invoice date>T00:00:00Z"}
      {"id":"widget17168661650480001","type":"input","value":"<vendor>"}
      {"id":"widget17168661652050001","type":"input","value":"<bank_name or TBD - please fill>"}
      {"id":"widget17168661653930001","type":"input","value":"<bank_account or TBD - please fill>"}
      {"id":"widget17168661664870001","type":"input","value":"<swift_code or TBD>"}
      {"id":"widget17168769083410001","type":"textarea","value":"<finalDesc>"}
      {"id":"widget17168764909530001","type":"date","value":"<invoice date plus 30 calendar days>T00:00:00Z"}
      finalDesc is the invoice description, otherwise "Payment to <vendor>". The remark widget value is the user
      remark, a blank line, then this exact disclaimer (the disclaimer alone when there is no remark):
      "This approval was auto-generated by AI invoice recognition system. Data was reviewed and confirmed by the submitter before submission."
      Copy amount digits verbatim; never compute, convert or round amounts. The "form" property must be the
      JSON-stringified form array (quotes escaped). If the input is not valid extracted-invoice JSON or
      applicant_open_id is empty, output {"error":"<missing or invalid fields>"} instead; never invent values.

steps:
  - id: extract_invoice
    type: llm_call
    target_role: invoice_extractor
    parameters:
      prompt_prefix: "Extract the invoice approval request from this message:"
    next: route_extract

  - id: route_extract
    type: switch
    parameters:
      on: "${eq(steps.extract_invoice.json.error, '')}"
      branch.true: build_body
      branch.false: report_parse_failed
      branch._default: report_parse_failed
    branches:
      "true": build_body
      "false": report_parse_failed
      _default: report_parse_failed

  - id: build_body
    type: llm_call
    target_role: approval_builder
    parameters:
      prompt_prefix: "Build the Lark approval body from this extracted invoice JSON:"
    next: route_build

  - id: route_build
    type: switch
    parameters:
      on: "${eq(steps.build_body.json.error, '')}"
      branch.true: submit_approval
      branch.false: report_parse_failed
      branch._default: report_parse_failed
    branches:
      "true": submit_approval
      "false": report_parse_failed
      _default: report_parse_failed

  - id: submit_approval
    type: tool_call
    parameters:
      tool: nyxid_proxy
      arguments: '{"slug":"api-lark-bot-2","path":"/open-apis/approval/v4/instances?user_id_type=user_id","method":"POST","body":"${json(input)}"}'
    next: route_submit

  - id: route_submit
    type: switch
    parameters:
      on: "${eq(steps.submit_approval.json.code, 0)}"
      branch.true: extract_data
      branch.false: report_submit_failed
      branch._default: report_submit_failed
    branches:
      "true": extract_data
      "false": report_submit_failed
      _default: report_submit_failed

  - id: extract_data
    type: transform
    parameters:
      op: json_extract
      path: data
    next: set_instance_code

  - id: set_instance_code
    type: assign
    parameters:
      target: instance_code
      value: "${steps.extract_data.json.instance_code}"
    next: wait_approval

  - id: wait_approval
    type: workflow_call
    parameters:
      workflow: lark_approval_wait
      lifecycle: transient
    next: report_result

  - id: report_result
    type: assign
    parameters:
      target: final_summary
      value: "🧾 发票付款审批已提交并到达终态。Instance Code: ${instance_code} / 最终状态: ${input}"

  - id: report_parse_failed
    type: assign
    parameters:
      target: final_summary
      value: "🧾 发票解析或表单构造失败，未能构造出审批数据。返回原文：${input}"

  - id: report_submit_failed
    type: assign
    parameters:
      target: final_summary
      value: "🧾 发票审批提交失败，Lark 返回原文：${input}"
