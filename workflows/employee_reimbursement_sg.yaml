name: employee_reimbursement_sg
description: >-
  SG employee reimbursement (P3): extract invoice fields from chat text and images with a
  vision role, compute per-currency totals deterministically, suspend for human review,
  build the Lark reimbursement approval body from the contract widget map, submit it through
  the NyxID proxy, wait for the terminal approval status, then return the summary as the run
  output. Scope: one submission per run (one fieldList row per invoice); the original n8n
  token-refresh, admin webhooks, duplicate-tracking Bitable state and related-approval serial
  resolution are excluded by design.
when_to_use: Use when a chat message carries SG employee reimbursement invoices (images plus employee / department / payee bank notes) that should be reviewed and become a Lark reimbursement approval instance.

# 常量唯一来源: ~/Code/n8n-ornn-skills/employee-reimbursement-approval-payload-builder/references/employee-reimbursement-contract.md
# (approval_code / widget ids / category & currency option ids / 字段默认规则 / 提交路径 ?user_id_type=user_id 逐字拷贝)
# TODO-verify: 审批附件上传(workflow_file_submit -> 票据 file_code)依赖聊天附件 file-ref 访问表达式, 本批省略;
#   Related Approval(connect widget17165489347490001)需要已解析的 instance code, 用户未提供时省略该 widget。
# CAPABILITY_FIXTURE: submit_approval 的 external capability tuple 仅用于迁移示例。新准入前必须从
# list_external_workflow_capabilities + durable READY result 整体替换 service_id/slug/operation_id/method/path/contract_digest；禁止只改 slug。

roles:
  - id: invoice_extractor
    name: Invoice Extractor
    # vision role: 不指定 provider/model, 跟随会话默认路由
    system_prompt: >-
      You extract an SG employee reimbursement request from the user's chat message and attached
      invoice images. Output STRICT JSON only, no markdown fences, with fields: user_id (requester
      Lark user_id from the message context, empty string when unavailable), employee_name,
      employee_department (default "Finance" when not given), payee_name (default employee_name),
      bank_name, bank_account (empty strings when not given), category_label (one of
      技术服务费/员工福利/差旅费/办公费/Others, default Others), related_approval_instance_code
      (only when the user explicitly provides an approval instance code, else empty string),
      remark (user note, default empty string), invoices (array; one object per invoice with
      date (YYYY-MM-DD), vendor, currency (uppercase, e.g. SGD), amount (number), invoice_number,
      short_description, description; use empty strings for unreadable fields; keep invoice
      descriptions as printed). Copy amount digits exactly as printed; never compute, convert or
      round amounts. If no invoice image and no parsable reimbursement text was received, state
      that explicitly and output {"error":"<why the request cannot be parsed>"}; never invent data.
  - id: approval_builder
    name: Approval Builder
    system_prompt: |
      You turn reviewed SG reimbursement JSON into the exact Lark approval request body. Output STRICT JSON only, no markdown fences, shaped as:
      {"approval_code":"599F145B-9E25-4746-A2DA-7B87DB92AD0F","user_id":"<user_id>","form":"<form array serialized as a JSON string>"}
      The form array is: (1) {"id":"widget17661255766760001","type":"fieldList","value":[<one row array per invoice>]}; (2) {"id":"widget17667289445210001","type":"input","value":"<remark>"}; and, ONLY when related_approval_instance_code is non-empty, (3) {"id":"widget17165489347490001","type":"connect","value":"<related_approval_instance_code>"}. Each invoice row array contains, in order:
      {"id":"widget17675914385750001","type":"input","value":"<employee_department>"}
      {"id":"widget17165475059790001","type":"contact","value":["<user_id>"]}
      {"id":"widget17661256619280001","type":"date","value":"<invoice date>T00:00:00Z"}
      {"id":"widget17165483685010001","type":"radioV2","value":"<category option id>"}
      {"id":"widget17661266428940001","type":"input","value":"<short_description, default vendor>"}
      {"id":"widget17661277169490001","type":"textarea","value":"<description, default short_description>"}
      {"id":"widget17168759377620001","type":"radioV2","value":"<currency option id>"}
      {"id":"widget17661271904410001","type":"amount","value":<amount as number>,"currency":"<currency>"}
      Category option ids: 技术服务费=lwkkktxl-xsh7nzjrjb-9, 员工福利=lwkkktxl-hsb5k4bhad5-5, 差旅费=lwkkktx1-a5eycrbdol7-0, 办公费=lwkkktx1-1lgmf4xvjn2-0, Others=mjch1lsy-kmowo0xjgxc-3. Currency option ids: CNY=lwpzlrza-zoo84ker6o-0, SGD=lwpzlrza-w81tf7okwq-0, USDT=lwpzlrza-ppsossh61bd-0.
      When an invoice date is missing use the first invoice's date; if none exists output {"error":"missing invoice date"}.
      Copy amount digits verbatim; never compute, convert or round amounts. The "form" property must be the
      JSON-stringified form array (quotes escaped). If the input is not valid reviewed-reimbursement JSON or
      user_id is empty, output {"error":"<missing or invalid fields>"} instead; never invent values.

steps:
  - id: extract_request
    type: llm_call
    target_role: invoice_extractor
    parameters:
      prompt_prefix: "Extract the SG employee reimbursement request from this message:"
    next: route_extract

  - id: route_extract
    type: switch
    parameters:
      on: "${eq(steps.extract_request.json.error, '')}"
      branch.true: pick_invoices
      branch.false: report_extract_failed
      branch._default: report_extract_failed
    branches:
      "true": pick_invoices
      "false": report_extract_failed
      _default: report_extract_failed

  - id: pick_invoices
    type: transform
    parameters:
      op: json_extract
      path: invoices
    next: sum_by_currency

  - id: sum_by_currency
    type: transform
    parameters:
      op: group_by
      key: currency
      value: amount
      aggregate: sum
      precision: "2"
    next: review_request

  - id: review_request
    type: human_input
    parameters:
      prompt: "请复核 SG 员工报销单（回复 approve 提交，回复其他内容取消）：申请人 ${steps.extract_request.json.employee_name} (${steps.extract_request.json.user_id}) / 部门 ${steps.extract_request.json.employee_department} / 类别 ${steps.extract_request.json.category_label} / 收款人 ${steps.extract_request.json.payee_name} / 银行 ${steps.extract_request.json.bank_name} ${steps.extract_request.json.bank_account}。发票明细：${steps.pick_invoices.output}。按币种合计（确定性计算）：${steps.sum_by_currency.output}"
      variable: "review_decision"
      timeout: "1800"
      on_timeout: "fail"
    next: route_review

  - id: route_review
    type: switch
    parameters:
      on: "${review_decision}"
      branch.approve: prepare_build_input
      branch._default: report_cancelled
    branches:
      approve: prepare_build_input
      _default: report_cancelled

  - id: prepare_build_input
    type: assign
    parameters:
      target: reviewed_request
      value: "${steps.extract_request.output}"
    next: build_body

  - id: build_body
    type: llm_call
    target_role: approval_builder
    parameters:
      prompt_prefix: "Build the Lark approval body from this reviewed SG reimbursement JSON:"
    next: route_build

  - id: route_build
    type: switch
    parameters:
      on: "${eq(steps.build_body.json.error, '')}"
      branch.true: submit_approval
      branch.false: report_build_failed
      branch._default: report_build_failed
    branches:
      "true": submit_approval
      "false": report_build_failed
      _default: report_build_failed

  - id: submit_approval
    type: tool_call
    parameters:
      tool: nyxid_proxy
      arguments: '{"service_id":"us-lark-approval-sg-fixture","slug":"api-lark-bot","operation_id":"create-approval-instance","method":"POST","path":"/open-apis/approval/v4/instances?user_id_type=user_id","contract_digest":"fixture-replace-with-ready-contract-digest","body":"${json(input)}"}'
    next: route_submit

  - id: route_submit
    type: switch
    parameters:
      on: "${eq(steps.submit_approval.json.code, 0)}"
      branch.true: extract_data
      branch.false: report_submit_failed
      branch._default: report_submit_failed
    branches:
      "true": extract_data
      "false": report_submit_failed
      _default: report_submit_failed

  - id: extract_data
    type: transform
    parameters:
      op: json_extract
      path: data
    next: set_instance_code

  - id: set_instance_code
    type: assign
    parameters:
      target: instance_code
      value: "${steps.extract_data.json.instance_code}"
    next: wait_approval

  - id: wait_approval
    type: workflow_call
    parameters:
      workflow: lark_approval_wait
      lifecycle: transient
    next: report_result

  - id: report_result
    type: assign
    parameters:
      target: final_summary
      value: "✅ SG 员工报销审批已提交并到达终态。Instance Code: ${instance_code} / 最终状态: ${input} / 按币种合计: ${steps.sum_by_currency.output}"

  - id: report_cancelled
    type: assign
    parameters:
      target: final_summary
      value: "🚫 SG 员工报销已按复核意见取消（未提交审批）。复核回复：${review_decision}"

  - id: report_extract_failed
    type: assign
    parameters:
      target: final_summary
      value: "🚫 SG 员工报销解析失败，未能从消息中解析出报销字段。返回原文：${input}"

  - id: report_build_failed
    type: assign
    parameters:
      target: final_summary
      value: "🚫 SG 员工报销审批表单构造失败。返回原文：${input}"

  - id: report_submit_failed
    type: assign
    parameters:
      target: final_summary
      value: "🚫 SG 员工报销审批提交失败，Lark 返回原文：${input}"
