name: petty_cash_approval
description: >-
  Petty cash reimbursement: extract receipt or recharge fields from the chat message and
  attached receipt image, build the Lark petty-cash approval form, submit it through the
  NyxID proxy, wait for the terminal approval status, then return the summary as the run
  output (chat draft runs stream it back to the conversation).
when_to_use: Use when a chat message carries a petty-cash receipt image or a plain recharge command (such as "申请充值 3000 SGD 月度备用金补足") that should become a Lark petty-cash approval instance.

# 常量唯一来源: ~/Code/n8n-ornn-skills/petty-cash-approval-payload-builder/references/petty-cash-contract.md
# (approval_code / widget ids / currencyRange / alexOpenId / sheet URL 均逐字拷贝; token 刷新、admin webhook、调试节点按迁移设计排除)

roles:
  - id: receipt_extractor
    name: Receipt Extractor
    # vision role: 不指定 provider/model, 跟随会话默认路由
    system_prompt: >-
      You extract petty-cash reimbursement fields from the user's chat message and any attached
      receipt image. Output STRICT JSON only, no markdown fences, with fields: amount (number),
      currency (uppercase, one of SGD/USD/CNY), merchant, category, item, date (YYYY-MM-DD),
      reason, user_id (requester Lark open_id), sheet_url. From a receipt image read
      amount/currency/merchant/category/item/date and compose reason as "<merchant> <item> <date>".
      Without an image, parse a plain recharge command such as "申请充值 3000 SGD 月度备用金补足"
      into amount/currency and use the trailing note as reason; if the note is missing use
      "Petty cash recharge approval for <currency> <amount>". Copy the amount digits exactly as
      written; never compute, convert or round amounts. Use the requester open_id from the message
      context as user_id; when it is unavailable use "ou_6cb891b9d89fe1ac1ba6c09c2a19d688". When no
      sheet URL is given use "https://aelfblockchain.sg.larksuite.com/sheets/NmIisfa2KhgPlHtMWXrlneXFgvb".
      If there is neither a receipt image nor a recharge command, state explicitly that no image was
      received and output {"error":"<why the request cannot be parsed>"} instead; never invent data.

steps:
  - id: extract_receipt
    type: llm_call
    target_role: receipt_extractor
    parameters:
      prompt_prefix: "Extract the petty-cash request from this message:"
    next: route_extract

  - id: route_extract
    type: switch
    parameters:
      on: "${eq(steps.extract_receipt.json.error, '')}"
      branch.true: build_body
      branch.false: report_extract_failed
      branch._default: report_extract_failed
    branches:
      "true": build_body
      "false": report_extract_failed
      _default: report_extract_failed

  - id: build_body
    type: assign
    parameters:
      target: petty_cash_approval_body
      value: '{"approval_code":"A258D96B-567C-4327-9C5B-C53500C0AED2","user_id":"${json(steps.extract_receipt.json.user_id)}","form":"[{\"id\":\"widget17167786766400001\",\"type\":\"textarea\",\"value\":\"${json(json(steps.extract_receipt.json.reason))}\"},{\"id\":\"widget17167786834600001\",\"type\":\"amount\",\"value\":${steps.extract_receipt.json.amount},\"currency\":\"${json(json(steps.extract_receipt.json.currency))}\",\"ext\":{\"currency\":\"${json(json(steps.extract_receipt.json.currency))}\",\"currencyRange\":[\"SGD\",\"USD\",\"CNY\"]}},{\"id\":\"widget17167786925010001\",\"type\":\"input\",\"value\":\"${json(json(steps.extract_receipt.json.sheet_url))}\"}]"}'
    next: submit_approval

  - id: submit_approval
    type: tool_call
    parameters:
      tool: nyxid_proxy
      arguments: '{"slug":"api-lark-bot","path":"/open-apis/approval/v4/instances","method":"POST","body":"${json(input)}"}'
    next: route_submit

  - id: route_submit
    type: switch
    parameters:
      on: "${eq(steps.submit_approval.json.code, 0)}"
      branch.true: extract_data
      branch.false: report_submit_failed
      branch._default: report_submit_failed
    branches:
      "true": extract_data
      "false": report_submit_failed
      _default: report_submit_failed

  - id: extract_data
    type: transform
    parameters:
      op: json_extract
      path: data
    next: set_instance_code

  - id: set_instance_code
    type: assign
    parameters:
      target: instance_code
      value: "${steps.extract_data.json.instance_code}"
    next: wait_approval

  - id: wait_approval
    type: workflow_call
    parameters:
      workflow: lark_approval_wait
      lifecycle: transient
    next: report_result

  - id: report_result
    type: assign
    parameters:
      target: final_summary
      value: "💸 备用金审批已到达终态。Instance Code: ${instance_code} / 最终状态: ${input}"

  - id: report_extract_failed
    type: assign
    parameters:
      target: final_summary
      value: "💸 备用金申请解析失败，未能从消息中解析出报销字段。解析器返回原文：${input}"

  - id: report_submit_failed
    type: assign
    parameters:
      target: final_summary
      value: "💸 备用金审批提交失败，Lark 返回原文：${input}"
