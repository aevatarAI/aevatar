name: resume_screening
description: >-
  Resume screening: extract text from a chat-submitted resume file (PDF/DOCX) with the
  workflow document_extract tool, screen it with a structured LLM evaluation, write passing
  candidates into the HR resume Lark Bitable through the NyxID proxy, then return the
  screening summary as the run output (degrading to summary-only when the Bitable write
  fails).
when_to_use: Use when a chat message submits a candidate resume file (PDF/DOCX) with role details that should be screened and, when passing, saved to the HR resume screening Lark Base.

# 常量唯一来源: ~/Code/n8n-ornn-skills/resume-screening-payload-builder/references/resume-screening-contract.md
# (app_token / table_id / fields 名称与固定值 / TA Notes 模板 / 60 分阈值均逐字拷贝; Drive 上传与
#  Resume 附件列不在本批范围 —— 契约允许无 file_token 时省略 Resume 字段)
# TODO-verify: document_extract 工具参数契约不在 docs/canon/workflow-primitives.md;
#   引擎(WorkflowDocumentExtractToolSource)要求 arguments JSON 顶层 file_ref.file_id 或 file_ref.artifact_id,
#   本步把 run input 原样作为 arguments —— 启动方必须把聊天附件的 fileRef 以 {"file_ref":{...}} JSON 作为 workflow input 传入。
# TODO-verify: 契约要求 Upload Date=uploadDateMs(原 n8n 用 Date.now()); workflow 表达式无时钟函数,
#   此处由筛选 LLM 在输出 JSON 里给出 upload_date_ms(epoch 毫秒)。

roles:
  - id: resume_screener
    name: Resume Screener
    system_prompt: >-
      You screen one candidate resume against the requested job. The input is the JSON result of
      a document extraction tool whose "text" field holds the resume text; the conversation may
      also state the candidate name, email, job title and job description. Output STRICT JSON
      only, no markdown fences, with fields: score (integer 0-100), candidate_name, email,
      phone, job_title, years_experience, skills (comma-separated string), education,
      match_reason, strengths, gaps, recommendation ("Pass" or "Fail"),
      upload_date_ms (current Unix epoch milliseconds as an integer). Use empty strings for
      fields the resume does not reveal. Base every field strictly on the resume text and the
      stated job details; if the extracted text is empty or clearly not a resume, score it 0 with
      recommendation "Fail" and explain why in gaps. Never invent candidate details.

steps:
  - id: extract_resume
    type: tool_call
    parameters:
      tool: document_extract
      arguments: "${input}"
    next: route_extract

  - id: route_extract
    type: switch
    parameters:
      on: "${eq(steps.extract_resume.json.error, '')}"
      branch.true: screen_resume
      branch.false: report_extract_failed
      branch._default: report_extract_failed
    branches:
      "true": screen_resume
      "false": report_extract_failed
      _default: report_extract_failed

  - id: screen_resume
    type: llm_call
    target_role: resume_screener
    parameters:
      prompt_prefix: "Screen this extracted resume against the requested role:"
    next: route_score

  - id: route_score
    type: switch
    parameters:
      on: "${lt(steps.screen_resume.json.score, 60)}"
      branch.true: report_skipped
      branch.false: build_record
      branch._default: report_skipped
    branches:
      "true": report_skipped
      "false": build_record
      _default: report_skipped

  - id: build_record
    type: assign
    parameters:
      target: resume_record_body
      value: '{"fields":{"Candidate Name":"${json(steps.screen_resume.json.candidate_name)}","Email":"${json(steps.screen_resume.json.email)}","Job Title":"${json(steps.screen_resume.json.job_title)}","Upload Date":${steps.screen_resume.json.upload_date_ms},"Position Status":"Open","Application Stage":"Resume Screening","TA Notes":"AI Score: ${steps.screen_resume.json.score}/100 | ${json(steps.screen_resume.json.recommendation)} | Strengths: ${json(steps.screen_resume.json.strengths)} | Gaps: ${json(steps.screen_resume.json.gaps)}"}}'
    next: write_bitable

  - id: write_bitable
    type: tool_call
    parameters:
      tool: nyxid_proxy
      arguments: '{"slug":"api-lark-bot","path":"/open-apis/bitable/v1/apps/FSl0bCi9raBuLbsdTbHlgb0agwf/tables/tblgZgSqmeBag2na/records","method":"POST","body":"${json(input)}"}'
    next: route_write

  - id: route_write
    type: switch
    parameters:
      on: "${eq(steps.write_bitable.json.code, 0)}"
      branch.true: report_summary
      branch.false: report_write_failed
      branch._default: report_write_failed
    branches:
      "true": report_summary
      "false": report_write_failed
      _default: report_write_failed

  - id: report_summary
    type: assign
    parameters:
      target: final_summary
      value: "📄 简历筛选完成（已入库）。Candidate: ${steps.screen_resume.json.candidate_name} / Score: ${steps.screen_resume.json.score}/100 / ${steps.screen_resume.json.recommendation}。Strengths: ${steps.screen_resume.json.strengths} | Gaps: ${steps.screen_resume.json.gaps} | 理由: ${steps.screen_resume.json.match_reason}"

  - id: report_write_failed
    type: assign
    parameters:
      target: final_summary
      value: "📄 简历筛选完成但人才库写入失败（已降级为会话摘要）。Candidate: ${steps.screen_resume.json.candidate_name} / Score: ${steps.screen_resume.json.score}/100 / ${steps.screen_resume.json.recommendation}。Bitable 返回原文：${input}"

  - id: report_skipped
    type: assign
    parameters:
      target: final_summary
      value: "📄 简历筛选未达 60 分阈值，按契约跳过入库。Candidate: ${steps.screen_resume.json.candidate_name} / Score: ${steps.screen_resume.json.score}/100。Gaps: ${steps.screen_resume.json.gaps}"

  - id: report_extract_failed
    type: assign
    parameters:
      target: final_summary
      value: "📄 简历文件解析失败，document_extract 返回原文：${input}"
