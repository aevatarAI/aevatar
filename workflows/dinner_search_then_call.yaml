name: dinner_search_then_call
description: Search restaurant candidates with Firecrawl first, ask the user to choose one, then place one ElevenLabs phone reservation call to fixed mocked restaurant phone number +65 80102726 for the selected venue only.
when_to_use: Use to validate Firecrawl restaurant discovery, shortlist, option gate, selected ElevenLabs phone call, timeout hold-all/release, deposit-blocked, ambiguous-outcome, and proof artifact flow.
configuration:
  closed_world_mode: true
roles:
  - id: reservation_request_normalizer
    name: Dinner Reservation Request Normalizer
    system_prompt: >-
      You normalize Chinese or English dinner restaurant seat/table reservation requests for a search-then-phone workflow.
      Output STRICT JSON only, no markdown fences. The JSON shape is exactly
      {"ready":true,"query":"string","client_name":"string","party_size":"string","booking_date":"string","preferred_time":"string","backup_times":"string","callback_phone":"string","special_requests":"string"}.
      Set ready to false if the user did not provide a city, district, mall, neighborhood, or specific restaurant/location clue that can anchor the search.
      Build a practical restaurant search query from explicit restaurant, cuisine, city, district, date, time, and party size in the user input.
      If cuisine or restaurant type is absent, use dinner restaurant as the query type.
      If a field is absent, use empty string except party_size defaults to "2" and preferred_time may be inferred from explicit wording such as tonight 7pm.
      Do not invent restaurant names, cities, areas, phone numbers, payment claims, or booking confirmations.
    allowed_tools: []
  - id: shortlist_builder
    name: Dinner Shortlist Builder
    system_prompt: >-
      You extract three restaurant candidates strictly from Firecrawl search results.
      Output STRICT JSON only, no markdown fences. The JSON shape is exactly
      {"source":"firecrawl_search","search_step_success":true,"failure_reason":"","option_1_name":"string","option_1_url":"string","option_1_note":"string","option_2_name":"string","option_2_url":"string","option_2_note":"string","option_3_name":"string","option_3_url":"string","option_3_note":"string"}.
      If the raw search output has fewer than three suitable restaurant or reservation results, output the same JSON shape with search_step_success false, a non-empty failure_reason, and empty option fields.
      Each option URL must come from one of the provided search result items.
      Each option name must be either a search result title or a restaurant name explicitly present in that result title or snippet.
      Do not add restaurants, venues, or URLs that are absent from the raw search output.
      Prefer precise restaurant reservation or book-table pages over hotel dining pages, guide pages, listicles, or travel itinerary pages.
      The note must state whether the option came from the title or snippet, and why it is suitable or weaker.
      When search_step_success is true, keep every option field non-empty. Do not invent phone calls, deposits, or confirmations.
    allowed_tools: []
  - id: choice_normalizer
    name: Choice Normalizer
    system_prompt: >-
      You normalize dinner-date reservation user input for a deterministic workflow.
      Output STRICT JSON only, no markdown fences. The JSON shape is exactly
      {"choice":"await_choice|deposit|deposit_required|ambiguous|option_1|option_2|option_3"}.
      If the user clearly chooses the first, second, or third shown option, return option_1, option_2, or option_3.
      If a restaurant requires a deposit or payment, return deposit_required. If a call outcome
      is unclear or unverified, return ambiguous. If the user is only asking to book dinner or
      has not chosen one of the listed venues yet, return await_choice. Do not output timeout;
      timeout is triggered by the workflow after the user choice wait expires.
    allowed_tools: []
steps:
  - id: capture_user_choice
    type: assign
    parameters:
      target: user_input
      value: "$input"
    next: normalize_reservation_request

  - id: normalize_reservation_request
    type: llm_call
    target_role: reservation_request_normalizer
    parameters:
      prompt_prefix: >-
        Normalize this dinner restaurant seat/table reservation request. Raw user input:
    next: route_reservation_request_readiness

  - id: route_reservation_request_readiness
    type: switch
    parameters:
      on: "${steps.normalize_reservation_request.json.ready}"
      branch.true: initialize_context
      branch.false: final_artifact_location_required
      branch._default: final_artifact_location_required
    branches:
      true: initialize_context
      false: final_artifact_location_required
      _default: final_artifact_location_required

  - id: final_artifact_location_required
    type: assign
    parameters:
      target: dinner_date_artifact
      value: '{"workflow_status":"needs_input","path":"location_required_before_search","message":"请先告诉我订餐城市或具体区域/商圈，然后我会用 Firecrawl 搜索三家餐厅给你选择。当前还没有拨打电话，也没有完成预订。","external_call_started":false,"money_spent":false}'
    next: ""

  - id: initialize_context
    type: assign
    parameters:
      target: dinner_date_context
      value: '{"task_id":"task-dinner-search-then-call","participant":"${json(steps.normalize_reservation_request.json.client_name)}","party_size":"${json(steps.normalize_reservation_request.json.party_size)}","day":"${json(steps.normalize_reservation_request.json.booking_date)}","time":"${json(steps.normalize_reservation_request.json.preferred_time)}","policy":{"show_options_before_calls":true,"money_spend_allowed":false,"reservation_calls_auto_allowed":true},"mode":"firecrawl-search-elevenlabs-call-selected"}'
    next: discover_restaurant_candidates

  - id: discover_restaurant_candidates
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: "26f76390-2bf2-41f5-aac8-e20ea67233df"
        method: POST
        path_template: "/v1/search"
        query_parameters: []
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
        risk: read_only
    parameters:
      tool: nyxid_proxy
      arguments: '{"body":{"query":"${json(steps.normalize_reservation_request.json.query)} restaurant reservation book table","limit":8}}'
    next: build_shortlist_from_candidates

  - id: build_shortlist_from_candidates
    type: llm_call
    target_role: shortlist_builder
    parameters:
      prompt_prefix: >-
        Build three selectable dinner reservation options using only items present in these Firecrawl search results. Do not infer or add restaurants outside the raw search output. Raw search output:
    next: route_shortlist_status

  - id: route_shortlist_status
    type: switch
    parameters:
      on: "${steps.build_shortlist_from_candidates.json.search_step_success}"
      branch.true: mark_options_shown
      branch.false: final_artifact_search_failed
      branch._default: final_artifact_search_failed
    branches:
      true: mark_options_shown
      false: final_artifact_search_failed
      _default: final_artifact_search_failed

  - id: final_artifact_search_failed
    type: assign
    parameters:
      target: dinner_date_artifact
      value: '{"workflow_status":"failed","path":"restaurant_search_insufficient_results","reason":"${json(steps.build_shortlist_from_candidates.json.failure_reason)}","money_spent":false,"held":false,"success_contract":{"options_shown_before_any_call":false,"restaurant_calls_started":false,"money_spent":false,"insufficient_search_results_do_not_trigger_holds":true}}'
    next: ""

  - id: mark_options_shown
    type: assign
    parameters:
      target: options_gate
      value: '{"options_shown":true,"restaurant_calls_started":false,"money_spent":false,"silence_timeout_ms":2000,"production_timeout":"10m"}'
    next: emit_options_shown

  - id: emit_options_shown
    type: emit
    parameters:
      event_type: "dinner_date.options_shown"
      payload: "${steps.build_shortlist_from_candidates.output}"
    next: normalize_user_choice

  - id: normalize_user_choice
    type: llm_call
    target_role: choice_normalizer
    parameters:
      prompt_prefix: >-
        Available options JSON: ${steps.build_shortlist_from_candidates.output}.
        Raw user input: ${steps.capture_user_choice.output}.
        Normalize the raw user input to one workflow choice key. Ignore the workflow state JSON below unless it helps with context:
    next: route_user_choice_before_timeout

  - id: route_user_choice_before_timeout
    type: switch
    parameters:
      on: "${steps.normalize_user_choice.json.choice}"
      branch.await_choice: wait_for_user_choice_timeout
      branch.option_1: hold_selected_option_1
      branch.option_2: hold_selected_option_2
      branch.option_3: hold_selected_option_3
      branch.deposit: final_artifact_payment_blocked
      branch.deposit_required: final_artifact_payment_blocked
      branch.ambiguous: handle_ambiguous_hold_outcome
      branch._default: wait_for_user_choice_timeout
    branches:
      await_choice: wait_for_user_choice_timeout
      option_1: hold_selected_option_1
      option_2: hold_selected_option_2
      option_3: hold_selected_option_3
      deposit: final_artifact_payment_blocked
      deposit_required: final_artifact_payment_blocked
      ambiguous: handle_ambiguous_hold_outcome
      _default: wait_for_user_choice_timeout

  - id: hold_selected_option_1
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: "27bb0fec-def4-40cd-abd7-01737690c5c4"
        method: POST
        path_template: "/v1/convai/twilio/outbound-call"
        body_mode: json
        body_required: true
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: '{"body":{"agent_id":"agent_6301m11a57yjeattnrb3ffwrbynr","agent_phone_number_id":"phnum_0301m0hkqza9fg48ghjjxtwa33dq","to_number":"+6580102726","telephony_call_config":{"ringing_timeout_secs":30},"conversation_initiation_client_data":{"dynamic_variables":{"restaurant_name":"${json(steps.build_shortlist_from_candidates.json.option_1_name)}","restaurant_source_url":"${json(steps.build_shortlist_from_candidates.json.option_1_url)}","client_name":"${json(steps.normalize_reservation_request.json.client_name)}","party_size":"${json(steps.normalize_reservation_request.json.party_size)}","booking_date":"${json(steps.normalize_reservation_request.json.booking_date)}","preferred_time":"${json(steps.normalize_reservation_request.json.preferred_time)}","backup_times":"${json(steps.normalize_reservation_request.json.backup_times)}","callback_phone":"${json(steps.normalize_reservation_request.json.callback_phone)}","special_requests":"${json(steps.normalize_reservation_request.json.special_requests)}"}}}}'
    next: verify_selected_hold_option_1

  - id: verify_selected_hold_option_1
    type: assign
    parameters:
      target: selected_hold_verification
      value: '{"phone_call_started":"${json(steps.hold_selected_option_1.json.success)}","conversation_id":"${json(steps.hold_selected_option_1.json.conversation_id)}","call_sid":"${json(steps.hold_selected_option_1.json.callSid)}","provider_message":"${json(steps.hold_selected_option_1.json.message)}","mocked_restaurant_phone":"+6580102726","payment_requested":false,"result":"provider_response_recorded"}'
    next: emit_selected_only_completed_option_1

  - id: emit_selected_only_completed_option_1
    type: emit
    parameters:
      event_type: "dinner_date.completed"
      payload: "${steps.verify_selected_hold_option_1.output}"
    next: final_artifact_selected_option_1

  - id: final_artifact_selected_option_1
    type: assign
    parameters:
      target: dinner_date_artifact
      value: '{"workflow_status":"call_started","path":"selected_venue_phone_call_started","selected_restaurant":"${json(steps.build_shortlist_from_candidates.json.option_1_name)}","kept_option":"option_1","source_url":"${json(steps.build_shortlist_from_candidates.json.option_1_url)}","mocked_restaurant_phone":"+6580102726","conversation_id":"${json(steps.hold_selected_option_1.json.conversation_id)}","call_sid":"${json(steps.hold_selected_option_1.json.callSid)}","provider_success":"${json(steps.hold_selected_option_1.json.success)}","provider_message":"${json(steps.hold_selected_option_1.json.message)}","released":[],"money_spent":false,"success_contract":{"options_shown_before_any_call":true,"selected_option_only_called":true,"mocked_restaurant_phone_used":true,"money_spent":false}}'
    next: ""

  - id: hold_selected_option_2
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: "27bb0fec-def4-40cd-abd7-01737690c5c4"
        method: POST
        path_template: "/v1/convai/twilio/outbound-call"
        body_mode: json
        body_required: true
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: '{"body":{"agent_id":"agent_6301m11a57yjeattnrb3ffwrbynr","agent_phone_number_id":"phnum_0301m0hkqza9fg48ghjjxtwa33dq","to_number":"+6580102726","telephony_call_config":{"ringing_timeout_secs":30},"conversation_initiation_client_data":{"dynamic_variables":{"restaurant_name":"${json(steps.build_shortlist_from_candidates.json.option_2_name)}","restaurant_source_url":"${json(steps.build_shortlist_from_candidates.json.option_2_url)}","client_name":"${json(steps.normalize_reservation_request.json.client_name)}","party_size":"${json(steps.normalize_reservation_request.json.party_size)}","booking_date":"${json(steps.normalize_reservation_request.json.booking_date)}","preferred_time":"${json(steps.normalize_reservation_request.json.preferred_time)}","backup_times":"${json(steps.normalize_reservation_request.json.backup_times)}","callback_phone":"${json(steps.normalize_reservation_request.json.callback_phone)}","special_requests":"${json(steps.normalize_reservation_request.json.special_requests)}"}}}}'
    next: verify_selected_hold_option_2

  - id: verify_selected_hold_option_2
    type: assign
    parameters:
      target: selected_hold_verification
      value: '{"phone_call_started":"${json(steps.hold_selected_option_2.json.success)}","conversation_id":"${json(steps.hold_selected_option_2.json.conversation_id)}","call_sid":"${json(steps.hold_selected_option_2.json.callSid)}","provider_message":"${json(steps.hold_selected_option_2.json.message)}","mocked_restaurant_phone":"+6580102726","payment_requested":false,"result":"provider_response_recorded"}'
    next: emit_selected_only_completed_option_2

  - id: emit_selected_only_completed_option_2
    type: emit
    parameters:
      event_type: "dinner_date.completed"
      payload: "${steps.verify_selected_hold_option_2.output}"
    next: final_artifact_selected_option_2

  - id: final_artifact_selected_option_2
    type: assign
    parameters:
      target: dinner_date_artifact
      value: '{"workflow_status":"call_started","path":"selected_venue_phone_call_started","selected_restaurant":"${json(steps.build_shortlist_from_candidates.json.option_2_name)}","kept_option":"option_2","source_url":"${json(steps.build_shortlist_from_candidates.json.option_2_url)}","mocked_restaurant_phone":"+6580102726","conversation_id":"${json(steps.hold_selected_option_2.json.conversation_id)}","call_sid":"${json(steps.hold_selected_option_2.json.callSid)}","provider_success":"${json(steps.hold_selected_option_2.json.success)}","provider_message":"${json(steps.hold_selected_option_2.json.message)}","released":[],"money_spent":false,"success_contract":{"options_shown_before_any_call":true,"selected_option_only_called":true,"mocked_restaurant_phone_used":true,"money_spent":false}}'
    next: ""

  - id: hold_selected_option_3
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: "27bb0fec-def4-40cd-abd7-01737690c5c4"
        method: POST
        path_template: "/v1/convai/twilio/outbound-call"
        body_mode: json
        body_required: true
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: '{"body":{"agent_id":"agent_6301m11a57yjeattnrb3ffwrbynr","agent_phone_number_id":"phnum_0301m0hkqza9fg48ghjjxtwa33dq","to_number":"+6580102726","telephony_call_config":{"ringing_timeout_secs":30},"conversation_initiation_client_data":{"dynamic_variables":{"restaurant_name":"${json(steps.build_shortlist_from_candidates.json.option_3_name)}","restaurant_source_url":"${json(steps.build_shortlist_from_candidates.json.option_3_url)}","client_name":"${json(steps.normalize_reservation_request.json.client_name)}","party_size":"${json(steps.normalize_reservation_request.json.party_size)}","booking_date":"${json(steps.normalize_reservation_request.json.booking_date)}","preferred_time":"${json(steps.normalize_reservation_request.json.preferred_time)}","backup_times":"${json(steps.normalize_reservation_request.json.backup_times)}","callback_phone":"${json(steps.normalize_reservation_request.json.callback_phone)}","special_requests":"${json(steps.normalize_reservation_request.json.special_requests)}"}}}}'
    next: verify_selected_hold_option_3

  - id: verify_selected_hold_option_3
    type: assign
    parameters:
      target: selected_hold_verification
      value: '{"phone_call_started":"${json(steps.hold_selected_option_3.json.success)}","conversation_id":"${json(steps.hold_selected_option_3.json.conversation_id)}","call_sid":"${json(steps.hold_selected_option_3.json.callSid)}","provider_message":"${json(steps.hold_selected_option_3.json.message)}","mocked_restaurant_phone":"+6580102726","payment_requested":false,"result":"provider_response_recorded"}'
    next: emit_selected_only_completed_option_3

  - id: emit_selected_only_completed_option_3
    type: emit
    parameters:
      event_type: "dinner_date.completed"
      payload: "${steps.verify_selected_hold_option_3.output}"
    next: final_artifact_selected_option_3

  - id: final_artifact_selected_option_3
    type: assign
    parameters:
      target: dinner_date_artifact
      value: '{"workflow_status":"call_started","path":"selected_venue_phone_call_started","selected_restaurant":"${json(steps.build_shortlist_from_candidates.json.option_3_name)}","kept_option":"option_3","source_url":"${json(steps.build_shortlist_from_candidates.json.option_3_url)}","mocked_restaurant_phone":"+6580102726","conversation_id":"${json(steps.hold_selected_option_3.json.conversation_id)}","call_sid":"${json(steps.hold_selected_option_3.json.callSid)}","provider_success":"${json(steps.hold_selected_option_3.json.success)}","provider_message":"${json(steps.hold_selected_option_3.json.message)}","released":[],"money_spent":false,"success_contract":{"options_shown_before_any_call":true,"selected_option_only_called":true,"mocked_restaurant_phone_used":true,"money_spent":false}}'
    next: ""

  - id: wait_for_user_choice_timeout
    type: delay
    parameters:
      duration_ms: "2000"
    next: mark_silence_timeout

  - id: mark_silence_timeout
    type: assign
    parameters:
      target: user_gate_result
      value: '{"status":"timeout","next_branch":"hold_all","message":"Holding all three because no choice arrived before timeout."}'
    next: hold_candidate_option_1

  - id: hold_candidate_option_1
    type: assign
    idempotency_key: "${run_id}:hold:option_1:timeout"
    parameters:
      target: hold_option_1
      value: '{"mocked_services":["api-twilio","api-elevenlabs","restaurant-phone"],"venue":"${json(steps.build_shortlist_from_candidates.json.option_1_name)}","venue_id":"option_1","source_url":"${json(steps.build_shortlist_from_candidates.json.option_1_url)}","action":"hold","external_effect":"confirmed","restaurant_message":"temporary hold; decision comes tonight; unselected holds will be released after user confirmation","twilio_call_record":"mock-call-hold-option-1-timeout","elevenlabs_transcript":"mock-transcript-hold-option-1-timeout","confirmed_time":"19:30","allergy_answer":"mock allergy verification for option 1","payment_requested":false}'
    next: hold_candidate_option_2

  - id: hold_candidate_option_2
    type: assign
    idempotency_key: "${run_id}:hold:option_2:timeout"
    parameters:
      target: hold_option_2
      value: '{"mocked_services":["api-twilio","api-elevenlabs","restaurant-phone"],"venue":"${json(steps.build_shortlist_from_candidates.json.option_2_name)}","venue_id":"option_2","source_url":"${json(steps.build_shortlist_from_candidates.json.option_2_url)}","action":"hold","external_effect":"confirmed","restaurant_message":"temporary hold; decision comes tonight; unselected holds will be released after user confirmation","twilio_call_record":"mock-call-hold-option-2-timeout","elevenlabs_transcript":"mock-transcript-hold-option-2-timeout","confirmed_time":"19:30","allergy_answer":"mock allergy verification for option 2","payment_requested":false}'
    next: hold_candidate_option_3

  - id: hold_candidate_option_3
    type: assign
    idempotency_key: "${run_id}:hold:option_3:timeout"
    parameters:
      target: hold_option_3
      value: '{"mocked_services":["api-twilio","api-elevenlabs","restaurant-phone"],"venue":"${json(steps.build_shortlist_from_candidates.json.option_3_name)}","venue_id":"option_3","source_url":"${json(steps.build_shortlist_from_candidates.json.option_3_url)}","action":"hold","external_effect":"confirmed","restaurant_message":"temporary hold; decision comes tonight; unselected holds will be released after user confirmation","twilio_call_record":"mock-call-hold-option-3-timeout","elevenlabs_transcript":"mock-transcript-hold-option-3-timeout","confirmed_time":"20:00","allergy_answer":"mock allergy verification for option 3","payment_requested":false}'
    next: publish_holds_wait_state

  - id: publish_holds_wait_state
    type: assign
    parameters:
      target: post_timeout_wait_state
      value: '{"status":"waiting_for_user_confirmation_after_holds","held":["option_1","option_2","option_3"],"accepted_signals":["option_1","option_2","option_3"],"message":"All three mock holds are confirmed. Workflow is waiting for the user to confirm one venue before releasing the other two.","hold_proofs":["${steps.hold_candidate_option_1.json.twilio_call_record}","${steps.hold_candidate_option_1.json.elevenlabs_transcript}","${steps.hold_candidate_option_2.json.twilio_call_record}","${steps.hold_candidate_option_2.json.elevenlabs_transcript}","${steps.hold_candidate_option_3.json.twilio_call_record}","${steps.hold_candidate_option_3.json.elevenlabs_transcript}"]}'
    next: final_artifact_waiting_after_holds

  - id: final_artifact_waiting_after_holds
    type: assign
    parameters:
      target: dinner_date_artifact
      value: '{"workflow_status":"waiting","path":"silence_timeout_hold_all_waiting_for_user_confirmation","held":["${json(steps.hold_candidate_option_1.json.venue)}","${json(steps.hold_candidate_option_2.json.venue)}","${json(steps.hold_candidate_option_3.json.venue)}"],"held_options":["option_1","option_2","option_3"],"released":[],"waiting_for":"user_confirmation_to_keep_one_venue","proof":{"call_records":["${steps.hold_candidate_option_1.json.twilio_call_record}","${steps.hold_candidate_option_2.json.twilio_call_record}","${steps.hold_candidate_option_3.json.twilio_call_record}"],"transcripts":["${steps.hold_candidate_option_1.json.elevenlabs_transcript}","${steps.hold_candidate_option_2.json.elevenlabs_transcript}","${steps.hold_candidate_option_3.json.elevenlabs_transcript}"]},"required_external_dependencies_mocked":["api-twilio","api-elevenlabs","restaurant-phone"],"recommended_dependencies_mocked":["api-firecrawl"],"success_contract":{"options_shown_before_any_call":true,"money_spent":false,"all_three_venues_held_after_timeout":true,"awaits_user_confirmation_before_release":true,"unselected_holds_not_released_before_confirmation":true,"proof_artifact_contains_call_records_and_transcripts":true}}'
    next: wait_for_post_timeout_choice

  - id: wait_for_post_timeout_choice
    type: wait_signal
    parameters:
      signal_name: "dinner_date_confirm_venue"
      prompt: "Waiting for user confirmation to keep one held venue"
      timeout_ms: "86400000"
    next: normalize_post_timeout_choice

  - id: normalize_post_timeout_choice
    type: llm_call
    target_role: choice_normalizer
    parameters:
      prompt_prefix: >-
        Available held options JSON: ${steps.build_shortlist_from_candidates.output}.
        Raw user confirmation after all three holds: ${steps.wait_for_post_timeout_choice.output}.
        Normalize the confirmation to one workflow choice key.
    next: route_post_timeout_choice

  - id: route_post_timeout_choice
    type: switch
    parameters:
      on: "${steps.normalize_post_timeout_choice.json.choice}"
      branch.option_1: release_unselected_after_confirm_option_1
      branch.option_2: release_unselected_after_confirm_option_2
      branch.option_3: release_unselected_after_confirm_option_3
      branch.deposit: final_artifact_payment_blocked
      branch.deposit_required: final_artifact_payment_blocked
      branch.ambiguous: final_artifact_confirmation_ambiguous
      branch.await_choice: final_artifact_confirmation_ambiguous
      branch._default: final_artifact_confirmation_ambiguous
    branches:
      option_1: release_unselected_after_confirm_option_1
      option_2: release_unselected_after_confirm_option_2
      option_3: release_unselected_after_confirm_option_3
      deposit: final_artifact_payment_blocked
      deposit_required: final_artifact_payment_blocked
      ambiguous: final_artifact_confirmation_ambiguous
      await_choice: final_artifact_confirmation_ambiguous
      _default: final_artifact_confirmation_ambiguous

  - id: release_unselected_after_confirm_option_1
    type: assign
    idempotency_key: "${run_id}:release:unselected:option_1"
