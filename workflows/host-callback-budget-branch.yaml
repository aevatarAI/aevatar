name: host_callback_budget_branch
description: Host callback route selection plus usage-budget guard.
roles:
  - id: coordinator
    name: Coordinator
    connectors:
      - github_router
steps:
  - id: classify_host_signal
    type: connector_call
    role: coordinator
    parameters:
      connector: github_router
      operation: classify_pr
      payload: ${json(input)}

  - id: route_by_host
    type: switch
    parameters:
      on: ${steps.classify_host_signal.annotations.host_callback.result.route}
    branches:
      phase9-router: budget_gate
      _default: fallback

  - id: budget_gate
    type: guard
    parameters:
      check: max_length
      max: ${workflow.usage.total_tokens}

  - id: fallback
    type: transform
    parameters:
      op: identity
