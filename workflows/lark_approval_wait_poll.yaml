name: lark_approval_wait_poll
description: Poll one Lark approval instance once and delay before the next parent wait iteration when it is still running.
steps:
  - id: get_instance
    type: tool_call
    parameters:
      tool: lark_approvals_get
      arguments: '{"instance_code":"${json(input)}"}'
    next: route_get_success

  - id: route_get_success
    type: switch
    parameters:
      on: "${steps.get_instance.json.success}"
      branch.true: route_status
      branch.false: mark_failed
      branch._default: mark_failed
    branches:
      "true": route_status
      "false": mark_failed
      _default: mark_failed

  - id: route_status
    type: switch
    parameters:
      on: "${steps.get_instance.json.status}"
      branch.approved: mark_approved
      branch.rejected: mark_rejected
      branch.withdrawn: mark_withdrawn
      branch.terminated: mark_terminated
      branch._default: wait_before_next_poll
    branches:
      approved: mark_approved
      rejected: mark_rejected
      withdrawn: mark_withdrawn
      terminated: mark_terminated
      _default: wait_before_next_poll

  - id: wait_before_next_poll
    type: delay
    parameters:
      duration_ms: "5000"
    next: keep_waiting

  - id: keep_waiting
    type: assign
    parameters:
      target: lark_approval_instance_code
      value: "${steps.get_instance.json.instance_code}"

  - id: mark_approved
    type: assign
    parameters:
      target: lark_approval_status
      value: approved

  - id: mark_rejected
    type: assign
    parameters:
      target: lark_approval_status
      value: rejected

  - id: mark_withdrawn
    type: assign
    parameters:
      target: lark_approval_status
      value: withdrawn

  - id: mark_terminated
    type: assign
    parameters:
      target: lark_approval_status
      value: terminated

  - id: mark_failed
    type: assign
    parameters:
      target: lark_approval_status
      value: failed
