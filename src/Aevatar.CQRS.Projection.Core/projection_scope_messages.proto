syntax = "proto3";

option csharp_namespace = "Aevatar.CQRS.Projection.Core.Orchestration";

import "agent_messages.proto";
import "google/protobuf/timestamp.proto";

enum ProjectionScopeMode {
  PROJECTION_SCOPE_MODE_UNSPECIFIED = 0;
  PROJECTION_SCOPE_MODE_DURABLE_MATERIALIZATION = 1;
  PROJECTION_SCOPE_MODE_SESSION_OBSERVATION = 2;
}

message ProjectionScopeState {
  string root_actor_id = 1;
  string projection_kind = 2;
  string session_id = 3;
  ProjectionScopeMode mode = 4;
  bool active = 5;
  bool observation_attached = 6;
  bool released = 7;
  int64 highest_seen_version = 8;
  int64 last_successful_version = 9;
  // Durable operator repair backlog. These records are never retention-trimmed.
  repeated ProjectionScopeFailure failures = 10;
  google.protobuf.Timestamp updated_at_utc = 11;
  map<string, int64> last_successful_versions_by_actor = 12;
  repeated ProjectionObservedEnvelopeMetadata recent_observed_envelopes = 13;
  int64 received_envelope_total = 14;
  int64 attempted_envelope_total = 15;
  int64 successful_materialization_total = 16;
  int64 failed_attempt_total = 17;
  int64 retry_exhausted_total = 18;
  map<string, int64> highest_seen_versions_by_actor = 19;
  // Bounded, payload-free diagnostics. Trimming this ring never removes repair facts.
  repeated ProjectionFailureDiagnostic retained_failure_diagnostics = 20;
  int64 failure_diagnostic_dropped_total = 21;
  int64 activation_generation = 22;
  // Exact query-facing failure status. The publication hook populates this before
  // replacing repair payloads with an equal-count, payload-free rolling-upgrade view.
  ProjectionScopeFailureSummary failure_summary = 23;
  // Last committed scope state version admitted for automatic recovery.
  // The actor owns this monotonic fence so multiple host replicas cannot
  // replay the same observed failure snapshot more than once.
  int64 last_automatic_recovery_observed_state_version = 24;
  // Exact committed coordinates are the durable idempotency authority. A
  // version without its source actor and event id is never treated as proof
  // of an exact duplicate.
  map<string, ProjectionSourceCoordinate> last_successful_source_coordinates_by_actor = 25;
  // Persisted before invoking an external materializer and cleared by the
  // same watermark transition that records successful materialization.
  ProjectionScopeInFlightObservation in_flight_observation = 26;
  // Actor-owned write/query route. Eventual status documents only replicate
  // this value and must never choose or advance it.
  ProjectionMaterializationRouteFingerprint active_materialization_route = 27;
  ProjectionMaterializationCutoverState materialization_cutover = 28;
  // Actor-owned status write route. Absent means the legacy event-sourced
  // status shadow scope is the writer; a terminal route names the exact
  // contract that may write ProjectionScopeStatusDocument for this scope.
  // Status writers only replicate this decision and never choose it.
  ProjectionScopeStatusRoute status_route = 29;
}

message ProjectionScopeStatusRoute {
  string contract_id = 1;
  int64 contract_version = 2;
  // Monotonic per source scope; a higher epoch is the only way to move the
  // status writer between routes.
  int64 route_epoch = 3;
  google.protobuf.Timestamp activated_at_utc = 4;
  ProjectionMaterializationActivationProof activation_proof = 5;
  // Set once the legacy status shadow relay and scope were released for
  // this source; before that the source actor retries the release on
  // activation.
  bool legacy_route_released = 6;
}

message ProjectionObservedEnvelopeMetadata {
  string event_id = 1;
  string type_url = 2;
  int64 state_version = 3;
  google.protobuf.Timestamp timestamp_utc = 4;
}

message ProjectionSourceCoordinate {
  string actor_id = 1;
  int64 state_version = 2;
  string event_id = 3;
}

message ProjectionScopeInFlightObservation {
  ProjectionSourceCoordinate source = 1;
  aevatar.EventEnvelope envelope = 2;
  string event_kind = 3;
  google.protobuf.Timestamp staged_at_utc = 4;
}

message ProjectionMaterializationRouteFingerprint {
  string contract_id = 1;
  int64 contract_version = 2;
  string physical_namespace = 3;
  int64 route_epoch = 4;
}

enum ProjectionMaterializationCutoverPhase {
  PROJECTION_MATERIALIZATION_CUTOVER_PHASE_UNSPECIFIED = 0;
  PROJECTION_MATERIALIZATION_CUTOVER_PHASE_REQUESTED = 1;
  PROJECTION_MATERIALIZATION_CUTOVER_PHASE_CANDIDATE_BUILT = 2;
  PROJECTION_MATERIALIZATION_CUTOVER_PHASE_GOLDEN_VERIFIED = 3;
  PROJECTION_MATERIALIZATION_CUTOVER_PHASE_ACTIVATED = 4;
}

message ProjectionMaterializationCutoverState {
  ProjectionMaterializationCutoverPhase phase = 1;
  ProjectionMaterializationRouteFingerprint candidate_route = 2;
  ProjectionSourceCoordinate candidate_source = 3;
  string candidate_fingerprint = 4;
  google.protobuf.Timestamp updated_at_utc = 5;
  ProjectionMaterializationActivationProof activation_proof = 6;
}

message ProjectionMaterializationActivationProof {
  int64 authority_state_version = 1;
  int64 capability_epoch = 2;
  int64 membership_epoch = 3;
  string membership_digest = 4;
  string deployment_revision = 5;
  google.protobuf.Timestamp validated_at_utc = 6;
  google.protobuf.Timestamp valid_until_utc = 7;
}

message ProjectionScopeFailure {
  string failure_id = 1;
  string stage = 2;
  string event_id = 3;
  string event_type = 4;
  int64 source_version = 5;
  string reason = 6;
  aevatar.EventEnvelope envelope = 7;
  int32 attempts = 8;
  google.protobuf.Timestamp occurred_at_utc = 9;
  bool retry_exhausted = 10;
  string source_actor_id = 11;
}

message ProjectionFailureDiagnostic {
  string failure_id = 1;
  string stage = 2;
  string event_id = 3;
  string event_type = 4;
  int64 source_version = 5;
  google.protobuf.Timestamp occurred_at_utc = 6;
  string source_actor_id = 7;
}

message ProjectionScopeFailureSummary {
  int32 unresolved_failure_count = 1;
  int32 retry_exhausted_failure_count = 2;
  google.protobuf.Timestamp oldest_unresolved_failure_at_utc = 3;
}

message EnsureProjectionScopeCommand {
  string root_actor_id = 1;
  string projection_kind = 2;
  string session_id = 3;
  ProjectionScopeMode mode = 4;
}

message ReleaseProjectionScopeCommand {
  string root_actor_id = 1;
  string projection_kind = 2;
  string session_id = 3;
  ProjectionScopeMode mode = 4;
}

message ReplayProjectionFailuresCommand {
  int32 max_items = 1;
  bool automatic_recovery = 2;
  int64 observed_scope_state_version = 3;
}

message ResumeProjectionInFlightObservationCommand {
  ProjectionSourceCoordinate expected_source = 1;
}

message ContinueProjectionMaterializationCutoverCommand {
  int64 expected_route_epoch = 1;
}

message RequestProjectionMaterializationCutoverCommand {
  int64 expected_active_route_epoch = 1;
  ProjectionMaterializationRouteFingerprint candidate_route = 2;
}

// Self continuation of a durable scope that stayed on the legacy status route because the
// terminal fleet gate was not yet open (typically a long-lived scope activated right after a
// silo boot); bounded, backed-off, delivered through the durable callback scheduler.
message RetryProjectionScopeStatusRouteAdoptionCommand {
  int32 attempt = 1;
}

message ProjectionScopeStartedEvent {
  string root_actor_id = 1;
  string projection_kind = 2;
  string session_id = 3;
  ProjectionScopeMode mode = 4;
  google.protobuf.Timestamp occurred_at_utc = 5;
  int64 activation_generation = 6;
}

message ProjectionScopeActivationGenerationMigratedEvent {
  int64 activation_generation = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
}

message ProjectionObservationAttachmentUpdatedEvent {
  bool attached = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
}

message ProjectionScopeReleasedEvent {
  google.protobuf.Timestamp occurred_at_utc = 1;
}

message ProjectionScopeEnvelopeReceivedEvent {
  google.protobuf.Timestamp occurred_at_utc = 1;
  string event_kind = 2;
}

message ProjectionScopeEnvelopeAttemptedEvent {
  int64 highest_seen_version = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
  string source_actor_id = 3;
  ProjectionObservedEnvelopeMetadata observed_envelope = 4;
  string event_kind = 5;
}

message ProjectionScopeObservationStagedEvent {
  ProjectionScopeInFlightObservation observation = 1;
}

message ProjectionScopeWatermarkAdvancedEvent {
  reserved 1;
  int64 last_successful_version = 2;
  google.protobuf.Timestamp occurred_at_utc = 3;
  string source_actor_id = 4;
  ProjectionObservedEnvelopeMetadata observed_envelope = 5;
}

message ProjectionScopeDispatchFailedEvent {
  string failure_id = 1;
  string stage = 2;
  string event_id = 3;
  string event_type = 4;
  int64 source_version = 5;
  string reason = 6;
  aevatar.EventEnvelope envelope = 7;
  google.protobuf.Timestamp occurred_at_utc = 8;
  string source_actor_id = 9;
}

message ProjectionScopeFailureReplayedEvent {
  string failure_id = 1;
  bool succeeded = 2;
  string reason = 3;
  google.protobuf.Timestamp occurred_at_utc = 4;
}

message ProjectionScopeAutomaticRecoveryRequestedEvent {
  int64 observed_scope_state_version = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
}

message ProjectionMaterializationRouteInitializedEvent {
  ProjectionMaterializationRouteFingerprint route = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
}

message ProjectionMaterializationCutoverRequestedEvent {
  ProjectionMaterializationRouteFingerprint candidate_route = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
}

message ProjectionMaterializationCutoverCandidateBuiltEvent {
  ProjectionMaterializationRouteFingerprint candidate_route = 1;
  ProjectionSourceCoordinate candidate_source = 2;
  string candidate_fingerprint = 3;
  google.protobuf.Timestamp occurred_at_utc = 4;
}

message ProjectionMaterializationCutoverGoldenVerifiedEvent {
  ProjectionMaterializationRouteFingerprint candidate_route = 1;
  ProjectionSourceCoordinate candidate_source = 2;
  string candidate_fingerprint = 3;
  google.protobuf.Timestamp occurred_at_utc = 4;
}

message ProjectionMaterializationCutoverActivatedEvent {
  ProjectionMaterializationRouteFingerprint route = 1;
  ProjectionSourceCoordinate source = 2;
  string candidate_fingerprint = 3;
  google.protobuf.Timestamp occurred_at_utc = 4;
  ProjectionMaterializationActivationProof activation_proof = 5;
}

message ProjectionScopeStatusRouteActivatedEvent {
  ProjectionScopeStatusRoute route = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
}

message ProjectionScopeStatusLegacyRouteReleasedEvent {
  int64 route_epoch = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
}
