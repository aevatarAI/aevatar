syntax = "proto3";

option csharp_namespace = "Aevatar.CQRS.Projection.Core.Orchestration";

import "agent_messages.proto";
import "google/protobuf/timestamp.proto";

enum ProjectionScopeMode {
  PROJECTION_SCOPE_MODE_UNSPECIFIED = 0;
  PROJECTION_SCOPE_MODE_DURABLE_MATERIALIZATION = 1;
  PROJECTION_SCOPE_MODE_SESSION_OBSERVATION = 2;
}

message ProjectionScopeState {
  string root_actor_id = 1;
  string projection_kind = 2;
  string session_id = 3;
  ProjectionScopeMode mode = 4;
  bool active = 5;
  bool observation_attached = 6;
  bool released = 7;
  int64 highest_seen_version = 8;
  int64 last_successful_version = 9;
  // Durable operator repair backlog. These records are never retention-trimmed.
  repeated ProjectionScopeFailure failures = 10;
  google.protobuf.Timestamp updated_at_utc = 11;
  map<string, int64> last_successful_versions_by_actor = 12;
  repeated ProjectionObservedEnvelopeMetadata recent_observed_envelopes = 13;
  int64 received_envelope_total = 14;
  int64 attempted_envelope_total = 15;
  int64 successful_materialization_total = 16;
  int64 failed_attempt_total = 17;
  int64 retry_exhausted_total = 18;
  map<string, int64> highest_seen_versions_by_actor = 19;
  // Bounded, payload-free diagnostics. Trimming this ring never removes repair facts.
  repeated ProjectionFailureDiagnostic retained_failure_diagnostics = 20;
  int64 failure_diagnostic_dropped_total = 21;
}

message ProjectionObservedEnvelopeMetadata {
  string event_id = 1;
  string type_url = 2;
  int64 state_version = 3;
  google.protobuf.Timestamp timestamp_utc = 4;
}

message ProjectionScopeFailure {
  string failure_id = 1;
  string stage = 2;
  string event_id = 3;
  string event_type = 4;
  int64 source_version = 5;
  string reason = 6;
  aevatar.EventEnvelope envelope = 7;
  int32 attempts = 8;
  google.protobuf.Timestamp occurred_at_utc = 9;
  bool retry_exhausted = 10;
  string source_actor_id = 11;
}

message ProjectionFailureDiagnostic {
  string failure_id = 1;
  string stage = 2;
  string event_id = 3;
  string event_type = 4;
  int64 source_version = 5;
  google.protobuf.Timestamp occurred_at_utc = 6;
  string source_actor_id = 7;
}

message EnsureProjectionScopeCommand {
  string root_actor_id = 1;
  string projection_kind = 2;
  string session_id = 3;
  ProjectionScopeMode mode = 4;
}

message ReleaseProjectionScopeCommand {
  string root_actor_id = 1;
  string projection_kind = 2;
  string session_id = 3;
  ProjectionScopeMode mode = 4;
}

message ReplayProjectionFailuresCommand {
  int32 max_items = 1;
}

message ProjectionScopeStartedEvent {
  string root_actor_id = 1;
  string projection_kind = 2;
  string session_id = 3;
  ProjectionScopeMode mode = 4;
  google.protobuf.Timestamp occurred_at_utc = 5;
}

message ProjectionObservationAttachmentUpdatedEvent {
  bool attached = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
}

message ProjectionScopeReleasedEvent {
  google.protobuf.Timestamp occurred_at_utc = 1;
}

message ProjectionScopeEnvelopeReceivedEvent {
  google.protobuf.Timestamp occurred_at_utc = 1;
  string event_kind = 2;
}

message ProjectionScopeEnvelopeAttemptedEvent {
  int64 highest_seen_version = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
  string source_actor_id = 3;
  ProjectionObservedEnvelopeMetadata observed_envelope = 4;
  string event_kind = 5;
}

message ProjectionScopeWatermarkAdvancedEvent {
  reserved 1;
  int64 last_successful_version = 2;
  google.protobuf.Timestamp occurred_at_utc = 3;
  string source_actor_id = 4;
  ProjectionObservedEnvelopeMetadata observed_envelope = 5;
}

message ProjectionScopeDispatchFailedEvent {
  string failure_id = 1;
  string stage = 2;
  string event_id = 3;
  string event_type = 4;
  int64 source_version = 5;
  string reason = 6;
  aevatar.EventEnvelope envelope = 7;
  google.protobuf.Timestamp occurred_at_utc = 8;
  string source_actor_id = 9;
}

message ProjectionScopeFailureReplayedEvent {
  string failure_id = 1;
  bool succeeded = 2;
  string reason = 3;
  google.protobuf.Timestamp occurred_at_utc = 4;
}
