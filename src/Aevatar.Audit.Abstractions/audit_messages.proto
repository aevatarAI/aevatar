syntax = "proto3";

package aevatar.audit.v1;

option csharp_namespace = "Aevatar.Audit";

import "google/protobuf/timestamp.proto";

enum AuditActorKind {
  AUDIT_ACTOR_KIND_UNSPECIFIED = 0;
  AUDIT_ACTOR_KIND_NYXID_USER = 1;
  AUDIT_ACTOR_KIND_CHANNEL_SENDER = 2;
  AUDIT_ACTOR_KIND_SYSTEM = 3;
  AUDIT_ACTOR_KIND_SCHEDULE = 4;
  AUDIT_ACTOR_KIND_SERVICE = 5;
}

enum AuditCredentialSource {
  AUDIT_CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  AUDIT_CREDENTIAL_SOURCE_NYXID_ASSERTION = 1;
  AUDIT_CREDENTIAL_SOURCE_BEARER_TOKEN = 2;
  AUDIT_CREDENTIAL_SOURCE_CHANNEL_REGISTRATION = 3;
  AUDIT_CREDENTIAL_SOURCE_SCHEDULED_RUN = 4;
  AUDIT_CREDENTIAL_SOURCE_SYSTEM = 5;
  AUDIT_CREDENTIAL_SOURCE_SERVICE_ACCOUNT = 6;
}

enum AuditOperationKind {
  AUDIT_OPERATION_KIND_UNSPECIFIED = 0;
  AUDIT_OPERATION_KIND_API = 1;
  AUDIT_OPERATION_KIND_TOOL = 2;
  AUDIT_OPERATION_KIND_WORKFLOW = 3;
  AUDIT_OPERATION_KIND_SCHEDULE = 4;
  AUDIT_OPERATION_KIND_AUTHORIZATION = 5;
  AUDIT_OPERATION_KIND_SYSTEM = 6;
}

enum AuditSensitivityLevel {
  AUDIT_SENSITIVITY_LEVEL_UNSPECIFIED = 0;
  AUDIT_SENSITIVITY_LEVEL_PUBLIC = 1;
  AUDIT_SENSITIVITY_LEVEL_INTERNAL = 2;
  AUDIT_SENSITIVITY_LEVEL_CONFIDENTIAL = 3;
  AUDIT_SENSITIVITY_LEVEL_RESTRICTED = 4;
}

enum AuditOutcome {
  AUDIT_OUTCOME_UNSPECIFIED = 0;
  AUDIT_OUTCOME_SUCCESS = 1;
  AUDIT_OUTCOME_DENIED = 2;
  AUDIT_OUTCOME_ERROR = 3;
  AUDIT_OUTCOME_ACCEPTED = 4;
  AUDIT_OUTCOME_CANCELLED = 5;
}

enum AuditCapturePlane {
  AUDIT_CAPTURE_PLANE_UNSPECIFIED = 0;
  AUDIT_CAPTURE_PLANE_BOUNDARY_ENDPOINT = 1;
  AUDIT_CAPTURE_PLANE_TOOL_EXECUTION = 2;
  AUDIT_CAPTURE_PLANE_PROJECTION_ARTIFACT = 3;
}

enum AuditLifecyclePhase {
  AUDIT_LIFECYCLE_PHASE_UNSPECIFIED = 0;
  AUDIT_LIFECYCLE_PHASE_ACCEPTED = 1;
  AUDIT_LIFECYCLE_PHASE_RUNNING = 2;
  AUDIT_LIFECYCLE_PHASE_WAITING_APPROVAL = 3;
  AUDIT_LIFECYCLE_PHASE_TERMINAL = 4;
}

enum AuditTerminalOutcome {
  AUDIT_TERMINAL_OUTCOME_UNSPECIFIED = 0;
  AUDIT_TERMINAL_OUTCOME_SUCCEEDED = 1;
  AUDIT_TERMINAL_OUTCOME_FAILED = 2;
  AUDIT_TERMINAL_OUTCOME_CANCELLED = 3;
  AUDIT_TERMINAL_OUTCOME_TIMED_OUT = 4;
}

enum AuditFailureCategory {
  AUDIT_FAILURE_CATEGORY_UNSPECIFIED = 0;
  AUDIT_FAILURE_CATEGORY_AUTHORIZATION = 1;
  AUDIT_FAILURE_CATEGORY_VALIDATION = 2;
  AUDIT_FAILURE_CATEGORY_EXECUTION = 3;
  AUDIT_FAILURE_CATEGORY_DEPENDENCY = 4;
  AUDIT_FAILURE_CATEGORY_TIMEOUT = 5;
  AUDIT_FAILURE_CATEGORY_CONFLICT = 6;
  AUDIT_FAILURE_CATEGORY_INTERNAL = 7;
}

enum AuditRetryability {
  AUDIT_RETRYABILITY_UNSPECIFIED = 0;
  AUDIT_RETRYABILITY_UNKNOWN = 1;
  AUDIT_RETRYABILITY_RETRYABLE = 2;
  AUDIT_RETRYABILITY_NOT_RETRYABLE = 3;
}

enum AuditChatSurface {
  AUDIT_CHAT_SURFACE_UNSPECIFIED = 0;
  AUDIT_CHAT_SURFACE_NYXID_ASSISTANT = 1;
  AUDIT_CHAT_SURFACE_WORKFLOW_CHAT = 2;
}

enum AuditToolExecutionPhase {
  AUDIT_TOOL_EXECUTION_PHASE_UNSPECIFIED = 0;
  AUDIT_TOOL_EXECUTION_PHASE_RUNNING = 1;
  AUDIT_TOOL_EXECUTION_PHASE_WAITING_APPROVAL = 2;
  AUDIT_TOOL_EXECUTION_PHASE_TERMINAL = 3;
}

message AuditTarget {
  string kind = 1;
  string id = 2;
  string display_name = 3;
}

message AuditCorrelation {
  string trace_id = 1;
  string request_id = 2;
  string command_id = 3;
  string call_id = 4;
  string session_id = 5;
  string workflow_run_id = 6;
  string approval_id = 7;
  string span_id = 8;
  string traceparent = 9;
  string tracestate = 10;
  string correlation_id = 11;
  string causation_id = 12;
}

message AuditCommittedFactReference {
  string committed_event_id = 1;
  string actor_id = 2;
  string actor_type = 3;
  string event_type_url = 4;
  int64 state_version = 5;
}

message AuditFailure {
  string code = 1;
  AuditFailureCategory category = 2;
  AuditRetryability retryability = 3;
  AuditLifecyclePhase failed_phase = 4;
  string sanitized_message = 5;
}

message AuditChatProvenance {
  AuditChatSurface surface = 1;
  string conversation_id = 2;
  string turn_id = 3;
  string task_id = 4;
  string step_id = 5;
  string action_request_id = 6;
}

message AuditExecutionProvenance {
  string scope_id = 1;
  string team_id = 2;
  string member_id = 3;
  string workflow_id = 4;
  string published_service_id = 5;
  string run_id = 6;
  string causation_id = 7;
  string correlation_id = 8;
  string actor_id = 9;
  int64 actor_state_version = 10;
  string actor_event_id = 11;
  AuditChatProvenance chat = 12;
}

message AuditRedaction {
  string policy = 1;
  repeated string omitted_fields = 2;
  bool values_sanitized = 3;
}

message AuditToolExecution {
  string arguments_sha256 = 1;
  AuditToolExecutionPhase execution_phase = 2;
  bool is_mutation = 3;
}

message AuditRecord {
  string audit_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string scope_id = 3;
  string audit_actor_id = 4;
  string identity_key_id = 5;
  AuditActorKind actor_kind = 6;
  AuditCredentialSource credential_source = 7;
  AuditOperationKind operation_kind = 8;
  string operation_name = 9;
  AuditSensitivityLevel sensitivity_level = 10;
  AuditOutcome outcome = 11;
  AuditTarget target = 12;
  AuditCorrelation correlation = 13;
  string request_summary = 14;
  string result_summary = 15;
  string error_code = 16;
  string error_summary = 17;
  map<string, string> annotations = 18;
  AuditCapturePlane capture_plane = 19;
  AuditCommittedFactReference committed_fact_ref = 20;
  string event_kind = 21;
  string subject = 22;
  google.protobuf.Timestamp recorded_at = 23;
  string schema_version = 24;
  string source = 25;
  AuditLifecyclePhase lifecycle_phase = 26;
  AuditTerminalOutcome terminal_outcome = 27;
  AuditFailure failure = 28;
  AuditExecutionProvenance provenance = 29;
  AuditRedaction redaction = 30;
  AuditToolExecution tool_execution = 31;
}

message AuditTrailDocument {
  string id = 1;
  string audit_id = 2;
  string content_hash = 3;
  AuditRecord record = 4;
  google.protobuf.Timestamp occurred_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  string audit_actor_id = 7;
  string scope_id = 8;
  string operation_name = 9;
  AuditOutcome outcome = 10;
  AuditSensitivityLevel sensitivity_level = 11;
  string target_kind = 12;
  string target_id = 13;
  string request_id = 14;
  string command_id = 15;
  string correlation_id = 16;
  string session_id = 17;
  string workflow_run_id = 18;
  string committed_event_id = 19;
  string committed_actor_id = 20;
  string committed_actor_type = 21;
  string committed_event_type_url = 22;
  int64 committed_state_version = 23;
  string event_kind = 24;
  string schema_version = 25;
  google.protobuf.Timestamp recorded_at = 26;
  AuditLifecyclePhase lifecycle_phase = 27;
  AuditTerminalOutcome terminal_outcome = 28;
  string subject = 29;
  string source = 30;
  string trace_id = 31;
  string tool_arguments_sha256 = 32;
  bool tool_is_mutation = 33;
  AuditToolExecutionPhase tool_execution_phase = 34;
}
