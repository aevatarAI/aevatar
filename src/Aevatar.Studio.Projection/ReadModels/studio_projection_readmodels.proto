  google.protobuf.Timestamp updated_at = 5;

  aevatar.gagents.user_config.LLMModelCatalogPolicyOwnerType owner_type = 20;
  string scope_id = 21;
  aevatar.gagents.user_config.LLMModelCatalogPolicyMode mode = 22;
  repeated aevatar.gagents.user_config.LLMModelCatalogPolicySource sources = 23;
