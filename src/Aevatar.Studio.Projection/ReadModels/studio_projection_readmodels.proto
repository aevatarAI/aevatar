syntax = "proto3";
package aevatar.studio.projection;
option csharp_namespace = "Aevatar.Studio.Projection.ReadModels";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "llm_selection.proto";
import "llm_model_catalog_policy_messages.proto";
import "workflow_delivery_messages.proto";
import "Tools/tool_presentation.proto";

message ContentArtifactCitationDocument {
  string citation_id = 1;
  string label = 2;
  string locator_section = 3;
  int64 locator_start_offset = 4;
  int64 locator_end_offset = 5;
  string locator_selector = 6;
  string source_artifact_id = 7;
  string source_artifact_revision_id = 8;
  string source_artifact_content_hash = 9;
  string source_artifact_media_type = 10;
  string external_source_uri = 11;
  string external_stable_id = 12;
  string external_document_revision = 13;
  string external_content_hash = 14;
  google.protobuf.Timestamp external_published_at_utc = 15;
  google.protobuf.Timestamp external_fetched_at_utc = 16;
}

message ContentArtifactRevisionDocument {
  string revision_id = 1;
  int64 revision_number = 2;
  string parent_revision_id = 3;
  string media_type = 4;
  int64 byte_length = 5;
  string content_hash = 6;
  string availability = 7;
  string content_location_kind = 8;
  bytes inline_content = 9;
  string backing_provider = 10;
  string backing_object_key = 11;
  string provenance_scope_id = 12;
  string provenance_team_id = 13;
  string provenance_member_id = 14;
  string provenance_workflow_id = 15;
  string provenance_published_service_id = 16;
  string provenance_run_id = 17;
  string provenance_work_order_id = 18;
  repeated ContentArtifactCitationDocument citations = 19;
  google.protobuf.Timestamp created_at_utc = 20;
  string redaction_reason = 21;
  google.protobuf.Timestamp redacted_at_utc = 22;
  google.protobuf.Timestamp retention_expired_at_utc = 23;
  string supersession_reason = 24;
}

// Actor-scoped current-state replica for ContentArtifactGAgent. Immutable
// revision facts are copied from the authoritative actor state; projection
// never reconstructs or advances artifact lifecycle state.
message ContentArtifactCurrentStateDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;
  string artifact_id = 20;
  string dedup_key = 21;
  string scope_id = 22;
  string team_id = 23;
  string kind = 24;
  string title = 25;
  string classification = 26;
  string lifecycle_status = 27;
  string current_revision_id = 28;
  int64 concurrency_version = 29;
  string owner_principal_id = 30;
  string owner_principal_kind = 31;
  repeated string reader_principal_ids = 32;
  repeated string writer_principal_ids = 33;
  string retention_policy_id = 34;
  google.protobuf.Timestamp retention_expires_at_utc = 35;
  string work_order_id = 36;
  repeated ContentArtifactRevisionDocument revisions = 37;
  repeated string provenance_run_ids = 38;
  google.protobuf.Timestamp created_at_utc = 39;
  google.protobuf.Timestamp artifact_updated_at_utc = 40;
  string tombstone_reason = 41;
  google.protobuf.Timestamp tombstoned_at_utc = 42;
}

message WorkOrderArtifactReferenceDocument {
  string artifact_id = 1;
  string artifact_kind = 2;
  string uri = 3;
  string revision_id = 4;
}

message WorkOrderRunOutcomeReferenceDocument {
  string delivery_id = 1;
  string run_id = 2;
  string run_actor_id = 3;
  string command_id = 4;
  string correlation_id = 5;
  string outcome = 6;
  int64 terminal_at_unix_ms = 7;
}

message WorkOrderAvailableActionsDocument {
  bool can_reassign = 1;
  bool can_dispatch = 2;
  bool can_cancel = 3;
}

// Actor-scoped current-state replica for WorkOrderGAgent. Business lifecycle
// decisions are copied from the authoritative actor state; projection does
// not reconstruct or advance the WorkOrder state machine.
message WorkOrderCurrentStateDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;

  string work_order_id = 20;
  string dedup_key = 21;
  string scope_id = 22;
  string team_id = 23;
  string requester_principal_id = 24;
  string requester_principal_kind = 25;
  string member_id = 26;
  string published_service_id = 27;
  string workflow_id = 28;
  string service_revision_id = 29;
  string implementation_kind = 30;
  string endpoint_id = 31;
  string intent = 32;
  string lifecycle_status = 33;
  int64 lifecycle_version = 34;
  int64 created_at_unix_ms = 35;
  int64 timeout_at_unix_ms = 36;
  google.protobuf.Timestamp work_order_updated_at_utc = 37;
  WorkOrderAvailableActionsDocument available_actions = 38;

  string input_prompt = 40;
  repeated WorkOrderArtifactReferenceDocument input_artifacts = 41;
  repeated WorkOrderArtifactReferenceDocument declared_result_artifacts = 42;
  reserved 43 to 45;

  reserved 50 to 56;

  string run_id = 60;
  string run_actor_id = 61;
  string run_command_id = 62;
  string run_correlation_id = 63;
  string run_revision_id = 64;
  string run_deployment_id = 65;
  int64 run_accepted_at_unix_ms = 66;
  reserved 67;

  WorkOrderRunOutcomeReferenceDocument run_outcome = 70;
  WorkOrderRunOutcomeReferenceDocument late_run_outcome = 71;
  string failure_code = 72;
  string failure_message = 73;
  string failure_source = 74;
  string failure_reference_id = 75;
  string terminal_reason = 76;
}

// Actor-scoped current-state replica for WorkflowDeliveryGAgent. The immutable
// package source remains available to the application boundary, while public
// delivery responses are responsible for selecting the fields they expose.
message WorkflowDeliveryCurrentStateDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;

  string delivery_id = 20;
  aevatar.gagents.workflow_delivery.WorkflowPackageVersionSnapshot package = 21;
  string target_scope_id = 22;
  google.protobuf.Timestamp expires_at_utc = 23;
  string note = 24;
  aevatar.gagents.workflow_delivery.WorkflowDeliveryLifecycleStatus lifecycle_status = 25;
  string created_by = 26;
  google.protobuf.Timestamp created_at_utc = 27;
  google.protobuf.Timestamp accessed_at_utc = 28;
  string revoked_by = 29;
  google.protobuf.Timestamp revoked_at_utc = 30;
  repeated aevatar.gagents.workflow_delivery.WorkflowDeliveryConnectionState connections = 31;
  aevatar.gagents.workflow_delivery.WorkflowInstallationState installation = 32;
}

// ─── Workflow Board Execution Materialized View ───
//
// Studio owns the workflow board product surface. The authoritative facts
// still come from WorkflowRunGAgent committed state events; this document is
// a Studio-shaped event-incremental materialized view for board snapshots.
// It is not a WorkflowRun actor current-state replica.

message WorkflowExecutionBoardDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  string root_actor_id = 5;
  string command_id = 6;
  string definition_actor_id = 7;
  string run_id = 8;
  string workflow_name = 9;
  string scope_id = 10;
  string run_origin = 11;
  string schedule_id = 12;
  int32 completion_status_value = 13;
  string current_node_id = 14;
  repeated WorkflowExecutionBoardNodeReadModel node_entries = 15;
  WorkflowExecutionBoardSummaryReadModel summary_value = 16;
  google.protobuf.Timestamp last_node_updated_at_utc_value = 19;
}

message WorkflowExecutionBoardNodeReadModel {
  string node_id = 1;
  string name = 2;
  string step_type = 3;
  int32 status_value = 4;
  int32 order = 5;
  google.protobuf.Timestamp requested_at_utc_value = 6;
  google.protobuf.Timestamp completed_at_utc_value = 7;
  google.protobuf.Timestamp updated_at_utc_value = 8;
  int64 duration_ms = 9;
  string next_node_id = 10;
  string branch_key = 11;
}

message WorkflowExecutionBoardSummaryReadModel {
  int32 completed_steps = 1;
  int32 running_nodes = 2;
  int32 waiting_or_pending_nodes = 3;
  int32 failed_nodes = 4;
  optional int32 definition_step_count = 5;
}

// Materialized workflow-native source fact for the scope workflow catalogue.
// source_kind distinguishes draft-owned and service-owned facts; Team/Member
// bindings are not part of this catalogue surface.
message ScopeWorkflowCatalogueSourceDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;

  string scope_id = 20;
  string workflow_id = 21;
  string source_kind = 22;
  string name = 23;
  string description = 24;
  google.protobuf.Timestamp source_updated_at_utc_value = 25;

  string service_key = 30;
  string workflow_name = 31;
  string committed_actor_id = 32;
  string active_revision_id = 33;
  string deployment_id = 34;
  string deployment_status = 35;
  string service_app_id = 36;
  string service_namespace = 37;
  string published_service_id = 38;
}

// Aggregate workflow catalogue row keyed by scope_id + workflow_id. The request
// path reads this row document only; source documents remain an internal
// materialization input for converging draft and published service facts.
message ScopeWorkflowCatalogueRowDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;

  string scope_id = 20;
  string workflow_id = 21;
  string name = 22;
  string description = 23;
  bool has_draft_source = 24;
  bool has_published_source = 25;
  google.protobuf.Timestamp row_updated_at_utc_value = 26;
  string updated_at_source = 27;
  google.protobuf.Timestamp source_watermark_utc_value = 28;

  string service_key = 30;
  string workflow_name = 31;
  string committed_actor_id = 32;
  string active_revision_id = 33;
  string deployment_id = 34;
  string deployment_status = 35;
  string published_service_id = 36;
  string service_app_id = 37;
  string service_namespace = 38;
}

// ─── UserConfig Current State ReadModel ───

message UserConfigCurrentStateDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;

  // Business fields (projected from UserConfigGAgentState)
  string default_model = 10;
