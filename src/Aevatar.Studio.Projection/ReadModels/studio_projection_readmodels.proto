// ─── ChatConversation Current State ReadModel ───

message ChatConversationTurnDocument {
  string turn_id = 1;
  int32 sequence = 2;
  string user_text = 3;
  string assistant_text = 4;
  string terminal_status = 5;
  string sanitized_error = 6;
  int64 terminal_time_ms = 7;
  string llm_route = 8;
  string llm_model = 9;
  repeated ChatConversationTurnOperationDocument operations = 10;
}

// Query copy of one committed turn operation. Timing stays absent when the
// operation never reported it; previews stay marked as truncated fragments.
message ChatConversationTurnOperationDocument {
  reserved 17;
  reserved "result_preview";
  string operation_id = 1;
  int32 order = 2;
  string kind = 3;
  string title = 4;
  string status = 5;
  int64 started_at_ms = 6;
  int64 completed_at_ms = 7;
  string model = 8;
  string provider = 9;
  string finish_reason = 10;
  int32 prompt_tokens = 11;
  int32 completion_tokens = 12;
  int32 total_tokens = 13;
  string input_preview = 14;
  string output_preview = 15;
  string arguments_preview = 16;
  bool previews_truncated = 18;
  string safe_message = 19;
  repeated string available_tool_names = 20;
  bool tool_catalog_captured = 21;
}

message ChatConversationCurrentStateDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;
  string scope_id = 20;
  string conversation_id = 21;
  string title = 22;
  string service_id = 23;
  string service_kind = 24;
  int64 created_at_ms = 25;
  int64 updated_at_ms = 26;
  int32 message_count = 27;
  string llm_route = 28;
  string llm_model = 29;
  bool deleted = 30;
  repeated ChatConversationTurnDocument turns = 31;
}

// ─── NyxIdChat Conversation Current State ReadModel ───
//
// Actor-scoped, query-shaped replica of NyxIdChatConversationGAgentState.
// It deliberately excludes prompts, input parts, action params, credentials,
// owner subjects, raw tool results, and the actor's complete state root.

message NyxIdChatConversationTurnDocument {
  string turn_id = 1;
  string task_id = 2;
  string status = 3;
  string failure_code = 4;
  string safe_message = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp terminal_at = 7;
  string command_id = 8;
}

message NyxIdChatConversationAvailableActionsDocument {
  bool retry = 1;
  bool skip = 2;
  bool stop = 3;
}

message NyxIdChatConversationOperationDocument {
  string conversation_actor_id = 1;
  string turn_id = 2;
  string task_id = 3;
  string step_id = 4;
  string operation_id = 5;
  int64 operation_generation = 6;
  string kind = 7;
  string phase = 8;
  bool may_change_external_state = 9;
  bool idempotent = 10;
  int64 latest_progress_sequence = 11;
  string terminal_code = 12;
  string safe_message = 13;
  google.protobuf.Timestamp requested_at = 14;
  google.protobuf.Timestamp dispatched_at = 15;
  google.protobuf.Timestamp completed_at = 16;
  google.protobuf.Timestamp last_progress_at = 17;
  google.protobuf.Timestamp stalled_at = 18;
}

message NyxIdChatConversationLLMStepSourceDocument {
  string model = 1;
}

message NyxIdChatConversationToolStepSourceDocument {
  string tool_name = 1;
  string service_slug = 2;
  string service_id = 3;
  optional string readiness_capability_id = 4;
  string provider_resource_id = 5;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 6;
}

message NyxIdChatConversationBrowserActionStepSourceDocument {
  string action = 1;
  string action_request_id = 2;
}

message NyxIdChatConversationPostconditionStepSourceDocument {
  string action_request_id = 1;
  string check = 2;
  string provider_resource_id = 3;
}

message NyxIdChatConversationInputStepSourceDocument {
  string request_id = 1;
}

message NyxIdChatConversationApprovalStepSourceDocument {
  string approval_request_id = 1;
}

message NyxIdChatConversationWebStepSourceDocument {}

message NyxIdChatConversationNumericConditionDocument {
  string condition_id = 1;
  string source_input_request_id = 2;
  int64 suggested_threshold = 3;
  int64 effective_threshold = 4;
  string threshold_origin = 5;
  int64 observed_value = 6;
  string comparison = 7;
  string outcome = 8;
  google.protobuf.Timestamp evaluated_at = 9;
  string guarded_tool_name = 10;
}

message NyxIdChatConversationConditionStepSourceDocument {
  NyxIdChatConversationNumericConditionDocument condition = 1;
}

message NyxIdChatConversationStepGuardDocument {
  string condition_step_id = 1;
  string required_outcome = 2;
}

message NyxIdChatConversationStepSourceDocument {
  oneof source {
    NyxIdChatConversationLLMStepSourceDocument llm = 1;
    NyxIdChatConversationToolStepSourceDocument tool = 2;
    NyxIdChatConversationBrowserActionStepSourceDocument browser_action = 3;
    NyxIdChatConversationPostconditionStepSourceDocument postcondition = 4;
    NyxIdChatConversationInputStepSourceDocument input = 5;
    NyxIdChatConversationApprovalStepSourceDocument approval = 6;
    NyxIdChatConversationWebStepSourceDocument web = 7;
    NyxIdChatConversationConditionStepSourceDocument condition = 8;
  }
}

message NyxIdChatConversationStepEstimateDocument {
  string kind = 1;
  int32 seconds = 2;
}

message NyxIdChatConversationSubstepDocument {
  string substep_id = 1;
  string title = 2;
  string status = 3;
}

message NyxIdChatConversationPostReturnApprovalObservationDocument {
  string approval_request_id = 1;
  string decision_mode = 2;
  string receipt_status = 3;
  google.protobuf.Timestamp observed_at = 4;
  string terminal_outcome = 5;
  string subject_kind = 6;
  reserved 7;
  reserved "subject_id";
}

message NyxIdChatConversationStepDocument {
  string step_id = 1;
  int32 order = 2;
  string kind = 3;
  string status = 4;
  bool required = 5;
  string description = 6;
  bool may_change_external_state = 7;
  string external_effect = 8;
  string approval_request_id = 9;
  string action_request_id = 10;
  string failure_code = 11;
  string safe_message = 12;
  bool safe_to_skip = 13;
  NyxIdChatConversationAvailableActionsDocument available_actions = 14;
  google.protobuf.Timestamp updated_at = 15;
  NyxIdChatConversationOperationDocument operation = 16;
  NyxIdChatConversationStepSourceDocument source = 17;
  string added_by = 18;
  repeated string depends_on = 19;
  NyxIdChatConversationStepEstimateDocument estimate = 20;
  repeated NyxIdChatConversationSubstepDocument substeps = 21;
  int32 added_in_plan_revision = 22;
  int32 cancelled_in_plan_revision = 23;
  NyxIdChatConversationPostReturnApprovalObservationDocument approval_observation = 24;
  NyxIdChatConversationStepGuardDocument guard = 25;
}

message NyxIdChatConversationPlanRevisionDocument {
  int32 plan_revision = 1;
  string revision_cause = 2;
  google.protobuf.Timestamp committed_at = 3;
  repeated string added_step_ids = 4;
  repeated string cancelled_step_ids = 5;
}

message NyxIdChatConversationTaskDocument {
  reserved 16, 19, 20;
  reserved "gate", "domain", "artifact";
  string task_id = 1;
  string turn_id = 2;
  string status = 3;
  string active_step_id = 4;
  string active_operation_id = 5;
  string failure_code = 6;
  string safe_message = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated NyxIdChatConversationStepDocument steps = 10;
  int32 schema_version = 11;
  string actor_id = 12;
  string plan_id = 13;
  int32 plan_revision = 14;
  string title = 15;
  repeated NyxIdChatConversationPlanRevisionDocument plan_revisions = 17;
