  string member_id = 22;
  string request_hash = 23;
  string status = 24;
  string platform_binding_command_id = 25;
  int32 attempt_count = 26;
  string platform_execution_stage = 27;
  int32 platform_execution_attempt = 28;
  string last_readiness_status = 29;

  string failure_code = 30;
  string failure_message = 31;
  google.protobuf.Timestamp failure_at = 32;

  string result_published_service_id = 40;
  string result_revision_id = 41;
  string result_implementation_kind = 42;
  string result_expected_actor_id = 43;
}

// ─── StudioTeam Current State ReadModel ───
//
// Materialized from StudioTeamGAgent committed events (ADR-0017). Document id
// is the actor id (<c>studio-team:{scopeId}:{teamId}</c>). scope_id is the
// prefix used by query ports to list teams per scope. The full member roster
// is intentionally NOT mirrored — listing members goes through the member
// read model filtered by team_id (see ADR-0017 Non-Goals).

message StudioTeamCurrentStateDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;

  // ── Identity / display ──
  string team_id = 20;
  string scope_id = 21;
  string display_name = 22;
  string description = 23;

  // ── Lifecycle (wire-stable string mirroring StudioTeamLifecycleStage). ──
  string lifecycle_stage = 24;           // "active" | "archived" | ""
  google.protobuf.Timestamp created_at = 25;

  // ── Aggregate (derived from StudioTeamState.member_ids.size()). ──
  int32 member_count = 30;

  // Optional team-owned entry member selection. Binding readiness and
  // published service identity stay on StudioMemberCurrentStateDocument.
  optional string entry_member_id = 40;
}

// ─── StudioWorkspace Current State ReadModel ───
//
// Materialized from StudioWorkspaceGAgent. This is the actor-scoped current
// state replica for editor workspace facts only. It intentionally excludes
// connector/role catalogs, service-run execution state, workflow runtime state,
// provider secrets, memory, and registry facts.

message StudioWorkspaceDraftSummary {
  string workflow_id = 1;
  string name = 2;
  string file_name = 3;
  string directory_id = 4;
  int64 version = 5;
}

message StudioWorkspaceCurrentStateDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at = 5;
  reserved 10;
  reserved "state_root";

  // Opaque protobuf JSON for StudioWorkspaceState. Stored as a scalar readmodel
  // field so Elasticsearch never dynamically maps draft YAML/step/config trees.
  string state_root_json = 11;

  // Stable draft query surface. Complex draft payloads such as YAML remain only
  // in state_root_json and are not indexed as dynamic Elasticsearch fields.
  repeated StudioWorkspaceDraftSummary draft_summaries = 12;
}
