syntax = "proto3";

package aevatar.garnet.secrets;

option csharp_namespace = "Aevatar.Foundation.Runtime.Persistence.Implementations.Garnet";

enum GarnetSecretRecordStatus {
  GARNET_SECRET_RECORD_STATUS_UNSPECIFIED = 0;
  GARNET_SECRET_RECORD_STATUS_ACTIVE = 1;
  GARNET_SECRET_RECORD_STATUS_REVOKED = 2;
  GARNET_SECRET_RECORD_STATUS_CONSUMED = 3;
}

message GarnetSecretCiphertext {
  string key_id = 1;
  string algorithm = 2;
  bytes nonce = 3;
  bytes ciphertext = 4;
  bytes tag = 5;
}

message GarnetSecretVaultRecord {
  string ref = 1;
  string purpose = 2;
  string owner_scope_key = 3;
  string subject_id = 4;
  int64 version = 5;
  GarnetSecretRecordStatus status = 6;
  GarnetSecretCiphertext encrypted_secret = 7;
  string fingerprint = 8;
  int64 created_at_unix_ms = 9;
  int64 rotated_at_unix_ms = 10;
  int64 revoked_at_unix_ms = 11;
  int64 expires_at_unix_ms = 12;
}

message GarnetRuntimeSecretRecord {
  string ref = 1;
  string purpose = 2;
  string owner_run_id = 3;
  string owner_step_id = 4;
  bool consume_once = 5;
  GarnetSecretRecordStatus status = 6;
  GarnetSecretCiphertext encrypted_secret = 7;
  string fingerprint = 8;
  int64 created_at_unix_ms = 9;
  int64 expires_at_unix_ms = 10;
  int64 consumed_at_unix_ms = 11;
  int64 revoked_at_unix_ms = 12;
}

message GarnetSecretVaultAssociatedData {
  string ref = 1;
  string purpose = 2;
  string owner_scope_key = 3;
  string subject_id = 4;
  int64 version = 5;
  GarnetSecretRecordStatus status = 6;
  string fingerprint = 7;
  int64 created_at_unix_ms = 8;
  int64 rotated_at_unix_ms = 9;
  int64 revoked_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
}

message GarnetRuntimeSecretAssociatedData {
  string ref = 1;
  string purpose = 2;
  string owner_run_id = 3;
  string owner_step_id = 4;
  bool consume_once = 5;
  GarnetSecretRecordStatus status = 6;
  string fingerprint = 7;
  int64 created_at_unix_ms = 8;
  int64 expires_at_unix_ms = 9;
  int64 consumed_at_unix_ms = 10;
  int64 revoked_at_unix_ms = 11;
}
