syntax = "proto3";

package aevatar.foundation.runtime.callbacks;

option csharp_namespace = "Aevatar.Foundation.Runtime.Callbacks";

import "agent_messages.proto";

enum RuntimeCallbackScheduleDeliveryMode {
  RUNTIME_CALLBACK_SCHEDULE_DELIVERY_MODE_UNSPECIFIED = 0;
  RUNTIME_CALLBACK_SCHEDULE_DELIVERY_MODE_FIRED_SELF_EVENT = 1;
  RUNTIME_CALLBACK_SCHEDULE_DELIVERY_MODE_ENVELOPE_REDELIVERY = 2;
}

enum RuntimeCallbackOverduePolicy {
  RUNTIME_CALLBACK_OVERDUE_POLICY_UNSPECIFIED = 0;
  RUNTIME_CALLBACK_OVERDUE_POLICY_DELIVER = 1;
}

message RuntimeCallbackSchedulerState {
  map<string, RuntimeScheduledCallback> reminder_callbacks = 1;
  map<string, int64> callback_generations = 2;
  repeated string pending_reminder_unregistrations = 3;
}

message RuntimeScheduledCallback {
  string actor_id = 1;
  string callback_id = 2;
  int64 generation = 3;
  bool periodic = 4;
  int64 due_time_millis = 5;
  int64 period_millis = 6;
  int64 fire_index = 7;
  RuntimeCallbackScheduleDeliveryMode delivery_mode = 8;
  aevatar.EventEnvelope trigger_envelope = 9;
  int32 slot_epoch = 10;
  int64 next_due_at_unix_time_ms = 11;
  RuntimeCallbackOverduePolicy overdue_policy = 12;
  aevatar.EventEnvelope pending_delivery_envelope = 13;
  string last_delivery_envelope_id = 14;
  int64 last_delivery_fire_index = 15;
  aevatar.EventEnvelope last_delivery_envelope = 16;
}
