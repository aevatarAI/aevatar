syntax = "proto3";

package aevatar.hosting.executionactivity;

option csharp_namespace = "Aevatar.Capabilities.ExecutionActivity";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

enum ExecutionActivityLifecycleStage {
  EXECUTION_ACTIVITY_LIFECYCLE_STAGE_UNSPECIFIED = 0;
  EXECUTION_ACTIVITY_LIFECYCLE_STAGE_STARTED = 1;
  EXECUTION_ACTIVITY_LIFECYCLE_STAGE_COMPLETED = 2;
  EXECUTION_ACTIVITY_LIFECYCLE_STAGE_FAILED = 3;
}

message ExecutionActivityEvent {
  string scope_id = 1;
  string actor_id = 2;
  string agent_type = 3;
  string handler_name = 4;
  string event_type = 5;
  string event_id = 6;
  ExecutionActivityLifecycleStage stage = 7;
  google.protobuf.Timestamp ts = 8;
  google.protobuf.Duration duration = 9;
  string error = 10;
}
