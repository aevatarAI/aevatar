syntax = "proto3";

package aevatar.workflow.queries;

option csharp_namespace = "Aevatar.Workflow.Application.Abstractions.Queries";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "workflow_execution_messages.proto";
import "workflow_external_action.proto";

enum WorkflowRecoveryEligibility {
  WORKFLOW_RECOVERY_ELIGIBILITY_UNSPECIFIED = 0;
  WORKFLOW_RECOVERY_ELIGIBILITY_ELIGIBLE = 1;
  WORKFLOW_RECOVERY_ELIGIBILITY_INELIGIBLE = 2;
  WORKFLOW_RECOVERY_ELIGIBILITY_UNAVAILABLE = 3;
}

enum WorkflowRecoveryUnavailableReasonCode {
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_UNSPECIFIED = 0;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_NONE = 1;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_SOURCE_RUN_NOT_TERMINAL = 2;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_MISSING_SOURCE_FACT = 3;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_AUTHORIZATION_FAILURE = 4;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_CONFIGURATION_FAILURE = 5;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_WORKFLOW_DEFINITION_UNAVAILABLE = 6;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_LEGACY_UNAVAILABLE = 7;
}

enum WorkflowRecoveryRecommendedAction {
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_UNSPECIFIED = 0;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_RETRY = 1;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_RUN_AGAIN = 2;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_FIX_ACCESS = 3;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_CHANGE_CONFIGURATION = 4;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_EDIT_WORKFLOW = 5;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_EDIT_INPUT = 6;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_TECHNICAL_DETAILS = 7;
}

enum WorkflowRunStepOutcome {
  WORKFLOW_RUN_STEP_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_RUN_STEP_OUTCOME_SUCCEEDED = 1;
  WORKFLOW_RUN_STEP_OUTCOME_FAILED = 2;
  WORKFLOW_RUN_STEP_OUTCOME_WAITING = 3;
  WORKFLOW_RUN_STEP_OUTCOME_SKIPPED = 4;
}

message WorkflowRecoveryActionCapability {
  WorkflowRecoveryEligibility eligibility = 1;
  WorkflowRecoveryUnavailableReasonCode unavailable_reason_code = 2;
  string unavailable_reason = 3;
  repeated WorkflowRecoveryRecommendedAction recommended_actions = 4;
  string starting_step_id = 5;
  bool reuses_prior_step_outputs = 6;
  bool may_incur_model_or_tool_cost = 7;
}

message WorkflowRunRecoveryCapability {
  WorkflowRecoveryActionCapability retry_failed_step = 1;
  WorkflowRecoveryActionCapability run_again = 2;
  string workflow_definition_revision_id = 3;
  int64 workflow_definition_version = 4;
}

message WorkflowActorSnapshot {
  string actor_id = 1;
  string workflow_name = 2;
  string last_command_id = 3;
  int32 completion_status_value = 4;
  int64 state_version = 5;
  string last_event_id = 6;
  google.protobuf.Timestamp last_updated_at_utc = 7;
  google.protobuf.BoolValue last_success_wrapper = 8;
  string last_output = 9;
  string last_error = 10;
  int32 total_steps = 11;
  int32 requested_steps = 12;
  int32 completed_steps = 13;
  int32 role_reply_count = 14;
  repeated WorkflowRunFileRef input_file_refs = 15;
  aevatar.workflow.WorkflowSagaStatus saga_status = 16;
  string dead_letter_failed_compensation_step_id = 17;
  int32 dead_letter_remaining_uncompensated = 18;
  string dead_letter_error = 19;
  google.protobuf.Timestamp started_at_utc = 20;
  string scope_id = 21;
  string run_origin = 22;
  repeated aevatar.workflow.WorkflowExternalActionApprovalSnapshot connector_approvals = 23;
  string workflow_id = 24;
  google.protobuf.Timestamp completed_at_utc = 25;
  optional double duration_ms = 26;
  WorkflowRunActivityInitiatorSnapshot activity_initiator = 27;
  string input_summary = 28;
  WorkflowRunActivityStepSnapshot activity_current_step = 29;
  WorkflowRunActivityFailureSnapshot activity_first_failure = 30;
  WorkflowRunActivityWaitingSnapshot activity_waiting = 31;
  string run_id = 32;
  WorkflowRunRecoveryCapability recovery_capability = 33;
  aevatar.workflow.WorkflowRunLineage lineage = 34;
  string compilation_error = 35;
  aevatar.workflow.WorkflowValueLifecycleFailureKind terminal_value_lifecycle_failure_kind = 36;
}

message WorkflowRunActivityInitiatorSnapshot {
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
  string scope = 4;
  string binding_id = 5;
  string display_value = 6;
  string availability = 7;
}

message WorkflowRunActivityStepSnapshot {
  string step_id = 1;
  string input_summary = 2;
  string availability = 3;
}

message WorkflowRunActivityFailureSnapshot {
  string step_id = 1;
  string message = 2;
  string availability = 3;
}

message WorkflowRunActivityWaitingSnapshot {
  string step_id = 1;
  string waiting_kind = 2;
  string prompt = 3;
  string availability = 4;
}

message WorkflowRunFileRef {
  string file_id = 1;
  string artifact_id = 2;
  int32 source_kind_value = 3;
  string source_message_id = 4;
  string source_resource_key = 5;
  string file_name = 6;
  string media_type = 7;
  int64 size_bytes = 8;
  string sha256 = 9;
  int64 created_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  string owner_run_id = 12;
  string owner_scope_id = 13;
}

message WorkflowActorProjectionState {
  string actor_id = 1;
  string last_command_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp last_updated_at_utc = 5;
}

message WorkflowRunTimelineExportItem {
  google.protobuf.Timestamp timestamp_utc = 1;
  string stage = 2;
  string message = 3;
  string agent_id = 4;
  string step_id = 5;
  string step_type = 6;
  string event_type = 7;
  map<string, string> data = 8;
}

message WorkflowRunGraphExportNode {
  string node_id = 1;
  string node_type = 2;
  google.protobuf.Timestamp updated_at_utc = 3;
  map<string, string> properties = 4;
}

message WorkflowRunGraphExportEdge {
  string edge_id = 1;
  string from_node_id = 2;
  string to_node_id = 3;
  string edge_type = 4;
  google.protobuf.Timestamp updated_at_utc = 5;
  map<string, string> properties = 6;
}

message WorkflowRunGraphExportRouteFingerprint {
  string contract_id = 1;
  int64 contract_version = 2;
  string physical_namespace = 3;
  int64 route_epoch = 4;
}

message WorkflowRunGraphExportSourceCoordinate {
  string actor_id = 1;
  int64 state_version = 2;
  string event_id = 3;
}

message WorkflowRunGraphExportSubgraph {
  string root_node_id = 1;
  repeated WorkflowRunGraphExportNode nodes = 2;
  repeated WorkflowRunGraphExportEdge edges = 3;
  int64 source_state_version = 4;
  WorkflowRunGraphExportRouteFingerprint route_fingerprint = 5;
  WorkflowRunGraphExportSourceCoordinate source_coordinate = 6;
}
