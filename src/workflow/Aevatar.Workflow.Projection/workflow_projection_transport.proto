syntax = "proto3";

option csharp_namespace = "Aevatar.Workflow.Projection.ReadModels";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "workflow_execution_messages.proto";
import "workflow_external_action.proto";
import "workflow_capability_admission.proto";

enum WorkflowRecoveryEligibilityReadModel {
  WORKFLOW_RECOVERY_ELIGIBILITY_READ_MODEL_UNSPECIFIED = 0;
  WORKFLOW_RECOVERY_ELIGIBILITY_READ_MODEL_ELIGIBLE = 1;
  WORKFLOW_RECOVERY_ELIGIBILITY_READ_MODEL_INELIGIBLE = 2;
  WORKFLOW_RECOVERY_ELIGIBILITY_READ_MODEL_UNAVAILABLE = 3;
}

enum WorkflowRecoveryUnavailableReasonCodeReadModel {
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_READ_MODEL_UNSPECIFIED = 0;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_READ_MODEL_NONE = 1;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_READ_MODEL_SOURCE_RUN_NOT_TERMINAL = 2;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_READ_MODEL_MISSING_SOURCE_FACT = 3;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_READ_MODEL_AUTHORIZATION_FAILURE = 4;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_READ_MODEL_CONFIGURATION_FAILURE = 5;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_READ_MODEL_WORKFLOW_DEFINITION_UNAVAILABLE = 6;
  WORKFLOW_RECOVERY_UNAVAILABLE_REASON_CODE_READ_MODEL_LEGACY_UNAVAILABLE = 7;
}

enum WorkflowRecoveryRecommendedActionReadModel {
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_READ_MODEL_UNSPECIFIED = 0;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_READ_MODEL_RETRY = 1;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_READ_MODEL_RUN_AGAIN = 2;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_READ_MODEL_FIX_ACCESS = 3;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_READ_MODEL_CHANGE_CONFIGURATION = 4;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_READ_MODEL_EDIT_WORKFLOW = 5;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_READ_MODEL_EDIT_INPUT = 6;
  WORKFLOW_RECOVERY_RECOMMENDED_ACTION_READ_MODEL_TECHNICAL_DETAILS = 7;
}

enum WorkflowExecutionStepOutcomeReadModel {
  WORKFLOW_EXECUTION_STEP_OUTCOME_READ_MODEL_UNSPECIFIED = 0;
  WORKFLOW_EXECUTION_STEP_OUTCOME_READ_MODEL_SUCCEEDED = 1;
  WORKFLOW_EXECUTION_STEP_OUTCOME_READ_MODEL_FAILED = 2;
  WORKFLOW_EXECUTION_STEP_OUTCOME_READ_MODEL_WAITING = 3;
  WORKFLOW_EXECUTION_STEP_OUTCOME_READ_MODEL_SKIPPED = 4;
}

message WorkflowRecoveryActionCapabilityReadModel {
  WorkflowRecoveryEligibilityReadModel eligibility = 1;
  WorkflowRecoveryUnavailableReasonCodeReadModel unavailable_reason_code = 2;
  string unavailable_reason = 3;
  repeated WorkflowRecoveryRecommendedActionReadModel recommended_actions = 4;
  string starting_step_id = 5;
  bool reuses_prior_step_outputs = 6;
  bool may_incur_model_or_tool_cost = 7;
}

message WorkflowRunRecoveryCapabilityReadModel {
  WorkflowRecoveryActionCapabilityReadModel retry_failed_step = 1;
  WorkflowRecoveryActionCapabilityReadModel run_again = 2;
  string workflow_definition_revision_id = 3;
  int64 workflow_definition_version = 4;
}

// Immutable, run-document-local address for one step request attempt. The evidence id is an
// opaque key derived from the typed (step_id, execution_id) identity; consumers must not parse it.
message WorkflowStepRequestEvidenceReference {
  string evidence_id = 1;
  string execution_id = 2;
  string source_event_id = 3;
}

// Sanitized request parameters retained once per immutable step execution. Step summaries,
// failed-attempt snapshots and timeline entries carry only WorkflowStepRequestEvidenceReference.
message WorkflowStepRequestEvidence {
  string evidence_id = 1;
  string step_id = 2;
  string execution_id = 3;
  string source_event_id = 4;
  map<string, string> parameters_map = 5;
  int64 source_parameter_utf8_bytes = 6;
  int64 retained_parameter_utf8_bytes = 7;
  string retained_parameter_sha256 = 8;
}

message WorkflowRunInsightReportDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp created_at_utc_value = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  string root_actor_id = 6;
  string command_id = 7;
  string report_version = 8;
  int32 projection_scope_value = 9;
  int32 topology_source_value = 10;
  int32 completion_status_value = 11;
  string workflow_name = 12;
  google.protobuf.Timestamp started_at_utc_value = 13;
  google.protobuf.Timestamp ended_at_utc_value = 14;
  double duration_ms = 15;
  google.protobuf.BoolValue success_wrapper = 16;
  string input = 17;
  string final_output = 18;
  string final_error = 19;
  repeated WorkflowExecutionTopologyEdge topology_entries = 20;
  repeated WorkflowExecutionStepTrace step_entries = 21;
  repeated WorkflowExecutionRoleReply role_reply_entries = 22;
  repeated WorkflowExecutionTimelineEvent timeline_entries = 23;
  WorkflowExecutionSummary summary_value = 24;
  WorkflowUsageMetricsReadModel usage_value = 25;
  repeated WorkflowRuntimeOperationReadModel operation_entries = 26;
  // Stable O(1) lookup for the growing step list. Values are zero-based indexes
  // into step_entries and are rebuilt once when reading a legacy document.
  map<string, int32> step_index_by_id = 27;
  // Immutable evidence store keyed by an opaque digest of (step_id, execution_id). This is a
  // typed collection, not an extension bag; each full sanitized request parameter map appears
  // at most once in the report document.
  map<string, WorkflowStepRequestEvidence> request_evidence_by_id = 28;
  WorkflowWaitingSignalReadModel current_waiting_signal = 29;
}

message WorkflowWaitingSignalReadModel {
  string run_id = 1;
  string step_id = 2;
  string signal_name = 3;
  string prompt = 4;
  int32 timeout_ms = 5;
}

message WorkflowExecutionCurrentStateDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  string root_actor_id = 5;
  string command_id = 6;
  string definition_actor_id = 7;
  string run_id = 8;
  string workflow_name = 9;
  string status = 10;
  bool compiled = 11;
  string compilation_error = 12;
  string input = 13;
  string final_output = 14;
  string final_error = 15;
  int32 execution_state_count = 16;
  google.protobuf.BoolValue success_wrapper = 17;
  string workflow_yaml = 18;
  map<string, string> inline_workflow_yaml_entries = 19;
  map<string, string> fork_seed_variable_entries = 20;
  repeated string fork_seed_completed_step_id_entries = 21;
  string fork_seed_last_failed_step_id = 22;
  string scope_id = 23;
  repeated WorkflowExecutionInputFileRefReadModel input_file_ref_entries = 24;
  map<string, WorkflowStepIdempotencyReadModel> fork_seed_idempotency_entries = 25;
  aevatar.workflow.WorkflowSagaStatus saga_status = 26;
  string dead_letter_failed_compensation_step_id = 27;
  int32 dead_letter_remaining_uncompensated = 28;
  string dead_letter_error = 29;
  google.protobuf.Timestamp started_at_utc_value = 30;
  // Canonical run origin/type carried from the committed WorkflowRunState. Observatory filter
  // dimension; empty for legacy/unstamped runs.
  string run_origin = 31;
  // Per-schedule correlation id carried from the committed WorkflowRunState. Observatory filter
  // dimension for "this schedule's runs"; empty for non-scheduled/legacy runs.
  string schedule_id = 32;
  repeated aevatar.workflow.WorkflowExternalActionApprovalSnapshot connector_approval_entries = 33;
  aevatar.workflow.WorkflowCapabilityAdmissionPlan capability_admission_plan = 34;
  aevatar.workflow.ExternalCapabilityExecutionMode expected_execution_mode = 35;
  string workflow_id = 36;
  google.protobuf.Timestamp completed_at_utc_value = 37;
  optional double duration_ms = 38;
  WorkflowRunActivityInitiatorReadModel activity_initiator = 39;
  string input_summary = 40;
  WorkflowRunActivityStepReadModel activity_current_step = 41;
  WorkflowRunActivityFailureReadModel activity_first_failure = 42;
  WorkflowRunActivityWaitingReadModel activity_waiting = 43;
  WorkflowRunRecoveryCapabilityReadModel recovery_capability = 44;
  string revision_id = 45;
  int64 definition_version = 46;
  aevatar.workflow.WorkflowRunLineage lineage = 47;
  aevatar.workflow.WorkflowNormalizedExecutionSeed normalized_fork_seed = 48;
  aevatar.workflow.WorkflowValueLifecycleFailureKind terminal_value_lifecycle_failure_kind = 49;
}

message WorkflowRunActivityInitiatorReadModel {
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
  string scope = 4;
  string binding_id = 5;
  string display_value = 6;
  string availability = 7;
}

message WorkflowRunActivityStepReadModel {
  string step_id = 1;
  string input_summary = 2;
  string availability = 3;
}

message WorkflowRunActivityFailureReadModel {
  string step_id = 1;
  string message = 2;
  string availability = 3;
}

message WorkflowRunActivityWaitingReadModel {
  string step_id = 1;
  string waiting_kind = 2;
  string prompt = 3;
  string availability = 4;
}

message WorkflowExternalApprovalContinuationDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  string actor_id = 5;
  string run_id = 6;
  string step_id = 7;
  string signal_name = 8;
  string source_id = 9;
  string external_id_kind = 10;
  string external_id = 11;
  string callback_idempotency_key = 12;
  string request_id = 13;
  bool active = 14;
}

message WorkflowStepIdempotencyReadModel {
  string logical_run_id = 1;
  string step_id = 2;
  int32 logical_attempt = 3;
  string idempotency_key = 4;
}

message WorkflowExecutionInputFileRefReadModel {
  string file_id = 1;
  string artifact_id = 2;
  int32 source_kind_value = 3;
  string source_message_id = 4;
  string source_resource_key = 5;
  string file_name = 6;
  string media_type = 7;
  int64 size_bytes = 8;
  string sha256 = 9;
  int64 created_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  string owner_run_id = 12;
  string owner_scope_id = 13;
}

message WorkflowExecutionTopologyEdge {
  string parent = 1;
  string child = 2;
}

message WorkflowExecutionStepTrace {
  string step_id = 1;
  string step_type = 2;
  string target_role = 3;
  google.protobuf.Timestamp requested_at_utc_value = 4;
  google.protobuf.Timestamp completed_at_utc_value = 5;
  google.protobuf.BoolValue success_wrapper = 6;
  string worker_id = 7;
  string output_preview = 8;
  string error = 9;
  // Legacy inline slot. New requests with a typed execution_id use request_evidence_reference.
  map<string, string> request_parameters_map = 10;
  map<string, string> completion_annotations_map = 11;
  string next_step_id = 12;
  string branch_key = 13;
  string assigned_variable = 14;
  string assigned_value = 15;
  string suspension_type = 16;
  string suspension_prompt = 17;
  int32 suspension_timeout_seconds_value = 18;
  string requested_variable_name = 19;
  WorkflowUsageMetricsReadModel usage_value = 20;
  string suspension_content = 21;
  WorkflowToolApprovalReadModel tool_approval_value = 22;
  string display_name = 23;
  WorkflowExecutionStepOutcomeReadModel outcome = 24;
  // Sanitized diagnostic output from the current failed completion. The projection keeps a bounded
  // head/tail representation and records whether any source text was omitted.
  string failure_output = 25;
  bool failure_output_truncated = 26;
  aevatar.workflow.WorkflowStepFailureOutcome failure_outcome = 27;
  aevatar.workflow.WorkflowRecoveryFailureKind recovery_failure_kind = 28;
  aevatar.workflow.WorkflowStepRetryDisposition retry_disposition = 29;
  aevatar.workflow.WorkflowFileItemResultSet file_item_results = 30;
  aevatar.workflow.VoteAgreementDecision vote_agreement_decision = 31;
  // When a new request replaces a failed current attempt, the complete failed attempt is moved here
  // before the current-attempt fields are reset. This keeps request identity and failure evidence
  // from different attempts from being combined.
  WorkflowExecutionFailedStepAttemptReadModel latest_failed_attempt = 32;
  WorkflowStepRequestEvidenceReference request_evidence_reference = 33;
}

message WorkflowExecutionFailedStepAttemptReadModel {
  string display_name = 1;
  string step_type = 2;
  string target_role = 3;
  google.protobuf.Timestamp requested_at_utc_value = 4;
  google.protobuf.Timestamp completed_at_utc_value = 5;
  google.protobuf.BoolValue success_wrapper = 6;
  string worker_id = 7;
  string output_preview = 8;
  string error = 9;
  // Legacy inline slot. New snapshots retain only request_evidence_reference.
  map<string, string> request_parameters_map = 10;
  map<string, string> completion_annotations_map = 11;
  string next_step_id = 12;
  string branch_key = 13;
  string assigned_variable = 14;
  string assigned_value = 15;
  WorkflowUsageMetricsReadModel usage_value = 16;
  string failure_output = 17;
  bool failure_output_truncated = 18;
  aevatar.workflow.WorkflowStepFailureOutcome failure_outcome = 19;
  aevatar.workflow.WorkflowRecoveryFailureKind recovery_failure_kind = 20;
  aevatar.workflow.WorkflowStepRetryDisposition retry_disposition = 21;
  aevatar.workflow.WorkflowFileItemResultSet file_item_results = 22;
  aevatar.workflow.VoteAgreementDecision vote_agreement_decision = 23;
  string suspension_type = 24;
  string suspension_prompt = 25;
  int32 suspension_timeout_seconds_value = 26;
  string requested_variable_name = 27;
  string suspension_content = 28;
  WorkflowToolApprovalReadModel tool_approval_value = 29;
  WorkflowStepRequestEvidenceReference request_evidence_reference = 30;
}

message WorkflowToolApprovalReadModel {
  string execution_id = 1;
  string tool_name = 2;
  string tool_call_id = 3;
  string approval_request_id = 4;
}

message WorkflowUsageMetricsReadModel {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  string model = 4;
  double cost = 5;
  int64 latency_ms = 6;
}

message WorkflowExecutionRoleReply {
  google.protobuf.Timestamp timestamp_utc_value = 1;
  string role_id = 2;
  string session_id = 3;
  string content = 4;
  int32 content_length = 5;
}

message WorkflowRuntimeOperationReadModel {
  string session_id = 1;
  string operation_id = 2;
  int64 progress_sequence = 3;
  int32 round = 4;
  aevatar.workflow.WorkflowRuntimeOperationKind kind = 5;
  google.protobuf.Timestamp started_at_utc_value = 6;
  google.protobuf.Timestamp completed_at_utc_value = 7;
  string role_actor_id = 8;
  string model = 9;
  string provider = 10;
  string input_summary = 11;
  repeated string available_tool_names = 12;
  string output = 13;
  string finish_reason = 14;
  WorkflowUsageMetricsReadModel usage_value = 15;
  google.protobuf.BoolValue success_wrapper = 16;
  string error = 17;
  string tool_call_id = 18;
  string tool_name = 19;
  string arguments_json = 20;
  string result_json = 21;
  string reasoning_content = 22;
  int64 started_progress_sequence = 23;
  int64 completed_progress_sequence = 24;
  string tool_catalog_policy_version = 25;
  int32 tool_catalog_tool_count = 26;
  int32 tool_catalog_schema_bytes = 27;
  string tool_catalog_digest = 28;
}

message WorkflowExecutionTimelineEvent {
  google.protobuf.Timestamp timestamp_utc_value = 1;
  string stage = 2;
  string message = 3;
  string agent_id = 4;
  string step_id = 5;
  string step_type = 6;
  string event_type = 7;
  map<string, string> data_map = 8;
  // Present for step.request entries with a typed execution_id. Other timeline stages continue
  // to use data_map for their bounded stage-specific data.
  WorkflowStepRequestEvidenceReference request_evidence_reference = 9;
}

message WorkflowExecutionSummary {
  int32 total_steps = 1;
  int32 requested_steps = 2;
  int32 completed_steps = 3;
  int32 role_reply_count = 4;
  map<string, int32> step_type_counts_map = 5;
}

message WorkflowCatalogCurrentStateDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  string actor_id = 5;
  string workflow_name = 6;
  string workflow_yaml = 7;
  string description = 8;
  string category = 9;
  string group = 10;
  string group_label = 11;
  int32 sort_order = 12;
  string source = 13;
  string source_label = 14;
  bool show_in_library = 15;
  bool is_primitive_example = 16;
  bool requires_llm_provider = 17;
  repeated string primitive_entries = 18;
  bool closed_world_mode = 19;
  repeated WorkflowCatalogRoleReadModel role_entries = 20;
  repeated WorkflowCatalogStepReadModel step_entries = 21;
  repeated WorkflowCatalogEdgeReadModel edge_entries = 22;
  repeated string required_connector_entries = 23;
  repeated string workflow_call_entries = 24;
  aevatar.workflow.WorkflowAuthorizationDependencies authorization_dependencies = 25;
  string catalog_publication_contract_version = 26;
}

message WorkflowCatalogRoleReadModel {
  string id = 1;
  string name = 2;
  string system_prompt = 3;
  string provider = 4;
  string model = 5;
  google.protobuf.FloatValue temperature = 6;
  google.protobuf.Int32Value max_tokens = 7;
  google.protobuf.Int32Value max_tool_rounds = 8;
  google.protobuf.Int32Value max_history_messages = 9;
  repeated string event_module_entries = 10;
  string event_routes = 11;
  repeated string connector_entries = 12;
}

message WorkflowCatalogStepReadModel {
  string id = 1;
  string type = 2;
  string target_role = 3;
  map<string, string> parameter_entries = 4;
  string next = 5;
  map<string, string> branch_entries = 6;
  repeated WorkflowCatalogChildStepReadModel child_entries = 7;
}

message WorkflowCatalogChildStepReadModel {
  string id = 1;
  string type = 2;
  string target_role = 3;
}

message WorkflowCatalogEdgeReadModel {
  string from = 1;
  string to = 2;
  string label = 3;
}
