syntax = "proto3";

option csharp_namespace = "Aevatar.Workflow.Projection.ReadModels";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "workflow_execution_messages.proto";
import "workflow_external_action.proto";
import "workflow_capability_admission.proto";

message WorkflowRunInsightReportDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp created_at_utc_value = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  string root_actor_id = 6;
  string command_id = 7;
  string report_version = 8;
  int32 projection_scope_value = 9;
  int32 topology_source_value = 10;
  int32 completion_status_value = 11;
  string workflow_name = 12;
  google.protobuf.Timestamp started_at_utc_value = 13;
  google.protobuf.Timestamp ended_at_utc_value = 14;
  double duration_ms = 15;
  google.protobuf.BoolValue success_wrapper = 16;
  string input = 17;
  string final_output = 18;
  string final_error = 19;
  repeated WorkflowExecutionTopologyEdge topology_entries = 20;
  repeated WorkflowExecutionStepTrace step_entries = 21;
  repeated WorkflowExecutionRoleReply role_reply_entries = 22;
  repeated WorkflowExecutionTimelineEvent timeline_entries = 23;
  WorkflowExecutionSummary summary_value = 24;
  WorkflowUsageMetricsReadModel usage_value = 25;
}

message WorkflowExecutionCurrentStateDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  string root_actor_id = 5;
  string command_id = 6;
  string definition_actor_id = 7;
  string run_id = 8;
  string workflow_name = 9;
  string status = 10;
  bool compiled = 11;
  string compilation_error = 12;
  string input = 13;
  string final_output = 14;
  string final_error = 15;
  int32 execution_state_count = 16;
  google.protobuf.BoolValue success_wrapper = 17;
  string workflow_yaml = 18;
  map<string, string> inline_workflow_yaml_entries = 19;
  map<string, string> fork_seed_variable_entries = 20;
  repeated string fork_seed_completed_step_id_entries = 21;
  string fork_seed_last_failed_step_id = 22;
  string scope_id = 23;
  repeated WorkflowExecutionInputFileRefReadModel input_file_ref_entries = 24;
  map<string, WorkflowStepIdempotencyReadModel> fork_seed_idempotency_entries = 25;
  aevatar.workflow.WorkflowSagaStatus saga_status = 26;
  string dead_letter_failed_compensation_step_id = 27;
  int32 dead_letter_remaining_uncompensated = 28;
  string dead_letter_error = 29;
  google.protobuf.Timestamp started_at_utc_value = 30;
  // Canonical run origin/type carried from the committed WorkflowRunState. Observatory filter
  // dimension; empty for legacy/unstamped runs.
  string run_origin = 31;
  // Per-schedule correlation id carried from the committed WorkflowRunState. Observatory filter
  // dimension for "this schedule's runs"; empty for non-scheduled/legacy runs.
  string schedule_id = 32;
  repeated aevatar.workflow.WorkflowExternalActionApprovalSnapshot connector_approval_entries = 33;
  aevatar.workflow.WorkflowCapabilityAdmissionPlan capability_admission_plan = 34;
  aevatar.workflow.ExternalCapabilityExecutionMode expected_execution_mode = 35;
}

message WorkflowExternalApprovalContinuationDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  string actor_id = 5;
  string run_id = 6;
  string step_id = 7;
  string signal_name = 8;
  string source_id = 9;
  string external_id_kind = 10;
  string external_id = 11;
  string callback_idempotency_key = 12;
  string request_id = 13;
  bool active = 14;
}

message WorkflowStepIdempotencyReadModel {
  string logical_run_id = 1;
  string step_id = 2;
  int32 logical_attempt = 3;
  string idempotency_key = 4;
}

message WorkflowExecutionInputFileRefReadModel {
  string file_id = 1;
  string artifact_id = 2;
  int32 source_kind_value = 3;
  string source_message_id = 4;
  string source_resource_key = 5;
  string file_name = 6;
  string media_type = 7;
  int64 size_bytes = 8;
  string sha256 = 9;
  int64 created_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  string owner_run_id = 12;
  string owner_scope_id = 13;
}

message WorkflowExecutionTopologyEdge {
  string parent = 1;
  string child = 2;
}

message WorkflowExecutionStepTrace {
  string step_id = 1;
  string step_type = 2;
  string target_role = 3;
  google.protobuf.Timestamp requested_at_utc_value = 4;
  google.protobuf.Timestamp completed_at_utc_value = 5;
  google.protobuf.BoolValue success_wrapper = 6;
  string worker_id = 7;
  string output_preview = 8;
  string error = 9;
  map<string, string> request_parameters_map = 10;
  map<string, string> completion_annotations_map = 11;
  string next_step_id = 12;
  string branch_key = 13;
  string assigned_variable = 14;
  string assigned_value = 15;
  string suspension_type = 16;
  string suspension_prompt = 17;
  int32 suspension_timeout_seconds_value = 18;
  string requested_variable_name = 19;
  WorkflowUsageMetricsReadModel usage_value = 20;
  string suspension_content = 21;
}

message WorkflowUsageMetricsReadModel {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  string model = 4;
  double cost = 5;
  int64 latency_ms = 6;
}

message WorkflowExecutionRoleReply {
  google.protobuf.Timestamp timestamp_utc_value = 1;
  string role_id = 2;
  string session_id = 3;
  string content = 4;
  int32 content_length = 5;
}

message WorkflowExecutionTimelineEvent {
  google.protobuf.Timestamp timestamp_utc_value = 1;
  string stage = 2;
  string message = 3;
  string agent_id = 4;
  string step_id = 5;
  string step_type = 6;
  string event_type = 7;
  map<string, string> data_map = 8;
}

message WorkflowExecutionSummary {
  int32 total_steps = 1;
  int32 requested_steps = 2;
  int32 completed_steps = 3;
  int32 role_reply_count = 4;
  map<string, int32> step_type_counts_map = 5;
}

message WorkflowCatalogCurrentStateDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp updated_at_utc_value = 4;
  string actor_id = 5;
  string workflow_name = 6;
  string workflow_yaml = 7;
  string description = 8;
  string category = 9;
  string group = 10;
  string group_label = 11;
  int32 sort_order = 12;
  string source = 13;
  string source_label = 14;
  bool show_in_library = 15;
  bool is_primitive_example = 16;
  bool requires_llm_provider = 17;
  repeated string primitive_entries = 18;
  bool closed_world_mode = 19;
  repeated WorkflowCatalogRoleReadModel role_entries = 20;
  repeated WorkflowCatalogStepReadModel step_entries = 21;
  repeated WorkflowCatalogEdgeReadModel edge_entries = 22;
  repeated string required_connector_entries = 23;
  repeated string workflow_call_entries = 24;
  aevatar.workflow.WorkflowAuthorizationDependencies authorization_dependencies = 25;
}

message WorkflowCatalogRoleReadModel {
  string id = 1;
  string name = 2;
  string system_prompt = 3;
  string provider = 4;
  string model = 5;
  google.protobuf.FloatValue temperature = 6;
  google.protobuf.Int32Value max_tokens = 7;
  google.protobuf.Int32Value max_tool_rounds = 8;
  google.protobuf.Int32Value max_history_messages = 9;
  repeated string event_module_entries = 10;
  string event_routes = 11;
  repeated string connector_entries = 12;
}

message WorkflowCatalogStepReadModel {
  string id = 1;
  string type = 2;
  string target_role = 3;
  map<string, string> parameter_entries = 4;
  string next = 5;
  map<string, string> branch_entries = 6;
  repeated WorkflowCatalogChildStepReadModel child_entries = 7;
}

message WorkflowCatalogChildStepReadModel {
  string id = 1;
  string type = 2;
  string target_role = 3;
}

message WorkflowCatalogEdgeReadModel {
  string from = 1;
  string to = 2;
  string label = 3;
}
