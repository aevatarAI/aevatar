<body data-mobile-view="list">

  <!-- ===================== App root ===================== -->
  <div id="app" aria-busy="false"></div>


<script>
/* ===========================================================================
   Data + auth layer (production wiring).
   Browser OIDC Authorization Code + PKCE against nyxid (reuse of the console-web
   client; no server-side cookie/session, no NyxID change). All data flows through
   scope-gated bearer APIs; the page itself is the anonymous static shell.
   A small client cache backs the synchronous render contract (DataSource.*):
     listRuns(status) <- GET /api/workflow/observatory/activity-runs (paged request-trace feed)
     getRun(runId)    <- GET /api/workflow/observatory/runs/{runId}; admin drilldown uses /admin/runs/{runId}
     getGraph(runId)  <- GET /api/workflow/observatory/runs/{runId}/graph; admin drilldown uses /admin/runs/{runId}/graph
   Observatory data endpoints stay read-only. Owner actions use the canonical scope command APIs.
   =========================================================================== */
const BACKEND_CONSOLE_CONFIG = __BACKEND_CONSOLE_CONFIG__;
const CFG = {
  authority: BACKEND_CONSOLE_CONFIG.authority || "",
  // nyxid REST API (different origin than this app; CORS-enabled, allows the Authorization header).
  // Used admin-only to resolve a run's scopeId (≈ nyxid user id) to that user's display name.
  nyxidApi: BACKEND_CONSOLE_CONFIG.nyxidApi || "",
  clientId: BACKEND_CONSOLE_CONFIG.clientId || "",
  scope: BACKEND_CONSOLE_CONFIG.scope || "",
  resources: Array.isArray(BACKEND_CONSOLE_CONFIG.resources) ? BACKEND_CONSOLE_CONFIG.resources : [],
  redirectUri: location.origin + "/auto/callback",
  storageKey: BACKEND_CONSOLE_CONFIG.storageKey || "",
  pollMs: 3000
};
const TOKEN_KEY = CFG.storageKey + ":token";
const PKCE_KEY  = CFG.storageKey + ":pkce";
const OBSERVATORY_VIEW_KEY = CFG.storageKey + ":observatory:view";
const OBSERVATORY_IMMERSIVE_KEY = CFG.storageKey + ":observatory:immersive";

function b64url(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function sha256(text){ return b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text))); }
function randomString(len){ const a=new Uint8Array(len); crypto.getRandomValues(a); return b64url(a.buffer).slice(0, len); }

function getToken(){ const raw=localStorage.getItem(TOKEN_KEY); if(!raw) return null; try { return JSON.parse(raw); } catch(e){ console.warn("observatory: token parse failed", e); } return null; }
function setToken(t){ localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }
function isEmbeddedInAdmin(){ try { return window.parent && window.parent !== window && window.frameElement && window.frameElement.getAttribute("data-console-frame") === "1"; } catch(e){ return false; } }
function notifyAdminShellAuth(type, reason, rejectedAccessToken){
  if(!isEmbeddedInAdmin()) return false;
  window.parent.postMessage({ source:"aevatar-backend-console-suite", type, reason: reason || "", rejectedAccessToken:rejectedAccessToken || "" }, location.origin);
  return true;
}
function replacementToken(rejectedAccessToken){
  const current=getToken();
  return current&&current.access_token&&current.access_token!==rejectedAccessToken ? current : null;
}
async function requestAdminShellTokenRefresh(rejectedAccessToken){
  const existing=replacementToken(rejectedAccessToken); if(existing) return existing;
  if(!isEmbeddedInAdmin()) return null;
  const requestId="auth-"+Date.now().toString(36)+"-"+randomString(10);
  return await new Promise(resolve=>{
    let timer=null,settled=false;
    function finish(){
      if(settled) return; settled=true;
      window.removeEventListener("message",onMessage);
      if(timer!==null) clearTimeout(timer);
      resolve(replacementToken(rejectedAccessToken));
    }
    function onMessage(ev){
      const msg=ev.data||{};
      if(ev.origin===location.origin&&ev.source===window.parent&&msg.source==="aevatar-backend-console-suite"&&msg.type==="auth-refresh-result"&&msg.requestId===requestId) finish();
    }
    window.addEventListener("message",onMessage);
    timer=setTimeout(finish,10000);
    window.parent.postMessage({source:"aevatar-backend-console-suite",type:"auth-refresh-request",requestId,rejectedAccessToken},location.origin);
  });
}
async function fetchWithConsoleAuth(path,options){
  let token=getToken(); if(!token||!token.access_token) throw new Error("not-authenticated");
  options=options||{};
  function request(activeToken){
    const headers=Object.assign({},options.headers||{},{Authorization:"Bearer "+activeToken.access_token});
    return fetch(path,Object.assign({},options,{headers}));
  }
  let res=await request(token);
  if(res.status!==401) return res;
  let replacement=replacementToken(token.access_token);
  if(!replacement) replacement=await requestAdminShellTokenRefresh(token.access_token);
  if(replacement&&replacement.access_token!==token.access_token){
    token=replacement; res=await request(token);
    if(res.status!==401) return res;
  }
  signOutSilent(token.access_token);
  const error=new Error("unauthorized"); error.status=401; throw error;
}
function navigateAdminShell(module, query){
  const message={source:"aevatar-backend-console-suite",type:"navigate",module,query:query||{}};
  if(isEmbeddedInAdmin()){ window.parent.postMessage(message,location.origin); return; }
  const p=new URLSearchParams(); Object.entries(query||{}).forEach(([key,value])=>{if(value)p.set(key,value);});
  location.assign("/admin#/"+module+(p.toString()?"?"+p:""));
}

async function beginLogin(){
  if(notifyAdminShellAuth("login-request")) return;
  const verifier = randomString(64);
  const st = randomString(32);
  const challenge = await sha256(verifier);
  sessionStorage.setItem(PKCE_KEY, JSON.stringify({ verifier, state: st, returnTo: location.pathname + location.search }));
  const u = new URL(CFG.authority + "/oauth/authorize");
  u.searchParams.set("response_type", "code");
  u.searchParams.set("client_id", CFG.clientId);
  u.searchParams.set("redirect_uri", CFG.redirectUri);
  u.searchParams.set("scope", CFG.scope);
  u.searchParams.set("state", st);
  u.searchParams.set("code_challenge", challenge);
  u.searchParams.set("code_challenge_method", "S256");
  location.assign(u.toString());
}

async function completeLoginIfCallback(){
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  if(!code) return false;
  const returnedState = params.get("state");
  const pending = JSON.parse(sessionStorage.getItem(PKCE_KEY) || "null");
  history.replaceState({}, "", (pending && pending.returnTo) || "/admin#/observatory");
  if(!pending || pending.state !== returnedState){ console.warn("observatory: login state mismatch"); return false; }
  const form = new URLSearchParams();
  form.set("grant_type", "authorization_code");
  form.set("code", code);
  form.set("redirect_uri", CFG.redirectUri);
  form.set("client_id", CFG.clientId);
  form.set("code_verifier", pending.verifier);
  const res = await fetch(CFG.authority + "/oauth/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body: form.toString() });
  sessionStorage.removeItem(PKCE_KEY);
  if(!res.ok){ console.warn("observatory: token exchange failed", res.status); return false; }
  const token = await res.json();
  token.obtained_at = Date.now();
  setToken(token);
  return true;
}

async function fetchUserInfo(){
  const token = getToken(); if(!token) return null;
  try { const res = await fetch(CFG.authority + "/oauth/userinfo", { headers:{ Authorization:"Bearer " + token.access_token } }); return res.ok ? await res.json() : null; }
  catch(e){ console.warn("observatory: userinfo fetch failed", e); }
  return null;
}
function toAccount(info){ return info ? { label: info.email || info.preferred_username || info.sub || "已登录" } : null; }

async function apiRequest(path, options){
  options = options || {};
  const method = String(options.method || "GET").toUpperCase();
  const res = await fetchWithConsoleAuth(path, options);
  if(res.status === 404 && method === "GET") return null;
  if(!res.ok){
    let reason = "api-error-" + res.status;
    try { const body = await res.json(); reason = body.message || body.error || body.code || reason; } catch(e){}
    throw new Error(reason);
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function api(path){ return apiRequest(path); }

/* The Activity feed is a distinct envelope. Keep its normalization as a pure seam so rendering never
   mistakes pagination metadata for a trace, and so static-asset tests can probe contract drift. */
function isActivityRunFeedEnvelope(value){
  return !!value&&typeof value==="object"&&Array.isArray(value.items)&&typeof value.hasMore==="boolean";
}
function normalizeActivityRunFeed(value){
  const source=value&&typeof value==="object"?value:{};
  const total=source.totalCount==null?NaN:Number(source.totalCount);
  return {
    items:Array.isArray(source.items)?source.items:[],
    nextCursor:typeof source.nextCursor==="string"&&source.nextCursor?source.nextCursor:null,
    hasMore:source.hasMore===true,
    totalCount:Number.isSafeInteger(total)&&total>=0?total:null
  };
}
function activityRunFeedRequestPath(query){ return "/api/workflow/observatory/activity-runs"+(query||""); }

/* client cache backing the synchronous render contract */
const cache = { account:null, runs:[], runFeed:normalizeActivityRunFeed(null), details:{}, graphs:{} };
const DataSource = {
  now: () => new Date().toISOString(),
  getAccount: () => cache.account || { label:"已登录" },
  // Filtering (status/origin/time) is pushed to the server query via listQueryParams; the cache already
  // holds the filtered set, so the list reads it as-is (no second client-side status pass).
  listRuns: () => cache.runs.slice(),
  getRunFeed: () => cache.runFeed,
  getRun: (runId) => cache.details[runId] || null,
  getGraph: (runId) => cache.graphs[runId] || null
};

/* 06-20-observatory-admin-cross-scope: cross-scope admin view state (drives the admin bar + API scope params). */
const ALL_SCOPES = "__all__";
const adminState = { isAdmin:false, role:"", email:"", ownScope:"", currentScope:null, inputDraft:"", runIdDraft:"", candidates:null, message:"" };
function runScopeParam(runId){
  if(!adminState.isAdmin) return "";
  const run = cache.runs.find(r => r.runId === runId);
  const scope = run ? run.scopeId : ((adminState.currentScope && adminState.currentScope !== ALL_SCOPES) ? adminState.currentScope : "");
  return (scope && scope !== adminState.ownScope) ? "?scope=" + encodeURIComponent(scope) : "";
}
function runDetailRequestPath(runId, admin, runs, graph){
  const run=(runs||[]).find(item=>item.runId===runId);
  const suffix=graph?"/graph":"";
  if(admin.isAdmin&&(admin.currentScope==="__all__"||(!admin.currentScope&&!run))) return "/api/workflow/observatory/admin/runs/"+encodeURIComponent(runId)+suffix;
  const scope=run?run.scopeId:((admin.currentScope&&admin.currentScope!=="__all__")?admin.currentScope:"");
  const query=(scope&&scope!==admin.ownScope)?"?scope="+encodeURIComponent(scope):"";
  return "/api/workflow/observatory/runs/"+encodeURIComponent(runId)+suffix+query;
}
function runGraphRequestPath(runId, admin, runs){ return runDetailRequestPath(runId,admin,runs,true); }

/* ---------------------------------------------------------------------------
   nyxid user directory (admin-only): resolve a run's scopeId (≈ nyxid user id)
   to that user's display name. The directory endpoint is admin-gated, so we only
   ever fetch it when /me reported isAdmin; non-admins see no names (just their own
   scope). Searching by a UUID does NOT match server-side, so we page through the
   full user list once and build an id -> display_name map, cached for the session
   (refreshable on re-init). Plain fetch — different origin than this app, so the
   same-origin api() helper (and its bearer/redirect handling) doesn't apply. */
const nyxidDirectory = { byId: new Map(), loaded: false, loading: false };
async function loadNyxidDirectory(force){
  if(!adminState.isAdmin) return;
  if(nyxidDirectory.loading) return;
  if(nyxidDirectory.loaded && !force) return;
  const token = getToken(); if(!token) return;
  nyxidDirectory.loading = true;
  try {
    const map = new Map();
    const perPage = 50;
    // cap the page walk so a directory-size change can't loop unbounded; ~123 users today.
    for(let page = 1; page <= 50; page++){
      const url = CFG.nyxidApi + "/api/v1/admin/users?search=&per_page=" + perPage + "&page=" + page;
      const res = await fetch(url, { headers:{ Authorization:"Bearer " + token.access_token } });
      if(!res.ok) break; // 401/403 (not admin / token expired) or transient — keep whatever we have
      const body = await res.json();
      const users = (body && body.users) || [];
      for(const u of users){ if(u && u.id) map.set(String(u.id), u.display_name || ""); }
      const total = body && typeof body.total === "number" ? body.total : null;
      if(users.length < perPage) break;                 // last (short) page
      if(total != null && page * perPage >= total) break; // reached the reported total
    }
    nyxidDirectory.byId = map;
    nyxidDirectory.loaded = true;
  } catch(e){ console.warn("observatory: nyxid directory fetch failed", e); }
  finally { nyxidDirectory.loading = false; }
}
/* display name for a scopeId, or "" when admin gating is off / id unknown / name blank.
   Never fabricates — falls back to "" so callers keep showing the short id. */
function scopeDisplayName(scopeId){
  if(!adminState.isAdmin || !scopeId) return "";
  const name = nyxidDirectory.byId.get(String(scopeId));
  return name || "";
}

/* 06-23-observatory-run-coverage-filter: list-only filter dimensions pushed to the runs query
   (status / run-origin / updated-at window). scope stays the admin cross-scope axis above.
   Canonical strong sets so the UI never invents a status/origin the backend doesn't honor. */
const STATUS_OPTIONS = [
  ["", "全部状态"], ["running","运行中"], ["completed","已完成"],
  ["failed","失败"], ["timed_out","已超时"], ["stopped","已停止"]
];
const ORIGIN_OPTIONS = [
  ["", "全部来源"],
  ["draft","草稿运行"], ["member-invoke","成员调用"], ["default-invoke","默认调用"],
  ["team-invoke","团队调用"], ["service-invoke","服务调用"], ["webhook","外部 Webhook"], ["ad-hoc-chat","即席对话"], ["provisioned","计划调度"]
];
const ORIGIN_LABEL = Object.fromEntries(ORIGIN_OPTIONS.map(([v,l]) => [v,l]));
const STATUS_VALUES = new Set(STATUS_OPTIONS.map(o => o[0]));
const ORIGIN_VALUES = new Set(ORIGIN_OPTIONS.map(o => o[0]));
function readObservatoryRoute(search, hash){
  const query = new URLSearchParams(String(search || "").replace(/^\?/, ""));
  const legacyScope = /(?:^#|&)scope=([^&]+)/.exec(hash || "");
  const statusValues = new Set(["running","completed","failed","timed_out","stopped"]);
  const tabValues = new Set(["timeline","trajectory","steps","diagnostics","logs","artifacts","graph"]);
  const status = (query.get("status") || "").trim();
  const tab = (query.get("tab") || "").trim();
  return {
    scope: (query.get("scope") || (legacyScope ? decodeURIComponent(legacyScope[1]) : "mine")).trim() || "mine",
    status: statusValues.has(status) ? status : "",
    origin: (query.get("origin") || "").trim(),
    definition: (query.get("definition") || "").trim(),
    schedule: (query.get("schedule") || "").trim(),
    from: (query.get("from") || "").trim(),
    to: (query.get("to") || "").trim(),
    run: (query.get("run") || "").trim(),
    tab: tabValues.has(tab) ? tab : "timeline"
  };
}
function writeObservatoryRoute(patch){
  const previous=readObservatoryRoute(location.search,location.hash);
  const route = Object.assign(readObservatoryRoute(location.search, location.hash), patch || {});
  if(previous.tab!==route.tab) pendingDetailScrollReset=true;
  const query = new URLSearchParams();
  ["scope","status","origin","definition","schedule","from","to","run","tab"].forEach(key => {
    const value = route[key];
    if(value && !(key === "scope" && value === "mine") && !(key === "tab" && value === "timeline")) query.set(key, value);
  });
  history.replaceState(null, "", location.pathname + (query.toString() ? "?" + query : ""));
  if(isEmbeddedInAdmin()) window.parent.postMessage({source:"aevatar-backend-console-suite",type:"observatory-route",query:route},location.origin);
  return route;
}
/* The run list only depends on the filter fields (scope/status/origin/definition/schedule/from/to),
   so its scroll position is keyed by those alone — selecting a run (which only changes run/tab)
   must NOT reset the list scroll. The detail pane is keyed by run + tab, which are the fields that
   determine its content. */
function observatoryListKey(route){
  const r=route||{};
  return ["scope","status","origin","definition","schedule","from","to"]
    .map(key=>key+"="+encodeURIComponent(r[key]||"")).join("&");
}
function observatoryDetailKey(route){
  const r=route||{};
  return "run=" + encodeURIComponent(r.run||"") + "&tab=" + encodeURIComponent(r.tab||"");
}
function readObservatoryListState(storage,key,route){
  try { const all=JSON.parse(storage.getItem(key)||"{}"); return Math.max(0,Number((all[observatoryListKey(route)]||{}).list)||0); }
  catch(e){ return 0; }
}
function writeObservatoryListState(storage,key,route,position){
  try {
    let all={}; try { all=JSON.parse(storage.getItem(key)||"{}")||{}; } catch(e){}
    all[observatoryListKey(route)]={list:Math.max(0,Number(position)||0)};
    storage.setItem(key,JSON.stringify(all));
  } catch(e){}
}
function readObservatoryDetailState(storage,key,route){
  try { const all=JSON.parse(storage.getItem(key+":detail")||"{}"); return Math.max(0,Number((all[observatoryDetailKey(route)]||{}).detail)||0); }
  catch(e){ return 0; }
}
function writeObservatoryDetailState(storage,key,route,position){
  try {
    let all={}; try { all=JSON.parse(storage.getItem(key+":detail")||"{}")||{}; } catch(e){}
    const keys=Object.keys(all);
    if(keys.length>40) keys.slice(0,keys.length-40).forEach(existing=>delete all[existing]);
    all[observatoryDetailKey(route)]={detail:Math.max(0,Number(position)||0)};
    storage.setItem(key+":detail",JSON.stringify(all));
  } catch(e){}
}
function paneScrollPosition(pane,saved){

/* The API graph carries only nodes/edges; per-node status is reconstructed from the
   committed timeline (never invented) so the DAG can show real progress honestly. */
function deriveNodeStatus(graph, detail){
  const status = {};
  if(!graph || !graph.nodes) return status;
  const events = (detail && detail.timeline) || [];
  const started=new Set(), finished=new Set(), failedStep=new Set(), stoppedStep=new Set();
  for(const e of events){
    if(!e.stepId) continue;
    if(e.kind === "StepStarted" || e.kind === "HumanInputRequest") started.add(e.stepId);
    else if(e.kind === "StepFinished") finished.add(e.stepId);
    else if(e.kind === "RunError") failedStep.add(e.stepId);
    else if(e.kind === "RunStopped") stoppedStep.add(e.stepId);
  }
  const runStatus = (detail && detail.summary && detail.summary.status) || "";
  const running = runStatus === "running";
  const runFailed = runStatus === "failed" || runStatus === "timed_out";
  const runStopped = runStatus === "stopped";
  // run / actor topology nodes carry no stepId — they reflect the overall run state.
  const topologyStatus = running ? "current"
    : runStatus === "completed" ? "done"
    : runFailed ? "failed"
    : runStopped ? "stopped" : "pending";
  for(const nd of graph.nodes){
    // Graph node ids are composite (step:{actor}:{cmd}:{stepId}); match WorkflowStep nodes by the bare
    // stepId the API now surfaces — NOT the node id, which never equals the timeline's bare stepId.
    const sid = nd.stepId;
    if(!sid){ status[nd.nodeId] = topologyStatus; continue; }
    if(failedStep.has(sid)) status[nd.nodeId] = "failed";
    else if(stoppedStep.has(sid)) status[nd.nodeId] = "stopped";
    else if(finished.has(sid)) status[nd.nodeId] = "done";
    else if(started.has(sid)) status[nd.nodeId] = running ? "current" : (runFailed ? "failed" : runStopped ? "stopped" : "done");
    else status[nd.nodeId] = "pending";
  }
  return status;
}

/* JSON 着色（仅用于显示）。注意：先 esc() 转义，引号已变成 &quot;，
   因此高亮要匹配 &quot; 而非字面引号。本数据中字符串均为单行且不含 & 实体。 */
function colorJSON(str){
  if(!str) return "";
  let s = esc(str);
  // 字符串 / 键（键后跟冒号）
  s = s.replace(/(&quot;.*?&quot;)(\s*:)?/g, (m, tok, colon) =>
    colon ? `<span class="j-key">${tok}</span>${colon}` : `<span class="j-str">${tok}</span>`);
  // 数字（前面是空白/冒号/括号/逗号，后面是分隔符或行尾）
  s = s.replace(/(^|[\s:\[,])(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)(?=[\s,\]\}]|$)/g,
    (m, pre, num) => `${pre}<span class="j-num">${num}</span>`);
  // 布尔 / null
  s = s.replace(/\b(true|false)\b/g, '<span class="j-bool">$1</span>');
  s = s.replace(/\bnull\b/g, '<span class="j-null">null</span>');
  return s;
}

/* apply theme attr */

  if(state.theme === "light" || state.theme === "dark") document.documentElement.setAttribute("data-theme", state.theme);

function effectiveDark(){
  if(state.theme) return state.theme === "dark";

async function refreshObservatory(){
  if(state.refreshing) return;

function renderSelect(id, label, options, value, onPick){
  const field = el("div", { class:"fb-field" });
  field.appendChild(el("label", { class:"fb-label", for: id }, label));
  const sel = el("select", { class:"fb-select", id, "aria-label": label });
  options.forEach(([v,l]) => {
    const opt = el("option", { value: v }, l);
    if(v === value) opt.setAttribute("selected", "selected");
    sel.appendChild(opt);
  });
  sel.value = value;
  sel.addEventListener("change", e => onPick(e.target.value));
  field.appendChild(sel);
  return field;
}
function renderDate(id, label, value, onPick){
  const field = el("div", { class:"fb-field" });
  field.appendChild(el("label", { class:"fb-label", for: id }, label));
  const inp = el("input", { class:"fb-date", id, type:"date", "aria-label": label, value: value ? value.slice(0,10) : "" });
  inp.addEventListener("change", e => onPick(e.target.value));
  field.appendChild(inp);
  return field;
}

  bar.appendChild(renderDate("flt-to", "截止（更新于）", filterState.to,

function renderList(){

  const coverage = requestTraceCoverageLabel(feed, shown);
  head.innerHTML = `<div class="list-title-row"><span class="list-title"><span class="lt-ic" aria-hidden="true">${ICON.list}</span>请求轨迹</span><span class="list-count" title="${esc(coverage)}">${esc(requestTraceCountLabel(feed, shown))}</span></div><div class="list-coverage">${esc(coverage)}</div>`;
  pane.appendChild(head);
  pane.appendChild(renderFilterBar());

  const listbox = el("div", { class:"runlist scroll", role:"list", "aria-label":"请求轨迹，每次请求一条", tabindex:"-1" });

  if(state.scenario === "listLoading"){
    for(let i=0;i<5;i++){
      const r = el("div", { class:"sk-row" });
      r.innerHTML = `<div class="sk sk-dot"></div><div><div class="sk sk-line" style="width:62%"></div><div class="sk sk-line" style="width:42%;margin-top:8px;height:8px"></div></div>`;
      listbox.appendChild(r);
    }
    pane.appendChild(listbox);
    return pane;
  }

  const runs = state.scenario === "empty" ? [] : DataSource.listRuns();

  if(runs.length === 0){
    const isFiltered = hasActiveFilters();
    listbox.appendChild(el("div", { class:"empty" }, `
      <div class="ic" aria-hidden="true">${ICON.inbox}</div>
      <div class="et">${isFiltered ? "没有匹配的请求轨迹" : "暂无请求轨迹"}</div>
      <div class="es">${isFiltered ? "当前筛选条件下没有请求轨迹，放宽状态、来源或时间范围再看看。" : "每次工作流请求都会形成一条独立轨迹；新请求被读模型观测后会出现在这里。"}</div>`));
    pane.appendChild(listbox);
    return pane;
  }

  runs.forEach(r => {
    const sel = state.selectedRunId === r.runId && state.scenario==="normal";
    const row = el("button", { class:"run-row", type:"button", role:"listitem", "aria-current": String(sel), "aria-label":requestTraceAriaLabel(r) });
    // scope id per row is only meaningful in the cross-scope (全部 scope) view, where rows differ in
    // scope. When a single concrete scope is selected it's the same id on every row (already shown in
    // the admin bar) — pure noise — so it's hidden there.
    // In cross-scope (全部 scope) view rows differ by scope owner. For admins we resolve the scopeId
    // (≈ nyxid user id) to that user's display name and lead with it; the short id stays as the
    // secondary cue and the full id in the tooltip. Falls back to the short id when unresolved.
    const scopeName = scopeDisplayName(r.scopeId);
    const scopeCol = (adminState.isAdmin && adminState.currentScope === ALL_SCOPES)
      ? (scopeName
          ? `<span class="sep">·</span><span class="id" title="${esc(scopeName)} · scope id: ${esc(r.scopeId||"")}">${esc(scopeName)} <span class="muted-id">${esc(tailId(r.scopeId, 6))}</span></span>`
          : `<span class="sep">·</span><span class="id" title="scope id: ${esc(r.scopeId||"")}">${esc(tailId(r.scopeId, 14))}</span>`)
      : "";
    // run-origin badge: legacy/empty origin renders nothing (keeps the row readable at density).
    const olabel = originLabel(r.runOrigin);
    const originCol = olabel
      ? `<span class="sep">·</span><span class="rm-origin" title="运行来源：${esc(olabel)}">${esc(olabel)}</span>`
      : "";
    const duration = requestTraceDurationLabel(r, nowMs());
    const runningDurationAttr = r.status === "running" && r.startedAtUtc
      ? ` data-duration="${esc(r.startedAtUtc)}"`
      : "";
    const durationCol = duration ? `<span class="sep">·</span><span title="请求轨迹用时"${runningDurationAttr}>${esc(duration)}</span>` : "";
    const preview = requestTracePreview(r);
    row.innerHTML = `
      <span class="dot s-${r.status}" aria-hidden="true"></span>
      <span class="rn" title="${esc(r.workflowName)}">${esc(r.workflowName)}</span>
      <span class="rm">
        <span class="rm-status s-${r.status}">${STATUS_LABEL[r.status]||r.status}</span>${originCol}
        ${durationCol}
        <span class="sep">·</span>
        <span data-since="${r.updatedAtUtc}">${relTime(r.updatedAtUtc, nowMs())}</span>
        <span class="sep">·</span>
        <span class="id" title="run id: ${esc(r.runId)}">${esc(midTrunc(parseRunId(r.runId).run, 16) || tailId(r.runId, 12))}</span>${scopeCol}
      </span>

    row.addEventListener("click", () => selectRun(r.runId));
    listbox.appendChild(row);
  });
  if(feed.hasMore && feed.nextCursor){
    const loadMore = el("button", { class:"trace-load-more", type:"button" }, state.loadingMore ? "正在加载…" : "加载更早的请求轨迹");
    loadMore.disabled = state.loadingMore;
    loadMore.addEventListener("click", () => loadMoreRequestTraces());
    listbox.appendChild(loadMore);
  }
  pane.appendChild(listbox);
  return pane;
}

/* Run ids are composite (e.g. [scope:]workflow.definition:{defHash}:run:{runHash}). Break them into

function parseRunId(runId){
  const id = String(runId || "");
  const out = { full: id, scope: "", def: "", run: "" };
  const runM = /:run:([^:]+)\s*$/i.exec(id);
  if(runM) out.run = runM[1];
  const defM = /workflow\.definition:([^:]+)/i.exec(id);
  if(defM) out.def = defM[1];
  const dIdx = id.indexOf("workflow.definition:");
  if(dIdx > 0) out.scope = id.slice(0, dIdx).replace(/:+$/, "");

function evidenceHasValue(value){

}

  OPERATION_EVIDENCE_FIELDS.forEach(field=>{
    if(!Object.prototype.hasOwnProperty.call(snapshot,field)&&!evidenceHasValue(operation&&operation[field]))return;
    const bounded=boundedOperationEvidenceValue(operation&&operation[field],limit);
    snapshot[field]=bounded.text;

  container.appendChild(el("div",{class:"failure-truncated",role:"note"},`${surfaceLabel}每字段最多显示 ${bounds.maxChars} 字符的首尾片段；已省略：${bounds.truncatedFields.join("、")}。`));

  const row=runId&&typeof cache!=="undefined"&&Array.isArray(cache.runs)
    ?cache.runs.find(item=>item&&item.runId===runId):null;

function resolveRunControlTarget(detail, selectedRunId, runs){
  const summary=detail&&detail.summary,runId=String(selectedRunId||"").trim();
  const detailRunId=String(summary&&summary.runId||"").trim();
  if(!summary||summary.status!=="running"||!runId||detailRunId!==runId) return null;
  const scopeId=String(summary.scopeId||"").trim();
  if(!scopeId) return null;
  const row=(runs||[]).find(item=>item&&item.runId===runId)||null;
  if(row&&row.scopeId&&row.scopeId!==scopeId) return null;
  return { scopeId, runId, actorId:row?String(row.actorId||"").trim():"" };
}
function canStopRun(target, ownerScope){
  return !!(target&&target.scopeId&&String(ownerScope||"").trim()===target.scopeId);
}
function buildStopRequest(target, commandId){
  const body={ reason:"user requested stop", commandId:String(commandId||"").trim() };
  if(!body.commandId) throw new Error("stop-command-id-required");
  if(target.actorId) body.actorId=target.actorId;
  return {
    path:"/api/scopes/"+encodeURIComponent(target.scopeId)+"/runs/"+encodeURIComponent(target.runId)+":stop",
    body
  };
}
async function requestStopRun(target, commandId){
  const request=buildStopRequest(target,commandId);

  if(!receipt||receipt.accepted!==true) throw new Error("stop-not-accepted");
  return receipt;
}
function stopTargetKey(target){ return [target.scopeId,target.runId].join("\n"); }

}
function syncStopControlState(target){

  Object.assign(stopControlState,{key,selectedRunId:target.runId,commandId:"",confirming:false,submitting:false,accepted:false,error:""});
}

}
function openStopConfirmation(target){

  render();

function cancelStopConfirmation(target){

  stopControlState.confirming=false;
  stopControlState.error="";
  render();
  setTimeout(()=>document.getElementById("stopCurrentRunButton")?.focus(),0);

      try { await apiRequest(request.path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(request.body)}); approvalState.accepted=true; approvalState.rejecting=false; }
      catch(e){ approvalState.error=e.message||"审批提交失败"; }
      finally { approvalState.submitting=false; render(); }
    };
    const approve=el("button",{class:"btn-primary",type:"button",disabled:approvalState.submitting?"disabled":null},"批准并继续");
    approve.addEventListener("click",()=>submit(true)); actions.appendChild(approve);
    const reject=el("button",{class:"chip",type:"button",disabled:approvalState.submitting?"disabled":null},"驳回");
    reject.addEventListener("click",()=>{approvalState.rejecting=true;render();}); actions.appendChild(reject);
    if(approvalState.rejecting){
      const feedback=el("textarea",{class:"approval-feedback",rows:"3",placeholder:"驳回反馈（必填）"},esc(approvalState.feedback));

      const rejectSubmit=el("button",{class:"btn-primary",type:"button"},"提交驳回"); rejectSubmit.addEventListener("click",()=>submit(false)); actions.appendChild(rejectSubmit);
    }
    if(approvalState.error) box.appendChild(el("div",{class:"approval-error",role:"alert"},esc(approvalState.error)));

}

/* role.reply / Message events now carry the real LLM response in ev.content (was: only the role id).
   Render it as a beautified assistant bubble — role avatar + label, line breaks preserved, long replies
   clamped behind a 展开/收起 toggle. Empty content degrades to a small note (no empty bubble). */
function renderReplyBubble(ev){
  const role = ev.agentId || ev.stepId || "assistant";
  const reply = el("div", { class:"reply", role:"group", "aria-label":`模型回复 ${role}` });
  const head = el("div", { class:"reply-head" });
  head.innerHTML = `
    <span class="reply-avatar" aria-hidden="true">${esc(initials(role))}</span>
    <span class="reply-role" title="${esc(role)}">${esc(role)}</span>
    <span class="reply-tag">回复</span>
    <span class="reply-spacer"></span>`;
  reply.appendChild(head);

  const content = String(ev.content == null ? "" : ev.content);
  if(content.trim() === ""){
    reply.appendChild(el("div", { class:"reply-empty" }, "（无文本内容 —— 该回合可能仅触发工具调用）"));
    return reply;
  }
  // clamp long responses; offer expand/collapse. Threshold by length OR line count.
  const isLong = content.length > 360 || (content.match(/\n/g) || []).length > 8;
  const bodyEl = el("div", { class:"reply-body"+(isLong?" clamp":"") }, esc(content));
  reply.appendChild(bodyEl);
  if(isLong){
    const more = el("button", { class:"reply-more", type:"button", "aria-expanded":"false" }, `${ICON.chevron}<span>展开</span>`);
    more.addEventListener("click", () => {
      const clamped = bodyEl.classList.toggle("clamp");
      more.setAttribute("aria-expanded", String(!clamped));
      more.querySelector("span").textContent = clamped ? "展开" : "收起";
    });
    reply.appendChild(more);
  }
  return reply;
}

/* ---- Request operation trajectory --------------------------------------
   Typed operations are the authoritative ledger. Their stable operation id lets polling upsert the
   same row while preserving expansion state. Legacy timeline points are used only for old reports. */
function operationTypeIcon(type){
  if(type==="input") return ICON.play;
  if(type==="model") return ICON.chat;

function operationTimestamp(value){
  const parsed=parseT(value);
  return Number.isFinite(parsed)?parsed:null;
}
function operationDurationLabel(ms){
  const value=Number(ms);
  if(!Number.isFinite(value)||value<0) return "不可用";
  if(value<1000) return Math.round(value)+" ms";
  if(value<10000) return (value/1000).toFixed(2)+" s";
  if(value<60000) return (value/1000).toFixed(1)+" s";
  const minutes=Math.floor(value/60000),seconds=Math.round((value%60000)/1000);
  return minutes+"分"+String(seconds).padStart(2,"0")+"秒";
}
function operationRecordKey(type, preferred, timestamp, index){
  const stable=String(preferred||"").trim();
  return stable?[type,stable].join(":"):[type,String(timestamp||"unknown"),String(index)].join(":");
}
function operationDurationMs(startedAt,completedAt){
  const start=operationTimestamp(startedAt),end=operationTimestamp(completedAt);
  return start!=null&&end!=null&&end>=start?end-start:null;
}
function buildOperationRecords(detail){
  const timeline=Array.isArray(detail.timeline)?detail.timeline:[];
  const operations=Array.isArray(detail.operations)?detail.operations:[];
  const runId=detail.summary&&detail.summary.runId||"run";
  const startEvent=timeline.find(event=>event&&event.stage==="workflow.start");
  const inputTimestamp=(startEvent&&startEvent.timestampUtc)||(detail.summary&&detail.summary.startedAtUtc)||null;
  const fullInput=String(detail.input==null?"":detail.input);

    title:"Request input",preview:(fullInput||inputSummary||"未记录输入内容").replace(/\s+/g," "),
    content:fullInput||inputSummary,status:fullInput||inputSummary?"已提交":"内容不可用",statusTone:fullInput||inputSummary?"ok":"",
    durationMs:null,durationSource:"当前详情契约没有 Input 的独立起止时间。",
    fullInputAvailable:fullInput.length>0,sourceIndex:-1,anchorSequence:-1
  }];

  if(operations.length>0){
    operations.forEach((sourceOperation,index)=>{
      if(!sourceOperation||typeof sourceOperation!=="object") return;
      const operation=boundedOperationEvidenceSnapshot(sourceOperation,OPERATION_EVIDENCE_DETAIL_MAX_CHARS);
      const type=String(operation.kind||"").toLowerCase();
      if(type!=="model"&&type!=="tool") return;
      const sessionId=String(operation.sessionId||"");
      const operationId=String(operation.operationId||operation.toolCallId||"");
      const startedAt=operation.startedAtUtc||operation.startedAt||null;
      const completedAt=operation.completedAtUtc||operation.completedAt||null;
      const timestamp=startedAt||completedAt;
      const durationMs=operationDurationMs(startedAt,completedAt);
      const completed=operationTimestamp(completedAt)!=null;
      const failed=completed&&operation.success===false;
      const status=completed?(failed?"失败":"已完成"):"运行中";

      const progressSequence=operation.progressSequence;
      const anchorSequence=progressSequence!==null&&progressSequence!==undefined&&progressSequence!==""&&Number.isFinite(Number(progressSequence))
        ?Number(progressSequence):index;

        const content=String(operation.output||"");

        const data={model,provider:operation.provider||"",finishReason:operation.finishReason||"",usage:operation.usage||{}};
        records.push({
          key:operationRecordKey("model",[sessionId||"session-unavailable",operationId||index].join(":"),timestamp,index),
          type:"model",timestamp,startedAt,completedAt,title:model||(round==null?"Model response":`Model round ${round}`),
          preview:boundedOperationEvidenceValue(content||reasoning||"(tool call only)",OPERATION_EVIDENCE_SUMMARY_MAX_CHARS).text.replace(/\s+/g," "),content,reasoning,event,data,model,
          provider:String(operation.provider||""),sessionId,operationId,round,
          inputSummary:String(operation.inputSummary||""),availableToolNames:tools,usage:operation.usage||{},
          finishReason:String(operation.finishReason||""),error:String(operation.error||""),
          status,statusTone,durationMs,durationSource:durationMs==null?"仅在模型 start 与 completed 时间都已提交后显示 Duration。":"",
          sourceIndex:index,anchorSequence,typed:true,toolCallOnly,evidenceBounds:operation.uiEvidenceBounds||null

        return;
      }

      const tool={

        argumentsJson:String(operation.argumentsJson||""),resultJson:String(operation.resultJson||""),
        success:operation.success,error:String(operation.error||"")
      };
      records.push({
        key:operationRecordKey("tool",[sessionId||"session-unavailable",operationId||tool.callId||index].join(":"),timestamp,index),
        type:"tool",timestamp,startedAt,completedAt,title:tool.toolName,
        preview:boundedOperationEvidenceValue(tool.error||tool.resultJson||tool.argumentsJson||"等待工具结果",OPERATION_EVIDENCE_SUMMARY_MAX_CHARS).text.replace(/\s+/g," "),tool,
        sessionId,operationId,status,statusTone,durationMs,
        durationSource:durationMs==null?"仅在工具 start 与 completed 时间都已提交后显示 Duration。":"",
        sourceIndex:index,anchorSequence,typed:true
      });
    });
  } else {
    timeline.forEach((event,index)=>{
      if(!event) return;
      const timestamp=event.timestampUtc||null;
      if(REPLY_KINDS.has(event.kind)||event.stage==="role.reply"){
        const data=event.data&&typeof event.data==="object"?event.data:{};
        const sessionId=dataLookup(data,["session_id","sessionId"]);
        const role=event.message||event.agentId||event.stepId||"assistant";
        const rawContent=String(event.content==null?"":event.content);
        const boundedContent=boundedOperationEvidenceValue(rawContent,OPERATION_EVIDENCE_DETAIL_MAX_CHARS);
        const content=boundedContent.text;
        const evidenceBounds=boundedContent.truncated?{
          maxChars:OPERATION_EVIDENCE_DETAIL_MAX_CHARS,
          truncatedFields:["content"],
          sourceLengths:{content:boundedContent.sourceLength}
        }:null;
        records.push({
          key:operationRecordKey("model",[runId,sessionId||"session-unavailable",timestamp||"time-unavailable",index].join(":"),timestamp,index),type:"model",timestamp,
          title:role,preview:boundedOperationEvidenceValue(rawContent||"(tool call only)",OPERATION_EVIDENCE_SUMMARY_MAX_CHARS).text.replace(/\s+/g," "),
          content,reasoning:"",event:{...event,content},data,evidenceBounds,
          model:dataLookup(data,DATA_MODEL_KEYS),sessionId,status:"已提交",statusTone:"ok",durationMs:null,
          durationSource:"历史轨迹只保留 committed 时间点，无法还原真实模型 Duration。",
          sourceIndex:index,anchorSequence:index,typed:false,toolCallOnly:rawContent.trim()===""
        });
        return;
      }
      if(event.kind==="ToolCall"||event.stage==="tool.call"){
        const tool=boundedOperationEvidenceSnapshot(event.toolCall||{},OPERATION_EVIDENCE_DETAIL_MAX_CHARS);
        const callId=String(tool.callId||dataLookup(event.data||{},["call_id","callId"]));
        const name=String(tool.toolName||event.message||"unknown tool");
        const error=String(tool.error||"");

          key:operationRecordKey("tool",runId+":"+(callId||[name,timestamp,index].join(":")),timestamp,index),type:"tool",timestamp,title:name,
          preview:boundedOperationEvidenceValue(error||(tool.resultJson||tool.argumentsJson)||"未返回工具详情",OPERATION_EVIDENCE_SUMMARY_MAX_CHARS).text.replace(/\s+/g," "),tool,event,
          status:success?"成功":tool.success===false||error?"失败":"结果未确认",statusTone:success?"ok":tool.success===false||error?"bad":"",
          durationMs:null,durationSource:"历史轨迹只保留 committed 时间点，无法还原真实工具 Duration。",
          sourceIndex:index,anchorSequence:index,typed:false
        });
      }
    });
  }

  const typeOrder={input:0,model:1,tool:2};
  records.sort((left,right)=>{
    if(left.anchorSequence!==right.anchorSequence) return left.anchorSequence-right.anchorSequence;
    const lt=operationTimestamp(left.timestamp),rt=operationTimestamp(right.timestamp);
    if(lt==null&&rt!=null) return 1;
    if(lt!=null&&rt==null) return -1;
    if(lt!=null&&rt!=null&&lt!==rt) return lt-rt;
    if(left.sourceIndex!==right.sourceIndex) return left.sourceIndex-right.sourceIndex;
    return (typeOrder[left.type]||0)-(typeOrder[right.type]||0);
  });
  return records;
}

    const summary=el("button",{class:"operation-summary",type:"button","aria-expanded":String(open),"aria-controls":detailId,"aria-label":`${OPERATION_TYPE[record.type].label} ${record.title}，${record.status}，Duration ${record.durationMs==null?"不可用":operationDurationLabel(record.durationMs)}`});
    summary.innerHTML=`<span class="op-index">${String(index+1).padStart(2,"0")}</span><span class="op-type ${record.type}">${operationTypeIcon(record.type)}<span>${OPERATION_TYPE[record.type].label}</span></span><span class="op-main"><span class="op-name">${esc(record.title)}</span><span class="op-preview">${esc(record.preview||"—")}</span></span><span class="op-time">${record.timestamp?clockUTC(record.timestamp):"时间不可用"}</span><span class="op-duration ${record.durationMs==null?"unavailable":""}">${record.durationMs==null?"Duration 不可用":operationDurationLabel(record.durationMs)}</span><span class="op-state ${record.statusTone||""}">${esc(record.status)}</span><span class="op-chevron" aria-hidden="true">${ICON.chevron}</span>`;
    summary.addEventListener("click",()=>{
      const next=!state.expandedOperations.has(record.key);

    });
    row.appendChild(summary);row.appendChild(renderOperationDetail(record));ledger.appendChild(row);
  });
  return ledger;
}

/* ---- Timeline ---- */
function renderTimeline(detail){
  const wrap = el("div", {});
  wrap.appendChild(el("p", { class:"tl-rail-note" }, "按时间自上而下 · 时间戳为 UTC"));
  const tl = el("ol", { class:"timeline", "aria-label":"事件时间线", style:"list-style:none;margin:0;padding:0" });
  const isRunning = detail.summary.status === "running";
  const lastIdx = detail.timeline.length - 1;

  detail.timeline.forEach((ev, i) => {
    const isLast = i === lastIdx;
    const li = el("li", { class:`ev k-${ev.kind}${(isRunning && isLast)?" is-new":""}` });

    // gutter timestamp
    const gutter = el("div", { class:"gutter" }, `<span class="ts">${clockUTC(ev.timestampUtc)}</span>`);

    // rail + body
    const rail = el("div", { class:"node-rail" });
    rail.appendChild(el("span", { class:"marker", "aria-hidden":"true" }));
    const body = el("div", { class:"ev-body" });

    const headRow = el("div", { class:"ev-head" });
    headRow.innerHTML = `<span class="kind">${kindIcon(ev.kind)}<span>${KIND[ev.kind]?.label||ev.kind}</span></span>`;
    if(ev.stepId){
      const stType = ev.stepType ? ` <span class="st">${STEPTYPE_LABEL[ev.stepType]||ev.stepType}</span>` : "";
      headRow.insertAdjacentHTML("beforeend", `<span class="stepbadge">${esc(ev.stepId)}${stType}</span>`);
    }
    if(ev.agentId) headRow.insertAdjacentHTML("beforeend", `<span class="agentbadge">@${esc(ev.agentId)}</span>`);
    body.appendChild(headRow);

    // content by kind
    if(REPLY_KINDS.has(ev.kind)){
      // the real assistant/role response text (ev.content), beautified — NOT just the role id
      body.appendChild(renderReplyBubble(ev));
    } else if(ev.kind === "ToolCall"){
      body.appendChild(renderToolCall(ev.toolCall));
    } else if(ev.kind === "HumanInputRequest"){
      const na = el("div", { class:"needs-attn", role:"note" });
      na.innerHTML = `${ICON.human}<div><div class="na-l">需要关注 · 等待人工确认</div><div class="na-m">${esc(ev.message)}</div><div class="na-ro">${ICON.lock.replace('width="24" height="24"','width="11" height="11"')} 只读视图 —— 请到审批系统中处理</div></div>`;
      body.appendChild(na);
    } else if(ev.kind === "StepFinished" && ev.message){
      const parts = String(ev.message).split("·").map(x=>x.trim());
      body.appendChild(el("div", { class:"ev-cost" }, `<span class="costchip">${parts.map(p=>`<b>${esc(p)}</b>`).join(' <span style="color:var(--border)">·</span> ')}</span>`));
    } else if(ev.message){
      const cls = (ev.kind==="RunError") ? "ev-msg" : "ev-msg";
      const node = el("div", { class:cls }, esc(ev.message));
      if(ev.kind==="RunError") node.style.color = "var(--err)", node.style.fontWeight = "600";
      body.appendChild(node);
    }

    // model + token-usage chips (and a collapsible 详情 for the rest) wherever the committed data bag
    // carries them — typically llm_call StepFinished / Message events. Skipped for tool-call rows whose
    // detail already lives in the tool-call panel.
    if(ev.kind !== "ToolCall"){
      const dataError=dataLookup(ev.data||{},["error"]);
      if(dataError) body.appendChild(el("pre",{class:"failure-evidence-text scroll",tabindex:"0","aria-label":"Timeline data.error"},esc(dataError)));
      const details = renderDataDetails(ev.data);
      if(details) body.appendChild(details);
    }

    rail.appendChild(body);
    li.appendChild(gutter);
    li.appendChild(rail);
    tl.appendChild(li);
  });

  wrap.appendChild(tl);

  if(isRunning){
    const tail = el("div", { class:"tl-tail", role:"status", "aria-live":"polite" });
    tail.innerHTML = `<span class="dot" aria-hidden="true"></span><span>运行进行中 —— 新事件将自动追加在此</span>`;
    wrap.appendChild(tail);
  }
  return wrap;
}

function jsonField(label, raw){
  const f = el("div", { class:"tc-field" });

  head.innerHTML = `<span class="tc-field-label">${esc(label)}</span>`;
  const copy = el("button", { class:"copybtn", "aria-label":"复制 "+label }, `${ICON.copy}<span>复制</span>`);
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(raw||""); } catch(e){
      const ta=document.createElement("textarea"); ta.value=raw||""; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){ } ta.remove();
    }

  return f;
