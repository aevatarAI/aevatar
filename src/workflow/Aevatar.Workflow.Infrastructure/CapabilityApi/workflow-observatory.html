    pane.appendChild(el("div", { class:"detail-empty" }, `
      <div class="ic" aria-hidden="true">${ICON.cursor}</div>
      <div class="dt">选择一个运行以查看执行过程</div>
      <div class="ds">从左侧列表选择任意运行，自上而下阅读它的执行故事 —— 每一步做了什么、模型说了什么、调用了哪些工具。</div>`));
    return pane;
  }

  const inner = el("div", { class:"detail-inner" });
  inner.appendChild(renderRunHeader(detail));
  inner.appendChild(renderApprovalPanel(detail));
  inner.appendChild(renderDiagnosticStrip(detail));
  inner.appendChild(renderNarrative(detail));
  if(adminState.isAdmin) inner.appendChild(renderCrossLinks(detail));
  inner.appendChild(renderTabs());

  const tp = el("div", {});
  const timelinePanel = el("div", { class:"tabpanel", id:"panel-timeline", role:"tabpanel", "aria-labelledby":"tab-timeline", tabindex:"0" });
  timelinePanel.appendChild(renderTimeline(detail));
  if(state.activeTab !== "timeline") timelinePanel.hidden = true;

  const stepsPanel = el("div", { class:"tabpanel", id:"panel-steps", role:"tabpanel", "aria-labelledby":"tab-steps", tabindex:"0" });
  stepsPanel.appendChild(renderSteps(detail));
  if(state.activeTab !== "steps") stepsPanel.hidden = true;

  const diagnosticsPanel = el("div", { class:"tabpanel", id:"panel-diagnostics", role:"tabpanel", "aria-labelledby":"tab-diagnostics", tabindex:"0" });
  diagnosticsPanel.appendChild(renderDiagnostics(detail));
  if(state.activeTab !== "diagnostics") diagnosticsPanel.hidden = true;

  const logsPanel = el("div", { class:"tabpanel", id:"panel-logs", role:"tabpanel", "aria-labelledby":"tab-logs", tabindex:"0" });
  logsPanel.appendChild(renderLogs(detail));
  if(state.activeTab !== "logs") logsPanel.hidden = true;

  const artifactsPanel = el("div", { class:"tabpanel", id:"panel-artifacts", role:"tabpanel", "aria-labelledby":"tab-artifacts", tabindex:"0" });
  artifactsPanel.appendChild(renderArtifacts(detail));
  if(state.activeTab !== "artifacts") artifactsPanel.hidden = true;

  const graphPanel = el("div", { class:"tabpanel", id:"panel-graph", role:"tabpanel", "aria-labelledby":"tab-graph", tabindex:"0" });
  graphPanel.appendChild(renderGraph(detail));
  if(state.activeTab !== "graph") graphPanel.hidden = true;

  tp.appendChild(timelinePanel);
  tp.appendChild(stepsPanel);
  tp.appendChild(diagnosticsPanel);
  tp.appendChild(logsPanel);
  tp.appendChild(artifactsPanel);
  tp.appendChild(graphPanel);
  inner.appendChild(tp);

  pane.appendChild(inner);
  return pane;
}

/* Run ids are composite (e.g. [scope:]workflow.definition:{defHash}:run:{runHash}). Break them into
   labelled, color-coded chips so the id reads clearly instead of as one wall of hex; fall back to a
   single truncated chip when the shape is unfamiliar. */
function parseRunId(runId){
  const id = String(runId || "");
  const out = { full: id, scope: "", def: "", run: "" };
  const runM = /:run:([^:]+)\s*$/i.exec(id);
  if(runM) out.run = runM[1];
  const defM = /workflow\.definition:([^:]+)/i.exec(id);
  if(defM) out.def = defM[1];
  const dIdx = id.indexOf("workflow.definition:");
  if(dIdx > 0) out.scope = id.slice(0, dIdx).replace(/:+$/, "");
  return out;
}
function renderRunIdChips(rid){
  const chips = [];
  if(rid.scope){
    // scope segment of the run id is the scopeId (≈ nyxid user id). Admins see the owner's display
    // name in the chip (short id kept as secondary, full id in the tooltip); otherwise the raw id.
    const scopeName = scopeDisplayName(rid.scope);
    chips.push(scopeName
      ? `<span class="rid-chip scope" title="${esc(scopeName)} · scope: ${esc(rid.scope)}"><span class="rid-lab">scope</span><span class="rid-val">${esc(scopeName)} <span class="muted-id">${esc(tailId(rid.scope, 6))}</span></span></span>`
      : `<span class="rid-chip scope" title="scope: ${esc(rid.scope)}"><span class="rid-lab">scope</span><span class="rid-val">${esc(midTrunc(rid.scope, 14))}</span></span>`);
  }
  if(rid.def)   chips.push(`<span class="rid-chip def" title="workflow.definition: ${esc(rid.def)}"><span class="rid-lab">定义</span><span class="rid-val">${esc(midTrunc(rid.def, 16))}</span></span>`);
  if(rid.run)   chips.push(`<span class="rid-chip run" title="run: ${esc(rid.run)}"><span class="rid-lab">运行</span><span class="rid-val">${esc(midTrunc(rid.run, 16))}</span></span>`);
  if(chips.length === 0) chips.push(`<span class="rid-chip plain" title="${esc(rid.full)}"><span class="rid-val">${esc(midTrunc(rid.full, 30))}</span></span>`);
  chips.push(`<button class="rid-copy" type="button" aria-label="复制完整运行 ID" title="复制完整运行 ID">${ICON.copy}</button>`);
  return chips.join("");
}

function renderRunHeader(detail){
  const s = detail.summary;
  const started = parseT(s.startedAtUtc);
  const hasStart = !isNaN(started);
  const isRunning = s.status === "running";
  const endMs = isRunning ? nowMs() : parseT(s.updatedAtUtc);
  // startedAtUtc can be null (old runs / terminal-adopted failures that never recorded a start) — degrade
  // to — instead of "NaN秒" / "null UTC".
  const durStr = (hasStart && !isNaN(endMs)) ? fmtDur(endMs - started) : "—";
  const startStr = hasStart ? (clockUTC(s.startedAtUtc) + " UTC") : "—";
  const u = detail.usageTotals;

  const head = el("header", { class:"run-header" });
  head.innerHTML = `
    <div class="rh-top">
      <h1 class="rh-title"><span class="dot s-${s.status}" aria-hidden="true"></span>${esc(s.workflowName)}</h1>
      <span class="badge b-${s.status}"><span class="dot s-${s.status}" aria-hidden="true"></span>${STATUS_LABEL[s.status]||s.status}</span>
    </div>
    <div class="rh-meta">
      <span class="grp rid-grp"><span class="k">运行 ID</span><span class="rid">${renderRunIdChips(parseRunId(s.runId))}</span></span>
      <span class="grp"><span class="k">用时</span><span class="v" ${(hasStart&&isRunning)?`data-duration="${s.startedAtUtc}"`:""}>${durStr}</span></span>
      <span class="grp"><span class="k">开始</span><span class="v">${startStr}</span></span>
    </div>`;

  const copyBtn = head.querySelector(".rid-copy");
  if(copyBtn) copyBtn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(s.runId || ""); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=s.runId||""; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){ } ta.remove(); }
    copyBtn.classList.add("done"); setTimeout(() => copyBtn.classList.remove("done"), 1300);
  });

  // usage strip (compact summary cards)
  const strip = el("div", { class:"usage-strip", "aria-label":"用量汇总" });
  strip.innerHTML = `
    <div class="usage-cell"><div class="ul">输入 Token</div><div class="uv">${fmtNum(u.promptTokens)}</div></div>
    <div class="usage-cell"><div class="ul">输出 Token</div><div class="uv">${fmtNum(u.completionTokens)}</div></div>
    <div class="usage-cell"><div class="ul">合计 Token</div><div class="uv">${fmtNum(u.totalTokens)}</div></div>
    <div class="usage-cell accent"><div class="ul">花费</div><div class="uv">${fmtCost(u.cost)}</div></div>
    <div class="usage-cell"><div class="ul">状态版本</div><div class="uv">v${s.stateVersion}</div></div>`;
  head.appendChild(strip);
  return head;
}

function issuePayload(detail){
  const steps = detail.steps || [];
  const diagnostics = detail.diagnostics || [];
  return JSON.stringify({
    runId: detail.summary.runId,
    scopeId: detail.summary.scopeId,
    workflow: detail.summary.workflowName,
    status: detail.summary.status,
    stateVersion: detail.summary.stateVersion,
    finalError: detail.finalError || "",
    diagnostics: diagnostics.map(t => ({
      severity: t.severity,
      code: t.code,
      source: t.source,
      stepId: t.stepId,
      stepType: t.stepType,
      targetRole: t.targetRole,
      message: t.message,
      hint: t.hint,
      timestampUtc: t.timestampUtc
    })),
    failedSteps: steps.filter(s => s.success === false || s.error).map(s => ({
      stepId: s.stepId,
      stepType: s.stepType,
      targetRole: s.targetRole,
      error: s.error,
      requestedAtUtc: s.requestedAtUtc,
      completedAtUtc: s.completedAtUtc,
      nextStepId: s.nextStepId,
      branchKey: s.branchKey
    })),
    lastKnownStep: steps.slice().reverse().find(s => s.stepId || s.stepType || s.targetRole) || null
  }, null, 2);
}

function renderDiagnosticStrip(detail){
  const diagnostics = detail.diagnostics || [];
  if(!diagnostics.length && !["failed","timed_out","stopped"].includes(detail.summary.status)) return document.createDocumentFragment();
  const hasProblem = diagnostics.some(t => t.severity === "error" || t.severity === "warning") || ["failed","timed_out","stopped"].includes(detail.summary.status);
  const box = el("section", { class:"diagnostic-strip"+(hasProblem?" has-error":""), "aria-label":"失败诊断" });
  const head = el("div", { class:"diag-head" });
  head.innerHTML = `<span class="diag-title">${hasProblem ? "失败诊断" : "当前位置"}</span><span class="diag-sub">${diagnostics.length ? `${diagnostics.length} 条诊断信息` : "暂未收集到更多诊断信息"}</span>`;
  box.appendChild(head);
  if(diagnostics.length){
    const body = el("div", { class:"diag-body" });
    diagnostics.slice(0, 3).forEach(t => body.appendChild(renderDiagnosticItem(t)));
    if(diagnostics.length > 3) body.appendChild(el("div", { class:"diag-hint" }, `另有 ${diagnostics.length - 3} 条，打开“诊断”页签查看完整 payload。`));
    box.appendChild(body);
  } else {
    box.appendChild(el("div", { class:"diag-body" }, `<div class="diag-hint">运行已进入 ${esc(STATUS_LABEL[detail.summary.status] || detail.summary.status)}，但 final error 或失败 step 尚未物化。提交 issue 时请附上 run id 与 state version。</div>`));
  }
  return box;
}

function renderDiagnosticItem(t){
  const item = el("div", { class:"diag-item "+(t.severity||"info") });
  item.innerHTML = `
    <div class="diag-meta">
      <span class="diag-code">${esc((t.severity||"info").toUpperCase())} · ${esc(t.code||"diagnostic")}</span>
      <span>${esc(clockUTC(t.timestampUtc))}</span>
      <span>${esc(t.source||"observatory")}</span>
      ${t.stepId ? `<span>step ${esc(t.stepId)}</span>` : ""}
      ${t.stepType ? `<span>${esc(t.stepType)}</span>` : ""}
      ${t.targetRole ? `<span>@${esc(t.targetRole)}</span>` : ""}
    </div>
    <div class="diag-msg">${esc(t.message||"—")}</div>
    ${t.hint ? `<div class="diag-hint">${esc(t.hint)}</div>` : ""}`;
  return item;
}

function renderDiagnostics(detail){
  const wrap = el("div", {});
  const diagnostics = detail.diagnostics || [];
  const actions = el("div", { class:"diag-actions" });
  const copy = el("button", { class:"copybtn", type:"button", "aria-label":"复制 issue payload" }, `${ICON.copy}<span>复制 issue payload</span>`);
  copy.addEventListener("click", async () => {
    await copyText(issuePayload(detail));
    copy.classList.add("done"); copy.querySelector("span").textContent = "已复制";
    setTimeout(() => { copy.classList.remove("done"); copy.querySelector("span").textContent = "复制 issue payload"; }, 1400);
  });
  actions.appendChild(copy);
  wrap.appendChild(actions);
  if(diagnostics.length){
    const body = el("div", { class:"diag-body" });
    diagnostics.forEach(t => body.appendChild(renderDiagnosticItem(t)));
    wrap.appendChild(body);
  } else {
    wrap.appendChild(el("div", { class:"diag-body" }, `<div class="diag-hint">本次运行暂无诊断信息。若运行状态异常，请复制下面 payload 一并提交。</div>`));
  }
  wrap.appendChild(el("pre", { class:"issue-pre scroll" }, esc(issuePayload(detail))));
  return wrap;
}
function renderNarrative(detail){
  const wrap=el("div",{class:"narrative"});
  const input=el("details",{},`<summary>输入 · input</summary><pre class="issue-pre scroll">${esc(detail.input||"无输入")}</pre>`); input.open=true; wrap.appendChild(input);
  const output=detail.finalOutput||(detail.summary.status==="running"?"运行尚未完成，最终输出尚未物化":"无最终输出");
  const final=el("details",{},`<summary>最终输出 · finalOutput</summary><pre class="issue-pre scroll">${esc(output)}</pre>`); final.open=true; wrap.appendChild(final);
  if(detail.finalError) wrap.appendChild(el("pre",{class:"issue-pre scroll"},esc(detail.finalError)));
  return wrap;
}
function renderCrossLinks(detail){
  const links=el("div",{class:"cross-links"});
  const cqrs=el("button",{class:"chip",type:"button"},"投影健康 · scope"); cqrs.addEventListener("click",()=>navigateAdminShell("cqrs",{owner:detail.summary.scopeId})); links.appendChild(cqrs);
  const audit=el("button",{class:"chip",type:"button"},"审计 · run"); audit.addEventListener("click",()=>navigateAdminShell("audit",{run:detail.summary.runId})); links.appendChild(audit);
  return links;
}
function renderSteps(detail){
  const wrap=el("div",{class:"step-list"}), events=detail.timeline||[];
  if(!(detail.steps||[]).length) return el("div",{class:"detail-empty"},'<div class="dt">暂无步骤</div>');
  detail.steps.forEach((step,index)=>{
    const related=events.filter(event=>event.stepId===step.stepId);
    const card=el("article",{class:"step-card"});
    card.innerHTML=`<b>${esc(step.stepId||"step "+(index+1))}</b><span class="mono">${esc(step.stepType||"unknown")}${step.targetRole?" · @"+esc(step.targetRole):""}</span>
      <div>${esc(step.requestedAtUtc||"—")} → ${esc(step.completedAtUtc||"进行中")}</div>
      ${step.error?`<div class="diag-msg">${esc(step.error)}</div>`:""}${step.outputPreview?`<div>${esc(step.outputPreview)}</div><small>outputPreview 为 240 字预览；完整 role/tool 输出见 Timeline</small>`:""}
      <small>关联 timeline 事件 ${related.length}</small>`;
    wrap.appendChild(card);
  });
  return wrap;
}
function renderLogs(detail){
  const lines=[];
  (detail.diagnostics||[]).forEach(d=>lines.push(`${d.timestampUtc||"—"} DIAGNOSTIC ${(d.severity||"info").toUpperCase()} [${d.code||"diagnostic"}] ${d.message||""}`));
  (detail.timeline||[]).forEach(event=>{const message=event.content||event.message||(event.toolCall&&(event.toolCall.error||event.toolCall.toolName));if(message)lines.push(`${event.timestampUtc||"—"} ${event.stage?"["+event.stage+"] ":""}${message}`);});
  if(detail.finalError) lines.push("FINAL ERROR "+detail.finalError);
  const wrap=el("div",{}); wrap.appendChild(el("p",{class:"diag-hint"},"派生视图：由 diagnostics + committed timeline 组装；不是独立日志事实源。"));
  wrap.appendChild(el("pre",{class:"issue-pre scroll"},esc(lines.join("\n")||"暂无可派生日志"))); return wrap;
}
function renderArtifacts(detail){
  const wrap=el("div",{});
  if(!detail.finalOutput){ wrap.appendChild(el("div",{class:"detail-empty"},'<div class="dt">暂无产出</div><div class="ds">当前详情契约没有正式 artifact 集合。</div>')); return wrap; }
  wrap.appendChild(el("p",{class:"diag-hint"},"派生下载：内容来自 finalOutput；不是正式 artifact read model。"));
  const button=el("button",{class:"chip",type:"button"},"下载 finalOutput"); button.addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([detail.finalOutput],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="finalOutput.txt";a.click();URL.revokeObjectURL(url);}); wrap.appendChild(button); return wrap;
}

function findActiveApproval(detail){
  return ((detail && detail.steps) || []).filter(step =>
    !step.completedAtUtc && String(step.suspensionType || "").toLowerCase() === "human_approval").slice(-1)[0] || null;
}
function canApproveRun(detail, ownerScope){
  return !!(detail && detail.summary && ownerScope && detail.summary.scopeId === ownerScope);
}
function buildApprovalRequest(detail, approval, approved, feedback){
  const body = { stepId:approval.stepId, approved:!!approved };
  if(!approved) body.userInput = String(feedback || "").trim();
  return {
    path:"/api/scopes/" + encodeURIComponent(detail.summary.scopeId) + "/runs/" + encodeURIComponent(detail.summary.runId) + ":resume",
    body
  };
}
const approvalState = { key:"", rejecting:false, feedback:"", submitting:false, accepted:false, error:"" };
function renderApprovalPanel(detail){
  const approval = findActiveApproval(detail);
  if(!approval) return document.createDocumentFragment();
  const key = [detail.summary.runId, approval.stepId, approval.requestedAtUtc || "", detail.summary.stateVersion].join("\n");
  if(approvalState.key !== key) Object.assign(approvalState, { key, rejecting:false, feedback:"", submitting:false, accepted:false, error:"" });
  const owner = canApproveRun(detail, adminState.ownScope);
  const box = el("section", { class:"approval-panel", "aria-label":"需要审批" });
  box.innerHTML = `<div class="approval-head"><b>需要审批</b>${approval.suspensionTimeoutSeconds!=null?`<span>审批时限 ${esc(approval.suspensionTimeoutSeconds)} 秒</span>`:""}</div>
    ${approval.suspensionPrompt?`<p>${esc(approval.suspensionPrompt)}</p>`:""}
    <pre class="approval-content scroll" tabindex="0">${esc(approval.suspensionContent || "（无待审内容）")}</pre>`;
  const actions = el("div", { class:"approval-actions" });
  if(!owner) actions.appendChild(el("span", {}, "该 Run 属于其他 scope；管理员观测为只读"));
  else if(approvalState.accepted) actions.appendChild(el("span", {}, "决定已接受（202），等待 committed 状态更新"));
  else {
    const submit = async approved => {
      const feedback = approvalState.feedback.trim();
      if(!approved && !feedback){ approvalState.error="请填写驳回反馈"; render(); return; }
      if(approvalState.submitting) return;
      approvalState.submitting=true; approvalState.error=""; render();
      const request=buildApprovalRequest(detail,approval,approved,feedback);
      try { await apiRequest(request.path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(request.body)}); approvalState.accepted=true; approvalState.rejecting=false; }
      catch(e){ approvalState.error=e.message||"审批提交失败"; }
      finally { approvalState.submitting=false; render(); }
    };
    const approve=el("button",{class:"btn-primary",type:"button",disabled:approvalState.submitting?"disabled":null},"批准并继续");
    approve.addEventListener("click",()=>submit(true)); actions.appendChild(approve);
    const reject=el("button",{class:"chip",type:"button",disabled:approvalState.submitting?"disabled":null},"驳回");
    reject.addEventListener("click",()=>{approvalState.rejecting=true;render();}); actions.appendChild(reject);
    if(approvalState.rejecting){
      const feedback=el("textarea",{class:"approval-feedback",rows:"3",placeholder:"驳回反馈（必填）"},esc(approvalState.feedback));
      feedback.addEventListener("input",e=>{approvalState.feedback=e.target.value;}); box.appendChild(feedback);
      const rejectSubmit=el("button",{class:"btn-primary",type:"button"},"提交驳回"); rejectSubmit.addEventListener("click",()=>submit(false)); actions.appendChild(rejectSubmit);
    }
    if(approvalState.error) box.appendChild(el("div",{class:"approval-error",role:"alert"},esc(approvalState.error)));
  }
  box.appendChild(actions); return box;
}

function detailTabIds(){ return ["timeline","steps","diagnostics","logs","artifacts","graph"]; }
function renderTabs(){
  const tablist = el("div", { class:"tabs", role:"tablist", "aria-label":"详情视图" });
  const labels={timeline:["时间线",ICON.step],steps:["Steps",ICON.list],diagnostics:["诊断",ICON.alert],logs:["Logs",ICON.inbox],artifacts:["产出",ICON.flag],graph:["拓扑图",'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="6" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7 6.6 17 11M7 17.4 17 13"/></svg>']};
  detailTabIds().forEach(id => {
    const [lab,ic]=labels[id];
    const t = el("button", { class:"tab", id:"tab-"+id, role:"tab", "aria-selected": String(state.activeTab===id), "aria-controls":"panel-"+id, tabindex: state.activeTab===id?"0":"-1" }, `${ic}<span>${lab}</span>`);
    t.addEventListener("click", () => { state.activeTab = id; writeObservatoryRoute({tab:id}); if(id === "graph") loadGraph(state.selectedRunId); render(); });
    t.addEventListener("keydown", (e) => {
      if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
        e.preventDefault();
        const order=detailTabIds();
        const delta=e.key==="ArrowRight"?1:-1;
        state.activeTab = order[(order.indexOf(state.activeTab)+delta+order.length)%order.length];
        writeObservatoryRoute({tab:state.activeTab});
        if(state.activeTab === "graph") loadGraph(state.selectedRunId);
        render(); $("#tab-"+state.activeTab)?.focus();
      }
    });
    tablist.appendChild(t);
  });
  return tablist;
}

/* role.reply / Message events now carry the real LLM response in ev.content (was: only the role id).
   Render it as a beautified assistant bubble — role avatar + label, line breaks preserved, long replies
   clamped behind a 展开/收起 toggle. Empty content degrades to a small note (no empty bubble). */
function renderReplyBubble(ev){
  const role = ev.agentId || ev.stepId || "assistant";
  const reply = el("div", { class:"reply", role:"group", "aria-label":`模型回复 ${role}` });
  const head = el("div", { class:"reply-head" });
  head.innerHTML = `
    <span class="reply-avatar" aria-hidden="true">${esc(initials(role))}</span>
    <span class="reply-role" title="${esc(role)}">${esc(role)}</span>
    <span class="reply-tag">回复</span>
    <span class="reply-spacer"></span>`;
  reply.appendChild(head);

  const content = String(ev.content == null ? "" : ev.content);
  if(content.trim() === ""){
    reply.appendChild(el("div", { class:"reply-empty" }, "（无文本内容 —— 该回合可能仅触发工具调用）"));
    return reply;
  }
  // clamp long responses; offer expand/collapse. Threshold by length OR line count.
  const isLong = content.length > 360 || (content.match(/\n/g) || []).length > 8;
  const bodyEl = el("div", { class:"reply-body"+(isLong?" clamp":"") }, esc(content));
  reply.appendChild(bodyEl);
  if(isLong){
    const more = el("button", { class:"reply-more", type:"button", "aria-expanded":"false" }, `${ICON.chevron}<span>展开</span>`);
    more.addEventListener("click", () => {
      const clamped = bodyEl.classList.toggle("clamp");
      more.setAttribute("aria-expanded", String(!clamped));
      more.querySelector("span").textContent = clamped ? "展开" : "收起";
    });
    reply.appendChild(more);
  }
  return reply;
}

/* Surface the high-value AGUI data (model + token usage) as compact chips; tuck the rest under a
   collapsible 详情. Returns null when there's nothing worth showing so callers can skip it cleanly. */
function renderDataDetails(data){
  if(!data || typeof data !== "object") return null;
  const model = dataLookup(data, DATA_MODEL_KEYS);
  const tokens = DATA_TOKEN_KEYS.map(([id, keys]) => [id, dataLookup(data, keys)]).filter(([,v]) => v !== "");
  const extraKeys = Object.keys(data).filter(k => !DATA_CHIP_KEYS.has(k.toLowerCase()) && String(data[k]).trim() !== "");
  if(!model && tokens.length === 0 && extraKeys.length === 0) return null;

  const wrap = el("div", {});
  if(model || tokens.length){
    const chips = el("div", { class:"datachips" });
    if(model) chips.appendChild(el("span", { class:"dchip model", title:"模型" }, `<span class="dk">模型</span><span class="dv">${esc(model)}</span>`));
    tokens.forEach(([id, v]) => {
      const n = Number(v); const disp = isNaN(n) ? esc(v) : fmtNum(n);
      chips.appendChild(el("span", { class:"dchip tok-"+id, title:(TOKEN_CHIP_LABEL[id]||id)+" tokens" },
        `<span class="dk">${TOKEN_CHIP_LABEL[id]||id}</span><span class="dv">${disp}</span>`));
    });
    wrap.appendChild(chips);
  }
  if(extraKeys.length){
    const det = el("details", { class:"datamore" });
    det.appendChild(el("summary", {}, `<span class="dm-chevron" aria-hidden="true">${ICON.chevron}</span><span>详情 · ${extraKeys.length}</span>`));
    const table = el("div", { class:"datatable scroll" });
    extraKeys.sort().forEach(k => {
      table.appendChild(el("span", { class:"dt-k" }, esc(k)));
      table.appendChild(el("span", { class:"dt-v" }, esc(String(data[k]))));
    });
    det.appendChild(table);
    wrap.appendChild(det);
  }
  return wrap;
}

/* ---- Timeline ---- */
function renderTimeline(detail){
  const wrap = el("div", {});
  wrap.appendChild(el("p", { class:"tl-rail-note" }, "按时间自上而下 · 时间戳为 UTC"));
  const tl = el("ol", { class:"timeline", "aria-label":"事件时间线", style:"list-style:none;margin:0;padding:0" });
  const isRunning = detail.summary.status === "running";
  const lastIdx = detail.timeline.length - 1;

  detail.timeline.forEach((ev, i) => {
    const isLast = i === lastIdx;
    const li = el("li", { class:`ev k-${ev.kind}${(isRunning && isLast)?" is-new":""}` });

    // gutter timestamp
    const gutter = el("div", { class:"gutter" }, `<span class="ts">${clockUTC(ev.timestampUtc)}</span>`);

    // rail + body
    const rail = el("div", { class:"node-rail" });
    rail.appendChild(el("span", { class:"marker", "aria-hidden":"true" }));
    const body = el("div", { class:"ev-body" });

    const headRow = el("div", { class:"ev-head" });
    headRow.innerHTML = `<span class="kind">${kindIcon(ev.kind)}<span>${KIND[ev.kind]?.label||ev.kind}</span></span>`;
    if(ev.stepId){
      const stType = ev.stepType ? ` <span class="st">${STEPTYPE_LABEL[ev.stepType]||ev.stepType}</span>` : "";
      headRow.insertAdjacentHTML("beforeend", `<span class="stepbadge">${esc(ev.stepId)}${stType}</span>`);
    }
    if(ev.agentId) headRow.insertAdjacentHTML("beforeend", `<span class="agentbadge">@${esc(ev.agentId)}</span>`);
    body.appendChild(headRow);

    // content by kind
    if(REPLY_KINDS.has(ev.kind)){
      // the real assistant/role response text (ev.content), beautified — NOT just the role id
      body.appendChild(renderReplyBubble(ev));
    } else if(ev.kind === "ToolCall"){
      body.appendChild(renderToolCall(ev.toolCall));
    } else if(ev.kind === "HumanInputRequest"){
      const na = el("div", { class:"needs-attn", role:"note" });
      na.innerHTML = `${ICON.human}<div><div class="na-l">需要关注 · 等待人工确认</div><div class="na-m">${esc(ev.message)}</div><div class="na-ro">${ICON.lock.replace('width="24" height="24"','width="11" height="11"')} 只读视图 —— 请到审批系统中处理</div></div>`;
      body.appendChild(na);
    } else if(ev.kind === "StepFinished" && ev.message){
      const parts = String(ev.message).split("·").map(x=>x.trim());
      body.appendChild(el("div", { class:"ev-cost" }, `<span class="costchip">${parts.map(p=>`<b>${esc(p)}</b>`).join(' <span style="color:var(--border)">·</span> ')}</span>`));
    } else if(ev.message){
      const cls = (ev.kind==="RunError") ? "ev-msg" : "ev-msg";
      const node = el("div", { class:cls }, esc(ev.message));
      if(ev.kind==="RunError") node.style.color = "var(--err)", node.style.fontWeight = "600";
      body.appendChild(node);
    }

    // model + token-usage chips (and a collapsible 详情 for the rest) wherever the committed data bag
    // carries them — typically llm_call StepFinished / Message events. Skipped for tool-call rows whose
    // detail already lives in the tool-call panel.
    if(ev.kind !== "ToolCall"){
      const details = renderDataDetails(ev.data);
      if(details) body.appendChild(details);
    }

    rail.appendChild(body);
    li.appendChild(gutter);
    li.appendChild(rail);
    tl.appendChild(li);
  });

  wrap.appendChild(tl);

  if(isRunning){
    const tail = el("div", { class:"tl-tail", role:"status", "aria-live":"polite" });
    tail.innerHTML = `<span class="dot" aria-hidden="true"></span><span>运行进行中 —— 新事件将自动追加在此</span>`;
    wrap.appendChild(tail);
  }
  return wrap;
}

function renderToolCall(tc){
  const open = state.expanded.has(tc.callId);
  const box = el("div", { class:"toolcall", "data-open": String(open), "data-callid": tc.callId });
  const headBtn = el("button", { class:"tc-head", "aria-expanded": String(open), "aria-controls":"tcbody-"+tc.callId });
  headBtn.innerHTML = `
    <span class="tc-chevron" aria-hidden="true">${ICON.chevron}</span>
    <span class="tc-name">${esc(tc.toolName)}</span>
    <span class="tc-callid">${esc(tc.callId)}</span>
    <span class="tc-status ${tc.success?"ok":"bad"}">${tc.success?ICON.check:ICON.x}${tc.success?"成功":"失败"}</span>`;
  headBtn.addEventListener("click", () => {
    if(state.expanded.has(tc.callId)) state.expanded.delete(tc.callId); else state.expanded.add(tc.callId);
    const o = state.expanded.has(tc.callId);
    box.setAttribute("data-open", String(o));
    headBtn.setAttribute("aria-expanded", String(o));
  });
  box.appendChild(headBtn);

  const bodyEl = el("div", { class:"tc-body", id:"tcbody-"+tc.callId });
  bodyEl.appendChild(jsonField("参数 · arguments", tc.argumentsJson));
  if(tc.success){
    bodyEl.appendChild(jsonField("结果 · result", tc.resultJson));
  } else {
    const f = el("div", { class:"tc-field" });
    f.innerHTML = `<div class="tc-field-head"><span class="tc-field-label">错误 · error</span></div>`;
    f.appendChild(el("pre", { class:"json scroll" }, `<span class="tc-error">${esc(tc.error||"unknown error")}</span>`));
    bodyEl.appendChild(f);
  }
  box.appendChild(bodyEl);
  return box;
}

function jsonField(label, raw){
  const f = el("div", { class:"tc-field" });
  const head = el("div", { class:"tc-field-head" });
  head.innerHTML = `<span class="tc-field-label">${esc(label)}</span>`;
  const copy = el("button", { class:"copybtn", "aria-label":"复制 "+label }, `${ICON.copy}<span>复制</span>`);
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(raw||""); } catch(e){
      const ta=document.createElement("textarea"); ta.value=raw||""; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){ } ta.remove();
    }
    copy.classList.add("done"); copy.querySelector("span").textContent="已复制";
    setTimeout(()=>{ copy.classList.remove("done"); copy.querySelector("span").textContent="复制"; }, 1400);
  });
  head.appendChild(copy);
  f.appendChild(head);
  const pre = el("pre", { class:"json scroll", tabindex:"0" });
  pre.innerHTML = (raw && raw.trim()) ? colorJSON(raw) : '<span class="j-null">—</span>';
  f.appendChild(pre);
  return f;
}

/* ---- Graph (DAG) — interactive: zoom / pan / fit-to-view + click-a-node detail ----
   Vanilla-JS reimagining of the console-web Studio graph (no React / no @xyflow). The API graph
   carries only nodes/edges; per-node status comes from deriveNodeStatus (committed timeline, never
   invented). Node detail is a pure client-side join of the node against the run timeline events for
   the same stepId — no extra backend call. */
const GRAPH_CATEGORY = {
  transform:"data", assign:"data", retrieve_facts:"data", cache:"data",
  guard:"control", conditional:"control", switch:"control", while:"control", delay:"control", wait_signal:"control", checkpoint:"control",
  llm:"ai", llm_call:"ai", tool:"ai", tool_call:"ai", evaluate:"ai", reflect:"ai",
  foreach:"composition", parallel:"composition", race:"composition", map_reduce:"composition", workflow_call:"composition", dynamic_workflow:"composition", vote:"composition",
  connector_call:"integration", emit:"integration",
  human:"human", human_input:"human", human_approval:"human"
};
function nodeCategory(t){ return GRAPH_CATEGORY[String(t||"").toLowerCase()] || ""; }
const GRAPH_ZOOM_MIN = 0.3, GRAPH_ZOOM_MAX = 2.0;
const clampZoom = z => Math.max(GRAPH_ZOOM_MIN, Math.min(GRAPH_ZOOM_MAX, z));
const ST_LABEL = { done:"已完成", current:"进行中", failed:"失败", stopped:"已停止", pending:"待执行" };
const ST_BADGE = { done:"completed", current:"running", failed:"failed", stopped:"stopped", pending:"unknown" };

function applyGraphTransform(viewport){
  const v = state.graphView;
  viewport.style.transform = `translate(${v.panX}px,${v.panY}px) scale(${v.zoom})`;
  const lab = document.getElementById("graphZoomLabel");
  if(lab) lab.textContent = Math.round(v.zoom*100) + "%";
}
/* Fit the whole graph into the viewport. readableFloor (optional) keeps the FIRST view legible: a wide
   horizontal flow in a narrow pane would otherwise fit at ~30% (unreadable), so when the true-fit zoom
   falls below the floor we open at the floor zoom anchored to the flow start and let the user pan. The
   explicit Fit control passes no floor → true fit-everything overview. */
function fitGraphView(wrap, viewport, W, H, readableFloor){
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  if(!vw || !vh) return;
  const pad = 28;
  const fit = clampZoom(Math.min((vw-pad*2)/W, (vh-pad*2)/H, 1));
  if(readableFloor && fit < readableFloor){
    const zoom = readableFloor;
    state.graphView = { zoom, panX: pad, panY: Math.max(pad, (vh - H*zoom)/2), fitted:true };
  } else {
    state.graphView = { zoom: fit, panX:(vw - W*fit)/2, panY:(vh - H*fit)/2, fitted:true };
  }
  applyGraphTransform(viewport);
}
/* Auto-fit once the graph first becomes visible. Deferred via setTimeout (not rAF — rAF is paused on
   hidden/background tabs, which would leave the graph unfitted); the node is attached after the
   synchronous render so reading clientWidth forces layout. Retry until the viewport is measurable. */
function scheduleAutoFit(host, viewport, W, H){
  let tries = 0;
  const tick = () => {
    if(state.graphView.fitted || state.activeTab !== "graph") return;
    if(host.clientWidth > 0 && host.clientHeight > 0){ fitGraphView(host, viewport, W, H, 0.55); return; }
    if(++tries < 12) setTimeout(tick, 30);
  };
  setTimeout(tick, 0);
}
function zoomGraphAt(viewport, factor, cx, cy){
  const v = state.graphView;
  const nz = clampZoom(v.zoom * factor);
  const k = nz / v.zoom;
  v.panX = cx - (cx - v.panX) * k;
  v.panY = cy - (cy - v.panY) * k;
  v.zoom = nz; v.fitted = true;
  applyGraphTransform(viewport);
}
function attachGraphInteractions(wrap, viewport){
  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    zoomGraphAt(viewport, e.deltaY < 0 ? 1.1 : 1/1.1, e.clientX - rect.left, e.clientY - rect.top);
  }, { passive:false });

  let dragging=false, pid=null, sx=0, sy=0, ox=0, oy=0;
  wrap.addEventListener("pointerdown", (e) => {
    if(e.button!==0 || e.target.closest(".gnode, .graph-controls, .gnode-detail")) return;
    dragging=true; pid=e.pointerId; sx=e.clientX; sy=e.clientY; ox=state.graphView.panX; oy=state.graphView.panY;
    wrap.classList.add("is-panning");
    try { wrap.setPointerCapture(e.pointerId); } catch(_){}
  });
  wrap.addEventListener("pointermove", (e) => {
    if(!dragging || e.pointerId!==pid) return;
    state.graphView.panX = ox + (e.clientX - sx);
    state.graphView.panY = oy + (e.clientY - sy);
    state.graphView.fitted = true;
    applyGraphTransform(viewport);
  });
  const end = () => { if(!dragging) return; dragging=false; wrap.classList.remove("is-panning"); try { wrap.releasePointerCapture(pid); } catch(_){} };
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);
}

function openNodeDetail(nodeId){ state.selectedNodeId = nodeId; syncNodeDetail(); }
function closeNodeDetail(){ state.selectedNodeId = null; syncNodeDetail(); }
/* Toggle the drawer + node halo in place so an open panel and the zoom/pan transform survive without a
   full page re-render. */
function syncNodeDetail(){
  const host = document.querySelector(".graph-wrap");
  if(!host) return;
  host.querySelectorAll(".gnode").forEach(nd => nd.classList.toggle("selected", nd.getAttribute("data-node")===state.selectedNodeId));
  const existing = host.querySelector(".gnode-detail");
  if(existing) existing.remove();
  const detail = currentDetail();
  const g = detail && DataSource.getGraph(detail.summary.runId);
  if(state.selectedNodeId && detail && g && g.nodes.some(nd => nd.nodeId === state.selectedNodeId))
    host.appendChild(renderNodeDetailPanel(detail, g, state.selectedNodeId));
}

function renderNodeDetailPanel(detail, g, nodeId){
  const node = g.nodes.find(nd => nd.nodeId === nodeId);
  const sid = (node && node.stepId) || "";
  const st = (g.nodeStatus && g.nodeStatus[nodeId]) || "pending";
  // Join by the bare stepId (WorkflowStep nodes); topology nodes (run/actor) have none → no step events.
  const events = sid
    ? (detail.timeline || []).filter(e => e.stepId === sid).slice().sort((a,b) => parseT(a.timestampUtc) - parseT(b.timestampUtc))
    : [];
  const tsList = events.map(e => parseT(e.timestampUtc)).filter(x => !isNaN(x));
  const startTs = tsList.length ? Math.min.apply(null, tsList) : null;
  const endTs = tsList.length ? Math.max.apply(null, tsList) : null;
  const cat = nodeCategory(node && node.nodeType);

  const panel = el("aside", { class:"gnode-detail", role:"region", "aria-label":`节点详情 ${nodeId}`, tabindex:"-1" });
  panel.addEventListener("keydown", (e) => { if(e.key === "Escape"){ e.stopPropagation(); closeNodeDetail(); } });

  const head = el("div", { class:"nd-head" });
  head.innerHTML = `<span class="nd-ic" data-cat="${cat}" aria-hidden="true">${stepTypeIcon(node && node.nodeType)}</span>
    <span class="nd-id" title="${esc(nodeId)}">${esc(sid || nodeId)}</span>`;
  const close = el("button", { class:"nd-close", type:"button", "aria-label":"关闭节点详情" }, ICON.x);
  close.addEventListener("click", (ev) => { ev.stopPropagation(); closeNodeDetail(); });
  head.appendChild(close);
  panel.appendChild(head);

  const body = el("div", { class:"nd-body scroll" });
  const meta = el("div", { class:"nd-meta" });
  meta.innerHTML = `
    <span class="k">状态</span><span class="v"><span class="badge b-${ST_BADGE[st]}">${ST_LABEL[st]}</span></span>
    <span class="k">类型</span><span class="v">${esc((node && node.nodeType) || "—")}</span>
    ${startTs!=null ? `<span class="k">开始</span><span class="v">${clockUTC(new Date(startTs).toISOString())} UTC</span>` : ""}
    ${(startTs!=null && endTs!=null && endTs>startTs) ? `<span class="k">用时</span><span class="v">${fmtDur(endTs-startTs)}</span>` : ""}`;
  body.appendChild(meta);

  const sec = el("div", {});
  sec.appendChild(el("div", { class:"nd-sec-title" }, `执行事件 · ${events.length}`));
  if(events.length === 0){
    sec.appendChild(el("div", { class:"nd-empty" }, sid
      ? "该步骤尚无执行事件（待执行，或本次运行未经过此步骤）。"
      : "拓扑节点（运行 / Actor）· 无独立步骤事件，状态反映整体运行。"));
  } else {
    events.forEach(ev => {
      const row = el("div", { class:"nd-ev" });
      const evHead = el("div", { class:"nd-ev-head" });
      evHead.innerHTML = `<span class="kind k-${ev.kind}">${kindIcon(ev.kind)}<span>${KIND[ev.kind]?.label||ev.kind}</span></span><span class="nd-ev-ts">${clockUTC(ev.timestampUtc)}</span>`;
      row.appendChild(evHead);
      if(ev.kind === "ToolCall" && ev.toolCall){
        row.appendChild(renderToolCall(ev.toolCall));
      } else if(REPLY_KINDS.has(ev.kind)){
        // surface the real LLM response so a selected node is explorable, not just a status dot
        row.appendChild(renderReplyBubble(ev));
      } else if(ev.message){
        row.appendChild(el("div", { class:"nd-ev-msg"+(ev.kind==="RunError"?" err":"") }, esc(ev.message)));
      }
      // model + token usage from this step's committed data bag
      if(ev.kind !== "ToolCall"){
        const details = renderDataDetails(ev.data);
        if(details) row.appendChild(details);
      }
      sec.appendChild(row);
    });
  }
  body.appendChild(sec);
  panel.appendChild(body);
  requestAnimationFrame(() => { try { panel.focus(); } catch(_){} });
  return panel;
}

function renderGraph(detail){
  const g = DataSource.getGraph(detail.summary.runId);
  const wrap = el("div", {});
  if(!g){ wrap.appendChild(el("div", { class:"detail-empty" }, `<div class="dt">暂无拓扑数据</div>`)); return wrap; }

  const host = el("div", { class:"graph-wrap", role:"application", "aria-label":"工作流拓扑图：滚轮缩放、拖拽平移、点击节点查看详情" });
  const viewport = el("div", { class:"graph-viewport" });
  const canvas = el("div", { class:"graph-canvas" });

  const horizontal = window.innerWidth > 720;
  const NW = 244, NH = 96, GX = 150, GY = 84, PAD = 28;
  const pos = {};

  // Layered layout from the edges (OWNS / CONTAINS_STEP / CHILD_OF). Depth = longest path from the roots,
  // so the run's steps fan out as CHILD nodes one column over instead of forming a fake left-to-right
  // sequence. This is what makes "running run containing an already-done step" read as containment, not
  // a contradictory timeline. depth = primary axis; siblings stack on the secondary axis.
  const ids = g.nodes.map(nd => nd.nodeId);
  const idSet = new Set(ids);
  const outAdj = {}; const indeg = {};
  ids.forEach(id => { outAdj[id] = []; indeg[id] = 0; });
  g.edges.forEach(e => {
    if(idSet.has(e.fromNodeId) && idSet.has(e.toNodeId) && e.fromNodeId !== e.toNodeId){
      outAdj[e.fromNodeId].push(e.toNodeId);
      indeg[e.toNodeId] += 1;
    }
  });
  let roots = ids.filter(id => indeg[id] === 0);
  if(roots.length === 0) roots = [(g.rootNodeId && idSet.has(g.rootNodeId)) ? g.rootNodeId : ids[0]];
  const depth = {}; ids.forEach(id => depth[id] = 0);
  const queue = roots.slice();
  let guard = 0; const cap = ids.length * ids.length + 16; // cycle defense
  while(queue.length && guard++ < cap){
    const id = queue.shift();
    for(const c of outAdj[id]){
      if(depth[c] < depth[id] + 1){ depth[c] = depth[id] + 1; queue.push(c); }
    }
  }
  const rowByDepth = {};
  g.nodes.forEach(nd => {
    const d = depth[nd.nodeId] || 0;
    const r = rowByDepth[d] === undefined ? 0 : rowByDepth[d] + 1;
    rowByDepth[d] = r;
    pos[nd.nodeId] = horizontal
      ? { x: PAD + d*(NW+GX), y: PAD + r*(NH+GY) }
      : { x: PAD + r*(NW+GX), y: PAD + d*(NH+GY) };
  });
  const maxDepth = ids.reduce((m,id) => Math.max(m, depth[id] || 0), 0);
  const maxRow = Object.values(rowByDepth).reduce((m,r) => Math.max(m, r), 0);
  const cols = horizontal ? maxDepth : maxRow;     // along X
  const rows = horizontal ? maxRow : maxDepth;     // along Y
  const W = PAD*2 + (cols+1)*NW + cols*GX;
  const H = PAD*2 + (rows+1)*NH + rows*GY;
  canvas.style.width = W+"px"; canvas.style.height = H+"px";

  // SVG edges
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS,"svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const defs = document.createElementNS(svgNS,"defs");
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted-2)"/></marker>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>`;
  svg.appendChild(defs);

  // Step flow (NEXT, from each step's NextStepId) is the meaningful relationship — render it prominently;
  // the run -> step CONTAINS_STEP edges are membership scaffolding, so fade them and hide the ones the flow
  // already reaches (leaving just run -> entry-step). With no NEXT edges (older graph data) nothing is
  // hidden and the prior look is preserved.
  const nextTargets = new Set();
  g.edges.forEach(e => { if(e.edgeType === "NEXT") nextTargets.add(e.toNodeId); });

  const edgeLabels = [];
  g.edges.forEach(e => {
    if(e.edgeType === "CONTAINS_STEP" && nextTargets.has(e.toNodeId)) return; // redundant with the flow edge
    const a = pos[e.fromNodeId], b = pos[e.toNodeId];
    if(!a||!b) return;
    let x1,y1,x2,y2,mx,my;
    if(horizontal){ x1=a.x+NW; y1=a.y+NH/2; x2=b.x; y2=b.y+NH/2; mx=(x1+x2)/2; my=y1; }
    else { x1=a.x+NW/2; y1=a.y+NH; x2=b.x+NW/2; y2=b.y; mx=x1; my=(y1+y2)/2; }
    const isFlow = e.edgeType === "NEXT";
    const isContains = e.edgeType === "CONTAINS_STEP";
    const path = document.createElementNS(svgNS,"path");
    let d;
    if(horizontal){ const cx=(x1+x2)/2; d=`M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`; }
    else { const cy=(y1+y2)/2; d=`M${x1},${y1} C${x1},${cy} ${x2},${cy} ${x2},${y2}`; }
    path.setAttribute("d", d);
    path.setAttribute("fill","none");
    path.setAttribute("stroke", isFlow ? "var(--accent)" : "var(--muted-2)");
    path.setAttribute("stroke-width", isFlow ? "2" : "1.6");
    path.setAttribute("marker-end", isFlow ? "url(#arrowFlow)" : "url(#arrow)");
    if(isContains){ path.setAttribute("stroke-dasharray","3 4"); path.setAttribute("opacity",".32"); }
    else if(g.nodeStatus && g.nodeStatus[e.toNodeId]==="pending"){ path.setAttribute("stroke-dasharray","4 4"); path.setAttribute("opacity",".6"); }
    svg.appendChild(path);
    // label: branch key on conditional flow edges; type for OWNS/CHILD_OF; none for the faded containment
    const label = isFlow ? (e.branchKey || "") : (isContains ? "" : e.edgeType);
    if(label) edgeLabels.push({ mx, my, type: label, flow: isFlow });
  });
  canvas.appendChild(svg);

  // nodes (clickable buttons → detail drawer)
  g.nodes.forEach(nd => {
    const st = (g.nodeStatus && g.nodeStatus[nd.nodeId]) || "pending";
    const cat = nodeCategory(nd.nodeType);
    const node = el("button", {
      type:"button",
      class:`gnode st-${st}${state.selectedNodeId===nd.nodeId?" selected":""}`,
      "data-cat": cat || null,
      "data-node": nd.nodeId,
      "aria-label":`节点 ${nd.stepId || nd.nodeId}，${ST_LABEL[st]}，点击查看详情`,
      style:`left:${pos[nd.nodeId].x}px;top:${pos[nd.nodeId].y}px`
    });
    node.innerHTML = `
      <div class="gn-top">
        <span class="gn-ic" aria-hidden="true">${stepTypeIcon(nd.nodeType)}</span>
        <div class="gn-main"><div class="gn-id" title="${esc(nd.nodeId)}">${esc(nd.stepId || midTrunc(nd.nodeId, 26))}</div><div class="gn-type">${esc(midTrunc(nd.nodeType, 28) || "—")}</div></div>
      </div>
      <div class="gn-foot"><span class="gn-state">${ST_LABEL[st]}</span></div>`;
    node.addEventListener("click", (ev) => { ev.stopPropagation(); openNodeDetail(nd.nodeId); });
    canvas.appendChild(node);
  });

  // edge labels
  edgeLabels.forEach(L => {
    canvas.appendChild(el("span", { class:"edge-label"+(L.flow?" flow":""), style:`left:${L.mx}px;top:${L.my}px` }, esc(L.type)));
  });

  viewport.appendChild(canvas);
  host.appendChild(viewport);

  // zoom / fit controls
  const controls = el("div", { class:"graph-controls", role:"group", "aria-label":"缩放控制" });
  const fitIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 0-1 1h-4"/></svg>';
  const mkBtn = (label, title, fn) => { const b = el("button", { type:"button", "aria-label":title, title }, label); b.addEventListener("click", (ev) => { ev.stopPropagation(); fn(); }); return b; };
  controls.appendChild(mkBtn("+", "放大", () => zoomGraphAt(viewport, 1.2, host.clientWidth/2, host.clientHeight/2)));
  controls.appendChild(el("div", { class:"graph-zoom-label", id:"graphZoomLabel" }, Math.round(state.graphView.zoom*100)+"%"));
  controls.appendChild(mkBtn("−", "缩小", () => zoomGraphAt(viewport, 1/1.2, host.clientWidth/2, host.clientHeight/2)));
  controls.appendChild(mkBtn(fitIcon, "适应窗口", () => fitGraphView(host, viewport, W, H)));
  controls.appendChild(mkBtn("1:1", "实际大小", () => { state.graphView.zoom = 1; state.graphView.fitted = true; applyGraphTransform(viewport); }));
  host.appendChild(controls);

  // node detail drawer (re-opened after a polling re-render when a node stays selected)
  if(state.selectedNodeId && g.nodes.some(nd => nd.nodeId === state.selectedNodeId))
    host.appendChild(renderNodeDetailPanel(detail, g, state.selectedNodeId));

  attachGraphInteractions(host, viewport);
  applyGraphTransform(viewport);
  // auto-fit once when the graph first becomes visible; keep the first view legible on narrow panes.
  if(!state.graphView.fitted) scheduleAutoFit(host, viewport, W, H);

  wrap.appendChild(host);

  const legend = el("div", { class:"graph-legend", "aria-hidden":"false" });
  legend.innerHTML = `
    <span class="lg"><span class="sw done"></span>已完成</span>
    <span class="lg"><span class="sw current"></span>进行中</span>
    <span class="lg"><span class="sw failed"></span>失败</span>
    <span class="lg"><span class="sw stopped"></span>已停止</span>
    <span class="lg"><span class="sw pending"></span>待执行</span>`;
  wrap.appendChild(legend);
  return wrap;
}

/* ===========================================================================
   Compose
   =========================================================================== */
// Filter / scope changes opt into a run-list scroll reset; selection and polling preserve the position.
let pendingListScrollReset = false;
let pendingDetailScrollReset = false;
let renderedObservatoryRoute = null;

function render(){
  const app = $("#app");
  const oldList=app.querySelector(".runlist"),oldDetail=app.querySelector(".detail-pane");
  const previousRoute=renderedObservatoryRoute;
  if((oldList||oldDetail)&&previousRoute){
    const previousSaved=readObservatoryViewState(sessionStorage,OBSERVATORY_VIEW_KEY,previousRoute);
    writeObservatoryViewState(sessionStorage,OBSERVATORY_VIEW_KEY,previousRoute,{list:paneScrollPosition(oldList,previousSaved.list),detail:paneScrollPosition(oldDetail,previousSaved.detail)});
  }
  const route=readObservatoryRoute(location.search,location.hash);
  const saved=readObservatoryViewState(sessionStorage,OBSERVATORY_VIEW_KEY,route);
  const sameRoute=previousRoute&&observatoryRouteKey(previousRoute)===observatoryRouteKey(route);
  const prevListScroll=pendingListScrollReset?0:(sameRoute?paneScrollPosition(oldList,saved.list):saved.list);
  const prevDetailScroll=pendingDetailScrollReset?0:(sameRoute?paneScrollPosition(oldDetail,saved.detail):saved.detail);
  pendingListScrollReset = false;
  pendingDetailScrollReset = false;
  renderedObservatoryRoute=route;
  app.innerHTML = "";
  app.appendChild(renderTopbar());

  const showBanner = state.signedIn && state.scenario === "globalError";
  if(showBanner) app.appendChild(renderBanner());

  if(!state.signedIn){
    app.appendChild(renderLogin());
    return;
  }

  app.appendChild(renderWorkspaceBar());

  const shell = el("div", { class:"shell"+(showBanner?" has-banner":"") });
  shell.appendChild(renderList());
  shell.appendChild(renderDetail());
  app.appendChild(shell);

  applyPaneScrollState(app.querySelector(".runlist"),app.querySelector(".detail-pane"),{list:prevListScroll,detail:prevDetailScroll});
  writeObservatoryViewState(sessionStorage,OBSERVATORY_VIEW_KEY,route,{list:prevListScroll,detail:prevDetailScroll});
}

/* ===========================================================================
   Selection + data loading (real fetch; near-live via polling)
   =========================================================================== */
function selectRun(runId){
  pendingDetailScrollReset = true;
  state.selectedRunId = runId;
  state.scenario = "detailLoading";
  state.activeTab = "timeline";
  writeObservatoryRoute({ run:runId, tab:"timeline" });
  state.selectedNodeId = null;
  state.graphView = { zoom: 1, panX: 0, panY: 0, fitted: false };
  document.body.setAttribute("data-mobile-view","detail");
  render();
  loadDetail(runId);
}

/* ---- 06-20-observatory-admin-cross-scope: admin cross-scope controls ---- */
async function fetchMe(){
  try {
    const me = await api("/api/workflow/observatory/me");
    if(me){ adminState.isAdmin = !!me.isAdmin; adminState.role = me.role || ""; adminState.email = me.email || ""; adminState.ownScope = me.scopeId || ""; }
  } catch(e){ /* admin UI stays hidden if /me is unavailable */ }
}

function setScope(scope){
  adminState.currentScope = scope;       // null = my runs · ALL_SCOPES · or a concrete scope id
  adminState.candidates = null; adminState.message = ""; adminState.inputDraft = "";
  pendingListScrollReset = true;         // new scope → fresh list, start at the top
  pendingDetailScrollReset = true;
  state.selectedRunId = null;
  cache.runs = []; cache.details = {}; cache.graphs = {};
  lastRunsSig = ""; lastDetailSig = "";
  state.scenario = "listLoading";
  writeObservatoryRoute({ scope:scope===ALL_SCOPES?"all":(scope||"mine"), run:"" });
  render();
  (async () => { await refreshRuns(); lastRunsSig = runsSig(cache.runs); render(); })();
}

function goToInput(){
  const raw = (adminState.inputDraft || "").trim();
  adminState.message = ""; adminState.candidates = null;
  if(!raw) return;
  if(raw.indexOf("@") >= 0) resolveEmail(raw); else setScope(raw);
}

function openRunInput(){
  const runId = (adminState.runIdDraft || "").trim();
  if(runId) selectRun(runId);
}

async function resolveEmail(email){
  adminState.message = "解析中…"; render();
  try {
    const res = await api("/api/workflow/observatory/resolve-scope?email=" + encodeURIComponent(email));
    const cands = (res && res.candidates) || [];
    if(cands.length === 0){ adminState.message = "未找到匹配的用户。"; adminState.candidates = null; render(); }
    else if(cands.length === 1){ setScope(cands[0].scopeId); }
    else { adminState.message = ""; adminState.candidates = cands; render(); }
  } catch(e){ adminState.message = "解析失败，请重试。"; render(); }
}

function renderAdminBar(){
  const bar = el("div", { class:"adminbar", role:"region", "aria-label":"管理员跨 scope 查看" });
  bar.appendChild(el("span", { class:"ab-badge", title:"NyxID 平台角色：" + esc(adminState.role) }, `${ICON.shield}<span>ADMIN</span>`));

  const view = el("span", { class:"ab-view" });
  view.innerHTML = adminState.currentScope === ALL_SCOPES
    ? "正在查看 <b>全部 scope</b>"
    : (adminState.currentScope ? "正在查看 scope <b>" + esc(adminState.currentScope) + "</b>" : "正在查看 <b>我的运行</b>");
  bar.appendChild(view);

  const input = el("input", { class:"ab-input", type:"text", placeholder:"输入邮箱或 scope id…", "aria-label":"邮箱或 scope id", value: adminState.inputDraft || "" });
  input.addEventListener("input", e => { adminState.inputDraft = e.target.value; });
  input.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); goToInput(); } });
  bar.appendChild(input);

  const go = el("button", { class:"chip" }, "前往"); go.addEventListener("click", goToInput); bar.appendChild(go);
  const runInput = el("input", { class:"ab-input", type:"text", placeholder:"输入完整 run id…", "aria-label":"完整 run id", value: adminState.runIdDraft || "" });
  runInput.addEventListener("input", e => { adminState.runIdDraft = e.target.value; });
  runInput.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); openRunInput(); } });
  bar.appendChild(runInput);
  const openRun = el("button", { class:"chip" }, "打开运行"); openRun.addEventListener("click", openRunInput); bar.appendChild(openRun);
  const all = el("button", { class:"chip", "aria-pressed": String(adminState.currentScope === ALL_SCOPES) }, "全部 scope");
  all.addEventListener("click", () => setScope(ALL_SCOPES)); bar.appendChild(all);
  if(adminState.currentScope){
    const back = el("button", { class:"linkbtn" }, "返回我的运行");
    back.addEventListener("click", () => setScope(null)); bar.appendChild(back);
  }
  if(adminState.message) bar.appendChild(el("span", { class:"ab-msg", role:"status" }, esc(adminState.message)));
  if(adminState.candidates && adminState.candidates.length){
    const cands = el("div", { class:"ab-cands", "aria-label":"候选 scope" });
    adminState.candidates.forEach(c => {
      const b = el("button", { class:"chip", title:"角色：" + esc(c.role || "") }, esc((c.email || c.scopeId) + " · " + c.scopeId));
      b.addEventListener("click", () => setScope(c.scopeId));
      cands.appendChild(b);
    });
    bar.appendChild(cands);
  }
  bar.appendChild(el("div", { class:"ab-hint" }, "邮箱解析为该 NyxID 用户的 scope id（≈用户 id）；全部 scope 为最近若干条视图。"));
  return bar;
}

async function refreshRuns(){
  try {
    const runs = await api("/api/workflow/observatory/runs" + listQueryParams());
    cache.runs = runs || [];
    if(state.scenario === "listLoading" || state.scenario === "empty" || state.scenario === "globalError"){
      state.scenario = (cache.runs.length === 0) ? "empty" : "normal";
    }
    return true;
  } catch(e){
    if(e.message !== "unauthorized") state.scenario = "globalError";
    return false;
  }
}

async function refreshDetail(runId){
  try {
    const detailUrl = runDetailRequestPath(runId,adminState,cache.runs,false);
    const detail = await api(detailUrl);
    if(detail === null){
      delete cache.details[runId];
      if(state.selectedRunId === runId) state.scenario = "notFound";
      return false;
    }
    cache.details[runId] = detail;
    if(cache.graphs[runId]) cache.graphs[runId].nodeStatus = deriveNodeStatus(cache.graphs[runId], detail);
    if(state.selectedRunId === runId && (state.scenario === "detailLoading" || state.scenario === "notFound")) state.scenario = "normal";
    return true;
  } catch(e){
    if(e.message !== "unauthorized" && state.scenario === "detailLoading") state.scenario = "globalError";
    return false;
  }
}

async function loadDetail(runId){
  await refreshDetail(runId);
  lastDetailSig = detailSig(cache.details[runId]);
  render();
}

async function loadGraph(runId){
  if(!runId || cache.graphs[runId]) return;
  try {
    const graphUrl = runGraphRequestPath(runId,adminState,cache.runs);
    const g = await api(graphUrl);
    if(g){
      g.nodeStatus = deriveNodeStatus(g, cache.details[runId]);
      cache.graphs[runId] = g;
      if(state.activeTab === "graph" && state.selectedRunId === runId) render();
    }
  } catch(e){ /* graph view is optional; ignore fetch errors */ }
}

/* ---- near-live polling (~3s, paused when tab hidden); history & live share it ---- */
function runsSig(runs){ return runs.map(r => r.runId + ":" + r.status + ":" + r.updatedAtUtc + ":" + r.stateVersion).join("|"); }
function detailSig(d){ return d ? (d.summary.status + ":" + d.summary.stateVersion + ":" + ((d.timeline && d.timeline.length) || 0) + ":" + ((d.diagnostics && d.diagnostics.length) || 0)) : "none"; }
let lastRunsSig = "", lastDetailSig = "";

async function poll(){
  if(document.hidden || !state.signedIn) return;
  let changed = false;
  const before = state.scenario;
  await refreshRuns();
  const rs = runsSig(cache.runs);
  if(rs !== lastRunsSig){ lastRunsSig = rs; changed = true; }
  if(state.selectedRunId && state.scenario !== "notFound"){
    await refreshDetail(state.selectedRunId);
    const ds = detailSig(cache.details[state.selectedRunId]);
    if(ds !== lastDetailSig){ lastDetailSig = ds; changed = true; }
  }
  if(state.scenario !== before) changed = true;
  if(changed){ render(); return; }
  const chip = document.getElementById("liveChip");
  if(chip && chip.classList.contains("is-live")){ chip.classList.add("is-polling"); setTimeout(() => chip.classList.remove("is-polling"), 600); }
}
let pollTimer = null;
function startPolling(){ stopPolling(); pollTimer = setInterval(poll, CFG.pollMs); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

/* lightweight 1s ticker: refresh relative-time / duration labels in place without
   reflowing the timeline (preserves tool-call expand state + focus). */
function updateRelTimes(){
  const now = nowMs();
  document.querySelectorAll("[data-since]").forEach(node => {
    const iso = node.getAttribute("data-since");
    const base = relTime(iso, now);
    node.textContent = node.classList.contains("freshness") ? base + " 更新" : base;
  });
  document.querySelectorAll("[data-duration]").forEach(node => {
    node.textContent = fmtDur(now - parseT(node.getAttribute("data-duration")));
  });
}
setInterval(() => { if(state.signedIn && !document.hidden) updateRelTimes(); }, 1000);

document.addEventListener("visibilitychange", () => { if(!document.hidden) poll(); });

/* ===========================================================================
   Init
   =========================================================================== */
applyTheme();
setImmersive(state.immersive);
document.addEventListener("keydown", event => {
  if(event.key !== "Escape") return;
  if(state.selectedNodeId){ closeNodeDetail(); return; }
  const tools=document.querySelector(".admin-tools[open]");
  if(tools){ tools.removeAttribute("open"); return; }
  if(state.immersive){ setImmersive(false); render(); }
});
window.addEventListener("pagehide", () => {
  const list=document.querySelector(".runlist"),detail=document.querySelector(".detail-pane");
  const route=readObservatoryRoute(location.search,location.hash);
  const saved=readObservatoryViewState(sessionStorage,OBSERVATORY_VIEW_KEY,route);
  writeObservatoryViewState(sessionStorage,OBSERVATORY_VIEW_KEY,route,{list:paneScrollPosition(list,saved.list),detail:paneScrollPosition(detail,saved.detail)});
});
(async function init(){
  try { await completeLoginIfCallback(); }
  catch(e){ console.warn("observatory: login callback failed", e); }
  if(!getToken()){ state.signedIn = false; state.scenario = "login"; if(notifyAdminShellAuth("auth-required", "登录已过期，请重新使用 NyxID 登录。")) return; render(); return; }
  state.signedIn = true;
  state.scenario = "listLoading";
  render();
  cache.account = toAccount(await fetchUserInfo()) || cache.account;
  await fetchMe();
  if(adminState.isAdmin) adminState.currentScope = initialRoute.scope === "all" ? ALL_SCOPES : (initialRoute.scope === "mine" ? null : initialRoute.scope);
  await refreshRuns();
  lastRunsSig = runsSig(cache.runs);
  if(state.selectedRunId) await loadDetail(state.selectedRunId);
  render();
  // Admin-only: resolve scopeIds to nyxid display names in the background, then re-render so the
  // names appear in cross-scope rows and the run-detail scope chip without delaying the runs list.
  if(adminState.isAdmin){ loadNyxidDirectory().then(() => { if(nyxidDirectory.loaded) render(); }); }
  startPolling();
})();

/* follow system theme changes only when the user hasn't manually chosen a theme */
if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  if(mq.addEventListener) mq.addEventListener("change", () => { if(!state.theme) render(); });
}
/* re-render on breakpoint cross so the graph relayouts for the new orientation */
let _rw; window.addEventListener("resize", () => { clearTimeout(_rw); _rw = setTimeout(() => { if(state.signedIn && state.scenario === "normal") render(); }, 160); });
</script>
