<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Workflow Run Observatory · 工作流运行观测台</title>
<style>
  /* =========================================================================
     Workflow Run Observatory — 只读运行观测台
     单文件、零外部依赖。深色为主，浅色全量支持。
     所有颜色走 CSS 自定义属性（设计令牌），不散落硬编码。
     ========================================================================= */

  /* ---- Design tokens : 深色（主） --------------------------------------- */
  :root {
    --bg:        #0f1115;
    --bg-grad:   radial-gradient(1200px 600px at 78% -10%, #161b26 0%, #0f1115 60%);
    --panel:     #171a21;
    --panel-2:   #1f232c;
    --panel-3:   #252b36;
    --border:    #2a2f3a;
    --border-soft:#22272f;
    --fg:        #e6e9ef;
    --fg-strong: #f4f6fb;
    --muted:     #9aa3b2;
    --muted-2:   #6c7585;
    --accent:    #5b8cff;
    --accent-ink:#0b1020;
    --accent-soft: rgba(91,140,255,.14);
    --accent-line: rgba(91,140,255,.40);

    --ok:    #3fb950;  --ok-soft:   rgba(63,185,80,.14);
    --warn:  #d29922;  --warn-soft: rgba(210,153,34,.15);
    --err:   #f85149;  --err-soft:  rgba(248,81,73,.14);
    --run:   #58a6ff;  --run-soft:  rgba(88,166,255,.16);
    --neutral:#9aa3b2; --neutral-soft: rgba(154,163,178,.12);

    --shadow: 0 8px 30px rgba(0,0,0,.40);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.30);
    --ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

    --r-sm: 6px; --r: 9px; --r-lg: 13px; --r-pill: 999px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;

    --list-w: 320px;
    --topbar-h: 56px;
    --workspacebar-h: 46px;
    color-scheme: dark;
  }

  /* ---- Design tokens : 浅色 --------------------------------------------- */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) { --auto-light: 1; }
  }
  :root[data-theme="light"], :root:not([data-theme]):has(#noop) { }

  /* light palette applied either by system pref (no manual theme) or manual toggle */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg:        #f5f7fa;
      --bg-grad:   radial-gradient(1100px 560px at 80% -12%, #eef2f8 0%, #f5f7fa 58%);
      --panel:     #ffffff;
      --panel-2:   #f3f5f9;
      --panel-3:   #eaeef4;
      --border:    #dde2ea;
      --border-soft:#e7ebf1;
      --fg:        #1c2128;
      --fg-strong: #0b0f14;
      --muted:     #57606b;
      --muted-2:   #828b97;
      --accent:    #2f63e0;
      --accent-ink:#ffffff;
      --accent-soft: rgba(47,99,224,.10);
      --accent-line: rgba(47,99,224,.34);
      --ok:#1a7f37; --ok-soft:rgba(26,127,55,.12);
      --warn:#9a6700; --warn-soft:rgba(154,103,0,.12);
      --err:#cf222e; --err-soft:rgba(207,34,46,.10);
      --run:#2f6fed; --run-soft:rgba(47,111,237,.12);
      --neutral:#57606b; --neutral-soft:rgba(87,96,107,.10);
      --shadow: 0 10px 30px rgba(16,24,40,.10);
      --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg:        #f5f7fa;
    --bg-grad:   radial-gradient(1100px 560px at 80% -12%, #eef2f8 0%, #f5f7fa 58%);
    --panel:     #ffffff;
    --panel-2:   #f3f5f9;
    --panel-3:   #eaeef4;
    --border:    #dde2ea;
    --border-soft:#e7ebf1;
    --fg:        #1c2128;
    --fg-strong: #0b0f14;
    --muted:     #57606b;
    --muted-2:   #828b97;
    --accent:    #2f63e0;
    --accent-ink:#ffffff;
    --accent-soft: rgba(47,99,224,.10);
    --accent-line: rgba(47,99,224,.34);
    --ok:#1a7f37; --ok-soft:rgba(26,127,55,.12);
    --warn:#9a6700; --warn-soft:rgba(154,103,0,.12);
    --err:#cf222e; --err-soft:rgba(207,34,46,.10);
    --run:#2f6fed; --run-soft:rgba(47,111,237,.12);
    --neutral:#57606b; --neutral-soft:rgba(87,96,107,.10);
    --shadow: 0 10px 30px rgba(16,24,40,.10);
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
    color-scheme: light;
  }

  /* ---- Reset / base ----------------------------------------------------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--fg);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-soft); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible {
    outline: none;
    box-shadow: var(--ring);
    border-radius: var(--r-sm);
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  /* ---- Status primitives ------------------------------------------------ */
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 0 3px transparent; }
  .dot.s-running   { background: var(--run);  box-shadow: 0 0 0 0 var(--run); animation: pulse 2.4s ease-out infinite; }
  .dot.s-completed { background: var(--ok); }
  .dot.s-failed, .dot.s-timed_out { background: var(--err); }
  .dot.s-stopped, .dot.s-disabled { background: var(--warn); }
  .dot.s-unknown, .dot.s-not_found { background: var(--neutral); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--run-soft); }
    70%  { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 600; letter-spacing: .01em;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; }
  .b-running   { color: var(--run);  background: var(--run-soft);  border-color: color-mix(in oklab, var(--run) 30%, transparent); }
  .b-completed { color: var(--ok);   background: var(--ok-soft);   border-color: color-mix(in oklab, var(--ok) 30%, transparent); }
  .b-failed, .b-timed_out { color: var(--err); background: var(--err-soft); border-color: color-mix(in oklab, var(--err) 30%, transparent); }
  .b-stopped, .b-disabled { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in oklab, var(--warn) 30%, transparent); }
  .b-unknown, .b-not_found { color: var(--muted); background: var(--neutral-soft); border-color: var(--border); }

  /* =========================================================================
     Top bar
     ========================================================================= */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    height: var(--topbar-h);
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: color-mix(in oklab, var(--panel) 88%, transparent);
    backdrop-filter: saturate(140%) blur(12px);
    -webkit-backdrop-filter: saturate(140%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  /* Fixed-width brand region keeps the shared suite-nav's start position independent of the
     active page title length, so the five entries don't shift when switching console pages.
     The title text ellipsizes; the brand-mark and read-only pill stay pinned (flex:0 0 auto). */
  .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 268px; width: 268px; min-width: 0; overflow: hidden; }
  .brand > div { min-width: 0; overflow: hidden; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto;
    background: linear-gradient(150deg, var(--accent), color-mix(in oklab, var(--accent) 55%, #7c4dff));
    display: grid; place-items: center; color: #fff; box-shadow: var(--shadow-sm);
  }
  .brand-name { font-weight: 650; letter-spacing: -.01em; color: var(--fg-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { color: var(--muted-2); font-size: 12px; white-space: nowrap; }
  .pill-ro {
    font-size: 11px; font-weight: 650; letter-spacing: .04em; flex: 0 0 auto;
    padding: 2px 8px; border-radius: var(--r-pill);
    color: var(--muted); background: var(--neutral-soft); border: 1px solid var(--border);
    text-transform: uppercase;
  }
  .spacer { flex: 1 1 auto; }

  /* ---- shared suite navigation (identical across the five console pages) -- */
  .suite-nav { display:flex; align-items:center; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .suite-nav::-webkit-scrollbar { display:none; }
  .suite-nav a { display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:var(--r-pill); font-size:12.5px; font-weight:600; color:var(--muted); text-decoration:none; border:1px solid transparent; white-space:nowrap; transition:color .15s,background .15s,border-color .15s; }
  .suite-nav a:hover { color:var(--fg); background:var(--panel-2); }
  .suite-nav a[aria-current="page"] { color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line); }
  .suite-nav svg { width:14px; height:14px; flex:0 0 auto; }
  @media (max-width:760px) { .suite-nav .nav-label { display:none; } .suite-nav a { padding:6px 8px; } }

  .live {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 11px 5px 9px; border-radius: var(--r-pill);
    background: var(--panel-2); border: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .live .dot { width: 7px; height: 7px; background: var(--ok); }
  .live.is-live .dot { background: var(--run); animation: pulse 2.4s ease-out infinite; }
  .live .freshness { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
  .live.is-polling { border-color: var(--accent-line); }

  .iconbtn {
    width: 34px; height: 34px; display: grid; place-items: center;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r);
    color: var(--muted); transition: color .15s, border-color .15s, background .15s;
  }
  .iconbtn:hover { color: var(--fg); border-color: var(--muted-2); }

  .account {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 6px 4px 4px; border-radius: var(--r-pill);
    background: var(--panel-2); border: 1px solid var(--border);
  }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(140deg, #6f9bff, #9b6bff); color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .account .who { font-size: 12.5px; color: var(--fg); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linkbtn {
    background: transparent; border: 0; color: var(--accent); font-size: 12.5px; font-weight: 600;
    padding: 4px 6px; border-radius: var(--r-sm);
  }
  .linkbtn:hover { text-decoration: underline; }
  .workspacebar {
    display:flex; align-items:center; gap:10px; height:var(--workspacebar-h); padding:7px 16px;
    border-bottom:1px solid var(--border); background:var(--panel);
  }
  .workspace-context { min-width:0; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; }
  .workspace-context b { max-width:min(48vw,620px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg-strong); font-weight:650; }
  .workspace-actions { margin-left:auto; display:flex; align-items:center; gap:7px; }
  .workspace-action {
    min-height:32px; display:inline-flex; align-items:center; gap:6px; padding:0 10px;
    border:1px solid var(--border); border-radius:var(--r); background:var(--panel-2); color:var(--fg);
    font-size:12px; font-weight:600;
  }
  .workspace-action:hover { border-color:var(--muted-2); background:var(--panel-3); }
  .workspace-action:disabled { opacity:.55; cursor:not-allowed; }
  .admin-tools { position:relative; }
  .admin-tools > summary { list-style:none; }
  .admin-tools > summary::-webkit-details-marker { display:none; }
  .admin-tools[open] > summary { border-color:var(--accent-line); color:var(--accent); }
  .admin-tools-panel {
    position:absolute; z-index:20; top:38px; right:0; width:min(680px,calc(100vw - 24px));
    border:1px solid var(--border); border-radius:var(--r); background:var(--panel); box-shadow:var(--shadow);
  }
  .admin-tools-panel .adminbar { border:0; border-radius:inherit; }

  /* =========================================================================
     Admin cross-scope bar (06-20-observatory-admin-cross-scope)
     ========================================================================= */
  .adminbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .adminbar .ab-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    padding: 3px 10px; border-radius: var(--r-pill);
    /* high-contrast solid accent chip with white ink — must read clearly at a glance */
    color: #fff; background: var(--accent);
    border: 1px solid color-mix(in oklab, var(--accent) 60%, #000);
    box-shadow: 0 1px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .adminbar .ab-badge svg { width: 12px; height: 12px; }
  .adminbar .ab-view { font-size: 12.5px; color: var(--muted); }
  .adminbar .ab-view b { color: var(--fg-strong); font-family: var(--mono); font-weight: 600; }
  .adminbar input.ab-input {
    font: inherit; font-size: 12.5px; padding: 5px 9px; min-width: 180px; flex: 0 1 280px;
    border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--panel-2); color: var(--fg);
  }
  .adminbar input.ab-input:focus { outline: none; border-color: var(--accent); }
  .adminbar .ab-msg { font-size: 12px; color: var(--err); }
  .adminbar .ab-cands { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .adminbar .ab-hint { flex-basis: 100%; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  body.observatory-immersive { --topbar-h:0px; }
  body.observatory-immersive .topbar,
  body.observatory-immersive .list-pane,
  body.observatory-immersive .admin-tools { display:none !important; }
  body.observatory-immersive .shell { grid-template-columns:1fr; }
  body.observatory-immersive .detail-inner { max-width:1400px; }

  /* =========================================================================
     Run-list filter bar (06-23-observatory-run-coverage-filter)
     状态 / 来源 / 更新时间窗，下推到 list 查询；与 scope 维度可组合。
     Collapsible: a compact toggle header is always visible; the controls expand
     below it. Collapsed by default so the run list isn't pushed down.
     ========================================================================= */
  .filterwrap { border-bottom: 1px solid var(--border-soft); background: var(--panel); }

  /* toggle header — keyboard-accessible button, aria-expanded */
  .fb-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 9px 16px; background: transparent; border: 0; color: var(--muted);
    font-size: 12px; font-weight: 650; letter-spacing: .03em;
    transition: color .12s, background .12s;
  }
  .fb-toggle:hover { color: var(--fg); background: var(--panel-2); }
  .fb-toggle .fb-tchevron { color: var(--muted-2); transition: transform .18s ease; flex: 0 0 auto; display: inline-grid; place-items: center; }
  .fb-toggle[aria-expanded="true"] .fb-tchevron { transform: rotate(90deg); }
  .fb-toggle .fb-ticon { color: var(--muted-2); display: inline-grid; place-items: center; flex: 0 0 auto; }
  .fb-toggle .fb-tlabel { color: var(--fg); }
  .fb-toggle .fb-tspacer { flex: 1 1 auto; }
  /* active-filter count badge shown on the header while collapsed */
  .fb-tcount {
    display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
    padding: 0 5px; border-radius: var(--r-pill); font-size: 11px; font-weight: 700;
    color: #fff; background: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 60%, #000);
  }
  .fb-tclear {
    display: inline-flex; align-items: center; background: transparent; border: 0;
    color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 4px; border-radius: var(--r-sm);
  }
  .fb-tclear:hover { text-decoration: underline; }

  /* active schedule deep-link filter chip (06-24): arrives via the /schedules deep-link, no select */
  .sched-filter {
    display: inline-flex; align-items: center; gap: 7px; margin: 0 16px 10px;
    max-width: calc(100% - 32px);
    padding: 5px 7px 5px 10px; border-radius: var(--r-pill); font-size: 12px;
    color: var(--run); background: var(--run-soft);
    border: 1px solid color-mix(in oklab, var(--run) 32%, transparent);
  }
  .sched-filter .sf-ic { display: inline-flex; flex: 0 0 auto; opacity: .85; }
  .sched-filter .sf-lab { flex: 0 0 auto; font-weight: 650; white-space: nowrap; }
  .sched-filter .sf-id { flex: 0 1 auto; min-width: 0; font-family: var(--mono); color: var(--fg); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sched-filter .sf-x {
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 18px; height: 18px;
    padding: 0; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; opacity: .7;
  }
  .sched-filter .sf-x:hover { opacity: 1; background: color-mix(in oklab, var(--run) 18%, transparent); }

  /* the controls panel — compact horizontal flex-wrap; hidden when collapsed */
  .filterbar {
    display: flex; align-items: flex-end; gap: 8px 10px; flex-wrap: wrap;
    padding: 4px 16px 12px;
  }
  .filterbar[hidden] { display: none; }
  .filterbar .fb-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .filterbar .fb-label {
    font-size: 10px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-2);
  }
  .filterbar .fb-select, .filterbar .fb-date {
    font: inherit; font-size: 12px; padding: 5px 8px; color: var(--fg);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-sm);
  }
  .filterbar .fb-select { min-width: 104px; }
  /* compact date inputs so they don't dominate the narrow pane */
  .filterbar .fb-date { width: 138px; min-width: 0; font-variant-numeric: tabular-nums; }
  .filterbar .fb-select:focus, .filterbar .fb-date:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .filterbar .fb-reset {
    background: transparent; border: 0; color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 6px 6px; border-radius: var(--r-sm); align-self: flex-end;
  }
  .filterbar .fb-reset:hover { text-decoration: underline; }
  .filterbar .fb-spacer { flex: 1 1 auto; }

  /* run-origin pill on each list row (legacy/empty origin renders no pill) */
  .run-row .rm .rm-origin {
    font-size: 10.5px; font-weight: 600; letter-spacing: .02em; line-height: 1;
    padding: 2px 7px; border-radius: var(--r-pill);
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line);
  }

  /* =========================================================================
     Error banner (role=alert)
     ========================================================================= */
  .banner {
    display: flex; align-items: center; gap: 10px;
    margin: 10px 16px 0; padding: 10px 12px;
    background: var(--err-soft); border: 1px solid color-mix(in oklab, var(--err) 36%, transparent);
    border-radius: var(--r); color: var(--fg);
    font-size: 13px;
  }
  .banner svg { color: var(--err); flex: 0 0 auto; }
  .banner .b-title { font-weight: 650; color: var(--err); }
  .banner .b-msg { color: var(--muted); }

  /* =========================================================================
     Workspace shell (master / detail)
     ========================================================================= */
  .shell {
    display: grid;
    grid-template-columns: var(--list-w) 1fr;
    height: calc(100dvh - var(--topbar-h) - var(--workspacebar-h));
    min-height: 0;
  }
  .shell.has-banner { height: auto; min-height: calc(100dvh - var(--topbar-h) - var(--workspacebar-h)); }

  /* ---- Runs list -------------------------------------------------------- */
  .list-pane {
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
    background: color-mix(in oklab, var(--panel) 40%, transparent);
  }
  .list-head { padding: 14px 16px 11px; border-bottom: 1px solid var(--border-soft); }
  .list-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .list-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .list-title .lt-ic { color: var(--muted-2); display: inline-grid; place-items: center; }
  /* count rendered as a small pill so the header reads as an intentional unit */
  .list-count {
    font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--muted);
    padding: 2px 9px; border-radius: var(--r-pill); background: var(--panel-2); border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  .filters { display: flex; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  .chip {
    padding: 4px 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 550;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    transition: color .12s, background .12s, border-color .12s;
  }
  .chip:hover { color: var(--fg); border-color: var(--muted-2); }
  .chip[aria-pressed="true"] { color: var(--fg-strong); background: var(--panel-3); border-color: var(--muted-2); }

  .runlist { overflow-y: auto; flex: 1 1 auto; padding: 8px; min-height: 0; }
  .run-row {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 11px;
    align-items: start; width: 100%; text-align: left;
    padding: 11px 12px; border-radius: var(--r); border: 1px solid transparent;
    background: transparent; color: inherit; margin-bottom: 2px;
    transition: background .12s, border-color .12s;
  }
  .run-row:hover { background: var(--panel-2); }
  .run-row .dot { margin-top: 5px; grid-row: span 2; }
  .run-row .rn { font-weight: 640; color: var(--fg-strong); letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-row .rm { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .run-row .rm .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-row .rm .sep { color: var(--border); }
  .run-row .rm .rm-status { font-weight: 600; color: var(--muted); }
  .run-row .rm .rm-status.s-running { color: var(--run); }
  .run-row .rm .rm-status.s-completed { color: var(--ok); }
  .run-row .rm .rm-status.s-failed, .run-row .rm .rm-status.s-timed_out { color: var(--err); }
  .run-row .rm .rm-status.s-stopped, .run-row .rm .rm-status.s-disabled { color: var(--warn); }
  .run-row[aria-current="true"] {
    background: var(--accent-soft);
    border-color: var(--accent-line);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .run-row[aria-current="true"] .rn { color: var(--fg-strong); }

  /* skeleton */
  .sk { background: linear-gradient(100deg, var(--panel-2) 30%, var(--panel-3) 50%, var(--panel-2) 70%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 5px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .sk-row { padding: 13px 12px; display: grid; grid-template-columns: auto 1fr; gap: 8px 11px; }
  .sk-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; }
  .sk-line { height: 10px; }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; color: var(--muted); padding: 48px 24px; height: 100%;
  }
  .empty .ic { width: 40px; height: 40px; color: var(--muted-2); opacity: .8; }
  .empty .et { font-weight: 600; color: var(--fg); }
  .empty .es { font-size: 12.5px; max-width: 220px; }

  /* =========================================================================
     Run detail
     ========================================================================= */
  .detail-pane { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
  .detail-inner { max-width: 980px; width: 100%; margin: 0 auto; padding: 22px 26px 64px; flex: 1 1 auto; }

  .backbar { display: none; }

  .run-header { display: flex; flex-direction: column; gap: 13px; }
  .rh-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rh-title { font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: var(--fg-strong); display: flex; align-items: center; gap: 10px; margin: 0; }
  .rh-title .dot { width: 11px; height: 11px; }
  .rh-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
  .rh-meta .k { color: var(--muted-2); }
  .rh-meta .v { font-family: var(--mono); color: var(--fg); }
  .rh-meta .grp { display: inline-flex; gap: 6px; align-items: baseline; }
  .rh-meta .rid-grp { align-items: center; }

  /* run id, broken into color-coded semantic chips (scope / 定义 / 运行) for legibility */
  .rid { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rid-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 9px; border-radius: var(--r-pill); border: 1px solid transparent; font-size: 11.5px;
  }
  .rid-chip .rid-lab { font-weight: 650; letter-spacing: .02em; }
  .rid-chip .rid-val { font-family: var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
  /* dimmed short scope id shown beside a resolved nyxid display name (admin scope-name resolution) */
  .muted-id { color: var(--muted-2); font-family: var(--mono); font-size: .92em; font-variant-numeric: tabular-nums; }
  .rid-chip.def   { color: #a78bfa;    background: rgba(167,139,250,.13); border-color: color-mix(in oklab, #a78bfa 32%, transparent); }
  .rid-chip.run   { color: var(--run); background: var(--run-soft);       border-color: color-mix(in oklab, var(--run) 32%, transparent); }
  .rid-chip.scope { color: var(--muted); background: var(--neutral-soft); border-color: var(--border); }
  .rid-chip.plain { color: var(--muted-2); background: var(--panel-2); border-color: var(--border); }
  .rid-copy {
    display: inline-grid; place-items: center; width: 24px; height: 22px; flex: 0 0 auto;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--muted);
  }
  .rid-copy:hover { color: var(--fg); border-color: var(--muted-2); }
  .rid-copy.done { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, transparent); }

  .usage-strip {
    display: flex; gap: 0; flex-wrap: wrap;
    border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden;
    background: var(--panel);
  }
  .usage-cell { flex: 1 1 auto; min-width: 110px; padding: 12px 16px; border-right: 1px solid var(--border-soft); }
  .usage-cell:last-child { border-right: 0; }
  .usage-cell .ul { font-size: 11px; color: var(--muted-2); letter-spacing: .04em; text-transform: uppercase; }
  .usage-cell .uv { font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--fg-strong); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .usage-cell .uv .unit { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .usage-cell.accent .uv { color: var(--accent); }

  .diagnostic-strip {
    margin-top: 16px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--panel);
    overflow: hidden;
  }
  .diagnostic-strip.has-error { border-color: color-mix(in oklab, var(--err) 42%, var(--border)); background: var(--err-soft); }
  .diag-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 11px 14px; border-bottom: 1px solid var(--border-soft); }
  .diag-title { font-weight: 700; color: var(--fg-strong); }
  .diag-sub { font-size: 12px; color: var(--muted); }
  .diag-body { padding: 11px 14px; display: grid; gap: 9px; }
  .diag-item { display: grid; gap: 5px; padding: 10px 11px; border: 1px solid var(--border-soft); border-radius: var(--r-sm); background: color-mix(in oklab, var(--panel) 86%, transparent); }
  .diag-item.error { border-color: color-mix(in oklab, var(--err) 34%, var(--border)); }
  .diag-item.warning { border-color: color-mix(in oklab, var(--warn) 34%, var(--border)); }
  .diag-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted-2); font-family: var(--mono); }
  .diag-code { font-weight: 700; color: var(--fg); }
  .diag-msg { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
  .diag-hint { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .diag-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .issue-pre {
    margin: 0; padding: 12px 13px; max-height: 300px; overflow: auto;
    background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--r-sm);
    font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--fg);
    white-space: pre-wrap; word-break: break-word;
  }
  .narrative { display:grid; gap:9px; margin-top:12px; }
  .narrative details { border:1px solid var(--border); border-radius:var(--r); background:var(--panel); overflow:hidden; }
  .narrative summary { cursor:pointer; padding:10px 13px; color:var(--fg); font-weight:650; }
  .narrative .issue-pre { margin:0; border-width:1px 0 0; border-radius:0; }
  .cross-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .step-list { display:grid; gap:9px; }
  .step-card { display:grid; gap:7px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--r); background:var(--panel); }
  .step-card > .mono, .step-card small { color:var(--muted); font-size:11.5px; }
  .approval-panel { margin-top:14px; padding:14px; border:1px solid color-mix(in oklab,var(--warn) 45%,var(--border)); border-radius:var(--r); background:var(--warn-soft); }
  .approval-head, .approval-actions { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
  .approval-head span { margin-left:auto; color:var(--muted); font-size:12px; }
  .approval-content { max-height:260px; margin:10px 0; padding:10px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--bg); white-space:pre-wrap; word-break:break-word; }
  .approval-feedback { width:100%; margin:10px 0; padding:9px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--panel); color:var(--fg); }
  .approval-error { margin-top:8px; color:var(--err); }
  .approval-actions .btn-primary { width:auto; padding:7px 12px; }

  /* ---- Tabs ------------------------------------------------------------- */
  .tabs { display: inline-flex; gap: 3px; padding: 3px; margin: 20px 0 0; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-pill); }
  .tab {
    padding: 6px 16px; border-radius: var(--r-pill); border: 0; background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 600; transition: color .15s, background .15s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--fg-strong); box-shadow: var(--shadow-sm); }
  .tabpanel { margin-top: 18px; }
  .tabpanel[hidden] { display: none; }

  /* =========================================================================
     Timeline — the centerpiece
     ========================================================================= */
  .timeline { position: relative; padding-left: 0; }
  .tl-rail-note { font-size: 11.5px; color: var(--muted-2); margin: 0 0 12px 2px; }

  .ev {
    position: relative;
    display: grid;
    grid-template-columns: 132px 1fr;
    gap: 14px;
    padding: 0 0 4px;
  }
  .ev .gutter { position: relative; display: flex; justify-content: flex-end; padding-top: 2px; }
  .ev .ts { font-family: var(--mono); font-size: 11.5px; color: var(--muted-2); white-space: nowrap; }
  .ev .node-rail { position: relative; padding-left: 22px; padding-bottom: 16px; }
  /* connecting line */
  .ev .node-rail::before {
    content: ""; position: absolute; left: 5px; top: 2px; bottom: -2px; width: 2px;
    background: var(--border);
  }
  .ev:last-child .node-rail::before { bottom: auto; height: 18px; }
  .ev .marker {
    position: absolute; left: 0; top: 2px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--neutral); z-index: 1;
  }
  .ev.k-RunStarted .marker, .ev.k-RunFinished .marker { border-color: var(--ok); background: var(--ok-soft); }
  .ev.k-RunError .marker, .ev.k-RunStopped .marker { border-color: var(--err); background: var(--err-soft); }
  .ev.k-RunStopped .marker { border-color: var(--warn); background: var(--warn-soft); }
  .ev.k-ToolCall .marker { border-color: var(--accent); background: var(--accent-soft); }
  .ev.k-HumanInputRequest .marker { border-color: var(--warn); background: var(--warn-soft); }
  .ev.k-TextMessage .marker, .ev.k-Message .marker { border-color: var(--run); background: var(--run-soft); }
  .ev.k-StepStarted .marker, .ev.k-StepFinished .marker { border-color: var(--muted-2); }

  .ev-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-height: 18px; }
  .kind {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 650; padding: 2px 9px; border-radius: var(--r-pill);
    border: 1px solid transparent; letter-spacing: .005em;
  }
  .kind svg { width: 13px; height: 13px; }
  .k-RunStarted .kind, .k-RunFinished .kind { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in oklab, var(--ok) 28%, transparent); }
  .k-RunError .kind { color: var(--err); background: var(--err-soft); border-color: color-mix(in oklab, var(--err) 38%, transparent); }
  .k-RunStopped .kind { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in oklab, var(--warn) 32%, transparent); }
  .k-StepStarted .kind, .k-StepFinished .kind { color: var(--muted); background: var(--neutral-soft); border-color: var(--border); }
  .k-TextMessage .kind, .k-Message .kind { color: var(--run); background: var(--run-soft); border-color: color-mix(in oklab, var(--run) 28%, transparent); }
  .k-ToolCall .kind { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
  .k-HumanInputRequest .kind { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in oklab, var(--warn) 38%, transparent); }

  .stepbadge {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 1px 7px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--border);
  }
  .stepbadge .st { color: var(--muted-2); }
  .agentbadge {
    font-size: 11px; color: var(--muted); padding: 1px 7px; border-radius: 5px;
    background: var(--neutral-soft); border: 1px solid var(--border-soft);
  }
  .ev-msg { color: var(--fg); font-size: 13.5px; margin-top: 5px; }
  .ev-cost { margin-top: 5px; }
  .costchip { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .costchip b { color: var(--fg); font-weight: 600; }

  /* TextMessage bubble */
  .bubble {
    margin-top: 7px; padding: 11px 14px; border-radius: 4px 12px 12px 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-left: 2px solid var(--run);
    color: var(--fg); font-size: 13.5px; line-height: 1.6; max-width: 62ch;
  }

  /* ---- Assistant / role reply — the real LLM response, beautified ---- */
  .reply {
    margin-top: 8px; max-width: 74ch;
    border: 1px solid var(--border); border-radius: 4px 12px 12px 12px;
    background:
      linear-gradient(180deg, color-mix(in oklab, var(--run) 5%, var(--panel)) 0%, var(--panel) 40%);
    border-left: 2px solid var(--run);
    overflow: hidden;
  }
  .reply-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border-soft);
  }
  .reply-avatar {
    width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff;
    background: linear-gradient(140deg, var(--run), color-mix(in oklab, var(--run) 55%, #a78bfa));
  }
  .reply-role { font-size: 12.5px; font-weight: 650; color: var(--fg-strong); letter-spacing: -.005em; }
  .reply-tag { font-size: 11px; color: var(--muted-2); font-weight: 600; letter-spacing: .03em; }
  .reply-head .reply-spacer { flex: 1 1 auto; }
  .reply-body {
    padding: 11px 14px; color: var(--fg); font-size: 13.5px; line-height: 1.62;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  /* clamp long responses; the toggle removes the clamp */
  .reply-body.clamp {
    display: -webkit-box; -webkit-line-clamp: 10; line-clamp: 10; -webkit-box-orient: vertical;
    overflow: hidden; position: relative;
  }
  .reply-body.clamp::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 38px;
    background: linear-gradient(180deg, transparent, var(--panel));
  }
  .reply-more {
    display: inline-flex; align-items: center; gap: 5px; margin: 0 14px 11px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-pill);
    color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 3px 11px;
  }
  .reply-more:hover { color: var(--fg); border-color: var(--muted-2); }
  .reply-empty { padding: 9px 14px; color: var(--muted-2); font-size: 12.5px; font-style: italic; }

  /* ---- Data detail chips (model / token usage) + collapsible raw bag ---- */
  .datachips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
  .dchip {
    display: inline-flex; align-items: center; gap: 5px; line-height: 1;
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: var(--r-pill);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    white-space: nowrap;
  }
  .dchip .dk { color: var(--muted-2); font-weight: 600; }
  .dchip .dv { color: var(--fg); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dchip.model { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .dchip.model .dv { color: var(--accent); }
  .dchip.tok-total .dv { color: var(--fg-strong); }
  /* collapsible "详情" for the non-whitelisted keys */
  .datamore { margin-top: 7px; }
  .datamore > summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-pill); padding: 3px 11px;
  }
  .datamore > summary::-webkit-details-marker { display: none; }
  .datamore > summary:hover { color: var(--fg); border-color: var(--muted-2); }
  .datamore[open] > summary { border-color: var(--muted-2); color: var(--fg); }
  .datamore .dm-chevron { transition: transform .18s ease; display: inline-grid; place-items: center; }
  .datamore[open] .dm-chevron { transform: rotate(90deg); }
  .datatable {
    margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px;
    padding: 10px 12px; background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--r-sm);
    font-size: 12px; max-height: 240px; overflow: auto;
  }
  .datatable .dt-k { color: var(--muted-2); font-family: var(--mono); word-break: break-word; }
  .datatable .dt-v { color: var(--fg); font-family: var(--mono); word-break: break-word; white-space: pre-wrap; }

  /* HumanInputRequest highlight */
  .needs-attn {
    margin-top: 7px; padding: 12px 14px; border-radius: var(--r);
    background: var(--warn-soft); border: 1px solid color-mix(in oklab, var(--warn) 40%, transparent);
    display: flex; gap: 11px; align-items: flex-start;
  }
  .needs-attn svg { color: var(--warn); flex: 0 0 auto; margin-top: 1px; }
  .needs-attn .na-l { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--warn); }
  .needs-attn .na-m { color: var(--fg); font-size: 13.5px; margin-top: 2px; }
  .needs-attn .na-ro { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; }

  /* ToolCall block */
  .toolcall { margin-top: 8px; border: 1px solid var(--border); border-radius: var(--r); background: var(--panel); overflow: hidden; max-width: 100%; }
  .tc-head {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 10px 12px; background: var(--panel); border: 0; color: inherit;
  }
  .tc-head:hover { background: var(--panel-2); }
  .tc-chevron { color: var(--muted); transition: transform .18s ease; flex: 0 0 auto; }
  .toolcall[data-open="true"] .tc-chevron { transform: rotate(90deg); }
  .tc-name { font-family: var(--mono); font-size: 13px; color: var(--fg-strong); font-weight: 600; }
  .tc-callid { font-family: var(--mono); font-size: 11px; color: var(--muted-2); }
  .tc-status { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
  .tc-status.ok { color: var(--ok); }
  .tc-status.bad { color: var(--err); }
  .tc-body { display: grid; gap: 12px; padding: 0 12px 12px; }
  .toolcall[data-open="false"] .tc-body { display: none; }
  .tc-field { }
  .tc-field-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .tc-field-label { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-2); font-weight: 600; }
  .copybtn {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px 8px;
  }
  .copybtn:hover { color: var(--fg); border-color: var(--muted-2); }
  .copybtn.done { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, transparent); }
  pre.json {
    margin: 0; padding: 11px 12px; max-height: 220px; overflow: auto;
    background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--r-sm);
    font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--fg);
    white-space: pre; tab-size: 2;
  }

  <!-- ===================== App root ===================== -->
  <div id="app" aria-busy="false"></div>


<script>
/* ===========================================================================
   Data + auth layer (production wiring).
   Browser OIDC Authorization Code + PKCE against nyxid (reuse of the console-web
   client; no server-side cookie/session, no NyxID change). All data flows through
   scope-gated bearer APIs; the page itself is the anonymous static shell.
   A small client cache backs the synchronous render contract (DataSource.*):
     listRuns(status) <- GET /api/workflow/observatory/runs
     getRun(runId)    <- GET /api/workflow/observatory/runs/{runId}; admin drilldown uses /admin/runs/{runId}
     getGraph(runId)  <- GET /api/workflow/observatory/runs/{runId}/graph; admin drilldown uses /admin/runs/{runId}/graph
   Read-only: there are no edit/run/stop calls anywhere.
   =========================================================================== */
const BACKEND_CONSOLE_CONFIG = __BACKEND_CONSOLE_CONFIG__;
const CFG = {
  authority: BACKEND_CONSOLE_CONFIG.authority || "",
  // nyxid REST API (different origin than this app; CORS-enabled, allows the Authorization header).
  // Used admin-only to resolve a run's scopeId (≈ nyxid user id) to that user's display name.
  nyxidApi: BACKEND_CONSOLE_CONFIG.nyxidApi || "",
  clientId: BACKEND_CONSOLE_CONFIG.clientId || "",
  scope: BACKEND_CONSOLE_CONFIG.scope || "",
  resources: Array.isArray(BACKEND_CONSOLE_CONFIG.resources) ? BACKEND_CONSOLE_CONFIG.resources : [],
  redirectUri: location.origin + "/auto/callback",
  storageKey: BACKEND_CONSOLE_CONFIG.storageKey || "",
  pollMs: 3000
};
const TOKEN_KEY = CFG.storageKey + ":token";
const PKCE_KEY  = CFG.storageKey + ":pkce";
const OBSERVATORY_VIEW_KEY = CFG.storageKey + ":observatory:view";
const OBSERVATORY_IMMERSIVE_KEY = CFG.storageKey + ":observatory:immersive";

function b64url(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function sha256(text){ return b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text))); }
function randomString(len){ const a=new Uint8Array(len); crypto.getRandomValues(a); return b64url(a.buffer).slice(0, len); }

function getToken(){ const raw=localStorage.getItem(TOKEN_KEY); if(!raw) return null; try { return JSON.parse(raw); } catch(e){ console.warn("observatory: token parse failed", e); } return null; }
function setToken(t){ localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }
function isEmbeddedInAdmin(){ try { return window.parent && window.parent !== window && window.frameElement && window.frameElement.getAttribute("data-console-frame") === "1"; } catch(e){ return false; } }
function notifyAdminShellAuth(type, reason){
  if(!isEmbeddedInAdmin()) return false;
  window.parent.postMessage({ source:"aevatar-backend-console-suite", type, reason: reason || "" }, location.origin);
  return true;
}
function navigateAdminShell(module, query){
  const message={source:"aevatar-backend-console-suite",type:"navigate",module,query:query||{}};
  if(isEmbeddedInAdmin()){ window.parent.postMessage(message,location.origin); return; }
  const p=new URLSearchParams(); Object.entries(query||{}).forEach(([key,value])=>{if(value)p.set(key,value);});
  location.assign("/admin#/"+module+(p.toString()?"?"+p:""));
}

async function beginLogin(){
  if(notifyAdminShellAuth("login-request")) return;
  const verifier = randomString(64);
  const st = randomString(32);
  const challenge = await sha256(verifier);
  sessionStorage.setItem(PKCE_KEY, JSON.stringify({ verifier, state: st, returnTo: location.pathname + location.search }));
  const u = new URL(CFG.authority + "/oauth/authorize");
  u.searchParams.set("response_type", "code");
  u.searchParams.set("client_id", CFG.clientId);
  u.searchParams.set("redirect_uri", CFG.redirectUri);
  u.searchParams.set("scope", CFG.scope);
  CFG.resources.forEach(resource => u.searchParams.append("resource", resource));
  u.searchParams.set("state", st);
  u.searchParams.set("code_challenge", challenge);
  u.searchParams.set("code_challenge_method", "S256");
  location.assign(u.toString());
}

async function completeLoginIfCallback(){
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  if(!code) return false;
  const returnedState = params.get("state");
  const pending = JSON.parse(sessionStorage.getItem(PKCE_KEY) || "null");
  history.replaceState({}, "", (pending && pending.returnTo) || "/workflow/observatory");
  if(!pending || pending.state !== returnedState){ console.warn("observatory: login state mismatch"); return false; }
  const form = new URLSearchParams();
  form.set("grant_type", "authorization_code");
  form.set("code", code);
  form.set("redirect_uri", CFG.redirectUri);
  form.set("client_id", CFG.clientId);
  form.set("code_verifier", pending.verifier);
  CFG.resources.forEach(resource => form.append("resource", resource));
  const res = await fetch(CFG.authority + "/oauth/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body: form.toString() });
  sessionStorage.removeItem(PKCE_KEY);
  if(!res.ok){ console.warn("observatory: token exchange failed", res.status); return false; }
  const token = await res.json();
  token.obtained_at = Date.now();
  setToken(token);
  return true;
}

async function fetchUserInfo(){
  const token = getToken(); if(!token) return null;
  try { const res = await fetch(CFG.authority + "/oauth/userinfo", { headers:{ Authorization:"Bearer " + token.access_token } }); return res.ok ? await res.json() : null; }
  catch(e){ console.warn("observatory: userinfo fetch failed", e); }
  return null;
}
function toAccount(info){ return info ? { label: info.email || info.preferred_username || info.sub || "已登录" } : null; }

async function apiRequest(path, options){
  const token = getToken(); if(!token) throw new Error("not-authenticated");
  options = options || {};
  const headers = Object.assign({}, options.headers || {}, { Authorization:"Bearer " + token.access_token });
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if(res.status === 401){ signOutSilent(); throw new Error("unauthorized"); }
  if(res.status === 404) return null;
  if(!res.ok){
    let reason = "api-error-" + res.status;
    try { const body = await res.json(); reason = body.message || body.error || body.code || reason; } catch(e){}
    throw new Error(reason);
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function api(path){ return apiRequest(path); }

/* client cache backing the synchronous render contract */
const cache = { account:null, runs:[], details:{}, graphs:{} };
const DataSource = {
  now: () => new Date().toISOString(),
  getAccount: () => cache.account || { label:"已登录" },
  // Filtering (status/origin/time) is pushed to the server query via listQueryParams; the cache already
  // holds the filtered set, so the list reads it as-is (no second client-side status pass).
  listRuns: () => cache.runs.slice(),
  getRun: (runId) => cache.details[runId] || null,
  getGraph: (runId) => cache.graphs[runId] || null
};

/* 06-20-observatory-admin-cross-scope: cross-scope admin view state (drives the admin bar + API scope params). */
const ALL_SCOPES = "__all__";
const adminState = { isAdmin:false, role:"", email:"", ownScope:"", currentScope:null, inputDraft:"", runIdDraft:"", candidates:null, message:"" };
function runScopeParam(runId){
  if(!adminState.isAdmin) return "";
  const run = cache.runs.find(r => r.runId === runId);
  const scope = run ? run.scopeId : ((adminState.currentScope && adminState.currentScope !== ALL_SCOPES) ? adminState.currentScope : "");
  return (scope && scope !== adminState.ownScope) ? "?scope=" + encodeURIComponent(scope) : "";
}
function runDetailRequestPath(runId, admin, runs, graph){
  const run=(runs||[]).find(item=>item.runId===runId);
  const suffix=graph?"/graph":"";
  if(admin.isAdmin&&(admin.currentScope==="__all__"||(!admin.currentScope&&!run))) return "/api/workflow/observatory/admin/runs/"+encodeURIComponent(runId)+suffix;
  const scope=run?run.scopeId:((admin.currentScope&&admin.currentScope!=="__all__")?admin.currentScope:"");
  const query=(scope&&scope!==admin.ownScope)?"?scope="+encodeURIComponent(scope):"";
  return "/api/workflow/observatory/runs/"+encodeURIComponent(runId)+suffix+query;
}
function runGraphRequestPath(runId, admin, runs){ return runDetailRequestPath(runId,admin,runs,true); }

/* ---------------------------------------------------------------------------
   nyxid user directory (admin-only): resolve a run's scopeId (≈ nyxid user id)
   to that user's display name. The directory endpoint is admin-gated, so we only
   ever fetch it when /me reported isAdmin; non-admins see no names (just their own
   scope). Searching by a UUID does NOT match server-side, so we page through the
   full user list once and build an id -> display_name map, cached for the session
   (refreshable on re-init). Plain fetch — different origin than this app, so the
   same-origin api() helper (and its bearer/redirect handling) doesn't apply. */
const nyxidDirectory = { byId: new Map(), loaded: false, loading: false };
async function loadNyxidDirectory(force){
  if(!adminState.isAdmin) return;
  if(nyxidDirectory.loading) return;
  if(nyxidDirectory.loaded && !force) return;
  const token = getToken(); if(!token) return;
  nyxidDirectory.loading = true;
  try {
    const map = new Map();
    const perPage = 50;
    // cap the page walk so a directory-size change can't loop unbounded; ~123 users today.
    for(let page = 1; page <= 50; page++){
      const url = CFG.nyxidApi + "/api/v1/admin/users?search=&per_page=" + perPage + "&page=" + page;
      const res = await fetch(url, { headers:{ Authorization:"Bearer " + token.access_token } });
      if(!res.ok) break; // 401/403 (not admin / token expired) or transient — keep whatever we have
      const body = await res.json();
      const users = (body && body.users) || [];
      for(const u of users){ if(u && u.id) map.set(String(u.id), u.display_name || ""); }
      const total = body && typeof body.total === "number" ? body.total : null;
      if(users.length < perPage) break;                 // last (short) page
      if(total != null && page * perPage >= total) break; // reached the reported total
    }
    nyxidDirectory.byId = map;
    nyxidDirectory.loaded = true;
  } catch(e){ console.warn("observatory: nyxid directory fetch failed", e); }
  finally { nyxidDirectory.loading = false; }
}
/* display name for a scopeId, or "" when admin gating is off / id unknown / name blank.
   Never fabricates — falls back to "" so callers keep showing the short id. */
function scopeDisplayName(scopeId){
  if(!adminState.isAdmin || !scopeId) return "";
  const name = nyxidDirectory.byId.get(String(scopeId));
  return name || "";
}

const STATUS_OPTIONS = [

  ["failed","失败"], ["timed_out","已超时"], ["stopped","已停止"]

const STATUS_VALUES = new Set(STATUS_OPTIONS.map(o => o[0]));

function readObservatoryRoute(search, hash){
  const query = new URLSearchParams(String(search || "").replace(/^\?/, ""));

  const statusValues = new Set(["running","completed","failed","timed_out","stopped"]);

  const tab = (query.get("tab") || "").trim();
  return {
    scope: (query.get("scope") || (legacyScope ? decodeURIComponent(legacyScope[1]) : "mine")).trim() || "mine",
    status: statusValues.has(status) ? status : "",
    origin: (query.get("origin") || "").trim(),
    definition: (query.get("definition") || "").trim(),
    schedule: (query.get("schedule") || "").trim(),
    from: (query.get("from") || "").trim(),
    to: (query.get("to") || "").trim(),

function writeObservatoryRoute(patch){
  const previous=readObservatoryRoute(location.search,location.hash);
  const route = Object.assign(readObservatoryRoute(location.search, location.hash), patch || {});
  if(previous.tab!==route.tab) pendingDetailScrollReset=true;
  const query = new URLSearchParams();
  ["scope","status","origin","definition","schedule","from","to","run","tab"].forEach(key => {
    const value = route[key];
    if(value && !(key === "scope" && value === "mine") && !(key === "tab" && value === "timeline")) query.set(key, value);
  });
  history.replaceState(null, "", location.pathname + (query.toString() ? "?" + query : ""));
  if(isEmbeddedInAdmin()) window.parent.postMessage({source:"aevatar-backend-console-suite",type:"observatory-route",query:route},location.origin);
  return route;
}
function observatoryRouteKey(route){
  const r=route||{};
  return ["scope","status","origin","definition","schedule","from","to","run","tab"]
    .map(key=>key+"="+encodeURIComponent(r[key]||"")).join("&");
}
function readObservatoryViewState(storage,key,route){
  try {
    const all=JSON.parse(storage.getItem(key)||"{}");
    const value=all[observatoryRouteKey(route)]||{};
    return {list:Math.max(0,Number(value.list)||0),detail:Math.max(0,Number(value.detail)||0)};
  } catch(e){ return {list:0,detail:0}; }
}
function writeObservatoryViewState(storage,key,route,position){
  try {
    let all={};
    try { all=JSON.parse(storage.getItem(key)||"{}")||{}; } catch(e){}
    const keys=Object.keys(all);
    if(keys.length>40) keys.slice(0,keys.length-40).forEach(existing=>delete all[existing]);
    all[observatoryRouteKey(route)]={list:Math.max(0,Number(position&&position.list)||0),detail:Math.max(0,Number(position&&position.detail)||0)};
    storage.setItem(key,JSON.stringify(all));

}

/* list filters seeded from the URL query so a shared/bookmarked link reopens the same view; only
   canonical status/origin values are accepted (anything else falls back to "all") so the select and
   the outgoing query never disagree. */
const filterState = (function(){
  const pick = (value, allowed) => allowed.has(value) ? value : "";
  const timestamp = value => value && !isNaN(Date.parse(value)) ? value : "";
  // panel open/closed survives re-renders (and bookmarks via ?filters=1); collapsed by default.
  const open = new URLSearchParams(location.search).get("filters") === "1";
  // schedule is a deep-link-only filter (opaque scheduleId, no <select>); empty = not filtered.
  return { status: pick(initialRoute.status, STATUS_VALUES), origin: initialRoute.origin, definition: initialRoute.definition, schedule: initialRoute.schedule, from: timestamp(initialRoute.from), to: timestamp(initialRoute.to), open };
})();

   normalized before reaching this function. */
function listQueryParams(){
  const p = new URLSearchParams();
  if(adminState.isAdmin && adminState.currentScope) p.set("scope", adminState.currentScope);
  if(filterState.status) p.set("status", filterState.status);

  if(filterState.schedule) p.set("schedule", filterState.schedule);
  if(filterState.from) p.set("from", filterState.from);
  if(filterState.to) p.set("to", filterState.to);
  const s = p.toString();

}
function hasActiveFilters(){ return !!(filterState.status || filterState.origin || filterState.definition || filterState.schedule || filterState.from || filterState.to); }

function activeFilterCount(){ return (filterState.status?1:0) + (filterState.origin?1:0) + (filterState.definition?1:0) + (filterState.schedule?1:0) + (filterState.from?1:0) + (filterState.to?1:0); }
/* persist the filter-panel open state into the URL (best-effort) so it survives reload/bookmarks
   without disturbing the existing scope hash or other query params. */
function persistFilterOpen(){

/* The API graph carries only nodes/edges; per-node status is reconstructed from the
   committed timeline (never invented) so the DAG can show real progress honestly. */
function deriveNodeStatus(graph, detail){
  const status = {};
  if(!graph || !graph.nodes) return status;
  const events = (detail && detail.timeline) || [];
  const started=new Set(), finished=new Set(), failedStep=new Set(), stoppedStep=new Set();
  for(const e of events){
    if(!e.stepId) continue;
    if(e.kind === "StepStarted" || e.kind === "HumanInputRequest") started.add(e.stepId);
    else if(e.kind === "StepFinished") finished.add(e.stepId);
    else if(e.kind === "RunError") failedStep.add(e.stepId);
    else if(e.kind === "RunStopped") stoppedStep.add(e.stepId);
  }
  const runStatus = (detail && detail.summary && detail.summary.status) || "";
  const running = runStatus === "running";
  const runFailed = runStatus === "failed" || runStatus === "timed_out";
  const runStopped = runStatus === "stopped";
  // run / actor topology nodes carry no stepId — they reflect the overall run state.
  const topologyStatus = running ? "current"
    : runStatus === "completed" ? "done"
    : runFailed ? "failed"
    : runStopped ? "stopped" : "pending";
  for(const nd of graph.nodes){
    // Graph node ids are composite (step:{actor}:{cmd}:{stepId}); match WorkflowStep nodes by the bare
    // stepId the API now surfaces — NOT the node id, which never equals the timeline's bare stepId.
    const sid = nd.stepId;
    if(!sid){ status[nd.nodeId] = topologyStatus; continue; }
    if(failedStep.has(sid)) status[nd.nodeId] = "failed";
    else if(stoppedStep.has(sid)) status[nd.nodeId] = "stopped";
    else if(finished.has(sid)) status[nd.nodeId] = "done";
    else if(started.has(sid)) status[nd.nodeId] = running ? "current" : (runFailed ? "failed" : runStopped ? "stopped" : "done");
    else status[nd.nodeId] = "pending";
  }
  return status;
}

/* 06-23 detail enrichment: the AGUI event data bag (ev.data) is an open string->string map. We surface
   a tasteful whitelist of the high-value keys as chips (model + token usage) and tuck everything else
   under a collapsible 详情, instead of dumping the raw bag. Keys are matched case-insensitively across a
   few common spellings so we don't miss model/token fields named slightly differently upstream. */
const DATA_MODEL_KEYS = ["model", "model_id", "modelId", "model_name", "modelName", "deployment", "provider"];
const DATA_TOKEN_KEYS = [
  ["prompt", ["prompt_tokens","promptTokens","input_tokens","inputTokens","prompt"]],
  ["completion", ["completion_tokens","completionTokens","output_tokens","outputTokens","completion"]],
  ["total", ["total_tokens","totalTokens","total"]]

function dataLookup(data, keys){
  if(!data) return "";
  for(const k of keys){ const v = data[k]; if(v != null && String(v).trim() !== "") return String(v); }
  // case-insensitive fallback so upstream spelling variants still match
  const lower = {}; for(const dk in data) lower[dk.toLowerCase()] = data[dk];
  for(const k of keys){ const v = lower[k.toLowerCase()]; if(v != null && String(v).trim() !== "") return String(v); }
  return "";
}

function parseT(iso){ return Date.parse(iso); }
function clockUTC(iso){ // 取 ISO 中的 HH:MM:SS（UTC），保持确定性
  const m = /T(\d{2}:\d{2}:\d{2})/.exec(iso); return m ? m[1] : iso;
}
function relTime(iso, nowMs){
  let d = Math.max(0, Math.round((nowMs - parseT(iso))/1000));
  if (d <= 1)   return "刚刚";
  if (d < 60)   return d + " 秒前";
  if (d < 3600) return Math.floor(d/60) + " 分钟前";
  if (d < 86400)return Math.floor(d/3600) + " 小时前";
  return Math.floor(d/86400) + " 天前";
}
function fmtDur(ms){
  let s = Math.max(0, Math.round(ms/1000));

}

function midTrunc(s, max){ s = String(s==null?"":s); if(s.length <= max) return s; const h = Math.ceil((max-1)*0.62), t = (max-1) - h; return s.slice(0, h) + "…" + s.slice(s.length - t); }

/* JSON 着色（仅用于显示）。注意：先 esc() 转义，引号已变成 &quot;，
   因此高亮要匹配 &quot; 而非字面引号。本数据中字符串均为单行且不含 & 实体。 */
function colorJSON(str){
  if(!str) return "";
  let s = esc(str);
  // 字符串 / 键（键后跟冒号）
  s = s.replace(/(&quot;.*?&quot;)(\s*:)?/g, (m, tok, colon) =>
    colon ? `<span class="j-key">${tok}</span>${colon}` : `<span class="j-str">${tok}</span>`);
  // 数字（前面是空白/冒号/括号/逗号，后面是分隔符或行尾）
  s = s.replace(/(^|[\s:\[,])(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)(?=[\s,\]\}]|$)/g,
    (m, pre, num) => `${pre}<span class="j-num">${num}</span>`);
  // 布尔 / null
  s = s.replace(/\b(true|false)\b/g, '<span class="j-bool">$1</span>');
  s = s.replace(/\bnull\b/g, '<span class="j-null">null</span>');
  return s;
}

function kindIcon(kind){

function nowMs(){ return Date.now(); }

/* apply theme attr */
function applyTheme(){
  if(state.theme === "light" || state.theme === "dark") document.documentElement.setAttribute("data-theme", state.theme);
  else document.documentElement.removeAttribute("data-theme");
}
function effectiveDark(){
  if(state.theme) return state.theme === "dark";
  return !window.matchMedia || !window.matchMedia("(prefers-color-scheme: light)").matches;
}
function setImmersive(enabled){
  state.immersive=!!enabled;

  if(isEmbeddedInAdmin()) window.parent.postMessage({source:"aevatar-backend-console-suite",type:"observatory-immersive",enabled:state.immersive},location.origin);

function toggleImmersive(){ setImmersive(!state.immersive); render(); }
async function refreshObservatory(){
  if(state.refreshing) return;
  state.refreshing=true;
  try {
    await refreshRuns();
    lastRunsSig=runsSig(cache.runs);
    if(state.selectedRunId){ await refreshDetail(state.selectedRunId); lastDetailSig=detailSig(cache.details[state.selectedRunId]); }

}

function renderSelect(id, label, options, value, onPick){
  const field = el("div", { class:"fb-field" });
  field.appendChild(el("label", { class:"fb-label", for: id }, label));
  const sel = el("select", { class:"fb-select", id, "aria-label": label });
  options.forEach(([v,l]) => {
    const opt = el("option", { value: v }, l);
    if(v === value) opt.setAttribute("selected", "selected");
    sel.appendChild(opt);
  });
  sel.value = value;
  sel.addEventListener("change", e => onPick(e.target.value));
  field.appendChild(sel);
  return field;
}
function renderDate(id, label, value, onPick){
  const field = el("div", { class:"fb-field" });
  field.appendChild(el("label", { class:"fb-label", for: id }, label));
  const inp = el("input", { class:"fb-date", id, type:"date", "aria-label": label, value: value ? value.slice(0,10) : "" });
  inp.addEventListener("change", e => onPick(e.target.value));
  field.appendChild(inp);
  return field;
}
function renderFilterBar(){
  const wrap = el("div", { class:"filterwrap" });
  const count = activeFilterCount();

  // --- collapsible toggle header (always visible) ---
  const toggle = el("button", {
    class:"fb-toggle", id:"fbToggle", type:"button",
    "aria-expanded": String(filterState.open), "aria-controls":"filterPanel"
  });
  toggle.innerHTML = `
    <span class="fb-tchevron" aria-hidden="true">${ICON.chevron}</span>
    <span class="fb-ticon" aria-hidden="true">${ICON.filter}</span>
    <span class="fb-tlabel">筛选</span>
    <span class="fb-tcount" id="fbToggleCount" title="${count} 个生效筛选" ${(filterState.open || !hasActiveFilters()) ? "hidden" : ""}>${count}</span>
    <span class="fb-tspacer"></span>`;
  toggle.addEventListener("click", toggleFilterPanel);
  // a quick "清除" affordance on the header itself when collapsed + filters active
  if(hasActiveFilters()){
    const clr = el("button", { class:"fb-tclear", type:"button", "aria-label":"清除全部筛选" }, "清除");
    clr.addEventListener("click", (e) => {
      e.stopPropagation();
      filterState.status=""; filterState.origin=""; filterState.definition=""; filterState.schedule=""; filterState.from=""; filterState.to="";
      applyFilterChange();
    });
    toggle.appendChild(clr);
  }
  wrap.appendChild(toggle);

  // active schedule deep-link filter — dismissible chip (the scheduleId has no <select>; it arrives
  // via the /schedules deep-link), so it gets its own always-visible affordance below the toggle.
  if(filterState.schedule){
    const chip = el("div", { class:"sched-filter", title:"仅显示该定时任务触发的运行" });
    chip.innerHTML = `<span class="sf-ic" aria-hidden="true">${ICON.filter}</span><span class="sf-lab">定时任务</span><span class="sf-id">${esc(filterState.schedule)}</span>`;
    const x = el("button", { class:"sf-x", type:"button", "aria-label":"清除定时任务筛选" }, ICON.x);
    x.addEventListener("click", () => { filterState.schedule=""; applyFilterChange(); });
    chip.appendChild(x);
    wrap.appendChild(chip);
  }

  // --- the controls panel (hidden when collapsed) ---
  const bar = el("div", { class:"filterbar", id:"filterPanel", role:"group", "aria-label":"按状态、来源、更新时间筛选运行" });
  if(!filterState.open) bar.hidden = true;
  bar.appendChild(renderSelect("flt-status", "状态", STATUS_OPTIONS, filterState.status,
    v => { filterState.status = v; applyFilterChange(); }));
  bar.appendChild(renderSelect("flt-origin", "来源", ORIGIN_OPTIONS, filterState.origin,
    v => { filterState.origin = v; applyFilterChange(); }));
  const definition = el("div", { class:"fb-field" });
  definition.appendChild(el("label", { class:"fb-label", for:"flt-definition" }, "定义"));
  const definitionInput = el("input", { class:"fb-date", id:"flt-definition", type:"search", "aria-label":"工作流定义", value:filterState.definition, placeholder:"definition id" });
  definitionInput.addEventListener("change", e => { filterState.definition = e.target.value.trim(); applyFilterChange(); });
  definition.appendChild(definitionInput); bar.appendChild(definition);
  bar.appendChild(renderDate("flt-from", "起始（更新于）", filterState.from,
    v => { filterState.from = v ? new Date(v + "T00:00:00Z").toISOString() : ""; applyFilterChange(); }));
  bar.appendChild(renderDate("flt-to", "截止（更新于）", filterState.to,
    v => { filterState.to = v ? new Date(v + "T23:59:59.999Z").toISOString() : ""; applyFilterChange(); }));
  bar.appendChild(el("div", { class:"fb-spacer" }));
  if(hasActiveFilters()){
    const reset = el("button", { class:"fb-reset", type:"button" }, "清除筛选");
    reset.addEventListener("click", () => { filterState.status=""; filterState.origin=""; filterState.definition=""; filterState.schedule=""; filterState.from=""; filterState.to=""; applyFilterChange(); });
    bar.appendChild(reset);
  }
  wrap.appendChild(bar);
  return wrap;
}

function renderList(){
  const pane = el("aside", { class:"list-pane", "aria-label":"运行列表" });

  const shown = state.scenario==="empty" ? 0 : DataSource.listRuns().length;
  head.innerHTML = `<div class="list-title-row"><span class="list-title"><span class="lt-ic" aria-hidden="true">${ICON.list}</span>运行</span><span class="list-count" title="当前筛选下返回的运行数（最近 N）">${shown}</span></div>`;
  pane.appendChild(head);
  pane.appendChild(renderFilterBar());

  const listbox = el("div", { class:"runlist scroll", role:"list", "aria-label":"运行", tabindex:"-1" });

  if(state.scenario === "listLoading"){
    for(let i=0;i<5;i++){
      const r = el("div", { class:"sk-row" });
      r.innerHTML = `<div class="sk sk-dot"></div><div><div class="sk sk-line" style="width:62%"></div><div class="sk sk-line" style="width:42%;margin-top:8px;height:8px"></div></div>`;
      listbox.appendChild(r);
    }
    pane.appendChild(listbox);
    return pane;
  }

  const runs = state.scenario === "empty" ? [] : DataSource.listRuns();

  if(runs.length === 0){
    const isFiltered = state.scenario !== "empty" && hasActiveFilters();
    listbox.appendChild(el("div", { class:"empty" }, `
      <div class="ic" aria-hidden="true">${ICON.inbox}</div>
      <div class="et">${isFiltered ? "没有匹配的运行" : "暂无运行"}</div>
      <div class="es">${isFiltered ? "当前筛选条件下没有运行，放宽状态、来源或时间范围再看看。" : "你的账户下还没有任何工作流运行。一旦有运行启动，就会出现在这里。"}</div>`));
    pane.appendChild(listbox);
    return pane;
  }

  runs.forEach(r => {
    const sel = state.selectedRunId === r.runId && state.scenario==="normal";
    const row = el("button", { class:"run-row", role:"listitem", "aria-current": String(sel) });
    // scope id per row is only meaningful in the cross-scope (全部 scope) view, where rows differ in
    // scope. When a single concrete scope is selected it's the same id on every row (already shown in
    // the admin bar) — pure noise — so it's hidden there.
    // In cross-scope (全部 scope) view rows differ by scope owner. For admins we resolve the scopeId
    // (≈ nyxid user id) to that user's display name and lead with it; the short id stays as the
    // secondary cue and the full id in the tooltip. Falls back to the short id when unresolved.
    const scopeName = scopeDisplayName(r.scopeId);
    const scopeCol = (adminState.isAdmin && adminState.currentScope === ALL_SCOPES)
      ? (scopeName
          ? `<span class="sep">·</span><span class="id" title="${esc(scopeName)} · scope id: ${esc(r.scopeId||"")}">${esc(scopeName)} <span class="muted-id">${esc(tailId(r.scopeId, 6))}</span></span>`
          : `<span class="sep">·</span><span class="id" title="scope id: ${esc(r.scopeId||"")}">${esc(tailId(r.scopeId, 14))}</span>`)
      : "";
    // run-origin badge: legacy/empty origin renders nothing (keeps the row readable at density).
    const olabel = originLabel(r.runOrigin);
    const originCol = olabel
      ? `<span class="sep">·</span><span class="rm-origin" title="运行来源：${esc(olabel)}">${esc(olabel)}</span>`
      : "";
    row.innerHTML = `
      <span class="dot s-${r.status}" aria-hidden="true"></span>
      <span class="rn" title="${esc(r.workflowName)}">${esc(r.workflowName)}</span>
      <span class="rm">
        <span class="rm-status s-${r.status}">${STATUS_LABEL[r.status]||r.status}</span>${originCol}
        <span class="sep">·</span>
        <span data-since="${r.updatedAtUtc}">${relTime(r.updatedAtUtc, nowMs())}</span>
        <span class="sep">·</span>
        <span class="id" title="run id: ${esc(r.runId)}">${esc(midTrunc(parseRunId(r.runId).run, 16) || tailId(r.runId, 12))}</span>${scopeCol}
      </span>`;
    row.addEventListener("click", () => selectRun(r.runId));
    listbox.appendChild(row);
  });
  pane.appendChild(listbox);
  return pane;
}
