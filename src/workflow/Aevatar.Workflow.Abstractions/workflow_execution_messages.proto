syntax = "proto3";
package aevatar.workflow;
option csharp_namespace = "Aevatar.Workflow.Abstractions";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "Credentials/credential_secret_references.proto";
import "Interactions/interaction_spec.proto";
import "workflow_capability_admission.proto";
import "workflow_external_action.proto";

enum WorkflowChatInputPartKind {
  WORKFLOW_CHAT_INPUT_PART_KIND_UNSPECIFIED = 0;
  WORKFLOW_CHAT_INPUT_PART_KIND_TEXT = 1;
  WORKFLOW_CHAT_INPUT_PART_KIND_IMAGE = 2;
  WORKFLOW_CHAT_INPUT_PART_KIND_AUDIO = 3;
  WORKFLOW_CHAT_INPUT_PART_KIND_VIDEO = 4;
  WORKFLOW_CHAT_INPUT_PART_KIND_FILE = 5;
}

enum WorkflowFileSourceKind {
  WORKFLOW_FILE_SOURCE_KIND_UNSPECIFIED = 0;
  WORKFLOW_FILE_SOURCE_KIND_CHAT_INPUT = 1;
  WORKFLOW_FILE_SOURCE_KIND_FORM_UPLOAD = 2;
  WORKFLOW_FILE_SOURCE_KIND_CONNECTED_SERVICE_RESOURCE = 3;
  WORKFLOW_FILE_SOURCE_KIND_EXTERNAL_RESOURCE = 4;
  WORKFLOW_FILE_SOURCE_KIND_GENERATED = 5;
}

enum WorkflowSagaStatus {
  WORKFLOW_SAGA_STATUS_UNSPECIFIED = 0;
  WORKFLOW_SAGA_STATUS_COMPENSATING = 1;
  WORKFLOW_SAGA_STATUS_COMPENSATED_FAILED = 2;
  WORKFLOW_SAGA_STATUS_COMPENSATION_DEAD_LETTER = 3;
}

enum WorkflowStepFailureOutcome {
  WORKFLOW_STEP_FAILURE_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_STEP_FAILURE_OUTCOME_CALLEE_CONFIRMED = 1;
  WORKFLOW_STEP_FAILURE_OUTCOME_OUTCOME_UNCERTAIN = 2;
}

enum WorkflowStepRetryDisposition {
  WORKFLOW_STEP_RETRY_DISPOSITION_UNSPECIFIED = 0;
  WORKFLOW_STEP_RETRY_DISPOSITION_ALLOWED = 1;
  WORKFLOW_STEP_RETRY_DISPOSITION_FORBIDDEN = 2;
}

enum WorkflowRunTerminalStatus {
  WORKFLOW_RUN_TERMINAL_STATUS_UNSPECIFIED = 0;
  WORKFLOW_RUN_TERMINAL_STATUS_COMPLETED = 1;
  WORKFLOW_RUN_TERMINAL_STATUS_FAILED = 2;
  WORKFLOW_RUN_TERMINAL_STATUS_STOPPED = 3;
}

enum WorkflowRunTerminalNotificationDeliveryStatus {
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_UNSPECIFIED = 0;
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_PREPARED = 1;
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_RETRY_SCHEDULED = 2;
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_DISPATCHED = 3;
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_EXPIRED = 4;
}

message WorkflowCompletionNotificationTarget {
  string actor_id = 1;
  string delivery_id = 2;
  int64 expires_at_unix_ms = 3;
}

message WorkflowRunTerminalNotification {
  string delivery_id = 1;
  string workflow_actor_id = 2;
  string workflow_run_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  WorkflowRunTerminalStatus status = 6;
  string output = 7;
  string error = 8;
  google.protobuf.Timestamp terminal_at = 9;
}

message WorkflowRunStartedNotification {
  string delivery_id = 1;
  string workflow_actor_id = 2;
  string workflow_run_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  google.protobuf.Timestamp started_at = 6;
}

message WorkflowRunToolApprovalNotification {
  string delivery_id = 1;
  string workflow_actor_id = 2;
  string workflow_run_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  string step_id = 6;
  string execution_id = 7;
  string tool_name = 8;
  string tool_call_id = 9;
  string approval_request_id = 10;
  string prompt = 11;
  google.protobuf.Timestamp requested_at = 12;
}

message WorkflowRunCompletionNotificationTargetAdoptedEvent {
  WorkflowCompletionNotificationTarget completion_notification_target = 1;
  string workflow_run_id = 2;
  string scope_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  google.protobuf.Timestamp adopted_at = 6;
}

message WorkflowRunTerminalNotificationPreparedEvent {
  WorkflowRunTerminalNotification notification = 1;
  int32 attempt = 2;
  google.protobuf.Timestamp prepared_at = 3;
}

message WorkflowRunTerminalNotificationDispatchedEvent {
  string delivery_id = 1;
  string workflow_command_id = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp dispatched_at = 4;
}

message WorkflowRunTerminalNotificationRetryScheduledEvent {
  string delivery_id = 1;
  string workflow_command_id = 2;
  int32 attempt = 3;
  string callback_id = 4;
  google.protobuf.Timestamp retry_at = 5;
}

message WorkflowRunTerminalNotificationRetryFiredEvent {
  string delivery_id = 1;
  string workflow_actor_id = 2;
  string workflow_command_id = 3;
  int32 attempt = 4;
}

message WorkflowRunTerminalNotificationExpiredEvent {
  string delivery_id = 1;
  string workflow_command_id = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp expired_at = 4;
}

message WorkflowFileRef {
  string file_id = 1;
  string artifact_id = 2;
  WorkflowFileSourceKind source_kind = 3;
  string source_message_id = 4;
  string source_resource_key = 5;
  string file_name = 6;
  string media_type = 7;
  int64 size_bytes = 8;
  string sha256 = 9;
  int64 created_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  string owner_run_id = 12;
  string owner_scope_id = 13;
}

message WorkflowChatInputPartPayload {
  WorkflowChatInputPartKind kind = 1;
  string text = 2;
  string data_base64 = 3;
  string media_type = 4;
  string uri = 5;
  string name = 6;
  WorkflowFileRef file_ref = 7;
}

message WorkflowLlmControlContext {
  string model_override = 1;
  optional int32 max_tool_rounds_override = 2;
  string user_memory_prompt = 3;
  string route_preference = 4;
  string sender_nyx_id_access_token = 5;
}

enum NyxIdCallerCredentialKind {
  NYX_ID_CALLER_CREDENTIAL_KIND_UNSPECIFIED = 0;
  NYX_ID_CALLER_CREDENTIAL_KIND_SOURCE_READABLE_USER_BEARER = 1;
  NYX_ID_CALLER_CREDENTIAL_KIND_PROXY_DELEGATION = 2;
  NYX_ID_CALLER_CREDENTIAL_KIND_AGENT_KEY = 3;
}

message WorkflowCallerCredential {
  string bearer_token = 1;
  aevatar.credentials.RuntimeSecretReference runtime_secret_reference = 2;
  aevatar.credentials.DurableCallerCredentialRef durable_caller_credential = 3;
  WorkflowCallerNyxIdAuthority nyx_id_authority = 4;
  NyxIdCallerCredentialKind kind = 5;
  string source_readable_user_bearer_token = 6;
  aevatar.credentials.RuntimeSecretReference source_readable_user_bearer_runtime_secret_reference = 7;
  WorkflowUnattendedEffectAuthorization unattended_effect_authorization = 8;
}

message WorkflowCallerNyxIdAuthority {
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
  string scope = 4;
  string binding_id = 5;
}

// Owner-granted authorization for unattended effects from one exact workflow
// revision. The authorization is created only by a trusted binding endpoint;
// external webhook payloads cannot supply or modify it.
message WorkflowUnattendedEffectAuthorization {
  string schema_version = 1;
  string definition_actor_id = 2;
  string scope_id = 3;
  string workflow_id = 4;
  string revision_id = 5;
  string admission_digest = 6;
  string grantor_subject = 7;
  string route_digest = 8;
  string caller_authority_digest = 9;
  repeated WorkflowUnattendedInvocationAuthorization invocations = 10;
  string authorization_digest = 11;
  int64 definition_version = 12;
}

message WorkflowUnattendedInvocationAuthorization {
  string call_site_id = 1;
  string capability_contract_digest = 2;
  string explicit_request_grant_digest = 3;
}

message WorkflowUnattendedInvocationPermit {
  string authorization_id = 1;
  string call_site_id = 2;
  string capability_contract_digest = 3;
  string explicit_request_grant_digest = 4;
}

message WorkflowExternalIngressContext {
  string route_key = 1;
  string source_id = 2;
  string delivery_id = 3;
  int64 received_at_unix_ms = 4;
  string content_type = 5;
  string payload_fingerprint = 6;
  string auth_scheme = 7;
  string principal_subject = 8;
}

message WorkflowWebhookReplayRecord {
  string route_key = 1;
  string source_id = 2;
  string delivery_id = 3;
  string payload_fingerprint = 4;
  int64 received_at_unix_ms = 5;
  string command_id = 6;
  string correlation_id = 7;
}

// Durable scope-owned webhook binding payload. HMAC fields contain ciphertext
// produced by the host binding-secret cipher; plaintext secrets never enter
// the Redis value.
message WorkflowWebhookBindingState {
  string route_key = 1;
  string scope_id = 2;
  string workflow_name = 3;
  string source_id = 4;
  string prompt_template = 5;
  string prompt_json_path = 6;
  string delivery_id_header = 7;
  string delivery_id_json_path = 8;
  string protected_hmac_secret = 9;
  string hmac_signature_header = 10;
  string hmac_timestamp_header = 11;
  int32 max_timestamp_skew_seconds = 12;
  int64 updated_at_unix_ms = 13;
  string definition_actor_id = 14;
  string target_revision_id = 15;
  string protected_previous_hmac_secret = 16;
  string time_zone_id = 17;
  // Deprecated unsafe workaround retained only so already-written records
  // cannot be reinterpreted as a different protobuf field. New code never
  // reads or writes a durable user bearer from a webhook binding.
  string protected_caller_bearer_token = 18 [deprecated = true];
  string protected_caller_authorization = 19;
  aevatar.credentials.DurableCallerCredentialRef caller_durable_credential = 20;
}

message WorkflowWebhookCallerAuthorizationState {
  WorkflowCallerNyxIdAuthority caller_authority = 1;
  WorkflowUnattendedEffectAuthorization unattended_effect_authorization = 2;
}

message WorkflowChatRequestEvent {
  reserved 9;
  reserved "connector_http_authorization";
  string prompt = 1;
  string session_id = 2;
  map<string, string> headers = 3;
  int32 timeout_ms = 4;
  string scope_id = 5;
  repeated WorkflowChatInputPartPayload input_parts = 6;
  map<string, string> metadata = 7;
  WorkflowLlmControlContext llm_control = 8;
  WorkflowCallerCredential caller_credential = 10;
  WorkflowRunForkSeed fork_seed = 11;
  WorkflowExternalIngressContext external_ingress = 12;
  WorkflowCompletionNotificationTarget completion_notification_target = 13;
  WorkflowConversationContext conversation_context = 14;
  string current_turn_id = 15;
}

enum WorkflowConversationRole {
  WORKFLOW_CONVERSATION_ROLE_UNSPECIFIED = 0;
  WORKFLOW_CONVERSATION_ROLE_USER = 1;
  WORKFLOW_CONVERSATION_ROLE_ASSISTANT = 2;
  WORKFLOW_CONVERSATION_ROLE_TOOL = 3;
}

message WorkflowConversationMessage {
  int32 sequence = 1;
  string turn_id = 2;
  WorkflowConversationRole role = 3;
  string content = 4;
}

message WorkflowConversationContext {
  string scope_id = 1;
  string conversation_id = 2;
  int64 state_version = 3;
  repeated WorkflowConversationMessage messages = 4;
  bool truncated = 5;
  int32 max_message_count = 6;
  string current_turn_id = 7;
}

message WorkflowRunForkSeed
{
  string source_run_id = 1;
  string start_at_step_id = 2;
  map<string, string> variables = 3;
  int32 attempt = 4;
  WorkflowStepIdempotencyState start_step_idempotency = 5;
  string original_run_id = 6;
  // Typed source snapshot for normalized runs. Legacy sources leave this absent
  // and continue to use variables.
  WorkflowNormalizedExecutionSeed normalized_values = 7;
  // Request-level overlay applied after the source snapshot. Keeping overrides
  // separate prevents a fork command from destroying canonical provenance.
  map<string, string> variable_overrides = 8;
}

// Author-owned release policy for large intermediate workflow values. The
// runtime resolves every name through its typed canonical binding; this is not
// an open parameter bag.
message WorkflowStepValueLifecycle
{
  repeated string release_variables_after_success = 1;
}

// Actor-authoritative replay evidence for a value whose raw UTF-8 payload no
// longer belongs in current state.
message WorkflowValueDigest
{
  bytes sha256 = 1;
  uint64 utf8_size = 2;
  bool redacted = 3;
}

message WorkflowReleasedValueTombstone
{
  WorkflowValueDigest digest = 1;
  string released_after_step_id = 2;
  string released_after_execution_id = 3;
  // Canonical value id that was released. A later step may re-bind the same
  // variable name to a new value (per-iteration release); the tombstone then
  // covers only this value id and the re-bound value stays readable and
  // releasable. Empty for tombstones written before value identity was
  // recorded; those names have no live binding by construction.
  string value_id = 4;
}

enum WorkflowValueLifecycleFailureKind
{
  WORKFLOW_VALUE_LIFECYCLE_FAILURE_KIND_UNSPECIFIED = 0;
  WORKFLOW_VALUE_LIFECYCLE_FAILURE_KIND_RELEASED_VALUE_ACCESSED = 1;
  WORKFLOW_VALUE_LIFECYCLE_FAILURE_KIND_RELEASE_TARGET_MISSING = 2;
  WORKFLOW_VALUE_LIFECYCLE_FAILURE_KIND_RELEASE_TARGET_LIVE = 3;
  WORKFLOW_VALUE_LIFECYCLE_FAILURE_KIND_RELEASE_TARGET_PINNED_FOR_COMPENSATION = 4;
  WORKFLOW_VALUE_LIFECYCLE_FAILURE_KIND_SCHEMA_UNAVAILABLE = 5;
}

message WorkflowCanonicalValueSeed
{
  string value_id = 1;
  string value = 2;
  string producer_step_id = 3;
  string producer_execution_id = 4;
  WorkflowCanonicalValueSourceKind source_kind = 5;
  WorkflowReleasedValueTombstone released = 6;
}

enum WorkflowValueBindingSeedKind
{
  WORKFLOW_VALUE_BINDING_SEED_KIND_UNSPECIFIED = 0;
  WORKFLOW_VALUE_BINDING_SEED_KIND_STEP_OUTPUT = 1;
  WORKFLOW_VALUE_BINDING_SEED_KIND_CURRENT_INPUT = 2;
  WORKFLOW_VALUE_BINDING_SEED_KIND_ASSIGNED_VALUE = 3;
  WORKFLOW_VALUE_BINDING_SEED_KIND_INTERNAL_OUTPUT = 4;
  WORKFLOW_VALUE_BINDING_SEED_KIND_REQUEST_OVERRIDE = 5;
}

message WorkflowValueBindingSeed
{
  string value_id = 1;
  WorkflowValueBindingSeedKind binding_kind = 2;
}

message WorkflowNormalizedUsageMetricsSeed
{
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  string model = 4;
  double cost = 5;
  int64 latency_ms = 6;
}

message WorkflowJsonValueBindingSeed
{
  string output_value_id = 1;
}

message WorkflowCompletedStepSeed
{
  string step_id = 1;
  string output_value_id = 2;
  bool success = 3;
  string error = 4;
  string branch_key = 5;
  string next_step_id = 6;
  string assigned_variable = 7;
  string assigned_value_id = 8;
  map<string, string> annotations = 9;
  WorkflowNormalizedUsageMetricsSeed usage = 10;
  bool has_usage = 11;
  map<string, WorkflowJsonValueBindingSeed> json_value_bindings = 12;
  bool emit_legacy_mirrors = 13;
  string execution_id = 14;
  WorkflowStepOutputProvenance output_provenance = 15;
  WorkflowStepAssignedValueProvenance assigned_value_provenance = 16;
  string output_source_step_id = 17;
  string output_source_execution_id = 18;
  string output_source_value_id = 19;
  string output_reference_id = 20;
  WorkflowStepFailureOutcome failure_outcome = 21;
  WorkflowStepRetryDisposition retry_disposition = 22;
  WorkflowStepCompletionOutcome outcome = 23;
  string assigned_mirror_value_id = 24;
  WorkflowValueDigest output_digest = 25;
  WorkflowValueDigest assigned_value_digest = 26;
  WorkflowValueDigest assigned_mirror_digest = 27;
}

message WorkflowPendingOutputReferenceSeed
{
  string reference_id = 1;
  string source_step_id = 2;
  string source_execution_id = 3;
  string source_value_id = 4;
  string target_step_id = 5;
  string target_execution_id = 6;
}

message WorkflowNormalizedExecutionSeed
{
  map<string, WorkflowCanonicalValueSeed> canonical_values = 1;
  map<string, WorkflowValueBindingSeed> bindings = 2;
  map<string, WorkflowCompletedStepSeed> completed_steps = 3;
  uint64 next_value_sequence = 4;
  string current_step_input_value_id = 5;
  map<string, string> variables = 6;
  map<string, WorkflowPendingOutputReferenceSeed> pending_output_references = 7;
  // Source-run physical completions retained only to validate historical
  // aliases/provenance in this immutable fork seed. Restore must never copy
  // these identities into the target run's live acceptance ledger.
  map<string, string> source_completion_value_ids = 8;
  map<string, WorkflowCompletedStepSeed> source_completions = 9;
  map<string, WorkflowReleasedValueTombstone> released_bindings = 10;
}

message WorkflowStepIdempotencyState
{
  string logical_run_id = 1;
  string step_id = 2;
  int32 logical_attempt = 3;
  string idempotency_key = 4;
}

enum WorkflowRunLineageAvailability
{
  WORKFLOW_RUN_LINEAGE_AVAILABILITY_UNSPECIFIED = 0;
  WORKFLOW_RUN_LINEAGE_AVAILABILITY_AVAILABLE = 1;
  WORKFLOW_RUN_LINEAGE_AVAILABILITY_UNAVAILABLE = 2;
  WORKFLOW_RUN_LINEAGE_AVAILABILITY_LEGACY_UNAVAILABLE = 3;
}

enum WorkflowRunLineageRelationKind
{
  WORKFLOW_RUN_LINEAGE_RELATION_KIND_UNSPECIFIED = 0;
  WORKFLOW_RUN_LINEAGE_RELATION_KIND_RETRY_FORK = 1;
  WORKFLOW_RUN_LINEAGE_RELATION_KIND_SUB_WORKFLOW = 2;
}

message WorkflowRunLineageRunRef
{
  string run_id = 1;
  string actor_id = 2;
  string relationship_id = 3;
  string step_id = 4;
  int32 attempt = 5;
  WorkflowRunLineageRelationKind relation_kind = 6;
}

message WorkflowRunRetryForkLineage
{
  WorkflowRunLineageAvailability availability = 1;
  string source_run_id = 2;
  string original_run_id = 3;
  int32 attempt = 4;
  string start_at_step_id = 5;
  repeated WorkflowRunLineageRunRef child_runs = 6;
}

message WorkflowRunSubWorkflowLineage
{
  WorkflowRunLineageAvailability availability = 1;
  string parent_run_id = 2;
  string parent_actor_id = 3;
  string parent_step_id = 4;
  string root_run_id = 5;
  int32 depth = 6;
  repeated WorkflowRunLineageRunRef child_runs = 7;
}

message WorkflowRunLineage
{
  WorkflowRunLineageAvailability availability = 1;
  WorkflowRunRetryForkLineage retry_fork = 2;
  WorkflowRunSubWorkflowLineage sub_workflow = 3;
  string unavailable_reason = 4;
}

message WorkflowRunForkRequestedEvent
{
  string source_run_id = 1;
  string start_at_step_id = 2;
  int32 attempt = 3;
  string scope_id = 4;
}

message WorkflowRunLineageRecordedEvent
{
  string source_run_id = 1;
  string child_run_id = 2;
  string child_actor_id = 3;
  string start_at_step_id = 4;
  int32 attempt = 5;
  WorkflowRunLineageRelationKind relation_kind = 6;
  string original_run_id = 7;
}

message StartWorkflowEvent
{
  string workflow_name = 1;
  string input = 2;
  map<string, string> parameters = 3;
  string run_id = 4;
  WorkflowRunForkSeed fork_seed = 5;
  WorkflowToolRuntimeContextPayload workflow_runtime = 6;
  repeated WorkflowFileRef input_file_refs = 7;
  // Monotonic bind generation for a deliberately reusable run actor. Legacy and
  // single-run actors use zero. The execution boundary rejects a Start whose
  // generation does not match the actor's committed binding.
  int64 binding_generation = 8;
  WorkflowExecutionValueRepresentation value_representation = 9;
}

// Actor-owned activation continuation. It does not start a new logical run;
// it only drains a dispatch intent already committed in kernel state.
message WorkflowExecutionRecoveryRequestedEvent
{
  string run_id = 1;
}

enum WorkflowRunActorReusePolicy
{
  // Historical bind events did not declare actor reuse. Live commands normalize
  // this value to SINGLE_RUN; replay keeps the legacy event semantics intact.
  WORKFLOW_RUN_ACTOR_REUSE_POLICY_UNSPECIFIED = 0;
  // A normal workflow Run actor can never change run identity.
  WORKFLOW_RUN_ACTOR_REUSE_POLICY_SINGLE_RUN = 1;
  // Internal workflow_call singleton actors may advance serially to the next
  // run identity when the typed authority and generation fence both match.
  WORKFLOW_RUN_ACTOR_REUSE_POLICY_SERIAL_SINGLETON = 2;
}

// Representation selected at the logical run admission boundary. A plain
// new run may fall back to LEGACY when the normalized-state fleet gate is
// unavailable; normalized forks are never silently downgraded.
enum WorkflowExecutionValueRepresentation
{
  WORKFLOW_EXECUTION_VALUE_REPRESENTATION_UNSPECIFIED = 0;
  WORKFLOW_EXECUTION_VALUE_REPRESENTATION_LEGACY = 1;
  WORKFLOW_EXECUTION_VALUE_REPRESENTATION_NORMALIZED = 2;
}

message BindWorkflowRunDefinitionEvent
{
  reserved 18;
  reserved "normalized_state_fleet_capability";
  string definition_actor_id = 1;
  string workflow_name = 2;
  string workflow_yaml = 3;
  map<string, string> inline_workflow_yamls = 4;
  string run_id = 5;
  string scope_id = 6;
  // Canonical run origin/type stamped by the creating ingress (draft | member-invoke |
  // default-invoke | team-invoke | service-invoke | ad-hoc-chat | provisioned). Observatory
  // filter dimension; empty for legacy/unstamped runs.
  string run_origin = 7;
  // Per-schedule correlation id stamped at bind for provisioned (cron-fired) runs; empty for
  // non-scheduled runs. Carried from ServiceInvocationRequest.schedule_id via WorkflowDefinitionBinding.
  string schedule_id = 8;
  // Committed call-site admission proof copied from the authoritative Definition binding.
  // The Run actor owns this copy for its whole lifetime; runtime never re-reads the Definition.
  WorkflowCapabilityAdmissionPlan capability_admission_plan = 9;
  ExternalCapabilityExecutionMode expected_execution_mode = 10;
  // Authoritative draft/workspace workflow identity carried from the definition binding.
  // Empty means the run is legacy or not backed by a draft workflow identity.
  string workflow_id = 11;
  // Exact definition revision used by this run. Empty for legacy or ad-hoc runs.
  string revision_id = 12;
  // Authoritative committed definition version/watermark used by this run. Zero means unavailable.
  int64 definition_version = 13;
  WorkflowRunLineage initial_lineage = 14;
  WorkflowRunActorReusePolicy reuse_policy = 15;
  int64 binding_generation = 16;
  // Parent WorkflowRunGAgent that owns singleton reuse. Empty for single-run
  // actors. The live bind handler verifies this against the envelope publisher.
  string reuse_authority_actor_id = 17;
  // Empty only on committed legacy v0 runs. Every new bind uses the current reviewed policy.
  string tool_catalog_policy_version = 19;
}

// Idempotent provisioning command for a stable Run actor identity. The first
// delivery binds an empty Run; subsequent identical deliveries are no-ops;
// any conflicting binding is rejected without resetting execution state. When
// execution_request is present, binding validation and first execution happen
// in the same actor turn.
message EnsureWorkflowRunDefinitionEvent
{
  BindWorkflowRunDefinitionEvent binding = 1;
  WorkflowChatRequestEvent execution_request = 2;
}
message BindWorkflowDefinitionEvent
{
  string workflow_name = 1;
  string workflow_yaml = 2;
  map<string, string> inline_workflow_yamls = 3;
  optional string scope_id = 4;
  string source_kind = 5;
  WorkflowAuthorizationDependencies authorization_dependencies = 6;
  WorkflowCapabilityAdmissionPlan capability_admission_plan = 7;
  string workflow_id = 8;
  string revision_id = 9;
  ExternalCapabilityExecutionMode expected_execution_mode = 10;
  string tool_catalog_policy_version = 11;
  string catalog_publication_contract_version = 12;
}

enum WorkflowServiceGrantPolicy {
  WORKFLOW_SERVICE_GRANT_POLICY_UNSPECIFIED = 0;
  WORKFLOW_SERVICE_GRANT_POLICY_REQUIRED = 1;
  WORKFLOW_SERVICE_GRANT_POLICY_NOT_REQUIRED_NO_EXTERNAL_SERVICE = 2;
}

message WorkflowAuthorizationDependencies {
  reserved 1, 3, 4;
  reserved "connector_capability_refs", "nyx_id_service_ids", "nyx_id_service_slugs";
  bool owner_llm_route_required = 2;
  WorkflowServiceGrantPolicy service_grant_policy = 5;
  // Legacy v2 projection/read slot. New compilation writes only external_invocations.
  repeated ExternalWorkflowCapabilityRef external_capabilities = 6 [deprecated = true];
  repeated ExternalToolInvocationSpec external_invocations = 7;
}
message WorkflowRunExecutionStartedEvent
{
  string run_id = 1;
  string workflow_name = 2;
  string input = 3;
  string definition_actor_id = 4;
  string scope_id = 5;
