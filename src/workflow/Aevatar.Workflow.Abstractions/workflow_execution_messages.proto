}

enum WorkflowStepOutputProvenance {
  WORKFLOW_STEP_OUTPUT_PROVENANCE_UNSPECIFIED = 0;
  // The completion produced a new logical value instance.
  WORKFLOW_STEP_OUTPUT_PROVENANCE_PRODUCED = 1;
  // The completion intentionally forwards the current step input. The kernel
  // preserves dataflow while binding aliases to the existing canonical value.
  WORKFLOW_STEP_OUTPUT_PROVENANCE_FORWARDED_INPUT = 2;
  // The completion forwards the canonical output of another completed step in
  // the same logical run. output_source_step_id identifies that exact source;
  // content equality alone never establishes this relationship.
  WORKFLOW_STEP_OUTPUT_PROVENANCE_REFERENCED_STEP_OUTPUT = 3;
}

enum WorkflowStepAssignedValueProvenance {
  WORKFLOW_STEP_ASSIGNED_VALUE_PROVENANCE_UNSPECIFIED = 0;
  // The assigned value is a distinct logical value, even when its bytes happen
  // to equal the step output.
  WORKFLOW_STEP_ASSIGNED_VALUE_PROVENANCE_PRODUCED = 1;
  // The assigned-value mirror explicitly aliases this completion's output.
  WORKFLOW_STEP_ASSIGNED_VALUE_PROVENANCE_REFERENCES_OUTPUT = 2;
}

