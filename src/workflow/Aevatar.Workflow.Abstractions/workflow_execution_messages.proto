message WorkflowLlmExecutionIntent
{
  reserved 11;
  reserved "connector_http_authorization";
  string run_id = 1;
  string step_id = 2;
  string session_id = 3;
  string prompt = 4;
  string model = 5;
  optional int32 max_tool_rounds = 6;
  string user_memory_prompt = 7;
  int32 timeout_ms = 8;
  map<string, string> headers = 9;
  map<string, string> annotations = 10;
  WorkflowCallerCredential caller_credential = 12;
  string route_preference = 13;
  string sender_nyx_id_access_token = 14;
  WorkflowToolRuntimeContextPayload workflow_runtime_context = 15;
  repeated WorkflowFileRef input_file_refs = 16;
  WorkflowAgentToolScope agent_tool_scope = 17;
  // Authoritative scope id of the owning workflow run (WorkflowRunGAgent.State.ScopeId).
  // Threaded so the role actor can populate the tool caller scope on the channel-less
  // Direct/studio path, where no inbound channel stamps the caller scope. Empty when the
  // run has no scope (e.g. anonymous local runs); the role actor only fills an empty caller.
  string scope_id = 18;
  // Per-schedule correlation id threaded from the owning workflow run for tool audit identity.
  string schedule_id = 19;
}

