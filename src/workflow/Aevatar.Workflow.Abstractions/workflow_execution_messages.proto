syntax = "proto3";
package aevatar.workflow;
option csharp_namespace = "Aevatar.Workflow.Abstractions";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "Credentials/credential_secret_references.proto";
import "Interactions/interaction_spec.proto";
import "workflow_capability_admission.proto";
import "workflow_external_action.proto";

enum WorkflowChatInputPartKind {
  WORKFLOW_CHAT_INPUT_PART_KIND_UNSPECIFIED = 0;
  WORKFLOW_CHAT_INPUT_PART_KIND_TEXT = 1;
  WORKFLOW_CHAT_INPUT_PART_KIND_IMAGE = 2;
  WORKFLOW_CHAT_INPUT_PART_KIND_AUDIO = 3;
  WORKFLOW_CHAT_INPUT_PART_KIND_VIDEO = 4;
  WORKFLOW_CHAT_INPUT_PART_KIND_FILE = 5;
}

enum WorkflowFileSourceKind {
  WORKFLOW_FILE_SOURCE_KIND_UNSPECIFIED = 0;
  WORKFLOW_FILE_SOURCE_KIND_CHAT_INPUT = 1;
  WORKFLOW_FILE_SOURCE_KIND_FORM_UPLOAD = 2;
  WORKFLOW_FILE_SOURCE_KIND_CONNECTED_SERVICE_RESOURCE = 3;
  WORKFLOW_FILE_SOURCE_KIND_EXTERNAL_RESOURCE = 4;
  WORKFLOW_FILE_SOURCE_KIND_GENERATED = 5;
}

enum WorkflowSagaStatus {
  WORKFLOW_SAGA_STATUS_UNSPECIFIED = 0;
  WORKFLOW_SAGA_STATUS_COMPENSATING = 1;
  WORKFLOW_SAGA_STATUS_COMPENSATED_FAILED = 2;
  WORKFLOW_SAGA_STATUS_COMPENSATION_DEAD_LETTER = 3;
}

enum WorkflowStepFailureOutcome {
  WORKFLOW_STEP_FAILURE_OUTCOME_UNSPECIFIED = 0;
  WORKFLOW_STEP_FAILURE_OUTCOME_CALLEE_CONFIRMED = 1;
  WORKFLOW_STEP_FAILURE_OUTCOME_OUTCOME_UNCERTAIN = 2;
}

enum WorkflowRunTerminalStatus {
  WORKFLOW_RUN_TERMINAL_STATUS_UNSPECIFIED = 0;
  WORKFLOW_RUN_TERMINAL_STATUS_COMPLETED = 1;
  WORKFLOW_RUN_TERMINAL_STATUS_FAILED = 2;
  WORKFLOW_RUN_TERMINAL_STATUS_STOPPED = 3;
}

enum WorkflowRunTerminalNotificationDeliveryStatus {
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_UNSPECIFIED = 0;
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_PREPARED = 1;
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_RETRY_SCHEDULED = 2;
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_DISPATCHED = 3;
  WORKFLOW_RUN_TERMINAL_NOTIFICATION_DELIVERY_STATUS_EXPIRED = 4;
}

message WorkflowCompletionNotificationTarget {
  string actor_id = 1;
  string delivery_id = 2;
  int64 expires_at_unix_ms = 3;
}

message WorkflowRunTerminalNotification {
  string delivery_id = 1;
  string workflow_actor_id = 2;
  string workflow_run_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  WorkflowRunTerminalStatus status = 6;
  string output = 7;
  string error = 8;
  google.protobuf.Timestamp terminal_at = 9;
}

message WorkflowRunStartedNotification {
  string delivery_id = 1;
  string workflow_actor_id = 2;
  string workflow_run_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  google.protobuf.Timestamp started_at = 6;
}

message WorkflowRunCompletionNotificationTargetAdoptedEvent {
  WorkflowCompletionNotificationTarget completion_notification_target = 1;
  string workflow_run_id = 2;
  string scope_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  google.protobuf.Timestamp adopted_at = 6;
}

message WorkflowRunTerminalNotificationPreparedEvent {
  WorkflowRunTerminalNotification notification = 1;
  int32 attempt = 2;
  google.protobuf.Timestamp prepared_at = 3;
}

message WorkflowRunTerminalNotificationDispatchedEvent {
  string delivery_id = 1;
  string workflow_command_id = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp dispatched_at = 4;
}

message WorkflowRunTerminalNotificationRetryScheduledEvent {
  string delivery_id = 1;
  string workflow_command_id = 2;
  int32 attempt = 3;
  string callback_id = 4;
  google.protobuf.Timestamp retry_at = 5;
}

message WorkflowRunTerminalNotificationRetryFiredEvent {
  string delivery_id = 1;
  string workflow_actor_id = 2;
  string workflow_command_id = 3;
  int32 attempt = 4;
}

message WorkflowRunTerminalNotificationExpiredEvent {
  string delivery_id = 1;
  string workflow_command_id = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp expired_at = 4;
}

message WorkflowFileRef {
  string file_id = 1;
  string artifact_id = 2;
  WorkflowFileSourceKind source_kind = 3;
  string source_message_id = 4;
  string source_resource_key = 5;
  string file_name = 6;
  string media_type = 7;
  int64 size_bytes = 8;
  string sha256 = 9;
  int64 created_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  string owner_run_id = 12;
  string owner_scope_id = 13;
}

message WorkflowChatInputPartPayload {
  WorkflowChatInputPartKind kind = 1;
  string text = 2;
  string data_base64 = 3;
  string media_type = 4;
  string uri = 5;
  string name = 6;
  WorkflowFileRef file_ref = 7;
}

message WorkflowLlmControlContext {
  string model_override = 1;
  optional int32 max_tool_rounds_override = 2;
  string user_memory_prompt = 3;
  string route_preference = 4;
  string sender_nyx_id_access_token = 5;
}

enum NyxIdCallerCredentialKind {
  NYX_ID_CALLER_CREDENTIAL_KIND_UNSPECIFIED = 0;
  NYX_ID_CALLER_CREDENTIAL_KIND_SOURCE_READABLE_USER_BEARER = 1;
  NYX_ID_CALLER_CREDENTIAL_KIND_PROXY_DELEGATION = 2;
}

message WorkflowCallerCredential {
  string bearer_token = 1;
  aevatar.credentials.RuntimeSecretReference runtime_secret_reference = 2;
  aevatar.credentials.DurableCallerCredentialRef durable_caller_credential = 3;
  WorkflowCallerNyxIdAuthority nyx_id_authority = 4;
  NyxIdCallerCredentialKind kind = 5;
  string source_readable_user_bearer_token = 6;
  aevatar.credentials.RuntimeSecretReference source_readable_user_bearer_runtime_secret_reference = 7;
}

message WorkflowCallerNyxIdAuthority {
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
  string scope = 4;
  string binding_id = 5;
}

message WorkflowExternalIngressContext {
  string route_key = 1;
  string source_id = 2;
  string delivery_id = 3;
  int64 received_at_unix_ms = 4;
  string content_type = 5;
  string payload_fingerprint = 6;
  string auth_scheme = 7;
  string principal_subject = 8;
}

message WorkflowWebhookReplayRecord {
  string route_key = 1;
  string source_id = 2;
  string delivery_id = 3;
  string payload_fingerprint = 4;
  int64 received_at_unix_ms = 5;
  string command_id = 6;
  string correlation_id = 7;
}

message WorkflowChatRequestEvent {
  reserved 9;
  reserved "connector_http_authorization";
  string prompt = 1;
  string session_id = 2;
  map<string, string> headers = 3;
  int32 timeout_ms = 4;
  string scope_id = 5;
  repeated WorkflowChatInputPartPayload input_parts = 6;
  map<string, string> metadata = 7;
  WorkflowLlmControlContext llm_control = 8;
  WorkflowCallerCredential caller_credential = 10;
  WorkflowRunForkSeed fork_seed = 11;
  WorkflowExternalIngressContext external_ingress = 12;
  WorkflowCompletionNotificationTarget completion_notification_target = 13;
  WorkflowConversationContext conversation_context = 14;
}

enum WorkflowConversationRole {
  WORKFLOW_CONVERSATION_ROLE_UNSPECIFIED = 0;
  WORKFLOW_CONVERSATION_ROLE_USER = 1;
  WORKFLOW_CONVERSATION_ROLE_ASSISTANT = 2;
  WORKFLOW_CONVERSATION_ROLE_TOOL = 3;
}

message WorkflowConversationMessage {
  int32 sequence = 1;
  string turn_id = 2;
  WorkflowConversationRole role = 3;
  string content = 4;
}

message WorkflowConversationContext {
  string scope_id = 1;
  string conversation_id = 2;
  int64 state_version = 3;
  repeated WorkflowConversationMessage messages = 4;
  bool truncated = 5;
  int32 max_message_count = 6;
}

message WorkflowRunForkSeed
{
  string source_run_id = 1;
  string start_at_step_id = 2;
  map<string, string> variables = 3;
  int32 attempt = 4;
  WorkflowStepIdempotencyState start_step_idempotency = 5;
}

message WorkflowStepIdempotencyState
{
  string logical_run_id = 1;
  string step_id = 2;
  int32 logical_attempt = 3;
  string idempotency_key = 4;
}

message WorkflowRunForkRequestedEvent
{
  string source_run_id = 1;
  string start_at_step_id = 2;
  int32 attempt = 3;
  string scope_id = 4;
}

message StartWorkflowEvent
{
  string workflow_name = 1;
  string input = 2;
  map<string, string> parameters = 3;
  string run_id = 4;
  WorkflowRunForkSeed fork_seed = 5;
  WorkflowToolRuntimeContextPayload workflow_runtime = 6;
  repeated WorkflowFileRef input_file_refs = 7;
}
message BindWorkflowRunDefinitionEvent
{
  string definition_actor_id = 1;
  string workflow_name = 2;
  string workflow_yaml = 3;
  map<string, string> inline_workflow_yamls = 4;
  string run_id = 5;
  string scope_id = 6;
  // Canonical run origin/type stamped by the creating ingress (draft | member-invoke |
  // default-invoke | team-invoke | service-invoke | ad-hoc-chat | provisioned). Observatory
  // filter dimension; empty for legacy/unstamped runs.
  string run_origin = 7;
  // Per-schedule correlation id stamped at bind for provisioned (cron-fired) runs; empty for
  // non-scheduled runs. Carried from ServiceInvocationRequest.schedule_id via WorkflowDefinitionBinding.
  string schedule_id = 8;
  // Committed call-site admission proof copied from the authoritative Definition binding.
  // The Run actor owns this copy for its whole lifetime; runtime never re-reads the Definition.
  WorkflowCapabilityAdmissionPlan capability_admission_plan = 9;
  ExternalCapabilityExecutionMode expected_execution_mode = 10;
}

// Idempotent provisioning command for a stable Run actor identity. The first
// delivery binds an empty Run; subsequent identical deliveries are no-ops;
// any conflicting binding is rejected without resetting execution state. When
// execution_request is present, binding validation and first execution happen
// in the same actor turn.
message EnsureWorkflowRunDefinitionEvent
{
  BindWorkflowRunDefinitionEvent binding = 1;
  WorkflowChatRequestEvent execution_request = 2;
}
message BindWorkflowDefinitionEvent
{
  string workflow_name = 1;
  string workflow_yaml = 2;
  map<string, string> inline_workflow_yamls = 3;
  optional string scope_id = 4;
  string source_kind = 5;
  WorkflowAuthorizationDependencies authorization_dependencies = 6;
  WorkflowCapabilityAdmissionPlan capability_admission_plan = 7;
  string workflow_id = 8;
  string revision_id = 9;
  ExternalCapabilityExecutionMode expected_execution_mode = 10;
}

enum WorkflowServiceGrantPolicy {
  WORKFLOW_SERVICE_GRANT_POLICY_UNSPECIFIED = 0;
  WORKFLOW_SERVICE_GRANT_POLICY_REQUIRED = 1;
  WORKFLOW_SERVICE_GRANT_POLICY_NOT_REQUIRED_NO_EXTERNAL_SERVICE = 2;
}

message WorkflowAuthorizationDependencies {
  reserved 1, 3, 4;
  reserved "connector_capability_refs", "nyx_id_service_ids", "nyx_id_service_slugs";
  bool owner_llm_route_required = 2;
  WorkflowServiceGrantPolicy service_grant_policy = 5;
  // Legacy v2 projection/read slot. New compilation writes only external_invocations.
  repeated ExternalWorkflowCapabilityRef external_capabilities = 6 [deprecated = true];
  repeated ExternalToolInvocationSpec external_invocations = 7;
}
message WorkflowRunExecutionStartedEvent
{
  string run_id = 1;
  string workflow_name = 2;
  string input = 3;
  string definition_actor_id = 4;
  string scope_id = 5;
  WorkflowRunExecutionContextDelta execution_context_delta = 6;
  int32 attempt = 7;
  repeated WorkflowFileRef input_file_refs = 8;
  google.protobuf.Timestamp started_at_utc = 9;
  WorkflowCompletionNotificationTarget completion_notification_target = 10;
  string workflow_command_id = 11;
  string workflow_correlation_id = 12;
}
message WorkflowRunExecutionContextDelta
{
  WorkflowRunLlmExecutionContextDelta llm = 1;
  reserved 2, 4;
  reserved "connector", "clear_connector";
  bool clear_llm = 3;
  WorkflowCallerCredential caller_credential = 5;
  bool clear_caller_credential = 6;
  WorkflowToolRuntimeContextPayload workflow_runtime = 7;
  bool clear_workflow_runtime = 8;
}
message WorkflowRunLlmExecutionContextDelta
{
  reserved 1, 3;
  reserved "nyxid_access_token", "nyxid_route_preference";
  string model_override = 2;
  optional int32 max_tool_rounds_override = 4;
  string user_memory_prompt = 5;
  string route_preference = 7;
}
message WorkflowRunExecutionContextUpdatedEvent
{
  string run_id = 1;
  WorkflowRunExecutionContextDelta execution_context_delta = 2;
}
message WorkflowRunExecutionContextClearedEvent { string run_id = 1; }
message WorkflowCommandObservedEvent { string command_id = 1; }
message WorkflowExecutionStateUpsertedEvent
{
  string scope_key = 1;
  google.protobuf.Any state = 2;
}
message WorkflowExecutionStateClearedEvent  { string scope_key = 1; }
message WorkflowStoppedEvent { string workflow_name = 1; string run_id = 2; string reason = 3; }
message WorkflowCompletedEvent { string workflow_name = 1; bool success = 2; string output = 3; string error = 4; string run_id = 5; }

message WorkflowInteractionNotificationEvent {
  string run_id = 1;
  string step_id = 2;
  string delivery_target_id = 3;
  oneof payload {
    aevatar.foundation.interactions.InteractionSpec interaction = 4;
    aevatar.foundation.interactions.InteractionTemplateSpec interaction_template = 5;
  }
}

enum AgreementRuleMode {
  AGREEMENT_RULE_MODE_UNSPECIFIED = 0;
  AGREEMENT_RULE_MODE_ALL = 1;
  AGREEMENT_RULE_MODE_MAJORITY = 2;
  AGREEMENT_RULE_MODE_QUORUM = 3;
  AGREEMENT_RULE_MODE_LABEL_COUNT_CONSTRAINTS = 4;
  AGREEMENT_RULE_MODE_PREDICATE = 5;
}

enum AgreementVoteLabel {
  AGREEMENT_VOTE_LABEL_UNSPECIFIED = 0;
  AGREEMENT_VOTE_LABEL_APPROVE = 1;
  AGREEMENT_VOTE_LABEL_REJECT = 2;
  AGREEMENT_VOTE_LABEL_ABSTAIN = 3;
}

enum AgreementCandidateLabelSource {
  AGREEMENT_CANDIDATE_LABEL_SOURCE_UNSPECIFIED = 0;
  AGREEMENT_CANDIDATE_LABEL_SOURCE_SUCCESS = 1;
  AGREEMENT_CANDIDATE_LABEL_SOURCE_BRANCH_KEY = 2;
  AGREEMENT_CANDIDATE_LABEL_SOURCE_ANNOTATION = 3;
}

enum AgreementDecisionKind {
  AGREEMENT_DECISION_KIND_UNSPECIFIED = 0;
  AGREEMENT_DECISION_KIND_AGREED = 1;
  AGREEMENT_DECISION_KIND_REJECTED = 2;
  AGREEMENT_DECISION_KIND_INCONCLUSIVE = 3;
}

enum AgreementWinnerPolicy {
  AGREEMENT_WINNER_POLICY_UNSPECIFIED = 0;
  AGREEMENT_WINNER_POLICY_FIRST_APPROVED = 1;
  AGREEMENT_WINNER_POLICY_FIRST_SUCCESS = 2;
  AGREEMENT_WINNER_POLICY_FIRST = 3;
}

message AgreementCountConstraint {
  AgreementVoteLabel label = 1;
  optional int32 min_count = 2;
  optional int32 max_count = 3;
}

message VoteAgreementCandidate {
  string candidate_id = 1;
  bool success = 2;
  string output = 3;
  string error = 4;
  string worker_id = 5;
  string branch_key = 6;
  map<string, string> annotations = 7;
  string next_step_id = 8;
  string assigned_variable = 9;
  string assigned_value = 10;
}

message VoteAgreementCandidateSet {
  repeated VoteAgreementCandidate candidates = 1;
}

message VoteAgreementRule {
  AgreementRuleMode mode = 1;
  AgreementCandidateLabelSource label_source = 2;
  string label_field = 3;
  optional int32 quorum_count = 4;
  optional double quorum_ratio = 5;
  repeated AgreementCountConstraint count_constraints = 6;
  string predicate_id = 7;
  AgreementWinnerPolicy winner_policy = 8;
  string on_agreed = 9;
  string on_rejected = 10;
  string on_inconclusive = 11;
}

message VoteAgreementDecision {
  AgreementDecisionKind kind = 1;
  string branch_key = 2;
  string winner_candidate_id = 3;
  string output = 4;
  string reason = 5;
  map<string, int32> label_counts = 6;
}

enum TransformOperationKind {
  TRANSFORM_OPERATION_KIND_UNSPECIFIED = 0;
  TRANSFORM_OPERATION_KIND_SUM = 1;
  TRANSFORM_OPERATION_KIND_SUBTRACT = 2;
  TRANSFORM_OPERATION_KIND_MULTIPLY = 3;
  TRANSFORM_OPERATION_KIND_DIVIDE = 4;
  TRANSFORM_OPERATION_KIND_ROUND = 5;
  TRANSFORM_OPERATION_KIND_MIN = 6;
  TRANSFORM_OPERATION_KIND_MAX = 7;
  TRANSFORM_OPERATION_KIND_GROUP_BY = 8;
}

enum TransformAggregateKind {
  TRANSFORM_AGGREGATE_KIND_UNSPECIFIED = 0;
  TRANSFORM_AGGREGATE_KIND_SUM = 1;
  TRANSFORM_AGGREGATE_KIND_COUNT = 2;
  TRANSFORM_AGGREGATE_KIND_AVG = 3;
}

message TransformOperationSpec {
  TransformOperationKind kind = 1;
  optional int32 precision = 2;
  string key = 3;
  string value = 4;
  TransformAggregateKind aggregate = 5;
}

enum WorkflowHumanApprovalTimeoutDefaultDecision {
  WORKFLOW_HUMAN_APPROVAL_TIMEOUT_DEFAULT_DECISION_UNSPECIFIED = 0;
  WORKFLOW_HUMAN_APPROVAL_TIMEOUT_DEFAULT_DECISION_REJECT = 1;
  WORKFLOW_HUMAN_APPROVAL_TIMEOUT_DEFAULT_DECISION_APPROVE = 2;
}

enum WorkflowHumanApprovalResolutionSource {
  WORKFLOW_HUMAN_APPROVAL_RESOLUTION_SOURCE_UNSPECIFIED = 0;
  WORKFLOW_HUMAN_APPROVAL_RESOLUTION_SOURCE_USER = 1;
  WORKFLOW_HUMAN_APPROVAL_RESOLUTION_SOURCE_TIMEOUT = 2;
}

message WorkflowHumanApprovalOptions {
  WorkflowHumanApprovalTimeoutDefaultDecision timeout_default_decision = 1;
}

message WorkflowExternalApprovalWaitOptions {
  string source_id = 1;
  string external_id_kind = 2;
  string external_id = 3;
  string signal_name = 4;
  string callback_idempotency_key = 5;
  string request_id = 6;
}

message WorkflowStepParameters
{
  map<string, string> parameters = 1;
  VoteAgreementCandidateSet vote_agreement_candidates = 2;
  VoteAgreementRule vote_agreement_rule = 3;
  aevatar.foundation.interactions.InteractionSpec interaction_spec = 4;
  aevatar.foundation.interactions.InteractionTemplateSpec interaction_template_spec = 5;
  string delivery_target_id = 6;
  TransformOperationSpec transform_operation = 7;
  WorkflowAgentToolScope agent_tool_scope = 8;
  WorkflowHumanApprovalOptions human_approval = 9;
  WorkflowExternalApprovalWaitOptions external_approval = 10;
  WorkflowConnectorApprovalOptions connector_approval = 11;
}
message StepRequestEvent
{
  reserved 5;
  string step_id = 1;
  string step_type = 2;
  string input = 3;
  string target_role = 4;
  string run_id = 6;
  string execution_id = 7;
  WorkflowStepParameters step_parameters = 8;
  repeated WorkflowFileRef input_file_refs = 9;
  string idempotency_key = 10;
  // Compiled external tool invocation for this call site. Present for direct external tool
  // steps and for the primitives that synthesize external sub-steps at runtime.
  ExternalToolInvocationSpec external_invocation = 11;
}
message WorkflowUsageMetrics {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  string model = 4;
  double cost = 5;
  int64 latency_ms = 6;
}
message WorkflowFileItemResult {
  int32 index = 1;
  WorkflowFileRef file_ref = 2;
  bool success = 3;
  string output = 4;
  string error = 5;
}
message WorkflowFileItemResultSet {
  repeated WorkflowFileItemResult results = 1;
}
message StepCompletedEvent {
  string step_id = 1;
  bool success = 2;
  string output = 3;
  string error = 4;
  string worker_id = 5;
  map<string, string> annotations = 6;
  string run_id = 7;
  string next_step_id = 8;
  string branch_key = 9;
  string assigned_variable = 10;
  string assigned_value = 11;
  string execution_id = 12;
  WorkflowUsageMetrics usage = 13;
  VoteAgreementDecision vote_agreement_decision = 14;
  WorkflowStepFailureOutcome failure_outcome = 15;
  WorkflowFileItemResultSet file_item_results = 16;
}
message SubWorkflowInvokeRequestedEvent
{
  string invocation_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string workflow_name = 4;
  string input = 5;
  string lifecycle = 6;
  string requested_by_actor_id = 7;
  string root_run_id = 8;
  int32 requested_depth = 9;
  repeated WorkflowFileRef input_file_refs = 10;
}
message WorkflowDefinitionSnapshot
{
  string definition_actor_id = 1;
  string workflow_name = 2;
  string workflow_yaml = 3;
  map<string, string> inline_workflow_yamls = 4;
  string scope_id = 5;
  int32 definition_version = 6;
}
message SubWorkflowDefinitionResolveRequestedEvent
{
  string invocation_id = 1;
  string parent_actor_id = 2;
  string parent_run_id = 3;
  string parent_step_id = 4;
  string workflow_name = 5;
  string lifecycle = 6;
  string requested_definition_actor_id = 7;
}
message SubWorkflowDefinitionResolvedEvent
{
  string invocation_id = 1;
  WorkflowDefinitionSnapshot definition = 2;
}
message SubWorkflowDefinitionResolveFailedEvent
{
  string invocation_id = 1;
  string workflow_name = 2;
  string definition_actor_id = 3;
  string error = 4;
}
message SubWorkflowDefinitionResolutionTimeoutFiredEvent
{
  string invocation_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string workflow_name = 4;
  string definition_actor_id = 5;
  int32 timeout_ms = 6;
}
message SubWorkflowDefinitionResolutionRegisteredEvent
{
  string invocation_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string workflow_name = 4;
  string definition_actor_id = 5;
  string input = 6;
  string lifecycle = 7;
  string timeout_callback_id = 8;
  int64 timeout_callback_generation = 9;
  string timeout_callback_actor_id = 10;
  int32 timeout_callback_backend = 11;
  int32 timeout_ms = 12;
  int32 timeout_callback_slot_epoch = 13;
  string root_run_id = 14;
  int32 requested_depth = 15;
  repeated WorkflowFileRef input_file_refs = 16;
}
message SubWorkflowDefinitionResolutionClearedEvent
{
  string invocation_id = 1;
}
message SubWorkflowBindingUpsertedEvent
{
  string workflow_name = 1;
  string child_actor_id = 2;
  string lifecycle = 3;
  string definition_actor_id = 4;
  int32 definition_version = 5;
}
message SubWorkflowInvocationRegisteredEvent
{
  string invocation_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string workflow_name = 4;
  string child_actor_id = 5;
  string child_run_id = 6;
  string lifecycle = 7;
  string definition_actor_id = 8;
  int32 definition_version = 9;
  string input = 10;
  int32 handoff_phase = 11;
  string definition_yaml = 12;
  string scope_id = 13;
  map<string, string> inline_workflow_yamls = 14;
  string root_run_id = 15;
  int32 depth = 16;
  repeated WorkflowFileRef input_file_refs = 17;
}
message SubWorkflowInvocationHandoffAdvancedEvent
{
  string invocation_id = 1;
  string child_run_id = 2;
  int32 handoff_phase = 3;
}
message SubWorkflowInvocationCompletedEvent
{
  string invocation_id = 1;
  string child_run_id = 2;
  bool success = 3;
  string output = 4;
  string error = 5;
  bool compensated = 6;
}
message WorkflowSuspendedEvent
{
  string run_id = 1;
  string step_id = 2;
  string suspension_type = 3;
  string prompt = 4;
  int32 timeout_seconds = 5;
  string variable_name = 6;
  map<string, string> metadata = 7;
  string content = 8;
  string delivery_target_id = 9;
  bool secure = 10;
  string redacted_output = 11;
  WorkflowToolApprovalSuspension tool_approval = 12;
  aevatar.foundation.interactions.InteractionSpec interaction = 13;
}
message WorkflowToolApprovalSuspension
{
  string execution_id = 1;
  string tool_name = 2;
