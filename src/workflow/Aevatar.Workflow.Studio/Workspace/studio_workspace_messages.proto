syntax = "proto3";
package aevatar.gagents.studio_workspace;
option csharp_namespace = "Aevatar.Studio.Workspace";

import "google/protobuf/timestamp.proto";

// Refactor (iter16/cluster-meta-studio-actor-substrate):
//   Old: FileStudioWorkspaceStore was a shadow store reading/writing JSON files in workspace dir, with no clear actor ownership of workspace facts
//   New principle: workspace facts authoritatively owned by StudioWorkspaceGAgent (per CLAUDE.md "权威状态" + Auric 2026-05-19 "架构级清晰")

message StudioWorkspaceState {
  string workspace_id = 1;
  string scope_id = 2;
  StudioWorkspaceSettings settings = 3;
  repeated StudioWorkspaceDirectory directories = 4;
  map<string, StudioWorkflowDraft> drafts = 5;
  google.protobuf.Timestamp updated_at_utc = 6;
  int64 last_applied_event_version = 7;
}

message StudioWorkspaceSettings {
  string name = 1;
  string runtime_base_url = 2;
  string appearance_theme = 3;
  string color_mode = 4;
}

message StudioWorkspaceDirectory {
  string directory_id = 1;
  string label = 2;
  string path = 3;
  bool is_built_in = 4;
}

message StudioWorkflowDraft {
  string workflow_id = 1;
  string name = 2;
  string file_name = 3;
  string directory_id = 4;
  string directory_label = 5;
  string yaml = 6;
  StudioWorkflowLayout layout = 7;
  google.protobuf.Timestamp created_at_utc = 8;
  google.protobuf.Timestamp updated_at_utc = 9;
  int64 version = 10;
}

message StudioWorkflowLayout {
  repeated StudioWorkflowNodeLayout nodes = 1;
  repeated StudioWorkflowLayoutGroup groups = 2;
  repeated string collapsed = 3;
  StudioWorkflowViewport viewport = 4;
  string entry_workflow = 5;
}

message StudioWorkflowNodeLayout {
  string node_id = 1;
  double x = 2;
  double y = 3;
}

message StudioWorkflowLayoutGroup {
  string group_id = 1;
  repeated string node_ids = 2;
}

message StudioWorkflowViewport {
  double x = 1;
  double y = 2;
  double zoom = 3;
}

message StudioWorkspaceSettingsUpdated {
  string workspace_id = 1;
  string scope_id = 2;
  StudioWorkspaceSettings settings = 3;
  int64 expected_version = 4;
  google.protobuf.Timestamp updated_at_utc = 5;
}

message StudioWorkspaceDirectoryAdded {
  string workspace_id = 1;
  string scope_id = 2;
  StudioWorkspaceDirectory directory = 3;
  int64 expected_version = 4;
  google.protobuf.Timestamp added_at_utc = 5;
}

message StudioWorkspaceDirectoryRemoved {
  string workspace_id = 1;
  string scope_id = 2;
  string directory_id = 3;
  int64 expected_version = 4;
  google.protobuf.Timestamp removed_at_utc = 5;
}

message StudioWorkflowDraftSaved {
  string workspace_id = 1;
  string scope_id = 2;
  StudioWorkflowDraft draft = 3;
  int64 expected_version = 4;
  google.protobuf.Timestamp saved_at_utc = 5;
}

message StudioWorkflowDraftDeleted {
  string workspace_id = 1;
  string scope_id = 2;
  string workflow_id = 3;
  int64 expected_version = 4;
  google.protobuf.Timestamp deleted_at_utc = 5;
}
