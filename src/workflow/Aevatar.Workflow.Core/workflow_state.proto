syntax = "proto3";
package aevatar.workflow;
option csharp_namespace = "Aevatar.Workflow.Core";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "workflow_execution_messages.proto";
import "workflow_capability_admission.proto";
import "workflow_external_action.proto";
import "Credentials/credential_secret_references.proto";

message WorkflowState
{
  message SubWorkflowBinding
  {
    string workflow_name = 1;
    string child_actor_id = 2;
    string lifecycle = 3;
    string definition_actor_id = 4;
    int32 definition_version = 5;
    int64 binding_generation = 6;
  }

  message PendingSubWorkflowInvocation
  {
    string invocation_id = 1;
    string parent_run_id = 2;
    string parent_step_id = 3;
    string workflow_name = 4;
    string child_actor_id = 5;
    string child_run_id = 6;
    string lifecycle = 7;
    string definition_actor_id = 8;
    int32 definition_version = 9;
    SubWorkflowInvocationHandoffPhase handoff_phase = 10;
    string input = 11;
    string definition_yaml = 12;
    string scope_id = 13;
    map<string, string> inline_workflow_yamls = 14;
    string root_run_id = 15;
    int32 depth = 16;
    repeated WorkflowFileRef input_file_refs = 17;
    int64 binding_generation = 18;
    string parent_execution_id = 19;
    WorkflowExecutionValueRepresentation value_representation = 20;
    string revision_id = 21;
    string tool_catalog_policy_version = 22;
    WorkflowCapabilityAdmissionPlan capability_admission_plan = 23;
    string workflow_id = 24;
    ExternalCapabilityExecutionMode expected_execution_mode = 25;
  }

  message PendingSubWorkflowDefinitionResolution
  {
    string invocation_id = 1;
    string parent_run_id = 2;
    string parent_step_id = 3;
    string workflow_name = 4;
    string definition_actor_id = 5;
    string input = 6;
    string lifecycle = 7;
    WorkflowRuntimeCallbackLeaseState timeout_lease = 8;
    string timeout_callback_id = 9;
    int32 timeout_ms = 10;
    string root_run_id = 11;
    int32 requested_depth = 12;
    repeated WorkflowFileRef input_file_refs = 13;
    string parent_execution_id = 14;
    WorkflowExecutionValueRepresentation value_representation = 15;
  }

  message ChildRunIdSet
  {
    repeated string child_run_ids = 1;
  }

  string workflow_yaml = 1;
  string workflow_name = 2;
  int32 version = 3;
  bool compiled = 4;
  string compilation_error = 5;
  int32 total_executions = 6;
  int32 successful_executions = 7;
  int32 failed_executions = 8;

  repeated SubWorkflowBinding sub_workflow_bindings = 9;
  repeated PendingSubWorkflowInvocation pending_sub_workflow_invocations = 10;
  map<string, string> inline_workflow_yamls = 11;
  map<string, int32> pending_sub_workflow_invocation_index_by_child_run_id = 12;
  map<string, ChildRunIdSet> pending_child_run_ids_by_parent_run_id = 13;
  string scope_id = 14;
  string source_kind = 15;
  int32 max_sub_workflow_depth = 16;
  int32 max_active_sub_workflows = 17;
  WorkflowAuthorizationDependencies authorization_dependencies = 18;
  WorkflowCapabilityAdmissionPlan capability_admission_plan = 19;
  string workflow_id = 20;
  string revision_id = 21;
  ExternalCapabilityExecutionMode expected_execution_mode = 22;
  string tool_catalog_policy_version = 23;
  string catalog_publication_contract_version = 24;
}

message WorkflowRunState
{
  reserved 62;
  reserved "normalized_state_fleet_capability";
  message SubWorkflowBinding
  {
    string workflow_name = 1;
    string child_actor_id = 2;
    string lifecycle = 3;
    string definition_actor_id = 4;
    int32 definition_version = 5;
    int64 binding_generation = 6;
  }

  message PendingSubWorkflowInvocation
  {
    string invocation_id = 1;
    string parent_run_id = 2;
    string parent_step_id = 3;
    string workflow_name = 4;
    string child_actor_id = 5;
    string child_run_id = 6;
    string lifecycle = 7;
    string definition_actor_id = 8;
    int32 definition_version = 9;
    SubWorkflowInvocationHandoffPhase handoff_phase = 10;
    string input = 11;
    string definition_yaml = 12;
    string scope_id = 13;
    map<string, string> inline_workflow_yamls = 14;
    string root_run_id = 15;
    int32 depth = 16;
    repeated WorkflowFileRef input_file_refs = 17;
    int64 binding_generation = 18;
    string parent_execution_id = 19;
    WorkflowExecutionValueRepresentation value_representation = 20;
    string revision_id = 21;
    string tool_catalog_policy_version = 22;
    WorkflowCapabilityAdmissionPlan capability_admission_plan = 23;
    string workflow_id = 24;
    ExternalCapabilityExecutionMode expected_execution_mode = 25;
  }

  message PendingSubWorkflowDefinitionResolution
  {
    string invocation_id = 1;
    string parent_run_id = 2;
    string parent_step_id = 3;
    string workflow_name = 4;
    string definition_actor_id = 5;
    string input = 6;
    string lifecycle = 7;
    WorkflowRuntimeCallbackLeaseState timeout_lease = 8;
    string timeout_callback_id = 9;
    int32 timeout_ms = 10;
    string root_run_id = 11;
    int32 requested_depth = 12;
    repeated WorkflowFileRef input_file_refs = 13;
    string parent_execution_id = 14;
    WorkflowExecutionValueRepresentation value_representation = 15;
  }

  message ChildRunIdSet
  {
    repeated string child_run_ids = 1;
  }

  string definition_actor_id = 1;
  string workflow_yaml = 2;
  string workflow_name = 3;
  bool compiled = 4;
  string compilation_error = 5;
  map<string, string> inline_workflow_yamls = 6;
  string run_id = 7;
  string status = 8;
  string input = 9;
  string final_output = 10;
  string final_error = 11;
  map<string, google.protobuf.Any> execution_states = 12;

  repeated SubWorkflowBinding sub_workflow_bindings = 13;
  repeated PendingSubWorkflowInvocation pending_sub_workflow_invocations = 14;
  map<string, int32> pending_sub_workflow_invocation_index_by_child_run_id = 15;
  map<string, ChildRunIdSet> pending_child_run_ids_by_parent_run_id = 16;
  string last_command_id = 17;
  string scope_id = 18;
  repeated PendingSubWorkflowDefinitionResolution pending_sub_workflow_definition_resolutions = 19;
  map<string, int32> pending_sub_workflow_definition_resolution_index_by_invocation_id = 20;
  WorkflowRunExecutionContextState execution_context = 21;
  int32 fork_attempt = 22;
  int32 max_sub_workflow_depth = 23;
  int32 max_active_sub_workflows = 24;
  repeated CompletedStepLedgerEntry compensable_ledger = 25;
  int32 compensation_cursor = 26;
  WorkflowSagaStatus saga_status = 27;
  string compensation_execution_id = 28;
  string dead_letter_failed_compensation_step_id = 29;
  int32 dead_letter_remaining_uncompensated = 30;
  string dead_letter_error = 31;
  string compensation_origin_failed_step_id = 32;
  bool terminal_workflow_completion_recorded = 33;
  google.protobuf.Timestamp started_at_utc = 34;
  // Canonical run origin/type stamped at bind by the creating ingress. Observatory filter
  // dimension; empty for legacy/unstamped runs. See WorkflowRunOrigins for the canonical set.
  string run_origin = 35;
  // Per-schedule correlation id stamped at bind for provisioned (cron-fired) runs; empty for
  // non-scheduled runs. Observatory filter dimension for "this schedule's runs".
  string schedule_id = 36;
  WorkflowCompletionNotificationTarget completion_notification_target = 37;
  string workflow_correlation_id = 38;
  WorkflowRunTerminalNotification pending_terminal_notification = 39;
  int32 terminal_notification_attempt = 40;
  WorkflowRunTerminalNotificationDeliveryStatus terminal_notification_delivery_status = 41;
  string terminal_notification_retry_callback_id = 42;
  // Committed call-site admission proof owned by this Run for its whole lifetime.
  WorkflowCapabilityAdmissionPlan capability_admission_plan = 43;
  ExternalCapabilityExecutionMode expected_execution_mode = 44;
  // Exact run-owned deduplication keys for child artifact facts. Entries are retained for the
  // run lifetime because child committed-state publications may arrive out of version order.
  repeated WorkflowArtifactSourceIdentity processed_artifact_sources = 45;
  string current_turn_id = 46;
  repeated WorkflowInteractiveActionHandoffState interactive_action_handoffs = 47;
  string workflow_id = 48;
  google.protobuf.Timestamp completed_at_utc = 49;
  optional double duration_ms = 50;
  WorkflowRunInitiatorState initiator = 51;
  string revision_id = 52;
  int64 definition_version = 53;
  aevatar.workflow.WorkflowRecoveryFailureKind terminal_recovery_failure_kind = 54;
  aevatar.workflow.WorkflowRunLineage lineage = 55;
  // Highest observed committed state version per child publisher. This is diagnostic only;
  // exact deduplication uses processed_artifact_sources because delivery may be out of order.
  map<string, int64> processed_artifact_state_versions_by_publisher = 56;
  aevatar.workflow.WorkflowRunActorReusePolicy reuse_policy = 57;
  int64 binding_generation = 58;
  string reuse_authority_actor_id = 59;
  WorkflowRunDefinitionBindingContinuationState pending_definition_binding_continuation = 60;
  // Exact run-owned identities for committed StepCompleted artifact facts that carry an
  // execution id. Tool-call step completion publication is at-least-once, so entries are
  // retained for the run lifetime.
  map<string, bool> processed_step_completion_keys = 61;
  // A compensation completion is committed before the actor commits either the next
  // compensation request or the terminal compensation fact. Retain that exact outcome so
  // activation can finish the interrupted actor-owned continuation without re-running the
  // compensation step.
  CompensationStepCompletedEvent pending_compensation_completion = 63;
  aevatar.workflow.WorkflowValueLifecycleFailureKind terminal_value_lifecycle_failure_kind = 64;
  // Internal durable self-publication intent. Projection publication redacts
  // this execution-only payload; the authoritative actor clears it after the
  // workflow kernel commits its first state checkpoint.
  aevatar.workflow.StartWorkflowEvent pending_start_workflow = 65;
  string tool_catalog_policy_version = 66;
  aevatar.workflow.WorkflowAgentTurnToolCatalogProof last_tool_catalog_proof = 67;
}

message WorkflowRunDefinitionBindingContinuationState
{
  string continuation_id = 1;
  repeated WorkflowRuntimeCallbackLeaseState definition_resolution_timeout_leases = 2;
  repeated string derived_child_actor_ids = 3;
  bool execute_after_bind = 4;
  string execution_input = 5;
  bool cleanup_completed = 6;
  WorkflowExecutionValueRepresentation value_representation = 7;
}

message WorkflowRunDefinitionBindingContinuationRegisteredEvent
{
  WorkflowRunDefinitionBindingContinuationState continuation = 1;
}

message WorkflowRunDefinitionBindingCleanupCompletedEvent
{
  string continuation_id = 1;
}

message WorkflowRunDefinitionBindingContinuationClearedEvent
{
  string continuation_id = 1;
}

message WorkflowRunInitiatorState
{
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
  string scope = 4;
  string binding_id = 5;
  string display_value = 6;
  string availability = 7;
}

message WorkflowInteractiveActionHandoffState
{
  string handoff_id = 1;
  WorkflowInteractiveActionRequestWirePayload request = 2;
  WorkflowLlmInvocationCompletedEvent terminal_continuation = 3;
  bool continuation_dispatched = 4;
}

message WorkflowRunExecutionContextState
{
  WorkflowLlmExecutionContextState llm = 1;
  reserved 2;
  reserved "connector";
  WorkflowCallerCredentialState caller_credential = 3;
  WorkflowToolRuntimeContextState workflow_runtime = 4;
  WorkflowUnattendedEffectAuthorization unattended_effect_authorization = 5;
}

message WorkflowLlmExecutionContextState
{
  reserved 1, 3;
  reserved "nyxid_access_token", "nyxid_route_preference";
  string model_override = 2;
  optional int32 max_tool_rounds_override = 4;
  string user_memory_prompt = 5;
  string route_preference = 6;
}

message WorkflowCallerCredentialState
{
  string bearer_token = 1;
  aevatar.credentials.RuntimeSecretReference runtime_secret_reference = 2;
  aevatar.credentials.DurableCallerCredentialRef durable_caller_credential = 3;
  WorkflowCallerNyxIdAuthority nyx_id_authority = 4;
  NyxIdCallerCredentialKind kind = 5;
  string source_readable_user_bearer_token = 6;
  aevatar.credentials.RuntimeSecretReference source_readable_user_bearer_runtime_secret_reference = 7;
  reserved 8;
  reserved "unattended_effect_authorization";
  WorkflowCallerCredentialCleanupResponsibility durable_credential_cleanup_responsibility = 9;
}

message WorkflowToolRuntimeContextState
{
  string parent_actor_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string root_run_id = 4;
  int32 depth = 5;
}

enum WorkflowRuntimeCallbackBackendState
{
  WORKFLOW_RUNTIME_CALLBACK_BACKEND_STATE_IN_MEMORY = 0;
  WORKFLOW_RUNTIME_CALLBACK_BACKEND_STATE_DEDICATED = 1;
}

enum ReflectPhaseState
{
  REFLECT_PHASE_STATE_CRITIQUE = 0;
  REFLECT_PHASE_STATE_IMPROVE = 1;
}

enum SubWorkflowInvocationHandoffPhase
{
  SUB_WORKFLOW_INVOCATION_HANDOFF_PHASE_REGISTERED = 0;
  SUB_WORKFLOW_INVOCATION_HANDOFF_PHASE_ACTOR_RESOLVED = 1;
  SUB_WORKFLOW_INVOCATION_HANDOFF_PHASE_LINKED = 2;
  SUB_WORKFLOW_INVOCATION_HANDOFF_PHASE_BOUND = 3;
  SUB_WORKFLOW_INVOCATION_HANDOFF_PHASE_START_DISPATCH_PENDING = 4;
  SUB_WORKFLOW_INVOCATION_HANDOFF_PHASE_START_FAILED = 5;
  SUB_WORKFLOW_INVOCATION_HANDOFF_PHASE_START_DISPATCHED = 6;
}

enum CompensableLedgerEntryStatus
{
  COMPENSABLE_LEDGER_ENTRY_STATUS_UNSPECIFIED = 0;
  COMPENSABLE_LEDGER_ENTRY_STATUS_CONFIRMED = 1;
  COMPENSABLE_LEDGER_ENTRY_STATUS_PROVISIONAL = 2;
}

message WorkflowRuntimeCallbackLeaseState
{
  string actor_id = 1;
  string callback_id = 2;
  int64 generation = 3;
  WorkflowRuntimeCallbackBackendState backend = 4;
  int32 slot_epoch = 5;
}

message WorkflowLeaseWaiterState
{
  string request_id = 1;
  string requester_run_id = 2;
  string requester_actor_id = 3;
  string requester_step_id = 4;
  int32 ttl_ms = 5;
  int32 wait_timeout_ms = 6;
  int64 enqueued_at_unix_ms = 7;
  WorkflowRuntimeCallbackLeaseState timeout_lease = 8;
  string timeout_callback_id = 9;
}

message WorkflowLeaseState
{
  string lease_key = 1;
  string holder_run_id = 2;
  string holder_actor_id = 3;
  string holder_step_id = 4;
  string holder_token = 5;
  int64 generation = 6;
  int64 expires_at_unix_ms = 7;
  WorkflowRuntimeCallbackLeaseState expiration_lease = 8;
  string expiration_callback_id = 9;
  repeated WorkflowLeaseWaiterState waiters = 10;
}

message WorkflowLeaseStateUpsertedEvent
{
  WorkflowLeaseState state = 1;
}

message PendingWorkflowLeaseOperationState
{
  string request_id = 1;
  string run_id = 2;
  string step_id = 3;
  string lease_key = 4;
  string lease_actor_id = 5;
  string action = 6;
  string input = 7;
  string holder_token_variable = 8;
  string execution_id = 9;
  string input_value_id = 10;
}

message WorkflowLeaseModuleState
{
  map<string, PendingWorkflowLeaseOperationState> pending = 1;
}

message RetryBackoffState
{
  WorkflowRuntimeCallbackLeaseState lease = 1;
  int32 next_attempt = 2;
  int32 delay_ms = 3;
  string callback_id = 4;
  bool dispatch_pending = 5;
}

message WorkflowExecutionKernelState
{
  bool active = 1;
  string run_id = 2;
  string current_step_id = 3;
  string current_step_input = 4;
  map<string, string> variables = 5;
  map<string, int32> retry_attempts_by_step_id = 6;
  map<string, WorkflowRuntimeCallbackLeaseState> timeouts_by_step_id = 7;
  map<string, RetryBackoffState> retry_backoffs_by_step_id = 8;
  bool current_step_dispatch_pending = 9;
  string current_step_timeout_callback_id = 10;
  map<string, string> execution_ids_by_step_id = 11;
  WorkflowUsageMetricsState usage = 12;
  repeated WorkflowFileRef input_file_refs = 13;
  repeated WorkflowFileRef current_step_input_file_refs = 14;
  map<string, WorkflowStepIdempotencyState> idempotency_by_step_id = 15;
  map<string, string> compensation_execution_ids_by_step_id = 16;
  WorkflowRuntimeCallbackLeaseState compensation_phase_deadline_lease = 17;
  string compensation_phase_deadline_callback_id = 18;
  aevatar.workflow.WorkflowRecoveryFailureKind compensation_terminal_recovery_failure_kind = 19;
  WorkflowCompletedEvent pending_workflow_completion = 20;
  // Present only for runs admitted to the normalized value representation.
  // Absence is the complete legacy discriminator; no business-state schema
  // version is duplicated here because RuntimeActorIdentity owns that axis.
  WorkflowNormalizedExecutionValuesState normalized_values = 21;
  WorkflowPendingCompensationOutcomeState pending_compensation_outcome = 22;
}

// Durable handoff from the execution kernel to the run actor's compensation ledger. The
// completed physical execution is never dispatched again while this continuation is present.
message WorkflowPendingCompensationOutcomeState
{
  StepCompletedEvent completion = 1;
  string compensation_execution_id = 2;
  oneof continuation
  {
    CompensationRequestEvent next_compensation_request = 3;
    WorkflowCompletedEvent terminal_completion = 4;
    bool completed_without_continuation = 5;
  }
}

// One logical engine-produced value. Values are never coalesced by content:
// value_id identifies the accepted production instance and provenance records
// which execution produced it.
message WorkflowCanonicalValueState
{
  string value_id = 1;
  string value = 2;
  string producer_step_id = 3;
  string producer_execution_id = 4;
  aevatar.workflow.WorkflowCanonicalValueSourceKind source_kind = 5;
  aevatar.workflow.WorkflowReleasedValueTombstone released = 6;
}

enum WorkflowValueBindingKind
{
  WORKFLOW_VALUE_BINDING_KIND_UNSPECIFIED = 0;
  WORKFLOW_VALUE_BINDING_KIND_STEP_OUTPUT = 1;
  WORKFLOW_VALUE_BINDING_KIND_CURRENT_INPUT = 2;
  WORKFLOW_VALUE_BINDING_KIND_ASSIGNED_VALUE = 3;
  WORKFLOW_VALUE_BINDING_KIND_INTERNAL_OUTPUT = 4;
  WORKFLOW_VALUE_BINDING_KIND_REQUEST_OVERRIDE = 5;
}

// Typed alias from an expression-visible key to a canonical value. Reference
// identity is never encoded into the legacy string map.
message WorkflowValueBindingState
{
  string value_id = 1;
  WorkflowValueBindingKind binding_kind = 2;
}

// Explicit completion facts replace the legacy inference that every
// non-reserved top-level variable key is a completed step.
message WorkflowCompletedStepState
{
  string step_id = 1;
  string output_value_id = 2;
  bool success = 3;
  string error = 4;
  string branch_key = 5;
  string next_step_id = 6;
  string assigned_variable = 7;
  string assigned_value_id = 8;
  map<string, string> annotations = 9;
  WorkflowUsageMetricsState usage = 10;
  // Legacy mirrors only expose step usage when the completion carried usage.
  bool has_usage = 11;
  // Each alias points at the output instance that last supplied that JSON
  // property. This preserves per-key last-write semantics across retries.
  map<string, WorkflowJsonValueBindingState> json_value_bindings = 12;
  // Internal and foreach child completions participate in the completion
  // ledger without publishing steps.<id> compatibility mirrors.
  bool emit_legacy_mirrors = 13;
  string execution_id = 14;
  WorkflowStepOutputProvenance output_provenance = 15;
  WorkflowStepAssignedValueProvenance assigned_value_provenance = 16;
  string output_source_step_id = 17;
  string output_source_execution_id = 18;
  string output_source_value_id = 19;
  string output_reference_id = 20;
  WorkflowStepFailureOutcome failure_outcome = 21;
  WorkflowStepRetryDisposition retry_disposition = 22;
  WorkflowStepCompletionOutcome outcome = 23;
  // Exact raw assigned_value compatibility mirror. The authored assignment
  // target may fall back to output while this mirror retains an empty/blank
  // value, so it cannot share assigned_value_id in that case.
  string assigned_mirror_value_id = 24;
  aevatar.workflow.WorkflowValueDigest output_digest = 25;
  aevatar.workflow.WorkflowValueDigest assigned_value_digest = 26;
  aevatar.workflow.WorkflowValueDigest assigned_mirror_digest = 27;
}

message WorkflowJsonValueBindingState
{
  string output_value_id = 1;
}

message WorkflowPendingOutputReferenceState
{
  string reference_id = 1;
  string source_step_id = 2;
  string source_execution_id = 3;
  string source_value_id = 4;
  string target_step_id = 5;
  string target_execution_id = 6;
}

// Actor-owned authority for one nested executor dispatch. Unknown child
// completions cannot become workflow facts unless they match this exact lease.
message WorkflowPendingInternalDispatchState
{
  string dispatch_key = 1;
  string run_id = 2;
  string step_id = 3;
  string execution_id = 4;
  string input_value_id = 5;
  string origin_envelope_id = 6;
}

message WorkflowNormalizedExecutionValuesState
{
  map<string, WorkflowCanonicalValueState> canonical_values = 1;
  map<string, WorkflowValueBindingState> bindings = 2;
  map<string, WorkflowCompletedStepState> completed_steps = 3;
  uint64 next_value_sequence = 4;
  // Empty means current_step_input remains an inline legacy/start value.
  string current_step_input_value_id = 5;
  map<string, WorkflowPendingOutputReferenceState> pending_output_references = 6;
  map<string, WorkflowPendingInternalDispatchState> pending_internal_dispatches = 7;
  // Completion acceptance ledger keyed by step id and execution id.  The
  // bridge and artifact observer use this to reject stale or forged events
  // after the kernel has committed the corresponding canonical value.
  map<string, string> accepted_completion_value_ids = 8;
  // Immutable semantic snapshot for each accepted physical completion. Legacy
  // mirrors in completed_steps intentionally retain per-key values across
  // retries and therefore cannot serve as an exact replay comparator.
  map<string, WorkflowCompletedStepState> accepted_completions = 9;
  // Source-run provenance restored from a fork seed. These entries validate
  // inherited aliases and survive fork-of-fork capture, but are never used to
  // accept or recover a target-run physical completion.
  map<string, string> inherited_completion_value_ids = 10;
  map<string, WorkflowCompletedStepState> inherited_completions = 11;
  // Alias tombstones preserve the difference between "never existed" and
  // "author explicitly released this exact canonical value". Enumeration
  // omits them and request overrides may bind the same name to a new identity.
  map<string, aevatar.workflow.WorkflowReleasedValueTombstone> released_bindings = 12;
}

message WorkflowUsageMetricsState
{
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  string model = 4;
  double cost = 5;
  int64 latency_ms = 6;
}

message PendingDelayState
{
  WorkflowRuntimeCallbackLeaseState lease = 1;
  string input = 2;
  string callback_id = 3;
  string step_id = 4;
  string execution_id = 5;
  string input_value_id = 6;
}

message DelayModuleState
{
  map<string, PendingDelayState> pending = 1;
}

message PendingSignalState
{
  string step_id = 1;
  string run_id = 2;
  string input = 3;
  string signal_name = 4;
  WorkflowRuntimeCallbackLeaseState timeout_lease = 5;
  string timeout_callback_id = 6;
  PendingExternalApprovalContinuationState external_approval = 7;
  string execution_id = 8;
  string input_value_id = 9;
}

message PendingExternalApprovalContinuationState
{
  string source_id = 1;
  string external_id_kind = 2;
  string external_id = 3;
  string callback_idempotency_key = 4;
  string request_id = 5;
}

message WaitSignalModuleState
{
  map<string, PendingSignalState> pending = 1;
  map<string, BufferedSignalState> buffered = 2;
}

message BufferedSignalState
{
  string payload = 1;
  int64 received_at_unix_time_ms = 2;
  int64 expires_at_unix_time_ms = 3;
}

message PendingHumanInputState
{
  string step_id = 1;
  string run_id = 2;
  string input = 3;
  string on_timeout = 4;
  string execution_id = 5;
  string input_value_id = 6;
}

message HumanInputModuleState
{
  map<string, PendingHumanInputState> pending = 1;
}

message PendingSecureInputState
{
  string step_id = 1;
  string run_id = 2;
  string input = 3;
  string on_timeout = 4;
  bool allow_empty = 5;
  string variable_name = 6;
  string masked_output = 7;
  string execution_id = 8;
  string input_value_id = 9;
}

message CapturedSecureInputState
{
  string run_id = 1;
  string variable_name = 2;
  string value = 3;
  aevatar.credentials.RuntimeSecretReference value_reference = 4;
}

message SecureInputModuleState
{
  map<string, PendingSecureInputState> pending = 1;
  map<string, CapturedSecureInputState> captured = 2;
}

message PendingToolCallApprovalState
{
  string run_id = 1;
  string step_id = 2;
  string execution_id = 3;
  string tool_name = 4;
