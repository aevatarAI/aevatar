syntax = "proto3";

package aevatar.credentials;

option csharp_namespace = "Aevatar.Foundation.Abstractions.Credentials";

message SecretReference {
  string ref = 1;
  string purpose = 2;
  string fingerprint = 3;
  int64 version = 4;
  string owner_scope_key = 5;
  int64 created_at_unix_ms = 6;
  int64 expires_at_unix_ms = 7;
}

message RuntimeSecretReference {
  string ref = 1;
  string purpose = 2;
  string fingerprint = 3;
  int64 expires_at_unix_ms = 4;
  bool consume_once = 5;
  string owner_run_id = 6;
  string owner_step_id = 7;
}

enum DurableCallerCredentialSourceKind {
  DURABLE_CALLER_CREDENTIAL_SOURCE_KIND_UNSPECIFIED = 0;
  DURABLE_CALLER_CREDENTIAL_SOURCE_KIND_SCHEDULED_DISPATCH = 1;
  DURABLE_CALLER_CREDENTIAL_SOURCE_KIND_NYX_ID_CHAT = 2;
  DURABLE_CALLER_CREDENTIAL_SOURCE_KIND_WEBHOOK_BINDING = 3;
  DURABLE_CALLER_CREDENTIAL_SOURCE_KIND_CHANNEL_REGISTRATION = 4;
}

message DurableCallerCredentialRef {
  string ref = 1;
  string purpose = 2;
  string owner_scope_key = 3;
  string subject_id = 4;
  DurableCallerCredentialSourceKind source_kind = 5;
  ScheduledCallerNyxIdAuthority scheduled_caller_nyx_id_authority = 6;
  // Exact vault descriptor captured when the durable handle is created.
  // New durable sources use this to fail closed on rotation/version drift.
  SecretReference secret_reference = 7;
  // Provider-owned credential identity used for lifecycle revocation. Raw
  // credential material remains exclusively in the referenced vault secret.
  string provider_credential_id = 8;
  // Producer-issued exact-operation grants bound to this credential. Runtime
  // callers must select exactly one matching grant and never infer authority
  // from the credential's broader service allowlist.
  repeated NyxIdDurableOperationGrantRef nyx_id_durable_operation_grants = 9;
}

message NyxIdDurableOperationGrantRef {
  string grant_id = 1;
  string api_key_id = 2;
  string user_service_id = 3;
  string endpoint_id = 4;
  NyxIdDurableOperationHttpMethod http_method = 5;
  string normalized_path_template = 6;
  string contract_digest = 7;
  int64 valid_from_unix_ms = 8;
  int64 expires_at_unix_ms = 9;
  NyxIdDurableOperationReplayPolicy replay_policy = 10;
  NyxIdDurableOperationClientAuditBinding client_audit_binding = 11;
}

enum NyxIdDurableOperationHttpMethod {
  NYX_ID_DURABLE_OPERATION_HTTP_METHOD_UNSPECIFIED = 0;
  NYX_ID_DURABLE_OPERATION_HTTP_METHOD_POST = 1;
  NYX_ID_DURABLE_OPERATION_HTTP_METHOD_PUT = 2;
  NYX_ID_DURABLE_OPERATION_HTTP_METHOD_PATCH = 3;
}

enum NyxIdDurableOperationReplayPolicy {
  NYX_ID_DURABLE_OPERATION_REPLAY_POLICY_UNSPECIFIED = 0;
  NYX_ID_DURABLE_OPERATION_REPLAY_POLICY_NON_REPLAYABLE = 1;
  NYX_ID_DURABLE_OPERATION_REPLAY_POLICY_DOWNSTREAM_IDEMPOTENCY_KEY = 2;
}

message NyxIdDurableOperationClientAuditBinding {
  string platform = 1;
  string schedule_id = 2;
  string workflow_revision = 3;
  string call_site = 4;
}

message ScheduledCallerNyxIdAuthority {
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
  string scope = 4;
  string binding_id = 5;
}
