<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Aevatar AI</title>
  <style>
    :root {
      --ink: #182034;
      --ink-strong: #0b1020;
      --muted: #5c677d;
      --faint: #8a94a8;
      --line: #dfe4ed;
      --line-strong: #c8d0de;
      --canvas: #eef1f5;
      --paper: #ffffff;
      --paper-soft: #f7f8fa;
      --rail: #101827;
      --rail-deep: #0a101c;
      --rail-text: #aab6cb;
      --rail-active: #202d43;
      --blue: #3567e8;
      --blue-deep: #2452c4;
      --blue-soft: #edf2ff;
      --green: #17875a;
      --green-soft: #e9f7f0;
      --amber: #b96d0b;
      --amber-soft: #fff5e5;
      --red: #c43d47;
      --red-soft: #fcedef;
      --violet: #6d56c7;
      --violet-soft: #f1eefc;
      --shadow: 0 1px 2px rgba(10, 16, 28, .05), 0 8px 22px rgba(10, 16, 28, .05);
      --rail-width: 224px;
      --header-height: 64px;
      --sans: "Alibaba Sans", "AlibabaSans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font: 14px/1.5 var(--sans); letter-spacing: 0; }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    .auth-shell {
      min-height: 100%; display: grid; grid-template-columns: minmax(340px, .82fr) minmax(440px, 1.18fr);
      background: var(--paper); position: relative; overflow: hidden;
    }
    .auth-product {
      min-height: 100vh; display: flex; flex-direction: column; padding: clamp(34px, 5vw, 68px);
      color: #edf2fa; background: #0c111b; border-right: 1px solid #273145;
    }
    .auth-brand { display: flex; align-items: center; gap: 12px; color: #fff; font-size: 16px; font-weight: 700; }
    .auth-brand-mark, .auth-mobile-mark {
      width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid #526988;
      border-radius: 7px; background: #17243a; color: #9bb8ff;
    }
    .auth-brand-mark svg, .auth-mobile-mark svg { width: 20px; height: 20px; }
    .auth-product-copy { margin-top: clamp(72px, 15vh, 150px); max-width: 460px; }
    .auth-product-label { margin: 0 0 13px; color: #7183a0; font: 700 11px/1.2 var(--mono); text-transform: uppercase; }
    .auth-product-title { margin: 0; color: #fff; font-size: clamp(34px, 4.6vw, 60px); line-height: 1.04; font-weight: 700; }
    .auth-product-title span { display: block; color: #8faef5; }
    .auth-product-map { margin-top: auto; padding-top: 40px; }
    .auth-map-line { height: 1px; background: #263147; }
    .auth-map-row {
      min-height: 52px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 11px;
      align-items: center; border-bottom: 1px solid #202a3c; color: #9daac0;
    }
    .auth-map-row svg { width: 16px; height: 16px; color: #7699eb; }
    .auth-map-row strong { color: #dfe7f4; font-size: 12px; font-weight: 650; }
    .auth-map-state { color: #60718d; font: 700 9px/1 var(--mono); text-transform: uppercase; }
    .auth-main { min-height: 100vh; display: grid; place-items: center; padding: clamp(34px, 7vw, 88px); background: #f7f8fa; }
    .auth-panel { width: min(390px, 100%); text-align: left; }
    .auth-mobile-brand { display: none; align-items: center; gap: 10px; margin-bottom: 56px; color: var(--ink-strong); font-weight: 700; }
    .auth-kicker { margin: 0 0 10px; color: var(--blue); font: 700 11px/1.2 var(--mono); text-transform: uppercase; }
    .auth-title { margin: 0; color: var(--ink-strong); font-size: 32px; line-height: 1.15; font-weight: 700; }
    .auth-subtitle { margin: 11px 0 34px; color: var(--muted); font-size: 14px; }
    .auth-button {
      width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px;
      border: 1px solid var(--blue); border-radius: 6px; background: var(--blue); color: #fff; font-weight: 650;
      box-shadow: 0 8px 20px rgba(53, 103, 232, .18); transition: background .16s ease, transform .16s ease;
    }
    .auth-button:hover { background: var(--blue-deep); }
    .auth-button:active { transform: translateY(1px); }
    .auth-provider-logo { width: 21px; height: 21px; border-radius: 4px; }
    .auth-meta { margin-top: 17px; color: var(--faint); font-size: 11px; text-align: center; }
    .auth-error { margin: 17px 0 0; padding: 10px 12px; border: 1px solid #e9b7bc; border-radius: 6px; background: var(--red-soft); color: #8e313b; text-align: left; }

    .app-shell { min-height: 100%; display: grid; grid-template-columns: var(--rail-width) minmax(0, 1fr); }
    .rail { height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; color: var(--rail-text); background: var(--rail); border-right: 1px solid #253147; }
    .rail-brand { height: var(--header-height); display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid #263248; color: #fff; font-weight: 680; font-size: 15px; }
    .brand-glyph { width: 29px; height: 29px; display: grid; place-items: center; border: 1px solid #526988; border-radius: 7px; background: #17243a; color: #8eb0ff; }
    .brand-glyph svg { width: 17px; height: 17px; }
    .rail-label { padding: 22px 18px 8px; color: #697a96; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .rail-nav { display: grid; gap: 4px; padding: 0 10px; }
    .nav-link { height: 40px; display: flex; align-items: center; gap: 11px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--rail-text); text-decoration: none; text-align: left; }
    .nav-link:hover { color: #f3f6fb; background: #19243a; }
    .nav-link.active { color: #fff; background: var(--rail-active); box-shadow: inset 3px 0 #6f96f4; }
    .nav-link svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .rail-account { margin-top: auto; padding: 13px 12px; border-top: 1px solid #263248; display: grid; grid-template-columns: 34px minmax(0, 1fr) 32px; gap: 9px; align-items: center; }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #2c3b55; color: #fff; font-weight: 700; }
    .account-copy { min-width: 0; }
    .account-name, .account-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-name { color: #edf2fa; font-size: 12px; font-weight: 650; }
    .account-email { color: #71809a; font-size: 10px; }

    .main { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { height: var(--header-height); flex: 0 0 var(--header-height); position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: rgba(255, 255, 255, .96); border-bottom: 1px solid var(--line); }
    .mobile-brand { display: none; }
    .page-heading { min-width: 0; }
    .page-heading h1 { margin: 0; color: var(--ink-strong); font-size: 18px; line-height: 1.25; font-weight: 680; }
    .page-heading p { margin: 3px 0 0; color: var(--faint); font-size: 11px; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .net-state { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: 11px; font-weight: 650; }
    .net-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .content { flex: 1; min-width: 0; padding: 22px 24px 36px; }

    .button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--paper); color: var(--ink); font-weight: 600; }
    .button:hover { border-color: #aeb8c8; background: var(--paper-soft); }
    .button.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .button.primary:hover { background: var(--blue-deep); }
    .button.danger { color: var(--red); }
    .button.small { min-height: 30px; padding: 0 9px; font-size: 12px; }
    .icon-button { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--muted); }
    .icon-button:hover { color: var(--ink); border-color: var(--line-strong); }
    .icon-button svg, .button svg { width: 15px; height: 15px; }
    .rail .icon-button { border-color: transparent; background: transparent; color: #7e8da7; }
    .rail .icon-button:hover { color: #fff; background: #202c42; }
    .mobile-logout { display: none; }

    .notice { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 14px; padding: 10px 12px; border: 1px solid #d9c98d; border-left: 3px solid var(--amber); border-radius: 6px; background: var(--amber-soft); color: #79500d; font-size: 12px; }
    .notice.error { border-color: #e6b8bd; border-left-color: var(--red); background: var(--red-soft); color: #85313a; }
    .notice svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }
    .notice strong { color: inherit; }
    .notice-copy { min-width: 0; }
    .notice-detail { margin-top: 2px; color: currentColor; opacity: .78; font-size: 10px; }

    .toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar-spacer { flex: 1; }
    .search-box { min-width: 230px; height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
    .search-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .search-box svg { width: 15px; height: 15px; color: var(--faint); }
    .search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); }
    .segmented { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: #e7ebf1; }
    .segmented button { min-height: 28px; padding: 0 11px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; }
    .segmented button.active { background: var(--paper); color: var(--ink-strong); font-weight: 650; box-shadow: 0 1px 2px rgba(10, 16, 28, .1); }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi { min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); box-shadow: 0 1px 2px rgba(10, 16, 28, .03); }
    .kpi-top { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .kpi-icon { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: var(--blue-soft); color: var(--blue); }
    .kpi-icon.green { background: var(--green-soft); color: var(--green); }
    .kpi-icon.amber { background: var(--amber-soft); color: var(--amber); }
    .kpi-icon.violet { background: var(--violet-soft); color: var(--violet); }
    .kpi-icon svg { width: 14px; height: 14px; }
    .kpi-value { margin-top: 8px; color: var(--ink-strong); font: 680 26px/1 var(--mono); }
    .kpi-meta { margin-top: 7px; color: var(--faint); font-size: 11px; }

    .section-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 16px; }
    .section { min-width: 0; border-top: 1px solid var(--line-strong); background: var(--paper); }
    .section-head { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .section-title { margin: 0; color: var(--ink-strong); font-size: 13px; font-weight: 680; }
    .section-meta { margin-left: auto; color: var(--faint); font-size: 11px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--paper-soft); color: var(--faint); font-size: 10px; font-weight: 700; text-align: left; text-transform: uppercase; white-space: nowrap; }
    td { padding: 11px 12px; border-bottom: 1px solid #edf0f4; color: var(--ink); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.clickable:hover { background: #f7f9fc; cursor: pointer; }
    .row-action { width: 100%; display: block; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; }
    .row-action:hover .cell-title { color: var(--blue-deep); }
    .cell-title { color: var(--ink-strong); font-weight: 650; }
    .cell-sub { margin-top: 2px; color: var(--faint); font-size: 11px; }
    .truncate { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { display: inline-flex; align-items: center; gap: 5px; min-height: 21px; padding: 0 7px; border-radius: 5px; background: #edf0f4; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .badge.success { background: var(--green-soft); color: var(--green); }
    .badge.running { background: var(--blue-soft); color: var(--blue-deep); }
    .badge.waiting { background: var(--amber-soft); color: var(--amber); }
    .badge.failed { background: var(--red-soft); color: var(--red); }
    .badge.violet { background: var(--violet-soft); color: var(--violet); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .empty, .loading, .error-state { min-height: 190px; display: grid; place-items: center; padding: 28px; color: var(--faint); text-align: center; }
    .empty svg, .error-state svg { width: 28px; height: 28px; margin-bottom: 8px; }
    .error-state { color: var(--red); }
    .skeleton { display: grid; gap: 10px; width: min(480px, 80%); }
    .skeleton i { height: 11px; border-radius: 3px; background: #e6eaf0; animation: pulse 1.3s ease-in-out infinite; }
    .skeleton i:nth-child(2) { width: 76%; }
    .skeleton i:nth-child(3) { width: 88%; }
    @keyframes pulse { 50% { opacity: .45; } }

    .split-view { min-height: calc(100vh - 142px); display: grid; grid-template-columns: minmax(350px, .82fr) minmax(470px, 1.18fr); border-top: 1px solid var(--line-strong); background: var(--paper); }
    .split-list { min-width: 0; border-right: 1px solid var(--line); }
    .split-detail { min-width: 0; background: var(--paper-soft); }
    .agent-row { width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 13px 14px; border: 0; border-bottom: 1px solid #edf0f4; background: var(--paper); color: var(--ink); text-align: left; }
    .agent-row:hover { background: #f7f9fc; }
    .agent-row.active { background: var(--blue-soft); box-shadow: inset 3px 0 var(--blue); }
    .agent-symbol { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid #d7dfec; border-radius: 7px; background: #f4f7fb; color: var(--blue); }
    .agent-symbol svg { width: 17px; height: 17px; }
    .detail-pad { padding: 18px; }
    .detail-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
    .detail-head-copy { min-width: 0; }
    .detail-title { margin: 0; color: var(--ink-strong); font-size: 17px; font-weight: 680; }
    .detail-id { margin-top: 3px; color: var(--faint); font-size: 11px; }
    .detail-actions { margin-left: auto; display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }

    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--paper); color: var(--ink); outline: 0; }
    .field input, .field select { height: 36px; padding: 0 10px; }
    .field textarea { min-height: 94px; padding: 9px 10px; resize: vertical; line-height: 1.5; }
    .field textarea.code { min-height: 128px; font: 12px/1.5 var(--mono); }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .form-section { margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); }
    .form-section h3 { margin: 0 0 11px; color: var(--ink-strong); font-size: 12px; }
    .advanced { margin-top: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
    .advanced summary { padding: 10px 12px; color: var(--muted); font-size: 12px; font-weight: 650; cursor: pointer; }
    .advanced[open] summary { border-bottom: 1px solid var(--line); }
    .advanced-body { padding: 13px; }
    .diagnostics { display: grid; gap: 7px; margin-top: 14px; }
    .diagnostic { padding: 9px 10px; border-left: 3px solid var(--red); background: var(--red-soft); color: #85313a; font-size: 12px; }
    .diagnostic.ok { border-left-color: var(--green); background: var(--green-soft); color: #12613f; }

    .model-layout { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 16px; }
    .model-pane { min-width: 0; border-top: 1px solid var(--line-strong); background: var(--paper); }
    .model-body { padding: 16px; }
    .route-list, .source-list { display: grid; gap: 8px; margin-top: 14px; }
    .route-item, .source-item { padding: 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-soft); }
    .route-item-top, .source-item-top { display: flex; align-items: center; gap: 8px; }
    .route-item p, .source-item p { margin: 5px 0 0; color: var(--faint); font-size: 11px; }
    .model-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .model-tag { padding: 3px 7px; border: 1px solid #d9e1ef; border-radius: 4px; background: var(--paper); color: var(--muted); font: 10px var(--mono); }
    .version-row { display: flex; gap: 14px; flex-wrap: wrap; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--paper-soft); color: var(--faint); font-size: 10px; }
    .catalog-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-top: 14px; }
    .catalog-source-editor { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-soft); }
    .catalog-source-head { display: flex; align-items: flex-start; gap: 9px; }
    .catalog-source-title { min-width: 0; flex: 1; }
    .catalog-source-title strong, .catalog-source-title span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .catalog-source-title span { margin-top: 2px; color: var(--faint); font: 10px var(--mono); }
    .catalog-source-actions { display: flex; gap: 6px; }
    .catalog-models { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 11px; }
    .model-option { min-width: 0; display: flex; align-items: center; gap: 7px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--muted); font: 11px var(--mono); cursor: pointer; }
    .model-option:hover { border-color: var(--line-strong); color: var(--ink); }
    .model-option input { flex: 0 0 auto; margin: 0; accent-color: var(--blue); }
    .model-option span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .catalog-hint { margin-top: 9px; color: var(--faint); font-size: 11px; }

    .activity-controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 14px; }
    .activity-list { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 16px; }
    .run-row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid #edf0f4; background: var(--paper); color: var(--ink); text-align: left; cursor: pointer; }
    .run-row:hover { background: #f7f9fc; }
    .run-time { color: var(--faint); font-size: 10px; white-space: nowrap; }
    .conversation-row { padding: 12px 14px; border-bottom: 1px solid #edf0f4; }
    .conversation-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; color: var(--faint); font-size: 10px; }

    .drawer-backdrop { position: fixed; inset: 0; z-index: 70; display: flex; justify-content: flex-end; background: rgba(8, 13, 23, .4); }
    .drawer { width: min(760px, 94vw); height: 100%; display: flex; flex-direction: column; background: var(--paper); box-shadow: -18px 0 42px rgba(8, 13, 23, .2); }
    .drawer-head { min-height: 62px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .drawer-head-copy { min-width: 0; }
    .drawer-title { margin: 0; color: var(--ink-strong); font-size: 15px; font-weight: 680; }
    .drawer-sub { color: var(--faint); font-size: 10px; }
    .drawer-close { margin-left: auto; }
    .drawer-body { flex: 1; overflow: auto; padding: 18px; }
    .detail-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-bottom: 18px; }
    .detail-stat { padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-soft); }
    .detail-stat span { display: block; color: var(--faint); font-size: 10px; }
    .detail-stat strong { display: block; margin-top: 4px; color: var(--ink-strong); font: 650 14px var(--mono); }

    .timeline-item { position: relative; padding: 0 0 15px; }
    .timeline-item::before { content: ""; position: absolute; left: -24px; top: 5px; width: 8px; height: 8px; border: 2px solid var(--paper); border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
    .timeline-kind { color: var(--ink-strong); font-size: 12px; font-weight: 650; }
    .timeline-meta { margin-top: 2px; color: var(--faint); font-size: 10px; }
    .output { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #111827; color: #dbe5f4; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.6 var(--mono); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(8, 13, 23, .46); }
    .modal { width: min(440px, 100%); border-radius: 8px; background: var(--paper); box-shadow: 0 24px 64px rgba(8, 13, 23, .3); }
    .modal-head { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .modal-title { margin: 0; color: var(--ink-strong); font-size: 15px; }
    .modal-body { padding: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--paper-soft); }

    .toast-stack { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: grid; gap: 8px; width: min(360px, calc(100vw - 36px)); }
    .toast { padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--paper); box-shadow: var(--shadow); color: var(--ink); animation: toast-in .18s ease-out; }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid var(--red); }
    @keyframes toast-in { from { transform: translateY(7px); opacity: 0; } }

    @media (max-width: 1050px) {
      :root { --rail-width: 196px; }
      .auth-shell { grid-template-columns: minmax(300px, .72fr) minmax(410px, 1fr); }
      .auth-product { padding: 38px; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .section-grid, .model-layout, .activity-list { grid-template-columns: 1fr; }
      .split-view { grid-template-columns: minmax(310px, .8fr) minmax(400px, 1.2fr); }
    }

      .auth-product { display: none; }

      .auth-mobile-brand { display: flex; }
      .app-shell { display: block; padding-bottom: 62px; }
      .rail { height: 62px; position: fixed; inset: auto 0 0; z-index: 50; display: block; border: 0; border-top: 1px solid #27334a; }
      .rail-brand, .rail-label, .rail-account { display: none; }
      .rail-nav { height: 100%; grid-template-columns: repeat(4, 1fr); gap: 0; padding: 4px 5px; }
      .nav-link { height: 54px; flex-direction: column; justify-content: center; gap: 2px; padding: 0 2px; font-size: 10px; }
      .nav-link.active { box-shadow: inset 0 2px #6f96f4; }
      .nav-link svg { width: 16px; height: 16px; }
      .topbar { padding: 0 14px; }
      .mobile-brand { display: grid; }
      .mobile-logout { display: inline-grid; }
      .page-heading p, .net-state { display: none; }
      .content { padding: 14px 12px 24px; }
      .split-view { min-height: auto; display: block; }
      .split-list { border-right: 0; }
      .split-detail { border-top: 1px solid var(--line-strong); scroll-margin-top: 70px; }
      .form-grid, .detail-grid { grid-template-columns: 1fr; }
      .catalog-models { grid-template-columns: 1fr; }

      .search-box { min-width: 0; flex: 1 1 180px; }
    }

    function openCreateAgent() { overlayReturnFocus = document.activeElement; $("modal-root").innerHTML = '<div class="modal-backdrop" data-action="close-modal"><form class="modal" id="create-agent-form" role="dialog" aria-modal="true" aria-labelledby="create-agent-title" tabindex="-1"><div class="modal-head"><h2 class="modal-title" id="create-agent-title">New agent</h2></div><div class="modal-body"><div class="field"><label for="new-agent-slug">Profile slug</label><input id="new-agent-slug" required pattern="[a-z0-9][a-z0-9-]*" placeholder="research-assistant" autocomplete="off" /></div></div><div class="modal-actions"><button class="button" type="button" data-action="close-modal">取消</button><button class="button primary" type="submit">创建</button></div></form></div>'; setTimeout(function () { var input = $("new-agent-slug"); if (input) input.focus(); }, 0); }

      var selectedRoute = selection.routeValue || "", selectedModel = modelSelection.modelId || "";
      var personalBody = '<div class="version-row"><span>' + availability(personal.availability) + '</span><span>Version <b class="mono">' + esc(personal.authorityStateVersion == null ? "—" : personal.authorityStateVersion) + '</b></span><span>' + esc(formatTime(personal.updatedAtUtc)) + '</span></div><div class="model-body">' +
        '<form id="personal-model-form"><div class="form-grid"><div class="field"><label for="model-route">Default route</label><select id="model-route">' + routes.map(function (route) { return '<option value="' + esc(route.routeValue) + '"' + (route.routeValue === selectedRoute ? " selected" : "") + (route.allowed === false ? " disabled" : "") + '>' + esc(route.label || route.routeValue) + '</option>'; }).join("") + '</select></div><div class="field"><label for="model-id">Model</label><select id="model-id"></select></div></div><div style="margin-top:12px"><button class="button primary small" type="submit"' + (object(settings.capabilities).canSave === false ? " disabled" : "") + '>' + icon("save") + 'Save default</button></div></form>' +
        '<div class="route-list">' + (routes.length ? routes.map(renderRoute).join("") : emptyView("暂无可用路由")) + '</div></div>';

    function renderSource(source) { return '<div class="source-item"><div class="source-item-top"><strong class="mono">' + esc(source.sourceId) + '</strong><span class="badge violet">' + esc(source.modelSelectionMode || "catalog") + '</span></div><p>' + esc(source.serviceSlugSnapshot || source.catalogServiceId || source.userServiceId || "") + '</p><div class="model-tags">' + arr(source.modelIds).map(function (model) { return '<span class="model-tag">' + esc(model) + '</span>'; }).join("") + '</div></div>'; }
    function selectedRouteOption() { var select = $("model-route"), data = object(state.models), routes = arr(object(object(data.personalDefault).settings).routeOptions); return routes.find(function (route) { return route.routeValue === (select && select.value); }) || routes[0] || {}; }
    function syncModelOptions() { var target = $("model-id"); if (!target) return; var settings = object(object(object(state.models).personalDefault).settings), saved = object(settings.savedSelection), current = object(saved.modelSelection), route = selectedRouteOption(), catalog = object(route.modelCatalog), models = arr(catalog.modelIds), selected = route.routeValue === saved.routeValue ? current.modelId || "" : ""; target.innerHTML = '<option value=""' + (!selected ? " selected" : "") + '>Route default</option>' + models.map(function (model) { return '<option value="' + esc(model) + '"' + (model === selected ? " selected" : "") + '>' + esc(model) + '</option>'; }).join(""); }
    async function savePersonalModel() { try { var body = { routeValue: $("model-route").value, modelId: $("model-id").value || null }, receipt = await api("/api/ai/models/personal-default", jsonOptions("PUT", body)), settings = object(object(object(state.models).personalDefault).settings); settings.savedSelection = Object.assign({}, object(settings.savedSelection), { routeValue: body.routeValue, modelSelection: { kind: body.modelId ? "explicit_model" : "provider_default", modelId: body.modelId } }); state.receipts.models = acceptedReceipt("个人默认模型更新已接受", receipt); render(); toast("默认模型更新已接受，等待读模型确认", "success"); } catch (error) { if (!ignoredError(error)) toast(errorMessage(error), "error"); } }
    async function saveCatalog() { try { var data = object(state.models), catalog = object(data.catalog), body = { mode: $("catalog-mode").value, sources: parseJsonField("catalog-sources", []), expectedVersion: catalog.authorityStateVersion, idempotencyKey: idempotencyKey("model-catalog") }, receipt = await api("/api/ai/models/catalog", jsonOptions("PUT", body)); state.receipts.models = acceptedReceipt("模型目录更新已接受", receipt); render(); toast("模型目录更新已接受，等待读模型确认", "success"); } catch (error) { if (!ignoredError(error)) toast(errorMessage(error), "error"); } }

    function renderActivity() {
      if (state.loading.activity && !state.activity) return loadingView();
      if (state.errors.activity && !state.activity) return errorView(state.errors.activity);
      var data = object(state.activity), conversations = object(data.conversations), runs = object(data.runs), convoItems = arr(conversations.items), runItems = arr(runs.items);
      return '<div class="activity-controls"><span>' + availability(conversations.availability) + '</span><span>' + availability(runs.availability) + '</span><span class="toolbar-spacer"></span><span class="section-meta">' + esc(convoItems.length) + ' conversations · ' + esc(runItems.length) + ' runs</span></div><div class="activity-list"><section class="section"><div class="section-head"><h2 class="section-title">Conversations</h2><span class="section-meta">latest</span></div>' + (convoItems.length ? convoItems.map(function (item) { return '<div class="conversation-row"><div class="cell-title truncate">' + esc(item.title || item.conversationId) + '</div><div class="cell-sub mono truncate">' + esc(item.conversationId) + '</div><div class="conversation-meta"><span>' + esc(item.messageCount || 0) + ' messages</span><span>' + esc(item.taskStatus || "—") + '</span><span>' + esc(item.llmModel || item.llmRoute || "—") + '</span><span>' + esc(formatTime(item.updatedAtUtc)) + '</span></div></div>'; }).join("") : emptyView("暂无会话记录")) + '</section><section class="section"><div class="section-head"><h2 class="section-title">Workflow runs</h2><span class="section-meta">' + esc(runs.totalCount == null ? runItems.length : runs.totalCount) + '</span></div>' + (runItems.length ? runItems.map(function (run) { return '<button class="run-row" type="button" data-action="open-run" data-run-id="' + esc(run.runId) + '" aria-label="查看运行 ' + esc(run.workflowName || run.runId) + '"><span><span class="cell-title truncate" style="display:block">' + esc(run.workflowName || run.runId) + '</span><span class="cell-sub mono truncate" style="display:block">' + esc(run.runId) + ' · ' + esc(run.runOrigin || "") + '</span></span><span style="text-align:right">' + statusBadge(run.status) + '<span class="run-time" style="display:block;margin-top:4px">' + esc(formatTime(run.updatedAtUtc)) + '</span></span></button>'; }).join("") : emptyView("暂无运行记录")) + '</section></div>';
    }
    async function openRun(runId) { var requestEpoch = authEpoch, requestId = ++runDetailRequestId; if (!$("drawer-root").firstChild) overlayReturnFocus = document.activeElement; $("drawer-root").innerHTML = '<div class="drawer-backdrop" data-action="close-drawer"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="run-detail-title" data-run-id="' + esc(runId) + '" tabindex="-1"><div class="drawer-head"><div class="drawer-head-copy"><h2 class="drawer-title" id="run-detail-title">Run detail</h2><div class="drawer-sub mono">' + esc(runId) + '</div></div><button class="icon-button drawer-close" type="button" data-action="close-drawer" title="关闭" aria-label="关闭">' + icon("close") + '</button></div><div class="drawer-body">' + loadingView() + '</div></aside></div>'; state.runDetail = null; var closeButton = document.querySelector(".drawer-close"); if (closeButton) closeButton.focus();
      try { var detail = await api("/api/ai/activity/runs/" + encodeURIComponent(runId)); if (requestEpoch !== authEpoch || requestId !== runDetailRequestId) return; state.runDetail = detail; renderRunDrawer(runId); }
      catch (error) { if (!ignoredError(error) && requestEpoch === authEpoch && requestId === runDetailRequestId) { var drawer = document.querySelector(".drawer"), body = drawer && drawer.getAttribute("data-run-id") === runId ? drawer.querySelector(".drawer-body") : null; if (body) body.innerHTML = errorView(errorMessage(error), "refresh-run-detail"); } }
    }
    function renderRunDrawer(runId) { var root = $("drawer-root"), detail = object(state.runDetail), summary = object(detail.summary), stats = object(detail.statistics), usage = object(detail.usageTotals), steps = arr(detail.steps), timeline = arr(detail.timeline); if (!root.firstChild) return; root.innerHTML = '<div class="drawer-backdrop" data-action="close-drawer"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="run-detail-title" data-run-id="' + esc(runId) + '" tabindex="-1"><div class="drawer-head"><div class="drawer-head-copy"><h2 class="drawer-title" id="run-detail-title">' + esc(summary.workflowName || "Run detail") + '</h2><div class="drawer-sub mono">' + esc(runId) + '</div></div>' + statusBadge(summary.status) + '<button class="icon-button drawer-close" type="button" data-action="close-drawer" title="关闭" aria-label="关闭">' + icon("close") + '</button></div><div class="drawer-body"><div class="detail-grid">' + detailStat("Duration", formatDuration(summary.durationMs)) + detailStat("Steps", stats.completedSteps + "/" + stats.totalSteps) + detailStat("Tokens", usage.totalTokens == null ? "—" : usage.totalTokens) + detailStat("Version", detail.authorityStateVersion) + '</div>' +
        '<section class="form-section"><h3>Steps</h3>' + (steps.length ? '<div class="table-wrap"><table><thead><tr><th>Step</th><th>Outcome</th><th>Duration</th></tr></thead><tbody>' + steps.map(function (step) { return '<tr><td><div class="cell-title">' + esc(step.displayName || step.stepId) + '</div><div class="cell-sub mono">' + esc(step.stepId) + '</div></td><td>' + statusBadge(step.success === true ? "success" : step.success === false ? "failed" : step.outcome) + '</td><td class="mono">' + esc(formatDuration(step.durationMs)) + '</td></tr>'; }).join("") + '</tbody></table></div>' : emptyView("暂无步骤")) + '</section>' +
        '<section class="form-section"><h3>Timeline</h3>' + (timeline.length ? '<div class="timeline">' + timeline.map(function (event) { return '<div class="timeline-item"><div class="timeline-kind">' + esc(event.kind) + '</div><div class="timeline-meta">' + esc(event.stage || "") + (event.stepId ? " · " + esc(event.stepId) : "") + ' · ' + esc(formatTime(event.timestampUtc)) + '</div></div>'; }).join("") + '</div>' : emptyView("暂无时间线")) + '</section>' +
        (detail.finalOutput ? '<section class="form-section"><h3>Final output</h3><div class="output">' + esc(detail.finalOutput) + '</div></section>' : "") + '</div></aside></div>'; var closeButton = root.querySelector(".drawer-close"); if (closeButton) closeButton.focus(); }
    function detailStat(label, value) { return '<div class="detail-stat"><span>' + esc(label) + '</span><strong>' + esc(value == null ? "—" : value) + '</strong></div>'; }
    function closeDrawer() { runDetailRequestId += 1; var restore = overlayReturnFocus; $("drawer-root").innerHTML = ""; state.runDetail = null; overlayReturnFocus = null; if (restore && document.contains(restore)) restore.focus(); }

    document.addEventListener("click", function (event) {

      if (event.key === "Escape" && overlay) { event.preventDefault(); overlay.classList.contains("modal") ? closeModal() : closeDrawer(); return; }
      if (event.key !== "Tab" || !overlay) return;
      var focusable = Array.from(overlay.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')).filter(function (item) { return item.offsetParent !== null; });
      if (!focusable.length) { event.preventDefault(); overlay.focus(); return; }
      var first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
    document.addEventListener("submit", function (event) {
      if (event.target.id === "agent-editor") { event.preventDefault(); saveAgentDraft(); }
      if (event.target.id === "create-agent-form") { event.preventDefault(); createAgent(); }
      if (event.target.id === "personal-model-form") { event.preventDefault(); savePersonalModel(); }
      if (event.target.id === "catalog-form") { event.preventDefault(); saveCatalog(); }
    });
    $("login-button").addEventListener("click", beginLogin);
    window.addEventListener("hashchange", route);
    window.addEventListener("storage", function (event) { if (event.key !== TOKEN_KEY) return; var token = getToken(); if (token) enterApp(token); else requireLogin(""); });

    $("auth-brand-mark").innerHTML = icon("mark"); $("auth-mobile-mark").innerHTML = icon("mark"); $("brand-glyph").innerHTML = icon("mark"); $("mobile-brand").innerHTML = icon("mark"); hydrateIcons(document);
    var bootToken = getToken();
    if (bootToken) enterApp(bootToken); else requireLogin("");
  })();
