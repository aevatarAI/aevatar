<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Workflow Delivery Center · Aevatar</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --surface-strong: #eef2f6;
      --text: #1f2937;
      --heading: #101828;
      --muted: #667085;
      --faint: #98a2b3;
      --border: #e4e7ec;
      --border-strong: #cfd4dc;
      --primary: #1677ff;
      --primary-hover: #0958d9;
      --primary-soft: #e6f4ff;
      --primary-border: #91caff;
      --success: #138a52;
      --success-soft: #eaf8f1;
      --success-border: #a9dfc2;
      --warning: #b86100;
      --warning-soft: #fff6e8;
      --warning-border: #f0c98f;
      --danger: #cf3038;
      --danger-soft: #fff0f0;
      --danger-border: #f2b8bc;
      --header-height: 58px;
      --rail-width: 224px;
      --radius: 6px;
      --sans: 'AlibabaSans', 'Alibaba PuHuiTi 2.0', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 var(--sans);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { color: inherit; font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; letter-spacing: 0; }
    h1 { color: var(--heading); font-size: 24px; line-height: 1.25; }
    h2 { color: var(--heading); font-size: 17px; line-height: 1.35; }
    h3 { color: var(--heading); font-size: 14px; line-height: 1.4; }
    code, .mono { font-family: var(--mono); font-size: .92em; overflow-wrap: anywhere; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .boot, .gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .gate-panel {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .gate-mark {
      width: 42px;
      height: 42px;
      margin-bottom: 18px;
      display: grid;
      place-items: center;
      border: 1px solid var(--primary-border);
      border-radius: var(--radius);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 750;
    }
    .gate-panel p { margin-top: 8px; color: var(--muted); }
    .gate-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--surface-strong);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template: var(--header-height) minmax(0, 1fr) / var(--rail-width) minmax(0, 1fr);
    }
    .topbar {
      grid-column: 1 / -1;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: calc(var(--rail-width) - 20px);
      color: var(--heading);
      font-weight: 700;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      color: var(--primary);
      font-size: 12px;
    }
    .top-context {
      min-width: 0;
      flex: 1;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .account-copy { min-width: 0; text-align: right; }
    .account-copy strong, .account-copy span {
      display: block;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-copy span { color: var(--muted); font-size: 12px; }
    .avatar {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--heading);
      color: var(--surface);
      font-size: 11px;
      font-weight: 700;
    }
    .mobile-nav { display: none; }

    .rail {
      grid-row: 2;
      position: sticky;
      top: var(--header-height);
      height: calc(100vh - var(--header-height));
      padding: 18px 12px;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    .rail-label {
      padding: 0 10px 8px;
      color: var(--faint);
      font: 11px/1.4 var(--mono);
      text-transform: uppercase;
    }
    .rail-nav { display: grid; gap: 4px; }
    .nav-link {
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border-radius: var(--radius);
      color: var(--muted);
      font-weight: 550;
    }
    .nav-link:hover { background: var(--surface-subtle); color: var(--heading); }
    .nav-link.active { background: var(--surface-strong); color: var(--heading); font-weight: 700; }
    .nav-glyph {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font: 10px var(--mono);
    }

    .main {
      grid-row: 2;
      min-width: 0;
      padding: 22px 24px 48px;
    }
    .page { width: min(1380px, 100%); margin: 0 auto; }
    .page.narrow { width: min(1040px, 100%); }
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .page-head p { max-width: 760px; margin-top: 5px; color: var(--muted); }
    .page-actions, .inline-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .page-actions { justify-content: flex-end; }

    .button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 13px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--heading);
      font-weight: 650;
      white-space: nowrap;
    }
    .button:hover { background: var(--surface-strong); }
    .button.primary { border-color: var(--primary); background: var(--primary); color: var(--surface); }
    .button.primary:hover { border-color: var(--primary-hover); background: var(--primary-hover); }
    .button.secondary { border-color: var(--border-strong); background: var(--surface); }
    .button.secondary:hover { border-color: var(--muted); background: var(--surface-subtle); }
    .button.danger { border-color: var(--danger-border); background: var(--surface); color: var(--danger); }
    .button.quiet { padding-inline: 9px; color: var(--muted); }
    .button:disabled { cursor: not-allowed; opacity: .48; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-subtle);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.info { border-color: var(--primary-border); background: var(--primary-soft); color: var(--primary); }
    .badge.success { border-color: var(--success-border); background: var(--success-soft); color: var(--success); }
    .badge.warning { border-color: var(--warning-border); background: var(--warning-soft); color: var(--warning); }
    .badge.danger { border-color: var(--danger-border); background: var(--danger-soft); color: var(--danger); }

    .section {
      padding: 0 0 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .section:last-child { border-bottom: 0; }
    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }
    .section-head p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .work-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(330px, .65fr); gap: 16px; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
    .panel {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .panel-head { padding: 13px 15px; border-bottom: 1px solid var(--border); }
    .panel-head p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 15px; }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-subtle);
    }
    .notice.info { border-color: var(--primary-border); background: var(--primary-soft); }
    .notice.success { border-color: var(--success-border); background: var(--success-soft); }
    .notice.warning { border-color: var(--warning-border); background: var(--warning-soft); }
    .notice.danger { border-color: var(--danger-border); background: var(--danger-soft); }
    .notice-symbol {
      width: 22px;
      height: 22px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font: 11px var(--mono);
    }
    .notice p { margin-top: 2px; color: var(--muted); font-size: 12px; }

    .empty {
      min-height: 220px;
      display: grid;
      place-items: center;
      padding: 34px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty strong { display: block; margin-bottom: 4px; color: var(--heading); }
    .empty .button { margin-top: 14px; }

    .loading-lines { display: grid; gap: 9px; padding: 8px 0; }
    .loading-line {
      height: 14px;
      border-radius: 3px;
      background: var(--surface-strong);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loading-line:nth-child(2) { width: 82%; }
    .loading-line:nth-child(3) { width: 64%; }
    @keyframes pulse { 50% { opacity: .45; } }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th { background: var(--surface-subtle); color: var(--muted); font: 11px/1.35 var(--mono); text-transform: uppercase; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--surface-subtle); }
    .cell-title { color: var(--heading); font-weight: 650; }
    .cell-sub { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .cell-actions { text-align: right; white-space: nowrap; }

    .package-list { display: grid; }
    .package-option {
      width: 100%;
      min-height: 76px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      text-align: left;
    }
    .package-option:last-child { border-bottom: 0; }
    .package-option:hover { background: var(--surface-subtle); }
    .package-option.selected { background: var(--primary-soft); }
    .radio {
      width: 18px;
      height: 18px;
      border: 1px solid var(--border-strong);
      border-radius: 50%;
      background: var(--surface);
    }
    .package-option.selected .radio { border: 5px solid var(--primary); }
    .package-option p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .package-meta { color: var(--muted); font: 11px var(--mono); text-align: right; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: grid; gap: 5px; align-content: start; }
    .field.full { grid-column: 1 / -1; }
    .field label, .field-label { color: var(--heading); font-size: 12px; font-weight: 650; }
    .field small { color: var(--muted); }
    .required { color: var(--danger); }
    .input, .select, .textarea {
      width: 100%;
      min-height: 39px;
      padding: 8px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .textarea { min-height: 88px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--primary);
      outline: 0;
      box-shadow: 0 0 0 2px var(--primary-soft);
    }
    .input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] {
      border-color: var(--danger);
    }
    .field-error { color: var(--danger); font-size: 12px; }
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-height: 39px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-subtle);
    }
    .checkbox-row input { width: 17px; height: 17px; flex: none; margin-top: 1px; accent-color: var(--primary); }

    .definition { display: grid; grid-template-columns: 160px minmax(0, 1fr); }
    .definition dt, .definition dd { margin: 0; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .definition dt { color: var(--muted); }
    .definition dd { color: var(--heading); overflow-wrap: anywhere; }
    .definition dt:last-of-type, .definition dd:last-of-type { border-bottom: 0; }

    .team-list, .connection-list, .risk-list, .stage-list { display: grid; gap: 8px; }
    .team-option {
      width: 100%;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      text-align: left;
    }
    .team-option:hover:not(:disabled) { border-color: var(--primary-border); }
    .team-option.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
    .team-option:disabled { cursor: not-allowed; opacity: .55; }
    .team-option p { color: var(--muted); font-size: 12px; }

    .connection-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .connection-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-subtle);
      color: var(--primary);
      font-weight: 700;
    }
    .connection-row p { color: var(--muted); font-size: 12px; }

    .risk-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid var(--warning-border);
      border-radius: var(--radius);
      background: var(--warning-soft);
    }
    .risk-row input { width: 17px; height: 17px; flex: none; margin-top: 2px; accent-color: var(--warning); }
    .risk-row p { margin-top: 2px; color: var(--muted); font-size: 12px; }

    .action-bar {
      position: sticky;
      bottom: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin: 18px -24px -48px;
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(8px);
    }
    .action-copy { flex: 1; color: var(--muted); font-size: 12px; }

    .stage-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .stage-row:last-child { border-bottom: 0; }
    .stage-index {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 50%;
      color: var(--muted);
      font: 10px var(--mono);
    }
    .stage-row p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .receipt-grid { display: grid; grid-template-columns: 190px minmax(0, 1fr); }
    .receipt-grid div { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .receipt-grid div:nth-last-child(-n + 2) { border-bottom: 0; }
    .receipt-label { color: var(--muted); }
    .receipt-value { overflow-wrap: anywhere; }

    @media (max-width: 920px) {
      .shell { display: block; }
      .topbar { min-height: var(--header-height); flex-wrap: wrap; height: auto; padding: 10px 14px; }
      .brand { min-width: 0; flex: 1; }
      .brand span:last-child, .top-context, .account-copy { display: none; }
      .mobile-nav { width: 100%; display: flex; gap: 6px; overflow-x: auto; }
      .mobile-nav .nav-link { min-height: 36px; white-space: nowrap; }
      .rail { display: none; }
      .main { padding: 18px 14px 42px; }
      .work-grid, .detail-grid { grid-template-columns: 1fr; }
      .action-bar { margin: 18px -14px -42px; padding: 12px 14px; }
    }

    @media (max-width: 680px) {
      h1 { font-size: 21px; }
      .page-head { display: block; }
      .page-actions { justify-content: flex-start; margin-top: 12px; }
      .page-actions .button { flex: 1; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .table-wrap { border: 0; background: transparent; overflow: visible; }
      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tbody { display: grid; gap: 9px; }
      tbody tr { padding: 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
      tbody tr:hover { background: var(--surface); }
      td { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; padding: 4px 0; border: 0; }
      td::before { content: attr(data-label); color: var(--muted); font-size: 12px; }
      td.cell-actions { display: flex; margin-top: 7px; text-align: left; }
      td.cell-actions::before { display: none; }
      .package-option { grid-template-columns: 20px minmax(0, 1fr); }
      .package-meta { grid-column: 2; text-align: left; }
      .definition { grid-template-columns: 110px minmax(0, 1fr); }
      .connection-row { grid-template-columns: 38px minmax(0, 1fr); }
      .connection-row > :last-child { grid-column: 2; justify-self: start; }
      .action-bar { align-items: center; flex-direction: row; }
      .action-bar .action-copy { display: none; }
      .action-bar .button { flex: 1; min-width: 0; width: auto; }
      .receipt-grid { grid-template-columns: 115px minmax(0, 1fr); }
      .gate-panel { padding: 22px; }
    }
  </style>
</head>
<body>
  <div id="app" class="boot" aria-busy="true">
    <div class="spinner" role="status" aria-label="正在载入 Workflow Delivery Center"></div>
  </div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>

  <script>
  (function () {
    "use strict";

    const BACKEND_CONSOLE_CONFIG = __BACKEND_CONSOLE_CONFIG__;
    const OIDC = {
      authority: String(BACKEND_CONSOLE_CONFIG.authority || ""),
      clientId: String(BACKEND_CONSOLE_CONFIG.clientId || ""),
      scope: String(BACKEND_CONSOLE_CONFIG.scope || ""),
      storageKey: String(BACKEND_CONSOLE_CONFIG.storageKey || "")
    };
    OIDC.redirectUri = location.origin + "/auto/callback";

    const TOKEN_KEY = OIDC.storageKey + ":token";
    const PKCE_KEY = OIDC.storageKey + ":pkce";
    const REFRESH_SKEW_MS = 60000;
    const REFRESH_RETRY_MS = 30000;
    const INSTALLATION_REFRESH_MS = 4000;
    const PROJECTION_RETRY_MS = 500;
    const PROJECTION_RETRY_ATTEMPTS = 20;
    const PROJECTION_GRACE_MS = 90000;

    const app = document.getElementById("app");
    const announcer = document.getElementById("announcer");
    let refreshPromise = null;
    let refreshTimer = null;
    let installationTimer = null;

    const state = {
      session: null,
      route: null,
      routeSequence: 0,
      notice: null,
      packages: [],
      requests: [],
      selectedPackageVersionId: "",
      adminDraft: { targetScopeId: "", expiresAt: "", note: "" },
      adminCreateIdempotencyKey: "",
      adminBusy: false,
      adminRevokingId: "",
      adminCreated: null,
      adminError: null,
      listError: null,
      customer: null
    };

    function h(tag, attrs) {
      const element = document.createElement(tag);
      const children = Array.prototype.slice.call(arguments, 2);
      Object.keys(attrs || {}).forEach(function (key) {
        const value = attrs[key];
        if (value === undefined || value === null || value === false) return;
        if (key === "className") {
          element.className = value;
        } else if (key === "text") {
          element.textContent = value;
        } else if (key === "htmlFor") {
          element.htmlFor = value;
        } else if (key === "dataset") {
          Object.keys(value).forEach(function (name) { element.dataset[name] = value[name]; });
        } else if (key === "style" && typeof value === "object") {
          Object.assign(element.style, value);
        } else if (key.indexOf("on") === 0 && typeof value === "function") {
          element.addEventListener(key.slice(2).toLowerCase(), value);
        } else if (key in element && ["role", "aria-label", "aria-live", "aria-busy", "aria-current", "aria-pressed", "aria-invalid"].indexOf(key) < 0) {
          element[key] = value;
        } else {
          element.setAttribute(key, value === true ? "" : String(value));
        }
      });
      children.flat(Infinity).forEach(function (child) {
        if (child === undefined || child === null || child === false) return;
        element.append(child instanceof Node ? child : document.createTextNode(String(child)));
      });
      return element;
    }

    function announce(message) {

    function text(value, fallback) {
      return typeof value === "string" && value.trim() ? value.trim() : (fallback || "");

    function array(value) {
      return Array.isArray(value) ? value : [];
    }

    function object(value) {
      return value && typeof value === "object" && !Array.isArray(value) ? value : {};
    }

    function first(source, keys, fallback) {
      const value = object(source);
      for (let index = 0; index < keys.length; index += 1) {
        if (value[keys[index]] !== undefined && value[keys[index]] !== null) return value[keys[index]];
      }
      return fallback;
    }

    function items(source, keys) {
      if (Array.isArray(source)) return source;
      const value = object(source);
      for (let index = 0; index < keys.length; index += 1) {
        if (Array.isArray(value[keys[index]])) return value[keys[index]];
      }
      return [];
    }

        hour: "2-digit", minute: "2-digit"

    function safeHttpUrl(value) {
      if (!text(value)) return "";

        if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return "";
        return parsed.toString();

    function absoluteHttpUrl(value) {

    function initials(name) {

    function readToken() {
      try {
        const token = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
        return token && token.access_token ? token : null;
      } catch (error) {
        return null;
      }
    }

    function writeToken(token) {
      if (!token || !token.access_token) {
        clearToken();
        return;
      }
      localStorage.setItem(TOKEN_KEY, JSON.stringify(token));
      scheduleTokenRefresh(token);
    }

    function clearToken() {
      if (refreshTimer) window.clearTimeout(refreshTimer);
      refreshTimer = null;
      localStorage.removeItem(TOKEN_KEY);
    }

    function decodeJwt(token) {
      try {
        let part = String(token || "").split(".")[1];
        if (!part) return {};
        part = part.replace(/-/g, "+").replace(/_/g, "/");
        part += "=".repeat((4 - part.length % 4) % 4);
        const bytes = Uint8Array.from(atob(part), function (character) { return character.charCodeAt(0); });
        return JSON.parse(new TextDecoder().decode(bytes));
      } catch (error) {
        return {};
      }
    }

    function tokenExpiry(token) {
      if (!token) return 0;
      const claims = decodeJwt(token.access_token);
      if (Number.isFinite(Number(claims.exp))) return Number(claims.exp) * 1000;
      if (Number.isFinite(Number(token.obtained_at)) && Number.isFinite(Number(token.expires_in))) {
        return Number(token.obtained_at) + Number(token.expires_in) * 1000;
      }
      return 0;
    }

    function refreshErrorMessage(body, status) {
      const code = String(first(body, ["error", "code"], "")).toLowerCase();
      const description = text(first(body, ["error_description", "message", "detail"], ""));
      if (code === "invalid_grant") return "登录会话已失效，请重新使用 NyxID 登录。";
      if (code.indexOf("inactive") >= 0 || description.toLowerCase().indexOf("inactive") >= 0) {
        return "NyxID 登录客户端已停用，请联系管理员处理。";
      }
      return "无法续期 NyxID 会话（" + status + "）。";
    }

    async function refreshAccessToken(force) {
      if (refreshPromise) return refreshPromise;
      const active = readToken();
      if (!active || !active.refresh_token) return null;
      const expiry = tokenExpiry(active);
      if (!force && expiry && expiry - Date.now() > REFRESH_SKEW_MS) return active;

      const refreshToken = active.refresh_token;
      refreshPromise = (async function () {
        const form = new URLSearchParams();
        form.set("grant_type", "refresh_token");
        form.set("refresh_token", refreshToken);
        form.set("client_id", OIDC.clientId);
        let response;
        try {
          response = await fetch(OIDC.authority.replace(/\/+$/, "") + "/oauth/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: form.toString()
          });
        } catch (error) {
          scheduleRefreshRetry();
          throw new Error("暂时无法连接 NyxID 续期服务。");
        }

        let body = {};
        try { body = await response.json(); } catch (error) { body = {}; }
        const current = readToken();
        if (!response.ok) {
          if (current && current.refresh_token !== refreshToken) return current;
          if (response.status === 400 || response.status === 401) clearToken();
          throw new Error(refreshErrorMessage(body, response.status));
        }
        if (!body.access_token) throw new Error("NyxID 续期响应缺少 access_token。");
        if (!current || current.refresh_token !== refreshToken) return current;
        const merged = Object.assign({}, active, body, {
          refresh_token: body.refresh_token || active.refresh_token,
          obtained_at: Date.now()
        });
        writeToken(merged);
        return merged;
      })();

      try {
        return await refreshPromise;
      } finally {
        refreshPromise = null;
      }
    }

    function scheduleRefreshRetry() {
      if (refreshTimer) window.clearTimeout(refreshTimer);
      refreshTimer = window.setTimeout(function () {
        refreshAccessToken(true).catch(function () { scheduleRefreshRetry(); });
      }, REFRESH_RETRY_MS);
    }

    function scheduleTokenRefresh(token) {
      if (refreshTimer) window.clearTimeout(refreshTimer);
      refreshTimer = null;
      if (!token || !token.refresh_token) return;
      const expiry = tokenExpiry(token);
      if (!expiry) return;
      const wait = Math.max(0, expiry - Date.now() - REFRESH_SKEW_MS);
      refreshTimer = window.setTimeout(function () {
        refreshAccessToken(true).catch(function () { scheduleRefreshRetry(); });
      }, wait);
    }

    async function ensureAccessToken() {
      const token = readToken();
      if (!token) return null;
      const expiry = tokenExpiry(token);
      if (token.refresh_token && expiry && expiry - Date.now() <= REFRESH_SKEW_MS) {
        try { return await refreshAccessToken(true) || token; }
        catch (error) {
          if (readToken()) scheduleRefreshRetry();
          return readToken();
        }
      }
      scheduleTokenRefresh(token);
      return token;
    }

    function loginReturnTo() {
      const validHash = location.hash.indexOf("#/") === 0 &&
        /^#[A-Za-z0-9._~!$&'()*+,;=:@/?%-]*$/.test(location.hash);
      return location.pathname + (validHash ? location.hash : "");
    }

    function base64Url(buffer) {
      const value = btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)));
      return value.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function randomHex(length) {
      const bytes = new Uint8Array(length);
      crypto.getRandomValues(bytes);
      let result = "";
      for (let index = 0; index < bytes.length; index += 1) {
        result += ("0" + bytes[index].toString(16)).slice(-2);
      }
      return result.slice(0, length);
    }

    function newIdempotencyKey() {
      return typeof crypto.randomUUID === "function" ? crypto.randomUUID() : randomHex(32);
    }

    async function beginLogin() {
      if (!OIDC.authority || !OIDC.clientId) {
        renderLoginGate("Backend Console 的 NyxID OIDC 配置缺失。");
        return;
      }
      const verifier = randomHex(64);
      const stateValue = randomHex(32);
      const challenge = base64Url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
      sessionStorage.setItem(PKCE_KEY, JSON.stringify({
        verifier: verifier,
        state: stateValue,
        returnTo: loginReturnTo(),
        resources: [],
        tokenPurpose: ""
      }));
      const url = new URL(OIDC.authority.replace(/\/+$/, "") + "/oauth/authorize");
      url.searchParams.set("response_type", "code");
      url.searchParams.set("client_id", OIDC.clientId);
      url.searchParams.set("redirect_uri", OIDC.redirectUri);
      url.searchParams.set("scope", OIDC.scope);
      url.searchParams.set("state", stateValue);
      url.searchParams.set("code_challenge", challenge);
      url.searchParams.set("code_challenge_method", "S256");
      location.assign(url.toString());
    }

    function logout() {
      clearToken();
      state.session = null;
      stopInstallationRefresh();
      renderLoginGate("已退出 NyxID。");

    class ApiError extends Error {
      constructor(status, message, body, code) {
        super(message);
        this.name = "ApiError";
        this.status = status || 0;
        this.body = object(body);
        this.code = code || text(first(body, ["code", "errorCode", "type"], ""));
      }
    }

    function apiErrorMessage(status, body) {
      const direct = first(body, ["message", "detail", "title", "error_description"], "");
      if (typeof direct === "string" && direct.trim()) return direct.trim();
      if (status === 403) return "当前 NyxID 身份没有执行此操作的权限。";
      if (status === 404) return "请求的交付资源不存在，或当前身份不可见。";
      if (status === 409) return "资源状态已变化，请刷新后重试。";
      if (status === 422) return "提交内容未通过服务端校验。";
      if (status === 503) return "Delivery Backend 暂不可用，请稍后重试。";
      return "请求失败（" + status + "）。";
    }

    class DeliveryApi {
      async request(path, options) {
        const settings = Object.assign({}, options || {});
        const token = await ensureAccessToken();
        if (!token || !token.access_token) throw new ApiError(401, "需要使用 NyxID 登录。");

        const send = async function (activeToken) {
          const headers = new Headers(settings.headers || {});
          headers.set("Accept", "application/json");
          headers.set("Authorization", "Bearer " + activeToken.access_token);
          if (settings.body !== undefined && !(settings.body instanceof FormData) && !headers.has("Content-Type")) {
            headers.set("Content-Type", "application/json");
          }
          const init = Object.assign({}, settings, { headers: headers });
          return fetch(path, init);
        };

        let activeToken = token;
        let response;
        try {
          response = await send(activeToken);
        } catch (error) {
          throw new ApiError(0, "无法连接 Delivery Backend，请检查网络后重试。", {}, "network_error");
        }

        if (response.status === 401) {
          let replacement = readToken();
          if (!replacement || replacement.access_token === activeToken.access_token) {
            try { replacement = activeToken.refresh_token ? await refreshAccessToken(true) : null; }
            catch (error) { replacement = null; }
          }
          if (replacement && replacement.access_token !== activeToken.access_token) {
            activeToken = replacement;
            try { response = await send(activeToken); }
            catch (error) {
              throw new ApiError(0, "无法连接 Delivery Backend，请检查网络后重试。", {}, "network_error");
            }
          }
        }

        let data = {};
        const contentType = response.headers.get("content-type") || "";
        try {
          data = contentType.indexOf("json") >= 0
            ? await response.json()
            : { message: await response.text() };
        } catch (error) {
          data = {};
        }

        if (response.status === 401) {
          const current = readToken();
          if (!current || current.access_token === activeToken.access_token) clearToken();
          throw new ApiError(401, "登录已过期，请重新使用 NyxID 登录。", data, "unauthorized");
        }
        if (!response.ok) {
          throw new ApiError(response.status, apiErrorMessage(response.status, data), data);
        }
        return {
          data: data,
          status: response.status,
          location: response.headers.get("Location") || ""
        };
      }

      // GET /api/delivery/session is the only authority for UI role and scope.
      session() { return this.request("/api/delivery/session"); }
      packages() { return this.request("/api/delivery/packages"); }
      requests() { return this.request("/api/delivery/requests"); }
      getRequest(deliveryId) {
        return this.request("/api/delivery/requests/" + encodeURIComponent(deliveryId));
      }
      validateAccess(deliveryId) {
        return this.request(
          "/api/delivery/requests/" + encodeURIComponent(deliveryId) + ":validate-access",
          { method: "POST" }
        );
      }
      createRequest(body) {
        return this.request("/api/delivery/requests", { method: "POST", body: JSON.stringify(body) });
      }
      revokeRequest(deliveryId) {
        return this.request(
          "/api/delivery/requests/" + encodeURIComponent(deliveryId) + ":revoke",
          { method: "POST", body: "{}" }
        );
      }
      createConnectLink(scopeId, deliveryId, slotKey) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/delivery-requests/" +
          encodeURIComponent(deliveryId) + "/connections/" + encodeURIComponent(slotKey) + ":connect",
          { method: "POST" }
        );
      }
      connectStatus(scopeId, deliveryId, slotKey) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/delivery-requests/" +
          encodeURIComponent(deliveryId) + "/connections/" + encodeURIComponent(slotKey)
        );
      }
      refreshConnectStatus(scopeId, deliveryId, slotKey) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/delivery-requests/" +
          encodeURIComponent(deliveryId) + "/connections/" + encodeURIComponent(slotKey) + ":refresh",
          { method: "POST" }
        );
      }
      existingConnections(scopeId, deliveryId, slotKey) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/delivery-requests/" +
          encodeURIComponent(deliveryId) + "/connections/" + encodeURIComponent(slotKey) + "/available"
        );
      }
      attachExistingConnection(scopeId, deliveryId, slotKey, userServiceId) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/delivery-requests/" +
          encodeURIComponent(deliveryId) + "/connections/" + encodeURIComponent(slotKey) + ":attach",
          { method: "POST", body: JSON.stringify({ userServiceId: userServiceId }) }
        );
      }
      teams(scopeId) {
        return this.request("/api/scopes/" + encodeURIComponent(scopeId) + "/teams");
      }
      refreshAuthorizationCatalog() {
        return this.request(
          "/api/auth/nyxid/authorization-catalog:refresh",
          { method: "POST" }
        );
      }
      createTeam(scopeId, displayName) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/teams",
          { method: "POST", body: JSON.stringify({ displayName: displayName }) }
        );
      }
      validateConfig(scopeId, deliveryId, body) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/delivery-requests/" +
          encodeURIComponent(deliveryId) + ":validate-config",
          { method: "POST", body: JSON.stringify(body) }
        );
      }
      publish(scopeId, deliveryId, body) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/delivery-requests/" +
          encodeURIComponent(deliveryId) + ":publish",
          { method: "POST", body: JSON.stringify(body) }
        );
      }
      installation(scopeId, installationId) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/installations/" +
          encodeURIComponent(installationId)
        );
      }
      retry(scopeId, installationId) {
        return this.request(
          "/api/scopes/" + encodeURIComponent(scopeId) + "/installations/" +
          encodeURIComponent(installationId) + ":retry",
          { method: "POST", body: "{}" }
        );
      }
    }

    function isAdminSession() {
      const session = object(state.session);
      if (session.isAdmin === true || session.canCreateDeliveries === true || session.canCreateDeliveryRequests === true) return true;
      const roles = array(first(session, ["roles", "permissions"], [])).map(function (role) {
        return typeof role === "string" ? role.toLowerCase() : "";

      return roles.some(function (role) {

    function parseRoute() {
      const raw = location.hash || "";
      if (!raw || raw === "#/" || raw === "#") return { name: "root" };
      if (raw === "#/fde") return { name: "fde" };
      if (raw === "#/customer") return { name: "customer-list" };
      const prefix = "#/customer/";
      if (raw.indexOf(prefix) === 0) {
        const encoded = raw.slice(prefix.length);
        if (!encoded || encoded.indexOf("/") >= 0) return { name: "not-found" };
        try {
          const deliveryId = decodeURIComponent(encoded);
          return deliveryId ? { name: "customer-detail", deliveryId: deliveryId } : { name: "not-found" };
        } catch (error) {
          return { name: "not-found" };
        }
      }
      return { name: "not-found" };
    }

      if (name === "fde") return "#/fde";

    function renderLoginGate(reason) {
      app.className = "gate";
      app.removeAttribute("aria-busy");
      app.replaceChildren(
        h("main", { className: "gate-panel" },
          h("div", { className: "gate-mark", "aria-hidden": "true", text: "AV" }),
          h("h1", { text: "Workflow Delivery Center" }),
          h("p", { text: reason || "使用 NyxID 登录后查看交付给你的工作流。" }),
          notice("info", "NyxID 身份边界", "链接本身不授予权限，交付范围由当前登录身份和服务端会话共同确定。"),
          h("div", { className: "gate-actions" },
            h("button", { className: "button primary", type: "button", onClick: beginLogin, text: "使用 NyxID 登录" })
          )
        )
      );

    function errorDescription(error) {
      if (!(error instanceof ApiError)) {
        return { tone: "danger", title: "页面载入失败", message: error && error.message ? error.message : String(error) };
      }
      // Ordinary Delivery login finalizes the NyxID binding server-side. A missing binding
      // here therefore means that finalization or its committed projection is not ready yet.
      if (error.code === "DELIVERY_AUTHORIZATION_BINDING_REQUIRED") {
        return {
          tone: "warning",
          title: "NyxID 授权绑定尚未就绪",
          message: "请稍后重试发布；若持续出现，请退出后使用同一个 NyxID 账号重新登录 Delivery Center。"
        };
      }
      const states = {
        403: { title: "没有访问权限", message: error.message },
        404: { title: "交付不存在", message: error.message },
        409: { title: "状态发生冲突", message: error.message },
        422: { title: "配置未通过校验", message: error.message },
        503: { title: "Delivery Backend 暂不可用", message: error.message }
      };
      return Object.assign({ tone: error.status === 403 || error.status === 404 ? "warning" : "danger" },
        states[error.status] || { title: error.status ? "请求失败" : "无法连接服务", message: error.message });
    }

    function renderRouteError(error, retry, active) {
      if (error instanceof ApiError && error.status === 401) {
        renderLoginGate(error.message);
        return;
      }
      const description = errorDescription(error);
      renderShell(description.title, description.message, active || "customer",
        h("div", { className: "panel" },
          emptyBlock(description.title, description.message,
            h("button", { className: "button secondary", type: "button", onClick: retry, text: "重试" }))
        ),
        { narrow: true }
      );
    }

    function renderNotFound() {
      renderShell("页面不存在", "这个 Delivery Center 路由无法识别。", "customer",
        h("div", { className: "panel" },
          emptyBlock("页面不存在", "请返回你的工作流列表。",
            h("a", { className: "button primary", href: routeHref("customer-list"), text: "返回列表" }))
        ),
        { narrow: true }
      );

    async function loadRoute() {
      stopInstallationRefresh();
      const route = parseRoute();
      state.route = route;
      state.notice = null;
      const sequence = ++state.routeSequence;

      if (route.name === "root") {
        location.replace(isAdminSession() ? routeHref("fde") : routeHref("customer-list"));
        return;
      }
      if (route.name === "fde") {
        if (!isAdminSession()) {
          renderShell("没有访问权限", "只有 Aevatar 管理员可以创建交付。", "customer",
            notice("warning", "管理员权限必需", "当前会话仍可查看交付给自己的工作流。"),
            { narrow: true, actions: [h("a", { className: "button primary", href: routeHref("customer-list"), text: "查看我的工作流" })] }
          );
          return;
        }
        await loadAdmin(sequence);
        return;
      }
      if (route.name === "customer-list") {
        await loadCustomerList(sequence);
        return;
      }
      if (route.name === "customer-detail") {
        await loadCustomerDetail(route.deliveryId, sequence);
        return;
      }
      renderNotFound();
    }

    function packageVersionId(pkg) {
      return text(first(pkg, ["packageVersionId", "versionId", "id"], ""));
    }

    function packageName(pkg) {
      return text(first(pkg, ["displayName", "workflowName", "name", "packageId"], ""), "未命名 Workflow");
    }

    function setAdminDraft(key, value) {
      state.adminDraft[key] = value;
      state.adminCreateIdempotencyKey = "";
    }

    function deliveryPackage(detail) {
      return object(first(detail, ["package", "workflowPackage"], {}));
    }

    function deliveryAcceptancePolicy(detail) {
      return object(first(deliveryPackage(detail), ["acceptancePolicy"], {}));
    }

    function eligibleTriggerOptions(detail) {
      const options = array(first(detail, ["availableTriggerIntents"], []));
      const policy = deliveryAcceptancePolicy(detail);
      const automatic = first(policy, ["automaticAcceptanceSupported"], false) === true;
      return automatic ? options : options.filter(function (option) {
        return triggerOptionKind(option) === "none";
      });
    }

    function deliveryValue(detail, keys, fallback) {
      const own = first(detail, keys, undefined);
      return own !== undefined ? own : first(deliveryPackage(detail), keys, fallback);
    }

    function deliveryId(request) {
      return text(first(request, ["deliveryId", "id"], ""));

    async function loadAdmin(sequence) {
      renderAdminLoading();
      state.adminError = null;
      try {
        const results = await Promise.all([api.packages(), api.requests()]);
        if (sequence !== state.routeSequence) return;
        state.packages = items(results[0].data, ["items", "packages", "packageVersions"]);
        state.requests = items(results[1].data, ["items", "requests", "deliveryRequests"]);
        if (!state.packages.some(function (pkg) { return packageVersionId(pkg) === state.selectedPackageVersionId; })) {
          state.selectedPackageVersionId = state.packages.length ? packageVersionId(state.packages[0]) : "";

        renderRouteError(error, loadRoute, "fde");

    async function createDeliveryRequest() {
      if (state.adminBusy) return;
      const selected = state.packages.find(function (pkg) {
        return packageVersionId(pkg) === state.selectedPackageVersionId;
      });
      const targetScopeId = text(state.adminDraft.targetScopeId);
      if (!selected || !packageVersionId(selected) || !targetScopeId) {
        state.notice = { tone: "warning", title: "信息不完整", message: "请选择 Workflow 并填写目标 Scope。" };
        renderAdmin();
        return;
      }
      const body = {
        workflowName: text(first(selected, ["workflowName"], "")),
        packageVersionId: packageVersionId(selected),
        targetScopeId: targetScopeId,
        idempotencyKey: state.adminCreateIdempotencyKey || newIdempotencyKey()
      };
      state.adminCreateIdempotencyKey = body.idempotencyKey;
      if (!body.workflowName) {
        state.notice = { tone: "danger", title: "Package 契约不完整", message: "服务端未返回 workflowName，创建操作已 fail closed。" };
        renderAdmin();
        return;
      }
      if (state.adminDraft.expiresAt) {
        const expires = new Date(state.adminDraft.expiresAt);
        if (Number.isNaN(expires.getTime())) {
          state.notice = { tone: "warning", title: "到期时间无效", message: "请检查到期时间后重试。" };
          renderAdmin();
          return;
        }
        body.expiresAt = expires.toISOString();
      }
      if (text(state.adminDraft.note)) body.note = text(state.adminDraft.note);

      state.adminBusy = true;
      state.notice = null;
      renderAdmin();
      try {
        const result = await api.createRequest(body);
        const record = object(first(result.data, ["deliveryRequest", "request"], result.data));
        state.adminCreated = { record: record, httpStatus: result.status };
        const id = deliveryId(record);
        if (id && !state.requests.some(function (item) { return deliveryId(item) === id; })) {
          state.requests.unshift(record);
        }
        state.adminDraft = { targetScopeId: "", expiresAt: "", note: "" };
        state.adminCreateIdempotencyKey = "";
        announce(result.status === 202 ? "交付创建请求已受理" : "交付已创建");
      } catch (error) {
        const description = errorDescription(error);
        state.notice = { tone: description.tone, title: description.title, message: description.message };
      } finally {
        state.adminBusy = false;
        renderAdmin();
      }
    }

    async function revokeDeliveryRequest(id) {
      if (!id || state.adminRevokingId) return;
      if (!window.confirm("撤销后客户将不能继续配置或发布此交付。确认提交撤销请求？")) return;
      state.adminRevokingId = id;
      state.notice = null;
      renderAdmin();
      try {
        const result = await api.revokeRequest(id);
        state.notice = {
          tone: "info",
          title: "撤销请求已受理",
          message: result.status === 202
            ? "HTTP 202 不是完成状态；请刷新列表观察服务端提交结果。"
            : "服务端已确认撤销。"
        };
        announce("撤销请求已受理");
      } catch (error) {
        const description = errorDescription(error);
        state.notice = { tone: description.tone, title: description.title, message: description.message };
      } finally {
        state.adminRevokingId = "";
        renderAdmin();
      }
    }
