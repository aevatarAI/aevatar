    function fieldsFromSchema(schema) {
      if (Array.isArray(schema)) {
        return schema.map(function (field) { return object(field); }).filter(openCustomerField);
      }
      const root = object(schema);
      const properties = object(root.properties);
      const required = array(root.required);
      return Object.keys(properties).map(function (key) {
        return Object.assign({ key: key, required: required.indexOf(key) >= 0 }, object(properties[key]));
      }).filter(openCustomerField);
    }

    function fieldKey(field) {
      return text(first(field, ["key", "name", "id"], ""));
    }

    function fieldType(field) {
      const raw = first(field, ["type", "kind", "valueType"], "string");
      if (typeof raw === "number") {
        return ({ 1: "string", 2: "integer", 3: "number", 4: "boolean" })[raw] || "string";
      }
      const normalized = String(raw || "string").toLowerCase();
      if (/^[1-4]$/.test(normalized)) {
        return ({ "1": "string", "2": "integer", "3": "number", "4": "boolean" })[normalized];
      }
      return normalized;
    }

    function openCustomerField(field) {
      const key = fieldKey(field);
      if (!key || key === "user_service_id") return false;
      if (field.readOnly === true || field.customerEditable === false || field.system === true) return false;
      const kind = String(first(field, ["kind", "source"], "")).toLowerCase();
      return kind !== "connection" && kind !== "connection_slot";
    }

    function schemaDefaults(fields, existing) {
      const values = Object.assign({}, object(existing));
      fields.forEach(function (field) {
        const key = fieldKey(field);
        if (values[key] !== undefined) return;
        const type = fieldType(field);
        if (field.defaultValue !== undefined) values[key] = field.defaultValue;
        else if (field.default !== undefined) values[key] = field.default;
        else if (type === "boolean") values[key] = false;
        else values[key] = "";
        if (type === "boolean" && typeof values[key] === "string") {
          values[key] = values[key].toLowerCase() === "true";
        }
      });
      return values;
    }

    function customerDetailFromResponse(data) {
      return object(first(data, ["deliveryRequest", "request", "item"], data));
    }

    function normalizeInstallation(data) {
      return object(first(data, ["installation", "item"], data));
    }

    function deliveryStateVersion(value) {
      const parsed = Number(first(value, ["deliveryStateVersion", "stateVersion"], 0));
      return Number.isSafeInteger(parsed) && parsed > 0 ? parsed : 0;
    }

    function customerScopeId(detail) {
      return text(first(detail, ["targetScopeId", "scopeId"], ""));
    }

    function customerInstallationId(detail) {
      const installation = object(first(detail, ["installation", "latestInstallation"], {}));
      return text(first(detail, ["installationId", "latestInstallationId"], "")) ||
        text(first(installation, ["installationId", "id"], ""));
    }

    function initCustomerState(deliveryIdValue, detail) {
      const fields = fieldsFromSchema(deliveryValue(detail, ["variableSchema"], []));
      const existing = first(detail, ["customerConfig", "configuration"], {});
      const selectedTeamId = text(first(detail, ["teamId", "selectedTeamId"], ""));
      const existingTrigger = object(first(detail, ["triggerIntent"], {}));
      const availableTriggers = eligibleTriggerOptions(detail);
      let triggerIntent = text(first(existingTrigger, ["kind", "type"], first(detail, ["triggerIntentId"], "")));
      if (triggerIntent && !availableTriggers.some(function (option) {
        return triggerOptionKind(option) === triggerIntent;
      })) {
        triggerIntent = "";
      }
      if (!triggerIntent && availableTriggers.length) {
        const preferred = availableTriggers.find(function (option) {
          return triggerOptionKind(option) === "one_shot";
        }) || availableTriggers[0];
        triggerIntent = triggerOptionKind(preferred);
      }
      return {
        deliveryId: deliveryIdValue,
        detail: detail,
        teams: [],
        pendingTeams: Object.create(null),
        teamsError: null,
        fields: fields,
        values: schemaDefaults(fields, existing),
        selectedTeamId: selectedTeamId,
        triggerIntent: triggerIntent,
        triggerCron: text(first(existingTrigger, ["cron"], "")),
        triggerTimeZone: text(first(existingTrigger, ["timeZone", "timezone"], "UTC"), "UTC"),
        validation: null,
        validationError: null,
        confirmedRisks: new Set(),
        installation: object(first(detail, ["installation", "latestInstallation"], {})),
        installationId: customerInstallationId(detail),
        installationError: null,
        acceptedHttpStatus: 0,
        acceptedAtMs: 0,
        installationProjectionBaselineVersion: 0,
        deliveryStateVersion: deliveryStateVersion(detail),
        idempotencyKey: "",
        connectionRuntime: Object.create(null),
        connectionErrors: Object.create(null),
        existingConnections: Object.create(null),
        existingConnectionErrors: Object.create(null),
        existingConnectionLoading: Object.create(null),
        selectedExistingConnectionIds: Object.create(null),
        consoleUrl: absoluteHttpUrl(first(detail, ["consoleUrl"], "")),
        newTeamName: "",
        busy: "",
        clientError: ""
      };
    }

    function renderCustomerDetailLoading() {
      renderShell("Workflow 交付", "正在读取交付定义、Team 和安装状态。", "customer",
        h("div", { className: "detail-grid" },
          h("div", { className: "panel" }, h("div", { className: "panel-body" }, loadingBlock())),
          h("div", { className: "panel" }, h("div", { className: "panel-body" }, loadingBlock()))
        ),
        { narrow: true }
      );
    }

    async function loadCustomerDetail(deliveryIdValue, sequence) {
      renderCustomerDetailLoading();
      try {
        let result = null;
        for (let attempt = 0; attempt < PROJECTION_RETRY_ATTEMPTS; attempt += 1) {
          try {
            result = isAdminSession()
              ? await api.getRequest(deliveryIdValue)
              : await api.validateAccess(deliveryIdValue);
            break;
          } catch (error) {
            const retryableProjectionMiss = error instanceof ApiError && error.status === 404 &&
              attempt + 1 < PROJECTION_RETRY_ATTEMPTS;
            if (!retryableProjectionMiss) throw error;
            await new Promise(function (resolve) { window.setTimeout(resolve, PROJECTION_RETRY_MS); });
            if (sequence !== state.routeSequence) return;
          }
        }
        if (!result) {
          throw new ApiError(503, "交付读模型暂不可用。", {}, "delivery_projection_unavailable");
        }
        if (sequence !== state.routeSequence) return;
        const detail = customerDetailFromResponse(result.data);
        const returnedId = deliveryId(detail);
        if (returnedId && returnedId !== deliveryIdValue) {
          throw new ApiError(409, "服务端返回的 Delivery ID 与当前路由不一致。", {}, "delivery_identity_mismatch");
        }
        const scopeId = customerScopeId(detail);
        if (!scopeId) throw new ApiError(503, "交付响应缺少 targetScopeId，无法安全读取 Team。", {}, "missing_target_scope");
        state.customer = initCustomerState(deliveryIdValue, detail);
        renderCustomerDetail();

        const tasks = [
          loadTeams(scopeId, deliveryIdValue, sequence),
          loadExistingConnections(scopeId, deliveryIdValue, sequence)
        ];
        if (state.customer.installationId) {
          tasks.push(loadInstallation(scopeId, state.customer.installationId, sequence, true));
        }
        await Promise.all(tasks);
      } catch (error) {
        if (sequence !== state.routeSequence) return;
        renderRouteError(error, loadRoute, "customer");
      }
    }

    function normalizeCreatedTeam(data, expectedScopeId) {
      const createdTeam = object(first(data, ["team", "item"], data));
      const createdTeamId = teamId(createdTeam);
      const createdScopeId = text(first(createdTeam, ["scopeId"], ""));
      if (!createdTeamId) {
        throw new ApiError(503, "创建 Team 的响应缺少 teamId，无法继续发布。", createdTeam, "missing_team_id");
      }
      if (!createdScopeId) {
        throw new ApiError(503, "创建 Team 的响应缺少 scopeId，无法确认归属。", createdTeam, "missing_team_scope");
      }
      if (createdScopeId !== expectedScopeId) {
        throw new ApiError(409, "创建 Team 的响应 scope 与当前交付不一致。", createdTeam, "team_scope_mismatch");
      }
      return createdTeam;
    }

    function mergeTeamRoster(authoritativeTeams, pendingTeams) {
      const teams = array(authoritativeTeams).slice();
      const seenTeamIds = new Set(teams.map(teamId).filter(Boolean));
      Object.keys(object(pendingTeams)).forEach(function (id) {
        if (seenTeamIds.has(id)) {
          delete pendingTeams[id];
          return;
        }
        teams.push(pendingTeams[id]);
      });
      return teams;
    }

    async function loadTeams(scopeId, deliveryIdValue, sequence) {
      try {
        const result = await api.teams(scopeId);
        if (sequence !== state.routeSequence || !state.customer || state.customer.deliveryId !== deliveryIdValue) return;
        state.customer.teams = mergeTeamRoster(
          items(result.data, ["items", "teams"]),
          state.customer.pendingTeams
        );
        state.customer.teamsError = null;
        renderCustomerDetail();
      } catch (error) {
        if (sequence !== state.routeSequence || !state.customer) return;
        if (Object.keys(state.customer.pendingTeams).length && state.customer.teams.length) {
          state.customer.teamsError = null;
          renderCustomerDetail();
          return;
        }
        state.customer.teamsError = error;
        renderCustomerDetail();
      }
    }

    function fieldOptions(field) {
      const raw = array(first(field, ["options", "enum", "values"], []));
      return raw.map(function (option) {
        if (option && typeof option === "object") {
          return {
            value: first(option, ["value", "id", "key"], ""),
            label: text(first(option, ["label", "displayName", "name"], ""), String(first(option, ["value", "id", "key"], "")))
          };
        }
        return { value: option, label: String(option) };
      });
    }

    function fieldError(field) {
      if (!state.customer || !state.customer.validation) return "";
      const key = fieldKey(field);
      const validation = object(state.customer.validation);
      const map = object(first(validation, ["fieldErrors", "fields"], {}));
      const direct = map[key];
      if (typeof direct === "string") return direct;
      if (Array.isArray(direct)) return direct.join(" ");
      const match = array(validation.errors).find(function (error) {
        return text(first(error, ["field", "key", "path"], "")) === key;
      });
      return match ? text(first(match, ["message", "detail"], "")) : "";
    }

    function invalidateValidation() {
      if (!state.customer) return;
      state.customer.validation = null;
      state.customer.validationError = null;
      state.customer.confirmedRisks.clear();
      state.customer.idempotencyKey = "";
      state.customer.clientError = "配置已变化，请重新校验后发布。";
      const publishButton = document.getElementById("publishDelivery");
      if (publishButton) publishButton.disabled = true;
      const validationRegion = document.getElementById("validationRegion");
      if (validationRegion) {
        validationRegion.replaceChildren(notice("warning", "需要重新校验", state.customer.clientError));
      }
    }

    function renderVariableField(field, index) {
      const key = fieldKey(field);
      const id = "variable-" + index;
      const label = text(first(field, ["label", "title", "displayName"], ""), key);
      const description = text(first(field, ["description", "helpText"], ""));
      const type = fieldType(field);
      const control = String(first(field, ["control", "format"], "")).toLowerCase();
      const required = field.required === true;
      const value = state.customer.values[key];
      const error = fieldError(field);
      const common = {
        id: id,
        name: key,
        "aria-invalid": error ? "true" : "false",
        onInput: function (event) {
          if (type === "boolean") state.customer.values[key] = event.target.checked;
          else state.customer.values[key] = event.target.value;
          invalidateValidation();
        }
      };
      let input;
      const options = fieldOptions(field);
      if (options.length) {
        input = h("select", Object.assign({ className: "select", value: value === undefined ? "" : String(value) }, common),
          h("option", { value: "", text: "请选择" }),
          options.map(function (option) {
            return h("option", { value: String(option.value), selected: String(option.value) === String(value), text: option.label });
          })
        );
      } else if (type === "boolean" || control === "switch" || control === "checkbox") {
        input = h("label", { className: "checkbox-row", htmlFor: id },
          h("input", Object.assign({ type: "checkbox", checked: Boolean(value) }, common)),
          h("span", { text: description || "启用此选项" })
        );
      } else if (type === "object" || type === "array" || control === "textarea" || control === "multiline") {
        const rendered = (type === "object" || type === "array") && typeof value !== "string"
          ? JSON.stringify(value, null, 2)
          : String(value || "");
        input = h("textarea", Object.assign({ className: "textarea", value: rendered }, common));
      } else {
        let inputType = "text";
        if (type === "number" || type === "integer") inputType = "number";
        else if (control === "date" || control === "datetime-local") inputType = control;
        else if (control === "password" || control === "secret") inputType = "password";
        input = h("input", Object.assign({
          className: "input",
          type: inputType,
          value: value === undefined ? "" : String(value),
          min: field.minimum,
          max: field.maximum,
          minlength: field.minLength,
          maxlength: field.maxLength,
          autocomplete: inputType === "password" ? "new-password" : "off"
        }, common));
      }

      return h("div", { className: "field" },
        h("label", { htmlFor: id }, label, required ? h("span", { className: "required", text: " *" }) : null),
        input,
        description && !(type === "boolean" || control === "switch" || control === "checkbox")
          ? h("small", { text: description }) : null,
        error ? h("div", { className: "field-error", text: error }) : null
      );
    }

    function teamId(team) {
      return text(first(team, ["teamId", "id"], ""));
    }

    function teamLifecycleStage(team) {
      return text(first(team, ["lifecycleStage"], "")).toLowerCase();
    }

    function teamPublishability(team) {
      const lifecycleStage = teamLifecycleStage(team);
      if (lifecycleStage === "archived") {
        return { canPublish: false, detail: "Team 已归档，不能发布。", status: "blocked", label: "已归档" };
      }
      if (lifecycleStage !== "active") {
        return { canPublish: false, detail: "Team 当前状态不可发布。", status: "blocked", label: "不可发布" };
      }
      if (first(team, ["canPublish", "canWrite"], true) === false) {
        return { canPublish: false, detail: "没有发布权限", status: "blocked", label: "只读" };
      }
      return {
        canPublish: true,
        detail: text(first(team, ["permission", "role"], ""), "可发布"),
        status: "valid",
        label: "可发布"
      };
    }

    function teamCanPublish(team) {
      return teamPublishability(team).canPublish;
    }

    function selectedTeamCanPublish() {
      if (!state.customer || !state.customer.selectedTeamId) return false;
      const selectedTeam = array(state.customer.teams).find(function (team) {
        return teamId(team) === state.customer.selectedTeamId;
      });
      return Boolean(selectedTeam && teamCanPublish(selectedTeam));
    }

    function renderTeamSection() {
      if (state.customer.teamsError) {
        const description = errorDescription(state.customer.teamsError);
        return notice(description.tone, description.title, description.message);
      }
      if (!state.customer.teams.length) {
        // Publish requires an existing Team, and a brand-new scope has none. Without a way
        // to create one here the delivery link is not self-sufficient, so the empty state
        // owns the bootstrap instead of sending the customer to another product.
        return emptyBlock(
          "没有可发布的 Team",
          "当前 scope 还没有 Team。Workflow 会安装到 Team 下，请先创建一个。",
          h("div", { className: "form-grid", style: { marginTop: "12px", textAlign: "left" } },
            h("div", { className: "field" },
              h("label", { className: "label", htmlFor: "delivery-new-team-name", text: "Team 名称" }),
              h("input", {
                className: "input",
                id: "delivery-new-team-name",
                type: "text",
                value: state.customer.newTeamName,
                placeholder: "例如：HR 自动化",
                disabled: state.customer.busy === "create-team",
                onInput: function (event) { state.customer.newTeamName = event.currentTarget.value; }
              })
            ),
            // Not disabled on empty input: every render replaces the whole document, so
            // re-rendering per keystroke to recompute `disabled` would destroy focus
            // mid-typing. The name is validated on submit instead.
            h("button", {
              className: "button primary",
              type: "button",
              disabled: state.customer.busy === "create-team",
              onClick: createTeam,
              text: state.customer.busy === "create-team" ? "正在创建..." : "创建 Team"
            })
          ));
      }
      return h("div", { className: "team-list" }, state.customer.teams.map(function (team) {
        const id = teamId(team);
        const publishability = teamPublishability(team);
        const canPublish = publishability.canPublish;
        const selected = canPublish && id && id === state.customer.selectedTeamId;
        return h("button", {
          className: "team-option" + (selected ? " selected" : ""),
          type: "button",
          disabled: !id || !canPublish,
          "aria-pressed": selected ? "true" : "false",
          onClick: function () {
            state.customer.selectedTeamId = id;
            invalidateValidation();
            renderCustomerDetail();
          }
        },
          h("span", { className: "radio", "aria-hidden": "true" }),
          h("span", null,
            h("strong", { text: text(first(team, ["displayName", "name"], ""), id || "未命名 Team") }),
            h("p", { text: publishability.detail })
          ),
          badge(publishability.status, publishability.label)
        );
      }));
    }

    function connectionSlots() {
      const detail = state.customer.detail;
      const directDefinitions = first(detail, ["connectionSlots"], undefined);
      const definitions = array(directDefinitions !== undefined
        ? directDefinitions
        : first(deliveryPackage(detail), ["connectionSlots"], []));
      const snapshots = array(first(detail, ["connections"], []));
      const merged = definitions.map(function (definition) {
        const key = connectionSlotKey(definition);
        const snapshot = snapshots.find(function (candidate) {
          return connectionSlotKey(candidate) === key;
        });
        const runtime = state.customer ? object(state.customer.connectionRuntime[key]) : {};
        return Object.assign({}, object(definition), object(snapshot), runtime);
      });
      snapshots.forEach(function (snapshot) {
        const key = connectionSlotKey(snapshot);
        const exists = merged.some(function (candidate) {
          return connectionSlotKey(candidate) === key;
        });
        if (!exists) {
          const runtime = state.customer ? object(state.customer.connectionRuntime[key]) : {};
          merged.push(Object.assign({}, object(snapshot), runtime));
        }
      });
      return merged;
    }

    function connectionSlotKey(slot) {
      return text(first(slot, ["key", "slotKey", "slotId", "name"], ""));
    }

    function connectionReference(slot) {
      return text(first(slot, ["connectionReference", "userServiceId", "reference"], ""));
    }

    function connectionStatus(slot) {
      const explicit = text(first(slot, ["status", "connectionStatus"], "")).toLowerCase();
      if (explicit) return explicit;
      return connectionReference(slot) ? "connected" : "needs_action";
    }

    async function createConnection(slotKey) {
      if (!state.customer || state.customer.busy || !slotKey) return;
      const deliveryIdValue = state.customer.deliveryId;
      const sequence = state.routeSequence;
      const scopeId = customerScopeId(state.customer.detail);
      state.customer.busy = "connect:" + slotKey;
      delete state.customer.connectionErrors[slotKey];
      renderCustomerDetail();
      try {
        const result = await api.createConnectLink(
          scopeId,
          deliveryIdValue,
          slotKey
        );
        if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
        const response = object(first(result.data, ["connection", "result"], result.data));
        const returnedSlot = text(first(response, ["slotKey", "key"], ""));
        if (returnedSlot && returnedSlot !== slotKey) {
          throw new ApiError(409, "服务端返回的连接 slot 与当前操作不一致。", response, "connection_slot_mismatch");
        }
        const expectedStatusUrl = "/api/scopes/" + encodeURIComponent(scopeId) +
          "/delivery-requests/" + encodeURIComponent(deliveryIdValue) +
          "/connections/" + encodeURIComponent(slotKey);
        const receiptStatus = text(first(response, ["status"], ""));
        const connectLinkId = text(first(response, ["connectLinkId", "connect_link_id"], ""));
        const statusUrl = text(first(response, ["statusUrl", "status_url"], ""));
        if (result.status !== 202 || receiptStatus !== "begin_accepted" || !connectLinkId ||
            statusUrl !== expectedStatusUrl || result.location !== expectedStatusUrl) {
          throw new ApiError(502, "服务端没有返回可对账的连接受理回执。", response, "invalid_connection_receipt");
        }
        const connectUrl = safeHttpUrl(first(response, ["connectUrl", "connect_url"], ""));
        if (!connectUrl) {
          throw new ApiError(503, "服务端未返回可用的 NyxID connectUrl。", response, "missing_connect_url");
        }
        state.customer.connectionRuntime[slotKey] = Object.assign({}, response, { connectUrl: connectUrl });
        invalidateValidation();
        state.notice = { tone: "info", title: "连接请求已受理", message: "请在 NyxID 完成连接，然后返回这里显式检查投影状态。" };
      } catch (error) {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.connectionErrors[slotKey] = error;
        }
      } finally {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.busy = "";
          renderCustomerDetail();
        }
      }
    }

    async function loadExistingConnections(scopeId, deliveryIdValue, sequence) {
      const slotKeys = connectionSlots().map(connectionSlotKey).filter(Boolean);
      await Promise.all(slotKeys.map(async function (slotKey) {
        if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
        state.customer.existingConnectionLoading[slotKey] = true;
        delete state.customer.existingConnectionErrors[slotKey];
        try {
          const result = await api.existingConnections(scopeId, deliveryIdValue, slotKey);
          if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
          const response = object(result.data);
          const returnedSlot = text(first(response, ["slotKey", "key"], ""));
          if (returnedSlot && returnedSlot !== slotKey) {
            throw new ApiError(409, "服务端返回的已有连接 slot 与当前交付不一致。", response, "connection_slot_mismatch");
          }
          const candidates = items(response, ["items", "connections"]);
          state.customer.existingConnections[slotKey] = candidates;
          const selected = text(state.customer.selectedExistingConnectionIds[slotKey]);
          if (!candidates.some(function (candidate) {
            return text(first(candidate, ["userServiceId", "id"], "")) === selected;
          })) {
            state.customer.selectedExistingConnectionIds[slotKey] = candidates.length
              ? text(first(candidates[0], ["userServiceId", "id"], ""))
              : "";
          }
        } catch (error) {
          if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
            state.customer.existingConnectionErrors[slotKey] = error;
          }
        } finally {
          if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
            state.customer.existingConnectionLoading[slotKey] = false;
            renderCustomerDetail();
          }
        }
      }));
    }

    async function attachExistingConnection(slotKey) {
      if (!state.customer || state.customer.busy || !slotKey) return;
      const userServiceId = text(state.customer.selectedExistingConnectionIds[slotKey]);
      if (!userServiceId) return;
      const deliveryIdValue = state.customer.deliveryId;
      const sequence = state.routeSequence;
      const scopeId = customerScopeId(state.customer.detail);
      state.customer.busy = "attach:" + slotKey;
      delete state.customer.connectionErrors[slotKey];
      renderCustomerDetail();
      try {
        const result = await api.attachExistingConnection(
          scopeId,
          deliveryIdValue,
          slotKey,
          userServiceId
        );
        if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
        const response = object(first(result.data, ["connection", "result"], result.data));
        const returnedSlot = text(first(response, ["slotKey", "key"], ""));
        const returnedUserServiceId = text(first(response, ["userServiceId", "id"], ""));
        if (returnedSlot !== slotKey || returnedUserServiceId !== userServiceId ||
            connectionStatus(response) !== "completed") {
          throw new ApiError(502, "服务端没有确认所选的 NyxID 连接。", response, "invalid_attach_receipt");
        }
        state.customer.connectionRuntime[slotKey] = response;
        invalidateValidation();
        state.notice = {
          tone: "success",
          title: "已使用现有 NyxID 连接",
          message: "所选 UserService 已绑定到当前交付，可以继续校验并发布。"
        };
      } catch (error) {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.connectionErrors[slotKey] = error;
        }
      } finally {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.busy = "";
          renderCustomerDetail();
        }
      }
    }

    function customerRouteIsCurrent(deliveryIdValue, sequence) {
      return Boolean(state.customer) && state.routeSequence === sequence &&
        state.customer.deliveryId === deliveryIdValue;
    }

    function connectionPollingIsTerminal(status) {
      return ["completed", "connected", "ready", "active", "failed", "expired"].indexOf(status) >= 0;
    }

    async function recheckConnection(slotKey) {
      if (!state.customer || state.customer.busy || !slotKey) return;
      const deliveryIdValue = state.customer.deliveryId;
      const sequence = state.routeSequence;
      const scopeId = customerScopeId(state.customer.detail);
      state.customer.busy = "connection-status:" + slotKey;
      delete state.customer.connectionErrors[slotKey];
      renderCustomerDetail();
      try {
        const accepted = await api.refreshConnectStatus(
          scopeId,
          deliveryIdValue,
          slotKey
        );
        if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
        const acceptedBody = object(accepted.data);
        if (accepted.status !== 202 || text(first(acceptedBody, ["status"], "")) !== "refresh_accepted") {
          throw new ApiError(502, "服务端没有返回可验证的连接刷新受理回执。", acceptedBody, "invalid_refresh_receipt");
        }

        state.notice = {
          tone: "info",
          title: "连接刷新已受理",
          message: "正在等待 Aevatar 投影确认 NyxID 状态；受理回执不会被当作已连接。"
        };
        renderCustomerDetail();

        let response = null;
        const prior = object(state.customer.connectionRuntime[slotKey]);
        const expectedConnectLinkId = text(first(prior, ["connectLinkId", "connect_link_id"], ""));
        for (let attempt = 0; attempt < PROJECTION_RETRY_ATTEMPTS; attempt += 1) {
          if (attempt > 0) {
            await new Promise(function (resolve) { window.setTimeout(resolve, PROJECTION_RETRY_MS); });
            if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
          }
          const result = await api.connectStatus(
            scopeId,
            deliveryIdValue,
            slotKey
          );
          if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
          response = object(first(result.data, ["connection", "result"], result.data));
          const returnedSlot = text(first(response, ["slotKey", "key"], ""));
          if (returnedSlot && returnedSlot !== slotKey) {
            throw new ApiError(409, "服务端返回的连接 slot 与当前操作不一致。", response, "connection_slot_mismatch");
          }
          const observedConnectLinkId = text(first(response, ["connectLinkId", "connect_link_id"], ""));
          if (!observedConnectLinkId ||
              (expectedConnectLinkId && observedConnectLinkId !== expectedConnectLinkId)) {
            throw new ApiError(409, "连接状态属于另一个 NyxID connect link。", response, "connection_link_mismatch");
          }
          if (connectionPollingIsTerminal(connectionStatus(response))) {
            break;
          }
        }

        if (!response) {
          throw new ApiError(503, "连接状态读模型暂不可用。", {}, "connection_projection_unavailable");
        }
        const returnedSlot = text(first(response, ["slotKey", "key"], ""));
        if (returnedSlot && returnedSlot !== slotKey) {
          throw new ApiError(409, "服务端返回的连接 slot 与当前操作不一致。", response, "connection_slot_mismatch");
        }
        state.customer.connectionRuntime[slotKey] = Object.assign({}, prior, response);
        const refreshedStatus = connectionStatus(response);
        if (["completed", "connected", "ready", "active"].indexOf(refreshedStatus) >= 0) {
          delete state.customer.connectionRuntime[slotKey].connectUrl;
          state.notice = { tone: "success", title: "NyxID 连接已确认", message: "连接引用由服务端保存，浏览器不会把它写入发布请求。" };
        } else {
          if (["failed", "expired"].indexOf(refreshedStatus) >= 0) {
            delete state.customer.connectionRuntime[slotKey].connectUrl;
          }
          state.notice = { tone: "info", title: "连接尚未完成", message: "Aevatar 投影仍为 pending；页面不会根据刷新受理回执推进到 connected。" };
        }
        invalidateValidation();
      } catch (error) {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.connectionErrors[slotKey] = error;
        }
      } finally {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.busy = "";
          renderCustomerDetail();
        }
      }
    }

    function renderConnections() {
      const slots = connectionSlots();
      if (!slots.length) return h("p", { style: { color: "var(--muted)" }, text: "此 Workflow 不需要外部连接。" });
      const scopeKind = text(first(state.session, ["scopeKind"], "")).toLowerCase();
      if (scopeKind && scopeKind !== "personal" && scopeKind !== "user") {
        return notice(
          "warning",
          "组织 Scope 连接暂不支持",
          "当前 NyxID connect-link contract 仅支持登录用户的个人 scope；此交付保持 needs_action。"
        );
      }
      return h("div", { className: "connection-list" }, slots.map(function (slot) {
        const slotKey = connectionSlotKey(slot);
        const status = connectionStatus(slot);
        const url = safeHttpUrl(first(slot, ["connectUrl", "connect_url"], ""));
        const label = text(first(slot, ["label", "displayName", "provider", "key"], ""), "外部服务");
        const reference = connectionReference(slot);
        const connected = ["connected", "completed", "ready", "active"].indexOf(status) >= 0 || Boolean(reference);
        const pending = status === "pending";
        const honestStatus = connected ? "connected" : (pending ? "pending" : "needs_action");
        const busy = state.customer.busy.endsWith(":" + slotKey);
        const error = state.customer.connectionErrors[slotKey];
        const inventoryError = state.customer.existingConnectionErrors[slotKey];
        const inventoryLoading = state.customer.existingConnectionLoading[slotKey] === true;
        const existing = array(state.customer.existingConnections[slotKey]);
        const selectedExistingId = text(state.customer.selectedExistingConnectionIds[slotKey]);
        const actions = [];
        if (!connected && !pending && existing.length) {
          actions.push(h("select", {
            className: "select",
            "aria-label": label + " 已有 NyxID 连接",
            value: selectedExistingId,
            disabled: busy,
            style: { width: "min(260px, 100%)" },
            onChange: function (event) {
              state.customer.selectedExistingConnectionIds[slotKey] = event.target.value;
            }
          }, existing.map(function (candidate) {
            const id = text(first(candidate, ["userServiceId", "id"], ""));
            const candidateLabel = text(first(candidate, ["label", "displayName"], ""), id);
            return h("option", { value: id, selected: id === selectedExistingId, text: candidateLabel + " · " + id });
          })));
          actions.push(h("button", {
            className: "button secondary",
            type: "button",
            disabled: busy || !selectedExistingId,
            onClick: function () { attachExistingConnection(slotKey); },
            text: busy ? "正在验证..." : "使用已有连接"
          }));
        }
        if (!connected && url) {
          actions.push(h("a", {
            className: "button secondary",
            href: url,
            target: "_blank",
            rel: "noopener noreferrer",
            text: "前往 NyxID 连接"
          }));
        }
        if (!connected && (pending || url)) {
          actions.push(h("button", {
            className: "button secondary",
            type: "button",
            disabled: busy,
            onClick: function () { recheckConnection(slotKey); },
            text: busy ? "正在检查..." : "检查连接状态"
          }));
        } else if (!connected) {
          actions.push(h("button", {
            className: "button secondary",
            type: "button",
            disabled: busy || !slotKey,
            onClick: function () { createConnection(slotKey); },
            text: busy ? "正在创建..." : "创建 NyxID 连接"
          }));
        }
        return h("div", { className: "connection-row" },
          h("span", { className: "connection-mark", "aria-hidden": "true", text: label.slice(0, 1).toUpperCase() }),
          h("div", null,
            h("strong", { text: label }),
            h("p", {
              text: connected
                ? (reference ? "连接引用 " + reference : "服务端已确认连接")
                : (url ? "请在 NyxID 完成个人连接后显式检查状态。" :
                  (existing.length ? "可复用当前 NyxID 账号下已验证的个人连接。" :
                    (inventoryLoading ? "正在检查已有 NyxID 连接。" : "needs_action：尚未创建可用的 NyxID 连接。")))
            }),
            error ? h("div", { className: "field-error", text: errorDescription(error).message }) : null,
            inventoryError ? h("div", { className: "field-error", text: errorDescription(inventoryError).message }) : null
          ),
          h("div", { className: "inline-actions" }, badge(honestStatus), actions)
        );
      }));
    }

    function triggerOptions() {
      return eligibleTriggerOptions(state.customer.detail);
    }

    function triggerOptionKind(option) {
      return String(typeof option === "string"
        ? option
        : first(option, ["kind", "type", "key", "intentId"], "")).trim().toLowerCase();
    }

    function renderTriggerIntent() {
      const options = triggerOptions();
      const policy = deliveryAcceptancePolicy(state.customer.detail);
      const automatic = first(policy, ["automaticAcceptanceSupported"], false) === true;
      const manualNotice = automatic ? null : notice(
        "warning",
        "仅支持发布，自动验收不可用",
        text(
          first(policy, ["limitation"], ""),
          "此 Workflow package 未声明自动验收能力；发布后不会自动进入 Ready。"
        )
      );
      if (!options.length) {
        return h("section", { className: "section" },
          manualNotice,
          emptyBlock("没有可用的触发方式", "服务端未返回与该验收策略匹配的 trigger intent。")
        );
      }
      const select = h("select", {
        className: "select",
        id: "triggerIntent",
        value: state.customer.triggerIntent,
        onChange: function (event) {
          state.customer.triggerIntent = event.target.value;
          invalidateValidation();
          renderCustomerDetail();
        }
      },
        options.map(function (option) {
          const value = triggerOptionKind(option);
          const label = typeof option === "string" ? option : text(first(option, ["label", "displayName", "name"], ""), String(value));
          return h("option", { value: String(value), selected: String(value) === state.customer.triggerIntent, text: label });
        })
      );
      const cronFields = state.customer.triggerIntent === "cron"
        ? h("div", { className: "form-grid", style: { marginTop: "12px" } },
            h("div", { className: "field" },
              h("label", { htmlFor: "triggerCron", text: "Cron" }),
              h("input", {
                className: "input mono",
                id: "triggerCron",
                type: "text",
                autocomplete: "off",
                required: true,
                value: state.customer.triggerCron,
                placeholder: "0 9 * * 1-5",
                onInput: function (event) {
                  state.customer.triggerCron = event.target.value;
                  invalidateValidation();
                }
              })
            ),
            h("div", { className: "field" },
              h("label", { htmlFor: "triggerTimeZone", text: "时区" }),
              h("input", {
                className: "input",
                id: "triggerTimeZone",
                type: "text",
                autocomplete: "off",
                required: true,
                value: state.customer.triggerTimeZone,
                placeholder: "Asia/Singapore",
                onInput: function (event) {
                  state.customer.triggerTimeZone = event.target.value;
                  invalidateValidation();
                }
              })
            )
          )
        : null;
      return h("section", { className: "section" },
        h("div", { className: "section-head" },
          h("div", null, h("h2", { text: "触发方式" }), h("p", { text: "Schedule 是独立 trigger intent，不修改 Workflow YAML。" }))
        ),
        manualNotice,
        h("div", { className: "field" }, h("label", { htmlFor: "triggerIntent", text: "Trigger intent" }), select),
        cronFields
      );
    }

    function riskConfirmations() {
      if (!state.customer.validation) return [];
      return array(first(state.customer.validation, ["requiredConfirmations", "riskConfirmations", "confirmations"], []));
    }

    function riskKey(risk) {
      const callSiteId = text(first(risk, ["callSiteId"], ""));
      const digest = text(first(risk, ["requestContractDigest"], ""));
      const attestedRisk = text(first(risk, ["attestedRisk"], ""));
      return callSiteId && digest && attestedRisk
        ? callSiteId + "\u0000" + digest + "\u0000" + attestedRisk
        : "";
    }

    function allRisksConfirmed() {
      const risks = riskConfirmations();
      return risks.every(function (risk) {
        const key = riskKey(risk);
        return key && state.customer.confirmedRisks.has(key);
      });
    }

    function validationIsPublishable() {
      if (!selectedTeamCanPublish()) return false;
      const validation = object(state.customer.validation);
      if (!state.customer.validation || validation.valid !== true) return false;
      if (Number(validation._httpStatus) === 202) return false;
      return Boolean(state.customer.idempotencyKey) && allRisksConfirmed();
    }

    function renderValidationRegion() {
      const region = h("div", { id: "validationRegion" });
      if (state.customer.validationError) {
        const description = errorDescription(state.customer.validationError);
        region.append(notice(description.tone, description.title, description.message));
        const errors = array(first(state.customer.validationError.body, ["errors", "validationErrors"], []));
        if (errors.length) {
          region.append(h("ul", null, errors.map(function (error) {
            return h("li", { text: typeof error === "string" ? error : text(first(error, ["message", "detail"], ""), "校验失败") });
          })));
        }
        return region;
      }
      if (!state.customer.validation) {
        if (state.customer.clientError) region.append(notice("warning", "需要重新校验", state.customer.clientError));
        else region.append(notice("info", "尚未校验", "选择 Team 并完成客户配置后，先运行服务端校验。"));
        return region;
      }
      const validation = state.customer.validation;
      if (validation._httpStatus === 202) {
        region.append(notice("info", "校验请求已受理", "HTTP 202 不代表校验通过。请重新读取交付状态后再发布。"));
        return region;
      }
      if (validation.valid !== true) {
        region.append(notice("warning", "配置未通过校验", "请按服务端返回的问题修改后重新校验。"));
      } else {
        region.append(notice("success", "服务端校验通过", "风险确认由服务端生成；本次配置使用稳定的发布幂等键。"));
      }
      const errors = array(first(validation, ["findings", "errors", "validationErrors"], []));
      if (errors.length) {
        region.append(h("ul", null, errors.map(function (error) {
          return h("li", { text: typeof error === "string" ? error : text(first(error, ["message", "detail"], ""), "校验问题") });
        })));
      }
      const risks = riskConfirmations();
      if (validation.valid === true && risks.length) {
        region.append(
          h("div", { className: "risk-list", style: { marginTop: "12px" } }, risks.map(function (risk) {
            const key = riskKey(risk);
            const missingContract = !key;
            const label = text(first(risk, ["summary", "label", "title", "description"], ""), "确认此高风险调用");
            return h("label", { className: "risk-row" },
              h("input", {
                type: "checkbox",
                checked: key && state.customer.confirmedRisks.has(key),
                disabled: missingContract,
                onChange: function (event) {
                  if (!key) return;
                  if (event.target.checked) state.customer.confirmedRisks.add(key);
                  else state.customer.confirmedRisks.delete(key);
                  const publish = document.getElementById("publishDelivery");
                  if (publish) publish.disabled = !validationIsPublishable();
                }
              }),
              h("span", null,
                h("strong", { text: label }),
                h("p", {
                  text: missingContract
                    ? "服务端未返回完整 confirmation contract，已 fail closed。"
                    : "callSiteId、requestContractDigest 与 attestedRisk 将原样提交，页面不自行计算。"
                })
              )
            );
          }))
        );
      }
      return region;
    }

    function collectCustomerConfig() {
      const result = {};
      state.customer.fields.forEach(function (field) {
        const key = fieldKey(field);
        let value = state.customer.values[key];
        const type = fieldType(field);
        if ((type === "object" || type === "array") && typeof value === "string") {
          if (!value.trim()) value = type === "array" ? [] : {};
          else {
            try { value = JSON.parse(value); }
            catch (error) { throw new Error("字段“" + text(first(field, ["label", "title"], ""), key) + "”不是有效 JSON。"); }
          }
        } else if (type === "number" || type === "integer") {
          if (value === "") value = null;
          else {
            value = Number(value);
            if (!Number.isFinite(value) || (type === "integer" && !Number.isInteger(value))) {
              throw new Error("字段“" + text(first(field, ["label", "title"], ""), key) + "”不是有效" + (type === "integer" ? "整数" : "数字") + "。");
            }
          }
        } else if (type === "boolean") {
          value = Boolean(value);
        }
        result[key] = value;
      });
      return result;
    }

    function configurationBody() {
      const body = {
        teamId: state.customer.selectedTeamId,
        customerConfig: collectCustomerConfig()
      };
      if (state.customer.triggerIntent) {
        const selected = triggerOptions().find(function (option) {
          return triggerOptionKind(option) === state.customer.triggerIntent;
        });
        body.triggerIntent = { kind: selected ? triggerOptionKind(selected) : state.customer.triggerIntent };
        if (state.customer.triggerIntent === "cron") {
          body.triggerIntent.cron = text(state.customer.triggerCron) || null;
          body.triggerIntent.timeZone = text(state.customer.triggerTimeZone) || null;
        } else if (state.customer.triggerIntent === "one_shot" && text(state.customer.triggerTimeZone)) {
          body.triggerIntent.timeZone = text(state.customer.triggerTimeZone);
        }
      }
      return body;
    }

    async function validateCustomerConfig() {
      if (!state.customer || state.customer.busy) return;
      if (!selectedTeamCanPublish()) {
        state.customer.clientError = "请先选择一个 active 且具备发布权限的 Team。";
        renderCustomerDetail();
        return;
      }
      let body;
      try { body = configurationBody(); }
      catch (error) {
        state.customer.clientError = error.message;
        renderCustomerDetail();
        return;
      }
      const deliveryIdValue = state.customer.deliveryId;
      const sequence = state.routeSequence;
      const scopeId = customerScopeId(state.customer.detail);
      state.customer.busy = "validate";
      state.customer.clientError = "";
      state.customer.validationError = null;
      state.customer.validation = null;
      state.customer.confirmedRisks.clear();
      renderCustomerDetail();
      try {
        const triggerKind = text(first(object(body.triggerIntent), ["kind"], "")).toLowerCase();
        if (triggerKind === "one_shot" || triggerKind === "cron") {
          const catalogRefresh = await api.refreshAuthorizationCatalog();
          if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
          const catalog = object(catalogRefresh.data);
          if (first(catalog, ["ready"], false) !== true) {
            throw new ApiError(
              503,
              "NyxID 持久授权目录仍在同步，请稍后重试校验。",
              catalog,
              "authorization_catalog_pending"
            );
          }
        }
        const result = await api.validateConfig(
          scopeId,
          deliveryIdValue,
          body
        );
        if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
        const validation = object(first(result.data, ["validation", "result"], result.data));
        validation._httpStatus = result.status;
        state.customer.validation = validation;
        if (result.status !== 202 && validation.valid === true) {
          state.customer.idempotencyKey = newIdempotencyKey();
        }
        announce(result.status === 202 ? "校验请求已受理" : (validation.valid === true ? "配置校验通过" : "配置校验未通过"));
      } catch (error) {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.validationError = error;
        }
      } finally {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.busy = "";
          renderCustomerDetail();
        }
      }
    }

    async function publishCustomerDelivery() {
      if (!state.customer || state.customer.busy || !validationIsPublishable()) return;
      let body;
      try { body = configurationBody(); }
      catch (error) {
        state.customer.clientError = error.message;
        renderCustomerDetail();
        return;
      }
      const validation = object(state.customer.validation);
      const deliveryIdValue = state.customer.deliveryId;
      const sequence = state.routeSequence;
      const scopeId = customerScopeId(state.customer.detail);
      const idempotencyKey = text(state.customer.idempotencyKey);
      if (!idempotencyKey) {
        state.customer.clientError = "服务端校验未返回稳定 idempotencyKey，发布已 fail closed。";
        renderCustomerDetail();
        return;
      }
      body.idempotencyKey = idempotencyKey;
      body.confirmations = riskConfirmations().map(function (risk) {
        return {
          callSiteId: text(first(risk, ["callSiteId"], "")),
          requestContractDigest: text(first(risk, ["requestContractDigest"], "")),
          attestedRisk: text(first(risk, ["attestedRisk"], ""))
        };
      });
      const validationReceipt = first(validation, ["validationReceipt", "receipt", "validationId"], null);
      if (validationReceipt !== null) body.validationReceipt = validationReceipt;

      state.customer.busy = "publish";
      state.customer.clientError = "";
      const projectionBaselineVersion = state.customer.deliveryStateVersion;
      renderCustomerDetail();
      try {
        const result = await api.publish(
          scopeId,
          deliveryIdValue,
          body
        );
        if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
        const response = object(first(result.data, ["installation", "result"], result.data));
        const installationIdValue = text(first(response, ["installationId", "id"], ""));
        if (!installationIdValue) {
          throw new ApiError(503, "发布响应缺少 installationId，无法读取真实安装状态。", response, "missing_installation_id");
        }
        state.customer.installationId = installationIdValue;
        state.customer.acceptedHttpStatus = result.status;
        state.customer.acceptedAtMs = result.status === 202 ? Date.now() : 0;
        state.customer.installationProjectionBaselineVersion = result.status === 202
          ? projectionBaselineVersion
          : 0;
        state.customer.installation = response;
        state.customer.consoleUrl = absoluteHttpUrl(first(response, ["consoleUrl"], ""));
        state.notice = result.status === 202
          ? { tone: "info", title: "发布请求已受理", message: "HTTP 202 只表示进入处理队列；只有安装状态 ready 才表示成功。" }
          : { tone: "info", title: "已获得安装记录", message: "正在读取服务端安装状态。" };
        announce(result.status === 202 ? "发布请求已受理，尚未安装成功" : "已获得安装记录");
        await loadInstallation(
          scopeId,
          installationIdValue,
          sequence,
          false
        );
      } catch (error) {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          const description = errorDescription(error);
          state.notice = { tone: description.tone, title: description.title, message: description.message };
        }
      } finally {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.busy = "";
          renderCustomerDetail();
        }
      }
    }

    function installationStatus() {
      return text(first(state.customer && state.customer.installation, ["status"], ""), "unknown").toLowerCase();
    }

    function installationNeedsRefresh(status) {
      return ["accepted", "accepted_for_dispatch", "pending", "processing", "running", "publishing", "validating", "provisioning_accepted", "provisioningaccepted", "awaiting_acceptance"].indexOf(status) >= 0;
    }

    function installationObservationIsPreAcceptance(customer, observed) {
      const observedStatus = text(first(observed, ["status"], "")).toLowerCase();
      const observedVersion = deliveryStateVersion(observed);
      return observedStatus !== "ready" && Boolean(customer) && customer.acceptedHttpStatus === 202 &&
        customer.acceptedAtMs > 0 && Date.now() - customer.acceptedAtMs < PROJECTION_GRACE_MS &&
        customer.installationProjectionBaselineVersion > 0 &&
        (observedVersion === 0 || observedVersion <= customer.installationProjectionBaselineVersion);
    }

    function markInstallationAwaitingProjection(customer) {
      customer.installationError = null;
      customer.installation = Object.assign({}, object(customer.installation), {
        status: "accepted",
        stage: "awaiting_projection"
      });
    }

    function stopInstallationRefresh() {
      if (installationTimer) window.clearTimeout(installationTimer);
      installationTimer = null;
    }

    function scheduleInstallationRefresh(scopeId, installationIdValue, sequence) {
      stopInstallationRefresh();
      if (!state.customer || !installationNeedsRefresh(installationStatus())) return;
      installationTimer = window.setTimeout(function () {
        loadInstallation(scopeId, installationIdValue, sequence, true);
      }, INSTALLATION_REFRESH_MS);
    }

    async function loadInstallation(scopeId, installationIdValue, sequence, background) {
      if (!state.customer || !installationIdValue) return;
      if (!background) {
        state.customer.installationError = null;
        renderCustomerDetail();
      }
      try {
        const result = await api.installation(scopeId, installationIdValue);
        if (sequence !== state.routeSequence || !state.customer || state.customer.installationId !== installationIdValue) return;
        const observed = normalizeInstallation(result.data);
        if (installationObservationIsPreAcceptance(state.customer, observed)) {
          markInstallationAwaitingProjection(state.customer);
          renderCustomerDetail();
          scheduleInstallationRefresh(scopeId, installationIdValue, sequence);
          return;
        }
        state.customer.installation = observed;
        state.customer.installationError = null;
        const observedVersion = deliveryStateVersion(observed);
        if (observedVersion > 0) state.customer.deliveryStateVersion = observedVersion;
        state.customer.installationProjectionBaselineVersion = 0;
        const observedStatus = text(first(observed, ["status"], "")).toLowerCase();
        if (state.customer.acceptedHttpStatus !== 202 || !installationNeedsRefresh(observedStatus)) {
          if (state.customer.acceptedHttpStatus === 202 && !installationNeedsRefresh(observedStatus)) {
            state.notice = null;
          }
          state.customer.acceptedHttpStatus = 0;
          state.customer.acceptedAtMs = 0;
        }
        renderCustomerDetail();
        scheduleInstallationRefresh(scopeId, installationIdValue, sequence);
      } catch (error) {
        if (sequence !== state.routeSequence || !state.customer) return;
        const awaitingProjection = error instanceof ApiError && error.status === 404 &&
          state.customer.acceptedHttpStatus === 202 &&
          state.customer.acceptedAtMs > 0 &&
          Date.now() - state.customer.acceptedAtMs < PROJECTION_GRACE_MS;
        if (awaitingProjection) {
          markInstallationAwaitingProjection(state.customer);
          renderCustomerDetail();
          scheduleInstallationRefresh(scopeId, installationIdValue, sequence);
          return;
        }
        state.customer.installationError = error;
        stopInstallationRefresh();
        renderCustomerDetail();
      }
    }

    async function retryInstallation() {
      if (!state.customer || state.customer.busy || !state.customer.installationId) return;
      const deliveryIdValue = state.customer.deliveryId;
      const sequence = state.routeSequence;
      const scopeId = customerScopeId(state.customer.detail);
      const installationIdValue = state.customer.installationId;
      state.customer.busy = "retry";
      const projectionBaselineVersion = state.customer.deliveryStateVersion;
      renderCustomerDetail();
      try {
        const result = await api.retry(scopeId, installationIdValue);
        if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
        const response = normalizeInstallation(result.data);
        const returnedId = text(first(response, ["installationId", "id"], ""));
        if (returnedId && returnedId !== state.customer.installationId) {
          state.customer.installationId = returnedId;
        }
        state.customer.acceptedHttpStatus = result.status;
        state.customer.acceptedAtMs = result.status === 202 ? Date.now() : 0;
        state.customer.installationProjectionBaselineVersion = result.status === 202
          ? projectionBaselineVersion
          : 0;
        state.customer.installation = result.status === 202
          ? Object.assign({}, object(state.customer.installation), response, {
              status: "accepted",
              stage: "awaiting_projection"
            })
          : response;
        state.notice = result.status === 202
          ? { tone: "info", title: "重试请求已受理", message: "仍需等待服务端安装状态变为 ready。" }
          : { tone: "info", title: "重试已提交", message: "正在读取服务端状态。" };
        await loadInstallation(scopeId, state.customer.installationId, sequence, false);
      } catch (error) {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          const description = errorDescription(error);
          state.notice = { tone: description.tone, title: description.title, message: description.message };
        }
      } finally {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.busy = "";
          renderCustomerDetail();
        }
      }
    }

    async function createTeam() {
      if (!state.customer || state.customer.busy) return;
      const displayName = text(state.customer.newTeamName);
      if (!displayName) {
        state.notice = { tone: "warning", title: "请填写 Team 名称", message: "Team 名称不能为空。" };
        renderCustomerDetail();
        return;
      }
      state.customer.busy = "create-team";
      renderCustomerDetail();
      const scopeId = customerScopeId(state.customer.detail);
      const deliveryIdValue = state.customer.deliveryId;
      const sequence = state.routeSequence;
      try {
        const result = await api.createTeam(scopeId, displayName);
        if (!customerRouteIsCurrent(deliveryIdValue, sequence)) return;
        const createdTeam = normalizeCreatedTeam(result.data, scopeId);
        const createdTeamId = teamId(createdTeam);
        state.customer.pendingTeams[createdTeamId] = createdTeam;
        state.customer.teams = mergeTeamRoster(state.customer.teams, state.customer.pendingTeams);
        state.customer.selectedTeamId = createdTeamId;
        state.customer.newTeamName = "";
        state.notice = { tone: "success", title: "Team 已创建并选中", message: "现在可以继续配置并发布工作流。" };
        announce("Team 已创建");
        state.customer.busy = "";
        await loadTeams(scopeId, deliveryIdValue, sequence);
      } catch (error) {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          const description = errorDescription(error);
          state.notice = { tone: description.tone, title: description.title, message: description.message };
        }
      } finally {
        if (customerRouteIsCurrent(deliveryIdValue, sequence)) {
          state.customer.busy = "";
          renderCustomerDetail();
        }
      }
    }

    function copyButton(value, label) {
      if (!text(value)) return null;
      return h("button", {
        className: "button secondary",
        type: "button",
        onClick: function (event) {
          const button = event.currentTarget;
          const original = label;
          const done = function (ok) {
            button.textContent = ok ? "已复制" : "复制失败";
            announce(ok ? "已复制到剪贴板" : "复制失败，请手动选择文本");
            window.setTimeout(function () { button.textContent = original; }, 2000);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(value).then(function () { done(true); }, function () { done(false); });
          } else {
            done(false);
          }
        },
        text: label
      });
    }

    // Ready means the workflow is published and runnable — but the two places a customer
    // actually uses it (the product console and a bound messaging channel) are separate
    // surfaces this page cannot reach. Both entry points are therefore stated explicitly,
    // and each is omitted rather than guessed when the server did not return it.
    function renderUsageSection(consoleUrl, channelRunCommand, scopeId) {
      const rows = [];
      rows.push(
        h("div", { className: "stage-row" },
          h("span", { className: "stage-index", text: "1" }),
          h("div", null,
            h("strong", { text: "在 Aevatar Console 中运行" }),
            consoleUrl
              ? h("p", { text: "打开该 Team 成员的调用工作台，可手动运行已交付工作流并查看运行记录。" })
              : h("p", { text: "服务端未配置 Aevatar:Delivery:ConsoleWebBaseUrl，无法生成 Console 链接；请联系交付管理员补充该配置。" })
          ),
          consoleUrl
            ? h("a", {
                className: "button primary",
                href: consoleUrl,
                target: "_blank",
                rel: "noopener noreferrer",
                text: "打开 Console"
              })
            : badge("warning", "未配置")
        )
      );
      if (channelRunCommand) {
        rows.push(
          h("div", { className: "stage-row" },
            h("span", { className: "stage-index", text: "2" }),
            h("div", null,
              h("strong", { text: "在已绑定的 Lark / 消息渠道中运行" }),
              h("p", { text: "该指令在机器人注册所在的 scope 内解析 workflow，因此机器人必须注册在本次交付的目标 scope（" + text(scopeId, "本 scope") + "）下，否则会提示未找到 workflow。" }),
              h("p", { className: "mono", text: channelRunCommand }),
              h("p", { text: "在会话中发送 /workflow list 可列出该 scope 的 workflow 及其运行指令。" })
            ),
            copyButton(channelRunCommand, "复制指令")
          )
        );
      }
      return h("section", { className: "section", style: { marginTop: "16px" } },
        h("div", { className: "section-head" },
          h("div", null,
            h("h2", { text: "现在如何使用" }),
            h("p", { text: "安装已 ready，以下是本次交付真实可用的两个入口。" })
          )
        ),
        h("div", { className: "stage-list" }, rows)
      );
    }

    function installationStatusMessage(installation, status, acceptedHttpStatus) {
      if (status === "ready") return "服务端 installation.status 已确认 ready。";
      if (status === "failed") {
        const failureCode = text(first(installation, ["errorCode", "code"], ""));
        const failureMessage = text(first(installation, ["errorMessage", "error"], ""));
        if (failureMessage) return failureCode ? failureCode + ": " + failureMessage : failureMessage;
        return text(failureCode, "服务端报告安装失败。");
      }
      if (acceptedHttpStatus === 202) {
        return "HTTP 202 仅表示已受理，当前仍以服务端状态为准。";
      }
      return text(first(installation, ["message", "nextAction"], ""), "尚未达到 ready。");
    }

    function renderInstallation() {
      if (!state.customer.installationId) {
        return notice("info", "尚未发布", "完成配置校验后可提交发布。");
      }
      if (state.customer.installationError) {
        const description = errorDescription(state.customer.installationError);
        return h("div", null,
          notice(description.tone, description.title, description.message),
          h("button", {
            className: "button secondary",
            type: "button",
            onClick: function () {
              loadInstallation(
                customerScopeId(state.customer.detail),
                state.customer.installationId,
                state.routeSequence,
                false
              );
            },
            text: "重新读取"
          })
        );
      }
      const installation = object(state.customer.installation);
      const status = text(first(installation, ["status"], ""), "unknown").toLowerCase();
      const ready = status === "ready";
      const stages = array(first(installation, ["stages", "steps"], []));
      const stage = text(first(installation, ["stage"], ""));
      const evidenceValue = first(installation, ["evidence", "acceptanceEvidence", "artifactEvidence"], {});
      const evidence = object(evidenceValue);
      const evidenceItems = array(evidenceValue);
      const explicitRetryable = first(installation, ["retryable", "canRetry"], undefined);
      const retryable = explicitRetryable === true || (explicitRetryable === undefined && status === "failed");
      const consoleUrl = absoluteHttpUrl(first(installation, ["consoleUrl"], "")) ||
        state.customer.consoleUrl;
      const channelRunCommand = text(first(installation, ["channelRunCommand"], ""));
      const installationScopeId = text(first(installation, ["scopeId"], ""));
      const title = ready ? "安装已就绪" : (status === "failed" ? "安装失败" : "安装状态");
      const message = installationStatusMessage(
        installation,
        status,
        state.customer.acceptedHttpStatus
      );
      const header = notice(ready ? "success" : statusTone(status), title, message);
      const body = h("div", null, header);
      body.append(
        h("dl", { className: "definition" },
          h("dt", { text: "Installation ID" }), h("dd", { className: "mono", text: state.customer.installationId }),
          h("dt", { text: "状态" }), h("dd", null, badge(status)),
          stage ? h("dt", { text: "阶段" }) : null, stage ? h("dd", { text: stage }) : null,
          h("dt", { text: "更新时间" }), h("dd", { text: formatDate(first(installation, ["updatedAt", "updatedAtUtc"], "")) })
        )
      );
      if (ready) {
        body.append(renderUsageSection(consoleUrl, channelRunCommand, installationScopeId));
      }
      if (stages.length) {
        body.append(
          h("div", { className: "stage-list", style: { marginTop: "12px" } }, stages.map(function (stage, index) {
            const stageStatus = text(first(stage, ["status"], ""), "unknown");
            return h("div", { className: "stage-row" },
              h("span", { className: "stage-index", text: String(index + 1) }),
              h("div", null,
                h("strong", { text: text(first(stage, ["label", "name", "key"], ""), "安装阶段") }),
                h("p", { text: text(first(stage, ["message", "detail"], ""), statusLabel(stageStatus)) })
              ),
              badge(stageStatus)
            );
          }))
        );
      }
      const identities = [
        ["Workflow ID", first(installation, ["workflowId"], "")],
        ["Member ID", first(installation, ["memberId"], "")],
        ["Published Service ID", first(installation, ["publishedServiceId"], "")],
        ["Revision ID", first(installation, ["revisionId"], "")],
        ["Schedule ID", first(installation, ["scheduleId"], "")],
        ["Acceptance Run ID", first(installation, ["acceptanceRunId"], "")]
      ].filter(function (entry) { return text(entry[1]); });
      if (identities.length) {
        body.append(
          h("div", { className: "receipt-grid", style: { marginTop: "13px" } }, identities.map(function (entry) {
            return [
              h("div", { className: "receipt-label", text: entry[0] }),
              h("div", { className: "receipt-value mono", text: String(entry[1]) })
            ];
          }))
        );
      }
      const evidenceKeys = Object.keys(evidence);
      if (evidenceKeys.length) {
        body.append(
          h("div", { className: "receipt-grid", style: { marginTop: "13px" } }, evidenceKeys.map(function (key) {
            const value = evidence[key];
            return [
              h("div", { className: "receipt-label", text: key }),
              h("div", { className: "receipt-value mono", text: typeof value === "object" ? JSON.stringify(value) : String(value) })
            ];
          }))
        );
      }
      if (evidenceItems.length) {
        body.append(
          h("div", { className: "stage-list", style: { marginTop: "13px" } }, evidenceItems.map(function (item, index) {
            if (!item || typeof item !== "object") {
              return h("div", { className: "stage-row" },
                h("span", { className: "stage-index", text: String(index + 1) }),
                h("div", null,
                  h("strong", { text: "Legacy artifact evidence" }),
                  h("p", { className: "mono", text: String(item) })
                ),
                badge("unknown", "Legacy")
              );
            }
            const artifact = object(item);
            const kind = text(first(artifact, ["kind"], ""), "typed_artifact");
            const artifactId = text(first(artifact, ["artifactId"], ""), "未返回 artifactId");
            const verificationStatus = text(first(artifact, ["verificationStatus"], ""), "unknown");
            const verificationReference = text(first(artifact, ["verificationReference"], ""));
            const contentDigest = text(first(artifact, ["contentDigest"], ""));
            return h("div", { className: "stage-row" },
              h("span", { className: "stage-index", text: String(index + 1) }),
              h("div", null,
                h("strong", { text: kind }),
                h("p", { className: "mono", text: "Artifact ID: " + artifactId }),
                verificationReference
                  ? h("p", { className: "mono", text: "Verification: " + verificationReference })
                  : null,
                contentDigest
                  ? h("p", { className: "mono", text: "Digest: " + contentDigest })
                  : null
              ),
              badge(verificationStatus)
            );
          }))
        );
      }
      body.append(
        h("div", { className: "inline-actions", style: { marginTop: "14px" } },
          h("button", {
            className: "button secondary",
            type: "button",
            onClick: function () {
              loadInstallation(
                customerScopeId(state.customer.detail),
                state.customer.installationId,
                state.routeSequence,
                false
              );
            },
            text: "刷新状态"
          }),
          retryable && !ready ? h("button", {
            className: "button secondary",
            type: "button",
            disabled: state.customer.busy === "retry",
            onClick: retryInstallation,
            text: state.customer.busy === "retry" ? "正在重试..." : "重试"
          }) : null,
          consoleUrl ? h("a", {
            className: "button primary",
            href: consoleUrl,
            target: "_blank",
            rel: "noopener noreferrer",
            text: ready ? "在 Aevatar Console 打开" : "在 Aevatar Console 运行 / 检查验收"
          }) : null
        )
      );
      return body;
    }

    function renderCustomerDetail() {
      if (!state.customer) return;
      const detail = state.customer.detail;
      const scopeId = customerScopeId(detail);
      const fields = state.customer.fields;
      const capabilities = array(deliveryValue(detail, ["capabilities", "capabilitySummary"], []));
      const status = first(detail, ["status"], "unknown");
      const deliveryTitle = text(deliveryValue(detail, ["displayName", "workflowName", "packageName", "name"], ""), "Workflow 交付");
      const infoPanel = h("section", { className: "panel" },
        h("div", { className: "panel-head" },
          h("div", { className: "section-head", style: { marginBottom: "0" } },
            h("div", null,
              h("h2", { text: deliveryTitle }),
              h("p", { text: text(first(detail, ["note"], ""), text(deliveryValue(detail, ["description"], ""), "由 Aevatar Delivery Control Plane 交付。")) })
            ),
            badge(status)
          )
        ),
        h("div", { className: "panel-body" },
          h("dl", { className: "definition" },
            h("dt", { text: "Delivery ID" }), h("dd", { className: "mono", text: state.customer.deliveryId }),
            h("dt", { text: "目标 Scope" }), h("dd", { className: "mono", text: scopeId }),
            h("dt", { text: "版本" }), h("dd", { text: text(deliveryValue(detail, ["version", "packageVersion"], ""), "未标注") }),
            h("dt", { text: "到期" }), h("dd", { text: formatDate(first(detail, ["expiresAt"], "")) })
          ),
          capabilities.length ? h("div", { className: "inline-actions", style: { marginTop: "12px" } }, capabilities.map(function (capability) {
            const label = typeof capability === "string"
              ? capability
              : text(first(capability, ["label", "name", "capability"], ""), "Capability");
            return h("span", { className: "badge", text: label });
          })) : null
        )
      );

      const configurationSections = h("div", null,
        h("section", { className: "section" },
          h("div", { className: "section-head" },
            h("div", null, h("h2", { text: "1. 选择 Team" }), h("p", { text: "Team 列表来自目标 scope 的真实权限读模型。" }))
          ),
          renderTeamSection()
        ),
        h("section", { className: "section" },
          h("div", { className: "section-head" },
            h("div", null, h("h2", { text: "2. 客户配置" }), h("p", { text: "仅显示 package variableSchema 明确开放的字段。" }))
          ),
          fields.length
            ? h("div", { className: "form-grid" }, fields.map(renderVariableField))
            : h("p", { style: { color: "var(--muted)" }, text: "此 Workflow 没有客户可配置变量。" })
        ),
        h("section", { className: "section" },
          h("div", { className: "section-head" },
            h("div", null, h("h2", { text: "3. NyxID 连接" }), h("p", { text: "配置表单只接收服务端返回的 UserService 引用；外部服务 token、secret 和 OAuth credential 不进入页面状态。" }))
          ),
          renderConnections()
        ),
        renderTriggerIntent(),
        h("section", { className: "section" },
          h("div", { className: "section-head" },
            h("div", null, h("h2", { text: "4. 校验与风险确认" }), h("p", { text: "callSiteId 和 requestContractDigest 必须由服务端生成。" }))
          ),
          renderValidationRegion()
        )
      );

      const rightPanel = h("aside", { className: "panel" },
        h("div", { className: "panel-head" },
          h("h2", { text: "安装状态" }),
          h("p", { text: "只读 durable installation read model。" })
        ),
        h("div", { className: "panel-body" }, renderInstallation())
      );

      const validateDisabled = Boolean(state.customer.busy) ||
        !selectedTeamCanPublish() ||
        Boolean(state.customer.teamsError);
      const publishDisabled = Boolean(state.customer.busy) || !validationIsPublishable();
      const actionBar = h("div", { className: "action-bar" },
        h("div", { className: "action-copy", text: "HTTP 202 仅表示 accepted；安装成功以 installation.status = ready 为准。" }),
        h("button", {
          className: "button secondary",
          type: "button",
          disabled: validateDisabled,
          onClick: validateCustomerConfig,
          text: state.customer.busy === "validate" ? "正在校验..." : "校验配置"
        }),
        h("button", {
          className: "button primary",
          id: "publishDelivery",
          type: "button",
          disabled: publishDisabled,
          onClick: publishCustomerDelivery,
          text: state.customer.busy === "publish" ? "发布已提交..." : "发布到 Team"
        })
      );

      renderShell(deliveryTitle, "配置并发布到当前交付授权的 scope。", "customer",
        h("div", null,
          infoPanel,
          h("div", { className: "detail-grid", style: { marginTop: "16px" } },
            configurationSections,
            rightPanel
          ),
          actionBar
        ),
        {
          narrow: true,
          actions: [h("a", { className: "button secondary", href: routeHref("customer-list"), text: "返回列表" })]
        }
      );
    }

    async function boot() {
      const token = readToken();
      if (!token) {
        renderLoginGate();
        return;
      }
      try {
        const result = await api.session();
        state.session = object(first(result.data, ["session"], result.data));
        if (state.session.authenticated === false) {
          renderLoginGate("当前 NyxID 会话未通过 Delivery Backend 认证。");
          return;
        }
        await loadRoute();
      } catch (error) {
        if (error instanceof ApiError && error.status === 401) {
          renderLoginGate(error.message);
          return;
        }
        renderRouteError(error, boot, "customer");
      }
    }

    window.addEventListener("hashchange", function () {
      if (state.session) loadRoute();
    });
    window.addEventListener("storage", function (event) {
      if (event.key !== TOKEN_KEY) return;
      if (!event.newValue) {
        state.session = null;
        renderLoginGate("登录已在其他标签页退出。");
      } else if (!state.session) {
        boot();
      }
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        ensureAccessToken().catch(function () {});
        if (state.customer && state.customer.installationId && installationNeedsRefresh(installationStatus())) {
          loadInstallation(
            customerScopeId(state.customer.detail),
            state.customer.installationId,
            state.routeSequence,
            true
          );
        }
      }
    });

    restoreConnectReturnRoute();
    boot();
  })();
  </script>
</body>
</html>
