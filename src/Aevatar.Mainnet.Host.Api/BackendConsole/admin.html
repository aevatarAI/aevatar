<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aevatar Backend Console</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fa;
    --panel: #ffffff;
    --panel-2: #f3f5f9;
    --border: #dde2ea;
    --fg: #1c2128;
    --fg-strong: #0b0f14;
    --muted: #57606b;
    --accent: #2f63e0;
    --accent-soft: rgba(47, 99, 224, .10);
    --accent-line: rgba(47, 99, 224, .34);
    --shadow: 0 10px 30px rgba(16, 24, 40, .10);
    --radius: 8px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f232c;
      --border: #2a2f3a;
      --fg: #e6e9ef;
      --fg-strong: #f4f6fb;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --accent-soft: rgba(91, 140, 255, .14);
      --accent-line: rgba(91, 140, 255, .40);
      --shadow: 0 8px 30px rgba(0, 0, 0, .40);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.55 var(--sans);
  }
  a { color: inherit; text-decoration: none; }
  .shell { min-height: 100vh; display: grid; grid-template-rows: 58px 1fr; }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .mark {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    background: linear-gradient(150deg, var(--accent), #7c4dff);
  }
  .brand { min-width: 0; }
  .brand b { display: block; color: var(--fg-strong); letter-spacing: -.01em; }
  .brand span { display: block; color: var(--muted); font-size: 12px; }
  .spacer { flex: 1 1 auto; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    padding: 7px 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--fg);
    font-weight: 650;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
    padding: 26px 0 44px;
  }
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    margin: 10px 0 22px;
  }
  h1 {
    margin: 0;
    color: var(--fg-strong);
    font-size: 24px;
    line-height: 1.2;
    letter-spacing: 0;
  }
  .sub { margin: 8px 0 0; color: var(--muted); max-width: 70ch; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
    gap: 14px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 156px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  .card:hover { border-color: var(--accent-line); }
  .card h2 { margin: 0; color: var(--fg-strong); font-size: 16px; letter-spacing: 0; }
  .card p { margin: 0; color: var(--muted); flex: 1 1 auto; }
  .card .open { color: var(--accent); font-weight: 700; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--accent-line);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  @media (max-width: 680px) {
    header { padding: 0 14px; }
    .hero { align-items: flex-start; flex-direction: column; }
    main { width: min(100% - 24px, 1120px); }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="mark" aria-hidden="true">A</div>
    <div class="brand">
      <b>Aevatar Backend Console</b>
      <span>zero-build static asset suite</span>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="account" type="button">登录状态</button>
    <button class="btn primary" id="login" type="button">使用 NyxID 登录</button>
  </header>
  <main>
    <section class="hero">
      <div>
        <h1>后端控制台</h1>
        <p class="sub">这里是后台 console 套件入口。每个模块保留自己的真实页面和既有 API，父页只负责导航与共享登录入口。</p>
      </div>
      <span class="status"><i class="dot"></i>embedded assets</span>
    </section>
    <section class="grid" id="modules" aria-label="console modules"></section>
  </main>
</div>
<script>
(function(){
  "use strict";
  var backendConsoleConfig = __BACKEND_CONSOLE_CONFIG__;
  var oidc = {
    authority: backendConsoleConfig.authority || "",
    clientId: backendConsoleConfig.clientId || "",
    scope: backendConsoleConfig.scope || "",
    redirectUri: location.origin + "/auto/callback",
    storageKey: backendConsoleConfig.storageKey || ""
  };
  var tokenKey = oidc.storageKey + ":token";
  var pkceKey = oidc.storageKey + ":pkce";
  var modules = [
    { href: "/status", title: "Status", text: "服务健康、探针结果和最近状态历史。" },
    { href: "/workflow/observatory", title: "Workflow Observatory", text: "只读查看 workflow run、时间线和图谱。" },
    { href: "/cqrs", title: "CQRS / Projection", text: "查看投影链路、scope lag 和 readmodel inventory。" },
    { href: "/workflow/studio", title: "Workflow Studio", text: "对话式编排与运行入口。" },
    { href: "/workflow/skills", title: "Skills", text: "浏览并调用当前账号可见的 Ornn skills。" },
    { href: "/schedules", title: "Schedules", text: "查看定时触发和 schedule 状态。" },
    { href: "/channels", title: "Channels", text: "接入和管理 Lark / Telegram relay 通道。" },
    { href: "/voice", title: "Voice", text: "语音在场和实时语音会话入口。" }
  ];

  function token(){
    try {
      var parsed = JSON.parse(localStorage.getItem(tokenKey) || "null");
      return parsed && parsed.access_token ? parsed : null;
    } catch (_) {
      return null;
    }
  }

  function b64url(bytes){
    var raw = "";
    bytes = new Uint8Array(bytes);
    for (var i = 0; i < bytes.length; i++) raw += String.fromCharCode(bytes[i]);
    return btoa(raw).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function randomText(length){
    var bytes = new Uint8Array(length);
    crypto.getRandomValues(bytes);
    return b64url(bytes).slice(0, length);
  }

  async function sha256(value){
    return b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value)));
  }

  async function beginLogin(){
    if (!oidc.authority || !oidc.clientId) {
      alert("BackendConsole OIDC 配置缺失。");
      return;
    }
    var verifier = randomText(64);
    var state = randomText(32);
    sessionStorage.setItem(pkceKey, JSON.stringify({ verifier: verifier, state: state, returnTo: location.pathname }));
    var url = new URL(oidc.authority.replace(/\/+$/, "") + "/oauth/authorize");
    url.searchParams.set("response_type", "code");
    url.searchParams.set("client_id", oidc.clientId);
    url.searchParams.set("redirect_uri", oidc.redirectUri);
    url.searchParams.set("scope", oidc.scope);
    url.searchParams.set("state", state);
    url.searchParams.set("code_challenge", await sha256(verifier));
    url.searchParams.set("code_challenge_method", "S256");
    location.assign(url.toString());
  }

  function renderModules(){
    var root = document.getElementById("modules");
    root.innerHTML = modules.map(function(item){
      return '<a class="card" href="' + item.href + '">' +
        '<h2>' + item.title + '</h2>' +
        '<p>' + item.text + '</p>' +
        '<span class="open">打开 →</span>' +
      '</a>';
    }).join("");
  }

  function renderAccount(){
    var current = token();
    var account = document.getElementById("account");
    var login = document.getElementById("login");
    account.textContent = current ? "已登录" : "未登录";
    login.textContent = current ? "刷新登录" : "使用 NyxID 登录";
  }

  document.getElementById("login").addEventListener("click", beginLogin);
  document.getElementById("account").addEventListener("click", function(){
    var current = token();
    alert(current ? "当前浏览器已有 console bearer token。" : "当前浏览器尚未登录。");
  });
  renderModules();
  renderAccount();
})();
</script>
</body>
</html>
