function statusTag(s){
  var map={running:['tag-running','运行中','▶'],success:['tag-success','完成','✓'],failed:['tag-failed','失败','✕'],
    waiting:['tag-waiting','等待','◷'],stuck:['tag-failed','卡住','▌'],idle:['tag-idle','空闲','○']};
  var m=map[s]||map.idle;
  var ic=s==='running'?'<i class="tdot" aria-hidden="true"></i>':'<span class="tg" aria-hidden="true">'+m[2]+'</span>';
  return '<span class="tag '+m[0]+'">'+ic+m[1]+'</span>';
}
function statusLight(s){
  var map={busy:['sl-busy','忙','▶'],idle:['sl-idle','闲','○'],stuck:['sl-stuck','卡','▌'],failed:['sl-failed','失败','✕']};
  var m=map[s]||map.idle;
  var ic=s==='busy'?'<i class="sdot"></i>':'<span class="tg" aria-hidden="true">'+m[2]+'</span>';
  return '<span class="status-light '+m[0]+'">'+ic+m[1]+'</span>';
}
function implBadge(impl){ return '<span class="impl-badge">'+impl+'</span>'; }
function liveOrStamp(live){
  if(live) return '<span class="live-badge"><i class="live-dot"></i>live</span>';
  return '<span class="stamp">更新于 <span class="num" data-stamp>'+nowStamp()+'</span></span>';
}

/* ============================== L0 集团总览 ============================== */
function viewL0(){
  if(!ACCOUNT||!ACCOUNT.admin) return {html:moduleSubHeader('fleet','')+'<div class="view-scroll">'+auth403('全景看板汇总全部组织的运行态，仅平台管理员可见。')+'</div>', mount:bindFleet};
  if(!FLEET_LOADED) return {html:moduleSubHeader('fleet','')+'<div class="view-scroll">'+fleetSkeleton()+'</div>', mount:bindFleet};
  if(FLEET_FORBIDDEN) return {html:moduleSubHeader('fleet','')+'<div class="view-scroll">'+auth403('需要平台管理员权限读取跨组织运行态（observatory __all__）。')+'</div>', mount:bindFleet};
  if(FLEET_ERR) return {html:moduleSubHeader('fleet','')+'<div class="view-scroll"><div class="alert">'+ICON.warn+'<span class="grow">看板加载失败：'+esc(FLEET_ERR)+'</span><button class="btn" data-act="fleetReload">重试</button></div></div>', mount:bindFleet};
  var t=kpiTotals();
  var kpi=
    metricCard({label:'活跃组织 (orgs)',icon:ICON.building,value:t.scopes,sub:'有运行记录的 nyxid 账号'})+
    metricCard({label:'此刻在飞 Run',icon:ICON.bolt,value:t.active,cls:'running',live:true})+
    metricCard({label:'近窗运行总数',icon:ICON.refresh,value:t.runs,sub:'observatory __all__'})+
    metricCard({label:'失败 / 超时 Run',icon:ICON.warn,value:t.fail,cls:t.fail>0?'danger':'',sub:'跨 '+COMPANIES.filter(function(c){return c.fail>0;}).length+' 个组织'})+
    metricCard({label:'活跃 workflow',icon:ICON.people,value:t.workflows,sub:'近窗出现的去重 workflow',approx:true});

  /* sort + filter */
  var list=COMPANIES.slice();
  var order={red:0,amber:1,green:2,grey:3};
  if(STATE.l0Filter==='red') list=list.filter(function(c){return c.health==='red';});
  if(STATE.l0Filter==='active') list=list.filter(function(c){return c.active>0;});
  if(STATE.l0Sort==='health') list.sort(function(a,b){return order[a.health]-order[b.health];});
  if(STATE.l0Sort==='runs')   list.sort(function(a,b){return b.runsTotal-a.runsTotal;});
  if(STATE.l0Sort==='active') list.sort(function(a,b){return b.active-a.active;});

  var cards=list.map(companyCard).join('');
  if(!list.length) cards=emptyBlock('company-filter');

  var sortLabel={health:'健康 ↓',runs:'运行数 ↓',active:'活跃 ↓'}[STATE.l0Sort]||'运行数 ↓';
  var rangeT=STATE.l0Range==='today'?'今日':'7 天';

  var body=
    '<div class="view-scroll">'+
      '<div class="kpi-bar">'+kpi+'</div>'+
      '<div class="toolbar">'+
        '<div class="chip-row">'+
          chip('red','只看红灯','#dc2626',STATE.l0Filter==='red',COMPANIES.filter(function(c){return c.health==='red';}).length)+
          chip('active','只看在飞','#2563eb',STATE.l0Filter==='active',COMPANIES.filter(function(c){return c.active>0;}).length)+
        '</div>'+
        '<div class="grow"></div>'+
        '<span class="inline-refresh" style="margin-right:6px"><i class="live-dot" style="background:var(--success)"></i> observatory __all__ · 组织名 nyxid '+srcBadge('ready')+'</span>'+
        '<button class="ibtn" data-act="fleetReload">'+ICON.refresh+' 刷新</button>'+
        '<button class="sortbtn" data-act="l0sort"><span class="lbl">排序</span><span class="val">'+sortLabel+'</span></button>'+
      '</div>'+
      '<div class="card-wall">'+cards+'</div>'+
      '<div class="src-legend-bar"><div class="panel-title" style="margin-bottom:12px">数据来源 · 组织 = 有运行记录的 nyxid 账号（observatory __all__ 的去重 scopeId），名称取自 nyxid 用户名册；运行态为现成；去重 workflow 计数为 ~近似；成本 / 员工花名册 / 数据流交接图无统一事实源，已降级为 预览，不展示伪造值</div>'+srcLegendRows()+'</div>'+
    '</div>';
  return {html:body, mount:bindFleet};
}
/* 看板骨架 + 加载 + 重渲（整页重挂载，复用 shell 的挂载点） */
function fleetSkeleton(){ return '<div class="sk-bar" style="height:90px;border-radius:8px"></div>'+
  '<div class="card-wall" style="margin-top:16px">'+[0,0,0,0,0,0].map(function(){return '<div class="sk-card" style="height:200px"></div>';}).join('')+'</div>'; }
function _fleetRemount(){ var slot=document.getElementById('app'); if(!slot) return; var sc=slot.querySelector('.view'); if(!sc) return;
  var v=viewL0(); sc.innerHTML=v.html; if(v.mount) v.mount(sc); }
function bindFleet(root){
  if(ACCOUNT&&ACCOUNT.admin&&!FLEET_LOADED&&!FLEET_LOADING){ loadFleet(_fleetRemount); }
  /* 看板内的下钻/排序/筛选导航统一由 foundation bindEvents（data-co / data-chip / l0sort）处理；
     这里只接管板内 fleetReload 刷新（不重复绑定 document 级委托）。 */
  root.addEventListener('click',function(ev){
    var act=ev.target.closest('[data-act]'); if(!act) return;
    if(act.getAttribute('data-act')==='fleetReload'){ FLEET_LOADED=false; FLEET_ERR=null; _fleetRemount(); loadFleet(_fleetRemount); }
  });
}

function metricCard(o){
  var trend=o.trend?'<span class="mc-trend '+(o.trend==='up'?'mc-up':o.trend==='down'?'mc-down':'mc-flat')+'">'+
    (o.trend==='up'?'▲':o.trend==='down'?'▼':'■')+'</span>':'';
  var head=o.live?'<span class="live-badge" style="height:18px;padding:2px 8px"><i class="live-dot"></i>live</span>':'';
  var val=o.approx?aprx(o.value):o.value;
  var sub=o.sub?'<span class="mc-sub">'+trend+esc(o.sub)+'</span>':'';
  return '<div class="metric-card">'+
    '<div class="mc-head"><span class="mc-label"><span class="mc-ico">'+o.icon+'</span>'+esc(o.label)+'</span>'+head+'</div>'+
    '<div class="mc-val '+(o.cls||'')+'">'+val+'</div>'+sub+'</div>';
}

function companyCard(c){
  var tag=c.health==='red'?'<span class="co-health-tag" style="background:var(--failed-bg);color:var(--failed)">需关注</span>'
    :c.health==='amber'?'<span class="co-health-tag" style="background:var(--waiting-bg);color:#9a5b07">观察</span>'
    :c.health==='grey'?'<span class="co-health-tag" style="background:var(--idle-bg);color:#6b7280">无活动</span>'
    :'<span class="co-health-tag" style="background:var(--success-bg);color:var(--success)">健康</span>';
  /* 组织名 = nyxid 显示名（不可信长度时截断，title 存全量）；data-co 用 scopeId 全量；
     副标题 = email（若名册命中）否则短 scopeId，便于辨认无名册命中的组织 */
  var label=esc(c.name), shortLabel=(c.name&&c.name.length>22)?esc(c.name.slice(0,20)+'…'):label;
  var sub='<div class="emp-sub tnum" style="margin-top:2px">'+esc(c.email||nyxShortId(c.id))+'</div>';
  if(c.isEmpty){
    return '<button class="co-card" data-co="'+esc(c.id)+'" title="'+label+'" aria-label="进入 '+label+'">'+
      '<div class="co-top"><span class="co-name"><i class="health-light health-grey"></i>'+shortLabel+'</span>'+tag+'</div>'+sub+
      '<div class="co-active"><span class="big zero">0</span><span class="unit">近窗运行</span></div>'+
      '<div class="co-alert calm">'+ICON.empty.replace('width="1.6"','width="2"')+'<span>该组织近窗内无运行记录</span></div>'+
      '<div class="co-foot"><span class="emp">0 workflow</span><span class="emp">无活动</span></div>'+
    '</button>';
  }
  var total=c.busy+c.idle+c.fail||1;
  var stack='<div class="stack">'+
    '<i class="s-busy" style="width:'+(c.busy/total*100)+'%"></i>'+
    '<i class="s-idle" style="width:'+(c.idle/total*100)+'%"></i>'+
    '<i class="s-fail" style="width:'+(c.fail/total*100)+'%"></i></div>'+
    '<div class="stack-legend"><span><i style="background:var(--running)"></i>在飞 '+c.busy+'</span>'+
    '<span><i style="background:#cbd0d8"></i>完成 '+c.idle+'</span>'+
    '<span><i style="background:var(--failed)"></i>失败 '+c.fail+'</span></div>';
  var sev=c.oldest?(c.oldest.mins>40?'danger':'warn'):'';
  var alert=c.oldest
    ? '<div class="co-alert co-alert-'+sev+'"><span class="ca-ico">'+ICON.warn+'</span>'+
        '<span class="ca-txt">最久未推进 · <b>'+esc(c.oldest.name)+'</b> Run '+esc(c.oldest.id)+' 已 running <b class="ca-min num">'+c.oldest.mins+'</b> min</span>'+
        '<span class="live-dot" title="live 数据"></span></div>'
    : '<div class="co-alert calm">'+ICON.check.replace('stroke-width="2"','stroke-width="2.2"')+'<span>无长时间未推进的 Run</span></div>';
  return '<button class="co-card" data-co="'+esc(c.id)+'" title="'+label+'" aria-label="进入 '+label+'">'+
    '<div class="co-top"><span class="co-name"><i class="health-light health-'+c.health+'"></i>'+shortLabel+'</span>'+tag+'</div>'+sub+
    '<div class="co-active"><span class="big">'+c.active+'</span><span class="unit">此刻在飞 Run</span></div>'+
    '<div class="co-cost"><span class="cc-l">近窗 <b class="num" style="color:var(--heading)">'+c.runsTotal+'</b> 运行 · 完成 '+c.success+' · 最近 '+esc(c.lastActivityLabel)+'</span></div>'+
    stack+alert+
    '<div class="co-foot"><span class="emp">'+c.workflows+' workflow <span class="approx-mark">~</span></span><span class="emp">查看运行 '+ICON.arrow.replace('width="2"','width="1.6" style="width:13px;height:13px;vertical-align:-2px"')+'</span></div>'+
  '</button>';
}

function chip(val,label,color,on,cnt){
  return '<button class="chip'+(on?' on':'')+'" data-chip="'+val+'">'+
    (color?'<span class="dot" style="background:'+color+'"></span>':'')+esc(label)+
    '<span class="cnt">'+cnt+'</span></button>';
}

    '<div class="sub-header">'+
      '<span class="sub-title" title="'+esc(c.name)+'"><i class="health-light health-'+c.health+'" style="display:inline-block;margin-right:8px;vertical-align:middle"></i>'+esc((c.name&&c.name.length>26)?c.name.slice(0,24)+'…':c.name)+'</span>'+orgSub+
      '<div class="sub-kpis">'+
        '<div class="sub-kpi"><span class="k">workflow</span><span class="v num">'+c.workflows+'</span></div>'+
        '<div class="sub-kpi"><span class="k">在飞 Run</span><span class="v num" style="color:var(--running)">'+c.active+'</span></div>'+
        '<div class="sub-kpi"><span class="k">近窗运行</span><span class="v num">'+c.runsTotal+'</span></div>'+
      '</div>'+
      '<div class="sub-spacer"></div>'+
      '<div class="segmented" data-act="l1seg">'+
        '<button class="'+(sub==='roster'?'on':'')+'" data-seg="roster">运行与 workflow</button>'+
        '<button class="'+(sub==='flow'?'on':'')+'" data-seg="flow">数据流</button>'+
      '</div>'+

    renderFlow(canvas, detail.flow, function(){});
  }};

  return {html:subHeader+l1Roster(detail,coId), mount:bindFleet};
}

function l1Roster(detail,coId){
  if(detail.empty || !detail.runs.length) return '<div class="view-scroll">'+emptyBlock('roster')+'</div>';
  /* workflow 概览（由真实 run 派生；员工花名册无后端 -> 用 workflow + 真实跑批统计代替，标 ~近似） */
  var wfRows=detail.workflows.map(function(w){
    var st=w.running>0?statusLight('busy'):(w.failed>0?statusLight('failed'):statusLight('idle'));
    return '<tr>'+
      '<td><b style="color:var(--heading);font-weight:550">'+esc(w.name)+'</b></td>'+
      '<td>'+st+'</td>'+
      '<td class="tnum">'+w.total+'</td>'+
      '<td class="tnum" style="color:var(--success)">'+w.success+'</td>'+
      '<td class="tnum" style="color:'+(w.failed>0?'var(--failed)':'var(--faint)')+'">'+w.failed+'</td>'+
      '<td class="tnum" style="color:'+(w.running>0?'var(--running)':'var(--faint)')+'">'+w.running+'</td>'+
      '<td style="color:var(--faint)">'+esc(fleetAgo(w.lastActivity))+'</td></tr>';
  }).join('');
  var wfPanel='<div class="panel"><div class="panel-title">本组织内的 workflow（近窗去重）'+srcBadge('approx')+'</div>'+
    '<div class="protable-wrap"><table class="protable"><thead><tr>'+
    '<th>workflow</th><th>状态</th><th>运行</th><th>完成</th><th>失败</th><th>在飞</th><th>最近活动</th>'+
    '</tr></thead><tbody>'+wfRows+'</tbody></table></div></div>';
  /* 真实运行列表（点击行 -> foundation data-run 深链进 observatory，选中该 run） */
  var runRows=detail.runs.slice(0,80).map(function(r){
    var rstatus={running:'running',completed:'success',failed:'failed',timed_out:'failed',stopped:'stuck',disabled:'stuck'}[r.status]||'stuck';
    return '<tr data-run="'+esc(r.id)+'">'+
      '<td><b style="color:var(--heading);font-weight:550">'+esc(r.name)+'</b><div style="font-size:11px;color:var(--faint)" class="tnum">'+esc(r.id)+'</div></td>'+
      '<td>'+statusTag(rstatus)+'</td>'+
      '<td>'+originPill(r.origin)+'</td>'+
      '<td class="tnum" style="color:var(--faint)">'+esc(fleetAgo(r.updatedAtUtc))+'</td>'+
      '<td><span class="ibtn" style="height:24px;pointer-events:none">观测 ↗</span></td></tr>';
  }).join('');
  var runPanel='<div class="panel" style="margin-top:16px"><div class="panel-title">该组织的运行（observatory __all__ 过滤）'+srcBadge('ready')+'</div>'+
    '<div class="protable-wrap"><table class="protable"><thead><tr>'+
    '<th>workflow / runId</th><th>状态</th><th>来源</th><th>最近活动</th><th></th>'+
    '</tr></thead><tbody>'+runRows+'</tbody></table></div>'+
    '<p style="margin-top:8px;font-size:11.5px;color:var(--faint)">点击任一行进入运行观测台查看该 run 的逐步 trace / DAG / 产出。</p></div>';
  return '<div class="view-scroll">'+wfPanel+runPanel+'</div>';
}
function l1chip(val,label,a,b,sf){
  var color=typeof a==='string'?a:null;
  var cnt=color?b:a;
  var on=(sf||null)===(val||null);
  return '<button class="chip'+(on?' on':'')+'" data-status="'+(val||'all')+'">'+
    (color?'<span class="dot" style="background:'+color+'"></span>':'')+esc(label)+'<span class="cnt">'+cnt+'</span></button>';
}

  var sched=e.sched?'<div class="emp-sched">'+ICON.calendar+'下次排班 '+esc(e.sched.next)+'</div>':'';

      '<span class="num">'+fmtMoney(e.today.cost)+'</span></div>'+

function rosterTable(emps,coId){

    return '<tr data-emp="'+e.id+'" data-co="'+coId+'">'+

    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ============================== L2 员工 / 任务 ============================== */
function viewL2(coId,empId){
  /* L2 员工/任务层无后端事实源（花名册已下线为 workflow 概览）。诚实跳回 L1（组织运行列表），
     从那里点 run 行进观测台才是真实下钻路径。保留函数以兼容旧分享链接，不渲染伪造员工。 */
  var detail=companyDetail(coId); var c=detail&&detail.co;
  var head=

/* ---------------- cron 控件（Skills / Schedules 共用） ---------------- */
function cronFieldMatcher(expr,min,max){
  if(expr==='*') return function(){return true;};
  var allowed={};
  expr.split(',').forEach(function(part){
    var step=1,range=part;
    if(part.indexOf('/')>=0){var sp=part.split('/');range=sp[0];step=parseInt(sp[1],10)||1;}
    var lo,hi;
    if(range==='*'){lo=min;hi=max;}
    else if(range.indexOf('-')>=0){var r=range.split('-');lo=parseInt(r[0],10);hi=parseInt(r[1],10);}
    else {lo=hi=parseInt(range,10);}
    if(isNaN(lo)||isNaN(hi))return;
    for(var v=lo;v<=hi;v+=step) allowed[v]=true;
  });
  return function(n){return !!allowed[n];};
}
function cronPreview(expr,count){
  count=count||5;
  var f=expr.trim().split(/\s+/); if(f.length!==5) return null;
  try{
    var mMin=cronFieldMatcher(f[0],0,59),mHour=cronFieldMatcher(f[1],0,23),
        mDom=cronFieldMatcher(f[2],1,31),mMon=cronFieldMatcher(f[3],1,12),mDow=cronFieldMatcher(f[4],0,6);
  }catch(_){return null;}
  var out=[],d=new Date(); d.setSeconds(0,0); d.setMinutes(d.getMinutes()+1);
  var guard=0;
  while(out.length<count && guard<527041){ guard++;
    if(mMin(d.getMinutes())&&mHour(d.getHours())&&mDom(d.getDate())&&mMon(d.getMonth()+1)&&mDow(d.getDay())) out.push(new Date(d.getTime()));

}
function fmtDateTime(d){

function cronEditor(expr){

  var presets=[['每小时','0 * * * *'],['每天 09:00','0 9 * * *'],['每周一 09:00','0 9 * * 1'],['每月 1 号','0 9 1 * *']]
    .map(function(p){return '<button class="chip" type="button" data-preset="'+p[1]+'">'+p[0]+'</button>';}).join('');

function bindCronEditors(root){
  Array.prototype.forEach.call(root.querySelectorAll('.cron-editor'),function(ed){
    function recompute(){

      var expr=vals.join(' '); ed.querySelector('.cron-expr-show').textContent=expr;
      var times=cronPreview(expr,5),list=ed.querySelector('.cron-preview-list');
      if(!times){list.innerHTML='<li class="cron-bad">表达式无效（需 5 个字段）</li>';return;}
      list.innerHTML=times.length?times.map(function(d){return '<li>'+fmtDateTime(d)+'</li>';}).join(''):'<li class="cron-bad">未来一年内无触发</li>';
    }
    Array.prototype.forEach.call(ed.querySelectorAll('[data-cf]'),function(i){i.addEventListener('input',recompute);});

function cqrsScopeTable(){
  var rows=CQRS_DATA.scopes.slice();
  if(CQRS_STATE.sort==='lag') rows.sort(function(a,b){return b.lag-a.lag;});
  else if(CQRS_STATE.sort==='count') rows.sort(function(a,b){return b.count-a.count;});
  var per=10,page=CQRS_STATE.page,slice=rows.slice(page*per,page*per+per);
  var maxLag=Math.max.apply(null,rows.map(function(r){return r.lag;}));

      '<td><div class="lag-gauge"><i style="width:'+pct+'%;background:'+(s.lag>800?'var(--failed)':s.lag>300?'var(--waiting)':'var(--success)')+'"></i></div><span class="tnum" style="font-size:11px;color:var(--muted)">'+s.lag+'ms</span></td>'+
      '<td class="tnum">'+fmtTok(s.count)+'</td>'+

  }).join('');

    '<th>scope</th><th class="sortable" data-cqrssort="lag">投影延迟 '+(CQRS_STATE.sort==='lag'?'↓':'')+'</th>'+
    '<th class="sortable" data-cqrssort="count">事件数 '+(CQRS_STATE.sort==='count'?'↓':'')+'</th><th>状态</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
    pager(rows.length,per,page,'cqrsPage');

function pager(total,per,page,act){

function bindSchedEditor(root){
  var ed=root.querySelector('.sk-cron'); if(!ed) return;
  function recompute(){
    var inputs=ed.querySelectorAll('[data-sc]'), allValid=true, segs=[];
    Array.prototype.forEach.call(inputs,function(i){ var v=i.value.trim()||'*'; segs.push(v); var ok=cronSegValid(v); i.classList.toggle('bad',!ok); if(!ok)allValid=false; });
    var expr=segs.join(' '); SKILL_STATE.sched.cron=expr;
    var show=ed.querySelector('.cron-expr-show'); if(show) show.textContent=expr;
    var errEl=ed.querySelector('.cron-err'), prev=ed.querySelector('.cron-preview'), list=ed.querySelector('.cron-preview-list'),
        createBtn=root.querySelector('#sk-sched-create');
    if(!allValid){ if(errEl)errEl.style.display='inline'; if(prev)prev.style.display='none'; if(createBtn)createBtn.setAttribute('disabled','disabled'); return; }
    if(errEl)errEl.style.display='none'; if(prev)prev.style.display=''; if(createBtn)createBtn.removeAttribute('disabled');
    var times=cronPreview(expr,5);
    if(list) list.innerHTML=(times&&times.length)?times.map(function(d){return '<li>'+fmtDateTime(d)+' · <span class="rel">'+relTime(d)+'</span></li>';}).join(''):'<li class="cron-bad">未来一年内无触发</li>';
  }
  Array.prototype.forEach.call(ed.querySelectorAll('[data-sc]'),function(i){ i.addEventListener('input',recompute); });
  var tz=root.querySelector('#sk-tz'); if(tz) tz.addEventListener('change',function(){ SKILL_STATE.sched.tz=tz.value; var h=ed.querySelector('.cron-preview-h b'); if(h)h.textContent=tz.value; });
  recompute();
}
function bindSkills(root){
  function reList(){ var l=root.querySelector('#skill-list'); if(l) l.innerHTML=skillList(); }
  function reDetail(){ var d=root.querySelector('#skill-detail'); if(d){ d.innerHTML=skillDetail(); bindSchedEditor(root); }
    var p=root.querySelector('#skills-pane'); if(p) p.classList.toggle('show-detail', !!SKILL_STATE.mobileDetail); }
  function capture(){
    var pr=root.querySelector('#sk-prompt'); if(pr) SKILL_STATE.invoke.prompt=pr.value;
    Array.prototype.forEach.call(root.querySelectorAll('[data-si]'),function(i){ SKILL_STATE.invoke.inputs[i.getAttribute('data-si')]=i.value; });
    var ex=root.querySelector('#sk-extra'); if(ex) SKILL_STATE.invoke.extra=ex.value;
    var dn=root.querySelector('#sk-dispname'); if(dn) SKILL_STATE.sched.displayName=dn.value;
    var tz=root.querySelector('#sk-tz'); if(tz) SKILL_STATE.sched.tz=tz.value;
    var en=root.querySelector('#sk-enablenow'); if(en) SKILL_STATE.sched.enableNow=en.checked;
    var sg=root.querySelectorAll('[data-sc]'); if(sg.length===5) SKILL_STATE.sched.cron=Array.prototype.map.call(sg,function(i){return i.value.trim()||'*';}).join(' ');
  }
  function selectSkill(guid){
    var s=SKILLS_DATA.filter(function(x){return x.guid===guid;})[0]||SKILLS_DATA[0]||null;
    SKILL_STATE.selected=guid; SKILL_STATE.mobileDetail=true; SKILL_CONFIRM=null;
    SKILL_STATE.invoke={state:'idle',prompt:'',inputs:{},extra:'',result:null,promptErr:false};
    SKILL_STATE.sched={displayName:(s?s.name:''),cron:'0 9 * * *',tz:'Asia/Shanghai',enableNow:true,result:null,authErr:false};
  }
  function runInvoke(){
    var iv=SKILL_STATE.invoke, s=skillSelected(); if(!s) return;
    if(!String(iv.prompt||'').trim()){ iv.promptErr=true; reDetail(); return; }
    iv.promptErr=false; iv.state='running'; iv.result=null; reDetail();
    var body={ prompt:String(iv.prompt||'').trim() };
    adminApi('/api/workflow/skills/'+encodeURIComponent(s.guid)+'/invoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(res){
        if(res&&res.forbidden){ iv.state='failed'; iv.result={code:'forbidden',message:'当前账号无权调用该技能（403）'}; reDetail(); return; }
        return res.json().then(function(j){ if(res.ok){ iv.state='done'; iv.result={runId:j.runId, workflowName:j.workflowName, runKind:j.runKind, observatoryUrl:j.observatoryUrl}; }
          else { iv.state='failed'; iv.result={code:j.code||('HTTP '+res.status), message:j.message||j.error||'调用失败'}; } reDetail(); }); })
      .catch(function(err){ if(err&&err.unauthorized) return; iv.state='failed'; iv.result={code:'error', message:(err&&(err.body||err.message))||'网络错误'}; reDetail(); });
  }
  function createSched(){
    var sc=SKILL_STATE.sched, segs=String(sc.cron).split(/\s+/);
    if(!(segs.length===5 && segs.every(cronSegValid))) return;
    var s=skillSelected(); if(!s) return; sc.authErr=false; sc.result=null;
    var body={ prompt:String(SKILL_STATE.invoke.prompt||'').trim()||undefined, cronExpression:sc.cron, timezone:sc.tz, displayName:(sc.displayName||s.name) };
    adminApi('/api/workflow/skills/'+encodeURIComponent(s.guid)+'/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(res){
        if(res&&res.forbidden){ sc.authErr=true; reDetail(); return; }
        if(res.status===401){ sc.authErr=true; reDetail(); return; }
        return res.json().then(function(j){ if(res.ok){ sc.result=j.scheduleId; loadMySchedules(reDetail); } else { sc.authErr=(res.status===403); reDetail(); } }); })
      .catch(function(err){ if(err&&err.unauthorized) return; sc.authErr=false; reDetail(); });
  }
  if(!SKILL_STATE.loaded){ SKILL_STATE.loading=true; reList();
    loadSkills(function(){ SKILL_STATE.loaded=true; SKILL_STATE.loading=false; reList();
      if(SKILL_STATE.selected){ SKILL_STATE.sched.displayName=SKILL_STATE.sched.displayName||((skillSelected()||{}).name||''); loadSkillDetail(SKILL_STATE.selected, reDetail); }
      loadMySchedules(reDetail); });
  }
  bindSchedEditor(root);
  var se=root.querySelector('#skill-search'); se&&se.addEventListener('input',function(){ SKILL_STATE.search=se.value; reList(); });
  root.addEventListener('click',function(ev){
    var sr=ev.target.closest('[data-skill]'); if(sr){ capture(); selectSkill(sr.getAttribute('data-skill')); reList(); reDetail(); loadSkillDetail(SKILL_STATE.selected, reDetail); return; }
    var act=ev.target.closest('[data-act]'); if(!act||act.hasAttribute('disabled')) return; var a=act.getAttribute('data-act');
    if(a==='skBack'){ SKILL_STATE.mobileDetail=false; reDetail(); }
    else if(a==='skInvoke'){ capture(); runInvoke(); }
    else if(a==='skCopy'){ copyWithToast(act.getAttribute('data-copy')); }
    else if(a==='skOpenRun'){ var u=act.getAttribute('data-url'); if(u){ location.assign(u); } else { navigate(['observatory'],{}); } }
    else if(a==='skReload'){ SKILL_STATE.loaded=false; SKILLS_LOADED=false; SKILL_STATE.loading=true; reList(); loadSkills(function(){ SKILL_STATE.loaded=true; SKILL_STATE.loading=false; reList(); }); }
    else if(a==='skPreset'){ capture(); SKILL_STATE.sched.cron=act.getAttribute('data-cron'); reDetail(); }
    else if(a==='skSchedCreate'){ capture(); createSched(); }
    else if(a==='skSchedAuth'){ SKILL_STATE.sched.authErr=true; SKILL_STATE.sched.result=null; reDetail(); }
    else if(a==='skSchedRetry'){ SKILL_STATE.sched.authErr=false; reDetail(); }
    else if(a==='skSchedToggle'){ var tid=act.getAttribute('data-id'); var tx=SKILL_SCHED.filter(function(s){return s.id===tid;})[0]; var op=(tx&&tx.enabled)?':disable':':enable'; adminApi('/api/schedules/'+encodeURIComponent(tid)+op,{method:'POST'}).then(function(res){ if(res&&res.forbidden){ toast('无权操作该排班（403）'); return; } if(res.ok) loadMySchedules(reDetail); else toast('操作失败 HTTP '+res.status); }).catch(function(){ toast('操作失败'); }); }
    else if(a==='skSchedRun'){ var rid=act.getAttribute('data-id'); adminApi('/api/schedules/'+encodeURIComponent(rid)+':run-now',{method:'POST'}).then(function(res){ if(res&&res.forbidden){ toast('无权运行该排班（403）'); return; } toast(res.ok?'已触发立即运行 · '+rid:'触发失败 HTTP '+res.status); }).catch(function(){ toast('触发失败'); }); }
    else if(a==='skSchedObs'){ navigate(['observatory'],{schedule:act.getAttribute('data-id')}); }
    else if(a==='skSchedRetry'){ SKILL_STATE.sched.authErr=false; SKILL_STATE.sched.result=null; reDetail(); }
    else if(a==='skSchedDel'){ SKILL_CONFIRM=act.getAttribute('data-id'); reDetail(); }
    else if(a==='skDelCancel'){ SKILL_CONFIRM=null; reDetail(); }
    else if(a==='skDelConfirm'){ var did=SKILL_CONFIRM; SKILL_CONFIRM=null; reDetail(); adminApi('/api/schedules/'+encodeURIComponent(did),{method:'DELETE'}).then(function(res){ if(res&&res.forbidden){ toast('无权删除该排班（403）'); return; } if(res.ok) loadMySchedules(reDetail); else toast('删除失败 HTTP '+res.status); }).catch(function(){ toast('删除失败'); }); }
  });
}

/* ================= ⑦ 排班调度 Schedules ================= */
function schedFilterBar(){
  function tab(f,lbl){ return '<button class="chip'+(SCHED_FILTER===f?' on':'')+'" data-act="schFilter" data-f="'+f+'">'+lbl+'</button>'; }
  return '<div class="toolbar"><div class="chips" style="display:flex;gap:6px">'+
    tab('all','全部')+tab('enabled','启用')+tab('disabled','停用')+tab('failing','有失败')+'</div>'+
    '<div class="grow"></div><button class="ibtn" data-act="schRefresh">'+ICON.refresh+' 刷新</button></div>';
}
function schedulesBody(){
  if(!SCHED_LOADED) return '<div class="sk-card" style="height:48px"></div>'+
    '<div class="sk-card" style="height:150px;margin-top:14px"></div>';
  if(SCHED_ERR==='__forbidden__') return auth403('当前账号无权查看排班列表，已按诚实态屏蔽。');
  if(SCHED_ERR) return '<div class="alert"><span class="grow">排班加载失败：'+esc(SCHED_ERR)+'</span>'+
    '<button class="btn" data-act="schRefresh">重试</button></div>';
  if(!SCHEDULES_DATA.length) return schedFilterBar()+
    '<div class="empty" style="padding:34px"><div class="et">暂无排班</div>'+
      '<div class="es">在「技能调用」为某个技能配置 cron 排班后，将出现在此处统一管理（含启用/停用/立即运行/删除）。</div></div>';
  var shown=SCHEDULES_DATA.filter(_schPass);
  var rows=shown.map(function(x){
    var lastFail=!!x.lastError||(x.fails||0)>0;
    /* 状态点用真实色变量内联（设计的 .sdot 颜色来自父 .sl-* 类，此处不依赖缺失的修饰类）：
       启用+正常 -> --running；启用+有失败 -> --failed；停用 -> --idle */
    var dotColor=x.enabled?(lastFail?'var(--failed)':'var(--running)'):'var(--idle)';
    var dotTitle=x.enabled?(lastFail?'启用 · 有失败':'启用'):'停用';
    var open=!!SCHED_OPEN[x.id];
    var stats='<span class="num">'+x.fires+'</span> 次'+(x.fails?' · <b style="color:var(--failed)">失败 '+x.fails+'</b>':'');
    var busyDis=SCHED_BUSY?' disabled':'';
    var toggleOp=x.enabled?'disable':'enable', toggleLbl=x.enabled?'停用':'启用';
    var name='<span class="sdot" title="'+dotTitle+'" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+dotColor+';margin-right:6px;vertical-align:middle" aria-hidden="true"></span><b style="color:var(--heading);font-weight:550">'+esc(x.skill)+'</b>'+
        '<span class="src src-ready" style="margin-left:6px">'+esc(x.kind)+'</span>'+
        '<button class="ibtn" data-act="schToggleDetail" data-id="'+esc(x.id)+'" style="height:20px;margin-left:6px" title="字段详情">'+(open?'收起':'详情')+'</button>'+
        '<div style="font-size:11px;color:var(--faint);margin-top:2px">'+esc(x.target)+(x.tz?' · '+esc(x.tz):'')+'</div>'+
        (lastFail&&x.lastError?'<div style="font-size:10.5px;color:var(--failed);margin-top:2px" title="'+esc(x.lastError)+'">⚠ '+esc(String(x.lastError).slice(0,80))+'</div>':'')+
        (open?schedRowDetail(x):'');
    var actions='<button class="ibtn" data-act="schAction" data-op="run-now" data-id="'+esc(x.id)+'" style="height:24px"'+busyDis+'>运行</button> '+
        '<button class="ibtn" data-act="schAction" data-op="'+toggleOp+'" data-id="'+esc(x.id)+'" style="height:24px"'+busyDis+'>'+toggleLbl+'</button> '+
        '<button class="ibtn" data-act="schObs" data-id="'+esc(x.id)+'" style="height:24px">观测台 ↗</button> '+
        '<button class="ibtn" data-act="schAction" data-op="delete" data-id="'+esc(x.id)+'" style="height:24px"'+busyDis+'>删除</button>';
    return '<tr><td>'+name+'</td>'+
      '<td class="tnum">'+esc(x.cron)+'</td>'+
      '<td class="tnum">'+esc(x.next)+'</td>'+
      '<td style="color:'+(x.last.indexOf('失败')>=0?'var(--failed)':'var(--faint)')+'">'+esc(x.last)+'<div style="font-size:10.5px;color:var(--faint);margin-top:1px">'+stats+'</div></td>'+
      '<td>'+actions+'</td></tr>';
  }).join('');
  var head='<thead><tr><th>排班</th><th>cron</th><th>下次</th><th>上次 / 触发</th><th>操作</th></tr></thead>';
  var bodyRows=shown.length?rows:'<tr><td colspan="5"><div class="empty" style="padding:22px"><div class="es">当前筛选下没有排班。</div></div></td></tr>';
  return schedFilterBar()+'<div class="protable-wrap"><table class="protable">'+head+'<tbody>'+bodyRows+'</tbody></table></div>';
}
function viewSchedules(){
  return {html:moduleSubHeader('schedules','<span class="inline-refresh">GET /api/schedules · 实时轮询 · 动作 202 receipt '+srcBadge('ready')+'</span>')+
    '<div class="view-scroll" id="schedules-root">'+schedulesBody()+'</div>', mount:function(root){
      /* re() 同时承担轮询自停职责：SPA 的 render() 切视图时只替换 #app.innerHTML，不做全局 timer
         拆除，所以一旦本视图的 #schedules-root 不在文档里（已离开排班页），就停掉 3s 轮询，避免后台泄漏。 */
      function re(){ var b=document.getElementById('schedules-root');
        if(!b){ schedStopPoll(); return; } b.innerHTML=schedulesBody(); }
      loadSchedules(re);
      schedStartPoll(re);                 /* 3s 轮询：对齐真实只读 /schedules 页 */
      root.addEventListener('click',function(ev){ var act=ev.target.closest('[data-act]'); if(!act||act.hasAttribute('disabled'))return; var a=act.getAttribute('data-act');
        if(a==='schRefresh'){ SCHED_LOADED=false; re(); loadSchedules(re); }
        else if(a==='schFilter'){ schedSetFilter(act.getAttribute('data-f'), re); }
        else if(a==='schToggleDetail'){ var did=act.getAttribute('data-id'); if(did){ SCHED_OPEN[did]=!SCHED_OPEN[did]; re(); } }
        else if(a==='schObs'){ var oid=act.getAttribute('data-id'); if(oid) navigate(['observatory'],{schedule:_schObs(oid)}); }
        else if(a==='schAction'){ var id=act.getAttribute('data-id'), op=act.getAttribute('data-op'); if(id&&op) schedAction(id, op, re); }
      });
    }};
}

function chanStep4(){
  var m=WZ.model;
  if(m.llmLoading && !m.llm){
    return '<div class="wz-h">配置回复模型</div><div class="wz-sub">不配置则使用平台默认模型回复入站消息。</div>'+

      wzFoot({back:true, next:{label:'下一步：验证', act:'wzModelNext'}});
  }
  var llm=m.llm;
  /* Honest options: real routes/models from the owner LLM catalog. No fabricated vendor menu. */
  var routeOpts=(llm&&llm.routeOptions)||[];
  if(m.route==null) m.route=(llm&&(llm.savedRoute||llm.effectiveRoute))||(routeOpts[0]&&routeOpts[0].routeValue)||'';
  var curRoute=m.route;
  var liveModels=(((llm&&llm.modelGroupsByRoute)||[]).filter(function(g){return g.routeValue===curRoute;})
    .reduce(function(acc,g){return acc.concat(g.models||[]);},[]));
  if(!liveModels.length && llm && llm.defaultModel) liveModels=[llm.defaultModel];
  if(m.model==null) m.model='';
  /* route select: when the catalog is unavailable, the only honest route is the gateway default (empty value). */
  var routeChoices = routeOpts.length
    ? routeOpts.map(function(o){ return {value:o.routeValue, label:o.label||o.routeValue}; })
    : [{value:'', label:'平台默认路由'}];
  var routeSel='<select class="std-select" id="m-route">'+routeChoices.map(function(o){
    return '<option value="'+esc(o.value)+'"'+(curRoute===o.value?' selected':'')+'>'+esc(o.label)+'</option>'; }).join('')+'</select>';
  /* model select: always offer the genuine "（平台默认）" sentinel (empty -> server resolves), then real models. */
  var modelChoices=[{value:'',label:'（平台默认）'}].concat(liveModels.map(function(x){return {value:x,label:x};}));
  var modelSel='<select class="std-select" id="m-model">'+modelChoices.map(function(o){
    return '<option value="'+esc(o.value)+'"'+(m.model===o.value?' selected':'')+'>'+esc(o.label)+'</option>'; }).join('')+'</select>';
  var catalogNote = (llm && llm.catalogStatus && llm.catalogStatus!=='ready')
    ? '<div class="warn-box">⚠ 模型目录暂不可用（'+esc(llm.catalogStatus)+'）—— 现在只能选平台默认。可保存后稍后回来调整。</div>' : '';
  var saveBlk = m.state==='saved' ? '<span class="invoke-result ok" style="display:inline-flex">✓ 已保存回复模型</span>'
    : m.state==='saving' ? '<span class="cfg-pub"><span class="spinner"></span> 保存中…</span>'

function bindChannels(root){
  function re(){ var b=root.querySelector('#chan-root'); if(b) b.innerHTML=chanRoot(); maybeVerify(); }
  CHAN_RERENDER=re;
  if(!CHAN_LOADED || !CHAN_LOADING){ loadChannels(); }
  function capture(){
    Array.prototype.forEach.call(root.querySelectorAll('[data-cw]'),function(i){ WZ.data[i.getAttribute('data-cw')]=i.value; });
    var mr=root.querySelector('#m-route'), mm=root.querySelector('#m-model');
    if(mr) WZ.model.route=mr.value; if(mm) WZ.model.model=mm.value;
  }
  var VERIFY_TIMER=null;
  function stopVerify(){ if(VERIFY_TIMER){ clearInterval(VERIFY_TIMER); VERIFY_TIMER=null; } }
  function maybeVerify(){
    if(CHAN_VIEW.mode==='wizard' && WZ.step===5 && !WZ.verify.started){
      WZ.verify.started=true;
      var regId=WZ.reg&&WZ.reg.registrationId;
      if(!regId){ WZ.verify.inbound='unknown'; WZ.verify.active='unknown'; return; }
      stopVerify();
      VERIFY_TIMER=setInterval(function(){
        adminJson('/api/channels/registrations/'+encodeURIComponent(regId)+'/status').then(function(s){
          if(!s||s.forbidden) return; var st=(s.status||'').toLowerCase();
          if(s.last_event_at) WZ.verify.inbound='ok';
          if(st==='active'){ WZ.verify.inbound='ok'; WZ.verify.active='ok'; stopVerify(); }
          re();
        }).catch(function(){});
      }, 3500);
    }
    if(CHAN_VIEW.mode!=='wizard' || WZ.step!==5) stopVerify();
  }
  function runReg(){ doRegister(); }   /* real POST /api/channels/registrations — no timers, no simulated branches */
  root.addEventListener('click',function(ev){
    var act=ev.target.closest('[data-act]'); if(!act||act.hasAttribute('disabled')) return; var a=act.getAttribute('data-act');
    /* 列表 / 管理 */
    if(a==='chanReload'){ loadChannels(); }
    else if(a==='chanNew'){ CHAN_VIEW.mode='wizard'; WZ=newWZ(); re(); }
    else if(a==='chanAcct'){ var ab=ev.target.closest('[data-acct]'); if(ab){ var nv=ab.getAttribute('data-acct'); if(nv!==CHAN_ACCT){ CHAN_ACCT=nv; loadChannels(); } } }
    else if(a==='chanView'){ CHAN_MANAGE.idx=+act.getAttribute('data-channel'); CHAN_VIEW.mode='manage'; re(); }
    else if(a==='chanBackList'){ CHAN_VIEW.mode='list'; re(); }
    else if(a==='chanRebind'){ var c=CHANNELS_DATA[+act.getAttribute('data-channel')]; CHAN_VIEW.mode='wizard'; WZ=newWZ(c&&c.type==='telegram'?'telegram':'lark'); re(); }
    else if(a==='chanUnbind'){ CHAN_CONFIRM=+act.getAttribute('data-channel'); re(); }
    else if(a==='chanUnbindCancel'){ CHAN_CONFIRM=null; re(); }
    else if(a==='chanUnbindConfirm'){ CHANNELS_DATA.splice(CHAN_CONFIRM,1); CHAN_CONFIRM=null; CHAN_VIEW.mode='list'; re(); }
    else if(a==='chanRefresh'){ var ri=+act.getAttribute('data-channel'); act.innerHTML='<span class="spinner"></span> 刷新中'; var rc=CHANNELS_DATA[ri]; if(rc) loadChannelStatus(rc); else re(); }
    /* 向导 */
    else if(a==='wzCancel'){ CHAN_VIEW.mode='list'; CHAN_CONFIRM=null; re(); }
    else if(a==='wzPick'){ WZ.provider=act.getAttribute('data-prov'); WZ.step=1; WZ.maxReached=Math.max(WZ.maxReached,1); re(); }
    else if(a==='wzGoto'){ capture(); var gi=+act.getAttribute('data-i'); if(gi<=WZ.maxReached){ WZ.step=gi; re(); if(gi===4 && !WZ.model.llm) loadWzLlm(); } }
    else if(a==='wzBack'){ capture(); WZ.step=Math.max(0,WZ.step-1); re(); }
    else if(a==='wzCredNext'){ capture(); var fs=CHAN_FIELDS[WZ.provider]||[], errs={};
      fs.forEach(function(f){ if(f.req && !(WZ.data[f.k]||'').trim()) errs[f.k]='必填'; });
      WZ.errors=errs; if(Object.keys(errs).length){ re(); return; } WZ.step=2; WZ.maxReached=Math.max(WZ.maxReached,2); re(); }
    else if(a==='wzRegister'){ runReg(); }
    else if(a==='wzRegNext'){ WZ.step=3; WZ.maxReached=Math.max(WZ.maxReached,3); re(); }
    else if(a==='wzPermImport'){ WZ.perm.imported=true; re(); }
    else if(a==='wzPermToggle'){ WZ.perm.open=!WZ.perm.open; re(); }
    else if(a==='wzPublish'){ WZ.pub.state='done'; re(); }   /* manual Lark-console publish; no aevatar backend — acknowledge, don't fake a server round-trip */
    else if(a==='wzCfgNext'){ WZ.step=4; WZ.maxReached=Math.max(WZ.maxReached,4); re(); if(!WZ.model.llm) loadWzLlm(); }
    else if(a==='wzSaveModel'){ capture(); WZ.model.state='saving'; re();
      adminApi('/api/user-config/llm', { method:'PUT', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ routeValue:WZ.model.route||'', model:WZ.model.model||null }) })
        .then(function(r){ WZ.model.state=(r&&!r.forbidden&&r.ok)?'saved':'idle'; if(r&&!r.ok&&!r.forbidden) WZ.model.err='保存失败'; re(); })
        .catch(function(e){ if(e&&e.unauthorized) return; WZ.model.state='idle'; WZ.model.err=(e&&(e.body||e.message))||'保存失败'; re(); }); }
    else if(a==='wzModelNext'){ capture(); WZ.step=5; WZ.maxReached=Math.max(WZ.maxReached,5); re(); }
    else if(a==='wzFinish'){
      stopVerify(); CHAN_VIEW.mode='list'; WZ=newWZ(); re(); loadChannels(); }
    else if(a==='wzCopy'){ copyWithToast(act.getAttribute('data-copy')); }
  });
  /* Switching the LLM route must refresh the per-route model list — models are route-scoped. */
  root.addEventListener('change',function(ev){
    if(ev.target&&ev.target.id==='m-route'){ WZ.model.route=ev.target.value; WZ.model.model=null; WZ.model.state='idle'; WZ.model.err=null; re(); }
    else if(ev.target&&ev.target.id==='m-model'){ WZ.model.model=ev.target.value; WZ.model.state='idle'; }
  });
}

/* ================= ⑩ 审计日志 Audit Trail —— /api/audit/trail =================
   真实接口（cursor 分页，无 totalCount）：scope 三态 —— mine（调用者自身 scope，默认）、
   all（平台管理员跨组织通配，后端 __all__ 分支）、custom（指定具体 scope id，跨 scope 需 admin）。
   分类/结果筛选在前端对当前页做客户端过滤（接口未暴露 category query）。 */
var AUDIT_DATA=[];                  /* 已加载的记录行（累积，支持“加载更多”） */
var AUDIT_LOADED=false, AUDIT_LOADING=false, AUDIT_ERR=null, AUDIT_FORBIDDEN=false;
var AUDIT_CURSOR=null,              /* 下一页游标，null 表示无更多 */
    AUDIT_HAS_MORE=false, AUDIT_WATERMARK=null;
var AUDIT_RERENDER=null;
var AUDIT_STATE={                   /* 筛选/分类 UI 态 */
  scope:'mine',                     /* mine | all | custom（all/custom 仅 admin 可用） */
  customScope:'',                   /* scope==='custom' 时填的具体 scope id */
  actor:'',                         /* auditActorId 精确过滤（服务端） */
  from:'', to:'',                   /* ISO 时间范围（服务端） */
  cat:'all',                        /* 客户端分类：按 action 前缀/资源类型 */
  outcome:'all',                    /* 客户端结果过滤：Success/Denied/Error/... */
  text:''                           /* 客户端关键词（action/resource/id/correlation） */
};
/* outcome -> 渲染 tag 配色。后端返回 PascalCase 名字（Success/Denied/Error/Accepted/Cancelled）。 */
function auditOutcomeTag(o){
  var map={
    Success:['tag-success','成功'],
    Accepted:['tag-running','已接受'],
    Denied:['tag-failed','拒绝'],
    Error:['tag-failed','错误'],
    Cancelled:['tag-idle','取消']
  };
  var m=map[o]||['tag-idle',o||'未知'];
  return '<span class="tag '+m[0]+'"><span class="tdot"></span>'+esc(m[1])+'</span>';
}
/* action 多为 `<name>.attempted` / `<name>` 形式；取前缀做分类桶。 */
function auditActionCategory(action){
  var a=(action||'').toLowerCase();
  if(a.indexOf('login')>=0||a.indexOf('auth')>=0||a.indexOf('token')>=0) return 'auth';
  if(a.indexOf('workflow')>=0||a.indexOf('run')>=0) return 'workflow';
  if(a.indexOf('skill')>=0||a.indexOf('invoke')>=0||a.indexOf('tool')>=0) return 'tool';
  if(a.indexOf('schedule')>=0||a.indexOf('cron')>=0) return 'schedule';
  if(a.indexOf('channel')>=0||a.indexOf('relay')>=0) return 'channel';
  if(a.indexOf('scope')>=0||a.indexOf('admin')>=0||a.indexOf('user')>=0) return 'admin';
  if(a.indexOf('config')>=0||a.indexOf('setting')>=0) return 'config';
  return 'other';
}
var AUDIT_CATEGORIES=[
  {k:'all',label:'全部分类'},
  {k:'auth',label:'认证授权'},
  {k:'workflow',label:'工作流'},
  {k:'tool',label:'技能/工具'},
  {k:'schedule',label:'排班调度'},
  {k:'channel',label:'通道接入'},
  {k:'admin',label:'管理/账户'},
  {k:'config',label:'配置变更'},
  {k:'other',label:'其他'}
];
var AUDIT_OUTCOMES=[
  {k:'all',label:'全部结果'},
  {k:'Success',label:'成功'},
  {k:'Accepted',label:'已接受'},
  {k:'Denied',label:'拒绝'},
  {k:'Error',label:'错误'},
  {k:'Cancelled',label:'取消'}
];
function auditRerender(){ if(typeof AUDIT_RERENDER==='function') AUDIT_RERENDER(); }
function auditAgo(iso){
  if(!iso) return '—';
  var t=new Date(iso); if(isNaN(t.getTime())) return '—';
  var s=Math.max(0,(Date.now()-t.getTime())/1000);
  if(s<60) return Math.round(s)+'秒前';
  if(s<3600) return Math.round(s/60)+'分钟前';
  if(s<86400) return Math.round(s/3600)+'小时前';
  return Math.round(s/86400)+'天前';
}
function auditFmtTime(iso){
  if(!iso) return '—';
  var d=new Date(iso); if(isNaN(d.getTime())) return '—';
  function p2(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
}
/* 把 query string 拼出来：scope/actor/identity/from/to/take/cursor 都是服务端维度。
   scope 三态：mine → 不传（后端默认用调用者 scope）；all → __all__（admin 通配）；
   custom → 传具体 scope id（跨 scope 需 admin，由后端鉴权）。 */
function auditBuildQuery(opts){
  opts=opts||{};
  var q=[];
  if(opts.cursor) q.push('cursor='+encodeURIComponent(opts.cursor));
  var mode=AUDIT_STATE.scope;
  if(mode==='all') q.push('scope='+encodeURIComponent('__all__'));
  else if(mode==='custom'){
    var sid=(AUDIT_STATE.customScope||'').trim();
    if(sid) q.push('scope='+encodeURIComponent(sid));
  }
  var actor=(AUDIT_STATE.actor||'').trim();
  if(actor) q.push('auditActorId='+encodeURIComponent(actor));
  /* from/to：datetime-local 值形如 2026-07-01T00:00，补成 ISO UTC。
     这里按本地时间解释，转成 Z 结尾的时间戳交给后端。 */
  if(AUDIT_STATE.from){
    var fd=new Date(AUDIT_STATE.from); if(!isNaN(fd.getTime())) q.push('from='+fd.toISOString());
  }
  if(AUDIT_STATE.to){
    var td=new Date(AUDIT_STATE.to); if(!isNaN(td.getTime())) q.push('to='+td.toISOString());
  }
  q.push('take='+(opts.take||50));
  return q.length?('?'+q.join('&')):'';
}
/* 重置列表并重新加载（筛选条件变化、手动刷新时调用） */
async function loadAuditTrail(){
  AUDIT_LOADING=true; AUDIT_ERR=null; AUDIT_FORBIDDEN=false;
  AUDIT_DATA=[]; AUDIT_CURSOR=null; AUDIT_HAS_MORE=false;
  auditRerender();
  try{
    var j=await adminJson('/api/audit/trail'+auditBuildQuery({take:50}));
    if(j&&j.forbidden){ AUDIT_FORBIDDEN=true; AUDIT_DATA=[]; }
    else { AUDIT_DATA=(j&&j.records)||[]; AUDIT_CURSOR=(j&&j.nextCursor)||null;
      AUDIT_HAS_MORE=!!AUDIT_CURSOR; AUDIT_WATERMARK=(j&&j.queryWatermark)||null; }
  }catch(e){
    if(e&&e.unauthorized){ AUDIT_LOADING=false; return; }
    AUDIT_ERR=(e&&(e.body||e.message))||'审计日志加载失败';
    AUDIT_DATA=[];
  }
  AUDIT_LOADED=true; AUDIT_LOADING=false; auditRerender();
}
/* “加载更多”：用上一页返回的 nextCursor 继续取下一页，追加到 AUDIT_DATA */
async function loadAuditMore(){
  if(!AUDIT_CURSOR||AUDIT_LOADING) return;
  AUDIT_LOADING=true; auditRerender();
  try{
    var j=await adminJson('/api/audit/trail'+auditBuildQuery({take:50,cursor:AUDIT_CURSOR}));
    if(j&&j.forbidden){ AUDIT_FORBIDDEN=true; }
    else {
      var more=(j&&j.records)||[];
      Array.prototype.push.apply(AUDIT_DATA,more);
      AUDIT_CURSOR=(j&&j.nextCursor)||null; AUDIT_HAS_MORE=!!AUDIT_CURSOR;
    }
  }catch(e){ if(!(e&&e.unauthorized)){ AUDIT_ERR=(e&&(e.body||e.message))||'加载更多失败'; } }
  AUDIT_LOADING=false; auditRerender();
}
/* 客户端分类/结果/关键词过滤当前已加载记录 */
function auditFilteredRows(){
  var cat=AUDIT_STATE.cat, out=AUDIT_STATE.outcome, text=(AUDIT_STATE.text||'').trim().toLowerCase();
  return AUDIT_DATA.filter(function(r){

      '<div class="kv-row"><span class="kk">资源类型</span><span class="vv sans">'+esc(r.resourceType||'—')+'</span></div>'+
      '<div class="kv-row"><span class="kk">资源 ID</span><span class="vv">'+esc(r.resourceId||'—')+'</span></div>'+

    '</div>';
  }
  root.addEventListener('click',function(ev){

      AUDIT_LOADED=false; loadAuditTrail();

      AUDIT_STATE={scope:'mine',customScope:'',actor:'',from:'',to:'',cat:'all',outcome:'all',text:''};
      AUDIT_LOADED=false; loadAuditTrail();
    } else if(a==='auditMore'){
      loadAuditMore();
    } else if(a==='auditScope'){
      var sg=ev.target.closest('[data-scope]'); if(!sg) return;
      var next=sg.getAttribute('data-scope');
      AUDIT_STATE.scope=next;
      /* 切到 custom 只展开输入框，等用户填 scope id 后点「查询」；mine/all 立即重新查。 */
      if(next==='custom'){ re(); }
      else { AUDIT_LOADED=false; loadAuditTrail(); }
    } else if(a==='auditCat'){
      AUDIT_STATE.cat=act.getAttribute('data-cat'); re();

  root.addEventListener('change',function(ev){
    var el=ev.target; var a=el.getAttribute&&el.getAttribute('data-act');

    else if(a==='auditCustomScope') AUDIT_STATE.customScope=el.value;

  /* 在 scope id 输入框里回车 = 直接查询（与「查询」按钮等价） */
  root.addEventListener('keydown',function(ev){

      ev.preventDefault(); AUDIT_LOADED=false; loadAuditTrail();
    }
  });
}

  <script>
/* =========================================================================
   App shell + 路由 + breadcrumb + ContextDrawer + 横切交互
   路由（hash + query，可分享 / 刷新保持）：
     #/                              L0 集团总览
     #/c/:co?view=roster|flow        L1 公司视图
     #/c/:co/e/:emp?mode=emp|task    L2 员工 / 任务
     #/c/:co/e/:emp/r/:run           L3 Run（已存在 stub）
   ========================================================================= */
var STATE={l0Sort:'health',l0Filter:null,l0Range:'today',l1Sub:'roster',l1Status:null,l2Mode:'emp',search:'',collapsed:{},railCollapsed:false};
var _focusSearch=false;

/* ---------- hash parsing / building ---------- */
function parseHash(){
  var h=location.hash.replace(/^#/,''); if(h.indexOf('/')!==0) h='/'+h;
  var qi=h.indexOf('?'), path=qi>=0?h.slice(0,qi):h, qs=qi>=0?h.slice(qi+1):'';
  var parts=path.split('/').filter(Boolean), q={};
  qs.split('&').forEach(function(kv){ if(!kv)return; var i=kv.indexOf('=');
    q[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1)); });
  return {parts:parts,q:q};
}
function buildHash(parts,q){
  var p='#/'+parts.join('/'), keys=Object.keys(q).filter(function(k){return q[k]!=null&&q[k]!=='';});
  if(keys.length) p+='?'+keys.map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(q[k]);}).join('&');
  return p;
}
function curParts(){ return parseHash().parts; }
function setQuery(patch){
  var s=parseHash(), q=s.q;
  Object.keys(patch).forEach(function(k){ if(patch[k]==null) delete q[k]; else q[k]=patch[k]; });
  location.hash=buildHash(s.parts,q);
}
function navigate(parts,q){ location.hash=buildHash(parts,q||{}); }

/* ---------- breadcrumb（模块名 / 模块内路径） ---------- */
function breadcrumb(module, rest){
  var mname=(MODULE_META[module]&&MODULE_META[module].name)||module;
  var items=[{label:mname,parts:[module],cur:rest.length===0}];
  if(module==='fleet'&&rest[0]==='c'&&rest[1]){
    var co=companyById(rest[1]);
    items.push({label:co?co.name:rest[1],parts:['fleet','c',rest[1]],cur:rest.length===2});
    if(rest[2]==='e'&&rest[3]){
      var det=companyDetail(rest[1]); var e=det&&(employeeById(det,rest[3])||det.employees[0]);
      items.push({label:e?e.name:rest[3],parts:['fleet','c',rest[1],'e',rest[3]],cur:rest.length===4});
      if(rest[4]==='r'&&rest[5]) items.push({label:'Run '+rest[5],parts:['fleet'].concat(rest),cur:true});
    }
  }
  return '<nav class="crumb" aria-label="breadcrumb">'+items.map(function(it,i){
    var sep=i>0?'<span class="crumb-sep">/</span>':'';
    return sep+'<button class="crumb-item'+(it.cur?' cur':'')+'" data-crumb="'+it.parts.join('/')+'">'+esc(it.label)+'</button>';
  }).join('')+'</nav>';
}

/* ---------- shell（rail + main） ---------- */
function renderShell(module, rest, body){
  var collapsed=STATE.railCollapsed?' rail-collapsed':'';

          '<span class="live-badge" data-tip="活数据：随 AGUI SSE 跳动"><i class="live-dot"></i>live · AGUI</span>'+
          '<span class="stamp" data-tip="readmodel：最终一致快照">更新于 <span class="num" data-stamp>'+nowStamp()+'</span></span>'+
          '<button class="ibtn" data-act="srcLegend" aria-label="数据来源说明">ⓘ 来源</button>'+

}

/* ---------- render ---------- */
function render(){
  var s=parseHash(), parts=s.parts, q=s.q;
  /* derive URL-backed state */
  STATE.l0Sort=q.sort||'health'; STATE.l0Filter=q.filter||null; STATE.l0Range=q.range||'today';
  STATE.l1Sub=q.view||'roster'; STATE.l1Status=q.status||null; STATE.l2Mode=q.mode||'emp';

  var module=parts[0]||defaultModule(), rest=parts.slice(1);
  if(!canAccessModule(MODULE_META[module])){ module=defaultModule(); rest=[]; }
  var v;
  if(module==='fleet'){
    if(rest.length===0) v=viewL0();
    else if(rest[0]==='c'&&rest[2]==='e'&&rest[4]==='r') v=viewL3(rest[1],rest[3],rest[5]);
    else if(rest[0]==='c'&&rest[2]==='e') v=viewL2(rest[1],rest[3]);
    else if(rest[0]==='c') v=viewL1(rest[1]);
    else v=viewL0();

    v=opsView(module);

  var app=document.getElementById('app');

  app.innerHTML=renderShell(module, rest, v.html);
  if(v.mount) v.mount(app.querySelector('.view')||app);

/* ---------- toast ---------- */
function toast(msg){
  var r=document.getElementById('toast-root');
  var el=document.createElement('div'); el.className='toast';
  el.innerHTML=ICON.check+'<span>'+esc(msg)+'</span>'; r.appendChild(el);

/* Real clipboard copy. Tries the async Clipboard API, then a hidden-textarea + execCommand
   fallback for non-secure / older contexts. Resolves to the genuine success boolean so callers
   only ever claim "已复制" when the value actually reached the clipboard. No fake toasts. */
function execCommandCopy(value){
  var ta=document.createElement('textarea');
  ta.value=value; ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.opacity='0'; ta.style.pointerEvents='none';
  document.body.appendChild(ta); ta.select(); try{ ta.setSelectionRange(0,value.length); }catch(_){}
  var ok=false; try{ ok=document.execCommand('copy'); }catch(_){ ok=false; }
  ta.remove(); return ok;
}
function copyToClipboard(value){
  value=value==null?'':String(value);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(value).then(function(){ return true; },function(){ return execCommandCopy(value); });
  }
  return Promise.resolve(execCommandCopy(value));
}
/* Copy `value`; toast the honest outcome. okMsg/errMsg accept the value for interpolation. */
function copyWithToast(value,okMsg,errMsg){
  copyToClipboard(value).then(function(ok){ toast(ok?(okMsg||('已复制：'+value)):(errMsg||('复制失败，请手动选择：'+value))); });
}

/* ---------- events (delegation) ---------- */
function bindEvents(){
  document.addEventListener('click',function(ev){
    var t=ev.target;
    /* outside-click closes the source popover */
    if(_srcPopEl){ var inPop=t.closest('.src-pop'), onBtn=t.closest('[data-act="srcLegend"]'); if(!inPop&&!onBtn) closeSrcPop(); }
    /* breadcrumb */
    var cr=t.closest&&t.closest('[data-crumb]');
    if(cr){ var p=cr.getAttribute('data-crumb'); navigate(p?p.split('/'):[], {}); return; }

    /* 一级模块导航 */
    var navItem=t.closest&&t.closest('[data-module]');
    if(navItem){ var sh0=document.getElementById('console-shell'); if(sh0) sh0.classList.remove('rail-open'); navigate([navItem.getAttribute('data-module')],{}); return; }

    /* drawer */
    var act=t.closest&&t.closest('[data-act]');
    if(act){
      var a=act.getAttribute('data-act');
      if(a==='railToggle'){ var shT=document.getElementById('console-shell'); STATE.railCollapsed=!STATE.railCollapsed; if(shT) shT.classList.toggle('rail-collapsed',STATE.railCollapsed); return; }
      if(a==='railOpen'){ var shO=document.getElementById('console-shell'); if(shO) shO.classList.toggle('rail-open'); return; }
      if(a==='login'){ beginLogin(); return; }
      if(a==='logout'){ logout(); return; }
      if(a==='account'){ if(ACCOUNT){ toast('已登录 · '+ACCOUNT.name+(ACCOUNT.email?' · '+ACCOUNT.email:'')+(ACCOUNT.scope?' · '+ACCOUNT.scope:'')+'（NyxID 单点登录）'); } else { beginLogin(); } return; }
      if(a==='globalSearch'){ return; }
      if(a==='drawer-close'){ closeDrawer(); return; }
      if(a==='drawer-emp'){ closeDrawer(); navigate(['fleet','c',act.getAttribute('data-co'),'e',act.getAttribute('data-emp')],{}); return; }
      if(a==='refresh'){ act.querySelector('svg')&&act.classList.add('spin-once'); document.querySelectorAll('[data-stamp]').forEach(function(s){s.textContent=nowStamp();}); toast('已刷新（最终一致 readmodel）'); return; }
      if(a==='l0sort'){ var order=['health','cost','active']; var ni=(order.indexOf(STATE.l0Sort)+1)%3; setQuery({sort:order[ni]}); return; }
      if(a==='l1seg'){ var seg=t.closest('[data-seg]'); if(seg) setQuery({view:seg.getAttribute('data-seg')}); return; }
      if(a==='l2mode'){ var md=t.closest('[data-mode]'); if(md) setQuery({mode:md.getAttribute('data-mode')}); return; }
      if(a==='l0range'){ var rg=t.closest('[data-range]'); if(rg) setQuery({range:rg.getAttribute('data-range')}); return; }
      if(a==='l1status'){ var stb=t.closest('[data-status]'); if(stb){ var sv=stb.getAttribute('data-status'); setQuery({status:sv==='all'?null:sv}); } return; }
      if(a==='deptToggle'){ var dp=act.getAttribute('data-dept'); var key=curParts()[2]+'/'+dp; STATE.collapsed[key]=!STATE.collapsed[key]; render(); return; }
      if(a==='previewClick'){ toast('该图层尚无统一事实源，即将上线'); return; }
      if(a==='srcLegend'){ toggleSrcPop(); return; }
      if(a==='srcLegendClose'){ closeSrcPop(); return; }
      if(a==='retry'){ toast('已触发重试（示例）'); return; }
      if(a==='openObs'){ toast('打开既有 Run Observatory（示例）'); return; }
      if(a==='back-l2'){ var pp=curParts(); navigate(['fleet','c',pp[2],'e',pp[4]],{}); return; }
    }

    /* L0 filter chips */
    var chip=t.closest&&t.closest('[data-chip]');
    if(chip){ var cv=chip.getAttribute('data-chip'); setQuery({filter:STATE.l0Filter===cv?null:cv}); return; }
    /* L1 status chips (when not wrapped by data-act path above) */
    var stchip=t.closest&&t.closest('[data-status]');
    if(stchip && stchip.closest('[data-act="l1status"]')){ /* handled above */ }

    /* navigation: run > emp > company（顺序很重要） */
    var runEl=t.closest&&t.closest('[data-run]');
    if(runEl){ var rid=runEl.getAttribute('data-run');
      /* 深链进观测台并选中该 run：rid 即权威 run id（Fleet 与 observatory 同口径 mapXxxRuns 的 r.runId）。
         不再依赖 OBS_RUNS 是否已含该 run（看板数据在 FLEET_RUNS_BY_SCOPE，与 OBS_RUNS 是两套加载）。
         Fleet 为跨 scope __all__，强制 observatory 同口径，确保 loadObsRuns 后该 run 在列表内被选中、
         详情按其自身 scope 拉取，而非因 selectedId 未命中回落到首行。 */
      if(rid){ OBS_STATE.selectedId=rid; OBS_STATE.scope='__all__'; }
      navigate(['observatory'],{}); return; }
    var empEl=t.closest&&t.closest('[data-emp][data-co]');
    if(empEl){ navigate(['fleet','c',empEl.getAttribute('data-co'),'e',empEl.getAttribute('data-emp')],{}); return; }
    var coEl=t.closest&&t.closest('[data-co]');
    if(coEl && !coEl.hasAttribute('data-emp')){ navigate(['fleet','c',coEl.getAttribute('data-co')],{}); return; }
  });

  /* roster search (in-memory, focus-preserving) */
  document.addEventListener('input',function(ev){
    var t=ev.target;
    if(t.getAttribute&&t.getAttribute('data-act')==='l1search'){ STATE.search=t.value; _focusSearch=true; render(); }
  });

  /* Esc closes drawer / popover */
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'){ if(_drawerCtx) closeDrawer(); if(_srcPopEl) closeSrcPop(); } });

  window.addEventListener('hashchange',function(){ if(_drawerCtx) closeDrawer(); if(_srcPopEl) closeSrcPop(); render(); });
}

/* ---------- live stamp tick (simulated AGUI SSE heartbeat) ---------- */
function startClock(){
  setInterval(function(){ document.querySelectorAll('[data-stamp]').forEach(function(s){ s.textContent=nowStamp(); }); },1000);
}

/* ---------- login gate（未登录全屏） ---------- */
function renderLoginGate(){
  var app=document.getElementById('app'); if(!app) return;
  app.setAttribute('aria-busy','false');
  app.innerHTML=
    '<div style="height:100vh;display:grid;place-items:center;padding:24px">'+
      '<div class="empty" style="max-width:400px">'+
        '<div class="app-mark" style="justify-content:center;gap:9px"><span class="glyph" style="width:30px;height:30px;border-radius:7px">A</span>'+
          '<span class="name" style="font-size:15px">Aevatar Backend Console</span></div>'+
        '<div class="et" style="margin-top:10px">后端运维控制台</div>'+
        '<div class="es">使用 NyxID 账号登录，访问运行观测台、技能调用、投影管道、通道接入等后端运维模块。</div>'+
        '<button class="btn btn-primary" data-act="login" style="margin-top:10px">使用 NyxID 登录</button>'+
      '</div>'+
    '</div>';
}
/* /api/workflow/observatory/me 是套件共享身份探针：充实 admin/scope（失败则保留 token claims，admin=false）。 */
async function refreshAccount(){
  try{ var me=await adminJson('/api/workflow/observatory/me');
    if(me && !me.forbidden){ ACCOUNT=ACCOUNT||{};
      if(me.name) ACCOUNT.name=me.name; if(me.email) ACCOUNT.email=me.email;
      var sc=me.scope||me.scopeId||me.tenant; if(sc) ACCOUNT.scope=sc;
      ACCOUNT.admin=!!(me.isAdmin||me.admin||me.platformAdmin||me.isPlatformAdmin); }
  }catch(e){ /* /me 不可用：保留 token claims */ }
}
/* ---------- boot ---------- */
/* 右上角常驻登录态:渲染到 body(在 #app 之外)→切页 render() 不刷新它,固定右上角 */
function renderAcctW(){
  var el=document.getElementById('acctw');
  if(!ACCOUNT){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='acctw'; document.body.appendChild(el); }
  var nm=ACCOUNT.name||'NyxID 用户', sub=ACCOUNT.email||ACCOUNT.scope||'';
  el.innerHTML='<button class="acctw-chip" data-act="account" title="点击查看登录信息"><span class="acctw-av">'+esc((nm||'?').slice(0,1))+'</span>'+
    '<span class="acctw-meta"><b>'+esc(nm)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</span></button>'+
    '<button class="acctw-out" data-act="logout" title="登出 NyxID" aria-label="登出">⎋</button>';
}
(function boot(){
  bindEvents(); startClock();
  if(!getToken()){ renderLoginGate(); return; }
  ACCOUNT=accountFromToken();
  render(); renderAcctW();
  refreshAccount().then(function(){ if(ACCOUNT) render(); renderAcctW(); });
})();

</script>
</body>
</html>
