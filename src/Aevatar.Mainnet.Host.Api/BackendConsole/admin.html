<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 公司全景看板 · aevatar 控制台</title>
  <style data-od-inline-asset="css/app.css">
/* =========================================================================
   AI 公司全景看板 — aevatar 控制台
   设计 token 严格复用现有视觉语言（§2）。Light 主题。
   ========================================================================= */
:root{
  /* ---- palette (reused aevatar console tokens) ---- */
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --surface-3:#f6f7f9;
  --fg:#1f2937;          /* 正文 */
  --heading:#111827;     /* 标题 */
  --muted:#4b5563;       /* 次要 */
  --subtle:#6b7280;
  --faint:#9ca3af;
  --border:#e5e7eb;
  --border-strong:#d8dce2;
  --primary:#2563eb;     /* 主操作色 / info */
  --primary-strong:#1d4ed8;
  --primary-weak:#eef3ff;

  /* ---- status semantic (run domain tone) ---- */
  --success:#15a34a;  --success-bg:#eafaf0;  --success-bd:#bbe9cb;
  --running:#2563eb;  --running-bg:#eef3ff;  --running-bd:#c4d6ff;  /* 忙/运行中=蓝 */
  --waiting:#d97706;  --waiting-bg:#fdf3e3;  --waiting-bd:#f5d8a6;  /* 卡/等待=琥珀 */
  --failed:#dc2626;   --failed-bg:#fdeeee;   --failed-bd:#f3c4c4;   /* 失败/停止=红 */
  --idle:#9ca3af;     --idle-bg:#f1f2f4;     --idle-bd:#e2e4e8;     /* 闲=灰 */

  /* ---- metrics ---- */
  --header-h:56px;
  --pad:20px;
  --gap:16px;
  --r-card:4px;          /* 卡片 */
  --r-panel:8px;         /* 嵌入面板 */
  --inspector-w:720px;
  --shadow-card:0 1px 2px rgba(17,24,39,.04);
  --shadow-hover:0 6px 18px rgba(17,24,39,.10);
  --shadow-drawer:-12px 0 36px rgba(17,24,39,.14);

  --sans:'Alibaba PuHuiTi 2.0','Alibaba PuHuiTi','AlibabaSans','PingFang SC',
         -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Roboto Mono',Menlo,monospace;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font:14px/1.5 var(--sans);
  color:var(--fg);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px;}

/* ============================ Page shell ============================ */
.page-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

.app-header{
  height:var(--header-h);flex:0 0 var(--header-h);
  display:flex;align-items:center;gap:14px;
  padding:0 var(--pad);background:var(--surface);
  border-bottom:1px solid var(--border);z-index:30;
}
.app-mark{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
.app-mark .glyph{
  width:26px;height:26px;border-radius:6px;flex:0 0 auto;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;
}
.app-mark .name{font-weight:590;color:var(--heading);font-size:14px;white-space:nowrap;}

/* breadcrumb */
.crumb{display:flex;align-items:center;gap:2px;min-width:0;flex:1 1 auto;overflow:hidden;}
.crumb-sep{color:var(--border-strong);font-size:13px;padding:0 1px;flex:0 0 auto;}
.crumb-item{
  background:none;border:0;padding:4px 7px;border-radius:5px;font-size:13px;
  color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.crumb-item:hover{background:var(--surface-3);color:var(--heading);}
.crumb-item.cur{color:var(--heading);font-weight:550;pointer-events:none;}
.crumb-item.cur:hover{background:none;}

.header-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.live-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--success);
  background:var(--success-bg);border:1px solid var(--success-bd);
  padding:3px 9px;border-radius:999px;font-weight:550;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);
  box-shadow:0 0 0 0 rgba(21,163,74,.5);animation:livePulse 1.8s ease-out infinite;}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(21,163,74,.45)}70%{box-shadow:0 0 0 6px rgba(21,163,74,0)}100%{box-shadow:0 0 0 0 rgba(21,163,74,0)}}
.stamp{font-size:12px;color:var(--faint);}
.stamp .num{font-size:12px;color:var(--subtle);}

/* generic icon button */
.ibtn{
  height:30px;min-width:30px;padding:0 9px;border:1px solid var(--border);
  background:var(--surface);border-radius:6px;color:var(--muted);font-size:13px;
  display:inline-flex;align-items:center;gap:6px;transition:.14s;white-space:nowrap;
}
.ibtn:hover{border-color:var(--border-strong);color:var(--heading);background:var(--surface-2);}
.ibtn svg{width:15px;height:15px;}

/* search field */
.search{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;
  background:var(--surface-3);border:1px solid var(--border);border-radius:6px;width:200px;
}
.search:focus-within{border-color:var(--primary);background:var(--surface);}
.search svg{width:15px;height:15px;color:var(--faint);flex:0 0 auto;}
.search input{border:0;outline:0;background:none;font:13px var(--sans);color:var(--fg);width:100%;}

/* ============================ View region ============================ */
.view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.suite-embed{flex:1 1 auto;width:100%;min-height:0;border:0;display:block;background:var(--surface);}
.view-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:var(--pad);}
.sub-header{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px var(--pad);background:var(--surface);border-bottom:1px solid var(--border);
}
.sub-title{font-size:17px;font-weight:600;color:var(--heading);letter-spacing:-.01em;}
.sub-kpis{display:flex;align-items:center;gap:18px;}
.sub-kpi{display:flex;flex-direction:column;line-height:1.25;}
.sub-kpi .k{font-size:11px;color:var(--faint);}
.sub-kpi .v{font-size:15px;font-weight:600;color:var(--heading);}
.sub-spacer{flex:1 1 auto;}

/* segmented (组织花名册 | 数据流) */
.segmented{display:inline-flex;background:var(--surface-3);border:1px solid var(--border);
  border-radius:7px;padding:2px;gap:2px;}
.segmented button{
  border:0;background:none;padding:5px 13px;border-radius:5px;font-size:13px;
  color:var(--muted);font-weight:500;transition:.14s;
}
.segmented button.on{background:var(--surface);color:var(--heading);font-weight:550;box-shadow:var(--shadow-card);}

/* ============================ Toolbar / filters ============================ */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.toolbar .grow{flex:1 1 auto;}
.chip-row{display:inline-flex;gap:6px;flex-wrap:wrap;}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;
  border:1px solid var(--border);background:var(--surface);border-radius:999px;
  font-size:12.5px;color:var(--muted);transition:.14s;white-space:nowrap;
}
.chip:hover{border-color:var(--border-strong);color:var(--heading);}
.chip.on{background:var(--heading);border-color:var(--heading);color:#fff;}
.chip .dot{width:7px;height:7px;border-radius:50%;}
.chip .cnt{font-family:var(--mono);font-size:11px;opacity:.7;}
.seg-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface);}
.seg-toggle button{border:0;background:none;padding:5px 11px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--border);}
.seg-toggle button:last-child{border-right:0;}
.seg-toggle button.on{background:var(--primary-weak);color:var(--primary-strong);font-weight:550;}

.sortbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border:1px solid var(--border);background:var(--surface);border-radius:6px;font-size:12.5px;color:var(--muted);}
.sortbtn:hover{border-color:var(--border-strong);color:var(--heading);}
.sortbtn .lbl{color:var(--faint);}
.sortbtn .val{color:var(--heading);font-weight:550;}

/* ============================ MetricCard (KPI bar) ============================ */
.kpi-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);margin-bottom:18px;}
.metric-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  padding:14px 16px;box-shadow:var(--shadow-card);position:relative;
}
.metric-card .mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.metric-card .mc-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.metric-card .mc-ico{width:15px;height:15px;color:var(--faint);}
.metric-card .mc-val{font-size:28px;font-weight:600;color:var(--heading);letter-spacing:-.02em;
  font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1;}
.metric-card .mc-val.danger{color:var(--failed);}
.metric-card .mc-val.running{color:var(--running);}
.metric-card .mc-sub{font-size:12px;color:var(--faint);margin-top:7px;display:flex;align-items:center;gap:6px;}
.metric-card .mc-trend{font-size:12px;font-weight:550;}
.mc-up{color:var(--failed);}.mc-down{color:var(--success);}.mc-flat{color:var(--faint);}

/* source badge (现成 / ~近似 / 预览) */
.src{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:3px;
  font-size:10.5px;font-weight:550;letter-spacing:.02em;vertical-align:middle;white-space:nowrap;}
.src-ready{background:#eef2f7;color:#5b6573;}
.src-approx{background:var(--running-bg);color:var(--primary-strong);}
.src-preview{background:#f3eefe;color:#7a4fcf;}
.approx-mark{color:var(--waiting);font-family:var(--mono);font-weight:600;}

/* ===== 数据来源三档：approx 数值 / preview widget / tooltip / 图例 ===== */
.approx{display:inline-flex;align-items:center;gap:3px;line-height:1;cursor:help;}
.approx .ax-tilde{font-size:.7em;opacity:.75;font-family:var(--mono);color:var(--waiting);align-self:flex-start;margin-top:.1em;}
.approx .aval{display:inline-flex;align-items:baseline;color:inherit;}
.ax-dot{width:6px;height:6px;border-radius:50%;background:var(--waiting);display:inline-block;flex:0 0 auto;
  box-shadow:0 0 0 2px var(--waiting-bg);cursor:help;}
.metric-card .approx{align-items:center;}
.emp-meta .approx{gap:5px;color:var(--muted);}

/* tooltip（approx 点 / preview pill / 状态点 通用） */
[data-tip]{position:relative;}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);
  transform:translateX(-50%);background:var(--heading);color:#fff;font:500 11px/1.4 var(--sans);letter-spacing:0;
  padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:80;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2);}
[data-tip]:hover::before,[data-tip]:focus-visible::before{content:'';position:absolute;left:50%;bottom:calc(100% + 3px);
  transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--heading);z-index:80;pointer-events:none;}

/* 顶栏内的 tooltip 改为向下，避免顶部裁切 */
.app-header [data-tip]:hover::after,.app-header [data-tip]:focus-visible::after{bottom:auto;top:calc(100% + 8px);}
.app-header [data-tip]:hover::before,.app-header [data-tip]:focus-visible::before{bottom:auto;top:calc(100% + 3px);border-top-color:transparent;border-bottom-color:var(--heading);}

/* 状态 icon（颜色之外的形状区分，a11y） */
.tg{font-size:10px;line-height:1;display:inline-grid;place-items:center;min-width:11px;opacity:.95;}
.status-light .tg{font-size:10px;min-width:10px;}

/* 预览 widget：半透明 + 紫色 pill；点击只提示 */
.is-preview{position:relative;opacity:.5;filter:saturate(.5);}
.is-preview:hover{opacity:.64;}
.preview-pill{display:inline-flex;align-items:center;height:16px;padding:0 7px;border-radius:999px;
  background:#f1ebfd;color:#7a4fcf;font-size:10.5px;font-weight:600;border:1px solid #e3d6fb;letter-spacing:.02em;cursor:help;}
.chip.is-preview{filter:none;opacity:.6;gap:7px;}
.chip.is-preview .preview-pill{height:15px;}

/* 三档图例 */
.src-legend-bar{margin-top:20px;padding:15px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-panel);}
.src-legend{display:grid;grid-template-columns:repeat(2,minmax(230px,1fr));gap:11px 28px;}
.sl-row{display:flex;align-items:center;gap:13px;}
.sl-rt{grid-column:1 / -1;border-top:1px dashed var(--border);padding-top:11px;margin-top:1px;}
.sl-demo{min-width:58px;display:inline-flex;justify-content:flex-start;align-items:center;}
.sl-txt{display:flex;flex-direction:column;line-height:1.35;}
.sl-txt b{font-size:12.5px;color:var(--heading);}
.sl-txt span{font-size:11.5px;color:var(--faint);}

/* L0 注意力提示 — 老板视角核心钩子，要醒目 */
.co-alert{font-size:12.5px;}
.co-alert-warn{background:var(--waiting-bg);border-color:var(--waiting-bd);color:#9a5b07;}
.co-alert-danger{background:var(--failed-bg);border-color:var(--failed-bd);color:var(--failed);}
.co-alert .ca-ico{display:inline-flex;flex:0 0 auto;}
.co-alert .ca-ico svg{width:16px;height:16px;}
.co-alert .ca-txt{flex:1 1 auto;line-height:1.35;}
.co-alert .ca-txt b{color:inherit;font-weight:600;}
.co-alert .ca-min{font-size:16px;font-weight:700;padding:0 2px;font-variant-numeric:tabular-nums;}
.co-alert .live-dot{flex:0 0 auto;}

/* header 数据来源 popover */
.src-pop{position:fixed;top:52px;right:14px;width:360px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-panel);box-shadow:var(--shadow-hover);z-index:75;padding:15px 18px;animation:toastIn .16s ease;}
.src-pop h4{font-size:13px;color:var(--heading);margin-bottom:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
.src-pop .src-legend{grid-template-columns:1fr;}
.src-pop-close{border:0;background:none;color:var(--faint);font-size:15px;cursor:pointer;}

/* ============================ Company card wall (L0) ============================ */
.card-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:var(--gap);}
.co-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-panel);
  padding:16px;box-shadow:var(--shadow-card);cursor:pointer;transition:.16s;
  display:flex;flex-direction:column;gap:13px;position:relative;text-align:left;width:100%;
}
.co-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--border-strong);}
.co-card:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.co-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.co-name{font-size:15.5px;font-weight:600;color:var(--heading);display:flex;align-items:center;gap:8px;}
.health-light{width:9px;height:9px;border-radius:50%;flex:0 0 auto;position:relative;}
.health-green{background:var(--success);}
.health-amber{background:var(--waiting);}
.health-red{background:var(--failed);box-shadow:0 0 0 3px var(--failed-bg);}
.health-grey{background:var(--idle);}
.co-health-tag{font-size:11px;font-weight:550;padding:1px 7px;border-radius:3px;}
.co-active{display:flex;align-items:baseline;gap:7px;}
.co-active .big{font-size:30px;font-weight:600;color:var(--heading);font-family:var(--mono);line-height:1;}
.co-active .big.zero{color:var(--faint);}
.co-active .unit{font-size:12px;color:var(--muted);}
.co-cost{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.co-cost .cc-l{font-size:12.5px;color:var(--muted);}
.co-cost .cc-v{font-family:var(--mono);font-size:13px;color:var(--heading);font-weight:550;}
.sparkline{height:26px;width:88px;}
/* mini stacked bar 忙/闲/失败 */
.stack{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--idle-bg);}
.stack i{display:block;height:100%;}
.stack .s-busy{background:var(--running);}
.stack .s-idle{background:#cbd0d8;}
.stack .s-fail{background:var(--failed);}
.stack-legend{display:flex;gap:12px;font-size:11px;color:var(--faint);margin-top:6px;}
.stack-legend span{display:inline-flex;align-items:center;gap:4px;}
.stack-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
.co-alert{display:flex;align-items:center;gap:7px;font-size:12px;padding:7px 9px;border-radius:6px;
  background:var(--waiting-bg);color:#9a5b07;border:1px solid var(--waiting-bd);}
.co-alert.calm{background:var(--surface-3);color:var(--faint);border-color:var(--border);}
.co-alert svg{width:14px;height:14px;flex:0 0 auto;}
.co-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--border);padding-top:10px;}
.co-foot .emp{font-size:12px;color:var(--muted);}
.divider-h{height:1px;background:var(--border);margin:0;}

/* ============================ Roster (L1A) ============================ */
.dept-group{margin-bottom:18px;}
.dept-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;cursor:pointer;user-select:none;}
.dept-caret{width:16px;height:16px;color:var(--faint);transition:transform .18s;}
.dept-group.collapsed .dept-caret{transform:rotate(-90deg);}
.dept-name{font-size:13.5px;font-weight:600;color:var(--heading);}
.dept-meta{font-size:12px;color:var(--faint);}
.dept-line{flex:1 1 auto;height:1px;background:var(--border);}
.dept-group.collapsed .emp-grid,.dept-group.collapsed .protable-wrap{display:none;}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:var(--gap);}

.emp-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-panel);
  padding:13px 14px;cursor:pointer;transition:.15s;position:relative;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:10px;
}
.emp-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--border-strong);}
.emp-card.st-failed{box-shadow:inset 3px 0 0 var(--failed),var(--shadow-card);}
.emp-card.st-stuck{box-shadow:inset 3px 0 0 var(--waiting),var(--shadow-card);}
.emp-top{display:flex;align-items:center;gap:10px;}
.avatar{width:34px;height:34px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  font-size:13px;font-weight:600;color:#fff;}
.emp-id-wrap{min-width:0;flex:1 1 auto;}
.emp-name{font-size:14px;font-weight:600;color:var(--heading);display:flex;align-items:center;gap:7px;}
.emp-sub{font-size:11.5px;color:var(--faint);margin-top:1px;}
.impl-badge{font-size:10.5px;font-weight:550;padding:1px 6px;border-radius:3px;background:var(--surface-3);
  color:var(--subtle);border:1px solid var(--border);letter-spacing:.02em;}
.err-dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:999px;background:var(--failed);
  color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;font-family:var(--mono);}

/* status light（核心） */
.status-light{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;padding:2px 8px;border-radius:999px;}
.status-light .sdot{width:7px;height:7px;border-radius:50%;}
.sl-busy{background:var(--running-bg);color:var(--primary-strong);}.sl-busy .sdot{background:var(--running);animation:livePulse 1.8s infinite;}
.sl-idle{background:var(--idle-bg);color:#6b7280;}.sl-idle .sdot{background:var(--idle);}
.sl-stuck{background:var(--waiting-bg);color:#9a5b07;}.sl-stuck .sdot{background:var(--waiting);}
.sl-failed{background:var(--failed-bg);color:var(--failed);}.sl-failed .sdot{background:var(--failed);}

.emp-now{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.emp-now .wf{color:var(--heading);font-weight:550;}
.emp-now .step{font-family:var(--mono);font-size:11.5px;color:var(--primary-strong);
  background:var(--primary-weak);padding:0 6px;border-radius:4px;}
.emp-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--faint);
  border-top:1px dashed var(--border);padding-top:9px;}
.emp-meta .num{color:var(--muted);}
.emp-sched{font-size:11.5px;color:var(--primary-strong);display:flex;align-items:center;gap:5px;}

.status-hero.status-critical .sh-dot{background:var(--failed);box-shadow:0 0 0 5px var(--failed-bg);}
.sh-main{flex:1 1 auto;}
.sh-title{font-size:17px;font-weight:600;color:var(--heading);}
.sh-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.sh-sub code{font-family:var(--mono);background:var(--surface-3);padding:1px 5px;border-radius:3px;}
.status-counts{display:flex;gap:10px;flex:0 0 auto;}
.status-count{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:8px 12px;border-radius:6px;}
.sc-n{font-size:22px;font-weight:600;line-height:1;}
.sc-l{font-size:11px;color:var(--muted);margin-top:3px;}
/* hero 整条按总体状态着色 + icon（不只靠色） */
.status-hero.status-healthy{border-color:var(--success-bd);background:var(--success-bg);}
.status-hero.status-degraded{border-color:var(--waiting-bd);background:var(--waiting-bg);}
.status-hero.status-critical{border-color:var(--failed-bd);background:var(--failed-bg);}
.sh-title{display:flex;align-items:center;gap:9px;}
.sh-ico{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:0 0 auto;}
.status-healthy .sh-ico{background:var(--success);}
.status-degraded .sh-ico{background:var(--waiting);}
.status-critical .sh-ico{background:var(--failed);}

/* 工具条 */
.st-toolbar{align-items:center;}
.auto-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.auto-toggle input{accent-color:var(--primary);}

/* 分组（可折叠） */
.st-groups{display:flex;flex-direction:column;gap:14px;}
.st-group{border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;background:var(--surface);}
.st-group-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface-2);padding:11px 14px;text-align:left;}
.st-group-h:hover{background:var(--surface-3);}
.st-group .caret{color:var(--faint);font-size:11px;width:12px;flex:0 0 auto;}
.st-group-name{font-size:13px;font-weight:600;color:var(--heading);}
.st-group-meta{font-size:11.5px;color:var(--faint);margin-left:auto;}
.st-group .protable-wrap{border:0;border-radius:0;border-top:1px solid var(--border);}
.st-empty{padding:18px;text-align:center;font-size:12.5px;color:var(--faint);border-top:1px solid var(--border);}
.st-table td{vertical-align:middle;}
.st-name{color:var(--heading);font-weight:550;}
.st-faint{color:var(--faint);}
.st-row.bad{cursor:pointer;}
.st-row.bad:hover{background:var(--surface-3);}
.st-row.bad:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
.st-err-toggle{font-size:12px;color:var(--primary-strong);}
.st-detail td{padding:0 14px 10px !important;}
.st-detail-box{font-family:var(--mono);font-size:12px;color:var(--failed);background:var(--failed-bg);border:1px solid var(--failed-bd);border-radius:6px;padding:9px 11px;line-height:1.5;}
@media (max-width:768px){
  .status-hero{flex-direction:column;align-items:stretch;}
  .status-counts{justify-content:space-between;}
  .status-count{flex:1 1 0;}
}

/* ---------------- ③ Observatory ---------------- */
.obs-region{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
.obs-adminbar{display:flex;align-items:center;gap:10px;padding:11px 20px;background:var(--failed-bg);border-bottom:1px solid var(--failed-bd);flex-wrap:wrap;}
.obs-adminbar .ab-label{font-size:12.5px;color:var(--failed);font-weight:550;}
.ab-input{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font:13px var(--sans);background:var(--surface);min-width:200px;}
.ab-input:focus{outline:0;border-color:var(--primary);}
.ab-hint{font-size:12px;color:var(--muted);}
.obs-filterbar{border-bottom:1px solid var(--border);background:var(--surface);}
.filter-toggle{display:flex;align-items:center;gap:8px;padding:10px 20px;border:0;background:none;font-size:13px;color:var(--muted);width:100%;}
.filter-toggle:hover{color:var(--heading);}
.filter-badge{background:var(--primary);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;}
.ft-caret{margin-left:auto;color:var(--faint);}
.filter-body{display:none;padding:4px 20px 14px;flex-direction:column;gap:9px;}
.obs-filterbar.open .filter-body{display:flex;}
.filter-row{display:flex;align-items:center;gap:10px;}
.fr-l{font-size:12px;color:var(--faint);width:72px;flex:0 0 auto;}
.obs-split{flex:1 1 auto;min-height:0;display:flex;}
.obs-list{width:320px;flex:0 0 320px;border-right:1px solid var(--border);overflow:auto;background:var(--surface);padding:8px;}
.obs-row{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border:0;background:none;border-radius:7px;text-align:left;margin-bottom:2px;}
.obs-row:hover{background:var(--surface-3);}
.obs-row.on{background:var(--primary-weak);}
.obs-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.obs-row-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.obs-row-name{font-size:13px;color:var(--heading);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.obs-row-id{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;}
.origin-pill{font-size:10.5px;color:var(--subtle);background:var(--surface-3);border:1px solid var(--border);border-radius:4px;padding:1px 6px;flex:0 0 auto;white-space:nowrap;}
.obs-detail{flex:1 1 auto;min-width:0;overflow:auto;padding:20px;}
.obs-detail-head .odh-top{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.run-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.run-chip{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:5px;}
.run-chip.c-scope{background:var(--primary-weak);color:var(--primary-strong);}
.run-chip.c-def{background:#f3eefe;color:#7a4fcf;}
.run-chip.c-run{background:var(--surface-3);color:var(--muted);}
.usage-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0;}
.usage-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:12px 14px;}
.uc-l{font-size:11.5px;color:var(--faint);display:block;margin-bottom:4px;}
.uc-v{font-size:20px;font-weight:600;color:var(--heading);}
.obs-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.obs-tab{border:0;background:none;padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
.obs-tab.on{color:var(--primary-strong);border-bottom-color:var(--primary);font-weight:550;}
.obs-tab:hover{color:var(--heading);}
.timeline{display:flex;flex-direction:column;}
.tl-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;position:relative;}
.tl-time{font-size:11.5px;color:var(--faint);width:64px;flex:0 0 auto;padding-top:2px;}
.tl-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:4px;background:var(--idle);}
.tl-success .tl-dot{background:var(--success);}.tl-running .tl-dot{background:var(--running);}.tl-failed .tl-dot{background:var(--failed);}
.tl-body{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.tl-step{font-size:13px;color:var(--heading);font-weight:550;}
.tl-dur{font-size:11.5px;color:var(--faint);}
.tl-err{font-family:var(--mono);font-size:11.5px;color:var(--failed);background:var(--failed-bg);padding:2px 7px;border-radius:4px;width:100%;}
.logs{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--fg);background:var(--surface-3);border:1px solid var(--border);border-radius:var(--r-panel);padding:14px 16px;white-space:pre-wrap;}
.artifacts{display:flex;flex-direction:column;gap:8px;}
.artifact-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;}
.art-name{font-size:13px;color:var(--heading);flex:1 1 auto;}
.art-size{font-size:11.5px;color:var(--faint);}
.dag{display:flex;flex-direction:column;}
.dag-node{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);}
.dag-dot{width:8px;height:8px;border-radius:50%;}
.dag-name{font-size:13px;color:var(--heading);font-weight:550;flex:1 1 auto;}
.dag-io{font-size:11px;color:var(--faint);}
.dag-link{width:2px;height:14px;background:var(--border);margin-left:18px;}

/* ---------------- ④ CQRS ---------------- */
.cqrs-pipe{width:100%;height:150px;}
.cqrs-legend{display:flex;gap:18px;margin-top:6px;font-size:11.5px;color:var(--muted);}
.cqrs-legend span{display:inline-flex;align-items:center;gap:6px;}
.cqrs-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.lag-gauge{display:inline-block;width:90px;height:6px;border-radius:4px;background:var(--idle-bg);overflow:hidden;vertical-align:middle;margin-right:7px;}
.lag-gauge i{display:block;height:100%;border-radius:4px;}
.protable th.sortable{cursor:pointer;user-select:none;}.protable th.sortable:hover{color:var(--heading);}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 4px 2px;}
.pg-info{font-size:11.5px;color:var(--faint);margin-right:auto;}
.rm-group{margin-bottom:14px;}
.rm-group-h{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.rm-form{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:4px;}
.rm-doc{background:var(--running-bg);color:var(--primary-strong);}
.rm-graph{background:#f3eefe;color:#7a4fcf;}
.rm-mem{background:var(--success-bg);color:var(--success);}
.rm-card{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:7px;}
.rm-name{font-size:13px;color:var(--heading);font-weight:550;margin-bottom:5px;}
.rm-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);}
.rm-meta .num{color:var(--muted);}
.env-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.env-item{display:flex;gap:14px;align-items:center;font-size:12.5px;padding:7px 10px;background:var(--surface-3);border-radius:6px;}
.env-item span:nth-child(2){color:var(--heading);font-weight:550;flex:1 1 auto;}
.state-root{border:1px dashed var(--border);border-radius:6px;overflow:hidden;}
.sr-row{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12.5px;}
.sr-row:last-child{border-bottom:0;}
.sr-f{color:var(--heading);}.sr-t{color:var(--subtle);font-family:var(--mono);}

/* ---------------- ⑤ Studio ---------------- */
.studio-region{flex:1 1 auto;min-height:0;display:flex;}
.studio-chat{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.chat-scroll{flex:1 1 auto;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.chat-msg{display:flex;}
.chat-msg.user{justify-content:flex-end;}
.bubble{max-width:72%;border:1px solid var(--border);border-radius:12px;padding:11px 14px;background:var(--surface);}
.chat-msg.user .bubble{background:var(--primary-weak);border-color:var(--primary-weak);}
.bubble-text{font-size:13.5px;color:var(--fg);line-height:1.55;}
.tool-call{margin-top:8px;font-size:12px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:6px 9px;display:flex;align-items:center;gap:8px;}
.tc-k{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;}
.tool-call code{font-family:var(--mono);font-size:12px;color:var(--primary-strong);}
.inline-run{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;}
.ir-dot{width:8px;height:8px;border-radius:50%;}.ir-name{font-weight:550;color:var(--heading);}
.chat-input{flex:0 0 auto;display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);}
.chat-input textarea{flex:1 1 auto;resize:none;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font:13.5px var(--sans);max-height:120px;}
.chat-input textarea:focus{outline:0;border-color:var(--primary);}
.studio-aside{width:300px;flex:0 0 300px;border-left:1px solid var(--border);padding:18px;overflow:auto;background:var(--surface-2);}
.std-select{width:100%;height:34px;border:1px solid var(--border);border-radius:6px;padding:0 10px;font:13px var(--sans);background:var(--surface);}
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.hist-row:last-child{border-bottom:0;}

/* ---------------- two-pane (Skills) ---------------- */
.two-pane{flex:1 1 auto;min-height:0;display:flex;}
.tp-list{width:320px;flex:0 0 320px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);}
.tp-search{padding:12px;border-bottom:1px solid var(--border);}
.tp-search .search{width:100%;}
#skill-list{flex:1 1 auto;overflow:auto;padding:8px;}
.tp-detail{flex:1 1 auto;min-width:0;overflow:auto;padding:20px;}
.skill-row{width:100%;display:flex;flex-direction:column;gap:4px;padding:10px 11px;border:0;background:none;border-radius:7px;text-align:left;margin-bottom:2px;}
.skill-row:hover{background:var(--surface-3);}
.skill-row.on{background:var(--primary-weak);}
.skill-row-name{font-size:13.5px;color:var(--heading);font-weight:600;}
.skill-row-desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.skill-row-tags{display:flex;gap:6px;}
.skill-detail-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.skill-desc{font-size:13.5px;color:var(--fg);line-height:1.6;margin-bottom:10px;}
.skill-when{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
.skill-when summary{cursor:pointer;color:var(--primary-strong);font-weight:550;}
.skill-when p{margin-top:8px;line-height:1.6;}
.invoke-prompt{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:13px var(--sans);resize:vertical;}
.invoke-prompt:focus{outline:0;border-color:var(--primary);}
.invoke-result{margin-top:12px;font-size:13px;padding:11px 13px;border-radius:8px;}
.invoke-result.ok{background:var(--success-bg);border:1px solid var(--success-bd);color:var(--success);}
.invoke-result.err{background:var(--failed-bg);border:1px solid var(--failed-bd);color:var(--failed);font-family:var(--mono);font-size:12.5px;}

/* cron editor */
.cron-editor{border:1px solid var(--border);border-radius:8px;padding:14px;background:var(--surface-2);}
.cron-fields{display:flex;gap:8px;flex-wrap:wrap;}
.cron-fields .cf{display:flex;flex-direction:column;gap:4px;}
.cron-fields label{font-size:11px;color:var(--faint);}
.cron-fields input{width:56px;height:32px;text-align:center;border:1px solid var(--border);border-radius:6px;font:13px var(--mono);background:var(--surface);}
.cron-fields input:focus{outline:0;border-color:var(--primary);}
.cron-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;}
.cron-meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--muted);}
.cron-meta code{font-family:var(--mono);background:var(--surface-3);padding:2px 7px;border-radius:4px;color:var(--heading);}
.cron-tz{height:28px;border:1px solid var(--border);border-radius:6px;font:12px var(--sans);background:var(--surface);}
.cron-preview{margin-top:12px;border-top:1px dashed var(--border);padding-top:11px;}
.cron-preview-h{font-size:11.5px;color:var(--faint);margin-bottom:7px;}
.cron-preview-list{list-style:none;display:flex;flex-direction:column;gap:5px;}
.cron-preview-list li{font-family:var(--mono);font-size:12.5px;color:var(--heading);}
.cron-preview-list .cron-bad{color:var(--failed);}

/* ====== Skills v2（按真实页补全） ====== */
.skill-count{font-size:11.5px;color:var(--faint);padding:4px 6px 8px;}
.skill-row .lock,.lock{display:inline-flex;align-items:center;color:var(--faint);margin-left:5px;vertical-align:middle;}
.lock.lg{color:var(--waiting);margin-left:2px;}
.skill-row-tags{flex-wrap:wrap;}
.sk-tag{font-size:10.5px;color:var(--subtle);background:var(--surface-3);border:1px solid var(--border);border-radius:4px;padding:1px 6px;}
.skill-row.skel{pointer-events:none;}
.sk-line{height:10px;border-radius:4px;background:linear-gradient(90deg,#eef0f3 25%,#f6f7f9 37%,#eef0f3 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;}
.sk-line.w70{width:70%}.sk-line.w90{width:90%}.sk-line.w40{width:40%}
.skill-detail-head{display:block;margin-bottom:10px;}
.sdh-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px;}
.sk-tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.wz-field textarea,.extra-params textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:13px var(--sans);resize:vertical;background:var(--surface);}
.wz-field textarea:focus,.extra-params textarea:focus{outline:0;border-color:var(--primary);}
.extra-params{margin-top:10px;}
.extra-params summary{cursor:pointer;font-size:12.5px;color:var(--primary-strong);font-weight:550;margin-bottom:8px;}
.invoke-state{display:flex;align-items:center;gap:10px;}
.badge-run{font-size:12px;font-weight:600;color:var(--primary-strong);background:var(--primary-weak);border-radius:5px;padding:3px 10px;}
.badge-ok{font-size:12px;font-weight:600;color:var(--success);background:var(--success-bg);border:1px solid var(--success-bd);border-radius:5px;padding:3px 10px;}
.badge-fail{font-size:12px;font-weight:600;color:var(--failed);background:var(--failed-bg);border:1px solid var(--failed-bd);border-radius:5px;padding:3px 10px;}
.http-status{font-family:var(--mono);font-size:12px;color:var(--failed);}
.err-json{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--fg);white-space:pre-wrap;margin-top:8px;line-height:1.5;}
.invoke-out{margin-top:14px;border-top:1px dashed var(--border);padding-top:12px;}
.panel-subtitle{font-size:13px;font-weight:600;color:var(--heading);margin:18px 0 11px;}
.cron-fields input.bad{border-color:var(--failed);background:var(--failed-bg);}
.cron-err{color:var(--failed);font-size:11.5px;display:none;margin-left:6px;}
.sk-cron .cron-preview-list{list-style:decimal;padding-left:24px;}
.sk-cron .cron-preview-list li{padding-left:4px;}
.cron-preview-list .rel{color:var(--faint);font-family:var(--sans);}
.sched-none{padding:16px;text-align:center;font-size:12.5px;color:var(--faint);border:1px dashed var(--border);border-radius:8px;}
.sched-cards{display:flex;flex-direction:column;gap:10px;}
.sched-card{border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.sched-card.off{opacity:.66;}
.sc-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.sc-name{font-size:13.5px;font-weight:600;color:var(--heading);}
.sc-cron{font-size:11.5px;background:var(--surface-3);border:1px solid var(--border);padding:1px 7px;border-radius:4px;color:var(--muted);}
.sc-state{margin-left:auto;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;}
.sc-state.on{color:var(--success);background:var(--success-bg);}
.sc-state.off{color:var(--faint);background:var(--idle-bg);}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px 14px;margin-bottom:8px;}
.sc-grid span{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--heading);font-variant-numeric:tabular-nums;}
.sc-grid span i{font-style:normal;font-size:11px;color:var(--faint);}
.red-dot{width:7px;height:7px;border-radius:50%;background:var(--failed);display:inline-block;margin-left:5px;vertical-align:middle;}
.sc-lasterr{font-family:var(--mono);font-size:11.5px;color:var(--failed);background:var(--failed-bg);border:1px solid var(--failed-bd);border-radius:6px;padding:7px 10px;margin-bottom:8px;line-height:1.5;}
.sc-actions{display:flex;gap:7px;flex-wrap:wrap;}
.auth-banner{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:#9a5b07;background:var(--waiting-bg);border:1px solid var(--waiting-bd);border-radius:8px;padding:10px 12px;}
.recent-empty .es{text-align:center;color:var(--faint);font-size:12.5px;margin-bottom:12px;}

/* ---------------- ⑦ Schedules ---------------- */
.sched-create .sc-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}

.chan-slack{background:#f4ecfb;color:#7a4fcf;}

.link-btn{border:0;background:none;color:var(--primary-strong);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;}
.link-btn:hover{color:var(--primary);}

/* root 容器 + 全屏向导骨架 */
.chan-root{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.wz2{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
.wz2-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid var(--border);background:var(--surface);}

.wz2-main{flex:1 1 auto;min-width:0;overflow:auto;padding:24px 28px;}
.wz2-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);margin-top:22px;padding-top:16px;max-width:680px;}
.wz-h{font-size:17px;font-weight:600;color:var(--heading);margin-bottom:6px;}
.wz-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}

/* 竖向 stepper */
.vstepper{display:flex;flex-direction:column;gap:2px;}
.vstep{display:flex;align-items:center;gap:11px;padding:10px;border:0;background:none;border-radius:8px;text-align:left;width:100%;}
.vstep:not([disabled]):hover{background:var(--surface-3);}
.vstep[disabled]{opacity:.5;cursor:default;}
.vstep-num{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--border-strong);color:var(--faint);background:var(--surface);}
.vstep.cur .vstep-num{border-color:var(--primary);background:var(--primary);}
.vstep.done .vstep-num{border-color:var(--success);background:var(--success);color:#fff;}
.vstep-body{display:flex;flex-direction:column;line-height:1.3;}
.vstep-k{font-size:13px;color:var(--muted);font-weight:500;}
.vstep.cur .vstep-k{color:var(--heading);font-weight:600;}
.vstep.done .vstep-k{color:var(--fg);}
.vstep-sub{font-size:10.5px;color:var(--faint);font-family:var(--mono);}

/* 渠道卡（Step 0） */
.chan-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;max-width:700px;}
.chan-card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--r-panel);background:var(--surface);text-align:left;width:100%;transition:.14s;}
.chan-card:not(.disabled):hover{border-color:var(--border-strong);box-shadow:var(--shadow-card);transform:translateY(-1px);}
.chan-card.on{border-color:var(--primary);background:var(--primary-weak);}
.chan-card.disabled{opacity:.5;}
.chan-card-ico{width:40px;height:40px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-size:13px;font-weight:700;}
.chan-card-main{flex:1 1 auto;min-width:0;}
.chan-card-name{font-size:14px;font-weight:600;color:var(--heading);display:flex;align-items:center;gap:7px;}
.chan-card-desc{font-size:12px;color:var(--muted);margin-top:2px;}
.chan-card-cta{font-size:12.5px;color:var(--primary-strong);font-weight:550;flex:0 0 auto;}
.chan-ok{font-size:10px;font-weight:600;color:var(--success);background:var(--success-bg);border:1px solid var(--success-bd);border-radius:4px;padding:1px 6px;}

/* 凭据表单（Step 1） */
.wz-form{display:flex;flex-direction:column;gap:13px;max-width:460px;}
.wz-field{display:flex;flex-direction:column;gap:5px;}
.wz-field>label{font-size:12.5px;color:var(--muted);}
.wz-field input{height:34px;border:1px solid var(--border);border-radius:7px;padding:0 11px;font:13px var(--sans);background:var(--surface);}
.wz-field input.mono-in{font-family:var(--mono);}
.wz-field input:focus{outline:0;border-color:var(--primary);}
.wz-field.has-err input{border-color:var(--failed);background:var(--failed-bg);}
.req{color:var(--failed);}
.opt{color:var(--faint);font-size:11px;}
.field-help{font-size:11.5px;color:var(--faint);}
.field-err{font-size:11.5px;color:var(--failed);}
.dev-link{display:inline-block;margin-top:13px;font-size:12.5px;color:var(--primary-strong);text-decoration:none;}
.dev-link:hover{text-decoration:underline;}

/* 注册（Step 2） */
.reg-intro{font-size:13px;color:var(--muted);margin-bottom:14px;}
.reg-plan{margin:8px 0 0 18px;font-size:12.5px;color:var(--fg);line-height:1.95;}
.reg-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;}
.reg-demo{font-size:11.5px;color:var(--faint);}
.reg-steps{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;max-width:520px;}
.rs-row{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--muted);padding:9px 13px;border:1px solid var(--border);border-radius:7px;}

/* 平台配置（Step 3） */
.cfg-card{border:1px solid var(--border);border-radius:var(--r-panel);padding:14px 16px;margin-bottom:14px;max-width:640px;}
.cfg-card.auto{border-color:var(--success-bd);background:var(--success-bg);}
.cfg-title{font-size:13px;font-weight:600;color:var(--heading);margin-bottom:11px;}
.cfg-p{font-size:12.5px;color:var(--muted);line-height:1.6;}
.cfg-p code,.warn-box code{font-family:var(--mono);background:var(--surface);padding:1px 5px;border-radius:4px;color:var(--heading);border:1px solid var(--border);}

.copy-field{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.cf-l{font-size:12px;color:var(--faint);width:140px;flex:0 0 auto;}
.cf-v{font-family:var(--mono);font-size:12px;background:var(--surface-3);border:1px solid var(--border);padding:6px 9px;border-radius:6px;color:var(--heading);flex:1 1 auto;overflow:auto;white-space:nowrap;}
.perm-badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.pb{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;}
.pb-t1{background:var(--running-bg);color:var(--primary-strong);}
.pb-t2{background:#f1ebfd;color:#7a4fcf;}
.perm-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.perm-list code{font-family:var(--mono);font-size:11px;background:var(--surface-3);border:1px solid var(--border);padding:2px 7px;border-radius:4px;color:var(--heading);}

/* 回复模型（Step 4） */
.std-select{width:100%;height:34px;border:1px solid var(--border);border-radius:6px;padding:0 10px;font:13px var(--sans);background:var(--surface);}

/* 验证（Step 5） */
.verify-tip{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
.vlamps{display:flex;flex-direction:column;gap:12px;max-width:520px;}
.vlamp{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-panel);}
.vlamp.ok{border-color:var(--success-bd);background:var(--success-bg);}
.lamp-dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;}
.lamp-dot.ok{background:var(--success);box-shadow:0 0 0 4px var(--success-bg);}
.vlamp-body{flex:1 1 auto;}
.vlamp-l{font-size:13px;color:var(--heading);font-weight:550;}
.vlamp-s{font-size:11.5px;color:var(--faint);margin-top:2px;}
.poll-tag{font-size:11px;color:var(--faint);font-family:var(--mono);}
.verify-done{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:24px;}
.vd-emoji{font-size:42px;line-height:1;}
.vd-title{font-size:15px;font-weight:600;color:var(--success);}

/* 解绑确认弹窗 */
.modal-back{position:fixed;inset:0;background:rgba(17,24,39,.34);z-index:78;}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-hover);z-index:79;padding:20px 22px;}
.modal-title{font-size:15px;font-weight:600;color:var(--heading);margin-bottom:10px;}
.modal-body{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;}

@media (max-width:768px){
  .wz2-body{flex-direction:column;}
  .wz2-rail{width:auto;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--border);padding:10px;}

}

/* ---------------- ⑨ Voice ---------------- */
.voice-region{max-width:840px;}
.voice-scope{display:flex;align-items:center;gap:11px;padding:13px 16px;border:1px solid var(--border);border-radius:var(--r-panel);background:var(--surface);margin-bottom:16px;}

.vc-role{font-size:11px;color:var(--faint);}
.vc-status{font-size:12px;display:inline-flex;align-items:center;gap:5px;margin-top:3px;}
.vc-status i{width:7px;height:7px;border-radius:50%;}
.vc-lat{font-size:11px;color:var(--faint);}

/* ---------------- ⑩ 审计日志 Audit Trail ---------------- */
.faint{color:var(--faint);}
.mono{font-family:var(--mono);}
.audit-filters{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px;}

.audit-field label{font-size:11px;color:var(--faint);font-weight:550;}
.audit-field input{height:34px;border:1px solid var(--border);border-radius:6px;padding:0 10px;font:13px var(--sans);background:var(--surface);min-width:150px;}

var BACKEND_CONSOLE_CONFIG = __BACKEND_CONSOLE_CONFIG__;
/* =========================================================================
   AI 公司全景看板 — 拟真 mock 数据 + 共享 helpers
   命名口味：职能角色化 + 业务中性（无真实公司/人名/业务线专名）
   术语：公司 / 部门 / AI 员工 / 一次干活(Run) / 交接 / 排班

   ========================================================================= */

/* ---------------- helpers ---------------- */
function pad2(n){ return (n<10?'0':'')+n; }
function fmtMoney(n){ return '$'+Number(n).toFixed(2); }
function fmtTok(n){
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1)+'k';
  return ''+n;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nowStamp(){ var d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }

var AV_TINT=['#2563eb','#0891b2','#7e22ce','#c2410c','#15803d','#b91c1c','#a16207','#0e7490','#6d28d9','#be123c'];
function avatarOf(name){ var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))&0xffff;
  return {bg:AV_TINT[h%AV_TINT.length],ch:name.slice(0,1)}; }

function sparkSVG(data,color,w,h){
  color=color||'#2563eb'; w=w||88; h=h||26;
  var max=Math.max.apply(null,data), min=Math.min.apply(null,data), rng=(max-min)||1;
  var pts=data.map(function(v,i){
    var x=(i/(data.length-1))*(w-2)+1, y=h-2-((v-min)/rng)*(h-6)+1;
    return x.toFixed(1)+','+y.toFixed(1);

  var lx=(w-2)+1, ly=h-2-((data[data.length-1]-min)/rng)*(h-6)+1;
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2" fill="'+color+'"/></svg>';
}

var STATUS_CN={busy:'忙',idle:'闲',stuck:'卡',failed:'失败'};

function mapNyxUser(u){

function obsTimeline_span(steps,sum){
  var ts=steps.map(function(s){return s.requestedAtUtc;}).filter(Boolean).map(function(x){return new Date(x).getTime();});
  var te=steps.map(function(s){return s.completedAtUtc;}).filter(Boolean).map(function(x){return new Date(x).getTime();});
  if(sum.startedAtUtc) ts.push(new Date(sum.startedAtUtc).getTime());
  if(sum.updatedAtUtc) te.push(new Date(sum.updatedAtUtc).getTime());
  ts=ts.filter(function(x){return !isNaN(x);}); te=te.filter(function(x){return !isNaN(x);});
  if(!ts.length||!te.length) return '—'; return obsDurMs(Math.max(0,Math.max.apply(null,te)-Math.min.apply(null,ts)));
}
function obsNodeIo(n,graph){
  var inc=0,out=0; (graph.edges||[]).forEach(function(e){ if(e.toNodeId===n.nodeId) inc++; if(e.fromNodeId===n.nodeId) out++; });
  return 'in '+inc+' / out '+out;
}

var CQRS_DATA={ metrics:{ customQuery:null, liveLag:null, projections:null }, scopes:[], readmodels:[], envelopes:[], stateRoot:[] };
var CQRS_LOADED=false, CQRS_ERR=null, CQRS_FORBIDDEN=false;
function cqrsSkeleton(){ return '<div class="sk-bar" style="height:48px;border-radius:8px"></div>'+'<div class="sk-card" style="height:150px;margin-top:14px"></div>'+'<div class="sk-card" style="height:120px;margin-top:14px"></div>'; }
/* scopes: {id,active,observed,successful,failures} -> {id, lag=observed-successful, count=observed, failing} */
function mapCqrsScopes(j){
  return (j&&j.scopes||[]).map(function(s){
    var observed=(s.observed!=null?s.observed:0), successful=(s.successful!=null?s.successful:0);
    var lag=observed-successful; if(lag<0) lag=0;
    return { id:s.id, lag:lag, count:observed, failing:!!(s.failures>0) };
  });
}
/* readmodels: grouped {shape,engine,items:[{name,actor,version,updated,count}]}
   -> flat [{name,sink,engine,actor,version,updated,count}] (null -> '—') */
function _cqrsSink(shape){ return {doc:'Doc',graph:'Graph',mem:'Mem'}[String(shape||'').toLowerCase()]||'Doc'; }
function _cqrsDash(v){ return v==null?'—':v; }
function mapCqrsReadmodels(j){
  var out=[];
  (j&&j.groups||[]).forEach(function(g){
    var sink=_cqrsSink(g.shape), engine=_cqrsDash(g.engine);
    (g.items||[]).forEach(function(it){
      out.push({ name:it.name, sink:sink, engine:engine, actor:_cqrsDash(it.actor),
        version:_cqrsDash(it.version), updated:_cqrsDash(it.updated), count:_cqrsDash(it.count) });
    });
  });
  return out;
}
/* metrics derived honestly from the real scopes; customQuery has no backend source -> '—' (approx). */
function mapCqrsMetrics(scopes){
  var maxLag=0; scopes.forEach(function(s){ if(s.lag>maxLag) maxLag=s.lag; });
  return { customQuery:'—', liveLag:(scopes.length?maxLag+'ms':'—'), projections:String(scopes.length) };
}
/* Both endpoints are platform-admin; adminJson returns {forbidden:true} on 403. */
async function loadCqrs(rerender){

    var scopes=mapCqrsScopes(scopesRes);
    CQRS_DATA={ metrics:mapCqrsMetrics(scopes), scopes:scopes, readmodels:mapCqrsReadmodels(rmRes), envelopes:[], stateRoot:[] };

/* ⑦ 排班调度 Schedules —— GET /api/schedules（bearer，filter !deleted）；动作走 202 receipt。
   渲染 = 真实只读 /schedules 页的完整字段（状态点 / timezone / enabled / kind / target / 触发计数 /
   lastError / 到观测台深链 / 3s 轮询）∪ 我的真实动作（enable/disable/run-now/delete + cron 预览）。 */
var SCHEDULES_DATA=[];
var SCHED_LOADED=false, SCHED_ERR=null, SCHED_BUSY=null, SCHED_PREVIEW=null;
var SCHED_FILTER='all';        /* all | enabled | disabled | failing —— 真实页无过滤，此为增强项 */
var SCHED_TIMER=null;          /* 3s 轮询句柄（对齐真实页 startSchedulePolling 的 3000ms） */

/* scheduleKind 0=Generic 1=Workflow 2=SkillRunner（数值，后端无 string 枚举转换器） */
var SCHED_KIND_LABEL={0:'Generic',1:'Workflow',2:'SkillRunner'};
function _schKind(k){ return SCHED_KIND_LABEL[k]!=null?SCHED_KIND_LABEL[k]:('kind '+k); }
/* targetKind 0=Envelope 1=ServiceInvocation */
var SCHED_TARGET_LABEL={0:'Envelope',1:'ServiceInvocation'};
function _schTarget(k){ return SCHED_TARGET_LABEL[k]!=null?SCHED_TARGET_LABEL[k]:('kind '+k); }
/* 相对时间（未来向）：下次触发用 */
function _schNext(iso){ if(!iso) return '—'; var t=new Date(iso); if(isNaN(t.getTime())) return '—';
  var s=(t.getTime()-Date.now())/1000;
  if(s<=0) return '即将'; if(s<60) return Math.round(s)+'s 后'; if(s<3600) return Math.round(s/60)+'m 后';
  if(s<86400) return Math.round(s/3600)+'h 后'; return Math.round(s/86400)+'d 后'; }
/* 相对时间（过去向）：上次触发的相对表述（对齐真实页 relPast） */
function _schRel(iso){ if(!iso) return '尚未运行'; var t=new Date(iso); if(isNaN(t.getTime())) return '—';
  var d=Math.max(0,Math.round((Date.now()-t.getTime())/1000));
  if(d<=1) return '刚刚'; if(d<60) return d+'s 前'; if(d<3600) return Math.round(d/60)+'m 前';
  if(d<86400) return Math.round(d/3600)+'h 前'; return Math.round(d/86400)+'d 前'; }
/* 绝对短格式：上次触发用 */
function _schLast(iso){ if(!iso) return '尚未运行'; var t=new Date(iso); if(isNaN(t.getTime())) return '—';
  return (t.getMonth()+1)+'-'+('0'+t.getDate()).slice(-2)+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2); }
/* 到观测台查看本排班触发的运行（in-app hash 路由，对齐 Skills 的 skSchedObs：?schedule=<id>） */
function _schObs(id){ return id; }
function mapSchedRow(it){
  var failed=!!(it.lastError);
  var lastTxt=_schLast(it.lastFireAt)+(it.lastFireAt?(' · '+(failed?'失败':'完成')):'');
  return {
    id:it.scheduleId,
    skill:it.displayName||it.scheduleId,        /* skill 名不在 payload 内 -> 用 displayName */

/* 3s 轮询：对齐真实只读页的 startSchedulePolling（3000ms）。每次挂载先清旧句柄再起新句柄
   （沿用 Status 模块的 STATUS_TIMER 生命周期：重挂载即换表，避免离开后陈旧 timer 泄漏或重复）。 */
function schedStartPoll(rerender){
  if(SCHED_TIMER){ clearInterval(SCHED_TIMER); SCHED_TIMER=null; }
  SCHED_TIMER=setInterval(function(){ loadSchedules(rerender); }, 3000);
}
function schedStopPoll(){ if(SCHED_TIMER){ clearInterval(SCHED_TIMER); SCHED_TIMER=null; } }
function schedSetFilter(f, rerender){ SCHED_FILTER=f; if(rerender) rerender(); }
function _schPass(x){
  if(SCHED_FILTER==='enabled') return x.enabled;
  if(SCHED_FILTER==='disabled') return !x.enabled;
  if(SCHED_FILTER==='failing') return (x.fails||0)>0||!!x.lastError;
  return true;
}
/* 动作：enable/disable/run-now 走 POST :verb，delete 走 DELETE，均返回 202 receipt（2xx=已受理）。 */
async function schedAction(id, op, rerender){
  SCHED_BUSY=id+':'+op; if(rerender) rerender();
  try{
    var res;
    if(op==='delete') res=await adminApi('/api/schedules/'+encodeURIComponent(id),{method:'DELETE'});
    else res=await adminApi('/api/schedules/'+encodeURIComponent(id)+':'+op,{method:'POST'});
    if(res&&res.forbidden){ toast('无权执行该操作（403）'); }
    else if(res&&res.ok){ toast('已受理：'+({enable:'启用',disable:'停用','run-now':'立即运行','delete':'删除'}[op]||op)); }
    else { var b=''; try{ b=await res.text(); }catch(_){} toast('操作失败 · HTTP '+(res?res.status:'?')+(b?' · '+b.slice(0,120):'')); }
  }catch(e){ if(!e||!e.unauthorized) toast('操作失败 · '+((e&&(e.body||e.message))||'网络错误')); }
  SCHED_BUSY=null;
  await loadSchedules(rerender);          /* 重新拉取列表，反映最新事实 */

   genuine "（平台默认）" choice only. */
async function loadWzLlm(){
  WZ.model.llmLoading=true; chanRerender();
  try{ var v=await adminJson('/api/user-config/llm');
    WZ.model.llm=(v&&!v.forbidden)?v:null; }
  catch(e){ if(!(e&&e.unauthorized)) WZ.model.llm=null; }
  WZ.model.llmLoading=false; chanRerender();
}
async function loadChannels(){
  CHAN_LOADING=true; CHAN_ERR=null; CHAN_FORBIDDEN=false; chanRerender();
  var q=(CHAN_ACCT==='all') ? '?scope=all' : '';
  try{
    var arr=await adminJson('/api/channels/registrations'+q);
    if(arr&&arr.forbidden){
      /* not a platform admin: drop back to own-account view honestly */
      if(CHAN_ACCT==='all'){ CHAN_ACCT='mine'; CHAN_LOADING=false; return loadChannels(); }
      CHAN_FORBIDDEN=true; CHANNELS_DATA.length=0; CHAN_LOADED=true; CHAN_LOADING=false; chanRerender(); return;
    }
    var rows=(arr||[]).map(mapChannel);
    CHANNELS_DATA.length=0; Array.prototype.push.apply(CHANNELS_DATA, rows);

  }catch(e){

}
/* Build the snake_case POST body from the captured wizard credentials.
   webhook_base_url is the relay-facing origin (same convention as the proven
   console page). Lark vs Telegram carry different secret fields. */
function chanRegBody(){
  var d=WZ.data||{}, p=WZ.provider, label=(d.label||'').trim();
  if(p==='telegram') return { platform:'telegram', webhook_base_url:location.origin,
    bot_token:(d.bot_token||'').trim(), label:label };
  return { platform:'lark', webhook_base_url:location.origin, app_id:(d.app_id||'').trim(),
    app_secret:(d.app_secret||''), verification_token:(d.verification_token||'').trim(), label:label };
}
/* REAL registration. No setTimeout, no simulated 409/cred branches.
   Renders WZ.reg from the actual response so chanStep2's existing success
   (regResult) and failure (r.fail) render paths display real data. */
async function doRegister(){
  WZ.reg={ state:'running', ticks:[true,true,true,true], botId:null, webhookUrl:null,
    apiKeyId:null, routeId:null, relayCallbackUrl:null, fail:null }; chanRerender();
  var res;
  try{ res=await adminApi('/api/channels/registrations', { method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(chanRegBody()) }); }
  catch(e){ if(e&&e.unauthorized){ return; }
    WZ.reg.state='done'; WZ.reg.fail={code:'net',at:0,msg:(e&&(e.body||e.message))||'网络错误'}; chanRerender(); return; }
  if(res&&res.forbidden){
    WZ.reg.state='done'; WZ.reg.fail={code:'auth',at:0,msg:'当前账号无权在该 scope 注册通道（403）'}; chanRerender(); return; }
  var data=null, txt='';
  try{ txt=await res.text(); }catch(e){}
  if(txt){ try{ data=JSON.parse(txt); }catch(e){ data={raw:txt}; } }
  data=data||{};
  if(res.ok){
    WZ.reg.botId=data.nyx_channel_bot_id||''; WZ.reg.apiKeyId=data.nyx_agent_api_key_id||'';
    WZ.reg.routeId=data.nyx_conversation_route_id||''; WZ.reg.webhookUrl=data.webhook_url||'';
    WZ.reg.relayCallbackUrl=data.relay_callback_url||''; WZ.reg.registrationId=data.registration_id||'';
    WZ.reg.state='done'; WZ.reg.fail=null; chanRerender(); return;
  }
  /* real failure: surface error/note from the body; classify for the right render branch */
  var errText=((data.error||'')+' '+(data.note||'')).toLowerCase();
  var msg=data.error||data.note||('HTTP '+res.status);
  var code='other';
  if(res.status===409||errText.indexOf('unsupported_platform')>=0||errText.indexOf('already')>=0||errText.indexOf('409')>=0) code='409';
  else if(res.status===401) code='cred';
  else if(errText.indexOf('secret')>=0||errText.indexOf('invalid')>=0||errText.indexOf('nyx_status=401')>=0||errText.indexOf('nyx_status=400')>=0) code='cred';
  else if(res.status===400) code='cred';
  else if(errText.indexOf('nyx_base_url')>=0) code='infra';
  WZ.reg.state='done'; WZ.reg.fail={code:code,at:0,msg:msg}; chanRerender();
}

  <script>
/* =========================================================================
   数据流画布 — @xyflow/react 等效仿真（vanilla + SVG）
   节点 = 岗位/角色(target_role)；边 = 交接(schedule→run / parent→child / step→step)
   边粗细=交接次数；边色=失败率；活跃边 dash 流动；活跃节点 pulse；告警节点红 glow
   ========================================================================= */
var NODE_W=152, NODE_H=58, WORLD_W=1180, WORLD_H=560;

function edgeColor(fr){
  if(fr>=0.25) return '#dc2626';   // 失败率高 → 红
  if(fr>=0.12) return '#d97706';   // 中 → 琥珀
  if(fr>=0.05) return '#94a3b8';   // 低 → 中性灰
  return '#15a34a';                // 极低 → 绿
}
function edgeWidth(count){ return Math.max(1.6, Math.min(6, 1.2+count*0.18)); }
function nodeCenter(n){ return {x:n.x+NODE_W/2, y:n.y+NODE_H/2}; }

function bezier(a,b){
  var dx=Math.max(40,(b.x-a.x)*0.5);
  return 'M'+a.x+','+a.y+' C'+(a.x+dx)+','+a.y+' '+(b.x-dx)+','+b.y+' '+b.x+','+b.y;
}

/* 渲染数据流到 container；onSelect(type, payload) 打开 inspector */
function renderFlow(container, graph, onSelect, opts){
  opts=opts||{};
  container.innerHTML='';
  if(!graph.nodes.length){
    container.innerHTML=emptyBlock('graph');
    return;
  }
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+WORLD_W+' '+WORLD_H);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  var world=document.createElementNS(ns,'g'); world.setAttribute('class','flow-world');
  svg.appendChild(world);

  var nodeById={}; graph.nodes.forEach(function(n){nodeById[n.id]=n;});

  /* --- edges --- */
  graph.edges.forEach(function(e){
    var a=nodeCenter(nodeById[e.from]), b=nodeCenter(nodeById[e.to]);
    var ax={x:nodeById[e.from].x+NODE_W,y:a.y}, bx={x:nodeById[e.to].x,y:b.y};
    var d=bezier(ax,bx), col=edgeColor(e.fr), w=edgeWidth(e.count);
    var base=document.createElementNS(ns,'path');
    base.setAttribute('d',d); base.setAttribute('class','flow-edge');
    base.setAttribute('stroke',col); base.setAttribute('stroke-width',w);
    base.setAttribute('opacity', e.active?'0.9':'0.5');
    world.appendChild(base);
    if(e.active){
      var flow=document.createElementNS(ns,'path');
      flow.setAttribute('d',d); flow.setAttribute('class','flow-edge-flow');
      flow.setAttribute('stroke','#fff'); flow.setAttribute('stroke-width',Math.max(1,w-1));
      flow.setAttribute('opacity','0.85'); world.appendChild(flow);
    }
    /* hit area + label */
    var hit=document.createElementNS(ns,'path');
    hit.setAttribute('d',d); hit.setAttribute('class','flow-edge-hit');
    hit.addEventListener('click',function(ev){ev.stopPropagation();onSelect('edge',e);});
    world.appendChild(hit);
    var mid={x:(ax.x+bx.x)/2,y:(a.y+b.y)/2-6};
    var lblbg=document.createElementNS(ns,'rect');
    lblbg.setAttribute('x',mid.x-13);lblbg.setAttribute('y',mid.y-9);
    lblbg.setAttribute('width',26);lblbg.setAttribute('height',14);lblbg.setAttribute('rx',3);
    lblbg.setAttribute('class','edge-label-bg'); world.appendChild(lblbg);
    var lbl=document.createElementNS(ns,'text');
    lbl.setAttribute('x',mid.x);lbl.setAttribute('y',mid.y+1);
    lbl.setAttribute('text-anchor','middle');lbl.setAttribute('class','edge-label');
    lbl.textContent='×'+e.count; world.appendChild(lbl);
  });

  /* --- nodes --- */
  graph.nodes.forEach(function(n){
    var g=document.createElementNS(ns,'g');
    g.setAttribute('class','flow-node'+(n.state==='alert'?' alert':''));
    g.setAttribute('transform','translate('+n.x+','+n.y+')');
    g.setAttribute('tabindex','0'); g.setAttribute('role','button');
    g.setAttribute('aria-label','岗位 '+n.label);
    var c=nodeCenter({x:0,y:0});
    if(n.state==='active'){
      var pr=document.createElementNS(ns,'circle');
      pr.setAttribute('cx',NODE_W/2);pr.setAttribute('cy',NODE_H/2);
      pr.setAttribute('r',8);pr.setAttribute('class','pulse-ring');g.appendChild(pr);
    }
    var box=document.createElementNS(ns,'rect');
    box.setAttribute('width',NODE_W);box.setAttribute('height',NODE_H);
    box.setAttribute('rx',8);box.setAttribute('class','nbox');g.appendChild(box);
    /* status dot */
    var stc={active:'#2563eb',alert:'#dc2626',idle:'#9ca3af'}[n.state]||'#9ca3af';
    var dot=document.createElementNS(ns,'circle');
    dot.setAttribute('cx',16);dot.setAttribute('cy',18);dot.setAttribute('r',4);
    dot.setAttribute('fill',stc);g.appendChild(dot);
    var lab=document.createElementNS(ns,'text');
    lab.setAttribute('x',28);lab.setAttribute('y',22);lab.setAttribute('class','nlabel');
    lab.textContent=n.label;g.appendChild(lab);
    var role=document.createElementNS(ns,'text');
    role.setAttribute('x',16);role.setAttribute('y',42);role.setAttribute('class','nrole');
    role.textContent=(n.role==='schedule'?'排班触发':'target_role');g.appendChild(role);
    var impl=document.createElementNS(ns,'text');
    impl.setAttribute('x',NODE_W-12);impl.setAttribute('y',42);impl.setAttribute('text-anchor','end');
    impl.setAttribute('class','nimpl');
    impl.setAttribute('fill',{workflow:'#2563eb',script:'#7e22ce',gagent:'#c2410c',schedule:'#6b7280'}[n.impl]||'#6b7280');
    impl.textContent=n.impl;g.appendChild(impl);

    g.addEventListener('click',function(ev){ev.stopPropagation();select(n.id);onSelect('node',n);});
    g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n.id);onSelect('node',n);}});
    g._nid=n.id;
    world.appendChild(g);
  });

  container.appendChild(svg);

  function select(id){
    Array.prototype.forEach.call(world.querySelectorAll('.flow-node'),function(g){
      g.classList.toggle('sel',g._nid===id);
    });
  }

  /* --- pan & zoom --- */
  var scale=1, tx=0, ty=0, dragging=false, sx=0, sy=0, started=false;
  function apply(){
    world.setAttribute('transform','translate('+tx+','+ty+') scale('+scale+')');
    updateMinimap();
  }
  function clampZoom(s){ return Math.max(0.5,Math.min(1.8,s)); }
  container.addEventListener('mousedown',function(e){
    if(e.target.closest('.flow-node')||e.target.closest('.flow-edge-hit'))return;
    dragging=true;started=false;sx=e.clientX-tx;sy=e.clientY-ty;container.classList.add('grabbing');
  });
  window.addEventListener('mousemove',function(e){
    if(!dragging)return; tx=e.clientX-sx; ty=e.clientY-sy; started=true; apply();
  });
  window.addEventListener('mouseup',function(){dragging=false;container.classList.remove('grabbing');});
  container.addEventListener('wheel',function(e){
    e.preventDefault();
    var prev=scale; scale=clampZoom(scale*(e.deltaY<0?1.1:0.9));
    /* zoom toward cursor */
    var rect=container.getBoundingClientRect();
    var cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    tx=cx-(cx-tx)*(scale/prev); ty=cy-(cy-ty)*(scale/prev);
    apply();
  },{passive:false});

  /* controls */
  var ctr=document.createElement('div'); ctr.className='flow-controls';
  ctr.innerHTML='<button data-z="in" title="放大" aria-label="放大">+</button>'+
                '<button data-z="out" title="缩小" aria-label="缩小">−</button>'+
                '<button data-z="fit" title="适应" aria-label="适应屏幕" style="font-size:13px">⤢</button>';
  ctr.addEventListener('click',function(e){
    var z=e.target.getAttribute('data-z'); if(!z)return;
    if(z==='in')scale=clampZoom(scale*1.2);
    else if(z==='out')scale=clampZoom(scale/1.2);
    else {scale=1;tx=0;ty=0;}
    apply();
  });
  container.appendChild(ctr);

  /* legend */
  var lg=document.createElement('div'); lg.className='flow-legend';
  lg.innerHTML=
    '<div class="row"><span class="ln" style="background:#15a34a"></span>失败率 低</div>'+
    '<div class="row"><span class="ln" style="background:#d97706"></span>失败率 中</div>'+
    '<div class="row"><span class="ln" style="background:#dc2626"></span>失败率 高</div>'+
    '<div class="row"><span class="ln" style="background:#2563eb;height:6px"></span>线宽 = 交接次数</div>';
  container.appendChild(lg);

  /* minimap */
  var mm=document.createElement('div'); mm.className='flow-minimap';
  var mmsvg=document.createElementNS(ns,'svg');
  mmsvg.setAttribute('viewBox','0 0 '+WORLD_W+' '+WORLD_H);
  graph.nodes.forEach(function(n){
    var r=document.createElementNS(ns,'rect');
    r.setAttribute('x',n.x);r.setAttribute('y',n.y);r.setAttribute('width',NODE_W);r.setAttribute('height',NODE_H);
    r.setAttribute('rx',8);
    r.setAttribute('class','mm-node'+(n.state==='active'?' active':(n.state==='alert'?' alert':'')));
    mmsvg.appendChild(r);
  });
  var mmview=document.createElementNS(ns,'rect'); mmview.setAttribute('class','mm-view');
  mmsvg.appendChild(mmview); mm.appendChild(mmsvg); container.appendChild(mm);

  function updateMinimap(){
    /* viewport rect in world coords */
    var vw=WORLD_W/scale, vh=WORLD_H/scale;
    var vx=-tx/scale, vy=-ty/scale;
    mmview.setAttribute('x',vx);mmview.setAttribute('y',vy);
    mmview.setAttribute('width',vw);mmview.setAttribute('height',vh);
  }

  apply();
  return {select:select};
}

/* mini 数据流（任务视角 5B 用，静态缩略） */
function renderMiniFlow(container, runs){
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 720 180');svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.style.width='100%';svg.style.height='100%';
  var n=runs.length, gap=720/(n), y=90;
  runs.forEach(function(r,i){
    var x=gap*i+gap/2;
    if(i<n-1){
      var nx=gap*(i+1)+gap/2;
      var p=document.createElementNS(ns,'path');
      p.setAttribute('d','M'+(x+22)+','+y+' L'+(nx-22)+','+y);
      p.setAttribute('stroke', r.status==='success'?'#15a34a':(r.stuck?'#dc2626':'#cbd5e1'));
      p.setAttribute('stroke-width','2');p.setAttribute('fill','none');
      if(r.stuck)p.setAttribute('stroke-dasharray','4 4');
      svg.appendChild(p);
    }
    var col={success:'#15a34a',running:'#2563eb',stuck:'#dc2626',waiting:'#9ca3af'}[r.status]||'#9ca3af';
    var c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r.stuck?14:11);
    c.setAttribute('fill','#fff');c.setAttribute('stroke',col);c.setAttribute('stroke-width',r.stuck?3:2);
    svg.appendChild(c);
    var t=document.createElementNS(ns,'text');
    t.setAttribute('x',x);t.setAttribute('y',y+34);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','10');t.setAttribute('fill','#4b5563');
    t.textContent=r.wf;svg.appendChild(t);
  });
  container.innerHTML=''; container.appendChild(svg);
}
