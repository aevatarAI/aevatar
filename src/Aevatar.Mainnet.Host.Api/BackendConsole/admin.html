/* ---------------- cron 控件（Skills / Schedules 共用） ---------------- */
function cronFieldMatcher(expr,min,max){
  if(expr==='*') return function(){return true;};
  var allowed={};
  expr.split(',').forEach(function(part){
    var step=1,range=part;
    if(part.indexOf('/')>=0){var sp=part.split('/');range=sp[0];step=parseInt(sp[1],10)||1;}
    var lo,hi;
    if(range==='*'){lo=min;hi=max;}
    else if(range.indexOf('-')>=0){var r=range.split('-');lo=parseInt(r[0],10);hi=parseInt(r[1],10);}
    else {lo=hi=parseInt(range,10);}
    if(isNaN(lo)||isNaN(hi))return;
    for(var v=lo;v<=hi;v+=step) allowed[v]=true;
  });
  return function(n){return !!allowed[n];};
}
function cronPreview(expr,count){
  count=count||5;
  var f=expr.trim().split(/\s+/); if(f.length!==5) return null;
  try{
    var mMin=cronFieldMatcher(f[0],0,59),mHour=cronFieldMatcher(f[1],0,23),
        mDom=cronFieldMatcher(f[2],1,31),mMon=cronFieldMatcher(f[3],1,12),mDow=cronFieldMatcher(f[4],0,6);
  }catch(_){return null;}
  var out=[],d=new Date(); d.setSeconds(0,0); d.setMinutes(d.getMinutes()+1);
  var guard=0;
  while(out.length<count && guard<527041){ guard++;
    if(mMin(d.getMinutes())&&mHour(d.getHours())&&mDom(d.getDate())&&mMon(d.getMonth()+1)&&mDow(d.getDay())) out.push(new Date(d.getTime()));
    d.setMinutes(d.getMinutes()+1);
  }
  return out;
}
function fmtDateTime(d){
  var wk=['日','一','二','三','四','五','六'][d.getDay()];
  return pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+' 周'+wk;
}

function bindSchedEditor(root){
  var ed=root.querySelector('.sk-cron'); if(!ed) return;
  function recompute(){
    var inputs=ed.querySelectorAll('[data-sc]'), allValid=true, segs=[];
    Array.prototype.forEach.call(inputs,function(i){ var v=i.value.trim()||'*'; segs.push(v); var ok=cronSegValid(v); i.classList.toggle('bad',!ok); if(!ok)allValid=false; });
    var expr=segs.join(' '); SKILL_STATE.sched.cron=expr;
    var show=ed.querySelector('.cron-expr-show'); if(show) show.textContent=expr;
    var errEl=ed.querySelector('.cron-err'), prev=ed.querySelector('.cron-preview'), list=ed.querySelector('.cron-preview-list'),
        createBtn=root.querySelector('#sk-sched-create');
    if(!allValid||!skillSelectedTeamId()){ if(errEl)errEl.style.display=allValid?'none':'inline'; if(prev)prev.style.display=allValid?'':'none'; if(createBtn)createBtn.setAttribute('disabled','disabled'); return; }
    if(errEl)errEl.style.display='none'; if(prev)prev.style.display=''; if(createBtn)createBtn.removeAttribute('disabled');
    var times=cronPreview(expr,5);
    if(list) list.innerHTML=(times&&times.length)?times.map(function(d){return '<li>'+fmtDateTime(d)+' · <span class="rel">'+relTime(d)+'</span></li>';}).join(''):'<li class="cron-bad">未来一年内无触发</li>';
  }
  Array.prototype.forEach.call(ed.querySelectorAll('[data-sc]'),function(i){ i.addEventListener('input',recompute); });
  var tz=root.querySelector('#sk-tz'); if(tz) tz.addEventListener('change',function(){ SKILL_STATE.sched.tz=tz.value; var h=ed.querySelector('.cron-preview-h b'); if(h)h.textContent=tz.value; });
  var team=root.querySelector('#sk-team-owner'); if(team) team.addEventListener('change',function(){ SKILL_STATE.sched.teamId=team.value; recompute(); });
  recompute();
}
function bindSkills(root){
  function reList(){ var l=root.querySelector('#skill-list'); if(l) replaceViewHtml(l,skillList()); }
  function reDetail(){ var d=root.querySelector('#skill-detail'); if(d){ replaceViewHtml(d,skillDetail()); bindSchedEditor(root); }
    var p=root.querySelector('#skills-pane'); if(p) p.classList.toggle('show-detail', !!SKILL_STATE.mobileDetail); }
  function capture(){
    var pr=root.querySelector('#sk-prompt'); if(pr) SKILL_STATE.invoke.prompt=pr.value;
    Array.prototype.forEach.call(root.querySelectorAll('[data-si]'),function(i){ SKILL_STATE.invoke.inputs[i.getAttribute('data-si')]=i.value; });
    var ex=root.querySelector('#sk-extra'); if(ex) SKILL_STATE.invoke.extra=ex.value;
    var dn=root.querySelector('#sk-dispname'); if(dn) SKILL_STATE.sched.displayName=dn.value;
    var team=root.querySelector('#sk-team-owner'); if(team) SKILL_STATE.sched.teamId=team.value;
    var tz=root.querySelector('#sk-tz'); if(tz) SKILL_STATE.sched.tz=tz.value;
    var en=root.querySelector('#sk-enablenow'); if(en) SKILL_STATE.sched.enableNow=en.checked;
    var sg=root.querySelectorAll('[data-sc]'); if(sg.length===5) SKILL_STATE.sched.cron=Array.prototype.map.call(sg,function(i){return i.value.trim()||'*';}).join(' ');
  }
  function selectSkill(guid){
    var s=SKILLS_DATA.filter(function(x){return x.guid===guid;})[0]||SKILLS_DATA[0]||null;
    SKILL_STATE.selected=guid; SKILL_STATE.mobileDetail=true; SKILL_CONFIRM=null;
    SKILL_STATE.invoke={state:'idle',prompt:'',inputs:{},extra:'',result:null,promptErr:false};
    SKILL_STATE.sched={displayName:(s?s.name:''),cron:'0 9 * * *',tz:'Asia/Shanghai',enableNow:true,result:null,authErr:false,teamId:skillSelectedTeamId()};
  }
  function runInvoke(){
    var iv=SKILL_STATE.invoke, s=skillSelected(); if(!s) return;
    if(!String(iv.prompt||'').trim()){ iv.promptErr=true; reDetail(); return; }
    iv.promptErr=false; iv.state='running'; iv.result=null; reDetail();
    var body={ prompt:String(iv.prompt||'').trim() };
    adminApi('/api/workflow/skills/'+encodeURIComponent(s.guid)+'/invoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(res){
        if(res&&res.forbidden){ iv.state='failed'; iv.result={code:'forbidden',message:'当前账号无权调用该技能（403）'}; reDetail(); return; }
        return res.json().then(function(j){ if(res.ok){ iv.state='done'; iv.result={runId:j.runId, workflowName:j.workflowName, runKind:j.runKind, observatoryUrl:j.observatoryUrl}; }
          else { iv.state='failed'; iv.result={code:j.code||('HTTP '+res.status), message:j.message||j.error||'调用失败'}; } reDetail(); }); })
      .catch(function(err){ if(err&&err.unauthorized) return; iv.state='failed'; iv.result={code:'error', message:(err&&(err.body||err.message))||'网络错误'}; reDetail(); });
  }
  function createSched(){
    var sc=SKILL_STATE.sched, segs=String(sc.cron).split(/\s+/);
    if(!(segs.length===5 && segs.every(cronSegValid))) return;
    var s=skillSelected(); if(!s) return; sc.authErr=false; sc.result=null;
    var teamId=skillSelectedTeamId(); if(!teamId) return;
    var body={ prompt:String(SKILL_STATE.invoke.prompt||'').trim()||undefined, cronExpression:sc.cron, timezone:sc.tz, displayName:(sc.displayName||s.name), teamId:teamId };
    adminApi('/api/workflow/skills/'+encodeURIComponent(s.guid)+'/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(res){
        if(res&&res.forbidden){ sc.authErr=true; reDetail(); return; }
        if(res.status===401){ sc.authErr=true; reDetail(); return; }
        return res.json().then(function(j){ if(res.ok){ sc.result=j.scheduleId; loadMySchedules(reDetail); } else { sc.authErr=(res.status===403); reDetail(); } }); })
      .catch(function(err){ if(err&&err.unauthorized) return; sc.authErr=false; reDetail(); });
  }
  if(!SKILL_STATE.loaded){ SKILL_STATE.loading=true; reList();
    loadSkills(function(){ SKILL_STATE.loaded=true; SKILL_STATE.loading=false; reList();
      if(SKILL_STATE.selected){ SKILL_STATE.sched.displayName=SKILL_STATE.sched.displayName||((skillSelected()||{}).name||''); loadSkillDetail(SKILL_STATE.selected, reDetail); }
      loadMySchedules(reDetail); });
  }
  var currentTeamScope=skillTeamScope();
  if(currentTeamScope&&SKILL_TEAM_STATE.scope!==currentTeamScope&&!SKILL_TEAM_STATE.loading) loadSkillTeams(reDetail);
  else if(!SKILL_TEAM_STATE.loaded&&!SKILL_TEAM_STATE.loading&&!SKILL_TEAM_STATE.err) loadSkillTeams(reDetail);
  bindSchedEditor(root);
  var se=root.querySelector('#skill-search'),seTimer=null;
  se&&se.addEventListener('input',function(){ SKILL_STATE.search=se.value;
    if(seTimer) clearTimeout(seTimer);
    seTimer=setTimeout(function(){ seTimer=null; reList(); },120); });
  root.addEventListener('click',function(ev){
    var sr=ev.target.closest('[data-skill]'); if(sr){ capture(); selectSkill(sr.getAttribute('data-skill')); reList(); reDetail(); loadSkillDetail(SKILL_STATE.selected, reDetail); return; }
    var act=ev.target.closest('[data-act]'); if(!act||act.hasAttribute('disabled')) return; var a=act.getAttribute('data-act');
    if(a==='skBack'){ SKILL_STATE.mobileDetail=false; reDetail(); }
    else if(a==='skAuthorize'){ beginLogin(); }
    else if(a==='skInvoke'){ capture(); runInvoke(); }
    else if(a==='skCopy'){ copyWithToast(act.getAttribute('data-copy')); }
    else if(a==='skOpenRun'){ obsNavigate({run:act.getAttribute('data-run'),scope:'mine'}); }
    else if(a==='skReload'){ SKILL_STATE.loaded=false; SKILLS_LOADED=false; SKILL_STATE.loading=true; reList(); loadSkills(function(){ SKILL_STATE.loaded=true; SKILL_STATE.loading=false; reList(); }); }
    else if(a==='skPreset'){ capture(); SKILL_STATE.sched.cron=act.getAttribute('data-cron'); reDetail(); }
    else if(a==='skSchedCreate'){ capture(); createSched(); }
    else if(a==='skSchedAuth'){ SKILL_STATE.sched.authErr=true; SKILL_STATE.sched.result=null; reDetail(); }
    else if(a==='skSchedRetry'){ SKILL_STATE.sched.authErr=false; reDetail(); }
    else if(a==='skSchedToggle'){ var tid=act.getAttribute('data-id'); var tx=SKILL_SCHED.filter(function(s){return s.id===tid;})[0]; var op=(tx&&tx.enabled)?':disable':':enable'; adminApi('/api/schedules/'+encodeURIComponent(tid)+op,{method:'POST'}).then(function(res){ if(res&&res.forbidden){ toast('无权操作该排班（403）'); return; } if(res.ok) loadMySchedules(reDetail); else toast('操作失败 HTTP '+res.status); }).catch(function(){ toast('操作失败'); }); }
    else if(a==='skSchedRun'){ var rid=act.getAttribute('data-id'); adminApi('/api/schedules/'+encodeURIComponent(rid)+':run-now',{method:'POST'}).then(function(res){ if(res&&res.forbidden){ toast('无权运行该排班（403）'); return; } toast(res.ok?'已触发立即运行 · '+rid:'触发失败 HTTP '+res.status); }).catch(function(){ toast('触发失败'); }); }
    else if(a==='skSchedObs'){ obsNavigate({schedule:act.getAttribute('data-id'),run:null}); }
    else if(a==='skSchedRetry'){ SKILL_STATE.sched.authErr=false; SKILL_STATE.sched.result=null; reDetail(); }
    else if(a==='skSchedDel'){ SKILL_CONFIRM=act.getAttribute('data-id'); reDetail(); }
    else if(a==='skDelCancel'){ SKILL_CONFIRM=null; reDetail(); }
    else if(a==='skDelConfirm'){ var did=SKILL_CONFIRM; SKILL_CONFIRM=null; reDetail(); adminApi('/api/schedules/'+encodeURIComponent(did),{method:'DELETE'}).then(function(res){ if(res&&res.forbidden){ toast('无权删除该排班（403）'); return; } if(res.ok) loadMySchedules(reDetail); else toast('删除失败 HTTP '+res.status); }).catch(function(){ toast('删除失败'); }); }
  });
}

function schedFilterBar(){

function schedDiagnostic(x){
  if(x.currentFailure){ var code=x.lastAuthorizationErrorCode||x.lastErrorCode||x.lastError||'当前执行异常';
    return '<div style="font-size:10.5px;color:var(--failed);margin-top:2px" title="'+esc(code)+'">⚠ '+esc(String(code).slice(0,96))+'</div>'; }
  if(x.pending) return '<div style="font-size:10.5px;color:var(--waiting);margin-top:2px">'+esc(_schLifecycleText(x.lifecycle))+'</div>';
  if(x.fails>0) return '<div style="font-size:10.5px;color:var(--success);margin-top:2px">历史失败 '+x.fails+' 次 · 当前已恢复</div>';

/* ================= ⑩ 审计日志 Audit Trail —— /api/audit/trail =================
   真实接口（最新优先的 cursor 分页，无 totalCount）：scope 三态 —— mine（调用者自身 scope，默认）、
   all（平台管理员跨组织通配，后端 __all__ 分支）、custom（指定具体 scope id，跨 scope 需 admin）。
   分类/状态结果筛选在前端对当前页做客户端过滤（接口未暴露 category query）。 */
var AUDIT_DATA=[];                  /* 已加载的记录行（累积，支持“加载更多”） */
var AUDIT_LOADED=false, AUDIT_LOADING=false, AUDIT_ERR=null, AUDIT_FORBIDDEN=false;

    AUDIT_HAS_MORE=false, AUDIT_WATERMARK=null;

  scope:'mine',                     /* mine | all | custom（all/custom 仅 admin 可用） */
  customScope:'',                   /* scope==='custom' 时填的具体 scope id */
  actor:'',                         /* auditActorId 精确过滤（服务端） */
  from:'', to:'',                   /* ISO 时间范围（服务端） */
  cat:'all',                        /* 客户端分类：按 operation kind/name */

/* lifecycle / terminal outcome -> 渲染 tag 配色。后端返回稳定的小写 wire name。 */
function auditResultTag(o){
  var map={
    succeeded:['tag-success','成功'],
    accepted:['tag-running','已接受'],
    running:['tag-running','进行中'],
    waiting_approval:['tag-waiting','等待审批'],
    failed:['tag-failed','失败'],
    cancelled:['tag-idle','取消'],
    timed_out:['tag-failed','超时'],
    unspecified:['tag-idle','未指定']
  };
  var m=map[o]||['tag-idle',o||'未指定'];
  return '<span class="tag '+m[0]+'"><span class="tdot"></span>'+esc(m[1])+'</span>';
}
function auditResult(r){ return (r&&r.terminalOutcome)||(r&&r.lifecyclePhase)||'unspecified'; }
/* operationName 多为 `<name>.attempted` / `<name>` 形式；结合 typed operationKind 做分类桶。 */
function auditActionCategory(operationName,operationKind){
  var kind=(operationKind||'').toLowerCase();
  if(kind==='authorization') return 'auth';
  if(kind==='workflow') return 'workflow';
  if(kind==='tool') return 'tool';
  if(kind==='schedule') return 'schedule';
  var a=(operationName||'').toLowerCase();
  if(a.indexOf('login')>=0||a.indexOf('auth')>=0||a.indexOf('token')>=0) return 'auth';
  if(a.indexOf('workflow')>=0||a.indexOf('run')>=0) return 'workflow';
  if(a.indexOf('skill')>=0||a.indexOf('invoke')>=0||a.indexOf('tool')>=0) return 'tool';
  if(a.indexOf('schedule')>=0||a.indexOf('cron')>=0) return 'schedule';
  if(a.indexOf('channel')>=0||a.indexOf('relay')>=0) return 'channel';
  if(a.indexOf('scope')>=0||a.indexOf('admin')>=0||a.indexOf('user')>=0) return 'admin';
  if(a.indexOf('config')>=0||a.indexOf('setting')>=0) return 'config';
  return 'other';
}
var AUDIT_CATEGORIES=[
  {k:'all',label:'全部分类'},
  {k:'auth',label:'认证授权'},

  {k:'schedule',label:'排班调度'},

var AUDIT_RESULTS=[

function auditRerender(){ if(typeof AUDIT_RERENDER==='function') AUDIT_RERENDER(); }
function auditAgo(iso){
  if(!iso) return '—';
  var t=new Date(iso); if(isNaN(t.getTime())) return '—';
  var s=Math.max(0,(Date.now()-t.getTime())/1000);
  if(s<60) return Math.round(s)+'秒前';
  if(s<3600) return Math.round(s/60)+'分钟前';
  if(s<86400) return Math.round(s/3600)+'小时前';
  return Math.round(s/86400)+'天前';
}
function auditFmtTime(iso){
  if(!iso) return '—';
  var d=new Date(iso); if(isNaN(d.getTime())) return '—';
  function p2(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
}
/* 把 query string 拼出来：scope/actor/identity/from/to/take/cursor 都是服务端维度。
   scope 三态：mine → 不传（后端默认用调用者 scope）；all → __all__（admin 通配）；
   custom → 传具体 scope id（跨 scope 需 admin，由后端鉴权）。 */
function auditBuildQuery(opts){
  opts=opts||{};
  var q=[];
  if(opts.cursor) q.push('cursor='+encodeURIComponent(opts.cursor));
  var mode=AUDIT_STATE.scope;
  if(mode==='all') q.push('scope='+encodeURIComponent('__all__'));
  else if(mode==='custom'){
    var sid=(AUDIT_STATE.customScope||'').trim();
    if(sid) q.push('scope='+encodeURIComponent(sid));
  }
  var actor=(AUDIT_STATE.actor||'').trim();
  if(actor) q.push('auditActorId='+encodeURIComponent(actor));
  /* from/to：datetime-local 值形如 2026-07-01T00:00，补成 ISO UTC。
     这里按本地时间解释，转成 Z 结尾的时间戳交给后端。 */
  if(AUDIT_STATE.from){
    var fd=new Date(AUDIT_STATE.from); if(!isNaN(fd.getTime())) q.push('from='+fd.toISOString());
  }
  if(AUDIT_STATE.to){
    var td=new Date(AUDIT_STATE.to); if(!isNaN(td.getTime())) q.push('to='+td.toISOString());
  }
  q.push('take='+(opts.take||50));
  return q.length?('?'+q.join('&')):'';
}
function auditApplyPage(j,append){

  AUDIT_CURSOR=coverage.continuationCursor||null;

/* 重新加载首页。reset=true（筛选条件变化）清空后显示加载态；
   reset=false（重进模块 / 头部刷新）保留已展示的行，静默拉新替换 —— 不闪骨架屏。 */
async function loadAuditTrail(reset){
  AUDIT_LOADING=true; AUDIT_ERR=null; AUDIT_FORBIDDEN=false;
  if(reset){ AUDIT_DATA=[]; AUDIT_CURSOR=null; AUDIT_HAS_MORE=false; AUDIT_WATERMARK=null; }
  auditRerender();
  try{
    var j=await adminJson('/api/audit/trail'+auditBuildQuery({take:50}));
    if(j&&j.forbidden){ AUDIT_FORBIDDEN=true; AUDIT_DATA=[]; }
    else auditApplyPage(j,false);
  }catch(e){
    if(e&&e.unauthorized){ AUDIT_LOADING=false; return; }
    AUDIT_ERR=(e&&(e.body||e.message))||'审计日志加载失败';
    AUDIT_DATA=[];
  }
  AUDIT_LOADED=true; AUDIT_LOADING=false; auditRerender();
}
/* “加载更多”：用上一页 coverage.continuationCursor 继续取下一页，追加到 AUDIT_DATA */
async function loadAuditMore(){
  if(!AUDIT_CURSOR||AUDIT_LOADING) return;
  AUDIT_LOADING=true; auditRerender();
  try{
    var j=await adminJson('/api/audit/trail'+auditBuildQuery({take:50,cursor:AUDIT_CURSOR}));
    if(j&&j.forbidden){ AUDIT_FORBIDDEN=true; }
    else auditApplyPage(j,true);
  }catch(e){ if(!(e&&e.unauthorized)){ AUDIT_ERR=(e&&(e.body||e.message))||'加载更多失败'; } }
  AUDIT_LOADING=false; auditRerender();
}
/* 客户端分类/状态结果/关键词过滤当前已加载记录 */
function auditFilteredRows(){
  var cat=AUDIT_STATE.cat, result=AUDIT_STATE.result, text=(AUDIT_STATE.text||'').trim().toLowerCase();
  return AUDIT_DATA.filter(function(r){
    var target=r.target||{}, correlation=r.correlation||{};
    if(cat!=='all' && auditActionCategory(r.operationName,r.operationKind)!==cat) return false;
    if(result!=='all' && auditResult(r)!==result) return false;
    if(text){
      var hay=[r.operationName,target.kind,target.id,correlation.correlationId,r.auditActorId,r.id].join(' ').toLowerCase();
      if(hay.indexOf(text)<0) return false;
    }
    return true;
  });
}

  var loadMoreBtn=(AUDIT_HAS_MORE&&!AUDIT_LOADING)
    ? '<button class="btn" data-act="auditMore">加载更多</button>' : '';
  var moreSpinner=AUDIT_LOADING ? '<span class="spinner"></span>' : '';
  var info;
  if(AUDIT_FORBIDDEN) info='无权读取跨组织审计日志';
  else if(AUDIT_HAS_MORE) info='已加载 '+total+' 条 · 当前显示 '+shown+' 条（仍有更多，按游标继续）';
  else if(total>0) info='共 '+shown+' 条（已到末页）';
  else info='无记录';
  return '<div class="pager"><span class="pg-info">'+info+'</span>'+moreSpinner+loadMoreBtn+'</div>';
}
function auditResultsHtml(){ return auditTable()+auditPager(); }
function auditRoot(){
  var gate=auditGate(); if(gate) return gate;
  return '<div class="view-scroll">'+
    auditFilters()+
    '<div id="audit-results">'+auditResultsHtml()+'</div>'+
    '<p class="chan-note">游标分页：无总数；按操作时间倒序。“加载更多”沿 continuationCursor 追加。分类/状态结果/关键词为当前已加载数据的客户端筛选。</p>'+
  '</div>';
}
function viewAudit(){
  var run=(parseHash().q||{}).run; if(run) AUDIT_STATE.text=run;
  return {html:moduleSubHeader('audit','<span class="inline-refresh">审计日志 · '+srcBadge('ready')+' · /api/audit/trail '+auditWatermarkNote()+'</span>')+
    '<div class="audit-root" id="audit-root">'+auditRoot()+'</div>', mount:bindAudit};
}
function bindAudit(root){
  var rb=root.querySelector('#audit-root');
  function re(){ if(rb) replaceViewHtml(rb,auditRoot()); }
  AUDIT_RERENDER=re;
  if(!AUDIT_LOADING) loadAuditTrail(!AUDIT_LOADED);
  function detailFor(id){
    var r=AUDIT_DATA.filter(function(x){return x.id===id;})[0];
    if(!r) return null;
    var target=r.target||{}, correlation=r.correlation||{}, provenance=r.provenance||{};
    var cat=auditActionCategory(r.operationName,r.operationKind);
    var catLabel=(AUDIT_CATEGORIES.filter(function(c){return c.k===cat;})[0]||{label:cat}).label;
    var runCandidate=provenance.runId||correlation.workflowRunId||'';
    var runBtn=runCandidate
      ? '<div class="kv-row"><span class="kk">关联运行</span><span class="vv"><button class="ibtn" style="height:26px" data-act="auditOpenRun" data-run="'+esc(runCandidate)+'">打开 run</button></span></div>'
      : '';
    return '<div class="kv">'+
      '<div class="kv-row"><span class="kk">记录 ID</span><span class="vv">'+esc(r.id)+'</span></div>'+
      '<div class="kv-row"><span class="kk">发生时间</span><span class="vv sans">'+esc(auditFmtTime(r.occurredAtUtc))+' <span class="faint">('+esc(auditAgo(r.occurredAtUtc))+')</span></span></div>'+
      '<div class="kv-row"><span class="kk">操作</span><span class="vv sans">'+esc(r.operationName||'—')+'</span></div>'+
      '<div class="kv-row"><span class="kk">分类（前端推导）</span><span class="vv sans">'+esc(catLabel)+'</span></div>'+
      '<div class="kv-row"><span class="kk">状态 / 结果</span><span class="vv sans">'+auditResultTag(auditResult(r))+'</span></div>'+
      '<div class="kv-row"><span class="kk">组织 scope</span><span class="vv">'+esc(r.scopeId||'—')+'</span></div>'+
      '<div class="kv-row"><span class="kk">操作者</span><span class="vv">'+esc(r.auditActorId||'—')+'</span></div>'+
      '<div class="kv-row"><span class="kk">身份 key</span><span class="vv">'+esc(r.identityKeyId||'—')+'</span></div>'+
      '<div class="kv-row"><span class="kk">资源类型</span><span class="vv sans">'+esc(target.kind||'—')+'</span></div>'+
      '<div class="kv-row"><span class="kk">资源 ID</span><span class="vv">'+esc(target.id||'—')+'</span></div>'+
      '<div class="kv-row"><span class="kk">Correlation ID</span><span class="vv">'+esc(correlation.correlationId||'—')+'</span></div>'+
      runBtn+
      '<div class="kv-row"><span class="kk" style="align-self:center">操作者 ID</span><span class="vv"><button class="ibtn" data-act="auditCopy" data-copy="'+esc(r.auditActorId||'')+'" style="height:24px">复制 auditActorId</button></span></div>'+
    '</div>';
  }
  root.addEventListener('click',function(ev){
    var act=ev.target.closest('[data-act]'); if(!act) return; var a=act.getAttribute('data-act');
    if(a==='auditReload'){
      loadAuditTrail(true);
    } else if(a==='auditReset'){
      AUDIT_STATE={scope:'mine',customScope:'',actor:'',from:'',to:'',cat:'all',result:'all',text:''};
      loadAuditTrail(true);
    } else if(a==='auditMore'){
      loadAuditMore();
    } else if(a==='auditScope'){
      var sg=ev.target.closest('[data-scope]'); if(!sg) return;
      var next=sg.getAttribute('data-scope');
      AUDIT_STATE.scope=next;
      /* 切到 custom 只展开输入框，等用户填 scope id 后点「查询」；mine/all 立即重新查。 */
      if(next==='custom'){ re(); }
      else { loadAuditTrail(true); }
    } else if(a==='auditCat'){
      AUDIT_STATE.cat=act.getAttribute('data-cat'); re();
    } else if(a==='auditResult'){
      AUDIT_STATE.result=act.getAttribute('data-result'); re();
    } else if(a==='auditRow'){
      var id=act.getAttribute('data-id');
      openInspector(detailFor(id),{title:'审计记录详情',sub:id,drawerKind:'audit'});
    } else if(a==='auditCopy'){
      copyWithToast(act.getAttribute('data-copy'),'已复制 auditActorId');
    } else if(a==='auditOpenRun'){
      var runId=(act.getAttribute('data-run')||'').trim();
      if(!runId) return;
      closeDrawer();
      obsNavigate({run:runId});
    }
  });
  /* 输入类用 change/input：scope/actor/from/to 改变不立即请求（按“查询”触发），text 即时筛选 */
  root.addEventListener('change',function(ev){
    var el=ev.target; var a=el.getAttribute&&el.getAttribute('data-act');
    if(a==='auditActorInput') AUDIT_STATE.actor=el.value;
    else if(a==='auditCustomScope') AUDIT_STATE.customScope=el.value;
    else if(a==='auditFrom') AUDIT_STATE.from=el.value;
    else if(a==='auditTo') AUDIT_STATE.to=el.value;
  });
  /* 关键词筛选只重绘 #audit-results（输入框不重建 → 焦点/光标保持），180ms 防抖压掉逐键全表重排 */
  var auditTextTimer=null;
  root.addEventListener('input',function(ev){
    var el=ev.target; var a=el.getAttribute&&el.getAttribute('data-act');
    if(a==='auditText'){ AUDIT_STATE.text=el.value;
      if(auditTextTimer) clearTimeout(auditTextTimer);
      auditTextTimer=setTimeout(function(){ auditTextTimer=null;
        var results=root.querySelector('#audit-results');
        if(results) results.innerHTML=auditResultsHtml(); else re();
      },180);
    }
  });
  /* 在 scope id 输入框里回车 = 直接查询（与「查询」按钮等价） */
  root.addEventListener('keydown',function(ev){
    if(ev.key!=='Enter') return;
    var el=ev.target; var a=el.getAttribute&&el.getAttribute('data-act');
    if(a==='auditCustomScope'||a==='auditActorInput'||a==='auditFrom'||a==='auditTo'){
      ev.preventDefault(); loadAuditTrail(true);
    }
  });
}

/* ================= Chat Activity —— /api/audit/chat-activity ================= */
var CHAT_ACTIVITY_DATA=[];
var CHAT_ACTIVITY_CURSOR=null,CHAT_ACTIVITY_HAS_MORE=false,CHAT_ACTIVITY_WATERMARK=null;
var CHAT_ACTIVITY_LOADING=false,CHAT_ACTIVITY_LOADED=false,CHAT_ACTIVITY_ERR=null,CHAT_ACTIVITY_FORBIDDEN=false;
var CHAT_ACTIVITY_RERENDER=null;
var CHAT_ACTIVITY_STATE={scope:'mine',actor:'',surface:'all',conversation:'',outcome:'all',from:'',to:''};
function chatActivityBuildQuery(opts){
  opts=opts||{}; var q=[];
  if(opts.cursor) q.push('cursor='+encodeURIComponent(opts.cursor));
  if(ACCOUNT&&ACCOUNT.admin&&CHAT_ACTIVITY_STATE.scope==='all'){
    q.push('scope='+encodeURIComponent('__all__'));
    var actor=(CHAT_ACTIVITY_STATE.actor||'').trim();
    if(actor) q.push('auditActorId='+encodeURIComponent(actor));
  }
  if(CHAT_ACTIVITY_STATE.surface&&CHAT_ACTIVITY_STATE.surface!=='all') q.push('surface='+encodeURIComponent(CHAT_ACTIVITY_STATE.surface));
  var conversation=(CHAT_ACTIVITY_STATE.conversation||'').trim();
  if(conversation) q.push('conversationId='+encodeURIComponent(conversation));
  if(CHAT_ACTIVITY_STATE.outcome&&CHAT_ACTIVITY_STATE.outcome!=='all') q.push('outcome='+encodeURIComponent(CHAT_ACTIVITY_STATE.outcome));
  if(CHAT_ACTIVITY_STATE.from){ var fd=new Date(CHAT_ACTIVITY_STATE.from); if(!isNaN(fd.getTime())) q.push('from='+encodeURIComponent(fd.toISOString())); }
  if(CHAT_ACTIVITY_STATE.to){ var td=new Date(CHAT_ACTIVITY_STATE.to); if(!isNaN(td.getTime())) q.push('to='+encodeURIComponent(td.toISOString())); }
  q.push('take='+(opts.take||50));
  return '?'+q.join('&');
}
function chatActivityApplyPage(j,append){
  var records=(j&&j.records)||[],coverage=(j&&j.coverage)||{};
  if(append) Array.prototype.push.apply(CHAT_ACTIVITY_DATA,records); else CHAT_ACTIVITY_DATA=records;
  CHAT_ACTIVITY_CURSOR=coverage.continuationCursor||null;
  CHAT_ACTIVITY_HAS_MORE=!!CHAT_ACTIVITY_CURSOR;
  CHAT_ACTIVITY_WATERMARK=coverage.ingestionWatermark||CHAT_ACTIVITY_WATERMARK;
}
function chatActivityRerender(){ if(typeof CHAT_ACTIVITY_RERENDER==='function') CHAT_ACTIVITY_RERENDER(); }
/* reset 语义同 loadAuditTrail：筛选变化清空，重进/刷新保留旧行静默换新 */
async function loadChatActivity(reset){
  CHAT_ACTIVITY_LOADING=true;CHAT_ACTIVITY_ERR=null;CHAT_ACTIVITY_FORBIDDEN=false;
  if(reset){CHAT_ACTIVITY_DATA=[];CHAT_ACTIVITY_CURSOR=null;CHAT_ACTIVITY_HAS_MORE=false;}
  chatActivityRerender();
  try{
    var j=await adminJson('/api/audit/chat-activity'+chatActivityBuildQuery({take:50}));
    if(j&&j.forbidden) CHAT_ACTIVITY_FORBIDDEN=true; else chatActivityApplyPage(j,false);
  }catch(e){
    if(e&&e.unauthorized){CHAT_ACTIVITY_LOADING=false;return;}
    CHAT_ACTIVITY_ERR=(e&&(e.body||e.message))||'Chat Activity 加载失败';
  }
  CHAT_ACTIVITY_LOADED=true;CHAT_ACTIVITY_LOADING=false;chatActivityRerender();
}
async function loadChatActivityMore(){
  if(!CHAT_ACTIVITY_CURSOR||CHAT_ACTIVITY_LOADING)return;
  CHAT_ACTIVITY_LOADING=true;chatActivityRerender();
  try{
    var j=await adminJson('/api/audit/chat-activity'+chatActivityBuildQuery({take:50,cursor:CHAT_ACTIVITY_CURSOR}));
    if(j&&j.forbidden) CHAT_ACTIVITY_FORBIDDEN=true; else chatActivityApplyPage(j,true);
  }catch(e){if(!(e&&e.unauthorized))CHAT_ACTIVITY_ERR=(e&&(e.body||e.message))||'Chat Activity 加载失败';}
  CHAT_ACTIVITY_LOADING=false;chatActivityRerender();
}
function chatActivityKind(r){return String((r&&r.operationName)||'').indexOf('chat.action.')===0?'Action':'Tool';}
function chatActivityName(r){return chatActivityKind(r)==='Action'?((r.target&&r.target.id)||r.operationName||'—'):(r.operationName||'—');}
function chatActivityShortId(value){value=String(value||'');return value.length>22?value.slice(0,10)+'…'+value.slice(-7):(value||'—');}
function chatActivityConversationGroups(){
  var byId=new Map(),groups=[];
  CHAT_ACTIVITY_DATA.forEach(function(r){
    var chat=((r.provenance||{}).chat)||{},id=String(chat.conversationId||'').trim(),key=id||'__unattributed__',group=byId.get(key);
    if(!group){group={id:id,records:[]};byId.set(key,group);groups.push(group);}
    group.records.push(r);
  });
  groups.forEach(function(group){
    group.records.sort(function(a,b){return (Date.parse(b.occurredAtUtc||'')||0)-(Date.parse(a.occurredAtUtc||'')||0);});
    group.latestAtUtc=group.records[0]&&group.records[0].occurredAtUtc;
  });
  return groups.sort(function(a,b){return (Date.parse(b.latestAtUtc||'')||0)-(Date.parse(a.latestAtUtc||'')||0);});
}
function chatActivityTable(){
  if(!CHAT_ACTIVITY_DATA.length)return '<div class="empty">'+ICON.empty+'<div class="et">暂无 Chat Activity</div><div class="es">当前筛选条件下没有工具调用或浏览器 action。</div></div>';
  var groups=chatActivityConversationGroups(),html=groups.map(function(group,index){
    var label=group.id||'Unattributed Conversation',rows=group.records.map(function(r){
      var chat=((r.provenance||{}).chat)||{},kind=chatActivityKind(r),name=chatActivityName(r);
      return '<tr role="button" tabindex="0" data-act="chatActivityRow" data-id="'+esc(r.id)+'" aria-label="查看 '+esc(kind)+' '+esc(name)+'">'+
        '<td><div class="audit-time"><b class="num">'+esc(auditFmtTime(r.occurredAtUtc))+'</b><span class="audit-ago faint">'+esc(auditAgo(r.occurredAtUtc))+'</span></div></td>'+
        '<td><span class="chip">'+kind+'</span></td>'+
        '<td><div class="audit-action"><b>'+esc(name)+'</b></div></td>'+
        '<td>'+auditResultTag(auditResult(r))+'</td>'+
        '<td><span class="audit-corr mono" title="'+esc(chat.turnId||'')+'">'+esc(chatActivityShortId(chat.turnId))+'</span></td></tr>';
    }).join('');
    return '<details class="chat-activity-conversation" data-conversation="'+esc(group.id)+'"'+(index===0?' open':'')+'><summary class="chat-activity-conversation-summary">'+
      '<span class="chat-activity-conversation-title"><span class="faint">Conversation</span><b class="mono" title="'+esc(label)+'">'+esc(label)+'</b></span>'+
      '<span class="chat-activity-conversation-meta"><span>'+group.records.length+' 条 Activity</span><span>最近 '+esc(auditAgo(group.latestAtUtc))+'</span></span></summary>'+
      '<div class="protable-wrap audit-table-wrap"><table class="protable audit-table chat-activity-table"><thead><tr>'+
      '<th class="col-time">时间</th><th class="col-kind">类型</th><th class="col-name">名称</th><th class="col-result">状态</th><th class="col-chat-id">Turn</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div></details>';
  }).join('');
  return '<div class="chat-activity-groups"><div class="chat-activity-groups-head"><b>'+groups.length+' 个 Conversation</b><span>'+CHAT_ACTIVITY_DATA.length+' 条 Activity</span></div>'+html+'</div>';
}
function chatActivityInspector(r){
  var chat=((r.provenance||{}).chat)||{},correlation=r.correlation||{},target=r.target||{},failure=r.failure||{};
  function row(label,value,copy){
    if(value==null||value==='')return '';var text=String(value);
    return '<div class="kv-row"><span class="kk">'+esc(label)+'</span><span class="vv">'+esc(text)+(copy?' <button class="ibtn" data-act="chatActivityCopy" data-copy="'+esc(text)+'" style="height:24px">复制</button>':'')+'</span></div>';
  }
  return '<div class="kv">'+
    row('记录 ID',r.id,true)+row('类型',chatActivityKind(r))+row('名称',chatActivityName(r))+row('状态',auditResult(r))+
    row('Surface',chat.surface)+row('Conversation ID',chat.conversationId,true)+row('Turn ID',chat.turnId,true)+
    row('Task ID',chat.taskId,true)+row('Step ID',chat.stepId,true)+row('Call ID',correlation.callId,true)+
    row('Action Request ID',chat.actionRequestId,true)+row('目标类型',target.kind)+row('目标名称',target.id)+
    row('Failure code',failure.code)+row('Failure category',failure.category)+row('Failure message',failure.sanitizedMessage)+
    row('Audit actor',r.auditActorId,true)+row('Scope',r.scopeId)+row('Correlation ID',correlation.correlationId,true)+
    '</div>';
}
function chatActivityGate(){
  if(CHAT_ACTIVITY_FORBIDDEN)return auth403('所有用户的 Chat Activity 仅平台管理员可见。');
  if(CHAT_ACTIVITY_ERR)return '<div class="alert">'+ICON.warn+'<span class="grow">Chat Activity 加载失败：'+esc(CHAT_ACTIVITY_ERR)+'</span><button class="btn" data-act="chatActivityReload">重试</button></div>';
  if(!CHAT_ACTIVITY_LOADED||CHAT_ACTIVITY_LOADING&&CHAT_ACTIVITY_DATA.length===0)return '<div class="empty"><span class="spinner"></span><div class="et" style="margin-top:10px">正在加载 Chat Activity…</div></div>';
  return null;
}
function chatActivityFilters(){
  var scope='<div class="seg-toggle" data-act="chatActivityScope"><button class="'+(CHAT_ACTIVITY_STATE.scope==='mine'?'on':'')+'" data-scope="mine">My activity</button>'+
    ((ACCOUNT&&ACCOUNT.admin)?'<button class="'+(CHAT_ACTIVITY_STATE.scope==='all'?'on':'')+'" data-scope="all">All users</button>':'')+'</div>';
  var actor=(ACCOUNT&&ACCOUNT.admin&&CHAT_ACTIVITY_STATE.scope==='all')?'<div class="audit-field"><label>Audit actor</label><input data-act="chatActivityActor" value="'+esc(CHAT_ACTIVITY_STATE.actor)+'" placeholder="HMAC actor ID（精确）"></div>':'';
  return '<div class="audit-filters">'+scope+actor+
    '<div class="audit-field"><label>Surface</label><select class="std-select" data-act="chatActivitySurface"><option value="all">全部</option><option value="nyxid_assistant"'+(CHAT_ACTIVITY_STATE.surface==='nyxid_assistant'?' selected':'')+'>NyxID Assistant</option><option value="workflow_chat"'+(CHAT_ACTIVITY_STATE.surface==='workflow_chat'?' selected':'')+'>Workflow Chat</option></select></div>'+
    '<div class="audit-field"><label>Conversation</label><input data-act="chatActivityConversation" value="'+esc(CHAT_ACTIVITY_STATE.conversation)+'" placeholder="conversation ID"></div>'+
    '<div class="audit-field"><label>Outcome</label><select class="std-select" data-act="chatActivityOutcome"><option value="all">全部</option><option value="succeeded"'+(CHAT_ACTIVITY_STATE.outcome==='succeeded'?' selected':'')+'>成功</option><option value="failed"'+(CHAT_ACTIVITY_STATE.outcome==='failed'?' selected':'')+'>失败</option><option value="cancelled"'+(CHAT_ACTIVITY_STATE.outcome==='cancelled'?' selected':'')+'>取消</option><option value="timed_out"'+(CHAT_ACTIVITY_STATE.outcome==='timed_out'?' selected':'')+'>超时</option></select></div>'+
    '<button class="btn btn-primary" data-act="chatActivityReload">查询</button><button class="btn" data-act="chatActivityReset">重置</button></div>';
}
function chatActivityRoot(){
  var gate=chatActivityGate();if(gate)return '<div class="view-scroll">'+gate+'</div>';
  return '<div class="view-scroll">'+chatActivityFilters()+chatActivityTable()+
    '<div class="pager"><span class="pg-info">已加载 '+CHAT_ACTIVITY_DATA.length+' 条</span>'+
    (CHAT_ACTIVITY_LOADING?'<span class="spinner"></span>':'')+(CHAT_ACTIVITY_HAS_MORE&&!CHAT_ACTIVITY_LOADING?'<button class="btn" data-act="chatActivityMore">加载更多</button>':'')+'</div>'+
    '<p class="chan-note">只展示工具调用和浏览器 action 的安全字段，不读取聊天正文、历史或 transcript。</p></div>';
}
function viewChatActivity(){
  return {html:moduleSubHeader('chat-activity','<span class="inline-refresh">Chat Activity · '+srcBadge('ready')+' · /api/audit/chat-activity</span>')+
    '<div class="audit-root" id="chat-activity-root">'+chatActivityRoot()+'</div>',mount:bindChatActivity};
}
function bindChatActivity(root){
  var rb=root.querySelector('#chat-activity-root');function re(){if(rb)rb.innerHTML=chatActivityRoot();}CHAT_ACTIVITY_RERENDER=re;
  if(!CHAT_ACTIVITY_LOADING)loadChatActivity(!CHAT_ACTIVITY_LOADED);
  function selected(id){return CHAT_ACTIVITY_DATA.filter(function(r){return r.id===id;})[0];}
  function openRow(el){var r=selected(el.getAttribute('data-id'));if(r)openInspector(chatActivityInspector(r),{title:'Chat Activity 详情',sub:r.id,drawerKind:'audit'});}
  root.addEventListener('click',function(ev){
    var act=ev.target.closest('[data-act]');if(!act)return;var a=act.getAttribute('data-act');
    if(a==='chatActivityRow')openRow(act);
    else if(a==='chatActivityReload'){loadChatActivity(true);}
    else if(a==='chatActivityMore')loadChatActivityMore();
    else if(a==='chatActivityReset'){CHAT_ACTIVITY_STATE={scope:'mine',actor:'',surface:'all',conversation:'',outcome:'all',from:'',to:''};loadChatActivity(true);}
    else if(a==='chatActivityScope'){var b=ev.target.closest('[data-scope]');if(b){CHAT_ACTIVITY_STATE.scope=b.getAttribute('data-scope');loadChatActivity(true);}}
  });
  root.addEventListener('change',function(ev){var a=ev.target.getAttribute('data-act');if(a==='chatActivityActor')CHAT_ACTIVITY_STATE.actor=ev.target.value;else if(a==='chatActivitySurface')CHAT_ACTIVITY_STATE.surface=ev.target.value;else if(a==='chatActivityConversation')CHAT_ACTIVITY_STATE.conversation=ev.target.value;else if(a==='chatActivityOutcome')CHAT_ACTIVITY_STATE.outcome=ev.target.value;});
  root.addEventListener('keydown',function(ev){
    var row=ev.target.closest&&ev.target.closest('[data-act="chatActivityRow"]');
    if(row&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();openRow(row);return;}
    if(ev.key==='Enter'){var a=ev.target.getAttribute&&ev.target.getAttribute('data-act');if(a==='chatActivityActor'||a==='chatActivityConversation'){ev.preventDefault();loadChatActivity(true);}}
  });
}

function obsNavigate(patch){
  var q=(parseHash().parts[0]==='observatory')?parseHash().q:{},next={};
  ['scope','status','origin','definition','schedule','from','to','run','tab'].forEach(function(key){if(q[key])next[key]=q[key];});
  Object.keys(patch||{}).forEach(function(key){if(patch[key]==null||patch[key]==='')delete next[key];else next[key]=patch[key];});
  navigate(['observatory'],next);
}
function opsView(module){
  switch(module){
    case 'status': return viewStatus();
    case 'observatory': return viewObservatoryFrame();
    case 'cqrs': return viewCqrs();
    case 'studio': return viewStudio();
    case 'agent-profiles': return viewAgentProfiles();
    case 'skills': return viewSkills();
    case 'models': return viewModels();
    case 'schedules': return viewSchedules();
    case 'channels': return viewChannels();
    case 'voice': return viewVoice();
    case 'audit': return viewAudit();
    case 'chat-activity': return viewChatActivity();
    default: return null;
  }
}

</script>
  <script>
/* =========================================================================
   App shell + 路由 + breadcrumb + ContextDrawer + 横切交互
   路由（hash + query，可分享 / 刷新保持）：
     #/                              L0 集团总览
     #/c/:co?view=roster|flow        L1 公司视图
     #/c/:co/e/:emp?mode=emp|task    L2 员工 / 任务
     #/c/:co/e/:emp/r/:run           L3 Run（已存在 stub）
   ========================================================================= */
var STATE={l0Sort:'health',l0Filter:null,l0Range:'today',l1Sub:'roster',l1Status:null,l2Mode:'emp',search:'',collapsed:{},railCollapsed:false};
var _focusSearch=false;
var ADMIN_VIEW_KEY=OIDC.storageKey+':admin:view',_renderedRouteKey='',_renderedModule='';
/* 当前 .rail 子树对应的标记；与 DOM 严格同步（ensureShell 建壳时写入，render 重建时更新），
   用于跳过内容相同的 rail 重建。 */
var _renderedRailHtml='';

/* ---------- hash parsing / building ---------- */
function parseHash(){
  var h=location.hash.replace(/^#/,''); if(h.indexOf('/')!==0) h='/'+h;
  var qi=h.indexOf('?'), path=qi>=0?h.slice(0,qi):h, qs=qi>=0?h.slice(qi+1):'';
  var parts=path.split('/').filter(Boolean), q={};
  qs.split('&').forEach(function(kv){ if(!kv)return; var i=kv.indexOf('=');
    q[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1)); });
  return {parts:parts,q:q};
}
function buildHash(parts,q){
  var p='#/'+parts.join('/'), keys=Object.keys(q).filter(function(k){return q[k]!=null&&q[k]!=='';});
  if(keys.length) p+='?'+keys.map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(q[k]);}).join('&');
  return p;
}
function curParts(){ return parseHash().parts; }
function setQuery(patch){
  var s=parseHash(), q=s.q;
  Object.keys(patch).forEach(function(k){ if(patch[k]==null) delete q[k]; else q[k]=patch[k]; });
  location.hash=buildHash(s.parts,q);
}
function navigate(parts,q){ location.hash=buildHash(parts,q||{}); }
function adminRouteKey(hash){ return String(hash||'#/').replace(/^#?/, '#'); }
function readAdminViewState(storage,key,route){
  try{ var all=JSON.parse(storage.getItem(key)||'{}'); return Math.max(0,Number(all[adminRouteKey(route)])||0); }catch(e){ return 0; }
}
function writeAdminViewState(storage,key,route,scrollTop){
  try{ var all={}; try{ all=JSON.parse(storage.getItem(key)||'{}')||{}; }catch(e){}
    var keys=Object.keys(all); if(keys.length>60) keys.slice(0,keys.length-60).forEach(function(k){delete all[k];});
    all[adminRouteKey(route)]=Math.max(0,Number(scrollTop)||0); storage.setItem(key,JSON.stringify(all));
  }catch(e){}
}
function adminPaneScrollTop(pane){
  if(!pane) return 0;
  var live=Math.max(0,Number(pane.scrollTop)||0);
  var restored=Math.max(0,Number(pane.getAttribute&&pane.getAttribute('data-restored-scroll'))||0);
  return live===0&&Number(pane.scrollHeight)<=Number(pane.clientHeight)?restored:live;
}
function captureAdminViewState(route){
  var scroll=document.querySelector('#app .view-scroll');
  if(scroll){
    var position=adminPaneScrollTop(scroll);
    if(scroll.setAttribute) scroll.setAttribute('data-restored-scroll',String(position));
    writeAdminViewState(sessionStorage,ADMIN_VIEW_KEY,route,position);
  }
}
function restoreAdminViewState(route){
  var scroll=document.querySelector('#app .view-scroll');
  if(scroll){
    var position=readAdminViewState(sessionStorage,ADMIN_VIEW_KEY,route);
    scroll.scrollTop=position;
    if(scroll.setAttribute) scroll.setAttribute('data-restored-scroll',String(position));
  }
}
function replaceViewHtml(root,html){
  if(!root) return;
  var oldScroll=root.matches&&root.matches('.view-scroll')?root:(root.querySelector('.view-scroll')||(('scrollTop' in root)?root:null));
  var scrollTop=adminPaneScrollTop(oldScroll);
  if(oldScroll&&oldScroll.setAttribute) oldScroll.setAttribute('data-restored-scroll',String(scrollTop));
  root.innerHTML=html;
  var nextScroll=root.matches&&root.matches('.view-scroll')?root:(root.querySelector('.view-scroll')||(('scrollTop' in root)?root:null));
  if(nextScroll){
    nextScroll.scrollTop=scrollTop;
    if(nextScroll.setAttribute) nextScroll.setAttribute('data-restored-scroll',String(scrollTop));
  }
}
function setAdminImmersive(enabled){ document.body.classList.toggle('observatory-immersive',!!enabled); }

/* ---------- breadcrumb（模块名 / 模块内路径） ---------- */
function breadcrumb(module, rest){
  var mname=(MODULE_META[module]&&MODULE_META[module].name)||module;
  var items=[{label:mname,parts:[module],cur:rest.length===0}];
  if(module==='fleet'&&rest[0]==='c'&&rest[1]){
    var co=companyById(rest[1]);
    items.push({label:co?co.name:rest[1],parts:['fleet','c',rest[1]],cur:rest.length===2});
    if(rest[2]==='e'&&rest[3]){
      var det=companyDetail(rest[1]); var e=det&&(employeeById(det,rest[3])||det.employees[0]);
      items.push({label:e?e.name:rest[3],parts:['fleet','c',rest[1],'e',rest[3]],cur:rest.length===4});
      if(rest[4]==='r'&&rest[5]) items.push({label:'Run '+rest[5],parts:['fleet'].concat(rest),cur:true});
    }
  }
  return '<nav class="crumb" aria-label="breadcrumb">'+items.map(function(it,i){
    var sep=i>0?'<span class="crumb-sep">/</span>':'';
    return sep+'<button class="crumb-item'+(it.cur?' cur':'')+'" data-crumb="'+it.parts.join('/')+'">'+esc(it.label)+'</button>';
  }).join('')+'</nav>';
}

/* ---------- shell（rail + main，构建一次；rail/header 每次导航原位更新） ---------- */
/* header 右侧只放真实可用的控件：全局搜索（/ 聚焦；回车按 run id / 关键词路由）、
   数据来源说明、当前模块真实刷新。不再渲染假的 live 徽标或走表时钟戳。 */
function renderShellHeader(module,rest){
  return '<header class="app-header">'+
    '<button class="hamburger" data-act="railOpen" aria-label="菜单">≡</button>'+
    breadcrumb(module,rest)+
    '<div class="header-right">'+
      '<div class="search" role="search"><span>'+ICON.search+'</span><input placeholder="搜索 run id / 技能… ( / )" data-act="globalSearch" aria-label="全局搜索"></div>'+
      '<button class="ibtn" data-act="srcLegend" aria-label="数据来源说明">ⓘ 来源</button>'+
      '<button class="ibtn" data-act="refresh" data-tip="刷新当前模块" aria-label="刷新当前模块">'+ICON.refresh+'</button>'+
    '</div>'+
  '</header>';
}
/* shell 只建一次：切模块时 rail/header 原位替换、#view-body 换内容、#frame-dock 常驻。
   嵌入式套件页（观测台/studio/cqrs/channels/voice）的 iframe 挂在 dock 里用 display 切换，
   离开模块不销毁 —— 返回即原状态秒开，不重新加载整页。 */
function ensureShell(){
  var app=document.getElementById('app');
  if(document.getElementById('console-shell')) return app;
  _renderedRailHtml=renderRail('');          /* 建壳即登记，保证缓存与 DOM 同源 */
  app.innerHTML='<div class="console" id="console-shell">'+_renderedRailHtml+
    '<div class="main">'+renderShellHeader(defaultModule(),[])+
      '<div class="view"><div id="view-body"></div><div id="frame-dock"></div></div>'+
    '</div></div>';
  return app;
}
/* dock 内激活/创建目标 iframe：带 query 的深链（观测台 ?run=… / cqrs ?owner=…）更新 src；
   裸路径返回不动 src，保留 iframe 内部状态。 */
function activateDockFrame(dock,v){
  var frame=dock.querySelector('[data-persistent-view="'+v.persistentKey+'"]');
  if(!frame){
    dock.insertAdjacentHTML('beforeend',v.html);
    frame=dock.querySelector('[data-persistent-view="'+v.persistentKey+'"]');
  } else {
    var want=v.frameSource,cur=frame.getAttribute('data-frame-source');
    if(want.indexOf('?')>=0&&want!==cur){ frame.setAttribute('data-frame-source',want); frame.src=want; }
  }
  Array.prototype.forEach.call(dock.querySelectorAll('.suite-embed'),function(f){ f.classList.toggle('active',f===frame); });
}

/* ---------- render ---------- */
function render(){
  var nextRouteKey=adminRouteKey(location.hash);
  if(_renderedRouteKey) captureAdminViewState(_renderedRouteKey);
  var s=parseHash(), parts=s.parts, q=s.q;
  /* derive URL-backed state */
  STATE.l0Sort=q.sort||'health'; STATE.l0Filter=q.filter||null; STATE.l0Range=q.range||'today';
  STATE.l1Sub=q.view||'roster'; STATE.l1Status=q.status||null; STATE.l2Mode=q.mode||'emp';

  var module=parts[0]||defaultModule(), rest=parts.slice(1);
  if(!canAccessModule(MODULE_META[module])){ module=defaultModule(); rest=[]; }
  var v;
  if(module==='fleet'){
    if(rest.length===0) v=viewL0();
    else if(rest[0]==='c'&&rest[2]==='e'&&rest[4]==='r') v=viewL3(rest[1],rest[3],rest[5]);
    else if(rest[0]==='c'&&rest[2]==='e') v=viewL2(rest[1],rest[3]);
    else if(rest[0]==='c') v=viewL1(rest[1]);
    else v=viewL0();
  } else {
    v=opsView(module);
    if(!v){ module='fleet'; rest=[]; v=viewL0(); }
  }

  var app=ensureShell();
  app.setAttribute('aria-busy','false');
  var shell=document.getElementById('console-shell');
  shell.classList.toggle('rail-collapsed',STATE.railCollapsed);
  var header=shell.querySelector('.app-header'); if(header) header.outerHTML=renderShellHeader(module,rest);
  /* rail 标记只随 module / 账号 / 权限变化，而 render() 在排序、筛选、抽屉开合等同模块交互中
     都会跑一遍。内容相同就跳过 outerHTML —— 重建要重新解析标记、重造整棵导航子树，并重绘
     rail 的 radial-gradient 底色。折叠/展开态挂在 #console-shell 上，不受此影响。 */
  var rail=shell.querySelector('.rail');
  if(rail){ var railHtml=renderRail(module);
    if(railHtml!==_renderedRailHtml){ rail.outerHTML=railHtml; _renderedRailHtml=railHtml; } }
  var viewBody=document.getElementById('view-body'),dock=document.getElementById('frame-dock');
  if(v.persistentKey){
    viewBody.style.display='none'; viewBody.innerHTML='';
    dock.style.display='flex';
    activateDockFrame(dock,v);
  } else {
    dock.style.display='none';
    viewBody.style.display='flex';
    viewBody.innerHTML=v.html;
    if(v.mount) v.mount(viewBody);
  }
  _renderedRouteKey=nextRouteKey; _renderedModule=module;
  restoreAdminViewState(nextRouteKey);

  if(_focusSearch){ var si=app.querySelector('[data-act="l1search"]'); if(si){ si.focus(); var val=si.value; si.value=''; si.value=val; } _focusSearch=false; }
}

/* ---------- toast ---------- */
function toast(msg){
  var r=document.getElementById('toast-root');
  var el=document.createElement('div'); el.className='toast';
  el.innerHTML=ICON.check+'<span>'+esc(msg)+'</span>'; r.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){el.remove();},300); },2200);
}
/* Real clipboard copy. Tries the async Clipboard API, then a hidden-textarea + execCommand
   fallback for non-secure / older contexts. Resolves to the genuine success boolean so callers
   only ever claim "已复制" when the value actually reached the clipboard. No fake toasts. */
function execCommandCopy(value){
  var ta=document.createElement('textarea');
  ta.value=value; ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.opacity='0'; ta.style.pointerEvents='none';
  document.body.appendChild(ta); ta.select(); try{ ta.setSelectionRange(0,value.length); }catch(_){}
  var ok=false; try{ ok=document.execCommand('copy'); }catch(_){ ok=false; }
  ta.remove(); return ok;
}
function copyToClipboard(value){
  value=value==null?'':String(value);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(value).then(function(){ return true; },function(){ return execCommandCopy(value); });
  }
  return Promise.resolve(execCommandCopy(value));
}
/* Copy `value`; toast the honest outcome. okMsg/errMsg accept the value for interpolation. */
function copyWithToast(value,okMsg,errMsg){
  copyToClipboard(value).then(function(ok){ toast(ok?(okMsg||('已复制：'+value)):(errMsg||('复制失败，请手动选择：'+value))); });
}

/* ---------- 头部 ⟳ = 当前模块真实刷新 ----------
   数据模块静默拉新（SWR，不闪骨架屏）；嵌入套件页重载对应 iframe；不再假装刷新。 */
function refreshActiveModule(){
  var module=curParts()[0]||defaultModule();
  if(module==='fleet'){ if(!FLEET_LOADING){ NYX_USERS_ATTEMPTED=false; loadFleet(_fleetRemount); } toast('正在刷新全景看板'); return; }
  if(module==='status'){ loadStatus(function(){ var b=document.getElementById('status-root'); if(b) replaceViewHtml(b,statusBody()); }); toast('正在刷新系统状态'); return; }
  if(module==='schedules'){ loadSchedules(function(){ var b=document.getElementById('schedules-root'); if(b) replaceViewHtml(b,schedulesBody()); }); toast('正在刷新排班'); return; }
  if(module==='audit'){ loadAuditTrail(false); toast('正在刷新审计日志'); return; }
  if(module==='chat-activity'){ loadChatActivity(false); toast('正在刷新 Chat Activity'); return; }
  if(module==='skills'){ SKILL_STATE.loaded=false; SKILLS_LOADED=false; SKILL_SCHED_LOADED=false; render(); toast('正在刷新技能列表'); return; }
  if(module==='models'){
    var modelsState=modelsCatalogOwnerState(MODELS_STATE.owner);
    if(MODELS_STATE.editor){toast('请先保存或关闭模型来源编辑窗口');return;}
    if(modelsState.dirty&&!modelsState.pending){toast('有未保存修改，已跳过刷新');return;}
    loadModelsCatalog(MODELS_STATE.owner,{keepNotice:!!modelsState.pending});toast('正在刷新模型目录');return;
  }
  if(module==='agent-profiles'){
    if(AGENT_PROFILE_STATE.dirty||AGENT_PROFILE_STATE.createFlow){ toast('有未保存修改，已跳过刷新'); return; }
    if(!AGENT_PROFILE_STATE.loading){ loadAgentProfiles(); toast('正在刷新 Agent Profile'); }
    return;
  }
  var frame=document.querySelector('#frame-dock .suite-embed.active');
  if(frame){ try{ frame.contentWindow.location.reload(); }catch(e){ frame.src=frame.getAttribute('data-frame-source')||frame.src; } toast('正在重载嵌入页'); return; }
  toast('已刷新');
}

/* ---------- events (delegation) ---------- */
function bindEvents(){
  window.addEventListener('message',function(ev){
    if(ev.origin!==location.origin) return;
    var msg=ev.data||{};
    if(msg&&msg.source===SERVICE_ACCESS_REVIEW_MESSAGE_SOURCE&&msg.type==='service-access-review-result'){
      handleServiceAccessReviewPopupResult(ev,msg); return;
    }
    if(!msg || msg.source!=='aevatar-backend-console-suite') return;
    if(msg.type==='auth-refresh-request'){ handleEmbeddedAuthRefresh(ev,msg); return; }
    if(msg.type==='auth-required'){ showLoginGate(msg.reason||'登录已过期，请重新使用 NyxID 登录。',msg.rejectedAccessToken||''); return; }
    if(msg.type==='login-request'){ beginLogin(msg.resources,msg.tokenPurpose,msg.authFlow,msg.popupName,msg.authRequestId,ev.source); }
    if(msg.type==='service-access-review-finished'){
      clearServiceAccessReviewPkce(msg.authRequestId);
      if(SERVICE_ACCESS_REVIEW_POPUP&&SERVICE_ACCESS_REVIEW_POPUP.authRequestId===msg.authRequestId) SERVICE_ACCESS_REVIEW_POPUP=null;
    }
    if(msg.type==='observatory-route'){ syncObservatoryHash(msg.query||{}); }
    if(msg.type==='observatory-immersive'){ setAdminImmersive(msg.enabled); }
    if(msg.type==='navigate'&&['cqrs','audit'].indexOf(msg.module)>=0){ navigate([msg.module],msg.query||{}); }
  });
  document.addEventListener('click',function(ev){
    var t=ev.target;
    /* outside-click closes the source popover */
    if(_srcPopEl){ var inPop=t.closest('.src-pop'), onBtn=t.closest('[data-act="srcLegend"]'); if(!inPop&&!onBtn) closeSrcPop(); }
    /* breadcrumb */
    var cr=t.closest&&t.closest('[data-crumb]');
    if(cr){ var p=cr.getAttribute('data-crumb'); navigate(p?p.split('/'):[], {}); return; }

    /* 一级模块导航 */
    var navItem=t.closest&&t.closest('[data-module]');
    if(navItem){ var sh0=document.getElementById('console-shell'); if(sh0) sh0.classList.remove('rail-open'); navigate([navItem.getAttribute('data-module')],{}); return; }

    /* drawer */
    var act=t.closest&&t.closest('[data-act]');
    if(act){
      var a=act.getAttribute('data-act');
      if(a==='railToggle'){ var shT=document.getElementById('console-shell'); STATE.railCollapsed=!STATE.railCollapsed; if(shT) shT.classList.toggle('rail-collapsed',STATE.railCollapsed); return; }
      if(a==='railOpen'){ var shO=document.getElementById('console-shell'); if(shO) shO.classList.toggle('rail-open'); return; }
      if(a==='login'){ beginLogin(); return; }
      if(a==='logout'){ logout(); return; }
      if(a==='account'){ if(ACCOUNT){ toast('已登录 · '+ACCOUNT.name+(ACCOUNT.email?' · '+ACCOUNT.email:'')+(ACCOUNT.scope?' · '+ACCOUNT.scope:'')+'（NyxID 单点登录）'); } else { beginLogin(); } return; }
      if(a==='globalSearch'){ return; }
      if(a==='drawer-close'){ closeDrawer(); return; }
      if(a==='drawer-emp'){ closeDrawer(); navigate(['fleet','c',act.getAttribute('data-co'),'e',act.getAttribute('data-emp')],{}); return; }
      if(a==='chatActivityCopy'){ copyWithToast(act.getAttribute('data-copy'),'已复制完整 ID'); return; }
      if(a==='refresh'){
        act.querySelector('svg')&&act.classList.add('spin-once');
        document.querySelectorAll('[data-stamp]').forEach(function(s){s.textContent=nowStamp();});
        refreshActiveModule();
        return;
      }
      if(a==='l0sort'){ var order=['health','cost','active']; var ni=(order.indexOf(STATE.l0Sort)+1)%3; setQuery({sort:order[ni]}); return; }
      if(a==='l1seg'){ var seg=t.closest('[data-seg]'); if(seg) setQuery({view:seg.getAttribute('data-seg')}); return; }
      if(a==='l2mode'){ var md=t.closest('[data-mode]'); if(md) setQuery({mode:md.getAttribute('data-mode')}); return; }
      if(a==='l0range'){ var rg=t.closest('[data-range]'); if(rg) setQuery({range:rg.getAttribute('data-range')}); return; }
      if(a==='l1status'){ var stb=t.closest('[data-status]'); if(stb){ var sv=stb.getAttribute('data-status'); setQuery({status:sv==='all'?null:sv}); } return; }
      if(a==='deptToggle'){ var dp=act.getAttribute('data-dept'); var key=curParts()[2]+'/'+dp; STATE.collapsed[key]=!STATE.collapsed[key]; render(); return; }
      if(a==='previewClick'){ toast('该图层尚无统一事实源，即将上线'); return; }
      if(a==='srcLegend'){ toggleSrcPop(); return; }
      if(a==='srcLegendClose'){ closeSrcPop(); return; }
      if(a==='retry'){ toast('已触发重试（示例）'); return; }
      if(a==='openObs'){ toast('打开既有 Run Observatory（示例）'); return; }
      if(a==='back-l2'){ var pp=curParts(); navigate(['fleet','c',pp[2],'e',pp[4]],{}); return; }
    }

    /* L0 filter chips */
    var chip=t.closest&&t.closest('[data-chip]');
    if(chip){ var cv=chip.getAttribute('data-chip'); setQuery({filter:STATE.l0Filter===cv?null:cv}); return; }
    /* L1 status chips (when not wrapped by data-act path above) */
    var stchip=t.closest&&t.closest('[data-status]');
    if(stchip && stchip.closest('[data-act="l1status"]')){ /* handled above */ }

    /* navigation: run > emp > company（顺序很重要） */
    var runEl=t.closest&&t.closest('[data-run][data-scope]');
    if(runEl){ var rid=runEl.getAttribute('data-run'); var runScope=runEl.getAttribute('data-scope');
      if(rid) obsNavigate({run:rid,scope:runScope||'mine'});
      return; }
    var empEl=t.closest&&t.closest('[data-emp][data-co]');
    if(empEl){ navigate(['fleet','c',empEl.getAttribute('data-co'),'e',empEl.getAttribute('data-emp')],{}); return; }
    var coEl=t.closest&&t.closest('[data-co]');
    if(coEl && !coEl.hasAttribute('data-emp')){ navigate(['fleet','c',coEl.getAttribute('data-co')],{}); return; }
  });

  /* roster search (in-memory, focus-preserving) */
  document.addEventListener('input',function(ev){
    var t=ev.target;
    if(t.getAttribute&&t.getAttribute('data-act')==='l1search'){ STATE.search=t.value; _focusSearch=true; render(); }
  });

  /* Esc 关闭浮层；/ 聚焦全局搜索；全局搜索回车路由：run 形态 id → 观测台深链，其余 → 技能搜索。 */
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){
      if(_drawerCtx){ closeDrawer(); return; }
      if(_srcPopEl){ closeSrcPop(); return; }
      var focused=document.activeElement;
      if(focused&&focused.getAttribute&&focused.getAttribute('data-act')==='globalSearch') focused.blur();
      return;
    }
    if(ev.key==='/'&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
      var t=ev.target,tag=(t&&t.tagName||'').toLowerCase();
      if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
      var input=document.querySelector('[data-act="globalSearch"]');
      if(input){ ev.preventDefault(); input.focus(); input.select(); }
      return;
    }
    if(ev.key==='Enter'){
      var el=ev.target;
      if(!el||!el.getAttribute||el.getAttribute('data-act')!=='globalSearch') return;
      var q=(el.value||'').trim(); if(!q) return;
      ev.preventDefault(); el.blur();
      if(/^[0-9a-fA-F][0-9a-fA-F-]{7,}$/.test(q)){ obsNavigate({run:q}); toast('已在观测台定位 run '+(q.length>14?q.slice(0,12)+'…':q)); }
      else { SKILL_STATE.search=q; SKILL_STATE.mobileDetail=false;
        if((curParts()[0]||'')==='skills') render(); else navigate(['skills'],{}); }
    }
  });

  window.addEventListener('hashchange',function(){ if((curParts()[0]||'')!=='models')modelsCatalogLeavePage(); if(_drawerCtx) closeDrawer(); if(_srcPopEl) closeSrcPop(); setAdminImmersive(false); render(); });
}

/* ---------- live stamp tick (simulated AGUI SSE heartbeat) ---------- */
/* 与 schedules/status 轮询同一套跳拍约定：页签不可见时不查询也不写 DOM，回到前台下一拍（≤1s）自然追平。
   同秒重复触发直接跳过，避免把相同文本写回 [data-stamp] 触发多余的样式/布局失效。 */
function startClock(){
  var lastStamp='';
  setInterval(function(){
    if(document.hidden) return;
    var stamp=nowStamp(); if(stamp===lastStamp) return; lastStamp=stamp;
    var nodes=document.querySelectorAll('[data-stamp]');
    for(var i=0;i<nodes.length;i++) nodes[i].textContent=stamp;
  },1000);
}

/* ---------- login gate（未登录全屏） ---------- */
function renderLoginGate(reason){
  var app=document.getElementById('app'); if(!app) return;
  app.setAttribute('aria-busy','false');
  app.innerHTML=
    '<div style="height:100vh;display:grid;place-items:center;padding:24px">'+
      '<div class="empty" style="max-width:400px">'+
        '<div class="app-mark" style="justify-content:center;gap:9px"><span class="glyph" style="width:30px;height:30px;border-radius:7px">A</span>'+
          '<span class="name" style="font-size:15px">Aevatar Backend Console</span></div>'+
        '<div class="et" style="margin-top:10px">后端运维控制台</div>'+
        '<div class="es">使用 NyxID 账号登录，访问运行观测台、技能调用、投影管道、通道接入等后端运维模块。</div>'+
        (reason?'<div class="auth-banner" style="justify-content:center;margin-top:12px">'+esc(reason)+'</div>':'')+
        '<button class="btn btn-primary" data-act="login" style="margin-top:10px">使用 NyxID 登录</button>'+
      '</div>'+
    '</div>';
}
/* /api/workflow/observatory/me 是套件共享身份探针：充实 admin/scope（失败则保留 token claims，admin=false）。 */
async function refreshAccount(expectedAccessToken){
  try{ var me=await adminJson('/api/workflow/observatory/me');
    var currentToken=getToken();if(expectedAccessToken&&(!currentToken||currentToken.access_token!==expectedAccessToken))return false;
    if(me && !me.forbidden){ ACCOUNT=ACCOUNT||{};
      if(me.name) ACCOUNT.name=me.name; if(me.email) ACCOUNT.email=me.email;
      var sc=me.scope||me.scopeId||me.tenant; if(sc) ACCOUNT.scope=sc;
      ACCOUNT.admin=!!(me.isAdmin||me.admin||me.platformAdmin||me.isPlatformAdmin); }
  }catch(e){ /* /me 不可用：保留 token claims */ }
  var activeToken=getToken();return !expectedAccessToken||!!(activeToken&&activeToken.access_token===expectedAccessToken);
}
function syncAccountFromStoredToken(token){
  var previous=ACCOUNT,next=accountFromToken(token),previousSubject=modelsCatalogAccountSubject(previous),nextSubject=modelsCatalogAccountSubject(next);
  if(previous&&next&&previousSubject&&previousSubject===nextSubject){if(!next.scope)next.scope=previous.scope;next.admin=!!previous.admin;}
  ACCOUNT=next;modelsCatalogSyncAuthority();render();renderAcctW();
  var expectedAccessToken=token&&token.access_token;
  refreshAccount(expectedAccessToken).then(function(applied){
    if(applied===false||!ACCOUNT)return;
    modelsCatalogSyncAuthority();render();renderAcctW();
  });
}
/* ---------- boot ---------- */
/* 右上角常驻登录态:渲染到 body(在 #app 之外)→切页 render() 不刷新它,固定右上角 */
function renderAcctW(){
  var el=document.getElementById('acctw');
  if(!ACCOUNT){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='acctw'; document.body.appendChild(el); }
  var nm=ACCOUNT.name||'NyxID 用户', sub=ACCOUNT.email||ACCOUNT.scope||'';
  el.innerHTML='<button class="acctw-chip" data-act="account" title="点击查看登录信息"><span class="acctw-av">'+esc((nm||'?').slice(0,1))+'</span>'+
    '<span class="acctw-meta"><b>'+esc(nm)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</span></button>'+
    '<button class="acctw-out" data-act="logout" title="登出 NyxID" aria-label="登出">⎋</button>';
}
(function boot(){
  bindEvents(); startClock();
  var bootToken=getToken();if(!bootToken){ renderLoginGate(); return; }
  scheduleTokenRefresh(bootToken);
  ACCOUNT=accountFromToken(bootToken);
  render(); renderAcctW();
  refreshAccount(bootToken.access_token).then(function(applied){ if(applied!==false&&ACCOUNT){modelsCatalogSyncAuthority();render();} renderAcctW(); });
})();
window.addEventListener('storage',function(ev){ if(ev.key!==TOKEN_KEY) return; var token=getToken();
  if(token){scheduleTokenRefresh(token);syncAccountFromStoredToken(token);}else if(ACCOUNT) showLoginGate('NyxID 登录已在其他页面结束。'); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&getToken())
  refreshAccessToken(false).catch(function(){ scheduleTokenRefreshRetry(); }); });
window.addEventListener('pagehide',function(){ captureAdminViewState(_renderedRouteKey||adminRouteKey(location.hash)); });

</script>
