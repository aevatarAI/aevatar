<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 公司全景看板 · aevatar 控制台</title>
  <style data-od-inline-asset="css/app.css">
/* =========================================================================
   Aevatar Backend Console — Ops Workbench 设计系统（app 层）
   深色导航轨 + 浅色工作区的工作台语言；状态语义色保持不变。
   ========================================================================= */
:root{
  /* ---- palette: light workbench ---- */
  --bg:#eceff4;
  --surface:#ffffff;
  --surface-2:#f7f9fc;
  --surface-3:#eef1f7;
  --fg:#26314b;          /* 正文 */
  --heading:#0e1526;     /* 标题 */
  --muted:#4d5a75;       /* 次要 */
  --subtle:#66738e;
  --faint:#95a1b8;
  --border:#e2e7f0;
  --border-strong:#c9d2e2;
  --primary:#2f5cf6;     /* 主操作色 / info */
  --primary-strong:#1e44d8;
  --primary-weak:#edf2ff;
  --primary-line:#c7d6ff;
  --grad-brand:linear-gradient(135deg,#4d7cff 0%,#6a5cff 100%);
  --grad-primary:linear-gradient(135deg,#3f6dff 0%,#2c4fe6 100%);

  /* ---- status semantic (run domain tone) ---- */
  --success:#12a15c;  --success-bg:#e7f9f0;  --success-bd:#b4e8cd;
  --running:#2f5cf6;  --running-bg:#edf2ff;  --running-bd:#c7d6ff;  /* 忙/运行中=蓝 */
  --waiting:#d9870d;  --waiting-bg:#fdf3e0;  --waiting-bd:#f4d9a4;  /* 卡/等待=琥珀 */
  --failed:#e0434b;   --failed-bg:#fdecec;   --failed-bd:#f5c3c6;   /* 失败/停止=红 */
  --idle:#94a1b8;     --idle-bg:#edf0f6;     --idle-bd:#dde4ee;     /* 闲=灰 */

  /* ---- dark rail (ops workbench sidebar) ---- */
  --rail-bg-1:#111b33;
  --rail-bg-2:#0a1122;
  --rail-fg:#93a3c2;
  --rail-faint:#5e6f92;
  --rail-heading:#eef2fb;
  --rail-border:rgba(148,166,205,.14);
  --rail-hover:rgba(148,166,205,.10);
  --rail-active:linear-gradient(90deg,rgba(88,128,255,.24),rgba(106,92,255,.12));

  /* ---- metrics ---- */
  --header-h:58px;
  --pad:22px;
  --gap:16px;
  --r-card:12px;         /* 卡片 */
  --r-panel:12px;        /* 嵌入面板 */
  --inspector-w:720px;
  --shadow-card:0 1px 2px rgba(14,21,38,.04),0 2px 6px rgba(14,21,38,.03);
  --shadow-hover:0 14px 34px -10px rgba(14,21,38,.18);
  --shadow-drawer:-18px 0 48px rgba(14,21,38,.20);

  --sans:'Alibaba PuHuiTi 2.0','Alibaba PuHuiTi','AlibabaSans','PingFang SC',
         -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Roboto Mono',Menlo,monospace;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font:14px/1.5 var(--sans);
  color:var(--fg);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px;}
::selection{background:rgba(63,109,255,.18);}

/* slim scrollbars for panes */
.view-scroll::-webkit-scrollbar,.rail-nav::-webkit-scrollbar,.drawer-body::-webkit-scrollbar,
.tp-detail::-webkit-scrollbar,.ap-list-pane::-webkit-scrollbar,.ap-workspace::-webkit-scrollbar,
.chat-scroll::-webkit-scrollbar,.studio-aside::-webkit-scrollbar,#skill-list::-webkit-scrollbar{width:8px;height:8px;}
.view-scroll::-webkit-scrollbar-thumb,.rail-nav::-webkit-scrollbar-thumb,.drawer-body::-webkit-scrollbar-thumb,
.tp-detail::-webkit-scrollbar-thumb,.ap-list-pane::-webkit-scrollbar-thumb,.ap-workspace::-webkit-scrollbar-thumb,
.chat-scroll::-webkit-scrollbar-thumb,.studio-aside::-webkit-scrollbar-thumb,#skill-list::-webkit-scrollbar-thumb{
  background:rgba(101,115,142,.28);border-radius:8px;border:2px solid transparent;background-clip:content-box;}
.rail-nav::-webkit-scrollbar-thumb{background:rgba(148,166,205,.30);border:2px solid transparent;background-clip:content-box;}

/* ============================ Page shell ============================ */
.page-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

.app-header{
  height:var(--header-h);flex:0 0 var(--header-h);
  display:flex;align-items:center;gap:14px;
  padding:0 var(--pad);background:rgba(255,255,255,.92);
  /* 不加 backdrop-filter：底色已 92% 不透明，模糊只作用于剩下 8%，肉眼不可辨；
     而常驻表头一旦成为 backdrop root，其后内容每次滚动/重绘都要重新取样+模糊。 */
  border-bottom:1px solid var(--border);z-index:30;
}
.app-mark{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.app-mark .glyph{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:var(--grad-brand);
  box-shadow:0 3px 10px rgba(77,100,255,.38),inset 0 1px 0 rgba(255,255,255,.25);
  display:grid;place-items:center;color:#fff;font-weight:600;font-size:13.5px;
}
.app-mark .name{font-weight:600;color:var(--heading);font-size:14px;white-space:nowrap;letter-spacing:-.01em;}

/* breadcrumb */
.crumb{display:flex;align-items:center;gap:2px;min-width:0;flex:1 1 auto;overflow:hidden;}
.crumb-sep{color:var(--border-strong);font-size:13px;padding:0 2px;flex:0 0 auto;}
.crumb-item{
  background:none;border:0;padding:5px 9px;border-radius:6px;font-size:13px;
  color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.14s;
}
.crumb-item:hover{background:var(--surface-3);color:var(--heading);}
.crumb-item.cur{color:var(--heading);font-weight:600;pointer-events:none;}
.crumb-item.cur:hover{background:none;}

.header-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.live-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--success);
  background:var(--success-bg);border:1px solid var(--success-bd);
  padding:3px 9px;border-radius:999px;font-weight:600;letter-spacing:.02em;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);
  box-shadow:0 0 0 0 rgba(18,161,92,.5);animation:livePulse 1.8s ease-out infinite;}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(18,161,92,.45)}70%{box-shadow:0 0 0 6px rgba(18,161,92,0)}100%{box-shadow:0 0 0 0 rgba(18,161,92,0)}}
.stamp{font-size:12px;color:var(--faint);}
.stamp .num{font-size:12px;color:var(--subtle);}

/* generic icon button */
.ibtn{
  height:30px;min-width:30px;padding:0 9px;border:1px solid var(--border);
  background:var(--surface);border-radius:8px;color:var(--muted);font-size:13px;
  display:inline-flex;align-items:center;gap:6px;transition:.14s;white-space:nowrap;
}
.ibtn:hover{border-color:var(--border-strong);color:var(--heading);background:var(--surface-2);}
.ibtn svg{width:15px;height:15px;}
.spin-once svg{animation:spinOnce .6s ease;}
@keyframes spinOnce{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* search field */
.search{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;
  background:var(--surface-3);border:1px solid transparent;border-radius:8px;width:220px;transition:.15s;
}
.search:focus-within{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-weak);}
.search svg{width:15px;height:15px;color:var(--faint);flex:0 0 auto;}
.search input{border:0;outline:0;background:none;font:13px var(--sans);color:var(--fg);width:100%;}

/* ============================ View region ============================ */
.view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
#view-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
#frame-dock{flex:1 1 auto;height:100%;min-height:0;display:none;flex-direction:column;overflow:hidden;}
#frame-dock .suite-embed{display:none;}
#frame-dock .suite-embed.active{display:block;}
.suite-embed{flex:1 1 auto;width:100%;height:100%;min-height:0;border:0;display:block;background:var(--surface);}
#net-progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:400;pointer-events:none;opacity:0;transition:opacity .2s;overflow:hidden;}
#net-progress.on{opacity:1;}
#net-progress i{display:block;height:100%;width:38%;background:var(--grad-primary);border-radius:2px;animation:netprog 1.1s ease-in-out infinite;}
@keyframes netprog{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
body.observatory-immersive .rail,
body.observatory-immersive .app-header,
body.observatory-immersive #acctw{display:none!important;}
body.observatory-immersive .console,
body.observatory-immersive .main,
body.observatory-immersive .view{height:100vh;}
.view-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:var(--pad);}

/* module sub-header：标题行 + 描述行的双层信息结构 */
.sub-header{
  flex:0 0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:15px var(--pad);background:var(--surface);border-bottom:1px solid var(--border);
}
.sub-head-main{display:flex;flex-direction:column;gap:2px;min-width:0;}
.sub-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sub-title{font-size:16.5px;font-weight:650;color:var(--heading);letter-spacing:-.015em;}
.sub-desc{font-size:12px;color:var(--faint);line-height:1.45;}
.sub-kpis{display:flex;align-items:center;gap:20px;}
.sub-kpi{display:flex;flex-direction:column;line-height:1.25;}
.sub-kpi .k{font-size:10.5px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;}
.sub-kpi .v{font-size:15.5px;font-weight:650;color:var(--heading);}
.sub-spacer{flex:1 1 auto;}

/* segmented (组织花名册 | 数据流) */
.segmented{display:inline-flex;background:var(--surface-3);border:1px solid var(--border);
  border-radius:9px;padding:3px;gap:2px;}
.segmented button{
  border:0;background:none;padding:5px 14px;border-radius:7px;font-size:13px;
  color:var(--muted);font-weight:500;transition:.14s;
}
.segmented button.on{background:var(--surface);color:var(--heading);font-weight:600;box-shadow:var(--shadow-card);}

/* ============================ Toolbar / filters ============================ */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.toolbar .grow{flex:1 1 auto;}
.chip-row{display:inline-flex;gap:6px;flex-wrap:wrap;}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap;}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;
  border:1px solid var(--border);background:var(--surface);border-radius:999px;
  font-size:12.5px;color:var(--muted);transition:.14s;white-space:nowrap;
}
.chip:hover{border-color:var(--border-strong);color:var(--heading);box-shadow:var(--shadow-card);}
.chip.on{background:var(--heading);border-color:var(--heading);color:#fff;}
.chip .dot{width:7px;height:7px;border-radius:50%;}
.chip .cnt{font-family:var(--mono);font-size:11px;opacity:.7;}
.seg-toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);}
.seg-toggle button{border:0;background:none;padding:5px 11px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--border);}
.seg-toggle button:last-child{border-right:0;}
.seg-toggle button.on{background:var(--primary-weak);color:var(--primary-strong);font-weight:600;}

.sortbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:12.5px;color:var(--muted);transition:.14s;}
.sortbtn:hover{border-color:var(--border-strong);color:var(--heading);}
.sortbtn .lbl{color:var(--faint);}
.sortbtn .val{color:var(--heading);font-weight:600;}

/* ============================ MetricCard (KPI bar) ============================ */
.kpi-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);margin-bottom:18px;}
.metric-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  padding:15px 17px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad-brand);opacity:0;transition:opacity .18s;}
.metric-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--border-strong);}
.metric-card:hover::before{opacity:1;}
.metric-card .mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.metric-card .mc-label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.metric-card .mc-ico{width:26px;height:26px;border-radius:7px;background:var(--primary-weak);color:var(--primary);
  display:inline-grid;place-items:center;flex:0 0 auto;}
.metric-card .mc-ico svg{width:14px;height:14px;}
.metric-card .mc-val{font-size:27px;font-weight:650;color:var(--heading);letter-spacing:-.02em;
  font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1;}
.metric-card .mc-val.danger{color:var(--failed);}
.metric-card .mc-val.running{color:var(--running);}
.metric-card .mc-sub{font-size:12px;color:var(--faint);margin-top:8px;display:flex;align-items:center;gap:6px;}
.metric-card .mc-trend{font-size:12px;font-weight:600;}
.mc-up{color:var(--failed);}.mc-down{color:var(--success);}.mc-flat{color:var(--faint);}

/* source badge (现成 / ~近似 / 预览) */
.src{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;vertical-align:middle;white-space:nowrap;}
.src-ready{background:#edf1f7;color:#5b6573;}
.src-approx{background:var(--running-bg);color:var(--primary-strong);}
.src-preview{background:#f3eefe;color:#7a4fcf;}
.approx-mark{color:var(--waiting);font-family:var(--mono);font-weight:600;}

/* ===== 数据来源三档：approx 数值 / preview widget / tooltip / 图例 ===== */
.approx{display:inline-flex;align-items:center;gap:3px;line-height:1;cursor:help;}
.approx .ax-tilde{font-size:.7em;opacity:.75;font-family:var(--mono);color:var(--waiting);align-self:flex-start;margin-top:.1em;}
.approx .aval{display:inline-flex;align-items:baseline;color:inherit;}
.ax-dot{width:6px;height:6px;border-radius:50%;background:var(--waiting);display:inline-block;flex:0 0 auto;
  box-shadow:0 0 0 2px var(--waiting-bg);cursor:help;}
.metric-card .approx{align-items:center;}
.emp-meta .approx{gap:5px;color:var(--muted);}

/* tooltip（approx 点 / preview pill / 状态点 通用） */
[data-tip]{position:relative;}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);
  transform:translateX(-50%);background:var(--heading);color:#fff;font:500 11px/1.4 var(--sans);letter-spacing:0;
  padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:80;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2);}
[data-tip]:hover::before,[data-tip]:focus-visible::before{content:'';position:absolute;left:50%;bottom:calc(100% + 3px);
  transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--heading);z-index:80;pointer-events:none;}

/* 顶栏内的 tooltip 改为向下，避免顶部裁切 */
.app-header [data-tip]:hover::after,.app-header [data-tip]:focus-visible::after{bottom:auto;top:calc(100% + 8px);}
.app-header [data-tip]:hover::before,.app-header [data-tip]:focus-visible::before{bottom:auto;top:calc(100% + 3px);border-top-color:transparent;border-bottom-color:var(--heading);}

/* 状态 icon（颜色之外的形状区分，a11y） */
.tg{font-size:10px;line-height:1;display:inline-grid;place-items:center;min-width:11px;opacity:.95;}
.status-light .tg{font-size:10px;min-width:10px;}

/* 预览 widget：半透明 + 紫色 pill；点击只提示 */
.is-preview{position:relative;opacity:.5;filter:saturate(.5);}
.is-preview:hover{opacity:.64;}
.preview-pill{display:inline-flex;align-items:center;height:16px;padding:0 7px;border-radius:999px;
  background:#f1ebfd;color:#7a4fcf;font-size:10.5px;font-weight:600;border:1px solid #e3d6fb;letter-spacing:.02em;cursor:help;}
.chip.is-preview{filter:none;opacity:.6;gap:7px;}
.chip.is-preview .preview-pill{height:15px;}

/* 三档图例 */
.src-legend-bar{margin-top:20px;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-panel);box-shadow:var(--shadow-card);}
.src-legend{display:grid;grid-template-columns:repeat(2,minmax(230px,1fr));gap:11px 28px;}
.sl-row{display:flex;align-items:center;gap:13px;}
.sl-rt{grid-column:1 / -1;border-top:1px dashed var(--border);padding-top:11px;margin-top:1px;}
.sl-demo{min-width:58px;display:inline-flex;justify-content:flex-start;align-items:center;}
.sl-txt{display:flex;flex-direction:column;line-height:1.35;}
.sl-txt b{font-size:12.5px;color:var(--heading);}
.sl-txt span{font-size:11.5px;color:var(--faint);}

/* L0 注意力提示 — 老板视角核心钩子，要醒目 */
.co-alert{font-size:12.5px;}
.co-alert-warn{background:var(--waiting-bg);border-color:var(--waiting-bd);color:#9a5b07;}
.co-alert-danger{background:var(--failed-bg);border-color:var(--failed-bd);color:var(--failed);}
.co-alert .ca-ico{display:inline-flex;flex:0 0 auto;}
.co-alert .ca-ico svg{width:16px;height:16px;}
.co-alert .ca-txt{flex:1 1 auto;line-height:1.35;}
.co-alert .ca-txt b{color:inherit;font-weight:600;}
.co-alert .ca-min{font-size:16px;font-weight:700;padding:0 2px;font-variant-numeric:tabular-nums;}
.co-alert .live-dot{flex:0 0 auto;}

/* header 数据来源 popover */
.src-pop{position:fixed;top:56px;right:16px;width:360px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-panel);box-shadow:var(--shadow-hover);z-index:75;padding:15px 18px;animation:toastIn .16s ease;}
.src-pop h4{font-size:13px;color:var(--heading);margin-bottom:13px;font-weight:650;display:flex;align-items:center;justify-content:space-between;}
.src-pop .src-legend{grid-template-columns:1fr;}
.src-pop-close{border:0;background:none;color:var(--faint);font-size:15px;cursor:pointer;}

/* ============================ Company card wall (L0) ============================ */
.card-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:var(--gap);}
.co-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  padding:17px;box-shadow:var(--shadow-card);cursor:pointer;position:relative;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:13px;overflow:hidden;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.co-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad-brand);
  opacity:0;transition:opacity .18s;}
.co-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--border-strong);}
.co-card:hover::before{opacity:1;}
.co-card:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.co-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.co-name{font-size:15.5px;font-weight:650;color:var(--heading);display:flex;align-items:center;gap:8px;letter-spacing:-.01em;}
.health-light{width:9px;height:9px;border-radius:50%;flex:0 0 auto;position:relative;}
.health-green{background:var(--success);box-shadow:0 0 0 3px var(--success-bg);}
.health-amber{background:var(--waiting);box-shadow:0 0 0 3px var(--waiting-bg);}
.health-red{background:var(--failed);box-shadow:0 0 0 3px var(--failed-bg);}
.health-grey{background:var(--idle);box-shadow:0 0 0 3px var(--idle-bg);}
.co-health-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;}
.co-active{display:flex;align-items:baseline;gap:8px;}
.co-active .big{font-size:30px;font-weight:650;color:var(--heading);font-family:var(--mono);line-height:1;letter-spacing:-.02em;}
.co-active .big.zero{color:var(--faint);}
.co-active .unit{font-size:12px;color:var(--muted);}
.co-cost{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.co-cost .cc-l{font-size:12.5px;color:var(--muted);}
.co-cost .cc-v{font-family:var(--mono);font-size:13px;color:var(--heading);font-weight:600;}
.sparkline{height:26px;width:88px;}
/* mini stacked bar 忙/闲/失败 */
.stack{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--idle-bg);}
.stack i{display:block;height:100%;}

.rail-head{height:var(--header-h);flex:0 0 var(--header-h);display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-bottom:1px solid var(--rail-border);}
.rail-head .app-mark{display:flex;align-items:center;gap:10px;min-width:0;}
.rail-head .app-mark .glyph{width:30px;height:30px;border-radius:9px;background:var(--grad-brand);
  box-shadow:0 4px 12px rgba(77,100,255,.45),inset 0 1px 0 rgba(255,255,255,.25);
  display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;}
.rail-head .app-mark .name{font-weight:600;color:var(--rail-heading);font-size:13.5px;white-space:nowrap;
  display:flex;flex-direction:column;line-height:1.15;letter-spacing:-.01em;}
.rail-head .app-mark .name .name-sub{font-size:9.5px;font-weight:600;color:var(--rail-faint);
  letter-spacing:.14em;text-transform:uppercase;margin-top:2px;}
.rail-collapse{width:26px;height:26px;border:1px solid var(--rail-border);background:rgba(148,166,205,.06);border-radius:7px;
  color:var(--rail-faint);font-size:13px;display:grid;place-items:center;flex:0 0 auto;transition:.14s;}
.rail-collapse:hover{color:var(--rail-heading);background:var(--rail-hover);}
.rail-nav{flex:1 1 auto;overflow:auto;padding:14px 10px 10px;}
.rail-group{margin-bottom:16px;}
.rail-group-label{font-size:10.5px;color:var(--rail-faint);font-weight:650;letter-spacing:.12em;
  text-transform:uppercase;padding:0 10px 7px;}
.rail-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;
  color:var(--rail-fg);font-size:13.5px;text-align:left;transition:.13s;position:relative;margin-bottom:2px;}
.rail-item:hover{background:var(--rail-hover);color:var(--rail-heading);}
.rail-item.on{background:var(--rail-active);color:#fff;font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(122,152,255,.28);}
.rail-item.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;
  background:var(--grad-brand);box-shadow:0 0 10px rgba(88,128,255,.65);}
.rail-item.on .rail-ico{color:#aec4ff;}
.rail-ico{width:18px;height:18px;flex:0 0 auto;color:var(--rail-faint);display:inline-grid;place-items:center;transition:.13s;}
.rail-item:hover .rail-ico{color:var(--rail-fg);}
.rail-ico svg{width:18px;height:18px;}
.rail-name{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail-tag{font-size:9px;font-weight:700;color:#ffb3b8;background:rgba(224,67,75,.16);border:1px solid rgba(224,67,75,.34);
  border-radius:4px;padding:0 4px;letter-spacing:.05em;}
.rail-foot{flex:0 0 auto;border-top:1px solid var(--rail-border);padding:10px;}
/* 账号收纳进侧栏底栏：右上角不再保留浮动 #acctw */
#acctw{display:none!important;}
.acctw-chip{display:flex;align-items:center;gap:8px;height:38px;padding:4px 12px 4px 5px;border:1px solid var(--border);background:var(--surface);border-radius:999px;box-shadow:var(--shadow-card);cursor:pointer;}
.acctw-chip:hover{background:var(--surface-3);}
.acctw-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;background:var(--grad-brand);flex:0 0 auto;}
.acctw-meta{display:flex;flex-direction:column;line-height:1.2;min-width:0;text-align:left;}
.acctw-meta b{font-size:12px;color:var(--heading);font-weight:600;}
.acctw-meta span{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.acctw-out{width:30px;height:30px;border:1px solid var(--border);background:var(--surface);border-radius:8px;color:var(--faint);cursor:pointer;}
.acctw-out:hover{color:var(--heading);background:var(--surface-3);}
.account-chip{width:100%;display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid var(--rail-border);
  background:rgba(148,166,205,.07);border-radius:9px;text-align:left;transition:.14s;}
.account-chip:hover{background:var(--rail-hover);}
.acc-av{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;
  background:var(--grad-brand);box-shadow:0 2px 8px rgba(77,100,255,.35);}
.acc-meta{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1 1 auto;}
.acc-meta b{font-size:12.5px;color:var(--rail-heading);font-weight:600;}
.acc-meta span{font-size:11px;color:var(--rail-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acc-role{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:4px;
  color:#9db4ea;background:rgba(88,128,255,.14);border:1px solid rgba(122,152,255,.30);}
.rail-foot .rail-collapse{width:30px;height:30px;}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.hamburger{display:none;width:30px;height:30px;border:1px solid var(--border);background:var(--surface);border-radius:8px;
  color:var(--muted);font-size:16px;}
.app-header .search{width:220px;}

/* collapsed rail (icon only) */
.console.rail-collapsed .rail{width:64px;flex-basis:64px;}
.console.rail-collapsed .rail-name,
.console.rail-collapsed .rail-group-label,
.console.rail-collapsed .rail-tag,
.console.rail-collapsed .app-mark .name,
.console.rail-collapsed .acc-meta,
.console.rail-collapsed .acc-role{display:none;}
.console.rail-collapsed .rail-item{justify-content:center;padding:9px 0;}
.console.rail-collapsed .rail-item.on::before{left:-10px;}
.console.rail-collapsed .account-chip{justify-content:center;padding:7px 0;}
.console.rail-collapsed .rail-collapse{transform:rotate(180deg);}
.console.rail-collapsed .rail-item:hover::after{content:attr(data-tip-r);position:absolute;left:calc(100% + 10px);top:50%;
  transform:translateY(-50%);background:var(--heading);color:#fff;font-size:11.5px;padding:4px 9px;border-radius:6px;white-space:nowrap;z-index:80;}

/* auth badge */
.auth-badge{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;}
.auth-badge.admin{color:var(--failed);background:var(--failed-bg);border:1px solid var(--failed-bd);}
.auth-badge.public{color:var(--success);background:var(--success-bg);border:1px solid var(--success-bd);}

/* ---------------- ② Status ---------------- */
.status-hero{display:flex;align-items:center;gap:16px;padding:19px 20px;border-radius:var(--r-panel);margin-bottom:18px;
  border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-card);}
.status-hero .sh-dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;}
.status-hero.status-healthy .sh-dot{background:var(--success);box-shadow:0 0 0 5px var(--success-bg);}
.status-hero.status-degraded .sh-dot{background:var(--waiting);box-shadow:0 0 0 5px var(--waiting-bg);}
.status-hero.status-critical .sh-dot{background:var(--failed);box-shadow:0 0 0 5px var(--failed-bg);}
.sh-main{flex:1 1 auto;}
.sh-title{font-size:17px;font-weight:650;color:var(--heading);letter-spacing:-.01em;}
.sh-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.sh-sub code{font-family:var(--mono);background:var(--surface-3);padding:1px 5px;border-radius:4px;}
.status-counts{display:flex;gap:10px;flex:0 0 auto;}
.status-count{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:9px 13px;border-radius:8px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.4);}
.sc-n{font-size:22px;font-weight:650;line-height:1;font-family:var(--mono);}
.sc-l{font-size:11px;color:var(--muted);margin-top:3px;}
/* hero 整条按总体状态着色 + icon（不只靠色） */
.status-hero.status-healthy{border-color:var(--success-bd);background:linear-gradient(135deg,#eefbf4,#f4fcf8);}
.status-hero.status-degraded{border-color:var(--waiting-bd);background:linear-gradient(135deg,#fdf4e2,#fef9ef);}
.status-hero.status-critical{border-color:var(--failed-bd);background:linear-gradient(135deg,#fdeeee,#fef4f4);}
.sh-title{display:flex;align-items:center;gap:9px;}
.sh-ico{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:0 0 auto;}
.status-healthy .sh-ico{background:var(--success);}
.status-degraded .sh-ico{background:var(--waiting);}
.status-critical .sh-ico{background:var(--failed);}

/* 工具条 */
.st-toolbar{align-items:center;}
.auto-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.auto-toggle input{accent-color:var(--primary);}

/* 分组（可折叠） */
.st-groups{display:flex;flex-direction:column;gap:14px;}
.st-group{border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-card);}
.st-group-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface-2);padding:12px 14px;text-align:left;}
.st-group-h:hover{background:var(--surface-3);}
.st-group .caret{color:var(--faint);font-size:11px;width:12px;flex:0 0 auto;}
.st-group-name{font-size:13px;font-weight:650;color:var(--heading);}
.st-group-meta{font-size:11.5px;color:var(--faint);margin-left:auto;}
.st-group .protable-wrap{border:0;border-radius:0;border-top:1px solid var(--border);box-shadow:none;}
.st-empty{padding:18px;text-align:center;font-size:12.5px;color:var(--faint);border-top:1px solid var(--border);}
.st-table td{vertical-align:middle;}
.st-name{color:var(--heading);font-weight:600;}
.st-faint{color:var(--faint);}
.st-row.bad{cursor:pointer;}
.st-row.bad:hover{background:var(--surface-3);}
.st-row.bad:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;}
.st-err-toggle{font-size:12px;color:var(--primary-strong);}
.st-detail td{padding:0 14px 10px !important;}
.st-detail-box{font-family:var(--mono);font-size:12px;color:var(--failed);background:var(--failed-bg);border:1px solid var(--failed-bd);border-radius:8px;padding:9px 11px;line-height:1.5;}
@media (max-width:768px){
  .status-hero{flex-direction:column;align-items:stretch;}
  .status-counts{justify-content:space-between;}
  .status-count{flex:1 1 0;}
}

/* ---------------- ④ CQRS ---------------- */
.cqrs-pipe{width:100%;height:150px;}
.cqrs-legend{display:flex;gap:18px;margin-top:6px;font-size:11.5px;color:var(--muted);}
.cqrs-legend span{display:inline-flex;align-items:center;gap:6px;}
.cqrs-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.lag-gauge{display:inline-block;width:90px;height:6px;border-radius:4px;background:var(--idle-bg);overflow:hidden;vertical-align:middle;margin-right:7px;}
.lag-gauge i{display:block;height:100%;border-radius:4px;}
.protable th.sortable{cursor:pointer;user-select:none;}.protable th.sortable:hover{color:var(--heading);}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 4px 2px;}
.pg-info{font-size:11.5px;color:var(--faint);margin-right:auto;}
.rm-group{margin-bottom:14px;}
.rm-group-h{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.rm-form{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;}
.rm-doc{background:var(--running-bg);color:var(--primary-strong);}
.rm-graph{background:#f3eefe;color:#7a4fcf;}
.rm-mem{background:var(--success-bg);color:var(--success);}
.rm-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:7px;}
.rm-name{font-size:13px;color:var(--heading);font-weight:600;margin-bottom:5px;}
.rm-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);}
.rm-meta .num{color:var(--muted);}
.env-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.env-item{display:flex;gap:14px;align-items:center;font-size:12.5px;padding:7px 10px;background:var(--surface-3);border-radius:8px;}
.env-item span:nth-child(2){color:var(--heading);font-weight:600;flex:1 1 auto;}
.state-root{border:1px dashed var(--border);border-radius:8px;overflow:hidden;}
.sr-row{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12.5px;}
.sr-row:last-child{border-bottom:0;}
.sr-f{color:var(--heading);}.sr-t{color:var(--subtle);font-family:var(--mono);}

/* ---------------- ⑤ Studio ---------------- */
.studio-region{flex:1 1 auto;min-height:0;display:flex;}
.studio-chat{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.chat-scroll{flex:1 1 auto;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.chat-msg{display:flex;}
.chat-msg.user{justify-content:flex-end;}
.bubble{max-width:72%;border:1px solid var(--border);border-radius:14px;padding:11px 14px;background:var(--surface);box-shadow:var(--shadow-card);}
.chat-msg.user .bubble{background:var(--primary-weak);border-color:var(--primary-line);}
.bubble-text{font-size:13.5px;color:var(--fg);line-height:1.55;}
.tool-call{margin-top:8px;font-size:12px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:6px 9px;display:flex;align-items:center;gap:8px;}
.tc-k{font-size:10px;font-weight:650;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;}
.tool-call code{font-family:var(--mono);font-size:12px;color:var(--primary-strong);}
.inline-run{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;}
.ir-dot{width:8px;height:8px;border-radius:50%;}.ir-name{font-weight:600;color:var(--heading);}
.chat-input{flex:0 0 auto;display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);}
.chat-input textarea{flex:1 1 auto;resize:none;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:13.5px var(--sans);max-height:120px;}
.chat-input textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak);}
.studio-aside{width:300px;flex:0 0 300px;border-left:1px solid var(--border);padding:18px;overflow:auto;background:var(--surface-2);}
.std-select{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font:13px var(--sans);background:var(--surface);}
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.hist-row:last-child{border-bottom:0;}

/* ---------------- two-pane (Skills) ---------------- */
.two-pane{flex:1 1 auto;min-height:0;display:flex;}
.tp-list{width:320px;flex:0 0 320px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);}
.tp-search{padding:12px;border-bottom:1px solid var(--border);}
.tp-search .search{width:100%;}
#skill-list{flex:1 1 auto;overflow:auto;padding:8px;}
.tp-detail{flex:1 1 auto;min-width:0;overflow:auto;padding:20px;}
.skill-row{width:100%;display:flex;flex-direction:column;gap:4px;padding:10px 11px;border:0;background:none;border-radius:8px;text-align:left;margin-bottom:2px;transition:.13s;}
.skill-row:hover{background:var(--surface-3);}
.skill-row.on{background:var(--primary-weak);box-shadow:inset 0 0 0 1px var(--primary-line);}
.skill-row-name{font-size:13.5px;color:var(--heading);font-weight:650;}
.skill-row-desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.skill-row-tags{display:flex;gap:6px;}
.skill-detail-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.skill-desc{font-size:13.5px;color:var(--fg);line-height:1.6;margin-bottom:10px;}
.skill-when{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
.skill-when summary{cursor:pointer;color:var(--primary-strong);font-weight:600;}
.skill-when p{margin-top:8px;line-height:1.6;}
.invoke-prompt{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:13px var(--sans);resize:vertical;}
.invoke-prompt:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak);}
.invoke-result{margin-top:12px;font-size:13px;padding:11px 13px;border-radius:10px;}
.invoke-result.ok{background:var(--success-bg);border:1px solid var(--success-bd);color:var(--success);}
.invoke-result.err{background:var(--failed-bg);border:1px solid var(--failed-bd);color:var(--failed);font-family:var(--mono);font-size:12.5px;}

/* cron editor */
.cron-editor{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--surface-2);}
.cron-fields{display:flex;gap:8px;flex-wrap:wrap;}
.cron-fields .cf{display:flex;flex-direction:column;gap:4px;}
.cron-fields label{font-size:11px;color:var(--faint);}
.cron-fields input{width:56px;height:32px;text-align:center;border:1px solid var(--border);border-radius:8px;font:13px var(--mono);background:var(--surface);}
.cron-fields input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak);}
.cron-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;}
.cron-meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--muted);}
.cron-meta code{font-family:var(--mono);background:var(--surface-3);padding:2px 7px;border-radius:5px;color:var(--heading);}
.cron-tz{height:28px;border:1px solid var(--border);border-radius:8px;font:12px var(--sans);background:var(--surface);}
.cron-preview{margin-top:12px;border-top:1px dashed var(--border);padding-top:11px;}
.cron-preview-h{font-size:11.5px;color:var(--faint);margin-bottom:7px;}
.cron-preview-list{list-style:none;display:flex;flex-direction:column;gap:5px;}
.cron-preview-list li{font-family:var(--mono);font-size:12.5px;color:var(--heading);}
.cron-preview-list .cron-bad{color:var(--failed);}

/* ====== Skills v2（按真实页补全） ====== */
.skill-count{font-size:11.5px;color:var(--faint);padding:4px 6px 8px;}
.skill-row .lock,.lock{display:inline-flex;align-items:center;color:var(--faint);margin-left:5px;vertical-align:middle;}
.lock.lg{color:var(--waiting);margin-left:2px;}
.skill-row-tags{flex-wrap:wrap;}
.sk-tag{font-size:10.5px;color:var(--subtle);background:var(--surface-3);border:1px solid var(--border);border-radius:5px;padding:1px 6px;}
.skill-row.skel{pointer-events:none;}
.sk-line{height:10px;border-radius:4px;background:linear-gradient(90deg,#e9edf4 25%,#f4f6fa 37%,#e9edf4 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;}
.sk-line.w70{width:70%}.sk-line.w90{width:90%}.sk-line.w40{width:40%}
.skill-detail-head{display:block;margin-bottom:10px;}
.sdh-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px;}
.sk-tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.wz-field textarea,.extra-params textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:13px var(--sans);resize:vertical;background:var(--surface);}
.wz-field textarea:focus,.extra-params textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak);}
.extra-params{margin-top:10px;}
.extra-params summary{cursor:pointer;font-size:12.5px;color:var(--primary-strong);font-weight:600;margin-bottom:8px;}
.invoke-state{display:flex;align-items:center;gap:10px;}
.badge-run{font-size:12px;font-weight:600;color:var(--primary-strong);background:var(--primary-weak);border-radius:6px;padding:3px 10px;}
.badge-ok{font-size:12px;font-weight:600;color:var(--success);background:var(--success-bg);border:1px solid var(--success-bd);border-radius:6px;padding:3px 10px;}
.badge-fail{font-size:12px;font-weight:600;color:var(--failed);background:var(--failed-bg);border:1px solid var(--failed-bd);border-radius:6px;padding:3px 10px;}
.http-status{font-family:var(--mono);font-size:12px;color:var(--failed);}
.err-json{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--fg);white-space:pre-wrap;margin-top:8px;line-height:1.5;}
.invoke-out{margin-top:14px;border-top:1px dashed var(--border);padding-top:12px;}
.panel-subtitle{font-size:13px;font-weight:650;color:var(--heading);margin:18px 0 11px;}
.cron-fields input.bad{border-color:var(--failed);background:var(--failed-bg);}
.cron-err{color:var(--failed);font-size:11.5px;display:none;margin-left:6px;}
.sk-cron .cron-preview-list{list-style:decimal;padding-left:24px;}
.sk-cron .cron-preview-list li{padding-left:4px;}
.cron-preview-list .rel{color:var(--faint);font-family:var(--sans);}

   活跃/成败/最近活动 = 把 observatory 最近运行窗口按 scopeId 分组聚合

var FLEET_COMPANIES=[];          /* 已映射的组织行（内部形态，companyCard/viewL0 直接消费） */

      origin:r.runOrigin||'—', scope:r.scopeId||'—',

/* nyxid 用户名册：分页列出全部用户，建 id -> 资料映射。容忍多种字段命名（display_name/displayName/name；
   users/items/data）。admin-only：401/403 -> 返回 {forbidden:true}，调用方降级显示短 id，不伪造。
   不能按 UUID 搜索（search 仅匹配 name/email），必须 list-all。 */
function mapNyxUser(u){
  return { display_name:(u.display_name||u.displayName||u.name||null),
    email:(u.email||null), avatar_url:(u.avatar_url||u.avatarUrl||null),
    isAdmin:!!(u.is_admin||u.isAdmin) }; }
function loadNyxUsers(){
  var tok=accessToken(); if(!tok) return Promise.resolve({forbidden:true});
  if(!NYX_API) return Promise.resolve({disabled:true});
  var per=50, acc={};
  function fetchPage(p){
    return fetch(NYX_API+'/api/v1/admin/users?search=&per_page='+per+'&page='+p,
      { headers:{ 'Authorization':'Bearer '+tok }, cache:'no-store' })
      .then(function(res){
        if(res.status===401||res.status===403) return {forbidden:true};
        if(!res.ok) return {error:'HTTP '+res.status};
        return res.json();
      }).then(function(j){
        if(!j || j.forbidden || j.error) return j||{error:'empty'};
        var users=j.users||j.items||j.data||[];
        users.forEach(function(u){ if(u && u.id!=null) acc[String(u.id)]=mapNyxUser(u); });
        return {ok:true,pageSize:users.length,total:(j.total!=null?j.total:users.length)};
      });
  }
  /* 首页取回 total 后，其余页并行拉取：全景组织名册不能因人数较多而静默截断。 */
  return fetchPage(1).then(function(first){
    if(first && first.forbidden) return {forbidden:true};
    if(!first || first.error) return first||{error:'empty'};
    var pages=Math.ceil(first.total/per);
    if(pages<=1){ NYX_USERS=acc; return {ok:true,count:Object.keys(acc).length}; }
    var rest=[]; for(var p=2;p<=pages;p++) rest.push(fetchPage(p));
    return Promise.all(rest).then(function(results){
      var failed=results.filter(function(r){ return !r||r.forbidden||r.error; })[0];
      if(failed) return failed;

/* 组织资料（名称/邮箱/头像）：优先 nyxid 名册，回退短 id */
function fleetOrgProfile(scopeId){

    avatar:(u&&u.avatar_url)||null, isAdmin:!!(u&&u.isAdmin) }; }
/* 组织来源 = nyxid 全量用户；runs 仅补充当前窗口的运行统计。

  var byScope={}, scopeIds={};

  (runs||[]).forEach(function(r){ var sid=r.scope||'(unknown)'; scopeIds[sid]=1; (byScope[sid]=byScope[sid]||[]).push(r); });
  FLEET_RUNS_BY_SCOPE=byScope;
  return Object.keys(scopeIds).map(function(sid){
    var rs=byScope[sid]||[];
    var active=rs.filter(function(r){return fleetRunActive(r.status);}).length;
    var fail=rs.filter(function(r){return fleetRunFailed(r.status);}).length;
    var success=rs.filter(function(r){return fleetRunSuccess(r.status);}).length;
    var wfSet={}; rs.forEach(function(r){ wfSet[r.name]=1; });
    var workflows=Object.keys(wfSet).length;
    var lastIso=null, oldest=null, oldestMins=-1;
    rs.forEach(function(r){
      if(r.updatedAtUtc && (!lastIso || new Date(r.updatedAtUtc).getTime()>new Date(lastIso).getTime())) lastIso=r.updatedAtUtc;
      if(fleetRunActive(r.status)){ var m=fleetAgoMins(r.startedAtUtc||r.updatedAtUtc);
        if(m!=null && m>oldestMins){ oldestMins=m; oldest={name:r.name,id:'#'+String(r.id).slice(0,4),mins:m}; } }
    });

      health:fleetHealth(rs.length,fail,active),
      active:active, runsTotal:rs.length, success:success, fail:fail,
      workflows:workflows, lastActivity:lastIso, lastActivityLabel:fleetAgo(lastIso),
      busy:active, idle:Math.max(0,rs.length-active-fail), emp:workflows,
      oldest:oldest, isEmpty:(rs.length===0),
      /* 无后端来源 -> 不伪造：成本/token/sparkline 置空，render 已改为不展示 */

}
function loadFleet(rerender){
  FLEET_ERR=null; FLEET_FORBIDDEN=false; FLEET_LOADING=true; if(rerender) rerender();
  /* NyxID 名册是可选增强：Aevatar 平台管理员不一定是 NyxID is_admin，403 不得阻断跨组织运行看板。 */
  var nyxStep=NYX_USERS_ATTEMPTED?Promise.resolve({skipped:true}):loadNyxUsers().then(function(r){
    NYX_USERS_ATTEMPTED=true;

    if(!(r&&r.ok)) NYX_USERS={};

    var runsRes=results[1];

  .then(function(){ FLEET_LOADED=true; FLEET_LOADING=false; FLEET_STAMP=Date.now(); if(rerender) rerender(); });
}

/* 集团 KPI —— 由真实组织行汇总（无成本来源 -> 不展示成本卡） */
function kpiTotals(){
  var t={scopes:COMPANIES.length,active:0,runs:0,fail:0,onDuty:0,success:0,workflows:0};
  COMPANIES.forEach(function(c){ t.active+=c.active; t.runs+=c.runsTotal; t.fail+=c.fail;
    t.onDuty+=c.busy; t.success+=c.success; t.workflows+=c.workflows; });
  return t;
}

/* ---------------- accessors（保持既有签名，供 breadcrumb/viewL1/viewL2 复用） ---------------- */
function companyById(id){ return COMPANIES.filter(function(c){return c.id===id;})[0]; }
function companyDetail(id){
  var co=companyById(id);
  /* 分享链接直达某 org 但看板未加载时，至少用 profile 兜底一个壳，避免 breadcrumb/viewL1 崩 */
  if(!co){ var prof=fleetOrgProfile(id);
    co={ id:id, name:prof.name, email:prof.email, avatar:prof.avatar, health:'grey',
      active:0, runsTotal:0, success:0, fail:0, workflows:0, busy:0, idle:0, emp:0,
      oldest:null, isEmpty:true, lastActivity:null, lastActivityLabel:'—', cost:0, tok:0, spark:null }; }
  var runs=FLEET_RUNS_BY_SCOPE[id]||[];
  /* 由真实 run 派生“本组织内的 workflow”+每个 workflow 的真实跑批统计（员工花名册无后端 -> 用 workflow 代替，诚实标 ~近似） */
  var byWf={}, order=[];

    var w=byWf[k]; w.total++; w.runs.push(r);
    if(fleetRunActive(r.status)) w.running++; else if(fleetRunFailed(r.status)) w.failed++; else if(fleetRunSuccess(r.status)) w.success++;

  var workflows=order.map(function(k){ return byWf[k]; });
  return { co:co, employees:[], flow:{nodes:[],edges:[]}, runs:runs, workflows:workflows,
    empty:(runs.length===0) };
}

function serviceAccessReviewPopupName(value){

function serviceAccessReviewRequestId(value){

function clearServiceAccessReviewPkce(authRequestId){

  try{ var pending=JSON.parse(sessionStorage.getItem(PKCE_KEY)||'null');
    if(pending&&pending.authFlow===SERVICE_ACCESS_REVIEW_FLOW&&pending.authRequestId===requestId) sessionStorage.removeItem(PKCE_KEY);

async function beginLogin(requestedResources,tokenPurpose,authFlow,popupName,authRequestId,requestSource){
  if(!OIDC.authority||!OIDC.clientId){ alert('BackendConsole OIDC 配置缺失。'); return; }
  var flow=authFlow===SERVICE_ACCESS_REVIEW_FLOW?SERVICE_ACCESS_REVIEW_FLOW:'';
  var purpose=!flow&&tokenPurpose===VOICE_TOKEN_PURPOSE?VOICE_TOKEN_PURPOSE:'';
  var reviewPopupName=flow?serviceAccessReviewPopupName(popupName):'';
  var reviewRequestId=flow?serviceAccessReviewRequestId(authRequestId):'';
  /* ADR-0018：会话登录不发送显式 resource——NyxID 会按 RFC 8707 把授权收窄成该列表，
     导致 token 无法访问其他已同意的服务（如部署默认 LLM 路由）。授权集合由 NyxID
     Consent 页决定。voice-realtime 专用 token 保留有意收窄；service-access-review
     则使用完整资源并强制重新展示 consent。 */
  var resources=purpose===VOICE_TOKEN_PURPOSE||flow===SERVICE_ACCESS_REVIEW_FLOW?loginResources(requestedResources):[];
  var verifier=_rand(64), state=_rand(32), challenge=await _sha256(verifier);
  var pending={verifier:verifier,state:state,returnTo:loginReturnTo(),resources:resources,tokenPurpose:purpose,authFlow:flow,authRequestId:reviewRequestId};
  var serializedPending=JSON.stringify(pending);
  sessionStorage.setItem(PKCE_KEY,serializedPending);
  var u=new URL(OIDC.authority.replace(/\/+$/,'')+'/oauth/authorize');
  u.searchParams.set('response_type','code'); u.searchParams.set('client_id',OIDC.clientId);
  u.searchParams.set('redirect_uri',OIDC.redirectUri); u.searchParams.set('scope',OIDC.scope);
  resources.forEach(function(resource){ u.searchParams.append('resource',resource); });
  if(flow===SERVICE_ACCESS_REVIEW_FLOW) u.searchParams.set('prompt','consent');
  u.searchParams.set('state',state); u.searchParams.set('code_challenge',challenge); u.searchParams.set('code_challenge_method','S256');
  if(flow===SERVICE_ACCESS_REVIEW_FLOW&&reviewPopupName&&reviewRequestId){
    var popup=null;
    try{ popup=window.open('',reviewPopupName); }catch(e){ popup=null; }
    if(popup&&!popup.closed){
      try{
        popup.sessionStorage.setItem(PKCE_KEY,serializedPending);
        popup.location.replace(u.toString());
        SERVICE_ACCESS_REVIEW_POPUP={popup:popup,requester:requestSource,authRequestId:reviewRequestId};
        if(typeof popup.focus==='function')popup.focus();
        return;
      }catch(e){ try{popup.close();}catch(ignore){} }
    }
  }
  location.assign(u.toString());
}

/* 顶部细进度条：进行中的请求 >150ms 才显示（后台快轮询不闪烁）；挂在 body 上，切页不销毁。 */
var NET_INFLIGHT=0,NET_SHOW_TIMER=null;
function netProgressEl(){ var el=document.getElementById('net-progress');
  if(!el){ el=document.createElement('div'); el.id='net-progress'; el.innerHTML='<i></i>'; document.body.appendChild(el); }
  return el; }
function netProgressPush(){ NET_INFLIGHT++;
  if(NET_INFLIGHT===1&&!NET_SHOW_TIMER){ NET_SHOW_TIMER=setTimeout(function(){ NET_SHOW_TIMER=null; if(NET_INFLIGHT>0) netProgressEl().classList.add('on'); },150); } }
function netProgressPop(){ NET_INFLIGHT=Math.max(0,NET_INFLIGHT-1);
  if(NET_INFLIGHT===0){ if(NET_SHOW_TIMER){ clearTimeout(NET_SHOW_TIMER); NET_SHOW_TIMER=null; }
    var el=document.getElementById('net-progress'); if(el) el.classList.remove('on'); } }
/* 统一带 Bearer 请求：到期前续期；401→强制续期并重试一次，仍失败才清 token 回登录；
   403→返回 {forbidden:true} 供模块诚实降级（不展示伪造数据）。
   opts.silentProgress=true 供后台轮询使用，不驱动顶部进度条。 */
async function adminApi(path,opts){ opts=opts||{}; var token=await ensureAccessToken(),activeToken=token;
  var silent=!!opts.silentProgress;
  function requestInit(activeToken){ var h=Object.assign({},opts.headers||{});
    if(activeToken&&activeToken.access_token) h['Authorization']='Bearer '+activeToken.access_token;
    var init=Object.assign({},opts,{headers:h}); delete init.silentProgress; return init; }
  if(!silent) netProgressPush();
  var res;
  try{ res=await fetch(path,requestInit(activeToken));
    if(res.status===401&&activeToken){ var replacement=getToken();
      if(!replacement||replacement.access_token===activeToken.access_token){
        try{ replacement=activeToken.refresh_token?await refreshAccessToken(true):null; }catch(e){ replacement=null; }
      }
      if(replacement&&replacement.access_token&&replacement.access_token!==activeToken.access_token){
        activeToken=replacement; res=await fetch(path,requestInit(activeToken));
      }
    }
  }
  finally{ if(!silent) netProgressPop(); }
  if(res.status===401){ showLoginGate('登录已过期，请重新使用 NyxID 登录。',activeToken&&activeToken.access_token); throw {unauthorized:true}; }
  if(res.status===403){ return {forbidden:true,status:403}; }
  return res; }
async function adminJson(path,opts){ var res=await adminApi(path,opts); if(res&&res.forbidden) return res;
  if(!res.ok){ var body=''; try{ body=await res.text(); }catch(e){} throw {status:res.status,body:body}; }
  return res.json(); }

  if(s<60) return Math.round(s)+'s 前'; if(s<3600) return Math.round(s/60)+'m 前';

  try{
    var opts=fromPoll?{silentProgress:true}:undefined;

    var current=await adminJson(currentPath,opts);

  if(SCHED_FILTER==='enabled') return x.enabled;
  if(SCHED_FILTER==='disabled') return !x.enabled;
  if(SCHED_FILTER==='failing') return !!x.currentFailure;
  return true;
}
function schedCanonicalPath(row){
  if(!row||!row.ownerScopeId||!row.teamId||!row.memberId)return null;
  return '/api/scopes/'+encodeURIComponent(row.ownerScopeId)+'/teams/'+encodeURIComponent(row.teamId)+
    '/members/'+encodeURIComponent(row.memberId)+'/automations/'+encodeURIComponent(row.id);
}
function schedOperation(row,op){
  var nonce=_rand(24), operationId='admin-schedule-'+op+'-'+nonce;
  return {operationId:operationId,idempotencyKey:'admin-schedule:'+row.id+':'+operationId};
}
/* Team automation 动作只走 canonical nested lifecycle endpoint；legacy Generic 行只读。 */
async function schedAction(id, op, rerender){
  var row=SCHEDULES_DATA.filter(function(item){return item.id===id;})[0], base=schedCanonicalPath(row);
  if(!row||!base){ toast('缺少 Team/member owner，无法安全执行。'); return; }
  if(op==='delete'&&!confirm('删除 Team 定时任务「'+row.skill+'」？删除会进入凭据撤销流程，且不可恢复。'))return;
  SCHED_BUSY=id+':'+op; if(rerender) rerender();
  try{
    var mutation=schedOperation(row,op), path=op==='delete'?base:(base+'/'+op);
    var res=await adminApi(path,{method:op==='delete'?'DELETE':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(mutation)});
    if(res&&res.forbidden){ toast('无权执行该操作（403）'); }
    else if(res&&res.ok){ toast('已受理：'+({pause:'停用',resume:'启用','run-now':'立即运行','delete':'删除'}[op]||op)); }
    else { var b=''; try{ b=await res.text(); }catch(_){} toast('操作失败 · HTTP '+(res?res.status:'?')+(b?' · '+b.slice(0,120):'')); }
  }catch(e){ if(!e||!e.unauthorized) toast('操作失败 · '+((e&&(e.body||e.message))||'网络错误')); }
  SCHED_BUSY=null;
  await loadSchedules(rerender);          /* 重新拉取列表，反映最新事实 */
}
/* cron 预览：POST /api/schedules/preview {cronExpression,timezone,count} -> {nextFireTimes[]} */
async function schedPreview(cronExpression, timezone, count){
  var j=await adminJson('/api/schedules/preview',{ method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cronExpression:cronExpression, timezone:timezone, count:(count||5)}) });
  if(j&&j.forbidden) return [];
  return (j&&j.nextFireTimes)||[];
}

  <script>
/* =========================================================================
   数据流画布 — @xyflow/react 等效仿真（vanilla + SVG）
   节点 = 岗位/角色(target_role)；边 = 交接(schedule→run / parent→child / step→step)
   边粗细=交接次数；边色=失败率；活跃边 dash 流动；活跃节点 pulse；告警节点红 glow
   ========================================================================= */
var NODE_W=152, NODE_H=58, WORLD_W=1180, WORLD_H=560;

function edgeColor(fr){
  if(fr>=0.25) return '#dc2626';   // 失败率高 → 红
  if(fr>=0.12) return '#d97706';   // 中 → 琥珀
  if(fr>=0.05) return '#94a3b8';   // 低 → 中性灰
  return '#15a34a';                // 极低 → 绿
}
function edgeWidth(count){ return Math.max(1.6, Math.min(6, 1.2+count*0.18)); }
function nodeCenter(n){ return {x:n.x+NODE_W/2, y:n.y+NODE_H/2}; }

function bezier(a,b){
  var dx=Math.max(40,(b.x-a.x)*0.5);
  return 'M'+a.x+','+a.y+' C'+(a.x+dx)+','+a.y+' '+(b.x-dx)+','+b.y+' '+b.x+','+b.y;
}

/* 渲染数据流到 container；onSelect(type, payload) 打开 inspector */
function renderFlow(container, graph, onSelect, opts){
  opts=opts||{};
  container.innerHTML='';
  if(!graph.nodes.length){
    container.innerHTML=emptyBlock('graph');
    return;
  }
  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+WORLD_W+' '+WORLD_H);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  var world=document.createElementNS(ns,'g'); world.setAttribute('class','flow-world');
  svg.appendChild(world);

  var nodeById={}; graph.nodes.forEach(function(n){nodeById[n.id]=n;});

  /* --- edges --- */
  graph.edges.forEach(function(e){
    var a=nodeCenter(nodeById[e.from]), b=nodeCenter(nodeById[e.to]);
    var ax={x:nodeById[e.from].x+NODE_W,y:a.y}, bx={x:nodeById[e.to].x,y:b.y};
    var d=bezier(ax,bx), col=edgeColor(e.fr), w=edgeWidth(e.count);
    var base=document.createElementNS(ns,'path');
    base.setAttribute('d',d); base.setAttribute('class','flow-edge');
    base.setAttribute('stroke',col); base.setAttribute('stroke-width',w);
    base.setAttribute('opacity', e.active?'0.9':'0.5');
    world.appendChild(base);
    if(e.active){
      var flow=document.createElementNS(ns,'path');
      flow.setAttribute('d',d); flow.setAttribute('class','flow-edge-flow');
      flow.setAttribute('stroke','#fff'); flow.setAttribute('stroke-width',Math.max(1,w-1));
      flow.setAttribute('opacity','0.85'); world.appendChild(flow);
    }
    /* hit area + label */
    var hit=document.createElementNS(ns,'path');
    hit.setAttribute('d',d); hit.setAttribute('class','flow-edge-hit');
    hit.addEventListener('click',function(ev){ev.stopPropagation();onSelect('edge',e);});
    world.appendChild(hit);
    var mid={x:(ax.x+bx.x)/2,y:(a.y+b.y)/2-6};
    var lblbg=document.createElementNS(ns,'rect');
    lblbg.setAttribute('x',mid.x-13);lblbg.setAttribute('y',mid.y-9);
    lblbg.setAttribute('width',26);lblbg.setAttribute('height',14);lblbg.setAttribute('rx',3);
    lblbg.setAttribute('class','edge-label-bg'); world.appendChild(lblbg);
    var lbl=document.createElementNS(ns,'text');
    lbl.setAttribute('x',mid.x);lbl.setAttribute('y',mid.y+1);
    lbl.setAttribute('text-anchor','middle');lbl.setAttribute('class','edge-label');
    lbl.textContent='×'+e.count; world.appendChild(lbl);
  });

  /* --- nodes --- */
  graph.nodes.forEach(function(n){
    var g=document.createElementNS(ns,'g');
    g.setAttribute('class','flow-node'+(n.state==='alert'?' alert':''));
    g.setAttribute('transform','translate('+n.x+','+n.y+')');
    g.setAttribute('tabindex','0'); g.setAttribute('role','button');
    g.setAttribute('aria-label','岗位 '+n.label);
    var c=nodeCenter({x:0,y:0});
    if(n.state==='active'){
      var pr=document.createElementNS(ns,'circle');
      pr.setAttribute('cx',NODE_W/2);pr.setAttribute('cy',NODE_H/2);
      pr.setAttribute('r',8);pr.setAttribute('class','pulse-ring');g.appendChild(pr);
    }
    var box=document.createElementNS(ns,'rect');
    box.setAttribute('width',NODE_W);box.setAttribute('height',NODE_H);
    box.setAttribute('rx',8);box.setAttribute('class','nbox');g.appendChild(box);
    /* status dot */
    var stc={active:'#2563eb',alert:'#dc2626',idle:'#9ca3af'}[n.state]||'#9ca3af';
    var dot=document.createElementNS(ns,'circle');
    dot.setAttribute('cx',16);dot.setAttribute('cy',18);dot.setAttribute('r',4);
    dot.setAttribute('fill',stc);g.appendChild(dot);
    var lab=document.createElementNS(ns,'text');
    lab.setAttribute('x',28);lab.setAttribute('y',22);lab.setAttribute('class','nlabel');
    lab.textContent=n.label;g.appendChild(lab);
    var role=document.createElementNS(ns,'text');
    role.setAttribute('x',16);role.setAttribute('y',42);role.setAttribute('class','nrole');
    role.textContent=(n.role==='schedule'?'排班触发':'target_role');g.appendChild(role);
    var impl=document.createElementNS(ns,'text');
    impl.setAttribute('x',NODE_W-12);impl.setAttribute('y',42);impl.setAttribute('text-anchor','end');
    impl.setAttribute('class','nimpl');
    impl.setAttribute('fill',{workflow:'#2563eb',script:'#7e22ce',gagent:'#c2410c',schedule:'#6b7280'}[n.impl]||'#6b7280');
    impl.textContent=n.impl;g.appendChild(impl);

    g.addEventListener('click',function(ev){ev.stopPropagation();select(n.id);onSelect('node',n);});
    g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n.id);onSelect('node',n);}});
    g._nid=n.id;
    world.appendChild(g);
  });

  container.appendChild(svg);

  function select(id){
    Array.prototype.forEach.call(world.querySelectorAll('.flow-node'),function(g){
      g.classList.toggle('sel',g._nid===id);
    });
  }

  /* --- pan & zoom --- */
  var scale=1, tx=0, ty=0, dragging=false, sx=0, sy=0, started=false;
  function apply(){
    world.setAttribute('transform','translate('+tx+','+ty+') scale('+scale+')');
    updateMinimap();
  }
  function clampZoom(s){ return Math.max(0.5,Math.min(1.8,s)); }
  container.addEventListener('mousedown',function(e){
    if(e.target.closest('.flow-node')||e.target.closest('.flow-edge-hit'))return;
    dragging=true;started=false;sx=e.clientX-tx;sy=e.clientY-ty;container.classList.add('grabbing');
  });
  window.addEventListener('mousemove',function(e){
    if(!dragging)return; tx=e.clientX-sx; ty=e.clientY-sy; started=true; apply();
  });
  window.addEventListener('mouseup',function(){dragging=false;container.classList.remove('grabbing');});
  container.addEventListener('wheel',function(e){
    e.preventDefault();
    var prev=scale; scale=clampZoom(scale*(e.deltaY<0?1.1:0.9));
    /* zoom toward cursor */
    var rect=container.getBoundingClientRect();
    var cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    tx=cx-(cx-tx)*(scale/prev); ty=cy-(cy-ty)*(scale/prev);
    apply();
  },{passive:false});

  /* controls */
  var ctr=document.createElement('div'); ctr.className='flow-controls';
  ctr.innerHTML='<button data-z="in" title="放大" aria-label="放大">+</button>'+
                '<button data-z="out" title="缩小" aria-label="缩小">−</button>'+
                '<button data-z="fit" title="适应" aria-label="适应屏幕" style="font-size:13px">⤢</button>';
  ctr.addEventListener('click',function(e){
    var z=e.target.getAttribute('data-z'); if(!z)return;
    if(z==='in')scale=clampZoom(scale*1.2);
    else if(z==='out')scale=clampZoom(scale/1.2);
    else {scale=1;tx=0;ty=0;}
    apply();
  });
  container.appendChild(ctr);

  /* legend */
  var lg=document.createElement('div'); lg.className='flow-legend';
  lg.innerHTML=
    '<div class="row"><span class="ln" style="background:#15a34a"></span>失败率 低</div>'+
    '<div class="row"><span class="ln" style="background:#d97706"></span>失败率 中</div>'+
    '<div class="row"><span class="ln" style="background:#dc2626"></span>失败率 高</div>'+
    '<div class="row"><span class="ln" style="background:#2563eb;height:6px"></span>线宽 = 交接次数</div>';
  container.appendChild(lg);

  /* minimap */
  var mm=document.createElement('div'); mm.className='flow-minimap';
  var mmsvg=document.createElementNS(ns,'svg');
  mmsvg.setAttribute('viewBox','0 0 '+WORLD_W+' '+WORLD_H);
  graph.nodes.forEach(function(n){
    var r=document.createElementNS(ns,'rect');
    r.setAttribute('x',n.x);r.setAttribute('y',n.y);r.setAttribute('width',NODE_W);r.setAttribute('height',NODE_H);
    r.setAttribute('rx',8);
    r.setAttribute('class','mm-node'+(n.state==='active'?' active':(n.state==='alert'?' alert':'')));
    mmsvg.appendChild(r);
  });
  var mmview=document.createElementNS(ns,'rect'); mmview.setAttribute('class','mm-view');
  mmsvg.appendChild(mmview); mm.appendChild(mmsvg); container.appendChild(mm);

  function updateMinimap(){
    /* viewport rect in world coords */
    var vw=WORLD_W/scale, vh=WORLD_H/scale;
    var vx=-tx/scale, vy=-ty/scale;
    mmview.setAttribute('x',vx);mmview.setAttribute('y',vy);
    mmview.setAttribute('width',vw);mmview.setAttribute('height',vh);
  }

  apply();
  return {select:select};
}
</script>

    waiting:['tag-waiting','等待','◷'],stopped:['tag-idle','已停止','■'],stuck:['tag-failed','卡住','▌'],idle:['tag-idle','空闲','○']};

/* ============================== L0 集团总览 ============================== */
function viewL0(){
  if(!ACCOUNT||!ACCOUNT.admin) return {html:moduleSubHeader('fleet','')+'<div class="view-scroll">'+auth403('全景看板汇总全部组织的运行态，仅平台管理员可见。')+'</div>', mount:bindFleet};
  if(!FLEET_LOADED) return {html:moduleSubHeader('fleet','')+'<div class="view-scroll">'+fleetSkeleton()+'</div>', mount:bindFleet};
  if(FLEET_FORBIDDEN) return {html:moduleSubHeader('fleet','')+'<div class="view-scroll">'+auth403('需要平台管理员权限读取跨组织运行态（observatory __all__）。')+'</div>', mount:bindFleet};
  if(FLEET_ERR) return {html:moduleSubHeader('fleet','')+'<div class="view-scroll"><div class="alert">'+ICON.warn+'<span class="grow">看板加载失败：'+esc(FLEET_ERR)+'</span><button class="btn" data-act="fleetReload">重试</button></div></div>', mount:bindFleet};
  var t=kpiTotals();
  var directoryReady=FLEET_DIRECTORY_STATUS==='ready';
  var kpi=
    metricCard({label:(directoryReady?'全部组织':'运行组织')+' (orgs)',icon:ICON.building,value:t.scopes,
      sub:directoryReady?'NyxID 用户名册':'observatory 窗口 scope'})+
    metricCard({label:'此刻在飞 Run',icon:ICON.bolt,value:t.active,cls:'running',live:true})+
    metricCard({label:'运行窗口总数',icon:ICON.refresh,value:t.runs,sub:'observatory 最近 '+FLEET_RUN_WINDOW+' 条'})+
    metricCard({label:'失败 / 超时 Run',icon:ICON.warn,value:t.fail,cls:t.fail>0?'danger':'',sub:'跨 '+COMPANIES.filter(function(c){return c.fail>0;}).length+' 个组织'})+
    metricCard({label:'活跃 workflow',icon:ICON.people,value:t.workflows,sub:'窗口内出现的去重 workflow',approx:true});

  /* sort + filter */
  var list=COMPANIES.slice();
  var order={red:0,amber:1,green:2,grey:3};
  if(STATE.l0Filter==='red') list=list.filter(function(c){return c.health==='red';});
  if(STATE.l0Filter==='active') list=list.filter(function(c){return c.active>0;});
  if(STATE.l0Sort==='health') list.sort(function(a,b){return order[a.health]-order[b.health];});
  if(STATE.l0Sort==='runs')   list.sort(function(a,b){return b.runsTotal-a.runsTotal;});
  if(STATE.l0Sort==='active') list.sort(function(a,b){return b.active-a.active;});

  var cards=list.map(companyCard).join('');
  if(!list.length) cards=emptyBlock('company-filter');

  var sortLabel={health:'健康 ↓',runs:'运行数 ↓',active:'活跃 ↓'}[STATE.l0Sort]||'运行数 ↓';
  var rangeT=STATE.l0Range==='today'?'今日':'7 天';

  var body=
    '<div class="view-scroll">'+
      fleetDirectoryNotice()+
      '<div class="kpi-bar">'+kpi+'</div>'+
      '<div class="toolbar">'+
        '<div class="chip-row">'+
          chip('red','只看红灯','#dc2626',STATE.l0Filter==='red',COMPANIES.filter(function(c){return c.health==='red';}).length)+
          chip('active','只看在飞','#2563eb',STATE.l0Filter==='active',COMPANIES.filter(function(c){return c.active>0;}).length)+
        '</div>'+
        '<div class="grow"></div>'+
        '<span class="inline-refresh" style="margin-right:6px"><i class="live-dot" style="background:var(--success)"></i> '+
          (directoryReady?'NyxID 全量组织':'observatory 运行组织')+' · observatory 运行窗口 '+srcBadge(directoryReady?'ready':'approx')+'</span>'+
        '<button class="ibtn" data-act="fleetReload">'+ICON.refresh+' 刷新</button>'+
        '<button class="sortbtn" data-act="l0sort"><span class="lbl">排序</span><span class="val">'+sortLabel+'</span></button>'+
      '</div>'+
      '<div class="card-wall">'+cards+'</div>'+
      '<div class="src-legend-bar"><div class="panel-title" style="margin-bottom:12px">数据来源 · 组织 = '+
        (directoryReady?'NyxID 全量用户名册，零运行账号也会展示':'observatory 窗口内的去重 scopeId（NyxID 名册不可用）')+
        '；运行态 = observatory 最近 '+FLEET_RUN_WINDOW+' 条跨组织窗口；去重 workflow 计数为 ~近似；成本 / 员工花名册 / 数据流交接图无统一事实源，已降级为 预览，不展示伪造值</div>'+srcLegendRows()+'</div>'+
    '</div>';
  return {html:body, mount:bindFleet};
}
/* 看板骨架 + 加载 + 重渲（整页重挂载，复用 shell 的挂载点） */
function fleetSkeleton(){ return '<div class="sk-bar" style="height:90px;border-radius:8px"></div>'+
  '<div class="card-wall" style="margin-top:16px">'+[0,0,0,0,0,0].map(function(){return '<div class="sk-card" style="height:200px"></div>';}).join('')+'</div>'; }
function _fleetRemount(){ var parts=curParts(); if(parts[0]!=='fleet'||parts.length>1) return;
  var sc=document.getElementById('view-body'); if(!sc) return;
  var v=viewL0(); replaceViewHtml(sc,v.html); if(v.mount) v.mount(sc); }
function bindFleet(root){
  if(ACCOUNT&&ACCOUNT.admin&&!FLEET_LOADING){
    if(!FLEET_LOADED){ loadFleet(_fleetRemount); }
    /* stale-while-revalidate：重进看板先呈现缓存数据，超过 30s 静默拉新后原位重挂 */
    else if(Date.now()-FLEET_STAMP>30000){ loadFleet(_fleetRemount); }
  }
  /* 看板内的下钻/排序/筛选导航统一由 foundation bindEvents（data-co / data-chip / l0sort）处理；
     这里只接管板内 fleetReload 刷新（不重复绑定 document 级委托）。 */
  root.addEventListener('click',function(ev){
    var act=ev.target.closest('[data-act]'); if(!act) return;
    if(act.getAttribute('data-act')==='fleetReload'){ FLEET_LOADED=false; FLEET_ERR=null; NYX_USERS_ATTEMPTED=false; _fleetRemount(); loadFleet(_fleetRemount); }
  });
}

function metricCard(o){
  var trend=o.trend?'<span class="mc-trend '+(o.trend==='up'?'mc-up':o.trend==='down'?'mc-down':'mc-flat')+'">'+
    (o.trend==='up'?'▲':o.trend==='down'?'▼':'■')+'</span>':'';
  var head=o.live?'<span class="live-badge" style="height:18px;padding:2px 8px"><i class="live-dot"></i>live</span>':'';
  var val=o.approx?aprx(o.value):o.value;
  var sub=o.sub?'<span class="mc-sub">'+trend+esc(o.sub)+'</span>':'';
  return '<div class="metric-card">'+
    '<div class="mc-head"><span class="mc-label"><span class="mc-ico">'+o.icon+'</span>'+esc(o.label)+'</span>'+head+'</div>'+
    '<div class="mc-val '+(o.cls||'')+'">'+val+'</div>'+sub+'</div>';
}

function companyCard(c){
  var tag=c.health==='red'?'<span class="co-health-tag" style="background:var(--failed-bg);color:var(--failed)">需关注</span>'
    :c.health==='amber'?'<span class="co-health-tag" style="background:var(--waiting-bg);color:#9a5b07">观察</span>'
    :c.health==='grey'?'<span class="co-health-tag" style="background:var(--idle-bg);color:#6b7280">无活动</span>'
    :'<span class="co-health-tag" style="background:var(--success-bg);color:var(--success)">健康</span>';
  /* 组织名 = nyxid 显示名（不可信长度时截断，title 存全量）；data-co 用 scopeId 全量；
     副标题 = email（若名册命中）否则短 scopeId，便于辨认无名册命中的组织 */
  var label=esc(c.name), shortLabel=(c.name&&c.name.length>22)?esc(c.name.slice(0,20)+'…'):label;
  var sub='<div class="emp-sub tnum" style="margin-top:2px">'+esc(c.email||nyxShortId(c.id))+'</div>';
  if(c.isEmpty){
    return '<button class="co-card" data-co="'+esc(c.id)+'" title="'+label+'" aria-label="进入 '+label+'">'+
      '<div class="co-top"><span class="co-name"><i class="health-light health-grey"></i>'+shortLabel+'</span>'+tag+'</div>'+sub+
      '<div class="co-active"><span class="big zero">0</span><span class="unit">近窗运行</span></div>'+
      '<div class="co-alert calm">'+ICON.empty.replace('width="1.6"','width="2"')+'<span>该组织近窗内无运行记录</span></div>'+
      '<div class="co-foot"><span class="emp">0 workflow</span><span class="emp">无活动</span></div>'+
    '</button>';
  }
  var total=c.busy+c.idle+c.fail||1;
  var stack='<div class="stack">'+
    '<i class="s-busy" style="width:'+(c.busy/total*100)+'%"></i>'+
    '<i class="s-idle" style="width:'+(c.idle/total*100)+'%"></i>'+
    '<i class="s-fail" style="width:'+(c.fail/total*100)+'%"></i></div>'+
    '<div class="stack-legend"><span><i style="background:var(--running)"></i>在飞 '+c.busy+'</span>'+
    '<span><i style="background:#cbd0d8"></i>完成 '+c.idle+'</span>'+
    '<span><i style="background:var(--failed)"></i>失败 '+c.fail+'</span></div>';
  var sev=c.oldest?(c.oldest.mins>40?'danger':'warn'):'';
  var alert=c.oldest
    ? '<div class="co-alert co-alert-'+sev+'"><span class="ca-ico">'+ICON.warn+'</span>'+
        '<span class="ca-txt">最久未推进 · <b>'+esc(c.oldest.name)+'</b> Run '+esc(c.oldest.id)+' 已 running <b class="ca-min num">'+c.oldest.mins+'</b> min</span>'+
        '<span class="live-dot" title="live 数据"></span></div>'
    : '<div class="co-alert calm">'+ICON.check.replace('stroke-width="2"','stroke-width="2.2"')+'<span>无长时间未推进的 Run</span></div>';
  return '<button class="co-card" data-co="'+esc(c.id)+'" title="'+label+'" aria-label="进入 '+label+'">'+
    '<div class="co-top"><span class="co-name"><i class="health-light health-'+c.health+'"></i>'+shortLabel+'</span>'+tag+'</div>'+sub+
    '<div class="co-active"><span class="big">'+c.active+'</span><span class="unit">此刻在飞 Run</span></div>'+
    '<div class="co-cost"><span class="cc-l">近窗 <b class="num" style="color:var(--heading)">'+c.runsTotal+'</b> 运行 · 完成 '+c.success+' · 最近 '+esc(c.lastActivityLabel)+'</span></div>'+
    stack+alert+
    '<div class="co-foot"><span class="emp">'+c.workflows+' workflow <span class="approx-mark">~</span></span><span class="emp">查看运行 '+ICON.arrow.replace('width="2"','width="1.6" style="width:13px;height:13px;vertical-align:-2px"')+'</span></div>'+
  '</button>';
}

function chip(val,label,color,on,cnt){
  return '<button class="chip'+(on?' on':'')+'" data-chip="'+val+'">'+
    (color?'<span class="dot" style="background:'+color+'"></span>':'')+esc(label)+
    '<span class="cnt">'+cnt+'</span></button>';
}

/* ============================== L1 公司视图 ============================== */
function viewL1(coId){
  var detail=companyDetail(coId);
  if(!detail) return {html:emptyBlock('company-filter')};
  var c=detail.co;
  var sub=STATE.l1Sub||'roster';
  var orgSub='<span class="emp-sub tnum" style="margin-left:10px">'+esc(c.email||nyxShortId(c.id))+'</span>';
  var subHeader=
    '<div class="sub-header">'+
      '<span class="sub-title" title="'+esc(c.name)+'"><i class="health-light health-'+c.health+'" style="display:inline-block;margin-right:8px;vertical-align:middle"></i>'+esc((c.name&&c.name.length>26)?c.name.slice(0,24)+'…':c.name)+'</span>'+orgSub+
      '<div class="sub-kpis">'+
        '<div class="sub-kpi"><span class="k">workflow</span><span class="v num">'+c.workflows+'</span></div>'+
        '<div class="sub-kpi"><span class="k">在飞 Run</span><span class="v num" style="color:var(--running)">'+c.active+'</span></div>'+
        '<div class="sub-kpi"><span class="k">近窗运行</span><span class="v num">'+c.runsTotal+'</span></div>'+
      '</div>'+
      '<div class="sub-spacer"></div>'+
      '<div class="segmented" data-act="l1seg">'+

        '<button class="'+(sub==='flow'?'on':'')+'" data-seg="flow">数据流</button>'+
      '</div>'+
    '</div>';

  if(sub==='flow') return {html:subHeader+l1Flow(detail), mount:function(root){
    var canvas=root.querySelector('#flow-canvas'); if(!canvas)return;
    /* 真实 handoff/交接 feed 尚无后端 -> 渲染空画布的 emptyBlock（预览），不伪造节点/边 */
    renderFlow(canvas, detail.flow, function(){});
  }};

  return {html:subHeader+l1Roster(detail,coId), mount:bindFleet};
}

function l1Roster(detail,coId){
  if(detail.empty || !detail.runs.length) return '<div class="view-scroll">'+emptyBlock('roster')+'</div>';
  /* workflow 概览（由真实 run 派生；员工花名册无后端 -> 用 workflow + 真实跑批统计代替，标 ~近似） */
  var wfRows=detail.workflows.map(function(w){
    var st=w.running>0?statusLight('busy'):(w.failed>0?statusLight('failed'):statusLight('idle'));
    return '<tr>'+
      '<td><b style="color:var(--heading);font-weight:550">'+esc(w.name)+'</b></td>'+
      '<td>'+st+'</td>'+
      '<td class="tnum">'+w.total+'</td>'+
      '<td class="tnum" style="color:var(--success)">'+w.success+'</td>'+
      '<td class="tnum" style="color:'+(w.failed>0?'var(--failed)':'var(--faint)')+'">'+w.failed+'</td>'+
      '<td class="tnum" style="color:'+(w.running>0?'var(--running)':'var(--faint)')+'">'+w.running+'</td>'+
      '<td style="color:var(--faint)">'+esc(fleetAgo(w.lastActivity))+'</td></tr>';
  }).join('');
  var wfPanel='<div class="panel"><div class="panel-title">本组织内的 workflow（近窗去重）'+srcBadge('approx')+'</div>'+
    '<div class="protable-wrap"><table class="protable"><thead><tr>'+
    '<th>workflow</th><th>状态</th><th>运行</th><th>完成</th><th>失败</th><th>在飞</th><th>最近活动</th>'+
    '</tr></thead><tbody>'+wfRows+'</tbody></table></div></div>';
  /* 真实运行列表（点击行 -> foundation data-run 深链进 observatory，选中该 run） */
  var runRows=detail.runs.slice(0,80).map(function(r){
    var rstatus={running:'running',completed:'success',failed:'failed',timed_out:'failed',stopped:'stopped',disabled:'stopped'}[r.status]||'stuck';
    var scopeId=r.scope||coId;
    return '<tr data-run="'+esc(r.id)+'" data-scope="'+esc(scopeId)+'">'+
      '<td><b style="color:var(--heading);font-weight:550">'+esc(r.name)+'</b><div style="font-size:11px;color:var(--faint)" class="tnum">'+esc(r.id)+'</div></td>'+
      '<td>'+statusTag(rstatus)+'</td>'+
      '<td>'+originPill(r.origin)+'</td>'+
      '<td class="tnum" style="color:var(--faint)">'+esc(fleetAgo(r.updatedAtUtc))+'</td>'+
      '<td><span class="ibtn" style="height:24px;pointer-events:none">观测 ↗</span></td></tr>';
  }).join('');
  var runPanel='<div class="panel" style="margin-top:16px"><div class="panel-title">该组织的运行（observatory __all__ 过滤）'+srcBadge('ready')+'</div>'+
    '<div class="protable-wrap"><table class="protable"><thead><tr>'+
    '<th>workflow / runId</th><th>状态</th><th>来源</th><th>最近活动</th><th></th>'+
    '</tr></thead><tbody>'+runRows+'</tbody></table></div>'+
    '<p style="margin-top:8px;font-size:11.5px;color:var(--faint)">点击任一行进入运行观测台查看该 run 的逐步 trace / DAG / 产出。</p></div>';
  return '<div class="view-scroll">'+wfPanel+runPanel+'</div>';
}
function l1Flow(detail){
  /* 真实 handoff / 数据流交接 feed 尚无后端事实源 -> 整层标 预览，画布渲染空态，不伪造节点/边 */
  return '<div class="flow-region">'+
    '<div class="flow-toolbar">'+
      '<div class="chip-row">'+
        '<button class="chip on" data-layer="handoff">任务交接<span class="src src-preview" style="margin-left:8px">预览</span></button>'+
        previewChip('消息流')+
        previewChip('系统事件流')+
      '</div>'+
      '<div class="grow"></div>'+
      '<span style="font-size:11.5px;color:var(--faint)">岗位交接 / 数据流图谱 '+srcBadge('preview')+' · 暂无统一 handoff 事实源，不展示伪造拓扑；运行级 DAG 见观测台每个 run 详情</span>'+
    '</div>'+
    '<div class="flow-canvas" id="flow-canvas" aria-label="数据流画布（预览）"></div>'+
  '</div>';
}

/* ============================== Empty 文案 ============================== */
function emptyBlock(kind){
  var map={
    company:['还没有公司','集团下尚未接入任何 scope，去 aevatar 创建第一家公司。','去创建公司'],
    'company-filter':['没有符合条件的公司','当前筛选下无公司，调整快筛或排序。',null],
    roster:['这家公司还没有员工','部门下尚未配置 AI 员工（member），先去添加一个 workflow / script / gagent。','添加员工'],
    graph:['暂无数据流','该公司近 24h 没有产生 Run 交接，跑一次 workflow 后这里会出现活的流水线。',null],
    run:['暂无 Run','当前没有可展示的运行记录。',null]

  return '<div class="empty">'+ICON.empty+'<div class="et">'+m[0]+'</div><div class="es">'+m[1]+'</div>'+
    (m[2]?'<button class="btn btn-primary" style="height:34px">'+m[2]+'</button>':'')+'</div>';
}

  <script>
/* =========================================================================

async function loadModelsCatalog(owner,options){

      modelsCatalogResponse(base,{cache:'no-store',silentProgress:!!options.silent}),
      modelsCatalogResponse(modelsCatalogEndpoint(owner,true),{cache:'no-store',silentProgress:!!options.silent})
    ]);
    if(state.request!==request)return;
    if(responses[0].forbidden||responses[1].forbidden){
      modelsCatalogClearOwnerState(owner,true);modelsCatalogRenderIfActive();
      return;
    }

        }else{

        }

function mountModelsCatalog(root){

    if(target.hasAttribute('data-models-owner')){var owner=target.getAttribute('data-models-owner');if(owner==='platform'&&!(ACCOUNT&&ACCOUNT.admin))return;MODELS_STATE.owner=owner;MODELS_STATE.editor=null;var state=modelsCatalogOwnerState(owner);if(!state.loaded&&!state.loading)loadModelsCatalog(owner);else modelsCatalogRenderIfActive();return;}

    if(target.hasAttribute('data-models-save')){modelsCatalogSave(MODELS_STATE.owner);return;}
    if(target.hasAttribute('data-models-reset')){modelsCatalogResetScope();return;}
    if(target.hasAttribute('data-models-discard')){modelsCatalogDiscard(MODELS_STATE.owner);return;}
    if(target.hasAttribute('data-models-editor-close')){modelsCatalogCloseEditor();return;}
    if(target.hasAttribute('data-models-discover')){modelsCatalogDiscoverModels();return;}
    if(target.hasAttribute('data-models-clear-discovered')){modelsCatalogClearDiscoveredModels();return;}
    if(target.hasAttribute('data-models-add-model')){modelsCatalogAddManualModel(root);return;}
    if(target.hasAttribute('data-models-remove-model')){modelsCatalogRemoveManualModel(Number(target.getAttribute('data-models-remove-model')));return;}
    if(target.hasAttribute('data-models-editor-save')){modelsCatalogApplyEditor(root);return;}

}

function agentProfileRequestIsCurrent(owner,request){

function agentProfileSnapshotAuthority(){return (ACCOUNT&&ACCOUNT.scope||'')+'|'+!!(ACCOUNT&&ACCOUNT.admin);}
function agentProfileSyncAuthority(){
