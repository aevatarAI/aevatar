syntax = "proto3";

package aevatar.voice;

option csharp_namespace = "Aevatar.Foundation.VoicePresence.Abstractions";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

enum VoicePresenceRuntimeStatus {
  VOICE_PRESENCE_RUNTIME_STATUS_UNSPECIFIED = 0;
  VOICE_PRESENCE_RUNTIME_STATUS_IDLE = 1;
  VOICE_PRESENCE_RUNTIME_STATUS_USER_SPEAKING = 2;
  VOICE_PRESENCE_RUNTIME_STATUS_RESPONSE_IN_PROGRESS = 3;
  VOICE_PRESENCE_RUNTIME_STATUS_AUDIO_DRAINING = 4;
}

enum VoiceRemoteAudioSupport {
  VOICE_REMOTE_AUDIO_SUPPORT_UNSPECIFIED = 0;
  VOICE_REMOTE_AUDIO_SUPPORT_LOCAL_ONLY = 1;
  VOICE_REMOTE_AUDIO_SUPPORT_SUPPORTED = 2;
  VOICE_REMOTE_AUDIO_SUPPORT_UNAVAILABLE = 3;
}

message VoiceProviderConfig {
  string provider_name = 1;
  string endpoint = 2;
  string api_key = 3;
  string model = 4;
}

message VoiceSessionConfig {
  string voice = 1;
  string instructions = 2;
  int32 sample_rate_hz = 3;
  repeated string tool_names = 4;
  repeated VoiceToolDefinition tool_definitions = 5;
}

message VoiceToolDefinition {
  string name = 1;
  string description = 2;
  string parameters_schema = 3;
}

message VoiceConversationEventInjection {
  string envelope_id = 1;
  string publisher_actor_id = 2;
  string event_type = 3;
  string payload_json = 4;
  google.protobuf.Timestamp observed_at = 5;
}

// Refactor (iter35/cluster-036-voice-presence-rolegagent-state):
//   Old pattern: VoicePresenceModule 在 module 内持有 process-local background state(unbounded channels / TaskCompletionSource waiters / 静态字段持 lifecycle),还保留 disabled remote voice fallback shell.
//   New principle: Reuse existing RoleGAgent state for voice runtime facts(typed protobuf sub-state in RoleGAgent state); transport handles 仅作 volatile process-local lease.
message VoicePendingEventInjection {
  string envelope_id = 1;
  string publisher_actor_id = 2;
  string event_type = 3;
  google.protobuf.Any payload = 4;
  google.protobuf.Timestamp observed_at = 5;
}

message VoiceProviderResponseBinding {
  string provider_response_id = 1;
  int32 response_id = 2;
}

// Refactor (iter39/cluster-029-voice-presence-session-runtime-shape):
//   Old pattern: InProcessActorVoicePresenceSessionResolver 通过 runtime instance shape 判定 voice session capability(违反"运行时形态不是业务事实")。
//   New principle: voice capability/session facts 由 actor-owned VoicePresenceCapabilityReadModel 暴露;host resolver 只 obtain lease/session handle;走 existing typed lease command/event flow,no runtime-shape inspection。
message VoicePresenceRuntimeState {
  VoicePresenceRuntimeStatus status = 1;
  int32 current_response_id = 2;
  int64 last_drain_ack_playout_sequence = 3;
  int32 last_drain_ack_response_id = 4;
  int32 next_response_id = 5;
  repeated VoiceProviderResponseBinding provider_response_bindings = 6;
  repeated string cancelled_provider_response_ids = 7;
  bool awaiting_injected_response_start = 8;
  string active_provider_response_id = 9;
  string remote_session_id = 10;
  repeated VoicePendingEventInjection pending_injections = 11;
  bool initialized = 12;
  bool transport_attached = 13;
  int32 pcm_sample_rate_hz = 14;
  string active_session_id = 15;
  google.protobuf.Timestamp lease_expires_at = 16;
  VoiceRemoteAudioSupport remote_audio_support = 17;
}

message VoicePresenceRuntimeStateChangedEvent {
  string module_name = 1;
  VoicePresenceRuntimeState state = 2;
}

message VoiceRemoteSessionOpenRequested {
  string session_id = 1;
}

message VoiceRemoteSessionCloseRequested {
  string session_id = 1;
  string reason = 2;
}

// Refactor (iter39/cluster-029-voice-presence-session-runtime-shape):
//   Old pattern: InProcessActorVoicePresenceSessionResolver 通过 runtime instance shape 判定 voice session capability(违反"运行时形态不是业务事实")。
//   New principle: voice capability/session facts 由 actor-owned VoicePresenceCapabilityReadModel 暴露;host resolver 只 obtain lease/session handle;走 existing typed lease command/event flow,no runtime-shape inspection。
message VoicePresenceSessionLeaseRequested {
  string session_id = 1;
  string owner_id = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message VoicePresenceSessionLeaseReleased {
  string session_id = 1;
  string reason = 2;
}

message VoiceAudioReceived {
  bytes pcm16 = 1;
  int32 sample_rate_hz = 2;
  string provider_response_id = 3;
}

message VoiceResponseStarted {
  int32 response_id = 1;
  string provider_response_id = 2;
}

message VoiceResponseDone {
  int32 response_id = 1;
  string provider_response_id = 2;
}

message VoiceResponseCancelled {
  int32 response_id = 1;
  string provider_response_id = 2;
}

message VoiceFunctionCallRequested {
  string call_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
  int32 response_id = 4;
  string provider_response_id = 5;
}

message VoiceSpeechStarted {}

message VoiceSpeechStopped {}

message VoiceProviderError {
  string error_code = 1;
  string error_message = 2;
}

message VoiceProviderDisconnected {
  string reason = 1;
}

message VoiceProviderEvent {
  oneof event {
    VoiceAudioReceived audio_received = 1;
    VoiceResponseStarted response_started = 2;
    VoiceResponseDone response_done = 3;
    VoiceResponseCancelled response_cancelled = 4;
    VoiceFunctionCallRequested function_call = 5;
    VoiceSpeechStarted speech_started = 6;
    VoiceSpeechStopped speech_stopped = 7;
    VoiceProviderError error = 8;
    VoiceProviderDisconnected disconnected = 9;
  }
}

message VoiceDrainAcknowledged {
  int32 response_id = 1;
  int64 playout_sequence = 2;
}

message VoiceControlFrame {
  oneof frame {
    VoiceDrainAcknowledged drain_acknowledged = 1;
  }
}

message VoiceRemoteControlInputReceived {
  string session_id = 1;
  VoiceControlFrame control_frame = 2;
}

message VoiceRemoteSessionClosed {
  string reason = 1;
}

message VoiceRemoteTransportOutput {
  reserved 3;
  reserved "audio_output";

  string module_name = 1;
  string session_id = 2;

  oneof output {
    VoiceRemoteSessionClosed session_closed = 4;
  }
}

message VoiceModuleSignal {
  reserved 6;
  reserved "remote_audio_input_received";

  string module_name = 1;

  oneof signal {
    VoiceProviderEvent provider_event = 2;
    VoiceControlFrame control_frame = 3;
    VoiceRemoteSessionOpenRequested remote_session_open_requested = 4;
    VoiceRemoteSessionCloseRequested remote_session_close_requested = 5;
    VoiceRemoteControlInputReceived remote_control_input_received = 7;
    VoicePresenceSessionLeaseRequested session_lease_requested = 8;
    VoicePresenceSessionLeaseReleased session_lease_released = 9;
  }
}

// Refactor (iter39/cluster-029-voice-presence-session-runtime-shape):
//   Old pattern: InProcessActorVoicePresenceSessionResolver 通过 runtime instance shape 判定 voice session capability(违反"运行时形态不是业务事实")。
//   New principle: voice capability/session facts 由 actor-owned VoicePresenceCapabilityReadModel 暴露;host resolver 只 obtain lease/session handle;走 existing typed lease command/event flow,no runtime-shape inspection。
message VoicePresenceCapabilityReadModel {
  string id = 1;
  string actor_id = 2;
  string module_name = 3;
  int64 state_version = 4;
  string last_event_id = 5;
  google.protobuf.Timestamp updated_at = 6;
  bool initialized = 7;
  bool transport_attached = 8;
  int32 pcm_sample_rate_hz = 9;
  string active_session_id = 10;
  google.protobuf.Timestamp lease_expires_at = 11;
  VoiceRemoteAudioSupport remote_audio_support = 12;
}
