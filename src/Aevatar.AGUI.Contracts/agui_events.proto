syntax = "proto3";

package aevatar.presentation.agui;

option csharp_namespace = "Aevatar.AGUI.Contracts";

import "google/protobuf/any.proto";
import "google/protobuf/wrappers.proto";
import "Tools/tool_presentation.proto";

message AGUIEvent {
  google.protobuf.Int64Value timestamp = 1;
  int64 sequence = 17;

  oneof event {
    RunStartedEvent run_started = 2;
    RunFinishedEvent run_finished = 3;
    RunErrorEvent run_error = 4;
    StepStartedEvent step_started = 5;
    StepFinishedEvent step_finished = 6;
    TextMessageStartEvent text_message_start = 7;
    TextMessageContentEvent text_message_content = 8;
    TextMessageEndEvent text_message_end = 9;
    StateSnapshotEvent state_snapshot = 10;
    ToolCallStartEvent tool_call_start = 11;
    ToolCallEndEvent tool_call_end = 12;
    HumanInputRequestEvent human_input_request = 13;
    HumanInputResponseEvent human_input_response = 14;
    CustomEvent custom = 15;
    UsageEvent usage = 16;
    ModelCallStartEvent model_call_start = 18;
    ModelCallEndEvent model_call_end = 19;
  }
}

message RunStartedEvent {
  string thread_id = 1;
  string run_id = 2;
}

enum RunCompletionStatus {
  RUN_COMPLETION_STATUS_UNSPECIFIED = 0;
  RUN_COMPLETION_STATUS_COMPLETED = 1;
  RUN_COMPLETION_STATUS_FAILED = 2;
  RUN_COMPLETION_STATUS_BLOCKED = 3;
}

message RunFinishedEvent {
  string thread_id = 1;
  string run_id = 2;
  google.protobuf.Any result = 3;
  RunCompletionStatus status = 4;
}

message GAgentDraftRunResultPayload {
  string output = 1;
}

message RunErrorEvent {
  string message = 1;
  google.protobuf.StringValue run_id = 2;
  google.protobuf.StringValue code = 3;
}

message StepStartedEvent {
  string step_name = 1;
}

message StepFinishedEvent {
  string step_name = 1;
}

message TextMessageStartEvent {
  string message_id = 1;
  string role = 2;
}

message TextMessageContentEvent {
  string message_id = 1;
  string delta = 2;
}

message TextMessageEndEvent {
  string message_id = 1;
}

message StateSnapshotEvent {
  google.protobuf.Any snapshot = 1;
}

message ToolCallStartEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 3;
}

message ToolCallEndEvent {
  string tool_call_id = 1;
  google.protobuf.StringValue result = 2;
}

message HumanInputRequestEvent {
  string step_id = 1;
  string run_id = 2;
  string suspension_type = 3;
  string prompt = 4;
  int32 timeout_seconds = 5;
  string variable_name = 6;
  repeated string options = 7;
}

message HumanInputResponseEvent {
  string step_id = 1;
  string run_id = 2;
  bool approved = 3;
  google.protobuf.StringValue user_input = 4;
}

message UsageEvent {
  bool available = 1;
  int32 prompt_tokens = 2;
  int32 completion_tokens = 3;
  int32 total_tokens = 4;
  google.protobuf.StringValue model = 5;
  google.protobuf.DoubleValue cost = 6;
  google.protobuf.Int64Value latency_ms = 7;
}

// One exact provider invocation. The tool names are the server-authorized
// catalog actually supplied to this model round, not a browser inference from
// later tool calls.
message ModelCallStartEvent {
  string operation_id = 1;
  string session_id = 2;
  int32 round = 3;
  string model = 4;
  string provider = 5;
  string input_summary = 6;
  repeated string available_tool_names = 7;
}

message ModelCallEndEvent {
  string operation_id = 1;
  string session_id = 2;
  int32 round = 3;
  string model = 4;
  string content = 5;
  string reasoning_content = 6;
  UsageEvent usage = 7;
  string finish_reason = 8;
  bool success = 9;
  string error = 10;
}

message CustomEvent {
  string name = 1;
  google.protobuf.Any payload = 2;
}
