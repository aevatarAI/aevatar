syntax = "proto3";

package aevatar.ai.tool_providers;

import "google/protobuf/struct.proto";

option csharp_namespace = "Aevatar.AI.Abstractions.ToolProviders";

enum AgentToolExecutionOwnerKind {
  AGENT_TOOL_EXECUTION_OWNER_KIND_UNSPECIFIED = 0;
  AGENT_TOOL_EXECUTION_OWNER_KIND_ACTOR = 1;
  AGENT_TOOL_EXECUTION_OWNER_KIND_SCOPE = 2;
  AGENT_TOOL_EXECUTION_OWNER_KIND_WORKFLOW_RUN = 3;
  AGENT_TOOL_EXECUTION_OWNER_KIND_CHANNEL_REGISTRATION = 4;
  AGENT_TOOL_EXECUTION_OWNER_KIND_CONNECTOR = 5;
  AGENT_TOOL_EXECUTION_OWNER_KIND_HOST_SERVICE = 6;
}

message AgentToolExecutionOwner {
  AgentToolExecutionOwnerKind kind = 1;
  string owner_id = 2;
}

enum AgentToolReplayPolicy {
  AGENT_TOOL_REPLAY_POLICY_UNSPECIFIED = 0;
  AGENT_TOOL_REPLAY_POLICY_READ_ONLY_RETRYABLE = 1;
  AGENT_TOOL_REPLAY_POLICY_IDEMPOTENT_RETRYABLE = 2;
  AGENT_TOOL_REPLAY_POLICY_RECONCILABLE = 3;
  AGENT_TOOL_REPLAY_POLICY_NON_REPLAYABLE = 4;
}

message AgentToolAdmissionFact {
  string admission_id = 1;
  string request_id = 2;
  string tool_call_id = 3;
  string tool_name = 4;
  string arguments_sha256 = 5;
  AgentToolExecutionOwner execution_owner = 6;
  int64 issued_at_unix_ms = 7;
  string operation_id = 8;
  AgentToolReplayPolicy replay_policy = 9;
  reserved 10;
  reserved "admission_kind";
}

enum AgentToolOperationAuthorizationBasisPayload {
  AGENT_TOOL_OPERATION_AUTHORIZATION_BASIS_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_OPERATION_AUTHORIZATION_BASIS_PAYLOAD_PUBLISHED_CONTRACT = 1;
  AGENT_TOOL_OPERATION_AUTHORIZATION_BASIS_PAYLOAD_EXPLICIT_REQUEST = 2;
}

enum AgentToolOperationRiskPayload {
  AGENT_TOOL_OPERATION_RISK_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_OPERATION_RISK_PAYLOAD_READ_ONLY = 1;
  AGENT_TOOL_OPERATION_RISK_PAYLOAD_WRITE = 2;
  AGENT_TOOL_OPERATION_RISK_PAYLOAD_DESTRUCTIVE = 3;
}

enum AgentToolOperationApprovalPayload {
  AGENT_TOOL_OPERATION_APPROVAL_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_OPERATION_APPROVAL_PAYLOAD_NONE = 1;
  AGENT_TOOL_OPERATION_APPROVAL_PAYLOAD_REQUIRED = 2;
}

enum AgentToolOperationEnforcementOwnerPayload {
  AGENT_TOOL_OPERATION_ENFORCEMENT_OWNER_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_OPERATION_ENFORCEMENT_OWNER_PAYLOAD_AEVATAR = 1;
  AGENT_TOOL_OPERATION_ENFORCEMENT_OWNER_PAYLOAD_NYX_ID = 2;
}

enum AgentToolOperationExecutionModePayload {
  AGENT_TOOL_OPERATION_EXECUTION_MODE_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_OPERATION_EXECUTION_MODE_PAYLOAD_INTERACTIVE = 1;
  AGENT_TOOL_OPERATION_EXECUTION_MODE_PAYLOAD_DURABLE = 2;
}

enum AgentToolOperationParameterLocationPayload {
  AGENT_TOOL_OPERATION_PARAMETER_LOCATION_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_OPERATION_PARAMETER_LOCATION_PAYLOAD_PATH = 1;
  AGENT_TOOL_OPERATION_PARAMETER_LOCATION_PAYLOAD_QUERY = 2;
  AGENT_TOOL_OPERATION_PARAMETER_LOCATION_PAYLOAD_HEADER = 3;
}

enum AgentToolOperationValueKindPayload {
  AGENT_TOOL_OPERATION_VALUE_KIND_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_OPERATION_VALUE_KIND_PAYLOAD_STRING = 1;
  AGENT_TOOL_OPERATION_VALUE_KIND_PAYLOAD_INTEGER = 2;
  AGENT_TOOL_OPERATION_VALUE_KIND_PAYLOAD_NUMBER = 3;
  AGENT_TOOL_OPERATION_VALUE_KIND_PAYLOAD_BOOLEAN = 4;
  AGENT_TOOL_OPERATION_VALUE_KIND_PAYLOAD_OBJECT = 5;
  AGENT_TOOL_OPERATION_VALUE_KIND_PAYLOAD_ARRAY = 6;
}

message AgentToolPublishedEndpointIdentityPayload {
  string endpoint_id = 1;
}

message AgentToolAuthoredRequestIdentityPayload {
  string request_contract_digest = 1;
}

message AgentToolOperationSchemaPropertyPayload {
  string name = 1;
  AgentToolOperationValueSchemaPayload schema = 2;
}

message AgentToolOperationValueSchemaPayload {
  AgentToolOperationValueKindPayload kind = 1;
  repeated AgentToolOperationSchemaPropertyPayload properties = 2;
  repeated string required_properties = 3;
  AgentToolOperationValueSchemaPayload items = 4;
  repeated string allowed_values = 5;
  bool additional_properties_allowed = 6;
}

message AgentToolOperationParameterPayload {
  string name = 1;
  AgentToolOperationParameterLocationPayload location = 2;
  bool required = 3;
  AgentToolOperationValueSchemaPayload schema = 4;
}

message AgentToolOperationRequestBodyPayload {
  bool required = 1;
  string media_type = 2;
  AgentToolOperationValueSchemaPayload schema = 3;
}

message AgentToolOperationResponsePolicyPayload {
  bool text_allowed = 1;
  bool file_artifact_allowed = 2;
  repeated string media_types = 3;
}

message AgentToolOperationExecutionPolicyPayload {
  AgentToolOperationRiskPayload risk = 1;
  AgentToolOperationApprovalPayload approval = 2;
  AgentToolOperationEnforcementOwnerPayload enforcement_owner = 3;
  repeated AgentToolOperationExecutionModePayload allowed_execution_modes = 4;
}

enum AgentToolReadBackMatchPayload {
  AGENT_TOOL_READ_BACK_MATCH_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_READ_BACK_MATCH_PAYLOAD_EXISTS = 1;
  AGENT_TOOL_READ_BACK_MATCH_PAYLOAD_ABSENT = 2;
  AGENT_TOOL_READ_BACK_MATCH_PAYLOAD_EQUALS = 3;
  AGENT_TOOL_READ_BACK_MATCH_PAYLOAD_ARRAY_CONTAINS_EQUALS = 4;
}

enum AgentToolReadBackExpectedValueSourcePayload {
  AGENT_TOOL_READ_BACK_EXPECTED_VALUE_SOURCE_PAYLOAD_FROZEN_VALUE = 0;
  AGENT_TOOL_READ_BACK_EXPECTED_VALUE_SOURCE_PAYLOAD_PROVIDER_RESOURCE_ID = 1;
}

message AgentToolReadBackAssertionPayload {
  AgentToolReadBackMatchPayload match = 1;
  // RFC 6901 pointer within the bounded read projection's data member.
  string json_pointer = 2;
  google.protobuf.Value expected_value = 3;
  // RFC 6901 pointer within each array element for ARRAY_CONTAINS_EQUALS.
  string element_json_pointer = 4;
  AgentToolReadBackExpectedValueSourcePayload expected_value_source = 5;
}

// Server-sealed read-back contract for proving whether an effect was applied.
// The read operation must itself be a read-only admitted exact selector and may
// not contain another read-back contract.
message AgentToolOperationReadBackPayload {
  AgentToolOperationAdmissionPayload read_operation = 1;
  google.protobuf.Struct arguments = 2;
  AgentToolReadBackAssertionPayload assertion = 3;
  string check_name = 4;
}

// Credential-free authorization fence captured from the exact model-visible
// tool definition. Recovery may use it only to re-match the same current tool;
// it is never an executable capability by itself.
message AgentToolDurableAuthorizationSnapshotPayload {
  bool has_requires_approval = 1;
  bool requires_approval = 2;
  bool is_read_only = 3;
  bool is_destructive = 4;
  string side_effect_kind = 5;
  string tool_definition_fingerprint = 6;
}

// Exact server-sealed operation admission persisted with an actor-owned tool intent.
// Credential material is deliberately absent and must be resolved again for recovery.
message AgentToolOperationAdmissionPayload {
  string service_instance_id = 1;
  string service_slug = 2;
  oneof identity {
    AgentToolPublishedEndpointIdentityPayload published_endpoint = 3;
    AgentToolAuthoredRequestIdentityPayload authored_request = 4;
  }
  AgentToolOperationAuthorizationBasisPayload authorization_basis = 5;
  string http_method = 6;
  string path_template = 7;
  string contract_digest = 8;
  repeated AgentToolOperationParameterPayload parameters = 9;
  AgentToolOperationRequestBodyPayload request_body = 10;
  AgentToolOperationResponsePolicyPayload response_policy = 11;
  AgentToolOperationExecutionPolicyPayload execution_policy = 12;
  string catalog_digest = 13;
  AgentToolOperationReadBackPayload read_back = 14;
  AgentToolDurableAuthorizationSnapshotPayload durable_authorization = 15;
}
