}

// Self-continuation: local approval timeout fired → escalate to NyxID remote.
message ToolApprovalTimeoutFiredEvent {
  string request_id = 1;
  string session_id = 2;
}

message RemoteToolApprovalSubmittedEvent {
  string request_id = 1;
  string remote_approval_id = 2;
  reserved 3;
  reserved "status_check_callback_id";
  int32 status_check_attempt = 4;
  int64 expires_at_unix_ms = 5;
}

message ToolApprovalRemoteStatusCheckFiredEvent {
  string request_id = 1;
  string session_id = 2;
  string remote_approval_id = 3;
  int32 attempt = 4;
}
