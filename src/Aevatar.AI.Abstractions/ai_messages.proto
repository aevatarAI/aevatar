syntax = "proto3";
package aevatar.ai;
option csharp_namespace = "Aevatar.AI.Abstractions";

import "Credentials/credential_secret_references.proto";
import "Protos/voice_presence.proto";
import "ToolProviders/agent_tool_admission.proto";
import "Tools/tool_presentation.proto";
import "google/protobuf/timestamp.proto";
import "llm_selection.proto";

enum ChatContentPartKind {
  CHAT_CONTENT_PART_KIND_UNSPECIFIED = 0;
  CHAT_CONTENT_PART_KIND_TEXT = 1;
  CHAT_CONTENT_PART_KIND_IMAGE = 2;
  CHAT_CONTENT_PART_KIND_AUDIO = 3;
  CHAT_CONTENT_PART_KIND_VIDEO = 4;
}

enum ChatFileSourceKind {
  CHAT_FILE_SOURCE_KIND_UNSPECIFIED = 0;
  CHAT_FILE_SOURCE_KIND_CHAT_INPUT = 1;
  CHAT_FILE_SOURCE_KIND_FORM_UPLOAD = 2;
  CHAT_FILE_SOURCE_KIND_CONNECTED_SERVICE_RESOURCE = 3;
  CHAT_FILE_SOURCE_KIND_EXTERNAL_RESOURCE = 4;
  CHAT_FILE_SOURCE_KIND_GENERATED = 5;
}

message ChatContentPart {
  ChatContentPartKind kind = 1;
  string text = 2;
  string data_base64 = 3;
  string media_type = 4;
  string uri = 5;
  string name = 6;
  ChatFileRef file_ref = 7;
}

message ChatFileRef {
  string file_id = 1;
  string artifact_id = 2;
  ChatFileSourceKind source_kind = 3;
  string source_message_id = 4;
  string source_resource_key = 5;
  string file_name = 6;
  string media_type = 7;
  int64 size_bytes = 8;
  string sha256 = 9;
  int64 created_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  string owner_run_id = 12;
  string owner_scope_id = 13;
}

message ChatRequestEvent  {
  string prompt = 1;
  string session_id = 2;
  map<string, string> headers = 3;
  int32 timeout_ms = 4;
  string scope_id = 5;
  repeated ChatContentPart input_parts = 6;
  map<string, string> metadata = 7;
  AgentToolExecutionContextPayload tool_context = 8;
  // Refactor (iter56/cluster-917-workflow-llm-control-metadata): old=Headers/Metadata bag for control fields, new=typed ChatRequestEvent.Telegram
  TelegramBridgeRequest telegram = 9;
  // Narrow LLM-control carrier. Model routing, NyxID credentials and tool-round limits
  // belong here, not in metadata or tool_context.
  LLMControlContextPayload llm_control = 10;
  // Refactor (iter169/cluster-issue1551): Old pattern: connector HTTP authorization used Metadata["connector.http.authorization"] as an authority carrier. New principle: connector authorization is a typed command payload field owned by workflow execution.
  string connector_http_authorization = 11;
  aevatar.credentials.DurableCallerCredentialRef caller_durable_credential = 12;
  RoleChatRunContext run_context = 13;
  // Identity of this dispatch attempt. It is distinct from session_id, which
  // remains the idempotent turn identity and may already name a final session.
  string command_attempt_id = 14;
  WorkflowLlmToolApprovalContinuation workflow_llm_tool_approval_continuation = 15;
  AgentToolNyxIdCredentialKindPayload caller_nyx_id_credential_kind = 16;
  string caller_source_readable_nyx_id_bearer_token = 17;
  WorkflowLlmCompletionDeliveryContext workflow_llm_completion_delivery_context = 18;
}
message ChatResponseEvent { string content = 1; string session_id = 2; }

// Live terminal observation used when an idempotent caller retries a session
// whose committed outcome cannot be represented as a successful text end.
message RoleChatSessionErrorEvent {
  string session_id = 1;
  RoleChatSessionOutcome outcome = 2;
  string reason = 3;
  string message = 4;
}

message RoleChatRunContext {
  string run_id = 1;
  string command_id = 2;
  string correlation_id = 3;
  string completion_notification_actor_id = 4;
  string completion_notification_delivery_id = 5;
  int64 completion_notification_expires_at_unix_ms = 6;
}

message LLMControlContextPayload {
  string nyx_id_access_token = 1;
  string nyx_id_org_token = 2;
  string sender_nyx_id_access_token = 3;
  string model_override = 4;
  string nyx_id_route_preference = 5;
  optional int32 max_tool_rounds_override = 6;
  string user_memory_prompt = 7;
  LLMRouteTarget route_target = 8;
}

enum TelegramBridgeOperation {
  TELEGRAM_BRIDGE_OPERATION_UNSPECIFIED = 0;
  TELEGRAM_BRIDGE_OPERATION_SEND_MESSAGE = 1;
  TELEGRAM_BRIDGE_OPERATION_WAIT_REPLY = 2;
  TELEGRAM_BRIDGE_OPERATION_ENSURE_LOGIN = 3;
}

message TelegramBridgeRequest {
  string connector_name = 1;
  TelegramBridgeOperation operation = 2;
  string chat_id = 3;
  int64 message_thread_id = 4;
  string text = 5;
  string parse_mode = 6;
  optional bool disable_web_page_preview = 7;
  int64 reply_to_message_id = 8;
  string expected_from_user_id = 9;
  string expected_from_username = 10;
  string correlation_contains = 11;
  optional int32 wait_timeout_ms = 12;
  optional int32 poll_timeout_seconds = 13;
  optional int32 settle_polls_after_match = 14;
  bool collect_all_replies = 15;
  optional bool start_from_latest = 16;
  int64 offset = 17;
  string http_method = 18;
  string content_type = 19;
  optional int32 timeout_ms = 20;
  string phone_number = 21;
  string verification_code = 22;
  string password = 23;
  bool emit_chat_response = 24;
  string run_id = 25;
  string step_id = 26;
}

// Refactor (iter24/cluster-002-agent-tool-context-generic-metadata-bag):
//   Old pattern: tool credentials, caller, routing and channel facts lived in Metadata.
//   New principle: tool control semantics are typed context fields; Metadata is not the internal control plane.
message AgentToolExecutionContextPayload {
  AgentToolRequestIdentityPayload request = 1;
  AgentToolCredentialsPayload credentials = 2;
  AgentToolCallerContextPayload caller = 3;
  AgentToolChannelContextPayload channel = 4;
  AgentToolSenderBindingContextPayload sender_binding = 5;
  LLMRequestRoutingContextPayload routing = 6;
  AgentToolConnectedServicesContextPayload connected_services = 7;
  map<string, string> external_metadata = 8;
  AgentSkillRecoveryContextPayload skill_recovery = 9;
  AgentWorkflowRuntimeContextPayload workflow_runtime = 10;
  AgentToolVisibilityScopePayload tool_visibility = 11;
  AgentToolCredentialSourcePayload credential_source = 12;
  AgentToolScheduleContextPayload schedule = 13;
  AgentToolNyxIdAuthorityContextPayload nyx_id_authority = 14;
  AgentToolInvocationSurfacePayload invocation_surface = 15;
  repeated ChatFileRef input_file_refs = 16;
  AgentChatInvocationContextPayload chat = 17;
  aevatar.ai.tool_providers.AgentToolExecutionOwner execution_owner = 18;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 19;
  // Server-sealed NyxID credential handle inherited by nested workflow/service calls.
  // Never contains raw bearer or Agent Key material.
  aevatar.credentials.DurableCallerCredentialRef durable_nyx_id_credential = 20;
}

enum AgentChatInvocationSurfacePayload {
  AGENT_CHAT_INVOCATION_SURFACE_PAYLOAD_UNSPECIFIED = 0;
  AGENT_CHAT_INVOCATION_SURFACE_PAYLOAD_NYXID_ASSISTANT = 1;
  AGENT_CHAT_INVOCATION_SURFACE_PAYLOAD_WORKFLOW_CHAT = 2;
}

message AgentChatInvocationContextPayload {
  AgentChatInvocationSurfacePayload surface = 1;
  string conversation_id = 2;
  string turn_id = 3;
  string task_id = 4;
  string step_id = 5;
  string action_request_id = 6;
}

enum AgentToolInvocationSurfacePayload {
  AGENT_TOOL_INVOCATION_SURFACE_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_INVOCATION_SURFACE_PAYLOAD_HUMAN_SESSION = 1;
  AGENT_TOOL_INVOCATION_SURFACE_PAYLOAD_WORKFLOW_TOOL_CALL = 2;
  AGENT_TOOL_INVOCATION_SURFACE_PAYLOAD_WORKFLOW_LLM_TOOL_LOOP = 3;
}

enum AgentToolCredentialSourcePayload {
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_NYXID_ASSERTION = 1;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_BEARER_TOKEN = 2;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_CHANNEL_REGISTRATION = 3;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_SCHEDULED_RUN = 4;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_SYSTEM = 5;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_SERVICE_ACCOUNT = 6;
}

message AgentSkillRecoveryContextPayload {
  bool require_initial_ornn_search = 1;
  bool require_ornn_search_on_blocker = 2;
  string command_name = 3;
  string original_command = 4;
  string primary_skill_name = 5;
  int32 max_ornn_search_attempts = 6;
  string command_arguments = 7;
  bool discovery_requested = 8;
  // Explicit named-skill invocations must not inherit prior assistant/tool output
  // that could satisfy a new invocation without creating a new workflow run.
  bool isolate_prior_conversation_history = 9;
  // True only when the caller explicitly requested mounting the skill's workflows.
  bool mount_workflows_requested = 10;
}

message AgentToolVisibilityScopePayload {
  repeated string allowed_tool_names = 1;
}

message AgentToolRequestIdentityPayload {
  string request_id = 1;
  string call_id = 2;
  string idempotency_key = 3;
  int64 issued_at_unix_ms = 4;
  string operation_id = 5;
  int64 operation_generation = 6;
}

message NyxIdExactServiceApprovalAuthority {
  string request_id = 1;
  string user_service_id = 2;
  string endpoint_id = 3;
  string catalog_digest = 4;
  string endpoint_contract_digest = 5;
  string operation_digest = 6;
  string operation_id = 7;
  int64 operation_generation = 8;
  string idempotency_key = 9;
  google.protobuf.Timestamp expires_at = 10;
}

// Recovery-safe subset of tool execution context. Credential material and
// open external bags are deliberately absent; recovery resolves authority
// again from durable, server-sealed references owned by the actor command.
message AgentToolRecoveryContextPayload {
  AgentToolRequestIdentityPayload request = 1;
  AgentToolCallerContextPayload caller = 2;
  AgentToolChannelContextPayload channel = 3;
  AgentToolSenderBindingContextPayload sender_binding = 4;
  LLMRequestRoutingContextPayload routing = 5;
  AgentSkillRecoveryCheckpointPayload skill_recovery = 6;
  AgentWorkflowRuntimeContextPayload workflow_runtime = 7;
  AgentToolVisibilityScopePayload tool_visibility = 8;
  AgentToolCredentialSourcePayload credential_source = 9;
  AgentToolScheduleContextPayload schedule = 10;
  AgentToolNyxIdAuthorityContextPayload nyx_id_authority = 11;
  AgentToolInvocationSurfacePayload invocation_surface = 12;
  repeated ChatFileRef input_file_refs = 13;
  AgentChatInvocationContextPayload chat = 14;
  aevatar.ai.tool_providers.AgentToolExecutionOwner execution_owner = 15;
  AgentToolNyxIdCredentialKindPayload nyx_id_credential_kind = 16;
  bool requires_nyx_id_access_token = 17;
  bool requires_nyx_id_org_token = 18;
  bool requires_sender_nyx_id_access_token = 19;
  bool requires_source_readable_nyx_id_access_token = 20;
  aevatar.ai.tool_providers.AgentToolOperationAdmissionPayload operation_admission = 21;
  AgentToolNyxIdCredentialAuthorityPayload nyx_id_credential_authority = 22;
}

message AgentSkillRecoveryCheckpointPayload {
  bool require_initial_ornn_search = 1;
  bool require_ornn_search_on_blocker = 2;
  string command_name = 3;
  string primary_skill_name = 4;
  int32 max_ornn_search_attempts = 5;
  bool discovery_requested = 6;
  bool isolate_prior_conversation_history = 7;
  bool mount_workflows_requested = 8;
}

enum AgentToolNyxIdCredentialKindPayload {
  AGENT_TOOL_NYX_ID_CREDENTIAL_KIND_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_NYX_ID_CREDENTIAL_KIND_PAYLOAD_SOURCE_READABLE_USER_BEARER = 1;
  AGENT_TOOL_NYX_ID_CREDENTIAL_KIND_PAYLOAD_PROXY_DELEGATION = 2;
  AGENT_TOOL_NYX_ID_CREDENTIAL_KIND_PAYLOAD_AGENT_KEY = 3;
}

enum AgentToolNyxIdCredentialAuthorityPayload {
  AGENT_TOOL_NYX_ID_CREDENTIAL_AUTHORITY_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_NYX_ID_CREDENTIAL_AUTHORITY_PAYLOAD_TOOL_EXECUTION_CONTEXT = 1;
}

message AgentToolCredentialsPayload {
  string nyx_id_access_token = 1;
  string nyx_id_org_token = 2;
  string sender_nyx_id_access_token = 3;
  AgentToolNyxIdCredentialKindPayload nyx_id_credential_kind = 4;
  string source_readable_nyx_id_access_token = 5;
  AgentToolNyxIdCredentialAuthorityPayload nyx_id_credential_authority = 6;
}

message AgentToolCallerContextPayload {
  string scope_id = 1;
  string owner_subject = 2;
  string response_id = 3;
  string owner_scope_id = 4;
}

message AgentToolNyxIdAuthorityContextPayload {
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
  string scope = 4;
}

message WorkflowLlmToolApprovalContinuation {
  string run_id = 1;
  string step_id = 2;
  string session_id = 3;
  repeated string tool_set_refs = 4;
  repeated string allowed_tool_names = 5;
  bool restrict_tool_sets = 6;
  bool restrict_allowed_tool_names = 7;
  string model = 8;
  optional int32 max_tool_rounds = 9;
  string user_memory_prompt = 10;
  string route_preference = 11;
  int32 timeout_ms = 12;
  // The role-chat session whose committed ContinuationPrepared checkpoint
  // directly owns this continuation target. This is not the workflow session id.
  string direct_parent_role_chat_session_id = 13;
  string tool_catalog_policy_version = 14;
}

message WorkflowLlmCompletionDeliveryContext {
  string run_id = 1;
  string step_id = 2;
  string session_id = 3;
}

message AgentToolChannelContextPayload {
  reserved 7;
  reserved "durable_reply_credential_ref";
  string platform = 1;
  string sender_id = 2;
  string registration_scope_id = 3;
  string message_id = 4;
  string platform_message_id = 5;
  string delivery_target_id = 6;
  ChannelWorkflowResultDeliveryCredential workflow_result_delivery_credential = 8;
  string bot_registration_id = 9;
  repeated AgentToolChannelIdentityHintPayload identity_hints = 10;
}

message AgentToolChannelIdentityHintPayload {
  string subject = 1;
  string kind = 2;
  string value = 3;
}

// Typed handle for a channel bot's workflow terminal-result delivery credential.
// Carries the vault SecretReference plus the NyxID agent api-key id it authorizes
// (the vault subject); never the secret material itself.
message ChannelWorkflowResultDeliveryCredential {
  aevatar.credentials.SecretReference secret_reference = 1;
  string subject_id = 2;
}

message AgentToolSenderBindingContextPayload {
  string binding_id = 1;
  string nyx_user_id = 2;
  // External-subject tenant for the bound sender (e.g. Lark open_tenant_id).
  // Identity fact (not a credential), so it survives the transient-credential
  // strip and crosses the deferred-run boundary. Lets the deferred reply run
  // rebuild the exact ExternalSubjectRef and re-mint a sender token by
  // binding id without re-deriving tenant from registration scope.
  string sender_tenant = 3;
}

message LLMRequestRoutingContextPayload {
  string model_override = 1;
  string nyx_id_route_preference = 2;
  optional int32 max_tool_rounds_override = 3;
  string user_memory_prompt = 4;
  LLMRouteTarget route_target = 5;
}

message AgentToolConnectedServicesContextPayload {
  string context_json = 1;
}

message AgentWorkflowRuntimeContextPayload {
  string parent_actor_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string root_run_id = 4;
  int32 depth = 5;
}

message AgentToolScheduleContextPayload {
  string schedule_id = 1;
}

message TextMessageStartEvent   { string session_id = 1; string agent_id = 2; }
message TextMessageContentEvent { string delta = 1; string session_id = 2; }
message TextMessageReasoningEvent { string delta = 1; string session_id = 2; }
message MediaContentEvent { string session_id = 1; string agent_id = 2; ChatContentPart part = 3; }
message TextMessageEndEvent     { string content = 1; string session_id = 2; }

message ToolCallEvent {
  string tool_name = 1;
  string arguments_json = 2;
  string call_id = 3;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 4;
}

enum AgentToolReceiptStatus {
  AGENT_TOOL_RECEIPT_STATUS_UNSPECIFIED = 0;
  AGENT_TOOL_RECEIPT_STATUS_SUCCESS = 1;
  AGENT_TOOL_RECEIPT_STATUS_APPROVAL_REQUIRED = 2;
  AGENT_TOOL_RECEIPT_STATUS_DENIED = 3;
  AGENT_TOOL_RECEIPT_STATUS_ERROR = 4;
  AGENT_TOOL_RECEIPT_STATUS_AUTHORIZATION_REQUIRED = 5;
}

enum AgentToolReceiptApprovalMode {
  AGENT_TOOL_RECEIPT_APPROVAL_MODE_UNSPECIFIED = 0;
  AGENT_TOOL_RECEIPT_APPROVAL_MODE_NEVER_REQUIRE = 1;
  AGENT_TOOL_RECEIPT_APPROVAL_MODE_ALWAYS_REQUIRE = 2;
  AGENT_TOOL_RECEIPT_APPROVAL_MODE_AUTO = 3;
}

enum AgentToolReceiptEffect {
  AGENT_TOOL_RECEIPT_EFFECT_UNSPECIFIED = 0;
  AGENT_TOOL_RECEIPT_EFFECT_READ_ONLY = 1;
  AGENT_TOOL_RECEIPT_EFFECT_MUTATING = 2;
}

enum AgentToolReceiptMutationStage {
  AGENT_TOOL_RECEIPT_MUTATION_STAGE_UNSPECIFIED = 0;
  AGENT_TOOL_RECEIPT_MUTATION_STAGE_ACCEPTED = 1;
  AGENT_TOOL_RECEIPT_MUTATION_STAGE_READ_MODEL_OBSERVED = 2;
}

enum AgentToolFailureOutcome {
  AGENT_TOOL_FAILURE_OUTCOME_UNSPECIFIED = 0;
  AGENT_TOOL_FAILURE_OUTCOME_CALLEE_CONFIRMED = 1;
  AGENT_TOOL_FAILURE_OUTCOME_OUTCOME_UNCERTAIN = 2;
}

enum NyxIdApprovalDecisionMode {
  NYX_ID_APPROVAL_DECISION_MODE_UNSPECIFIED = 0;
  NYX_ID_APPROVAL_DECISION_MODE_PER_REQUEST = 1;
  NYX_ID_APPROVAL_DECISION_MODE_GRANT = 2;
}

enum NyxIdApprovalTerminalOutcome {
  NYX_ID_APPROVAL_TERMINAL_OUTCOME_UNSPECIFIED = 0;
  NYX_ID_APPROVAL_TERMINAL_OUTCOME_REJECTED = 1;
  NYX_ID_APPROVAL_TERMINAL_OUTCOME_EXPIRED = 2;
  NYX_ID_APPROVAL_TERMINAL_OUTCOME_TIMED_OUT = 3;
}

message NyxIdAuthorizationRequiredEvent {
  string service_slug = 1;
  optional string service_label = 2;
  optional string resource_uri = 3;
  string reason_code = 4;
  string safe_message = 5;
  optional string user_service_id = 6;
  repeated string requested_scopes = 7;
  NyxIdKeyCreateActionRequirement key_create = 8;
  NyxIdKeyRotateActionRequirement key_rotate = 9;
}

message NyxIdKeyCreateActionRequirement {
  string name = 1;
  string platform = 2;
  repeated string allowed_service_ids = 3;
}

message NyxIdKeyRotateActionRequirement {
  string key_id = 1;
}

message AgentToolReceipt {
  string call_id = 1;
  string tool_name = 2;
  AgentToolReceiptStatus status = 3;
  AgentToolReceiptApprovalMode approval_mode = 4;
  bool is_destructive = 5;
  string side_effect_kind = 6;
  string subject_kind = 7;
  string subject_id = 8;
  string subject_version = 9;
  string subject_hash = 10;
  string approval_request_id = 11;
  string error_code = 12;
  string error_message = 13;
  string result_json = 14;
  ManagedWorkflowHandoffReceipt managed_workflow_handoff = 15;
  WorkflowRunBackgroundDeliveryReceipt workflow_run_delivery = 16;
  NyxIdAuthorizationRequiredEvent authorization_required = 17;
  AgentToolReceiptEffect effect = 18;
  // Opaque identity assigned by the external provider to the affected resource.
  // Raw provider responses remain transient; reconciliation persists only this ID.
  string provider_resource_id = 19;
  // NyxID-owned approval semantics. This is intentionally separate from the
  // local tool approval mode above; omitted boundary data remains unknown.
  NyxIdApprovalDecisionMode nyx_id_approval_decision_mode = 20;
  AgentToolReceiptMutationStage mutation_stage = 21;
  NyxIdApprovalTerminalOutcome nyx_id_approval_terminal_outcome = 22;
  NyxIdExactServiceApprovalAuthority exact_service_approval = 23;
  AgentToolFailureOutcome failure_outcome = 24;
}

enum AgentToolCancellationAuditOutcomeKind {
  AGENT_TOOL_CANCELLATION_AUDIT_OUTCOME_KIND_UNSPECIFIED = 0;
  AGENT_TOOL_CANCELLATION_AUDIT_OUTCOME_KIND_EXECUTED = 1;
  AGENT_TOOL_CANCELLATION_AUDIT_OUTCOME_KIND_FAILED = 2;
}

enum AgentToolCancellationAuditFailureStage {
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_UNSPECIFIED = 0;
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_NONE = 1;
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_REQUEST_VALIDATION = 2;
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_CLASSIFICATION = 3;
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_CREDENTIAL_POLICY = 4;
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_APPROVAL = 5;
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_ADMISSION = 6;
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_TERMINAL_EXECUTION = 7;
  AGENT_TOOL_CANCELLATION_AUDIT_FAILURE_STAGE_TERMINAL_AUDIT = 8;
}

// Adapter-owned payload persisted opaquely by the workflow actor. It freezes every
// tool/audit semantic that must survive callback redelivery without re-running the provider.
message AgentToolCancellationAuditIntentPayload {
  string result_json = 1;
  AgentToolReceipt receipt = 2;
  bool is_mutation = 3;
  string failure_code = 4;
  string safe_message = 5;
  bool terminal_invoked = 6;
  bool retryable = 7;
  optional bool requires_approval = 8;
  bool is_read_only = 9;
  bool is_destructive = 10;
  AgentToolCancellationAuditOutcomeKind outcome_kind = 11;
  AgentToolCancellationAuditFailureStage failure_stage = 12;
}

message ManagedWorkflowHandoffReceipt {
  string parent_actor_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string invocation_id = 4;
  string child_run_id = 5;
  string stream_topic = 6;
}

message WorkflowRunBackgroundDeliveryReceipt {
  reserved 10, 12;
  reserved "bot_agent_key_id", "durable_reply_credential_ref";
  string delivery_actor_id = 1;
  string workflow_actor_id = 2;
  string workflow_run_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  string stream_topic = 6;
  string channel_platform = 7;
  string reply_message_id = 8;
  string platform_message_id = 9;
  string registration_scope_id = 11;
}

message ToolResultEvent {
  string call_id = 1;
  string result_json = 2;
  bool success = 3;
  string error = 4;
  AgentToolReceipt receipt = 5;
}
message TokenUsagePayload {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}
message ChatTokenUsageEvent {
  string session_id = 1;
  TokenUsagePayload usage = 2;
  string model = 3;
}

enum RoleChatRecoveryCheckpointStage {
  ROLE_CHAT_RECOVERY_CHECKPOINT_STAGE_UNSPECIFIED = 0;
  ROLE_CHAT_RECOVERY_CHECKPOINT_STAGE_MODEL_READY = 1;
  ROLE_CHAT_RECOVERY_CHECKPOINT_STAGE_TOOL_BATCH_PREPARED = 2;
  ROLE_CHAT_RECOVERY_CHECKPOINT_STAGE_WAITING_APPROVAL = 3;
  ROLE_CHAT_RECOVERY_CHECKPOINT_STAGE_CONTINUATION_PREPARED = 4;
}

message RoleChatToolIntentState {
  string operation_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string arguments_sha256 = 4;
  aevatar.ai.tool_providers.AgentToolReplayPolicy replay_policy = 5;
  AgentToolRecoveryContextPayload recovery_context = 6;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 7;
  aevatar.credentials.SecretReference arguments_reference = 8;
  int32 round = 9;
}

message RoleChatToolCompletionState {
  string operation_id = 1;
  string result_sha256 = 2;
  google.protobuf.Timestamp completed_at = 3;
  aevatar.credentials.SecretReference result_reference = 4;
  bool success = 5;
  string safe_error_code = 6;
}

// Typed vault payload written before the actor commits the corresponding
// completion. Its deterministic reference is a first-result authority after
// a crash between the external effect and checkpoint persistence.
message RoleChatToolStoredResultPayload {
  string result_json = 1;
  bool success = 2;
  string safe_error_code = 3;
  AgentToolReceipt receipt = 4;
}

message RoleChatRecoveryCheckpoint {
  int64 generation = 1;
  RoleChatRecoveryCheckpointStage stage = 2;
  int32 round = 3;
  repeated RoleChatToolIntentState tool_intents = 4;
