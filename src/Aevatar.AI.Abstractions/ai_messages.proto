syntax = "proto3";
package aevatar.ai;
option csharp_namespace = "Aevatar.AI.Abstractions";

import "Credentials/credential_secret_references.proto";
import "Protos/voice_presence.proto";
import "Tools/tool_presentation.proto";
import "google/protobuf/timestamp.proto";

enum ChatContentPartKind {
  CHAT_CONTENT_PART_KIND_UNSPECIFIED = 0;
  CHAT_CONTENT_PART_KIND_TEXT = 1;
  CHAT_CONTENT_PART_KIND_IMAGE = 2;
  CHAT_CONTENT_PART_KIND_AUDIO = 3;
  CHAT_CONTENT_PART_KIND_VIDEO = 4;
}

enum ChatFileSourceKind {
  CHAT_FILE_SOURCE_KIND_UNSPECIFIED = 0;
  CHAT_FILE_SOURCE_KIND_CHAT_INPUT = 1;
  CHAT_FILE_SOURCE_KIND_FORM_UPLOAD = 2;
  CHAT_FILE_SOURCE_KIND_CONNECTED_SERVICE_RESOURCE = 3;
  CHAT_FILE_SOURCE_KIND_EXTERNAL_RESOURCE = 4;
  CHAT_FILE_SOURCE_KIND_GENERATED = 5;
}

message ChatContentPart {
  ChatContentPartKind kind = 1;
  string text = 2;
  string data_base64 = 3;
  string media_type = 4;
  string uri = 5;
  string name = 6;
  ChatFileRef file_ref = 7;
}

message ChatFileRef {
  string file_id = 1;
  string artifact_id = 2;
  ChatFileSourceKind source_kind = 3;
  string source_message_id = 4;
  string source_resource_key = 5;
  string file_name = 6;
  string media_type = 7;
  int64 size_bytes = 8;
  string sha256 = 9;
  int64 created_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  string owner_run_id = 12;
  string owner_scope_id = 13;
}

message ChatRequestEvent  {
  string prompt = 1;
  string session_id = 2;
  map<string, string> headers = 3;
  int32 timeout_ms = 4;
  string scope_id = 5;
  repeated ChatContentPart input_parts = 6;
  map<string, string> metadata = 7;
  AgentToolExecutionContextPayload tool_context = 8;
  // Refactor (iter56/cluster-917-workflow-llm-control-metadata): old=Headers/Metadata bag for control fields, new=typed ChatRequestEvent.Telegram
  TelegramBridgeRequest telegram = 9;
  // Narrow LLM-control carrier. Model routing, NyxID credentials and tool-round limits
  // belong here, not in metadata or tool_context.
  LLMControlContextPayload llm_control = 10;
  // Refactor (iter169/cluster-issue1551): Old pattern: connector HTTP authorization used Metadata["connector.http.authorization"] as an authority carrier. New principle: connector authorization is a typed command payload field owned by workflow execution.
  string connector_http_authorization = 11;
  aevatar.credentials.DurableCallerCredentialRef caller_durable_credential = 12;
  RoleChatRunContext run_context = 13;
  // Identity of this dispatch attempt. It is distinct from session_id, which
  // remains the idempotent turn identity and may already name a final session.
  string command_attempt_id = 14;
}
message ChatResponseEvent { string content = 1; string session_id = 2; }

message RoleChatRunContext {
  string run_id = 1;
  string command_id = 2;
  string correlation_id = 3;
  string completion_notification_actor_id = 4;
}

message LLMControlContextPayload {
  string nyx_id_access_token = 1;
  string nyx_id_org_token = 2;
  string sender_nyx_id_access_token = 3;
  string model_override = 4;
  string nyx_id_route_preference = 5;
  optional int32 max_tool_rounds_override = 6;
  string user_memory_prompt = 7;
}

enum TelegramBridgeOperation {
  TELEGRAM_BRIDGE_OPERATION_UNSPECIFIED = 0;
  TELEGRAM_BRIDGE_OPERATION_SEND_MESSAGE = 1;
  TELEGRAM_BRIDGE_OPERATION_WAIT_REPLY = 2;
  TELEGRAM_BRIDGE_OPERATION_ENSURE_LOGIN = 3;
}

message TelegramBridgeRequest {
  string connector_name = 1;
  TelegramBridgeOperation operation = 2;
  string chat_id = 3;
  int64 message_thread_id = 4;
  string text = 5;
  string parse_mode = 6;
  optional bool disable_web_page_preview = 7;
  int64 reply_to_message_id = 8;
  string expected_from_user_id = 9;
  string expected_from_username = 10;
  string correlation_contains = 11;
  optional int32 wait_timeout_ms = 12;
  optional int32 poll_timeout_seconds = 13;
  optional int32 settle_polls_after_match = 14;
  bool collect_all_replies = 15;
  optional bool start_from_latest = 16;
  int64 offset = 17;
  string http_method = 18;
  string content_type = 19;
  optional int32 timeout_ms = 20;
  string phone_number = 21;
  string verification_code = 22;
  string password = 23;
  bool emit_chat_response = 24;
  string run_id = 25;
  string step_id = 26;
}

// Refactor (iter24/cluster-002-agent-tool-context-generic-metadata-bag):
//   Old pattern: tool credentials, caller, routing and channel facts lived in Metadata.
//   New principle: tool control semantics are typed context fields; Metadata is not the internal control plane.
message AgentToolExecutionContextPayload {
  AgentToolRequestIdentityPayload request = 1;
  AgentToolCredentialsPayload credentials = 2;
  AgentToolCallerContextPayload caller = 3;
  AgentToolChannelContextPayload channel = 4;
  AgentToolSenderBindingContextPayload sender_binding = 5;
  LLMRequestRoutingContextPayload routing = 6;
  AgentToolConnectedServicesContextPayload connected_services = 7;
  map<string, string> external_metadata = 8;
  AgentSkillRecoveryContextPayload skill_recovery = 9;
  AgentWorkflowRuntimeContextPayload workflow_runtime = 10;
  AgentToolVisibilityScopePayload tool_visibility = 11;
  AgentToolCredentialSourcePayload credential_source = 12;
  AgentToolScheduleContextPayload schedule = 13;
  AgentToolNyxIdAuthorityContextPayload nyx_id_authority = 14;
}

enum AgentToolCredentialSourcePayload {
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_UNSPECIFIED = 0;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_NYXID_ASSERTION = 1;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_BEARER_TOKEN = 2;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_CHANNEL_REGISTRATION = 3;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_SCHEDULED_RUN = 4;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_SYSTEM = 5;
  AGENT_TOOL_CREDENTIAL_SOURCE_PAYLOAD_SERVICE_ACCOUNT = 6;
}

message AgentSkillRecoveryContextPayload {
  bool require_initial_ornn_search = 1;
  bool require_ornn_search_on_blocker = 2;
  string command_name = 3;
  string original_command = 4;
  string primary_skill_name = 5;
  int32 max_ornn_search_attempts = 6;
  string command_arguments = 7;
  bool discovery_requested = 8;
}

message AgentToolVisibilityScopePayload {
  repeated string allowed_tool_names = 1;
}

message AgentToolRequestIdentityPayload {
  string request_id = 1;
  string call_id = 2;
  string idempotency_key = 3;
}

message AgentToolCredentialsPayload {
  string nyx_id_access_token = 1;
  string nyx_id_org_token = 2;
  string sender_nyx_id_access_token = 3;
}

message AgentToolCallerContextPayload {
  string scope_id = 1;
  string owner_subject = 2;
  string response_id = 3;
  string owner_scope_id = 4;
}

message AgentToolNyxIdAuthorityContextPayload {
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
}

message AgentToolChannelContextPayload {
  reserved 7;
  reserved "durable_reply_credential_ref";
  string platform = 1;
  string sender_id = 2;
  string registration_scope_id = 3;
  string message_id = 4;
  string platform_message_id = 5;
  string delivery_target_id = 6;
  ChannelWorkflowResultDeliveryCredential workflow_result_delivery_credential = 8;
  string bot_registration_id = 9;
}

// Typed handle for a channel bot's workflow terminal-result delivery credential.
// Carries the vault SecretReference plus the NyxID agent api-key id it authorizes
// (the vault subject); never the secret material itself.
message ChannelWorkflowResultDeliveryCredential {
  aevatar.credentials.SecretReference secret_reference = 1;
  string subject_id = 2;
}

message AgentToolSenderBindingContextPayload {
  string binding_id = 1;
  string nyx_user_id = 2;
  // External-subject tenant for the bound sender (e.g. Lark open_tenant_id).
  // Identity fact (not a credential), so it survives the transient-credential
  // strip and crosses the deferred-run boundary. Lets the deferred reply run
  // rebuild the exact ExternalSubjectRef and re-mint a sender token by
  // binding id without re-deriving tenant from registration scope.
  string sender_tenant = 3;
}

message LLMRequestRoutingContextPayload {
  string model_override = 1;
  string nyx_id_route_preference = 2;
  optional int32 max_tool_rounds_override = 3;
  string user_memory_prompt = 4;
}

message AgentToolConnectedServicesContextPayload {
  string context_json = 1;
}

message AgentWorkflowRuntimeContextPayload {
  string parent_actor_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string root_run_id = 4;
  int32 depth = 5;
}

message AgentToolScheduleContextPayload {
  string schedule_id = 1;
}

message TextMessageStartEvent   { string session_id = 1; string agent_id = 2; }
message TextMessageContentEvent { string delta = 1; string session_id = 2; }
message TextMessageReasoningEvent { string delta = 1; string session_id = 2; }
message MediaContentEvent { string session_id = 1; string agent_id = 2; ChatContentPart part = 3; }
message TextMessageEndEvent     { string content = 1; string session_id = 2; }

message ToolCallEvent {
  string tool_name = 1;
  string arguments_json = 2;
  string call_id = 3;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 4;
}

enum AgentToolReceiptStatus {
  AGENT_TOOL_RECEIPT_STATUS_UNSPECIFIED = 0;
  AGENT_TOOL_RECEIPT_STATUS_SUCCESS = 1;
  AGENT_TOOL_RECEIPT_STATUS_APPROVAL_REQUIRED = 2;
  AGENT_TOOL_RECEIPT_STATUS_DENIED = 3;
  AGENT_TOOL_RECEIPT_STATUS_ERROR = 4;
  AGENT_TOOL_RECEIPT_STATUS_AUTHORIZATION_REQUIRED = 5;
}

enum AgentToolReceiptApprovalMode {
  AGENT_TOOL_RECEIPT_APPROVAL_MODE_UNSPECIFIED = 0;
  AGENT_TOOL_RECEIPT_APPROVAL_MODE_NEVER_REQUIRE = 1;
  AGENT_TOOL_RECEIPT_APPROVAL_MODE_ALWAYS_REQUIRE = 2;
  AGENT_TOOL_RECEIPT_APPROVAL_MODE_AUTO = 3;
}

message NyxIdAuthorizationRequiredEvent {
  string service_slug = 1;
  optional string service_label = 2;
  optional string resource_uri = 3;
  string reason_code = 4;
  string safe_message = 5;
  optional string user_service_id = 6;
}

message AgentToolReceipt {
  string call_id = 1;
  string tool_name = 2;
  AgentToolReceiptStatus status = 3;
  AgentToolReceiptApprovalMode approval_mode = 4;
  bool is_destructive = 5;
  string side_effect_kind = 6;
  string subject_kind = 7;
  string subject_id = 8;
  string subject_version = 9;
  string subject_hash = 10;
  string approval_request_id = 11;
  string error_code = 12;
  string error_message = 13;
  string result_json = 14;
  ManagedWorkflowHandoffReceipt managed_workflow_handoff = 15;
  WorkflowRunBackgroundDeliveryReceipt workflow_run_delivery = 16;
  NyxIdAuthorizationRequiredEvent authorization_required = 17;
}

message ManagedWorkflowHandoffReceipt {
  string parent_actor_id = 1;
  string parent_run_id = 2;
  string parent_step_id = 3;
  string invocation_id = 4;
  string child_run_id = 5;
  string stream_topic = 6;
}

message WorkflowRunBackgroundDeliveryReceipt {
  reserved 10, 12;
  reserved "bot_agent_key_id", "durable_reply_credential_ref";
  string delivery_actor_id = 1;
  string workflow_actor_id = 2;
  string workflow_run_id = 3;
  string workflow_command_id = 4;
  string workflow_correlation_id = 5;
  string stream_topic = 6;
  string channel_platform = 7;
  string reply_message_id = 8;
  string platform_message_id = 9;
  string registration_scope_id = 11;
}

message ToolResultEvent {
  string call_id = 1;
  string result_json = 2;
  bool success = 3;
  string error = 4;
  AgentToolReceipt receipt = 5;
}
message TokenUsagePayload {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}
message ChatTokenUsageEvent {
  string session_id = 1;
  TokenUsagePayload usage = 2;
  string model = 3;
}
message RoleChatSessionStartedEvent {
  string session_id = 1;
  string prompt = 2;
  repeated ChatContentPart input_parts = 3;
  RoleChatRunContext run_context = 4;
}

// Legacy committed wire contract retained for rolling upgrades and queued
// events. New producers publish RoleChatCommandAttemptRejectedEvent.
enum RoleChatSessionConflictReason {
  ROLE_CHAT_SESSION_CONFLICT_REASON_UNSPECIFIED = 0;
  ROLE_CHAT_SESSION_CONFLICT_REASON_PROMPT_MISMATCH = 1;
  ROLE_CHAT_SESSION_CONFLICT_REASON_INPUT_PARTS_MISMATCH = 2;
}

message RoleChatSessionConflictEvent {
  string session_id = 1;
  RoleChatSessionConflictReason reason = 2;
  string safe_message = 3;
}

enum RoleChatCommandAttemptRejectionReason {
  ROLE_CHAT_COMMAND_ATTEMPT_REJECTION_REASON_UNSPECIFIED = 0;
  ROLE_CHAT_COMMAND_ATTEMPT_REJECTION_REASON_PROMPT_MISMATCH = 1;
  ROLE_CHAT_COMMAND_ATTEMPT_REJECTION_REASON_INPUT_PARTS_MISMATCH = 2;
}

message RoleChatCommandAttemptRejectedEvent {
  string requested_session_id = 1;
  RoleChatCommandAttemptRejectionReason reason = 2;
  string safe_message = 3;
  string command_attempt_id = 4;
}

enum RoleChatSessionOutcome {
  ROLE_CHAT_SESSION_OUTCOME_UNSPECIFIED = 0;
  ROLE_CHAT_SESSION_OUTCOME_COMPLETED = 1;
  ROLE_CHAT_SESSION_OUTCOME_FAILED = 2;
  ROLE_CHAT_SESSION_OUTCOME_BLOCKED = 3;
}

message RoleChatSessionCompletedEvent {
  string session_id = 1;
  string content = 2;
  string reasoning_content = 3;
  repeated ToolCallEvent tool_calls = 4;
  string prompt = 5;
  bool content_emitted = 6;
  repeated ChatContentPart output_parts = 7;
  string role_id = 8;
  TokenUsagePayload usage = 9;
  string model = 10;
  repeated AgentToolReceipt tool_receipts = 11;
  RoleChatSessionOutcome outcome = 12;
  string failure_code = 13;
  string safe_message = 14;
  NyxIdAuthorizationRequiredEvent authorization_required = 15;
  google.protobuf.Timestamp terminal_time = 16;
  RoleChatRunContext run_context = 17;
  string actor_id = 18;
  repeated ToolResultEvent tool_results = 19;
  // Terminal presentation facts committed and published atomically with the
  // final session authority. Projectors expand only this typed tail on live
  // completion; snapshot synthesis remains explicit replay-only behavior.
  repeated RoleChatSessionProgressedEvent terminal_progress = 20;
}

message RoleChatTextStartedProgress {
  string agent_id = 1;
}

message RoleChatTextDeltaProgress {
  string delta = 1;
}

message RoleChatReasoningDeltaProgress {
  string delta = 1;
}

message RoleChatMediaProgress {
  string agent_id = 1;
  ChatContentPart part = 2;
}

message RoleChatToolStartedProgress {
  string call_id = 1;
  string tool_name = 2;
  aevatar.foundation.tools.ToolPresentationDescriptor presentation = 3;
}

message RoleChatToolCompletedProgress {
  ToolResultEvent result = 1;
  string tool_name = 2;
}

message RoleChatUsageProgress {
  TokenUsagePayload usage = 1;
  string model = 2;
}

message RoleChatTextEndedProgress {
  string message_id = 1;
}

message RoleChatAuthorizationRequiredProgress {
  NyxIdAuthorizationRequiredEvent authorization_required = 1;
}

message RoleChatToolApprovalRequiredProgress {
  PendingToolApprovalState pending = 1;
}

message RoleChatTerminalProgress {
  RoleChatSessionOutcome outcome = 1;
  string failure_code = 2;
  string safe_message = 3;
  string final_content = 4;
}

message RoleChatReplayProgress {
  RoleChatSessionCompletedEvent snapshot = 1;
}

message RoleChatSessionProgressedEvent {
  string session_id = 1;
  int64 sequence = 2;

  oneof payload {
    RoleChatTextStartedProgress text_started = 10;
    RoleChatTextDeltaProgress text_delta = 11;
    RoleChatReasoningDeltaProgress reasoning_delta = 12;
    RoleChatMediaProgress media = 13;
    RoleChatToolStartedProgress tool_started = 14;
    RoleChatToolCompletedProgress tool_completed = 15;
    RoleChatUsageProgress usage = 16;
    RoleChatTextEndedProgress text_ended = 17;
    RoleChatAuthorizationRequiredProgress authorization_required = 18;
    RoleChatTerminalProgress terminal = 19;
    RoleChatReplayProgress replay = 20;
    RoleChatToolApprovalRequiredProgress tool_approval_required = 21;
  }
}

message RoleChatCompletionNotificationDispatchedEvent {
  string session_id = 1;
  RoleChatRunContext run_context = 2;
  int64 dispatched_at_unix_time_ms = 3;
}

message InitializeRoleAgentEvent {
  // Refactor (iter31/cluster-032-chatruntime-taskrun-business-loop):
  //   Old pattern: ChatRuntime.ChatStreamAsync 用 Task.Run + Channel<LLMStreamChunk>/ChannelWriter 在 actor turn 外跑 LLM/tool/hook/history 业务循环,违反 actor execution integrity
  //   New principle: ChatStreamAsync owns the stream flow directly; the Task.Run + Channel owned-stream loop and stream_buffer_capacity config were removed; middleware wrapping stays inside private bridge adapters.
  string role_name = 1;
  string provider_name = 2;
  string model = 3;
  string system_prompt = 4;
  optional double temperature = 5;
  int32 max_tokens = 6;
  int32 max_tool_rounds = 7;
  int32 max_history_messages = 8;
  string event_modules = 10;
  string event_routes = 11;
  int32 max_prompt_token_budget = 12;
  double compression_threshold = 13;
  bool enable_summarization = 14;
  string role_id = 15;
  map<string, aevatar.voice.VoiceSessionDefaults> voice_session_defaults = 16;
  reserved 9;
  reserved "stream_buffer_capacity";
}

message VoicePresenceEnableRequested {
  string module_name = 1;
  aevatar.voice.VoiceSessionDefaults voice_session_defaults = 2;
  aevatar.voice.VoiceRemoteAudioSupport remote_audio_support = 3;
}

message VoicePresenceEnabledEvent {
  string module_name = 1;
  aevatar.voice.VoiceSessionDefaults voice_session_defaults = 2;
  aevatar.voice.VoicePresenceRuntimeState runtime_state = 3;
}

message AIAgentConfigOverrides {
  // Refactor (iter31/cluster-032-chatruntime-taskrun-business-loop):
  //   Old pattern: ChatRuntime.ChatStreamAsync 用 Task.Run + Channel<LLMStreamChunk>/ChannelWriter 在 actor turn 外跑 LLM/tool/hook/history 业务循环,违反 actor execution integrity
  //   New principle: ChatStreamAsync owns the stream flow directly; the Task.Run + Channel owned-stream loop and stream_buffer_capacity config were removed; middleware wrapping stays inside private bridge adapters.
  optional string provider_name = 1;
  optional string model = 2;
  optional string system_prompt = 3;
  optional double temperature = 4;
  optional int32 max_tokens = 5;
  optional int32 max_tool_rounds = 6;
  optional int32 max_history_messages = 7;
  optional int32 max_prompt_token_budget = 9;
  optional double compression_threshold = 10;
  optional bool enable_summarization = 11;
  reserved 8;
  reserved "stream_buffer_capacity";
}

message SystemSkillOverlay {
  string overlay_markdown = 1;
  string source_watermark = 2;
  int64 materialized_at = 3;
}

// Retired (issue #2498): no longer emitted — the overlay is sourced by the host-level provider, not
// materialized per-actor. Kept defined so historical journals / queued durable timeouts still
// deserialize and replay through their no-op handlers. Remove in a later release once no grain journal
// or pending timeout references them.
message SystemSkillOverlayMaterializedEvent {
  SystemSkillOverlay overlay = 1;
}

message SystemSkillOverlayRefreshFiredEvent {
  int32 attempt = 1;
}

// Agent → 前端：请求工具执行审批
message ToolApprovalRequestEvent {
  string request_id = 1;
  string session_id = 2;
  string tool_name = 3;
  string tool_call_id = 4;
  string arguments_json = 5;
  string approval_mode = 6;
  bool is_destructive = 7;
  int32 timeout_seconds = 8;
}

// 前端 → Agent：审批决策
message ToolApprovalDecisionEvent {
  string request_id = 1;
  reserved 2;
  reserved "session_id";
  bool approved = 3;
  string reason = 4;
  string continuation_turn_id = 5;
}

message RoleChatSessionState {
  string prompt = 1;
  bool completed = 2;
  string final_content = 3;
  string final_reasoning_content = 4;
  repeated ToolCallEvent tool_calls = 5;
  int64 sequence = 6;
  bool content_emitted = 7;
  repeated ChatContentPart input_parts = 8;
  repeated ChatContentPart output_parts = 9;
  TokenUsagePayload usage = 10;
  string model = 11;
  repeated AgentToolReceipt tool_receipts = 12;
  RoleChatSessionOutcome outcome = 13;
  NyxIdAuthorizationRequiredEvent authorization_required = 14;
  string failure_code = 15;
  string safe_message = 16;
  google.protobuf.Timestamp terminal_time = 17;
  RoleChatRunContext run_context = 18;
  bool completion_notification_dispatched = 19;
  int64 last_progress_sequence = 20;
  repeated ToolResultEvent tool_results = 21;
}

message RoleGAgentState {
  string role_name = 1;
  int32 message_count = 2;
  AIAgentConfigOverrides config_overrides = 3;
  map<string, RoleChatSessionState> sessions = 4;
  string event_modules = 5;
  string event_routes = 6;
  PendingToolApprovalState pending_approval = 7;
  string role_id = 8;
  map<string, aevatar.voice.VoicePresenceRuntimeState> voice_presence = 9;
  map<string, aevatar.voice.VoiceSessionDefaults> voice_session_defaults = 10;
  // Retired (issue #2498): the system skill overlay is now sourced by the host-level provider, not
  // materialized into actor state. Reserved so the tag is never reused and old snapshots parse cleanly.
  reserved 11;
  reserved "system_skill_overlay";
}

// ─── Multi-turn tool approval continuation ───

// Persisted state for a tool call waiting for user approval.
message PendingToolApprovalState {
  string request_id = 1;
  string session_id = 2;
  string tool_name = 3;
  string tool_call_id = 4;
  string arguments_json = 5;
  bool is_destructive = 6;
  string timeout_callback_id = 7;
  // field 8 reserved (was timeout_lease bytes, removed — lease kept in-memory only)
  // Refactor (issue1253-first):
  //   Old pattern: Durable approval continuation restored typed context from metadata.
  //   New principle: Typed pending approval context is the durable control surface.
  AgentToolExecutionContextPayload tool_context = 14;
  reserved 9;
  reserved "metadata";
  string remote_approval_id = 10;
  reserved 11;
  reserved "remote_status_check_callback_id";
  int32 remote_status_check_attempt = 12;
  int64 remote_approval_expires_at_unix_ms = 13;
  string scope_id = 15;
}

// Domain event: approval pending persisted.
message PendingToolApprovalPersistedEvent {
  PendingToolApprovalState pending = 1;
}

// Domain event: pending approval cleared (approved, denied, or timed out).
message ClearPendingApprovalEvent {
  string request_id = 1;
}

// Self-continuation: local approval timeout fired → escalate to NyxID remote.
message ToolApprovalTimeoutFiredEvent {
  string request_id = 1;
  string session_id = 2;
}

message RemoteToolApprovalSubmittedEvent {
  string request_id = 1;
  string remote_approval_id = 2;
  reserved 3;
  reserved "status_check_callback_id";
  int32 status_check_attempt = 4;
  int64 expires_at_unix_ms = 5;
}

message ToolApprovalRemoteStatusCheckFiredEvent {
  string request_id = 1;
  string session_id = 2;
  string remote_approval_id = 3;
  int32 attempt = 4;
}
