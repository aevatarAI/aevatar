syntax = "proto3";

package aevatar.ai.skills;
option csharp_namespace = "Aevatar.AI.Abstractions.Skills";

// Advisory discovery evidence; none of these sources declares a mandatory dependency.
enum SkillServiceEvidence {
  SKILL_SERVICE_EVIDENCE_UNSPECIFIED = 0;
  SKILL_SERVICE_EVIDENCE_LINKED = 1;
  SKILL_SERVICE_EVIDENCE_CATALOG = 2;
  SKILL_SERVICE_EVIDENCE_MENTION = 3;
}

enum SkillServiceCredentialSource {
  SKILL_SERVICE_CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  SKILL_SERVICE_CREDENTIAL_SOURCE_PERSONAL = 1;
  SKILL_SERVICE_CREDENTIAL_SOURCE_ORGANIZATION = 2;
}

message SkillServiceInstance {
  string user_service_id = 1;
  string slug = 2;
  string label = 3;
  bool active = 4;
  bool account_access_allowed = 5;
  SkillServiceCredentialSource credential_source = 6;
  string organization_name = 7;
}

message SkillServiceCatalogEntry {
  string slug = 1;
  string name = 2;
  repeated string recommended_skill_names = 3;
}

// Transient typed input from external adapters. Never persisted or returned to clients.
message SkillServiceDiscoveryInput {
  string skill_name = 1;
  string description = 2;
  string instructions = 3;
  string linked_service_slug = 4;
  repeated SkillServiceCatalogEntry catalog = 5;
  repeated SkillServiceInstance instances = 6;
}

message SkillServiceRecommendation {
  string slug = 1;
  string label = 2;
  SkillServiceEvidence evidence = 3;
  repeated SkillServiceInstance instances = 4;
}

message SkillServiceRecommendations {
  string skill_name = 1;
  repeated SkillServiceRecommendation suggestions = 2;
}
