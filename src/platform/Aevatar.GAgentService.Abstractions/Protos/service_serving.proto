syntax = "proto3";

package aevatar.gagentservice;

option csharp_namespace = "Aevatar.GAgentService.Abstractions";

import "google/protobuf/timestamp.proto";
import "service_endpoint.proto";

enum ServiceServingState {
  SERVICE_SERVING_STATE_UNSPECIFIED = 0;
  SERVICE_SERVING_STATE_ACTIVE = 1;
  SERVICE_SERVING_STATE_PAUSED = 2;
  SERVICE_SERVING_STATE_DRAINING = 3;
  SERVICE_SERVING_STATE_DISABLED = 4;
}

enum ServiceRolloutStatus {
  SERVICE_ROLLOUT_STATUS_UNSPECIFIED = 0;
  SERVICE_ROLLOUT_STATUS_IN_PROGRESS = 1;
  SERVICE_ROLLOUT_STATUS_PAUSED = 2;
  SERVICE_ROLLOUT_STATUS_COMPLETED = 3;
  SERVICE_ROLLOUT_STATUS_ROLLED_BACK = 4;
  SERVICE_ROLLOUT_STATUS_FAILED = 5;
}

enum ServiceServingTargetRemovalDisposition {
  SERVICE_SERVING_TARGET_REMOVAL_DISPOSITION_UNSPECIFIED = 0;
  SERVICE_SERVING_TARGET_REMOVAL_DISPOSITION_REMOVED = 1;
  SERVICE_SERVING_TARGET_REMOVAL_DISPOSITION_ALREADY_ABSENT = 2;
  SERVICE_SERVING_TARGET_REMOVAL_DISPOSITION_SUPERSEDED = 3;
}

enum ServiceServingTargetsApplyDisposition {
  SERVICE_SERVING_TARGETS_APPLY_DISPOSITION_UNSPECIFIED = 0;
  SERVICE_SERVING_TARGETS_APPLY_DISPOSITION_APPLIED = 1;
  SERVICE_SERVING_TARGETS_APPLY_DISPOSITION_SUPERSEDED = 2;
}

message ServiceServingTargetSpec {
  string deployment_id = 1;
  string revision_id = 2;
  string primary_actor_id = 3;
  int32 allocation_weight = 4;
  ServiceServingState serving_state = 5;
  repeated string enabled_endpoint_ids = 6;
  string serving_target_operation_id = 7;
  string activation_attempt_id = 8;
}

message ServiceServingSetState {
  ServiceIdentity identity = 1;
  int64 generation = 2;
  repeated ServiceServingTargetSpec targets = 3;
  string active_rollout_id = 4;
  google.protobuf.Timestamp updated_at = 5;
  int64 last_applied_event_version = 6;
  string last_event_id = 7;
  string last_resolved_operation_id = 8;
  string last_resolved_activation_attempt_id = 9;
  string last_resolved_reply_actor_id = 10;
  string last_resolved_deployment_id = 11;
  string last_resolved_revision_id = 12;
  google.protobuf.Timestamp last_resolved_applied_at = 13;
  map<string, ServiceServingResolvedOperationRecord> resolved_operations = 14;
  int64 last_resolved_operation_sequence = 15;
}

message ServiceServingResolvedOperationRecord {
  string operation_id = 1;
  string activation_attempt_id = 2;
  string reply_actor_id = 3;
  string deployment_id = 4;
  string revision_id = 5;
  int64 serving_generation = 6;
  google.protobuf.Timestamp applied_at = 7;
  ServiceServingTargetSpec target = 8;
  int64 operation_sequence = 9;
}

message ReplaceServiceServingTargetsCommand {
  ServiceIdentity identity = 1;
  repeated ServiceServingTargetSpec targets = 2;
  string rollout_id = 3;
  string reason = 4;
}

message ReplaceResolvedServiceServingTargetsCommand {
  ServiceIdentity identity = 1;
  repeated ServiceServingTargetSpec targets = 2;
  string rollout_id = 3;
  string reason = 4;
  string activation_attempt_id = 5;
  string operation_id = 6;
  string reply_actor_id = 7;
  int64 operation_sequence = 8;
}

message RemoveDeploymentFromServiceServingTargetsCommand {
  ServiceIdentity identity = 1;
  string deployment_id = 2;
  string reason = 3;
  string revision_id = 4;
  string primary_actor_id = 5;
  string serving_target_operation_id = 6;
  string activation_attempt_id = 7;
  string reply_actor_id = 8;
  string deactivation_operation_id = 9;
}

message ServiceServingTargetsRemovedAck {
  ServiceIdentity identity = 1;
  string deployment_id = 2;
  string revision_id = 3;
  string primary_actor_id = 4;
  string serving_target_operation_id = 5;
  string activation_attempt_id = 6;
  google.protobuf.Timestamp removed_at = 7;
  string deactivation_operation_id = 8;
  ServiceServingTargetRemovalDisposition disposition = 9;
  string actual_revision_id = 10;
  string actual_primary_actor_id = 11;
  string actual_serving_target_operation_id = 12;
  string actual_activation_attempt_id = 13;
}

message ServiceServingSetUpdatedEvent {
  ServiceIdentity identity = 1;
  int64 generation = 2;
  repeated ServiceServingTargetSpec targets = 3;
  string rollout_id = 4;
  string reason = 5;
  google.protobuf.Timestamp updated_at = 6;
  string resolved_operation_id = 7;
  string resolved_activation_attempt_id = 8;
  string resolved_reply_actor_id = 9;
  string resolved_deployment_id = 10;
  string resolved_revision_id = 11;
  int64 resolved_operation_sequence = 12;
}

message ServiceServingTargetsAppliedAck {
  ServiceIdentity identity = 1;
  string revision_id = 2;
  string deployment_id = 3;
  string activation_attempt_id = 4;
  string operation_id = 5;
  int64 serving_generation = 6;
  google.protobuf.Timestamp applied_at = 7;
  int64 operation_sequence = 8;
  ServiceServingTargetsApplyDisposition disposition = 9;
  int64 superseded_by_operation_sequence = 10;
}

message ServiceRolloutStageSpec {
  string stage_id = 1;
  repeated ServiceServingTargetSpec targets = 2;
}

message ServiceRolloutPlanSpec {
  string rollout_id = 1;
  string display_name = 2;
  repeated ServiceRolloutStageSpec stages = 3;
}

message ServiceRolloutExecutionState {
  ServiceIdentity identity = 1;
  ServiceRolloutPlanSpec plan = 2;
  string rollout_id = 3;
  ServiceRolloutStatus status = 4;
  int32 current_stage_index = 5;
  repeated ServiceServingTargetSpec baseline_targets = 6;
  string failure_reason = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  int64 last_applied_event_version = 10;
  string last_event_id = 11;
}

message StartServiceRolloutCommand {
  ServiceIdentity identity = 1;
  ServiceRolloutPlanSpec plan = 2;
  repeated ServiceServingTargetSpec baseline_targets = 3;
}

message AdvanceServiceRolloutCommand {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
}

message PauseServiceRolloutCommand {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  string reason = 3;
}

message ResumeServiceRolloutCommand {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
}

message RollbackServiceRolloutCommand {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  string reason = 3;
}

message ServiceRolloutStartedEvent {
  ServiceIdentity identity = 1;
  ServiceRolloutPlanSpec plan = 2;
  repeated ServiceServingTargetSpec baseline_targets = 3;
  google.protobuf.Timestamp started_at = 4;
}

message ServiceRolloutStageAdvancedEvent {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  int32 stage_index = 3;
  string stage_id = 4;
  repeated ServiceServingTargetSpec targets = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message ServiceRolloutPausedEvent {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  string reason = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message ServiceRolloutResumedEvent {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

message ServiceRolloutCompletedEvent {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

message ServiceRolloutRolledBackEvent {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  repeated ServiceServingTargetSpec targets = 3;
  string reason = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message ServiceRolloutFailedEvent {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  string failure_reason = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message ServiceRolloutCommandObservedEvent {
  ServiceIdentity identity = 1;
  string rollout_id = 2;
  string command_id = 3;
  string correlation_id = 4;
  ServiceRolloutStatus status = 5;
  bool was_no_op = 6;
  google.protobuf.Timestamp observed_at = 7;
}
