syntax = "proto3";

package aevatar.gagentservice.projection.authorization;
option csharp_namespace = "Aevatar.GAgentService.Projection.ReadModels";

import "google/protobuf/timestamp.proto";
import "scheduled_invocation_authorization_evidence.proto";

message NyxIdAuthorizationCatalogDocument {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 6;
  repeated aevatar.gagentservice.schedules.authorization.NyxIdAuthorizationServiceEvidence services = 7;
  google.protobuf.Timestamp observed_at_utc_value = 8;
  google.protobuf.Timestamp fresh_until_utc_value = 9;
  string external_revision = 10;
  string content_digest = 11;
  bool invalidated = 12;
  string invalidation_reason = 13;
  google.protobuf.Timestamp invalidated_at_utc_value = 14;
  google.protobuf.Timestamp last_refresh_failed_at_utc_value = 15;
  string last_refresh_failure_code = 16;
}
