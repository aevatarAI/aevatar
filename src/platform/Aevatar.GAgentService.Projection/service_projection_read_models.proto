// --- LlmSessionCurrentStateReadModel ---

message LlmSessionCurrentStateReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;

  string response_id = 5;
  string scope_id = 6;
  string owner_subject = 7;
  int32 origin_kind = 8;
  string previous_response_id = 9;
  int32 status = 10;

  google.protobuf.Timestamp created_at_utc_value = 11;
  google.protobuf.Timestamp updated_at_utc_value = 12;
  google.protobuf.Timestamp cancelled_at_utc_value = 13;
  int64 ttl_seconds = 14;
  repeated LlmSessionForwardedToolCallReadModel forwarded_tool_call_entries = 15;
  LlmSessionCompletionReadModel completion = 16;
}

message LlmSessionForwardedToolCallReadModel {
  string call_id = 1;
  string tool_name = 2;
  string schema_hash = 3;
  google.protobuf.Value arguments = 4;
  int32 status = 5;
  google.protobuf.Value result = 6;
