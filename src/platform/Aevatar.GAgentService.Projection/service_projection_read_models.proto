  TeamAutomationLifecycleStatusDocument team_automation_lifecycle_status = 44;
  google.protobuf.Timestamp credential_expires_at_utc_value = 45;
  string team_automation_operation_id = 46;
  int64 credential_generation = 47;
  string nyxid_revocation_status = 48;
  string vault_revocation_status = 49;
  bool revocation_pending = 50;
  string last_authorization_error_code = 51;
  string permission_digest = 52;
  string policy_version = 53;
  string team_automation_idempotency_key = 54;
