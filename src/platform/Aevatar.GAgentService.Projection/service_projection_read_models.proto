syntax = "proto3";

package aevatar.gagentservice.projection.readmodels;

option csharp_namespace = "Aevatar.GAgentService.Projection.ReadModels";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "llm_sessions.proto";
import "service_revision.proto";

// --- ServiceCatalogReadModel ---

message ServiceCatalogReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  string tenant_id = 5;
  string app_id = 6;
  string namespace = 7;
  string service_id = 8;
  string display_name = 9;
  string default_serving_revision_id = 10;
  reserved 11 to 14;
  google.protobuf.Timestamp updated_at_utc_value = 15;
  repeated ServiceCatalogEndpointReadModel endpoint_entries = 16;
  repeated string policy_id_entries = 17;
}

message ServiceCatalogEndpointReadModel {
  string endpoint_id = 1;
  string display_name = 2;
  string kind = 3;
  string request_type_url = 4;
  string response_type_url = 5;
  string description = 6;
}

// --- ServiceDeploymentCatalogReadModel ---

message ServiceDeploymentCatalogReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  repeated ServiceDeploymentReadModel deployment_entries = 6;
}

message ServiceDeploymentReadModel {
  string deployment_id = 1;
  string revision_id = 2;
  string primary_actor_id = 3;
  string status = 4;
  google.protobuf.Timestamp activated_at_utc_value = 5;
  google.protobuf.Timestamp updated_at_utc_value = 6;
}

// --- ServiceRevisionCatalogReadModel ---

message ServiceRevisionCatalogReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  repeated ServiceRevisionEntryReadModel revision_entries = 6;
}

message ServiceRevisionEntryReadModel {
  string revision_id = 1;
  string implementation_kind = 2;
  string status = 3;
  string artifact_hash = 4;
  string failure_reason = 5;
  google.protobuf.Timestamp created_at_utc_value = 6;
  google.protobuf.Timestamp prepared_at_utc_value = 7;
  google.protobuf.Timestamp published_at_utc_value = 8;
  google.protobuf.Timestamp retired_at_utc_value = 9;
  repeated ServiceCatalogEndpointReadModel endpoint_entries = 10;
  string static_actor_type_name = 11;
  string static_preferred_actor_id = 12;
  string static_agent_kind = 20;
  string scripting_script_id = 13;
  string scripting_revision = 14;
  string scripting_definition_actor_id = 15;
  string scripting_source_hash = 16;
  string workflow_name = 17;
  string workflow_definition_actor_id = 18;
  int32 workflow_inline_workflow_count = 19;
  aevatar.gagentservice.PreparedServiceRevisionArtifact prepared_artifact = 21;
}

// --- ServiceRolloutReadModel ---

message ServiceRolloutReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  string rollout_id = 5;
  string display_name = 6;
  string status = 7;
  int32 current_stage_index = 8;
  string failure_reason = 9;
  google.protobuf.Timestamp started_at_utc_value = 10;
  google.protobuf.Timestamp updated_at_utc_value = 11;
  repeated ServiceRolloutStageReadModel stage_entries = 12;
  repeated ServiceServingTargetReadModel baseline_target_entries = 13;
}

message ServiceRolloutStageReadModel {
  string stage_id = 1;
  int32 stage_index = 2;
  repeated ServiceServingTargetReadModel target_entries = 3;
}

message ServiceRolloutCommandObservationReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  string service_key = 5;
  string rollout_id = 6;
  string command_id = 7;
  string correlation_id = 8;
  int32 status = 9;
  bool was_no_op = 10;
  google.protobuf.Timestamp observed_at_utc_value = 11;
}

// --- ServiceServingSetReadModel ---

message ServiceServingSetReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  int64 generation = 5;
  string active_rollout_id = 6;
  google.protobuf.Timestamp updated_at_utc_value = 7;
  repeated ServiceServingTargetReadModel target_entries = 8;
}

message ServiceServingTargetReadModel {
  string deployment_id = 1;
  string revision_id = 2;
  string primary_actor_id = 3;
  int32 allocation_weight = 4;
  string serving_state = 5;
  repeated string enabled_endpoint_id_entries = 6;
}

// --- ServiceTrafficViewReadModel ---

message ServiceTrafficViewReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  int64 generation = 5;
  string active_rollout_id = 6;
  google.protobuf.Timestamp updated_at_utc_value = 7;
  repeated ServiceTrafficEndpointReadModel endpoint_entries = 8;
}

message ServiceTrafficEndpointReadModel {
  string endpoint_id = 1;
  repeated ServiceTrafficTargetReadModel target_entries = 2;
}

message ServiceTrafficTargetReadModel {
  string deployment_id = 1;
  string revision_id = 2;
  string primary_actor_id = 3;
  int32 allocation_weight = 4;
  string serving_state = 5;
}

// --- ServiceRunCurrentStateReadModel ---

message ServiceRunCurrentStateReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;

  string scope_id = 5;
  string service_id = 6;
  string service_key = 7;
  string run_id = 8;
  string command_id = 9;
  string correlation_id = 10;
  string endpoint_id = 11;
  int32 implementation_kind = 12;
  string target_actor_id = 13;
  string revision_id = 14;
  string deployment_id = 15;
  int32 status = 16;
  string tenant_id = 17;
  string app_id = 18;
  string namespace = 19;

  google.protobuf.Timestamp created_at_utc_value = 20;
  google.protobuf.Timestamp updated_at_utc_value = 21;
}
// --- GAgentRunTerminalReadModel ---

message GAgentRunTerminalReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  string session_id = 5;
  string correlation_id = 6;
  int32 interaction_kind = 7;
  int32 status = 8;
  string reason_code = 9;
  string reason_message = 10;
  google.protobuf.Timestamp observed_at_utc_value = 11;
}

// --- LlmSessionCurrentStateReadModel ---

message LlmSessionCurrentStateReadModel {
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;

  string response_id = 5;
  string scope_id = 6;
  string owner_subject = 7;
  int32 origin_kind = 8;
  string previous_response_id = 9;
  int32 status = 10;

  google.protobuf.Timestamp created_at_utc_value = 11;
  google.protobuf.Timestamp updated_at_utc_value = 12;
  google.protobuf.Timestamp cancelled_at_utc_value = 13;
  int64 ttl_seconds = 14;
  repeated LlmSessionForwardedToolCallReadModel forwarded_tool_call_entries = 15;
  LlmSessionCompletionReadModel completion = 16;
}

message LlmSessionForwardedToolCallReadModel {
  string call_id = 1;
  string tool_name = 2;
  string schema_hash = 3;
  google.protobuf.Value arguments = 4;
  int32 status = 5;
  google.protobuf.Value result = 6;
  google.protobuf.Timestamp expiry_utc_value = 7;
  google.protobuf.Timestamp emitted_at_utc_value = 8;
  google.protobuf.Timestamp received_at_utc_value = 9;
  google.protobuf.Timestamp resolved_at_utc_value = 10;
}

message LlmSessionCompletedToolCallReadModel {
  string call_id = 1;
  string tool_name = 2;
  google.protobuf.Value result = 3;
}

message LlmSessionCompletionReadModel {
  string output_text = 1;
  repeated LlmSessionCompletedToolCallReadModel tool_call_entries = 2;
  google.protobuf.Timestamp completed_at_utc_value = 3;
  string failure_code = 4;
  string failure_message = 5;
  LlmSessionTokenUsageReadModel usage = 6;
}

message LlmSessionTokenUsageReadModel {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

// --- ResponsesAgentToolStateCurrentStateReadModel ---

message ResponsesAgentToolStateCurrentStateReadModel {
  // Refactor (issue1183/first-slice):
  //   Old pattern: ResponsesTaskTrace dead trace surface — task_substitute / task_trace
  //                readmodel surface had no consumer and occupied proto field numbers.
  //   New principle: deleted / reserved per Phase 9 r1 consensus (hybrid minimal/
  //                  structural/delete), with proto field numbers reserved against reuse.
  reserved 10;
  reserved "task_trace_entries";
  string id = 1;
  string actor_id = 2;
  int64 state_version = 3;
  string last_event_id = 4;
  string scope_id = 5;
  string owner_subject = 6;
  google.protobuf.Timestamp created_at_utc_value = 7;
  google.protobuf.Timestamp updated_at_utc_value = 8;
  repeated ResponsesTodoItemReadModel todo_item_entries = 9;
  repeated ResponsesWebTraceReadModel web_trace_entries = 11;
  repeated ResponsesWebCacheEntryReadModel web_cache_entry_entries = 12;
}

message ResponsesTodoItemReadModel {
  string id = 1;
  string content = 2;
  string status = 3;
  string source_response_id = 4;
  google.protobuf.Timestamp created_at_utc_value = 5;
  google.protobuf.Timestamp updated_at_utc_value = 6;
}

message ResponsesWebTraceReadModel {
  string trace_id = 1;
  string source_response_id = 2;
  string tool_name = 3;
  string cache_key = 4;
  string url = 5;
  string query = 6;
  bool cache_hit = 7;
  // Refactor (iter161-cluster-001 #1251-first):
  //   Old pattern: projected Web result readmodel carried only Value.
  //   New principle: typed_result mirrors actor-owned typed result; result is legacy fallback only.
  google.protobuf.Value result = 8;
  google.protobuf.Timestamp observed_at_utc_value = 9;
  aevatar.gagentservice.ResponsesWebToolResult typed_result = 10;
}

message ResponsesWebCacheEntryReadModel {
  string cache_key = 1;
  string tool_name = 2;
  string url = 3;
  string query = 4;
  // Refactor (iter161-cluster-001 #1251-first):
  //   Old pattern: projected cache result carried only Value.
  //   New principle: typed_result is the normal query path; result is legacy fallback only.
  google.protobuf.Value result = 5;
  google.protobuf.Timestamp cached_at_utc_value = 6;
  google.protobuf.Timestamp last_hit_at_utc_value = 7;
  int64 hit_count = 8;
  aevatar.gagentservice.ResponsesWebToolResult typed_result = 9;
}

// --- ScheduledDispatchReadModel ---

message ScheduledDispatchDocument {
  string id = 1;
  int64 state_version = 2;
  string last_event_id = 3;
  google.protobuf.Timestamp created_at_utc_value = 4;
  google.protobuf.Timestamp updated_at_utc_value = 5;
  string schedule_id = 6;
  string actor_id = 7;
  string display_name = 8;
  string target_kind = 9;
  string payload_type_url = 10;
  string cron_expression = 11;
  string timezone = 12;
  bool enabled = 13;
  google.protobuf.Timestamp next_fire_at_utc_value = 14;
  google.protobuf.Timestamp last_fire_at_utc_value = 15;
  string last_target_actor_id = 16;
  string last_command_id = 17;
  string last_correlation_id = 18;
  string last_error = 19;
  int32 fire_count = 20;
  int32 failure_count = 21;
  map<string, string> headers_map = 22;
  string service_key = 23;
  string target_actor_id = 24;
  repeated ScheduledDispatchFireRecordDocument fire_records = 25;
  reserved 26;
  string schedule_actor_id = 27;
  string service_id = 28;
  string service_endpoint_id = 29;
  string schedule_kind = 30;
  bool deleted = 31;
  google.protobuf.Timestamp deleted_at_utc_value = 32;
}

message ScheduledDispatchFireRecordDocument {
  google.protobuf.Timestamp scheduled_fire_at_utc_value = 1;
  google.protobuf.Timestamp completed_at_utc_value = 2;
  string idempotency_key = 3;
  string target_actor_id = 4;
  string command_id = 5;
  string correlation_id = 6;
  string error = 7;
  bool manual = 8;
}
