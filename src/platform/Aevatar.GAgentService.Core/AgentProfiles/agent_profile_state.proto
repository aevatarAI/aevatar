syntax = "proto3";

package aevatar.gagentservice.agentprofiles.state;

option csharp_namespace = "Aevatar.GAgentService.Core.AgentProfiles";

import "AgentProfiles/agent_profiles.proto";

message AgentProfileOwnerHandleClaimState {
  string owner_handle = 1;
  aevatar.gagentservice.agentprofiles.AgentProfileOwnerIdentity owner = 2;
}

message AgentProfileNamespaceEntryState {
  aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
  string profile_actor_id = 2;
  aevatar.gagentservice.agentprofiles.AgentProfileProvisioningStatus status = 3;
  aevatar.gagentservice.agentprofiles.AgentProfileContent initial_content = 4;
  aevatar.gagentservice.agentprofiles.AgentProfileSafeDiagnostic failure = 5;
  aevatar.gagentservice.agentprofiles.AgentProfilePublishedSummary published_summary = 6;
}

message AgentProfileNamespaceOperationState {
  aevatar.gagentservice.agentprofiles.AgentProfileOperationFact operation = 1;
  string profile_id = 2;
  string profile_actor_id = 3;
  aevatar.gagentservice.agentprofiles.AgentProfileSafeDiagnostic diagnostic = 4;
  aevatar.gagentservice.agentprofiles.AgentProfilePublishedSummary published_summary = 5;
  bool provisioning_started = 6;
  aevatar.gagentservice.agentprofiles.AgentProfileOperationReplayAuthority replay_authority = 7;
  aevatar.gagentservice.agentprofiles.AgentProfileProvisioningFailureKind failure_kind = 8;
}

message AgentProfileCreateSemanticInputFingerprintMaterial {
  oneof identity_value {
    aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
    bool identity_missing = 4;
  }
  oneof initial_content_value {
    aevatar.gagentservice.agentprofiles.AgentProfileContent initial_content = 2;
    bool initial_content_missing = 5;
  }
  string profile_actor_id = 3;
}

message AgentProfileInitializeSemanticInputFingerprintMaterial {
  oneof identity_value {
    aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
    bool identity_missing = 5;
  }
  oneof initial_content_value {
    aevatar.gagentservice.agentprofiles.AgentProfileContent initial_content = 2;
    bool initial_content_missing = 6;
  }
  string namespace_actor_id = 3;
  string profile_actor_id = 4;
}

message AgentProfileNamespaceState {
  repeated AgentProfileOwnerHandleClaimState handle_claims = 1;
  repeated AgentProfileNamespaceEntryState profiles = 2;
  repeated AgentProfileNamespaceOperationState operations = 3;
}

message AgentProfileInitializationRejectionState {
  string namespace_actor_id = 1;
  aevatar.gagentservice.agentprofiles.AgentProfileInitializationRejectedContinuation continuation = 2;
}

message AgentProfileUpdateDraftSemanticInputFingerprintMaterial {
  oneof identity_value {
    aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
    bool identity_missing = 2;
  }
  oneof content_value {
    aevatar.gagentservice.agentprofiles.AgentProfileContent content = 3;
    bool content_missing = 4;
  }
}

message AgentProfileUpsertSkillBindingSemanticInputFingerprintMaterial {
  oneof identity_value {
    aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
    bool identity_missing = 2;
  }
  oneof binding_value {
    aevatar.gagentservice.agentprofiles.AgentProfileSkillBinding binding = 3;
    bool binding_missing = 4;
  }
}

message AgentProfileRemoveSkillBindingSemanticInputFingerprintMaterial {
  oneof identity_value {
    aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
    bool identity_missing = 2;
  }
  string binding_id = 3;
}

message AgentProfilePublishSemanticInputFingerprintMaterial {
  oneof identity_value {
    aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
    bool identity_missing = 2;
  }
  oneof snapshot_value {
    aevatar.gagentservice.agentprofiles.AgentProfilePublishedSnapshot snapshot = 3;
    bool snapshot_missing = 4;
  }
}

message AgentProfileMutationSemanticInputFingerprintMaterial {
  oneof mutation_value {
    AgentProfileUpdateDraftSemanticInputFingerprintMaterial update_draft = 1;
    AgentProfileUpsertSkillBindingSemanticInputFingerprintMaterial upsert_skill_binding = 2;
    AgentProfileRemoveSkillBindingSemanticInputFingerprintMaterial remove_skill_binding = 3;
    AgentProfilePublishSemanticInputFingerprintMaterial publish = 4;
  }
}

message AgentProfilePublishedSummarySemanticInputFingerprintMaterial {
  aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
  aevatar.gagentservice.agentprofiles.AgentProfilePublishedSummary summary = 2;
}

message AgentProfileOperationState {
  aevatar.gagentservice.agentprofiles.AgentProfileOperationFact operation = 1;
  aevatar.gagentservice.agentprofiles.AgentProfileMutationOutcome outcome = 2;
  aevatar.gagentservice.agentprofiles.AgentProfilePublishedSummary published_summary = 3;
  aevatar.gagentservice.agentprofiles.AgentProfileInitializedContinuation initialization_continuation = 4;
  AgentProfileInitializationRejectionState initialization_rejection = 5;
  aevatar.gagentservice.agentprofiles.AgentProfileOperationReplayAuthority replay_authority = 6;
}

message AgentProfileState {
  aevatar.gagentservice.agentprofiles.AgentProfileIdentity identity = 1;
  string namespace_actor_id = 2;
  aevatar.gagentservice.agentprofiles.AgentProfileContent draft = 3;
  int64 draft_revision = 4;
  bytes draft_sha256 = 5;
  aevatar.gagentservice.agentprofiles.AgentProfilePublishedSnapshot published = 6;
  int64 published_revision = 7;
  aevatar.gagentservice.agentprofiles.AgentProfileMutationOutcome last_mutation = 8;
  repeated AgentProfileOperationState operations = 9;
}
