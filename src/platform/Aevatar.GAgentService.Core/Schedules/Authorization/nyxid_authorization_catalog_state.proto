syntax = "proto3";

package aevatar.gagentservice.schedules.authorization.state;
option csharp_namespace = "Aevatar.GAgentService.Core.Schedules.Authorization";

import "google/protobuf/timestamp.proto";
import "scheduled_invocation_authorization_evidence.proto";

message NyxIdAuthorizationCatalogState {
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 1;
  repeated aevatar.gagentservice.schedules.authorization.NyxIdAuthorizationServiceEvidence services = 2;
  google.protobuf.Timestamp observed_at = 3;
  google.protobuf.Timestamp fresh_until = 4;
  string external_revision = 5;
  string content_digest = 6;
  bool invalidated = 7;
  string invalidation_reason = 8;
  google.protobuf.Timestamp invalidated_at = 9;
  google.protobuf.Timestamp last_refresh_failed_at = 10;
  string last_refresh_failure_code = 11;
}

message ObserveNyxIdAuthorizationCatalogCommand {
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 1;
  repeated aevatar.gagentservice.schedules.authorization.NyxIdAuthorizationServiceEvidence services = 2;
  google.protobuf.Timestamp observed_at = 3;
  google.protobuf.Timestamp fresh_until = 4;
  string external_revision = 5;
  string content_digest = 6;
}

message RecordNyxIdAuthorizationCatalogRefreshFailureCommand {
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 1;
  google.protobuf.Timestamp failed_at = 2;
  string failure_code = 3;
}

message InvalidateNyxIdAuthorizationCatalogCommand {
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 1;
  google.protobuf.Timestamp invalidated_at = 2;
  string reason = 3;
}

message NyxIdAuthorizationCatalogObservedEvent {
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 1;
  repeated aevatar.gagentservice.schedules.authorization.NyxIdAuthorizationServiceEvidence services = 2;
  google.protobuf.Timestamp observed_at = 3;
  google.protobuf.Timestamp fresh_until = 4;
  string external_revision = 5;
  string content_digest = 6;
}

message NyxIdAuthorizationCatalogRefreshFailedEvent {
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 1;
  google.protobuf.Timestamp failed_at = 2;
  string failure_code = 3;
}

message NyxIdAuthorizationCatalogInvalidatedEvent {
  aevatar.gagentservice.schedules.authorization.AuthorizationOwnerIdentity owner = 1;
  google.protobuf.Timestamp invalidated_at = 2;
  string reason = 3;
}
