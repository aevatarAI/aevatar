}

message ScheduledDispatchUpdateCommand
{
  string schedule_id = 1;
  string display_name = 2;
  string target_actor_id = 3;
  aevatar.EventEnvelope trigger_envelope = 4;
  string cron_expression = 5;
  string timezone = 6;
  bool enabled = 7;
  map<string, string> headers = 8;
  string payload_type_url = 9;
  ScheduledDispatchTargetState target = 10;
  ScheduledDispatchScheduleKindState schedule_kind = 11;
  ScheduledDispatchScheduleModeState schedule_mode = 12;
  google.protobuf.Timestamp one_shot_fire_at = 13;
  TeamMemberAutomationOwnerState team_automation_owner = 14;
  ScheduledDispatchExpectedServiceTargetState expected_service_target = 15;
}

message ScheduledDispatchEnsureCommand
{
  string schedule_id = 1;
  string display_name = 2;
  string target_actor_id = 3;
  aevatar.EventEnvelope trigger_envelope = 4;
  string cron_expression = 5;
  string timezone = 6;
  bool enabled = 7;
  map<string, string> headers = 8;
  string payload_type_url = 9;
  ScheduledDispatchTargetState target = 10;
  ScheduledDispatchScheduleKindState schedule_kind = 11;
  ScheduledDispatchScheduleModeState schedule_mode = 12;
  google.protobuf.Timestamp one_shot_fire_at = 13;
  TeamMemberAutomationOwnerState team_automation_owner = 14;
}

message ScheduledDispatchConfiguredEvent
{
  string schedule_id = 1;
  string display_name = 2;
  string target_actor_id = 3;
  aevatar.EventEnvelope trigger_envelope = 4;
  string cron_expression = 5;
  string timezone = 6;
  bool enabled = 7;
  google.protobuf.Timestamp configured_at = 8;
  map<string, string> headers = 9;
  string payload_type_url = 10;
  ScheduledDispatchTargetState target = 11;
  reserved 12;
  ScheduledDispatchScheduleKindState schedule_kind = 13;
  ScheduledDispatchScheduleModeState schedule_mode = 14;
  google.protobuf.Timestamp one_shot_fire_at = 15;
  TeamMemberAutomationOwnerState team_automation_owner = 16;
}

message ScheduledDispatchEnableCommand
{
  string reason = 1;
  TeamMemberAutomationOwnerState team_automation_owner = 2;
  ScheduledDispatchExpectedServiceTargetState expected_service_target = 3;
}

message ScheduledDispatchDisableCommand
{
  string reason = 1;
  TeamMemberAutomationOwnerState team_automation_owner = 2;
  ScheduledDispatchExpectedServiceTargetState expected_service_target = 3;
}

message ScheduledDispatchExpectedServiceTargetState
{
  ScheduledDispatchScheduleKindState schedule_kind = 1;
  ScheduledDispatchTargetKindState target_kind = 2;
  aevatar.gagentservice.ServiceIdentity service_identity = 3;
  string service_endpoint_id = 4;
}

message ScheduledDispatchEnabledEvent
{
  string reason = 1;
  google.protobuf.Timestamp enabled_at = 2;
  string schedule_id = 3;
  string scope_id = 4;
}

message ScheduledDispatchDisabledEvent
{
  string reason = 1;
  google.protobuf.Timestamp disabled_at = 2;
  string schedule_id = 3;
  string scope_id = 4;
}

message ScheduledDispatchDeleteCommand
{
  string reason = 1;
  TeamMemberAutomationOwnerState team_automation_owner = 2;
  string operation_id = 3;
  string idempotency_key = 4;
  reserved 5;
  ScheduledInvocationAuthorizationOwnerState authenticated_credential_owner = 6;
  string observation_request_id = 7;
  ScheduledDispatchExpectedServiceTargetState expected_service_target = 8;
}

message ScheduledDispatchDeletedEvent
{
  string reason = 1;
  google.protobuf.Timestamp deleted_at = 2;
  string schedule_id = 3;
  string scope_id = 4;
}

message ScheduledDispatchCompletedEvent
{
  string reason = 1;
  google.protobuf.Timestamp completed_at = 2;
}

message ScheduledDispatchNextFireIntentRecordedEvent
{
  google.protobuf.Timestamp next_fire_at = 1;
  google.protobuf.Timestamp requested_at = 2;
}

message ScheduledDispatchNextFireScheduledEvent
{
  google.protobuf.Timestamp next_fire_at = 1;
  ScheduledDispatchRuntimeCallbackLeaseState lease = 2;
  google.protobuf.Timestamp scheduled_at = 3;
}

message ScheduledDispatchFireCommand
{
  google.protobuf.Timestamp scheduled_fire_at = 1;
  bool manual = 2;
  TeamMemberAutomationOwnerState team_automation_owner = 3;
  string idempotency_key = 4;
  string operation_id = 5;
  ScheduledDispatchExpectedServiceTargetState expected_service_target = 6;
}

message BeginTeamAutomationCredentialOperationCommand
{
  string schedule_id = 1;
  TeamMemberAutomationOwnerState owner = 2;
  string operation_id = 3;
  string idempotency_key = 4;
  string permission_digest = 5;
  string policy_version = 6;
  TeamAutomationOperationKindState operation_kind = 7;
  ScheduledCredentialEffectLocatorState credential_effect_locator = 8;
  string mutation_digest = 9;
  string observation_request_id = 10;
  TeamAutomationActivationDecisionState activation_decision = 11;
}

message RetryTeamAutomationCredentialOperationCommand
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  string observation_request_id = 4;
}

message TeamAutomationCredentialOperationBeganEvent
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  string permission_digest = 4;
  string policy_version = 5;
  TeamAutomationOperationKindState operation_kind = 6;
  google.protobuf.Timestamp occurred_at = 7;
  string schedule_id = 8;
  ScheduledCredentialEffectLocatorState credential_effect_locator = 9;
  string mutation_digest = 10;
  TeamAutomationActivationDecisionState activation_decision = 11;
}

message RecordTeamAutomationCredentialCandidateCommand
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  ScheduledInvocationAgentKeyCredentialReferenceState credential = 4;
  ScheduledInvocationAuthorizationOwnerState credential_owner = 5;
  string effect_attempt_id = 6;
  string observation_request_id = 7;
}

message TeamAutomationCredentialCandidateRecordedEvent
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  ScheduledInvocationAgentKeyCredentialReferenceState credential = 4;
  ScheduledInvocationAuthorizationOwnerState credential_owner = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string effect_attempt_id = 7;
}

message CompleteTeamAutomationCredentialOperationCommand
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  ScheduledInvocationAgentKeyCredentialReferenceState credential = 4;
  ScheduledDispatchConfiguredEvent configuration = 5;
  string effect_attempt_id = 6;
  string observation_request_id = 7;
}

message TeamAutomationCredentialActivatedEvent
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  ScheduledInvocationAgentKeyCredentialReferenceState credential = 4;
  ScheduledInvocationAgentKeyCredentialReferenceState replaced_credential = 5;
  int64 generation = 6;
  google.protobuf.Timestamp occurred_at = 7;
  ScheduledDispatchConfiguredEvent configuration = 8;
  ScheduledInvocationAuthorizationOwnerState credential_owner = 9;
  ScheduledInvocationAuthorizationOwnerState replaced_credential_owner = 10;
}

message FailTeamAutomationCredentialOperationCommand
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  string error_code = 4;
  string effect_attempt_id = 5;
  string observation_request_id = 6;
}

message TeamAutomationCredentialOperationFailedEvent
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  string error_code = 4;
  bool active_credential_preserved = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message TeamAutomationDeletionRequestedEvent
{
  TeamMemberAutomationOwnerState owner = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  ScheduledInvocationAgentKeyCredentialReferenceState pending_revocation_credential = 4;
  google.protobuf.Timestamp occurred_at = 5;
  ScheduledInvocationAuthorizationOwnerState pending_revocation_credential_owner = 6;
