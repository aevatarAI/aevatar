syntax = "proto3";
package aevatar.gagentservice.schedules;
option csharp_namespace = "Aevatar.GAgentService.Core.Schedules";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "agent_messages.proto";
import "Credentials/credential_secret_references.proto";
import "service_endpoint.proto";
import "scheduled_invocation_authorization_plan.proto";

message ScheduledDispatchState
{
  string schedule_id = 1;
  string display_name = 2;
  string target_actor_id = 3;
  aevatar.EventEnvelope trigger_envelope = 4;
  string cron_expression = 5;
  string timezone = 6;
  bool enabled = 7;
  google.protobuf.Timestamp created_at_utc_value = 8;
  google.protobuf.Timestamp updated_at_utc_value = 9;
  google.protobuf.Timestamp next_fire_at_utc_value = 10;
  google.protobuf.Timestamp last_fire_at_utc_value = 11;
  string last_target_actor_id = 12;
  string last_command_id = 13;
  string last_correlation_id = 14;
  string last_error = 15;
  int32 fire_count = 16;
  int32 failure_count = 17;
  map<string, string> headers = 18;
  string payload_type_url = 19;
  reserved 20;
  ScheduledDispatchRuntimeCallbackLeaseState next_fire_lease = 21;
  map<string, ScheduledDispatchFireRecordState> fire_records = 22;
  ScheduledDispatchTargetState target = 23;
  google.protobuf.Timestamp pending_next_fire_at = 24;
  google.protobuf.Timestamp pending_next_fire_requested_at = 25;
  ScheduledDispatchScheduleKindState schedule_kind = 26;
  bool deleted = 27;
  google.protobuf.Timestamp deleted_at_utc_value = 28;
  // Number of times the actor reactivated and found an armed occurrence overdue
  // past the grace window with no terminal fire record. This is a detection
  // counter (once per overdue armed occurrence), not a total-missed-occurrence
  // tally: a long-dormant actor that misses many ticks records one detection
  // when it reactivates against the earliest still-armed occurrence.
  int32 overdue_fire_detected_count = 29;
  google.protobuf.Timestamp last_overdue_fire_at_utc_value = 30;
  ScheduledDispatchScheduleModeState schedule_mode = 31;
  google.protobuf.Timestamp one_shot_fire_at_utc_value = 32;
  bool completed = 33;
  google.protobuf.Timestamp completed_at_utc_value = 34;
  TeamMemberAutomationOwnerState team_automation_owner = 35;
  TeamAutomationLifecycleStatusState team_automation_lifecycle_status = 36;
  TeamAutomationOperationKindState team_automation_operation_kind = 37;
  string team_automation_operation_id = 38;
  string team_automation_idempotency_key = 39;
  string team_automation_permission_digest = 40;
  string team_automation_policy_version = 41;
  ScheduledInvocationAgentKeyCredentialReferenceState active_team_credential = 42;
  ScheduledInvocationAgentKeyCredentialReferenceState candidate_team_credential = 43;
  ScheduledInvocationAgentKeyCredentialReferenceState pending_revocation_team_credential = 44;
  TeamAutomationEffectTrackStatusState nyxid_revocation_status = 45;
  TeamAutomationEffectTrackStatusState vault_revocation_status = 46;
  int64 team_credential_generation = 47;
  google.protobuf.Timestamp team_credential_expires_at = 48;
  string last_authorization_error_code = 49;
  ScheduledInvocationAuthorizationFactState active_team_authorization_fact = 50;
  ScheduledInvocationAuthorizationOwnerState active_team_credential_owner = 51;
  ScheduledInvocationAuthorizationOwnerState pending_revocation_team_credential_owner = 52;
  bool team_automation_effect_attempt_claimed = 53;
  ScheduledInvocationAuthorizationOwnerState candidate_team_credential_owner = 54;
  string team_automation_effect_attempt_id = 55;
  int64 team_automation_effect_attempt_generation = 56;
  google.protobuf.Timestamp team_automation_effect_attempt_claimed_at = 57;
  google.protobuf.Timestamp team_automation_effect_attempt_expires_at = 58;
  ScheduledCredentialEffectLocatorState team_credential_effect_locator = 59;
  string team_automation_mutation_digest = 60;
  ScheduledDispatchRuntimeCallbackLeaseState team_credential_expiry_lease = 61;
  google.protobuf.Timestamp pending_team_credential_expiry_at = 62;
  int64 pending_team_credential_expiry_generation = 63;
  TeamAutomationActivationDecisionState team_automation_activation_decision = 64;
  optional string team_automation_delete_reason = 65;
  string last_error_code = 66;
}

message TeamMemberAutomationOwnerState
{
  string scope_id = 1;
  string member_id = 2;
  // Legacy read compatibility only. Team containment is resolved from the
  // canonical member read model and is not part of the durable owner key.
  string current_team_id = 3 [deprecated = true];
  // Authoritative team assignment snapshot resolved from the Studio member read model.
  string team_id = 4;
}

enum TeamAutomationLifecycleStatusState
{
  TEAM_AUTOMATION_LIFECYCLE_STATUS_STATE_UNSPECIFIED = 0;
  TEAM_AUTOMATION_LIFECYCLE_STATUS_STATE_PROVISIONING_PENDING = 1;
  TEAM_AUTOMATION_LIFECYCLE_STATUS_STATE_ACTIVE = 2;
  TEAM_AUTOMATION_LIFECYCLE_STATUS_STATE_NEEDS_AUTHORIZATION = 3;
  TEAM_AUTOMATION_LIFECYCLE_STATUS_STATE_REPLACEMENT_PENDING = 4;
  TEAM_AUTOMATION_LIFECYCLE_STATUS_STATE_DELETING = 5;
  TEAM_AUTOMATION_LIFECYCLE_STATUS_STATE_REVOCATION_PENDING = 6;
  TEAM_AUTOMATION_LIFECYCLE_STATUS_STATE_FAILED = 7;
}

enum TeamAutomationOperationKindState
{
  TEAM_AUTOMATION_OPERATION_KIND_STATE_UNSPECIFIED = 0;
  TEAM_AUTOMATION_OPERATION_KIND_STATE_CREATE = 1;
  TEAM_AUTOMATION_OPERATION_KIND_STATE_REAUTHORIZE = 2;
  TEAM_AUTOMATION_OPERATION_KIND_STATE_DELETE = 3;
}

enum TeamAutomationEffectTrackStatusState
{
  TEAM_AUTOMATION_EFFECT_TRACK_STATUS_STATE_NOT_REQUIRED = 0;
  TEAM_AUTOMATION_EFFECT_TRACK_STATUS_STATE_PENDING = 1;
  TEAM_AUTOMATION_EFFECT_TRACK_STATUS_STATE_COMPLETED = 2;
  TEAM_AUTOMATION_EFFECT_TRACK_STATUS_STATE_FAILED = 3;
}

enum ScheduledDispatchScheduleKindState
{
  reserved 2;
  reserved "SCHEDULED_DISPATCH_SCHEDULE_KIND_STATE_SKILL_RUNNER";

  SCHEDULED_DISPATCH_SCHEDULE_KIND_STATE_GENERIC = 0;
  SCHEDULED_DISPATCH_SCHEDULE_KIND_STATE_WORKFLOW = 1;
}

enum ScheduledDispatchScheduleModeState
{
  SCHEDULED_DISPATCH_SCHEDULE_MODE_STATE_RECURRING_CRON = 0;
  SCHEDULED_DISPATCH_SCHEDULE_MODE_STATE_ONE_SHOT_AT_UTC = 1;
}

enum ScheduledDispatchRuntimeCallbackBackendState
{
  SCHEDULED_DISPATCH_RUNTIME_CALLBACK_BACKEND_STATE_UNSPECIFIED = 0;
  SCHEDULED_DISPATCH_RUNTIME_CALLBACK_BACKEND_STATE_IN_MEMORY = 1;
  SCHEDULED_DISPATCH_RUNTIME_CALLBACK_BACKEND_STATE_DEDICATED = 2;
}

message ScheduledDispatchRuntimeCallbackLeaseState
{
  string actor_id = 1;
  string callback_id = 2;
  int64 generation = 3;
  ScheduledDispatchRuntimeCallbackBackendState backend = 4;
  int32 slot_epoch = 5;
}

enum ScheduledDispatchEnvelopeAuthorityState
{
  SCHEDULED_DISPATCH_ENVELOPE_AUTHORITY_STATE_UNSPECIFIED = 0;
  SCHEDULED_DISPATCH_ENVELOPE_AUTHORITY_STATE_TRUSTED_INTERNAL = 1;
}

message ScheduledDispatchTargetState
{
  ScheduledDispatchTargetKindState kind = 1;
  string actor_id = 2;
  aevatar.EventEnvelope envelope = 3;
  ScheduledServiceInvocationTargetState service_invocation = 4;
  reserved 5;
  ScheduledDispatchCredentialRequirementTargetKindState credential_requirement_target_kind = 6;
  ScheduledDispatchEnvelopeAuthorityState envelope_authority = 7;
}

enum ScheduledDispatchTargetKindState
{
  SCHEDULED_DISPATCH_TARGET_KIND_STATE_UNSPECIFIED = 0;
  SCHEDULED_DISPATCH_TARGET_KIND_STATE_ENVELOPE = 1;
  SCHEDULED_DISPATCH_TARGET_KIND_STATE_SERVICE_INVOCATION = 2;
  reserved 3;
}

enum ScheduledDispatchCredentialRequirementTargetKindState
{
  SCHEDULED_DISPATCH_CREDENTIAL_REQUIREMENT_TARGET_KIND_STATE_UNSPECIFIED = 0;
  SCHEDULED_DISPATCH_CREDENTIAL_REQUIREMENT_TARGET_KIND_STATE_ENVELOPE = 1;
  SCHEDULED_DISPATCH_CREDENTIAL_REQUIREMENT_TARGET_KIND_STATE_STATIC_SERVICE = 2;
  SCHEDULED_DISPATCH_CREDENTIAL_REQUIREMENT_TARGET_KIND_STATE_SCRIPTING_SERVICE = 3;
  SCHEDULED_DISPATCH_CREDENTIAL_REQUIREMENT_TARGET_KIND_STATE_WORKFLOW_SERVICE = 4;
  SCHEDULED_DISPATCH_CREDENTIAL_REQUIREMENT_TARGET_KIND_STATE_CONNECTOR = 5;
}

message ScheduledServiceInvocationTargetState
{
  aevatar.gagentservice.ServiceIdentity identity = 1;
  string endpoint_id = 2;
  google.protobuf.Any payload = 3;
  string revision_id = 4;
  aevatar.gagentservice.ServiceInvocationCaller caller = 5;
  ScheduledServiceInvocationAuthState auth = 6;
  ScheduledInvocationAuthorizationFactState authorization_fact = 7;
}

message ScheduledInvocationAuthorizationFactState
{
  string permission_digest = 1;
  string policy_version = 2;
  ScheduledInvocationAuthorizationOwnerState owner = 3;
  repeated ScheduledInvocationAuthorizationServiceGrantState service_grants = 4;
  string scopes = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool service_grants_not_required = 7;
  ScheduledInvocationAuthorizationDisclosureState disclosure = 8;
  ScheduledInvocationAuthorizationAuthorityState authority = 9;
  reserved 10;
  reserved "node_grants";
  aevatar.gagentservice.schedules.authorization.ScheduledInvocationOwnerLLMSelection owner_llm_selection = 11;
}

message ScheduledInvocationAuthorizationOwnerState
{
  string authority = 1;
  string owner_kind = 2;
  string owner_subject = 3;
}

message ScheduledInvocationAuthorizationServiceGrantState
{
  string service_id = 1;
  repeated string node_ids = 2;
  bool node_grants_not_required = 3;
}

message ScheduledInvocationAuthorizationDisclosureState
{
  bool dedicated_to_schedule = 1;
  bool secret_managed_by_aevatar = 2;
  bool browser_receives_raw_key = 3;
  bool delete_revokes_credential = 4;
  bool pause_resume_revokes_credential = 5;
}

message ScheduledInvocationAuthorizationAuthorityState
{
  reserved 8;
  reserved "catalog_external_revision";

  int64 member_state_version = 1;
  int64 workflow_state_version = 2;
  int64 connector_state_version = 3;
  int64 owner_llm_state_version = 4;
  int64 catalog_state_version = 5;
  google.protobuf.Timestamp catalog_observed_at = 6;
  google.protobuf.Timestamp catalog_fresh_until = 7;
  string catalog_content_digest = 9;
  string catalog_contract_version = 10;
  string catalog_policy_version = 11;
  google.protobuf.Timestamp catalog_evaluated_at = 12;
}

message ScheduledServiceInvocationAuthState
{
  ScheduledServiceInvocationNyxIdCredentialSourceState sender_nyx_id = 1 [deprecated = true];
  // Legacy field. Older schedule events may contain a raw bearer here; reducers
  // must not copy it into current state or runtime dispatch. Keep the field
  // readable until old events have been migrated, then reserve it.
  string durable_sender_bearer_token = 2 [deprecated = true];
  ScheduledServiceInvocationScopeOwnerNyxIdCredentialSourceState scope_owner_nyx_id = 3 [deprecated = true];
  bool legacy_durable_sender_bearer_blocked = 4;
  oneof source {
    ScheduledServiceInvocationNyxIdCredentialSourceState nyx_id = 5;
    ScheduledServiceInvocationDurableCredentialReferenceState durable = 6;
    ScheduledInvocationAgentKeyCredentialReferenceState scheduled_invocation_agent_key = 7;
  }
  aevatar.credentials.ScheduledCallerNyxIdAuthority caller_authority = 8;
}

message ScheduledInvocationAgentKeyCredentialReferenceState
{
  aevatar.credentials.SecretReference secret_reference = 1;
  string api_key_id = 2;
  int64 key_expires_at_unix_ms = 3;
}

message ScheduledCredentialEffectLocatorState
{
  string credential_name = 1;
  string requested_secret_reference = 2;
  string secret_purpose = 3;
  string secret_owner_scope_key = 4;
  ScheduledInvocationAuthorizationOwnerState credential_owner = 5;
}

message TeamAutomationActivationDecisionState
{
  string schedule_id = 1;
  string display_name = 2;
  TeamMemberAutomationOwnerState owner = 3;
  aevatar.gagentservice.ServiceIdentity service_identity = 4;
  string endpoint_id = 5;
  google.protobuf.Any payload = 6;
  aevatar.credentials.ScheduledCallerNyxIdAuthority caller_authority = 7;
  ScheduledInvocationAuthorizationFactState authorization_fact = 8;
  string cron_expression = 9;
  string timezone = 10;
  bool enabled = 11;
  ScheduledDispatchScheduleKindState schedule_kind = 12;
  map<string, string> headers = 13;
  ScheduledDispatchScheduleModeState schedule_mode = 14;
  google.protobuf.Timestamp one_shot_fire_at = 15;
  ScheduledDispatchCredentialRequirementTargetKindState credential_requirement_target_kind = 16;
  string revision_id = 17;
  aevatar.gagentservice.ServiceInvocationCaller caller = 18;
}

message ScheduledServiceInvocationScopeOwnerNyxIdCredentialSourceState
{
  string scope = 1;
  ScheduledServiceInvocationNyxIdSubjectRefState owner_subject = 2;
}

message ScheduledServiceInvocationNyxIdCredentialSourceState
{
  ScheduledServiceInvocationNyxIdSubjectRefState subject = 1;
  string scope = 2;
  ScheduledServiceInvocationNyxIdCredentialRoleState role = 3;
}

enum ScheduledServiceInvocationNyxIdCredentialRoleState
{
  SCHEDULED_SERVICE_INVOCATION_NYX_ID_CREDENTIAL_ROLE_STATE_UNSPECIFIED = 0;
  SCHEDULED_SERVICE_INVOCATION_NYX_ID_CREDENTIAL_ROLE_STATE_SENDER = 1;
  SCHEDULED_SERVICE_INVOCATION_NYX_ID_CREDENTIAL_ROLE_STATE_SCOPE_OWNER = 2;
}

message ScheduledServiceInvocationDurableCredentialReferenceState
{
  string credential_id = 1;
  aevatar.credentials.SecretReference secret_reference = 2;
}

message ScheduledServiceInvocationNyxIdSubjectRefState
{
  string platform = 1;
  string tenant = 2;
  string external_user_id = 3;
}

