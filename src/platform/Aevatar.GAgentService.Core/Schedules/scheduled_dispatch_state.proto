{
  TeamMemberAutomationOwnerState owner = 1;
  string error_code = 2;
  google.protobuf.Timestamp occurred_at = 3;
  google.protobuf.Timestamp scheduled_fire_at = 4;
  string idempotency_key = 5;
  bool manual = 6;
}

message TeamAutomationCredentialExpiryIntentRecordedEvent
{
  int64 credential_generation = 1;
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Timestamp requested_at = 3;
}

message TeamAutomationCredentialExpiryScheduledEvent
{
  int64 credential_generation = 1;
  google.protobuf.Timestamp expires_at = 2;
  ScheduledDispatchRuntimeCallbackLeaseState lease = 3;
  google.protobuf.Timestamp scheduled_at = 4;
}

message TeamAutomationCredentialExpiryCommand
{
  string schedule_id = 1;
  int64 credential_generation = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message TeamAutomationOperationObservedEvent
{
  string schedule_id = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  string stage = 4;
  bool owns_effect_attempt = 5;
  int64 state_version = 6;
  string error_code = 7;
  string error_message = 8;
  google.protobuf.Timestamp observed_at_utc = 9;
  ScheduledInvocationAgentKeyCredentialReferenceState pending_revocation_credential = 10;
  ScheduledInvocationAuthorizationOwnerState pending_revocation_owner = 11;
  bool nyxid_revocation_pending = 12;
  bool vault_revocation_pending = 13;
  string effect_attempt_id = 14;
  int64 effect_attempt_generation = 15;
  google.protobuf.Timestamp effect_attempt_expires_at = 16;
  ScheduledInvocationAgentKeyCredentialReferenceState candidate_credential = 17;
  ScheduledInvocationAuthorizationOwnerState candidate_owner = 18;
  ScheduledCredentialEffectLocatorState credential_effect_locator = 19;
  string mutation_digest = 20;
