efined || v === null || v === '') return false; if (Array.isArray(v)) return v.length > 0; if (typeof v === 'object') return Object.keys(v).length > 0; return true; }; const amount = v => { if (typeof v === 'number' && Number.isFinite(v)) return v; const s = norm(v); if (s === '') { if (filled(v)) fail('FIN02_AMOUNT_INVALID:' + NAME); return 0; } if (s.startsWith('(') !== s.endsWith(')')) fail('FIN02_AMOUNT_INVALID:' + NAME); const neg = s.startsWith('(') && s.endsWith(')'); const t = s.replace(/^\\(|\\)$/g, '').replace(/[,\\s\"$]/g, ''); const m = t.match(/^([A-Za-z]*)([+-]?(\\d+(\\.\\d+)?|\\.\\d+))$/); if (!m) fail('FIN02_AMOUNT_INVALID:' + NAME); const n = Number(m[2]); if (!Number.isFinite(n)) fail('FIN02_AMOUNT_INVALID:' + NAME); return neg ? -Math.abs(n) : n; }; const validCalendarDate = (y, m, d) => { if (m < 1 || m > 12 || d < 1 || d > 31) return false; const value = new Date(Date.UTC(y, m - 1, d)); return value.getUTCFullYear() === y && value.getUTCMonth() === m - 1 && value.getUTCDate() === d; }; const msToLocalDate = ms => new Date(ms + 8 * 3600 * 1000).toISOString().slice(0, 10); const normDate = v => { if (v === undefined || v === null || v === '') return ''; if (typeof v === 'number' && Number.isFinite(v)) { if (v < 1000000000000 || v > 4000000000000) fail('FIN02_DATE_INVALID:' + NAME); return msToLocalDate(v); } const s = norm(v); if (s === '') { if (filled(v)) fail('FIN02_DATE_INVALID:' + NAME); return ''; } let match = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/); if (!match) match = s.match(/^(\\d{4})\\/(\\d{1,2})\\/(\\d{1,2})$/); if (match) { const y = Number(match[1]); const m = Number(match[2]); const d = Number(match[3]); if (!validCalendarDate(y, m, d)) fail('FIN02_DATE_INVALID:' + NAME + ':' + s); return match[1] + '-' + ('0' + match[2]).slice(-2) + '-' + ('0' + match[3]).slice(-2); } if (/^\\d{13}$/.test(s)) return normDate(Number(s)); fail('FIN02_DATE_INVALID:' + NAME + ':' + s); }; const readPage = (label, value) => { if (!value || value.code !== 0 || !value.data || typeof value.data !== 'object' || Array.isArray(value.data)) fail('FIN02_READ_FAILED:' + label); const page = value.data; if (typeof page.has_more !== 'boolean') fail('FIN02_HAS_MORE_INVALID:' + label); const items = page.items === undefined ? [] : page.items; if (!Array.isArray(items)) fail('FIN02_ITEMS_INVALID:' + label); const total = Number(page.total); if (!Number.isInteger(total) || total < 0) fail('FIN02_TOTAL_INVALID:' + label); let token = ''; if (page.has_more) { if (typeof page.page_token !== 'string' || page.page_token.trim() === '') fail('FIN02_PAGE_TOKEN_MISSING:' + label); token = page.page_token.trim(); } return { items, total, hasMore: page.has_more, token }; }; const p1 = readPage(NAME + '_p1', data.p1); if (p1.total === 0) fail('FIN02_ZERO_ROWS:' + NAME); const pages = [p1]; if (p1.hasMore) { const p2 = readPage(NAME + '_p2', data.p2); if (p2.total !== p1.total) fail('FIN02_TOTAL_INCONSISTENT:' + NAME); pages.push(p2); if (p2.hasMore) { if (p2.token === p1.token) fail('FIN02_PAGE_TOKEN_REPEATED:' + NAME); const p3 = readPage(NAME + '_p3', data.p3); if (p3.total !== p1.total) fail('FIN02_TOTAL_INCONSISTENT:' + NAME); if (p3.hasMore) fail('FIN02_PAGINATION_LIMIT_EXCEEDED:' + NAME); pages.push(p3); } } const seen = Object.create(null); const sums = Object.create(null); let count = 0; let excluded = 0; let undated = 0; for (const page of pages) { for (const item of page.items) { if (!item || typeof item.record_id !== 'string' || item.record_id.trim() === '') fail('FIN02_RECORD_ID_MISSING:' + NAME); const recordId = item.record_id.trim(); if (seen[recordId]) fail('FIN02_DUPLICATE_RECORD:' + NAME); seen[recordId] = true; const fields = item.fields; if (!fields || typeof fields !== 'object' || Array.isArray(fields)) fail('FIN02_FIELDS_INVALID:' + NAME); const category = norm(fields[cfg.field_category]) || 'Unknown'; const value = amount(fields[cfg.field_amount]); const normalizedDate = normDate(fields[cfg.field_date]); count += 1; if (normalizedDate === '') undated += 1; else if (normalizedDate > cutoff) { excluded += 1; continue; } const next = (sums[category] || 0) + value; if (!Number.isFinite(next)) fail('FIN02_AMOUNT_INVALID:' + NAME); sums[category] = next; } } if (count !== p1.total) fail('FIN02_ROW_COUNT_MISMATCH:' + NAME); console.log(JSON.stringify({ name: NAME, sums, count, excluded, cutoff, undated_rows: undated, pagination_complete: true }));"}
    next: combine_ctx

  # ============================ 汇总与分级 ============================
  - id: combine_ctx
    type: assign
    parameters:
      target: combine_context
      value: >-
        {"config":${deploy_config},"request":${steps.normalize_request.output},"ca":${json(steps.ca_agg.output)},"cb":${json(steps.cb_agg.output)},"aa":${json(steps.aa_agg.output)},"ab":${json(steps.ab_agg.output)}}
    next: combine

  - id: combine
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.combine_ctx.output)}; const fail = code => { throw new Error(code); }; const validSums = value => { if (!value || typeof value !== 'object' || Array.isArray(value)) return false; for (const key of Object.keys(value)) { if (key.trim() === '' || typeof value[key] !== 'number' || !Number.isFinite(value[key])) return false; } return true; }; const unpack = (name, raw, kind) => { let envelope = raw; if (typeof envelope === 'string') { try { envelope = JSON.parse(envelope); } catch (error) { fail('FIN02_AGG_ENVELOPE_INVALID:' + name); } } if (!envelope || !envelope.output || typeof envelope.output.stdout !== 'string') fail('FIN02_AGG_ENVELOPE_INVALID:' + name); let value; try { value = JSON.parse(envelope.output.stdout); } catch (error) { fail('FIN02_AGG_PARSE_FAILED:' + name); } if (!value || value.name !== name || !validSums(value.sums) || value.pagination_complete !== true || !Number.isInteger(value.count) || value.count <= 0 || !Number.isInteger(value.undated_rows) || value.undated_rows < 0 || value.undated_rows > value.count) fail('FIN02_AGG_SHAPE_INVALID:' + name); if (kind === 'actual') { if (typeof value.max_date !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(value.max_date)) fail('FIN02_ACTUAL_CUTOFF_MISSING:' + name); } else if (!Number.isInteger(value.excluded) || value.excluded < 0 || value.excluded > value.count || typeof value.cutoff !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(value.cutoff)) { fail('FIN02_AGG_SHAPE_INVALID:' + name); } return value; }; const cfg = data.config; const req = data.request; const period = String(req.period_label || '').trim(); if (period === '') fail('FIN02_PERIOD_REQUIRED'); const actualCore = unpack('core_actual', data.ca, 'actual'); const budgetCore = unpack('core_budget', data.cb, 'budget'); const actualAelf = unpack('aelf_actual', data.aa, 'actual'); const budgetAelf = unpack('aelf_budget', data.ab, 'budget'); const round2 = value => Math.round(value * 100) / 100; const compareCategory = (a, b) => a.category < b.category ? -1 : (a.category > b.category ? 1 : 0); const buildBoard = (boardName, actual, budget) => { const cutoff = actual.max_date; if (budget.cutoff !== cutoff) fail('FIN02_CUTOFF_MISMATCH:' + boardName); const actualSums = actual.sums; const budgetSums = budget.sums; const categories = Array.from(new Set(Object.keys(actualSums).concat(Object.keys(budgetSums)))); const rows = []; let totalActual = 0; let totalBudget = 0; for (const category of Object.keys(actualSums)) totalActual += actualSums[category]; for (const category of Object.keys(budgetSums)) totalBudget += budgetSums[category]; for (const category of categories) { const actualValue = actualSums[category] || 0; const budgetValue = budgetSums[category] || 0; const rawPct = budgetValue > 0 ? actualValue / budgetValue * 100 : null; const noBudget = budgetValue <= 0 && actualValue > 0; let level = 'ok'; if (noBudget || (rawPct !== null && rawPct >= cfg.over_pct)) level = 'over'; else if (rawPct !== null && rawPct >= cfg.warning_pct) level = 'warning'; else if (rawPct !== null && rawPct >= cfg.watch_pct) level = 'watch'; const pct = budgetValue > 0 ? Math.round(rawPct * 10) / 10 : (actualValue > 0 ? -1 : 0); rows.push({ category, actual: round2(actualValue), budget: round2(budgetValue), pct, level, no_budget: noBudget }); } const rank = { over: 0, warning: 1, watch: 2, ok: 3 }; rows.sort((a, b) => { const rankDiff = rank[a.level] - rank[b.level]; if (rankDiff !== 0) return rankDiff; if (a.no_budget !== b.no_budget) return a.no_budget ? -1 : 1; const pctDiff = b.pct - a.pct; return pctDiff !== 0 ? pctDiff : compareCategory(a, b); }); const alerts = rows.filter(row => row.level !== 'ok').length; const okCount = rows.filter(row => row.level === 'ok').length; const totalPct = totalBudget > 0 ? Math.round(totalActual / totalBudget * 1000) / 10 : 0; return { board: boardName, cutoff, data_cutoff: cutoff, total_actual: round2(totalActual), total_budget: round2(totalBudget), total_pct: totalPct, rows, alerts, ok_count: okCount, source_actual_rows: actual.count, source_budget_rows: budget.count, undated_actual_rows: actual.undated_rows, undated_budget_rows: budget.undated_rows, excluded_budget_after_cutoff: budget.excluded, excluded_budget_rows: budget.excluded, source_rows: { actual: actual.count, actual_total: actual.count, budget: budget.count, budget_total: budget.count } }; }; const boards = [ buildBoard(cfg.core_board_name, actualCore, budgetCore), buildBoard(cfg.aelf_board_name, actualAelf, budgetAelf) ]; const dataCutoff = boards[0].cutoff > boards[1].cutoff ? boards[0].cutoff : boards[1].cutoff; const anyOver = boards.some(board => board.rows.some(row => row.level === 'over')); const anyWarning = boards.some(board => board.rows.some(row => row.level === 'warning')); const headerTemplate = anyOver ? 'red' : (anyWarning ? 'orange' : 'green'); const formatUsd = value => { const rounded = Math.round(value); return (rounded < 0 ? '-' : '') + '$' + Math.abs(rounded).toLocaleString('en-US'); }; const sectionText = board => { let value = '**' + board.board + '**  总计: ' + formatUsd(board.total_actual) + ' / ' + formatUsd(board.total_budget) + ' (' + board.total_pct + '%)\\n'; const groups = [['over','🔴 超支 (>=120%)'],['warning','🟡 警告 (>=100%)'],['watch','🟢 关注 (>=80%)']]; for (const group of groups) { const matches = board.rows.filter(row => row.level === group[0]); if (matches.length === 0) continue; value += '\\n' + group[1] + '\\n'; for (const row of matches) value += '- ' + row.category + '  ' + formatUsd(row.actual) + ' / ' + formatUsd(row.budget) + '  ' + (row.pct === -1 ? 'N/A(无预算)' : row.pct + '%') + '\\n'; } value += '\\n✅ 正常项: ' + board.ok_count + ' 项\\n'; return value; }; const card = { title: '📊 每周预算监控报告 ' + period, color: headerTemplate, cutoff_line: '数据截止: ' + dataCutoff, core_section: sectionText(boards[0]), aelf_section: sectionText(boards[1]) }; console.log(JSON.stringify({ workflow: 'fin_budget_variance_monitor', mode: req.submit === true ? 'SUBMIT' : 'PREVIEW', period_label: period, run_date: req.run_date || '', data_cutoff: dataCutoff, boards, header_template: headerTemplate, card, pagination_complete: true, truncated: false, side_effects: false }));"}
    next: parse_report

  - id: parse_report
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: route_mode

  - id: route_mode
    type: switch
    parameters:
      on: "${steps.parse_report.json.mode}"
      branch.SUBMIT: build_notify_context
      branch.PREVIEW: preview_summary
      branch._default: preview_summary
    branches:
      SUBMIT: build_notify_context
      PREVIEW: preview_summary
      _default: preview_summary

  # ---- preview 分支：零副作用 ----
  - id: preview_summary
    type: transform
    parameters:
      op: template
      template: >-
        {{ json({ workflow: 'fin_budget_variance_monitor', mode: 'preview',
                  period_label: data.period_label, run_date: data.run_date,
                  data_cutoff: data.data_cutoff, boards: data.boards,
                  header_template: data.header_template,
                  pagination_complete: data.pagination_complete,
                  truncated: data.truncated, side_effects: false }) }}
    next: done

  # ---- submit 分支：发送 1 张汇总卡片（legacy 版式）----
  - id: build_notify_context
    type: assign
    parameters:
      target: notify_context
      value: >-
        {"config":${deploy_config},"report":${steps.parse_report.output}}
    next: build_notify_request

  - id: build_notify_request
    type: transform
    parameters:
      op: template
      template: >-
        {{~ cfg = data.config; report = data.report; c = report.card ~}}
        {{~ card = json({
              config: { wide_screen_mode: true },
              header: { title: { tag: 'plain_text', content: c.title }, template: c.color },
              elements: [
                { tag: 'div', text: { tag: 'lark_md', content: c.cutoff_line } },
                { tag: 'hr' },
                { tag: 'div', text: { tag: 'lark_md', content: c.core_section } },
                { tag: 'hr' },
                { tag: 'div', text: { tag: 'lark_md', content: c.aelf_section } },
                { tag: 'hr' },
                { tag: 'action', actions: [ { tag: 'button', text: { tag: 'plain_text', content: '打开预算看板' }, type: 'primary', url: cfg.board_doc_url } ] },
                { tag: 'note', elements: [ { tag: 'plain_text', content: '🤖 Auto-generated by aevatar + NyxID | Budget Monitor' } ] } ] }) ~}}
        {{ json({ query: { receive_id_type: 'open_id' },
                  body: { receive_id: cfg.notify_open_id, msg_type: 'interactive', content: card } }) }}
    next: send_notify

  - id: send_notify
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: POST
        path_template: /open-apis/im/v1/messages
        query_parameters:
          - receive_id_type
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: merge_submit_results

  - id: merge_submit_results
    type: assign
    parameters:
      target: submit_results
      value: >-
        {"report":${steps.parse_report.output},"sent":${steps.send_notify.output}}
    next: summarize_submit

  - id: summarize_submit
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.sent.code != 0; number('FIN02_DIGEST_NOT_SENT'); end ~}}
        {{ json({ workflow: 'fin_budget_variance_monitor', mode: 'submit',
                  period_label: data.report.period_label, run_date: data.report.run_date,
                  data_cutoff: data.report.data_cutoff, boards: data.report.boards,
                  header_template: data.report.header_template,
                  pagination_complete: data.report.pagination_complete,
                  truncated: data.report.truncated,
                  message_id: get(data.sent.data, 'message_id', ''),
                  message_sent: true, side_effects: true }) }}
    next: done

  - id: done
    type: assign
    parameters:
      target: final
      value: "$input"
