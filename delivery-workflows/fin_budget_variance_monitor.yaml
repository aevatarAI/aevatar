# =============================================================================
# FIN-02 预算差异监控（正式配置：真实财务 Base 四表）
#
# 契约来源：archive/2026-07-30-for-aevatar-team/P2-budget-monitor
#          （budget_monitor_weekly，reduce 逻辑源自 n8n wtX8GCXakUQw4hbT）。
# 用途：读取核心业务 / aelf BU 两个看板各自的实际支出表与预算表（完整分页），
#       按一级类目做确定性差异聚合与分级，preview 输出结构化报告，
#       submit 额外发送 Lark 汇总卡片。
# 输入（JSON）：
#   {"period_label":"2026-W32","run_date":"2026-08-11","submit":false}
# 模式：
#   submit=false（默认）→ 只输出报告，零副作用
#   submit=true          → 输出报告 + 发送 1 张 Lark 卡片
#
# 行为契约（与 legacy 逐条对齐）：
#   - 四张表全部沿 page_token 完整分页（每表最多 3 页 x 500 行；record_id 唯一性校验，
#     累计行数与 total 精确核对；超出 3 页返回 FIN02_PAGINATION_LIMIT_EXCEEDED）。
#   - 聚合全部在 code_execute 内 O(rows) 完成，不用模板遍历真实数据。
#   - 实际支出行永不按日期过滤（无日期行计入合计并单独计数）；
#     每个看板的预算行按该看板「最新实际日期」截断：日期晚于 cutoff 的预算行
#     不计入预算合计（无日期预算行恒计入）。
#   - 分级：预算>0 时 pct=actual/budget；>=120 over、>=100 warning、>=80 watch、
#     其余 ok；预算为 0 且实际有支出 → level=over 且 no_budget=true。
#   - 日期列同时支持文本 ISO（生产表）与毫秒时间戳（同一规则规范化）；
#     其他形态返回 FIN02_DATE_INVALID，绝不静默错分。
#   - artifact 含两个看板、每看板 cutoff、总额、分类明细、source row counts、
#     pagination_complete=true、truncated=false、side_effects=false。
#
# ★ 部署参数见 config 步骤；user_service_id 为 ChronoAI Lark Bot 的 NyxID 服务。
# =============================================================================
name: fin_budget_variance_monitor
description: 预算差异监控：完整分页读取真实财务 Base 的核心业务/aelf BU 实际与预算四表，code_execute 内 O(rows) 确定性聚合，按看板最新实际日期截断预算并输出 ok/watch/warning/over 分级及 no_budget 标记，preview 零副作用，submit 发送一张 Lark 汇总卡片。
roles:
  - id: analyst
    name: Budget Analyst
steps:
  - id: capture_request
    type: assign
    parameters:
      target: raw_request
      value: "$input"
    next: normalize_request

  - id: normalize_request
    type: transform
    parameters:
      op: template
      template: >-
        {{~ period = get(data, 'period_label', ''); if period == '' || json(period) == 'null'; number('FIN02_PERIOD_REQUIRED'); end ~}}
        {{~ submit = get(data, 'submit', false) == true || get(data, 'submit', false) == 'true' ~}}
        {{ json({ period_label: period, run_date: get(data, 'run_date', ''), submit: submit }) }}
    next: config

  # ★★★ 部署参数（真实正式配置）★★★
  - id: config
    type: assign
    parameters:
      target: deploy_config
      value: >-
        {"app_token":"L80RbTPAjaiZpOsaYo3lnmYCg3s",
         "core_actual_table_id":"tblVuALMhd7WGu9k",
         "core_budget_table_id":"tblMtwgzEhW7yWTq",
         "aelf_actual_table_id":"tbl3lXCuWOSlaiR5",
         "aelf_budget_table_id":"tblVkaJLvAjLHARJ",
         "core_board_name":"核心业务看板",
         "aelf_board_name":"aelf BU 看板",
         "field_date":"日期",
         "field_category":"一级类目",
         "field_amount":"支出金额(USD)",
         "budget_field_names":"[\"日期\",\"一级类目\",\"支出金额(USD)\"]",
         "actual_field_names":"[\"日期\",\"一级类目\",\"支出金额(USD)\"]",
         "watch_pct":80,
         "warning_pct":100,
         "over_pct":120,
         "page_size":"500",
         "notify_open_id":"ou_3d9067006e9fb8eb8e5fc7b2bb4c6264",
         "board_doc_url":"https://aelfblockchain.sg.larksuite.com/base/L80RbTPAjaiZpOsaYo3lnmYCg3s"}
    next: ca_p1

  # ============================ 核心业务：实际支出 ============================
  - id: ca_p1
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records
        query_parameters:
          - page_size
          - field_names
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: >-
        {"path_params":{"app_token":"${steps.config.json.app_token}","table_id":"${steps.config.json.core_actual_table_id}"},"query":{"page_size":"${steps.config.json.page_size}","field_names":"${json(steps.config.json.actual_field_names)}"}}
    next: ca_p2_ctx

  - id: ca_p2_ctx
    type: assign
    parameters:
      target: ca_p2_context
      value: >-
        {"config":${deploy_config},"table_id_key":"core_actual_table_id","p1":${steps.ca_p1.output}}
    next: ca_p2_req

  - id: ca_p2_req
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.p1.code != 0; number('FIN02_READ_FAILED:core_actual_p1'); end ~}}
        {{~ cfg = data.config ~}}
        {{~ more = get(data.p1.data, 'has_more', false); token = get(data.p1.data, 'page_token', '') ~}}
        {{~ if more == true && token != '' ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_actual_table_id }, query: { page_size: cfg.page_size, field_names: cfg.actual_field_names, page_token: token } }) }}
        {{~ else ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_actual_table_id }, query: { page_size: '1', field_names: cfg.actual_field_names } }) }}
        {{~ end ~}}
    next: ca_p2

  - id: ca_p2
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records
        query_parameters:
          - page_size
          - field_names
          - page_token
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: ca_p3_ctx

  - id: ca_p3_ctx
    type: assign
    parameters:
      target: ca_p3_context
      value: >-
        {"config":${deploy_config},"p1":${steps.ca_p1.output},"p2":${steps.ca_p2.output}}
    next: ca_p3_req

  - id: ca_p3_req
    type: transform
    parameters:
      op: template
      template: >-
        {{~ cfg = data.config ~}}
        {{~ p1_more = get(data.p1.data, 'has_more', false); p1_token = get(data.p1.data, 'page_token', '') ~}}
        {{~ if p1_more == true && p1_token != '' ~}}
        {{~ if data.p2.code != 0; number('FIN02_READ_FAILED:core_actual_p2'); end ~}}
        {{~ p2_more = get(data.p2.data, 'has_more', false); p2_token = get(data.p2.data, 'page_token', '') ~}}
        {{~ if p2_more == true && p2_token != '' ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_actual_table_id }, query: { page_size: cfg.page_size, field_names: cfg.actual_field_names, page_token: p2_token } }) }}
        {{~ else ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_actual_table_id }, query: { page_size: '1', field_names: cfg.actual_field_names } }) }}
        {{~ end ~}}
        {{~ else ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_actual_table_id }, query: { page_size: '1', field_names: cfg.actual_field_names } }) }}
        {{~ end ~}}
    next: ca_p3

  - id: ca_p3
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records
        query_parameters:
          - page_size
          - field_names
          - page_token
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: ca_asm

  - id: ca_asm
    type: assign
    parameters:
      target: ca_pages
      value: >-
        {"name":"core_actual","config":${deploy_config},"p1":${steps.ca_p1.output},"p2":${steps.ca_p2.output},"p3":${steps.ca_p3.output}}
    next: ca_agg

  - id: ca_agg
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.ca_asm.output)}; const cfg = data.config; const NAME = data.name; const fail = code => { throw new Error(code); }; const norm = v => { if (v === undefined || v === null) return ''; if (typeof v === 'string') return v.trim(); if (typeof v === 'number') return String(v); if (Array.isArray(v)) { let s = ''; for (const seg of v) { if (seg && typeof seg === 'object' && typeof seg.text === 'string') s += seg.text; else if (typeof seg === 'string') s += seg; } return s.trim(); } if (typeof v === 'object' && typeof v.text === 'string') return v.text.trim(); return ''; }; const filled = v => { if (v === undefined || v === null || v === '') return false; if (Array.isArray(v)) return v.length > 0; if (typeof v === 'object') return Object.keys(v).length > 0; return true; }; const amount = v => { if (typeof v === 'number' && Number.isFinite(v)) return v; const s = norm(v); if (s === '') { if (filled(v)) fail('FIN02_AMOUNT_INVALID:' + NAME); return 0; } if (s.startsWith('(') !== s.endsWith(')')) fail('FIN02_AMOUNT_INVALID:' + NAME); const neg = s.startsWith('(') && s.endsWith(')'); const t = s.replace(/^\\(|\\)$/g, '').replace(/[,\\s\"$]/g, ''); const m = t.match(/^([A-Za-z]*)([+-]?(\\d+(\\.\\d+)?|\\.\\d+))$/); if (!m) fail('FIN02_AMOUNT_INVALID:' + NAME); const n = Number(m[2]); if (!Number.isFinite(n)) fail('FIN02_AMOUNT_INVALID:' + NAME); return neg ? -Math.abs(n) : n; }; const validCalendarDate = (y, m, d) => { if (m < 1 || m > 12 || d < 1 || d > 31) return false; const value = new Date(Date.UTC(y, m - 1, d)); return value.getUTCFullYear() === y && value.getUTCMonth() === m - 1 && value.getUTCDate() === d; }; const msToLocalDate = ms => new Date(ms + 8 * 3600 * 1000).toISOString().slice(0, 10); const normDate = v => { if (v === undefined || v === null || v === '') return ''; if (typeof v === 'number' && Number.isFinite(v)) { if (v < 1000000000000 || v > 4000000000000) fail('FIN02_DATE_INVALID:' + NAME); return msToLocalDate(v); } const s = norm(v); if (s === '') { if (filled(v)) fail('FIN02_DATE_INVALID:' + NAME); return ''; } let match = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/); if (!match) match = s.match(/^(\\d{4})\\/(\\d{1,2})\\/(\\d{1,2})$/); if (match) { const y = Number(match[1]); const m = Number(match[2]); const d = Number(match[3]); if (!validCalendarDate(y, m, d)) fail('FIN02_DATE_INVALID:' + NAME + ':' + s); return match[1] + '-' + ('0' + match[2]).slice(-2) + '-' + ('0' + match[3]).slice(-2); } if (/^\\d{13}$/.test(s)) return normDate(Number(s)); fail('FIN02_DATE_INVALID:' + NAME + ':' + s); }; const readPage = (label, value) => { if (!value || value.code !== 0 || !value.data || typeof value.data !== 'object' || Array.isArray(value.data)) fail('FIN02_READ_FAILED:' + label); const page = value.data; if (typeof page.has_more !== 'boolean') fail('FIN02_HAS_MORE_INVALID:' + label); const items = page.items === undefined ? [] : page.items; if (!Array.isArray(items)) fail('FIN02_ITEMS_INVALID:' + label); const total = Number(page.total); if (!Number.isInteger(total) || total < 0) fail('FIN02_TOTAL_INVALID:' + label); let token = ''; if (page.has_more) { if (typeof page.page_token !== 'string' || page.page_token.trim() === '') fail('FIN02_PAGE_TOKEN_MISSING:' + label); token = page.page_token.trim(); } return { items, total, hasMore: page.has_more, token }; }; const p1 = readPage(NAME + '_p1', data.p1); if (p1.total === 0) fail('FIN02_ZERO_ROWS:' + NAME); const pages = [p1]; if (p1.hasMore) { const p2 = readPage(NAME + '_p2', data.p2); if (p2.total !== p1.total) fail('FIN02_TOTAL_INCONSISTENT:' + NAME); pages.push(p2); if (p2.hasMore) { if (p2.token === p1.token) fail('FIN02_PAGE_TOKEN_REPEATED:' + NAME); const p3 = readPage(NAME + '_p3', data.p3); if (p3.total !== p1.total) fail('FIN02_TOTAL_INCONSISTENT:' + NAME); if (p3.hasMore) fail('FIN02_PAGINATION_LIMIT_EXCEEDED:' + NAME); pages.push(p3); } } const seen = Object.create(null); const sums = Object.create(null); let count = 0; let maxDate = ''; let undated = 0; for (const page of pages) { for (const item of page.items) { if (!item || typeof item.record_id !== 'string' || item.record_id.trim() === '') fail('FIN02_RECORD_ID_MISSING:' + NAME); const recordId = item.record_id.trim(); if (seen[recordId]) fail('FIN02_DUPLICATE_RECORD:' + NAME); seen[recordId] = true; const fields = item.fields; if (!fields || typeof fields !== 'object' || Array.isArray(fields)) fail('FIN02_FIELDS_INVALID:' + NAME); const category = norm(fields[cfg.field_category]) || 'Unknown'; const value = amount(fields[cfg.field_amount]); const normalizedDate = normDate(fields[cfg.field_date]); if (normalizedDate === '') undated += 1; else if (normalizedDate > maxDate) maxDate = normalizedDate; const next = (sums[category] || 0) + value; if (!Number.isFinite(next)) fail('FIN02_AMOUNT_INVALID:' + NAME); sums[category] = next; count += 1; } } if (count !== p1.total) fail('FIN02_ROW_COUNT_MISMATCH:' + NAME); console.log(JSON.stringify({ name: NAME, sums, max_date: maxDate, count, undated_rows: undated, pagination_complete: true }));"}
    next: cb_p1

  # ============================ 核心业务：预算 ============================
  - id: cb_p1
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records
        query_parameters:
          - page_size
          - field_names
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: >-
        {"path_params":{"app_token":"${steps.config.json.app_token}","table_id":"${steps.config.json.core_budget_table_id}"},"query":{"page_size":"${steps.config.json.page_size}","field_names":"${json(steps.config.json.budget_field_names)}"}}
    next: cb_p2_ctx

  - id: cb_p2_ctx
    type: assign
    parameters:
      target: cb_p2_context
      value: >-
        {"config":${deploy_config},"p1":${steps.cb_p1.output}}
    next: cb_p2_req

  - id: cb_p2_req
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.p1.code != 0; number('FIN02_READ_FAILED:core_budget_p1'); end ~}}
        {{~ cfg = data.config ~}}
        {{~ more = get(data.p1.data, 'has_more', false); token = get(data.p1.data, 'page_token', '') ~}}
        {{~ if more == true && token != '' ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_budget_table_id }, query: { page_size: cfg.page_size, field_names: cfg.budget_field_names, page_token: token } }) }}
        {{~ else ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_budget_table_id }, query: { page_size: '1', field_names: cfg.budget_field_names } }) }}
        {{~ end ~}}
    next: cb_p2

  - id: cb_p2
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records
        query_parameters:
          - page_size
          - field_names
          - page_token
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: cb_p3_ctx

  - id: cb_p3_ctx
    type: assign
    parameters:
      target: cb_p3_context
      value: >-
        {"config":${deploy_config},"p1":${steps.cb_p1.output},"p2":${steps.cb_p2.output}}
    next: cb_p3_req

  - id: cb_p3_req
    type: transform
    parameters:
      op: template
      template: >-
        {{~ cfg = data.config ~}}
        {{~ p1_more = get(data.p1.data, 'has_more', false); p1_token = get(data.p1.data, 'page_token', '') ~}}
        {{~ if p1_more == true && p1_token != '' ~}}
        {{~ if data.p2.code != 0; number('FIN02_READ_FAILED:core_budget_p2'); end ~}}
        {{~ p2_more = get(data.p2.data, 'has_more', false); p2_token = get(data.p2.data, 'page_token', '') ~}}
        {{~ if p2_more == true && p2_token != '' ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_budget_table_id }, query: { page_size: cfg.page_size, field_names: cfg.budget_field_names, page_token: p2_token } }) }}
        {{~ else ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_budget_table_id }, query: { page_size: '1', field_names: cfg.budget_field_names } }) }}
        {{~ end ~}}
        {{~ else ~}}
        {{ json({ path_params: { app_token: cfg.app_token, table_id: cfg.core_budget_table_id }, query: { page_size: '1', field_names: cfg.budget_field_names } }) }}
        {{~ end ~}}
    next: cb_p3

  - id: cb_p3
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records
        query_parameters:
          - page_size
          - field_names
          - page_token
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: cb_asm

  - id: cb_asm
    type: assign
    parameters:
      target: cb_pages
      value: >-
        {"name":"core_budget","config":${deploy_config},"actual":${json(steps.ca_agg.output)},"p1":${steps.cb_p1.output},"p2":${steps.cb_p2.output},"p3":${steps.cb_p3.output}}
    next: cb_agg

  - id: cb_agg
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.cb_asm.output)}; const cfg = data.config; const NAME = data.name; const ACTUAL_NAME = NAME.replace(/_budget$/, '_actual'); const fail = code => { throw new Error(code); }; const validSums = value => { if (!value || typeof value !== 'object' || Array.isArray(value)) return false; for (const key of Object.keys(value)) { if (key.trim() === '' || typeof value[key] !== 'number' || !Number.isFinite(value[key])) return false; } return true; }; const unpackActual = raw => { let envelope = raw; if (typeof envelope === 'string') { try { envelope = JSON.parse(envelope); } catch (error) { fail('FIN02_AGG_ENVELOPE_INVALID:' + ACTUAL_NAME); } } if (!envelope || !envelope.output || typeof envelope.output.stdout !== 'string') fail('FIN02_AGG_ENVELOPE_INVALID:' + ACTUAL_NAME); let value; try { value = JSON.parse(envelope.output.stdout); } catch (error) { fail('FIN02_AGG_PARSE_FAILED:' + ACTUAL_NAME); } if (!value || value.name !== ACTUAL_NAME || !validSums(value.sums) || value.pagination_complete !== true || !Number.isInteger(value.count) || value.count <= 0 || !Number.isInteger(value.undated_rows) || value.undated_rows < 0 || value.undated_rows > value.count) fail('FIN02_AGG_SHAPE_INVALID:' + ACTUAL_NAME); if (typeof value.max_date !== 'string' || !/^\\d{4}-\\d{2}-\\d{2}$/.test(value.max_date)) fail('FIN02_ACTUAL_CUTOFF_MISSING:' + ACTUAL_NAME); return value; }; const actual = unpackActual(data.actual); const cutoff = actual.max_date; const norm = v => { if (v === undefined || v === null) return ''; if (typeof v === 'string') return v.trim(); if (typeof v === 'number') return String(v); if (Array.isArray(v)) { let s = ''; for (const seg of v) { if (seg && typeof seg === 'object' && typeof seg.text === 'string') s += seg.text; else if (typeof seg === 'string') s += seg; } return s.trim(); } if (typeof v === 'object' && typeof v.text === 'string') return v.text.trim(); return ''; }; const filled = v => { if (v === und