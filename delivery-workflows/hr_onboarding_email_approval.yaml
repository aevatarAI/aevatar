# =============================================================================
# HR-01 入职邮箱开通审批（正式配置：真实「邮箱开通申请」审批）
#
# 契约来源：legacy「Lark Onboarding - 自动发起邮箱审批」+ Base 到邮箱审批 e2e
#          （archive/legacy-root）。
# 用途：为新入职员工发起「邮箱开通申请」Lark 审批。
# 输入（JSON）：
#   inline 入口：
#     {"lark_name":"Lin Xiaoyu","department":"Platform Engineering",
#      "onboarding_date":"2026-08-17","email_username":"lin.xiaoyu",
#      "run_date":"2026-08-11","submit":false}
#   record 入口（Employee Master 一条记录，Base automation 传 record_id）：
#     {"record_id":"recXXXX","submit":false}
#     run_date 可省略；省略时按 sandbox 步骤墙钟固定偏移 UTC+8 取当天。
#   发起人：请求 operator_id > 请求 operator_email（联系人解析）> Employee Master operator_id。
#   全部缺失 -> HR01_OPERATOR_REQUIRED。
#
# 行为契约：
#   - 邮箱前缀确定性规范化：显式 email_username 必须匹配 ^[a-z0-9]+(\.[a-z0-9]+)*$；
#     未提供时从 Nickname 推导（仅当姓名为 ASCII 字母/数字/空格/点），
#     中文名或含非法字符 -> HR01_NAME_NOT_ASCII，要求显式邮箱前缀；
#     任何情况下都不会生成空前缀的 @aelf.io。
#   - preview / submit 前查重：分页读取最近 365 天「邮箱开通申请」审批
#     （最多 3 页 x 100；缺 continuation token 或超出范围均 fail closed），
#     按页并发读取全部实例明细；任一明细读取或解析失败时 submit fail closed。
#     明细匹配 新邮箱：<email> 或 姓名：<name>（，
#     且状态为 PENDING/APPROVED 的记为重复：preview ready_for_submit=false，
#     submit 硬失败 HR01_DUPLICATE_ONBOARDING。
#   - 审批创建携带确定性 uuid（邮箱+run_date 摘要），同日重复提交被 Lark 幂等拒绝。
#   - record 入口读取真实 Employee Master；自动化负责传 operator_id，或使用记录内 operator_id。
#     Base owner 必须给 ChronoAI Lark Bot 文档访问权，并让目标表的高级权限角色生效；
#     否则读取会返回 91403 / 1254302。
#
# ★ 部署参数见 config 步骤；user_service_id 为 ChronoAI Lark Bot 的 NyxID 服务。
# =============================================================================
name: hr_onboarding_email_approval
description: 入职邮箱开通审批：从输入或入职登记 Base 取新人信息，确定性规范化邮箱前缀（非法/中文名要求显式前缀），完整分页查重最近 365 天邮箱审批，preview 输出审批内容与查重结果，submit 以请求中的操作者身份创建一条审批并回读。
roles:
  - id: operator
    name: HR Operator
steps:
  - id: capture_request
    type: assign
    parameters:
      target: raw_request
      value: "$input"
    next: normalize_request

  - id: normalize_request
    type: transform
    parameters:
      op: template
      template: >-
        {{~ rid = get(data, 'record_id', '') ~}}
        {{ json({ record_id: rid,
                  source: rid == '' ? 'inline' : 'record',
                  lark_name: get(data, 'lark_name', ''),
                  department: get(data, 'department', ''),
                  onboarding_date: get(data, 'onboarding_date', ''),
                  email_username: get(data, 'email_username', ''),
                  operator_id: get(data, 'operator_id', ''),
                  operator_email: get(data, 'operator_email', ''),
                  run_date: get(data, 'run_date', ''),
                  submit: get(data, 'submit', false) }) }}
    next: config

  # ★★★ 部署参数（真实正式配置）★★★
  # Employee Master 的真实 app/table 已由业务 owner 确认。
  - id: config
    type: assign
    parameters:
      target: deploy_config
      value: >-
        {"company_domain":"aelf.io",
         "approval_code":"9C330885-C70A-4A5D-913A-CBA9A142FFD4",
         "widget_detail_id":"widget17163600360780001",
         "widget_link_id":"widget17163600454870001",
         "onboarding_app_token":"Xb5wb7YFqaCf4Ysuq2el3bVPgNe",
         "onboarding_table_id":"tblxilSWWYTzV7al",
         "field_lark_name":"Nickname",
         "field_department":"Department",
         "field_onboarding_date":"Onboarding Date",
         "field_operator_id":"operator_id",
         "approval_template_url":"https://aelfblockchain.sg.larksuite.com/wiki/X2qawX4wNidDIHkmPx6lilmYg8E?from=from_copylink",
         "history_page_size":"100"}
    next: route_source

  - id: route_source
    type: switch
    parameters:
      on: "${steps.normalize_request.json.source}"
      branch.record: merge_record_guard
      branch.inline: merge_inline_context
      branch._default: merge_inline_context
    branches:
      record: merge_record_guard
      inline: merge_inline_context
      _default: merge_inline_context

  # ---- 来源 A：入职登记 Base 记录 ----
  - id: merge_record_guard
    type: assign
    parameters:
      target: record_guard_context
      value: >-
        {"config":${deploy_config},"request":${steps.normalize_request.output}}
    next: build_record_read

  - id: build_record_read
    type: transform
    parameters:
      op: template
      template: >-
        {{~ cfg = data.config ~}}
        {{~ if cfg.onboarding_app_token == '' || cfg.onboarding_table_id == ''; number('HR01_ONBOARDING_BASE_NOT_CONFIGURED'); end ~}}
        {{ json({ path_params: { app_token: cfg.onboarding_app_token, table_id: cfg.onboarding_table_id, record_id: data.request.record_id } }) }}
    next: read_record

  - id: read_record
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records/{record_id}
        query_parameters: []
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: merge_record_context

  - id: merge_record_context
    type: assign
    parameters:
      target: record_context
      value: >-
        {"config":${deploy_config},"request":${steps.normalize_request.output},"record":${steps.read_record.output}}
    next: normalize_record

  - id: normalize_record
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.record.code != 0; number('HR01_RECORD_READ_FAILED'); end ~}}
        {{~ cfg = data.config; fields = data.record.data.record.fields; req = data.request ~}}
        {{ json({ source: 'record',
                  lark_name: get(fields, cfg.field_lark_name, ''),
                  department: get(fields, cfg.field_department, ''),
                  onboarding_date: get(fields, cfg.field_onboarding_date, ''),
                  email_username: req.email_username,
                  operator_id: req.operator_id,
                  record_operator_id: get(fields, cfg.field_operator_id, ''),
                  operator_email: req.operator_email,
                  run_date: req.run_date,
                  submit: req.submit }) }}
    next: person_ctx

  # ---- 来源 B：inline ----
  - id: merge_inline_context
    type: assign
    parameters:
      target: inline_context
      value: >-
        {"request":${steps.normalize_request.output}}
    next: normalize_inline

  - id: normalize_inline
    type: transform
    parameters:
      op: template
      template: >-
        {{~ req = data.request ~}}
        {{ json({ source: 'inline',
                  lark_name: req.lark_name,
                  department: req.department,
                  onboarding_date: req.onboarding_date,
                  email_username: req.email_username,
                  operator_id: req.operator_id,
                  record_operator_id: '',
                  operator_email: req.operator_email,
                  run_date: req.run_date,
                  submit: req.submit }) }}
    next: person_ctx

  # ---- 汇合：确定性规范化（邮箱前缀 / 日期 / 操作者 / 查重窗口 / uuid）----
  - id: person_ctx
    type: assign
    parameters:
      target: person_context
      value: >-
        {"config":${deploy_config},"person":${input}}
    next: normalize_person

  - id: normalize_person
    type: tool_call
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.person_ctx.output)}; const cfg = data.config; const p = data.person; const fail = code => { throw new Error(code); }; const norm = v => { if (v === undefined || v === null) return ''; if (typeof v === 'string') return v.trim(); if (typeof v === 'number') return String(v); if (Array.isArray(v)) { const users = v.filter(seg => seg && typeof seg === 'object' && typeof seg.text !== 'string' && ((typeof seg.en_name === 'string' && seg.en_name.trim() !== '') || (typeof seg.name === 'string' && seg.name.trim() !== ''))); if (users.length !== 0) return users.length === 1 ? (typeof users[0].en_name === 'string' && users[0].en_name.trim() !== '' ? users[0].en_name : users[0].name).trim() : ''; let s = ''; for (const seg of v) { if (seg && typeof seg === 'object' && typeof seg.text === 'string') s += seg.text; else if (typeof seg === 'string') s += seg; } return s.trim(); } if (typeof v === 'object') { if (typeof v.text === 'string') return v.text.trim(); if (typeof v.en_name === 'string' && v.en_name.trim() !== '') return v.en_name.trim(); if (typeof v.name === 'string') return v.name.trim(); } return ''; }; const requireDate = (value, code) => { const m = value.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/); if (!m) fail(code); const y = Number(m[1]); const mo = Number(m[2]); const d = Number(m[3]); const dt = new Date(Date.UTC(y, mo - 1, d)); if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) fail(code); return m; }; const name = norm(p.lark_name); if (name === '') fail('HR01_NAME_REQUIRED'); const department = norm(p.department); if (department === '') fail('HR01_DEPARTMENT_REQUIRED'); let onboardingDate = norm(p.onboarding_date); if (/^(?:\\d{10}|\\d{13})$/.test(onboardingDate)) { const ms = Number(onboardingDate.length === 10 ? onboardingDate + '000' : onboardingDate); onboardingDate = new Date(ms + 8 * 3600 * 1000).toISOString().slice(0, 10); } else { const dmy = onboardingDate.match(/^(\\d{2})\\/(\\d{2})\\/(\\d{4})$/); if (dmy) { const y = Number(dmy[3]); const mo = Number(dmy[2]); const d = Number(dmy[1]); const dt = new Date(Date.UTC(y, mo - 1, d)); if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) fail('HR01_ONBOARDING_DATE_REQUIRED:YYYY-MM-DD'); onboardingDate = dmy[3] + '-' + dmy[2] + '-' + dmy[1]; } } requireDate(onboardingDate, 'HR01_ONBOARDING_DATE_REQUIRED:YYYY-MM-DD'); const explicitPrefix = norm(p.email_username).toLowerCase(); let prefix = ''; let prefixSource = ''; const PREFIX_RE = /^[a-z0-9]+(\\.[a-z0-9]+)*$/; if (explicitPrefix !== '') { if (!PREFIX_RE.test(explicitPrefix)) fail('HR01_EMAIL_PREFIX_INVALID:' + explicitPrefix); prefix = explicitPrefix; prefixSource = 'explicit'; } else { if (!/^[A-Za-z0-9 .]+$/.test(name)) fail('HR01_NAME_NOT_ASCII: provide email_username explicitly'); const derived = name.toLowerCase().replace(/\\s+/g, '.').replace(/\\.+/g, '.').replace(/^\\.+|\\.+$/g, ''); if (derived === '' || !PREFIX_RE.test(derived)) fail('HR01_EMAIL_PREFIX_EMPTY: provide email_username explicitly'); prefix = derived; prefixSource = 'derived'; } const email = prefix + '@' + cfg.company_domain; const operatorEmail = norm(p.operator_email).toLowerCase(); const requestedOperator = norm(p.operator_id); const recordOperator = norm(p.record_operator_id); const operatorId = requestedOperator || (operatorEmail === '' ? recordOperator : ''); if (operatorId === '' && operatorEmail === '') fail('HR01_OPERATOR_REQUIRED'); let runDate = norm(p.run_date); if (runDate === '') { runDate = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10); } const rm = requireDate(runDate, 'HR01_RUN_DATE_REQUIRED:YYYY-MM-DD'); const endMs = Date.UTC(Number(rm[1]), Number(rm[2]) - 1, Number(rm[3]), 23, 59, 59); const startMs = endMs - 365 * 24 * 60 * 60 * 1000; const sub = p.submit === true || p.submit === 'true'; const hex32 = (str, seed) => { let h = (2166136261 ^ seed) >>> 0; for (let i = 0; i < str.length; i += 1) { h = (h ^ str.charCodeAt(i)) >>> 0; h = Math.imul(h, 16777619) >>> 0; } return ('0000000' + h.toString(16)).slice(-8); }; const key = 'HR01|' + cfg.approval_code + '|' + email + '|' + runDate; const hex = hex32(key, 1) + hex32(key, 2) + hex32(key, 3) + hex32(key, 4); const uuid = hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20, 32); console.log(JSON.stringify({ mode: sub ? 'SUBMIT' : 'PREVIEW', source: p.source, name: name, department: department, onboarding_date: onboardingDate, email: email, email_prefix_source: prefixSource, operator_user_id: operatorId, operator_email: operatorEmail, needs_lookup: operatorId === '' ? 'YES' : 'NO', run_date: runDate, window_start: String(startMs), window_end: String(endMs), approval_uuid: uuid, lookup_request: { query: { user_id_type: 'user_id' }, body: { emails: [operatorEmail] } } }));"}
    next: parse_person

  - id: parse_person
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: route_operator

  # ---- 操作者解析：operator_id 直用；operator_email 经 contact 接口解析 ----
  - id: route_operator
    type: switch
    parameters:
      on: "${steps.parse_person.json.needs_lookup}"
      branch.YES: extract_lookup_request
      branch.NO: operator_ready
      branch._default: operator_ready
    branches:
      "YES": extract_lookup_request
      "NO": operator_ready
      _default: operator_ready

  - id: extract_lookup_request
    type: transform
    parameters:
      op: json_extract
      path: lookup_request
    next: contact_lookup

  - id: contact_lookup
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: POST
        path_template: /open-apis/contact/v3/users/batch_get_id
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
        risk: write
    parameters:
      tool: nyxid_proxy
    next: merge_lookup

  - id: merge_lookup
    type: assign
    parameters:
      target: lookup_merged
      value: >-
        {"person":${steps.parse_person.output},"lookup":${steps.contact_lookup.output}}
    next: resolve_operator

  - id: resolve_operator
    type: transform
    parameters:
      op: template
      template: >-
        {{~ p = data.person ~}}
        {{~ if data.lookup.code != 0; number('HR01_OPERATOR_LOOKUP_FAILED'); end ~}}
        {{~ resolved = '' ~}}
        {{~ for u in get(data.lookup.data, 'user_list', []) ~}}
        {{~ if get(u, 'user_id', '') != '' && resolved == ''; resolved = u.user_id; end ~}}
        {{~ end ~}}
        {{~ if resolved == ''; number('HR01_OPERATOR_EMAIL_NOT_FOUND'); end ~}}
        {{ json({ mode: p.mode, source: p.source, name: p.name, department: p.department,
                  onboarding_date: p.onboarding_date, email: p.email,
                  email_prefix_source: p.email_prefix_source,
                  operator_user_id: resolved, run_date: p.run_date,
                  window_start: p.window_start, window_end: p.window_end,
                  approval_uuid: p.approval_uuid }) }}
    next: person_final

  - id: operator_ready
    type: transform
    parameters:
      op: template
      template: >-
        {{~ p = data ~}}
        {{ json({ mode: p.mode, source: p.source, name: p.name, department: p.department,
                  onboarding_date: p.onboarding_date, email: p.email,
                  email_prefix_source: p.email_prefix_source,
                  operator_user_id: p.operator_user_id, run_date: p.run_date,
                  window_start: p.window_start, window_end: p.window_end,
                  approval_uuid: p.approval_uuid }) }}
    next: person_final

  - id: person_final
    type: assign
    parameters:
      target: person_final
      value: "$input"
    next: hist_p1

  # ---- 查重：最近 365 天邮箱审批完整分页（最多 3 页 x 100）----
  - id: hist_p1
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: GET
        path_template: /open-apis/approval/v4/instances
        query_parameters:
          - approval_code
          - page_size
          - start_time
          - end_time
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: >-
        {"query":{"approval_code":"${steps.config.json.approval_code}","page_size":"${steps.config.json.history_page_size}","start_time":"${steps.person_final.json.window_start}","end_time":"${steps.person_final.json.window_end}"}}
    next: hist2_ctx

  - id: hist2_ctx
    type: assign
    parameters:
      target: hist2_context
      value: >-
        {"config":${deploy_config},"person":${steps.person_final.output},"p1":${steps.hist_p1.output}}
    next: hist2_req

  - id: hist2_req
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.p1.code != 0; number('HR01_HISTORY_READ_FAILED:p1'); end ~}}
        {{~ cfg = data.config; w = data.person ~}}
        {{~ more = get(data.p1.data, 'has_more', false); token = get(data.p1.data, 'page_token', '') ~}}
        {{~ if more == true && token == ''; number('HR01_HISTORY_PAGE_TOKEN_MISSING:p1'); end ~}}
        {{~ if more == true && token != '' ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: cfg.history_page_size, start_time: w.window_start, end_time: w.window_end, page_token: token } }) }}
        {{~ else ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: '1', start_time: w.window_start, end_time: w.window_end } }) }}
        {{~ end ~}}
    next: hist_p2

  - id: hist_p2
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: GET
        path_template: /open-apis/approval/v4/instances
        query_parameters:
          - approval_code
          - page_size
          - start_time
          - end_time
          - page_token
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: hist3_ctx

  - id: hist3_ctx
    type: assign
    parameters:
      target: hist3_context
      value: >-
        {"config":${deploy_config},"person":${steps.person_final.output},"p1":${steps.hist_p1.output},"p2":${steps.hist_p2.output}}
    next: hist3_req

  - id: hist3_req
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.p2.code != 0; number('HR01_HISTORY_READ_FAILED:p2'); end ~}}
        {{~ cfg = data.config; w = data.person ~}}
        {{~ p1_more = get(data.p1.data, 'has_more', false); p1_token = get(data.p1.data, 'page_token', '') ~}}
        {{~ p2_more = get(data.p2.data, 'has_more', false); p2_token = get(data.p2.data, 'page_token', '') ~}}
        {{~ if p1_more == true && p1_token == ''; number('HR01_HISTORY_PAGE_TOKEN_MISSING:p1'); end ~}}
        {{~ if p1_more == true && p1_token != '' && p2_more == true && p2_token == ''; number('HR01_HISTORY_PAGE_TOKEN_MISSING:p2'); end ~}}
        {{~ if p1_more == true && p1_token != '' && p2_more == true && p2_token != '' ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: cfg.history_page_size, start_time: w.window_start, end_time: w.window_end, page_token: p2_token } }) }}
        {{~ else ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: '1', start_time: w.window_start, end_time: w.window_end } }) }}
        {{~ end ~}}
    next: hist_p3

  - id: hist_p3
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: GET
        path_template: /open-apis/approval/v4/instances
        query_parameters:
          - approval_code
          - page_size
          - start_time
          - end_time
          - page_token
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: merge_hist

  - id: merge_hist
    type: assign
    parameters:
      target: history_merged
      value: >-
        {"person":${steps.person_final.output},"p1":${steps.hist_p1.output},"p2":${steps.hist_p2.output},"p3":${steps.hist_p3.output}}
    next: collect_history_pages

  # 汇总实例列表：全局去重并证明最多三页历史已经完整读取。
  - id: collect_history_pages
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.merge_hist.output)}; const person = data.person; const fail = code => { throw new Error(code); }; const envelope = (name, val) => { if (!val || val.code !== 0 || !val.data || typeof val.data !== 'object' || Array.isArray(val.data)) fail('HR01_HISTORY_READ_FAILED:' + name); return val.data; }; const validatePage = (name, page) => { if (!Array.isArray(page.instance_code_list) || typeof page.has_more !== 'boolean') fail('HR01_HISTORY_RESPONSE_INVALID:' + name); for (const code of page.instance_code_list) { if (typeof code !== 'string' || code.trim() === '') fail('HR01_HISTORY_RESPONSE_INVALID:' + name); } if (page.has_more === true && typeof page.page_token !== 'string') fail('HR01_HISTORY_RESPONSE_INVALID:' + name); if (Object.prototype.hasOwnProperty.call(page, 'total') && page.total !== null && page.total !== '') { const total = Number(page.total); if (!Number.isInteger(total) || total < 0) fail('HR01_HISTORY_RESPONSE_INVALID:' + name); } }; const p1 = envelope('p1', data.p1); validatePage('p1', p1); const p1More = p1.has_more === true; const p1Token = typeof p1.page_token === 'string' ? p1.page_token.trim() : ''; const p1TokenMissing = p1More && p1Token === ''; const p2Real = p1More && !p1TokenMissing; const p2 = p2Real ? envelope('p2', data.p2) : null; if (p2Real) validatePage('p2', p2); const p2More = p2Real && p2.has_more === true; const p2Token = p2Real && typeof p2.page_token === 'string' ? p2.page_token.trim() : ''; const p2TokenMissing = p2More && p2Token === ''; const p3Real = p2More && !p2TokenMissing; const p3 = p3Real ? envelope('p3', data.p3) : null; if (p3Real) validatePage('p3', p3); const exceeded = p3Real && p3.has_more === true; const seen = Object.create(null); const codes = []; const collect = page => { const out = []; for (const raw of page.instance_code_list) { const code = raw.trim(); if (seen[code]) continue; seen[code] = true; codes.push(code); out.push(code); } return out; }; const page1 = collect(p1); const page2 = p2Real ? collect(p2) : []; const page3 = p3Real ? collect(p3) : []; const totalPresent = Object.prototype.hasOwnProperty.call(p1, 'total') && p1.total !== null && p1.total !== ''; const p1Total = totalPresent ? Number(p1.total) : null; const totalMismatch = totalPresent && p1Total !== codes.length; const listIncomplete = p1TokenMissing || p2TokenMissing || exceeded || totalMismatch; if (listIncomplete && person.mode === 'SUBMIT') { if (p1TokenMissing) fail('HR01_HISTORY_PAGE_TOKEN_MISSING:p1'); if (p2TokenMissing) fail('HR01_HISTORY_PAGE_TOKEN_MISSING:p2'); if (totalMismatch) fail('HR01_HISTORY_TOTAL_MISMATCH'); fail('HR01_HISTORY_PAGINATION_EXCEEDED'); } console.log(JSON.stringify({ has_history: codes.length === 0 ? 'NO' : 'YES', history_count: codes.length, history_pagination_complete: !listIncomplete, scan_planned: codes.length, page1: page1, page2: page2, page3: page3 }));"}
    next: parse_history_pages

  - id: parse_history_pages
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: route_history

  - id: route_history
    type: switch
    parameters:
      on: "${steps.parse_history_pages.json.has_history}"
      branch.YES: extract_history_page1
      branch.NO: no_history_eval
      branch._default: history_route_invalid
    branches:
      "YES": extract_history_page1
      "NO": no_history_eval
      _default: history_route_invalid

  - id: history_route_invalid
    type: transform
    parameters:
      op: template
      template: >-
        {{~ number('HR01_HISTORY_ROUTE_INVALID') ~}}
    next: build_ctx

  - id: no_history_eval
    type: transform
    parameters:
      op: template
      template: >-
        {{ json({ approval_hit: false, matched_serial: '', matched_status: '',
                  scanned: 0, scan_planned: 0, failed_reads: 0,
                  dedup_scan_complete: true,
                  history_count: 0,
                  history_pagination_complete: get(data, 'history_pagination_complete', false) }) }}
    next: build_ctx

  # ---- 全量历史明细：按页受控并发，最多 3 x 100 条 ----
  - id: extract_history_page1
    type: transform
    parameters:
      op: json_extract
      path: page1
      n: "100"
    next: fetch_history_page1_details

  - id: fetch_history_page1_details
    type: foreach
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: GET
        path_template: /open-apis/approval/v4/instances/{instance_code}
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: none
        response_mode: text
        risk: read_only
    parameters:
      sub_step_type: tool_call
      sub_param_tool: nyxid_proxy
      sub_param_arguments: '{"path_params":{"instance_code":"${input}"},"query":{"user_id_type":"user_id"}}'
      min_concurrent_workers: "10"
      max_concurrent_workers: "10"
    next: extract_history_page2

  - id: extract_history_page2
    type: transform
    parameters:
      op: json_extract
      path: page2
      n: "100"
    next: fetch_history_page2_details

  - id: fetch_history_page2_details
    type: foreach
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: GET
        path_template: /open-apis/approval/v4/instances/{instance_code}
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: none
        response_mode: text
        risk: read_only
    parameters:
      sub_step_type: tool_call
      sub_param_tool: nyxid_proxy
      sub_param_arguments: '{"path_params":{"instance_code":"${input}"},"query":{"user_id_type":"user_id"}}'
      min_concurrent_workers: "10"
      max_concurrent_workers: "10"
    next: extract_history_page3

  - id: extract_history_page3
    type: transform
    parameters:
      op: json_extract
      path: page3
      n: "100"
    next: fetch_history_page3_details

  - id: fetch_history_page3_details
    type: foreach
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: GET
        path_template: /open-apis/approval/v4/instances/{instance_code}
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: none
        response_mode: text
        risk: read_only
    parameters:
      sub_step_type: tool_call
      sub_param_tool: nyxid_proxy
      sub_param_arguments: '{"path_params":{"instance_code":"${input}"},"query":{"user_id_type":"user_id"}}'
      min_concurrent_workers: "10"
      max_concurrent_workers: "10"
    next: merge_history_details

  - id: merge_history_details
    type: assign
    parameters:
      target: history_details
      value: >-
        {"person":${steps.person_final.output},"pages":${steps.parse_history_pages.output},"page1":"${json(steps.fetch_history_page1_details.output)}","page2":"${json(steps.fetch_history_page2_details.output)}","page3":"${json(steps.fetch_history_page3_details.output)}"}
    next: dedup_eval

  # 明细查重：状态 PENDING/APPROVED 且详情含 新邮箱：<email> 或 姓名：<name>（ 记为重复。
  # 任一明细缺失、身份不匹配、状态未知或活动审批表单不可解析，submit 都 fail close。
  - id: dedup_eval
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.merge_history_details.output)}; const person = data.person; const pages = data.pages; const fail = code => { throw new Error(code); }; if (!person || typeof person !== 'object' || !pages || typeof pages !== 'object') fail('HR01_DEDUP_INPUT_INVALID'); const expected = Object.create(null); let targetCount = 0; let evidenceShapeValid = true; for (const name of ['page1','page2','page3']) { const list = pages[name]; if (!Array.isArray(list)) { evidenceShapeValid = false; continue; } for (const raw of list) { const code = typeof raw === 'string' ? raw.trim() : ''; if (code === '' || expected[code]) { evidenceShapeValid = false; continue; } expected[code] = true; targetCount += 1; } } const planned = Number(pages.scan_planned); const historyCount = Number(pages.history_count); evidenceShapeValid = evidenceShapeValid && Number.isInteger(planned) && planned >= 0 && planned <= 300 && Number.isInteger(historyCount) && historyCount === planned && targetCount === planned && pages.history_pagination_complete === true; const raw = [data.page1, data.page2, data.page3].filter(s => String(s || '').trim() !== '').join('\\n---\\n'); const chunks = raw === '' ? [] : raw.split('\\n---\\n'); const seen = Object.create(null); const safeTerminal = new Set(['REJECTED','CANCELED','CANCELLED','DELETED']); let scanned = 0; let failed = 0; let hit = false; let matchedSerial = ''; let matchedStatus = ''; for (const chunk of chunks) { let d; try { d = JSON.parse(chunk); } catch (e) { failed += 1; continue; } if (!d || d.code !== 0 || !d.data || typeof d.data !== 'object' || Array.isArray(d.data)) { failed += 1; continue; } const inst = d.data; const actual = typeof inst.instance_code === 'string' ? inst.instance_code.trim() : ''; if (actual === '' || !expected[actual] || seen[actual]) { failed += 1; continue; } seen[actual] = true; const status = typeof inst.status === 'string' ? inst.status.trim().toUpperCase() : ''; if (safeTerminal.has(status)) { scanned += 1; continue; } if (status !== 'PENDING' && status !== 'APPROVED') { failed += 1; continue; } let detailText = ''; if (typeof inst.form === 'string') { try { const form = JSON.parse(inst.form); if (Array.isArray(form)) { for (const w of form) { if (w && w.id === 'widget17163600360780001' && typeof w.value === 'string' && w.value.trim() !== '') detailText = w.value.trim(); } } } catch (e) {} } if (detailText === '') { failed += 1; continue; } scanned += 1; if (detailText.indexOf('新邮箱：' + person.email) !== -1 || detailText.indexOf('姓名：' + person.name + '（') !== -1) { if (!hit) { hit = true; matchedSerial = typeof inst.serial_number === 'string' ? inst.serial_number : ''; matchedStatus = status; } } } const scanComplete = evidenceShapeValid && failed === 0 && scanned === planned && Object.keys(seen).length === planned; if (!scanComplete && person.mode === 'SUBMIT') fail('HR01_DEDUP_SCAN_INCOMPLETE:scanned=' + scanned + ',planned=' + planned + ',failed=' + failed); console.log(JSON.stringify({ approval_hit: hit, matched_serial: matchedSerial, matched_status: matchedStatus, scanned: scanned, scan_planned: planned, failed_reads: failed, dedup_scan_complete: scanComplete, history_count: historyCount, history_pagination_complete: pages.history_pagination_complete === true, detail_limit_exceeded: false }));"}
    next: parse_dedup

  - id: parse_dedup
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: build_ctx

  # ---- 汇合：构造审批请求 ----
  - id: build_ctx
    type: assign
    parameters:
      target: build_context
      value: >-
        {"config":${deploy_config},"person":${steps.person_final.output},"dedup":${input}}
    next: build_request

  - id: build_request
    type: transform
    parameters:
      op: template
      template: >-
        {{~ cfg = data.config; p = data.person; dd = data.dedup ~}}
        {{~ if p.operator_user_id == ''; number('HR01_OPERATOR_REQUIRED'); end ~}}
        {{~ if p.department == ''; number('HR01_DEPARTMENT_REQUIRED'); end ~}}
        {{~ if p.onboarding_date == ''; number('HR01_ONBOARDING_DATE_REQUIRED'); end ~}}
        {{~ hit_json = json(dd.approval_hit); pages_json = json(dd.history_pagination_complete); scan_json = json(dd.dedup_scan_complete) ~}}
        {{~ if p.mode == 'SUBMIT' && hit_json == 'true'; number('HR01_DUPLICATE_ONBOARDING'); end ~}}
        {{~ if p.mode == 'SUBMIT' && hit_json != 'false'; number('HR01_DUPLICATE_STATE_INVALID'); end ~}}
        {{~ if p.mode == 'SUBMIT' && pages_json != 'true'; number('HR01_HISTORY_PAGINATION_INCOMPLETE'); end ~}}
        {{~ if p.mode == 'SUBMIT' && scan_json != 'true'; number('HR01_DEDUP_SCAN_INCOMPLETE'); end ~}}
        {{~ ready = hit_json == 'false' && pages_json == 'true' && scan_json == 'true' ~}}
        {{~ date_prefix = ''; if p.run_date != ''; date_prefix = '申请日期：' + p.run_date + ' | '; end ~}}
        {{~ detail = date_prefix + '姓名：' + p.name + '（入职：' + p.onboarding_date + '）| 部门：' + p.department + ' | 新邮箱：' + p.email + ' | 由 aevatar workflow 自动发起' ~}}
        {{~ link_value = get(cfg, 'approval_template_url', ''); if link_value == ''; number('HR01_APPROVAL_TEMPLATE_URL_REQUIRED'); end ~}}
        {{~ form = json([
              { id: cfg.widget_detail_id, type: 'textarea', value: detail },
              { id: cfg.widget_link_id, type: 'input', value: link_value } ]) ~}}
        {{ json({ mode: p.mode, source: p.source, name: p.name, department: p.department,
                  onboarding_date: p.onboarding_date, email: p.email,
                  email_prefix_source: p.email_prefix_source,
                  operator_user_id: p.operator_user_id, run_date: p.run_date,
                  duplicate_check: dd, ready_for_submit: ready, detail: detail,
                  approval_request: { query: { user_id_type: 'user_id' },
                                      body: { approval_code: cfg.approval_code,
                                              user_id: p.operator_user_id,
                                              uuid: p.approval_uuid,
                                              form: form } } }) }}
    next: route_mode

  - id: route_mode
    type: switch
    parameters:
      on: "${steps.build_request.json.mode}"
      branch.SUBMIT: extract_approval_request
      branch.PREVIEW: preview_summary
      branch._default: preview_summary
    branches:
      SUBMIT: extract_approval_request
      PREVIEW: preview_summary
      _default: preview_summary

  # ---- preview 分支：零副作用 ----
  - id: preview_summary
    type: transform
    parameters:
      op: template
      template: >-
        {{ json({ workflow: 'hr_onboarding_email_approval', mode: 'preview',
                  source: data.source, name: data.name, department: data.department,
                  onboarding_date: data.onboarding_date, run_date: data.run_date,
                  new_email: data.email,
                  email_prefix_source: data.email_prefix_source,
                  duplicate_check: data.duplicate_check,
                  ready_for_submit: data.ready_for_submit,
                  approval_detail_preview: data.detail,
                  side_effects: false }) }}
    next: done

  # ---- submit 分支：一次创建 + 回读 ----
  - id: extract_approval_request
    type: transform
    parameters:
      op: json_extract
      path: approval_request
    next: create_approval

  - id: create_approval
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: POST
        path_template: /open-apis/approval/v4/instances
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: build_verify_request

  - id: build_verify_request
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.code != 0 || get(data.data, 'instance_code', '') == ''; number('HR01_APPROVAL_NOT_CREATED'); end ~}}
        {{ json({ path_params: { instance_code: data.data.instance_code }, query: { user_id_type: 'user_id' } }) }}
    next: verify_approval

  - id: verify_approval
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: f681818b-f625-4aef-82f7-8bfd92e426b8
        method: GET
        path_template: /open-apis/approval/v4/instances/{instance_code}
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: merge_submit_results

  - id: merge_submit_results
    type: assign
    parameters:
      target: submit_results
      value: >-
        {"built":${steps.build_request.output},"created":${steps.create_approval.output},"verified":${steps.verify_approval.output}}
    next: summarize_submit

  - id: summarize_submit
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.created.code != 0 || get(data.created.data, 'instance_code', '') == ''; number('HR01_APPROVAL_NOT_CREATED'); end ~}}
        {{~ verify_ok = data.verified.code == 0 ~}}
        {{ json({ workflow: 'hr_onboarding_email_approval', mode: 'submit',
                  source: data.built.source, name: data.built.name,
                  department: data.built.department,
                  onboarding_date: data.built.onboarding_date,
                  run_date: data.built.run_date, new_email: data.built.email,
                  email_prefix_source: data.built.email_prefix_source,
                  duplicate_check: data.built.duplicate_check,
                  approval_created: true,
                  instance_code: data.created.data.instance_code,
                  approval_status: get(data.verified.data, 'status', 'UNKNOWN'),
                  verify_ok: verify_ok,
                  partial_failure: verify_ok == false,
                  side_effects: true }) }}
    next: done

  - id: done
    type: assign
    parameters:
      target: final
      value: "$input"
