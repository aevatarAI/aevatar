# =============================================================================
# FIN-01 发票预检与付款审批发起（正式配置：线上「付款申请」分支表单）
#
# 控件契约：2026-08-14 只读核验线上 ACTIVE「付款申请」定义：fieldList
#          含 26 个子字段、其中 22 个 required。构造器按法币/加密分支填充
#          当前可见字段；默认法币 submit 计划为 18 个明细字段 + fieldList/备注/附件。
# 用途：对上传的发票（PDF/图片导出文本/TXT，多附件视为同一张发票的多页）提取字段，
#       构造真实「付款申请」审批表单；preview 输出提取结果、查重结果与表单摘要；
#       submit 创建 1 条付款审批并回读。
# 输入（JSON）+ 附件：
#   {"run_date":"2026-08-11","submit":false,
#    "submitter_email":"jianwei.su@aelf.io",
#    "review":{"Department":"Finance","Department Open ID":"",
#              "Currency":"SGD",
#              "Payment Entity":"ChronoAI Pte Ltd (法币支付)",
#              "Payer Information":"","Recipient Address":"",
#              "Related Approval":"","Remark":"","Vendor":"","Amount":""}}
#   review 为人工复核覆盖项（可省略）；submitter_email 默认取 config。
#
# 行为契约：
#   - preview 和 submit 都检查最近 365 天付款审批历史：实例列表完整分页
#     （最多 3 页 x 100，超出 -> FIN01_HISTORY_PAGINATION_EXCEEDED，submit 硬拒），
#     并按页读取全部已列出的实例明细，做精确 invoice number 匹配
#     （付款事由中 "(Invoice: <号码>)"，状态 PENDING/APPROVED 记为有效历史）；
#     命中 -> preview ready_for_submit=false，submit 硬拒 FIN01_DUPLICATE_INVOICE。
#   - 审批创建携带稳定业务 uuid（审批定义+供应商+发票号+币种+金额），跨日期重试仍幂等。
#   - LLM 仅负责从发票文本抄写/识别字段；金额换算、校验、表单构造全部为确定性代码。
#   - 空输入安全：运行输入经 json() 引号内嵌入进入 code_execute 并在代码内解析，绝不生成非法 JS。
#   - submit=false 零副作用；submit=true 先上传原始附件，再仅创建 1 条审批，任何失败均不自动重试。
#
# ★ 部署参数见 config 步骤；user_service_id 为 ChronoAI Lark Bot 的 NyxID 服务。
#   部门负责人映射与表单控件 ID 是「付款申请」审批的业务常量，写在
#   build_lark_form 的代码里；schema 数量与关键字段已只读核验，未在本次修改中创建审批。
# =============================================================================
name: fin_invoice_precheck_approval
description: 发票预检与付款审批：附件提取 + LLM 字段识别 + 确定性校验，按线上 schema 构造法币/加密付款分支（主体/金额/银行或地址/合同/部门与负责人），preview 与 submit 都做最近 365 天完整分页查重，submit 创建一条真实「付款申请」审批并回读。
roles:
  - id: extractor
    name: Invoice Field Extractor
    system_prompt: >-
      You are an invoice field transcription engine. From the invoice TEXT you
      are given, return PURE JSON only (no markdown, no code fences):
      {"vendor":"","amount":"","currency":"","invoice_date":"YYYY-MM-DD",
       "invoice_number":"","description":"","bank_name":"",
       "bank_account":"","swift_code":""}.
      The vendor is the invoice issuer/seller, never the bill-to customer. For
      image invoices, inspect the header, logo, legal name, website domain, or support email
      and return the clearest issuer/brand name supported by that evidence. Transcribe
      the printed total due; never sum, convert, default, or guess values. Currency
      must be explicitly printed as a code or symbol. Use "" when absent. JSON only.
    allowed_tools: []
steps:
  - id: capture_request
    type: assign
    parameters:
      target: raw_request
      value: "$input"
    next: config

  # ★★★ 部署参数（真实正式配置）★★★
  - id: config
    type: assign
    parameters:
      target: deploy_config
      value: >-
        {"approval_code":"F640097D-0A68-47C1-A7BC-86659BC4B06F",
         "default_submitter_email":"jianwei.su@aelf.io",
         "lark_service_slug":"api-lark-bot-2",
         "allowed_currencies":{"USD":1,"CNY":1,"SGD":1},
         "history_page_size":"100"}
    next: extract_documents

  - id: extract_documents
    type: foreach
    parameters:
      items_source: input_file_refs
      sub_step_type: tool_call
      sub_param_tool: document_extract
      sub_param_arguments: '{"maxChars":8000}'
      min_concurrent_workers: "1"
      max_concurrent_workers: "3"
    next: ocr_fields

  - id: ocr_fields
    type: llm_call
    target_role: extractor
    parameters:
      prompt_prefix: >-
        Extract the invoice fields as pure JSON from this document text (multiple
        attachments are pages of ONE invoice):
    next: validate_ctx

  - id: validate_ctx
    type: assign
    parameters:
      target: validate_context
      value: >-
        {"config":${deploy_config},"request_raw":"${json(steps.capture_request.output)}","ocr":"${json(steps.ocr_fields.output)}","extract":"${json(steps.extract_documents.output)}"}
    next: parse_validate

  # 确定性解析与校验：请求、发票字段、部门映射、查重窗口、uuid、contact 查询体
  - id: parse_validate
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.validate_ctx.output)};
        const cfg = data.config;
        const fail = code => { throw new Error(code); };
        let req = data.request_raw;
        if (typeof req === 'string') { const t = req.trim(); if (t === '') req = {}; else { try { req = JSON.parse(t); } catch (e) { req = {}; } } }
        if (!req || typeof req !== 'object') req = {};
        const extractRaw = String(data.extract || '');
        if (extractRaw.trim() === '') fail('FIN01_NO_ATTACHMENTS');
        const attachmentCount = extractRaw.split('\\n---\\n').filter(s => s.trim() !== '').length;
        if (attachmentCount <= 0) fail('FIN01_NO_ATTACHMENTS');
        const sub = req.submit === true || req.submit === 'true';
        const runDate = String(req.run_date || '').trim();
        const rm = runDate.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);
        if (!rm) fail('FIN01_RUN_DATE_REQUIRED:YYYY-MM-DD');
        { const y = Number(rm[1]); const mo = Number(rm[2]); const d = Number(rm[3]); const dt = new Date(Date.UTC(y, mo - 1, d)); if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) fail('FIN01_RUN_DATE_REQUIRED:YYYY-MM-DD'); }
        const endMs = Date.UTC(Number(rm[1]), Number(rm[2]) - 1, Number(rm[3]), 23, 59, 59);
        const startMs = endMs - 365 * 24 * 60 * 60 * 1000;
        let raw = typeof data.ocr === 'string' ? data.ocr : JSON.stringify(data.ocr);
        raw = raw.trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
        const match = raw.match(/\\{[\\s\\S]*\\}/);
        let fields;
        try { fields = JSON.parse(match ? match[0] : raw); } catch (e) { fail('FIN01_OCR_PARSE_FAILED'); }
        if (!fields || typeof fields !== 'object') fail('FIN01_OCR_PARSE_FAILED');
        const src = fields.invoice && typeof fields.invoice === 'object' ? fields.invoice : fields;
        const review = req.review && typeof req.review === 'object' ? req.review : {};
        const getReview = label => { const variants = [label, label.toLowerCase(), label.replace(/\\s+/g, '_'), label.replace(/\\s+/g, '_').toLowerCase(), label.replace(/\\s+/g, '-'), label.replace(/\\s+/g, '-').toLowerCase(), label.replace(/\\s+/g, ''), label.replace(/\\s+/g, '').toLowerCase()]; for (const key of variants) { if (review[key] !== undefined && review[key] !== '' && review[key] !== null) return review[key]; } return undefined; };
        const validDateParts = (y, mo, d) => { const dt = new Date(Date.UTC(y, mo - 1, d)); return dt.getUTCFullYear() === y && dt.getUTCMonth() === mo - 1 && dt.getUTCDate() === d; };
        const normalizeInvoiceDate = value => { const text = String(value === undefined || value === null ? '' : value).trim(); if (text === '') return ''; let dateMatch = text.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})$/); if (dateMatch) { const y = Number(dateMatch[1]); const mo = Number(dateMatch[2]); const d = Number(dateMatch[3]); return validDateParts(y, mo, d) ? dateMatch[1] + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2) : ''; } const months = { january: 1, jan: 1, february: 2, feb: 2, march: 3, mar: 3, april: 4, apr: 4, may: 5, june: 6, jun: 6, july: 7, jul: 7, august: 8, aug: 8, september: 9, sep: 9, sept: 9, october: 10, oct: 10, november: 11, nov: 11, december: 12, dec: 12 }; dateMatch = text.match(/^([A-Za-z]+)\\s+(\\d{1,2}),?\\s+(\\d{4})$/); if (!dateMatch) return ''; const mo = months[dateMatch[1].toLowerCase()] || 0; const d = Number(dateMatch[2]); const y = Number(dateMatch[3]); return validDateParts(y, mo, d) ? String(y) + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2) : ''; };
        const normalizedInvoiceDate = normalizeInvoiceDate(src.invoice_date || src.date || src.invoiceDate);
        const invoice = { vendor: String(src.vendor || '').trim(), amount: String(src.amount === undefined || src.amount === null ? '' : src.amount).replace(/[^0-9.\\-]/g, ''), currency: String(src.currency || '').toUpperCase().trim(), date: normalizedInvoiceDate, invoice_date: normalizedInvoiceDate, invoice_number: String(src.invoice_number || src.invoiceNumber || '').trim(), description: String(src.description || '').trim(), bank_name: String(src.bank_name || src.bankName || '').trim(), bank_account: String(src.bank_account || src.bankAccount || '').trim(), swift_code: String(src.swift_code || src.swiftCode || '').trim() };
        const reviewedVendor = String(getReview('Vendor') || '').trim();
        if (reviewedVendor !== '') invoice.vendor = reviewedVendor;
        const reviewedAmount = String(getReview('Amount') || '').replace(/[^0-9.\\-]/g, '').trim();
        const amountValue = reviewedAmount !== '' ? parseFloat(reviewedAmount) : parseFloat(invoice.amount);
        const sharedCurrency = String(getReview('Currency') || invoice.currency || '').toUpperCase().trim();
        const sharedEntity = String(getReview('Payment Entity') || 'ChronoAI Pte Ltd (法币支付)').trim();
        const isAelfInvest = sharedEntity === 'AELF INVEST';
        const isDigitalAsset = sharedEntity === 'DigitalAsset Payment';
        const isCryptoEntity = isAelfInvest || isDigitalAsset;
        const payerInformation = String(getReview('Payer Information') || '').trim();
        const recipientAddress = String(getReview('Recipient Address') || '').trim();
        const departmentOpenId = String(getReview('Department Open ID') || getReview('Department ID') || '').trim();
        const problems = [];
        if (invoice.vendor === '') problems.push('vendor_missing');
        if (invoice.invoice_number === '') problems.push('invoice_number_missing');
        if (invoice.invoice_date === '') problems.push('invoice_date_missing');
        if (!Number.isFinite(amountValue) || amountValue <= 0) problems.push('amount_missing');
        const allowedCurrencies = cfg.allowed_currencies || { USD: 1, CNY: 1, SGD: 1 };
        if (sharedCurrency === '') problems.push('currency_missing'); else if (allowedCurrencies[sharedCurrency] !== 1) problems.push('currency_not_supported');
        if (!isCryptoEntity && invoice.bank_account === '') problems.push('bank_account_missing');
        if (isCryptoEntity && recipientAddress === '') problems.push('recipient_address_missing');
        if (isDigitalAsset && payerInformation === '') problems.push('payer_information_missing');
        if (departmentOpenId !== '' && !/^od-[0-9a-f]+$/i.test(departmentOpenId)) problems.push('department_open_id_invalid');
        const DEPT_MAP = { 'devops': 'kaiwei.lim@aelf.io', 'finance': 'ada.niu@aelf.io', 'human resources': 'ada.niu@aelf.io', 'hr': 'ada.niu@aelf.io', 'executive support': 'ada.niu@aelf.io', \"president's office\": 'ada.niu@aelf.io', 'ai application': 'ada.niu@aelf.io', 'ai framework': 'shining.wang@aelf.io', 'portkey': 'ada.niu@aelf.io', 'aetherlink & aefinder': 'jason.wang@aelf.io', 'aetherlink': 'jason.wang@aelf.io', 'aefinder': 'jason.wang@aelf.io' };
        const applicantEmail = String(req.submitter_email || cfg.default_submitter_email).toLowerCase().trim();
        const department = String(getReview('Department') || 'Finance').trim();
        const leaderEmail = DEPT_MAP[department.toLowerCase()] || null;
        const relatedApprovalInput = String(getReview('Related Approval') || '').trim();
        let relatedApprovalId = null;
        if (relatedApprovalInput) { const uuidRe = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i; if (uuidRe.test(relatedApprovalInput)) relatedApprovalId = relatedApprovalInput.toUpperCase(); }
        const remark = String(getReview('Remark') || '');
        const norm = value => String(value || '').toLowerCase().replace(/\\s+/g, ' ').trim();
        const invNumNorm = norm(invoice.invoice_number);
        const vendorNorm = norm(invoice.vendor).replace(/pte\\.? ltd\\.?/g, '').replace(/inc\\.?|llc|corp\\.?/g, '').trim();
        const amountNorm = Number.isFinite(amountValue) ? amountValue.toFixed(2) : '0.00';
        const hex32 = (value, seed) => { let hash = (2166136261 ^ seed) >>> 0; for (let index = 0; index < value.length; index += 1) { hash = (hash ^ value.charCodeAt(index)) >>> 0; hash = Math.imul(hash, 16777619) >>> 0; } return ('0000000' + hash.toString(16)).slice(-8); };
        const identityKey = ['FIN01', cfg.approval_code, vendorNorm, invNumNorm, sharedCurrency, amountNorm].join('|');
        const hex = hex32(identityKey, 1) + hex32(identityKey, 2) + hex32(identityKey, 3) + hex32(identityKey, 4);
        const uuid = hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20, 32);
        console.log(JSON.stringify({ mode: sub ? 'SUBMIT' : 'PREVIEW', run_date: runDate, attachment_count: attachmentCount, invoice, amount_value: Number.isFinite(amountValue) ? amountValue : 0, problems, shared_currency: sharedCurrency, shared_entity: sharedEntity, department, department_open_id: departmentOpenId, applicant_email: applicantEmail, leader_email: leaderEmail, payer_information: payerInformation, recipient_address: recipientAddress, related_approval_id: relatedApprovalId, remark, invoice_number_norm: invNumNorm, window_start: String(startMs), window_end: String(endMs), approval_uuid: uuid, lookup_request: { query: { user_id_type: 'user_id' }, body: { emails: [applicantEmail, leaderEmail || applicantEmail] } } }));"}
    next: pv_parse

  - id: pv_parse
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: extract_lookup_request

  # ---- contact lookup：申请人与部门负责人邮箱 -> user_id ----
  - id: extract_lookup_request
    type: transform
    parameters:
      op: json_extract
      path: lookup_request
    next: contact_lookup

  - id: contact_lookup
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: POST
        path_template: /open-apis/contact/v3/users/batch_get_id
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
        risk: read_only
    parameters:
      tool: nyxid_proxy
    next: applicant_detail_ctx

  # 申请人所属部门用于付款明细的 required department 控件；review 可显式覆盖 open id。
  - id: applicant_detail_ctx
    type: assign
    parameters:
      target: applicant_detail_context
      value: >-
        {"pre":${steps.pv_parse.output},"lookup":${steps.contact_lookup.output}}
    next: build_applicant_detail_request

  - id: build_applicant_detail_request
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.applicant_detail_ctx.output)}; const fail = code => { throw new Error(code); }; const lookup = data.lookup; const pre = data.pre; if (!lookup || lookup.code !== 0 || !lookup.data || !Array.isArray(lookup.data.user_list)) fail('FIN01_CONTACT_LOOKUP_FAILED'); const applicant = lookup.data.user_list.find(u => u && String(u.email || '').toLowerCase() === String(pre.applicant_email || '').toLowerCase()); if (!applicant || typeof applicant.user_id !== 'string' || applicant.user_id.trim() === '') fail('FIN01_APPLICANT_NOT_RESOLVED:' + String(pre.applicant_email || '')); console.log(JSON.stringify({ path_params: { user_id: applicant.user_id.trim() }, query: { user_id_type: 'user_id', department_id_type: 'open_department_id' } }));"}
    next: parse_applicant_detail_request

  - id: parse_applicant_detail_request
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: applicant_detail

  - id: applicant_detail
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/contact/v3/users/{user_id}
        query_parameters:
          - user_id_type
          - department_id_type
        header_parameters: []
        body_mode: none
        response_mode: text
        risk: read_only
    parameters:
      tool: nyxid_proxy
    next: hist_p1

  # ---- 查重：最近 365 天付款审批完整分页（最多 3 页 x 100）----
  - id: hist_p1
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/approval/v4/instances
        query_parameters:
          - approval_code
          - page_size
          - start_time
          - end_time
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: >-
        {"query":{"approval_code":"${steps.config.json.approval_code}","page_size":"${steps.config.json.history_page_size}","start_time":"${steps.pv_parse.json.window_start}","end_time":"${steps.pv_parse.json.window_end}"}}
    next: hist2_ctx

  - id: hist2_ctx
    type: assign
    parameters:
      target: hist2_context
      value: >-
        {"config":${deploy_config},"pre":${steps.pv_parse.output},"p1":${steps.hist_p1.output}}
    next: hist2_req

  - id: hist2_req
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.p1.code != 0; number('FIN01_HISTORY_READ_FAILED:p1'); end ~}}
        {{~ cfg = data.config; w = data.pre ~}}
        {{~ more = get(data.p1.data, 'has_more', false); token = get(data.p1.data, 'page_token', '') ~}}
        {{~ if more == true && token != '' ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: cfg.history_page_size, start_time: w.window_start, end_time: w.window_end, page_token: token } }) }}
        {{~ else ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: '1', start_time: w.window_start, end_time: w.window_end } }) }}
        {{~ end ~}}
    next: hist_p2

  - id: hist_p2
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/approval/v4/instances
        query_parameters:
          - approval_code
          - page_size
          - start_time
          - end_time
          - page_token
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: hist3_ctx

  - id: hist3_ctx
    type: assign
    parameters:
      target: hist3_context
      value: >-
        {"config":${deploy_config},"pre":${steps.pv_parse.output},"p1":${steps.hist_p1.output},"p2":${steps.hist_p2.output}}
    next: hist3_req

  - id: hist3_req
    type: transform
    parameters:
      op: template
      template: >-
        {{~ cfg = data.config; w = data.pre ~}}
        {{~ p1_more = get(data.p1.data, 'has_more', false); p1_token = get(data.p1.data, 'page_token', '') ~}}
        {{~ if p1_more == true && p1_token != '' ~}}
        {{~   if data.p2.code != 0; number('FIN01_HISTORY_READ_FAILED:p2'); end ~}}
        {{~   p2_more = get(data.p2.data, 'has_more', false); p2_token = get(data.p2.data, 'page_token', '') ~}}
        {{~   if p2_more == true && p2_token != '' ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: cfg.history_page_size, start_time: w.window_start, end_time: w.window_end, page_token: p2_token } }) }}
        {{~   else ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: '1', start_time: w.window_start, end_time: w.window_end } }) }}
        {{~   end ~}}
        {{~ else ~}}
        {{ json({ query: { approval_code: cfg.approval_code, page_size: '1', start_time: w.window_start, end_time: w.window_end } }) }}
        {{~ end ~}}
    next: hist_p3

  - id: hist_p3
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/approval/v4/instances
        query_parameters:
          - approval_code
          - page_size
          - start_time
          - end_time
          - page_token
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: merge_hist

  - id: merge_hist
    type: assign
    parameters:
      target: history_merged
      value: >-
        {"pre":${steps.pv_parse.output},"p1":${steps.hist_p1.output},"p2":${steps.hist_p2.output},"p3":${steps.hist_p3.output}}
    next: collect_history_pages

  - id: collect_history_pages
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.merge_hist.output)}; const pre = data.pre; const fail = code => { throw new Error(code); }; const read = (name, val) => { if (!val || val.code !== 0 || !val.data) fail('FIN01_HISTORY_READ_FAILED:' + name); return val.data; }; const p1 = read('p1', data.p1); const token1 = String(p1.page_token || '').trim(); const p2Real = p1.has_more === true && token1 !== ''; let p2 = {}; if (p2Real) p2 = read('p2', data.p2); const token2 = String(p2.page_token || '').trim(); const p3Real = p2Real && p2.has_more === true && token2 !== ''; let p3 = {}; if (p3Real) p3 = read('p3', data.p3); const missingToken = (p1.has_more === true && token1 === '') || (p2Real && p2.has_more === true && token2 === ''); const exceeded = p3Real && p3.has_more === true; const seen = Object.create(null); const unique = list => { const out = []; for (const code of (list || [])) { const c = String(code || '').trim(); if (c === '' || seen[c]) continue; seen[c] = true; out.push(c); } return out; }; const page1 = unique(p1.instance_code_list); const page2 = p2Real ? unique(p2.instance_code_list) : []; const page3 = p3Real ? unique(p3.instance_code_list) : []; const count = page1.length + page2.length + page3.length; const paginationComplete = !missingToken && !exceeded; const paginationError = missingToken ? 'missing_page_token' : (exceeded ? 'page_limit_exceeded' : ''); if (pre.mode === 'SUBMIT' && missingToken) fail('FIN01_HISTORY_PAGINATION_INCOMPLETE:missing_page_token'); if (pre.mode === 'SUBMIT' && exceeded) fail('FIN01_HISTORY_PAGINATION_EXCEEDED'); console.log(JSON.stringify({ has_history: count === 0 ? 'NO' : 'YES', history_count: count, history_pagination_complete: paginationComplete, pagination_error: paginationError, page1: page1, page2: page2, page3: page3 }));"}
    next: parse_history_pages

  - id: parse_history_pages
    type: transform
    parameters:
      op: json_parse
