  - id: merge_history_details
    type: assign
    parameters:
      target: history_details
      value: >-
        {"approval_code":"${steps.config.json.approval_code}","pre":${steps.pv_parse.output},"pages":${steps.parse_history_pages.output},"page1":"${json(steps.fetch_history_page1_details.output)}","page2":"${json(steps.fetch_history_page2_details.output)}","page3":"${json(steps.fetch_history_page3_details.output)}"}
    next: dedup_eval

  # 明细查重：付款事由含 "(Invoice: <号码>)" 且状态 PENDING/APPROVED 记为重复；
  # 同收款人历史仅作提示计数。
  - id: dedup_eval
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.merge_history_details.output)}; const pre = data.pre; const pages = data.pages; const expectedApprovalCode = String(data.approval_code || '').trim(); const fail = code => { throw new Error(code); }; const normVendor = s => String(s || '').toLowerCase().replace(/\\s+/g, '').replace(/pte\\.?ltd\\.?/g, '').replace(/inc\\.?|llc|corp\\.?/g, ''); const invNum = pre.invoice_number_norm; const curVendor = normVendor(pre.invoice.vendor); const expectedCodes = [].concat(pages.page1 || [], pages.page2 || [], pages.page3 || []).map(x => String(x || '').trim()).filter(Boolean); const expected = expectedCodes.length; const expectedSet = Object.create(null); for (const code of expectedCodes) expectedSet[code] = (expectedSet[code] || 0) + 1; const raw = [data.page1, data.page2, data.page3].filter(s => String(s || '').trim() !== '').join('\\n---\\n'); const chunks = raw === '' ? [] : raw.split('\\n---\\n'); let scanned = 0; let failed = 0; let hit = false; let matchedSerial = ''; let matchedStatus = ''; let sameVendor = 0; for (const chunk of chunks) { let d; try { d = JSON.parse(chunk); } catch (e) { failed += 1; continue; } if (!d || d.code !== 0 || !d.data || typeof d.data !== 'object') { failed += 1; continue; } const inst = d.data; const instanceCode = String(inst.instance_code || '').trim(); if (instanceCode === '' || !expectedSet[instanceCode] || expectedSet[instanceCode] < 1 || String(inst.approval_code || '').trim() !== expectedApprovalCode) { failed += 1; continue; } let form; try { form = JSON.parse(inst.form); } catch (e) { failed += 1; continue; } const fieldList = Array.isArray(form) ? form.find(w => w && w.id === 'widget17168633868040001' && w.type === 'fieldList') : null; const fl = fieldList && Array.isArray(fieldList.value) && Array.isArray(fieldList.value[0]) ? fieldList.value[0] : null; if (!fl) { failed += 1; continue; } expectedSet[instanceCode] -= 1; scanned += 1; const status = String(inst.status || 'UNKNOWN').toUpperCase(); if (status !== 'PENDING' && status !== 'APPROVED') continue; let desc = ''; let vendor = ''; for (const w of fl) { if (!w) continue; if (w.id === 'widget17168645326090001') desc = String(w.value || ''); if (w.id === 'widget17168661650480001') vendor = String(w.value || ''); } if (invNum !== '' && desc.toLowerCase().indexOf('(invoice: ' + invNum + ')') !== -1 && !hit) { hit = true; matchedSerial = inst.serial_number || ''; matchedStatus = status; } const vn = normVendor(vendor); if (curVendor !== '' && vn !== '' && (vn.indexOf(curVendor) !== -1 || curVendor.indexOf(vn) !== -1)) sameVendor += 1; } const scanComplete = failed === 0 && scanned === expected; if (!scanComplete && pre.mode === 'SUBMIT') fail('FIN01_DEDUP_SCAN_INCOMPLETE:scanned=' + scanned + ',expected=' + expected + ',failed=' + failed); console.log(JSON.stringify({ duplicate_hit: hit, matched_serial: matchedSerial, matched_status: matchedStatus, same_vendor_recent: sameVendor, scanned: scanned, scan_planned: expected, failed_reads: failed, dedup_scan_complete: scanComplete, history_count: Number(pages.history_count) || expected, history_pagination_complete: pages.history_pagination_complete === true, pagination_error: String(pages.pagination_error || '') }));"}
    next: parse_dedup

  - id: parse_dedup
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: build_form_ctx
  # ---- 显式合并 form_config / ocr_fields / capture_request（+ lookup / dedup）----
  - id: build_form_ctx
    type: assign
    parameters:
      target: build_form_context
      value: >-
        {"form_config":${deploy_config},"ocr_fields":${steps.pv_parse.output},"capture_request":"${json(steps.capture_request.output)}","lookup":${steps.contact_lookup.output},"applicant":${steps.applicant_detail.output},"dedup":${input}}
    next: build_lark_form

  # 付款表单构造：按线上 26-child / 22-required schema 填充当前分支的可见数据控件。
  - id: build_lark_form
    type: tool_call
    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 2000
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.build_form_ctx.output)};
        const cfg = data.form_config;
        const pre = data.ocr_fields;
        const dedup = data.dedup;
        const lookup = data.lookup;
        const applicant = data.applicant;
        const fail = code => { throw new Error(code); };
        if (!lookup || lookup.code !== 0) fail('FIN01_CONTACT_LOOKUP_FAILED');
        const emailToId = {};
        const users = lookup.data && Array.isArray(lookup.data.user_list) ? lookup.data.user_list : [];
        for (const user of users) { if (user && user.email && (user.user_id || user.open_id)) emailToId[String(user.email).toLowerCase()] = user.user_id || user.open_id; }
        const APPLICANT_ID = emailToId[pre.applicant_email];
        if (!APPLICANT_ID) fail('FIN01_APPLICANT_NOT_RESOLVED:' + pre.applicant_email);
        let DEPT_HEAD_ID = APPLICANT_ID;
        let deptHeadSource = 'self';
        if (pre.leader_email && emailToId[String(pre.leader_email).toLowerCase()]) { DEPT_HEAD_ID = emailToId[String(pre.leader_email).toLowerCase()]; deptHeadSource = 'mapped:' + pre.department + '->' + pre.leader_email; }
        const formProblems = Array.isArray(pre.problems) ? pre.problems.slice() : [];
        const addProblem = problem => { if (formProblems.indexOf(problem) === -1) formProblems.push(problem); };
        const profileDepartmentIds = applicant && applicant.code === 0 && applicant.data && applicant.data.user && Array.isArray(applicant.data.user.department_ids) ? applicant.data.user.department_ids : [];
        const departmentOpenId = String(pre.department_open_id || profileDepartmentIds[0] || '').trim();
        const departmentValid = /^od-[0-9a-f]+$/i.test(departmentOpenId);
        if (!departmentValid) addProblem('department_open_id_missing');
        const paymentTypeMap = { 'ChronoAI Pte Ltd (法币支付)': 'lwpsdr33-27z0rv3m3t4-0', 'ECHO AI Pte Ltd（法币支付）': 'm985jjql-nv5p6wxbf3-1', 'Portkey Singapore Entity (法币支付)': 'lwpsdr33-1ogx09m8w4w-0', 'Portkey Singapore Entity (法币支付）': 'lwpsdr33-1ogx09m8w4w-0', 'Eregion Labs Pte Ltd（法币支付）': 'lwpu4gg8-7utwc7j0g5-1', 'AELF INVEST': 'lwpsdr33-zgezrnen1e-0', 'DigitalAsset Payment': 'lwpsqbd0-edoqopnuje7-1' };
        const paymentType = paymentTypeMap[pre.shared_entity];
        if (!paymentType) addProblem('payment_entity_unsupported');
        const NO_MARKETING = 'm1er13p8-jy4c1eb1le-0';
        const NO_HR = 'miig2pwk-4bx8l7d96pf-0';
        const NO_CONTRACT = 'lwpsq1d7-72ixwmka1jh-0';
        const YES_CONTRACT = 'lwpsq1d7-v8f220gwhp-0';
        const WAY_BANK_TRANSFER = 'lwpsti1z-5ogmo0ul3vb-0';
        const CONTRACT_OPTION = pre.related_approval_id ? YES_CONTRACT : NO_CONTRACT;
        const inv = pre.invoice;
        const isAelfInvest = paymentType === 'lwpsdr33-zgezrnen1e-0';
        const isDigitalAsset = paymentType === 'lwpsqbd0-edoqopnuje7-1';
        const isCryptoPath = isAelfInvest || isDigitalAsset;
        const invoiceDate = /^\\d{4}-\\d{2}-\\d{2}$/.test(inv.date) ? inv.date : pre.run_date;
        const paymentDateISO = invoiceDate + 'T00:00:00Z';
        const verifyDateISO = new Date(new Date(invoiceDate + 'T00:00:00Z').getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0] + 'T00:00:00Z';
        const amountValue = pre.amount_value;
        const finalDesc = inv.description || ('Payment to ' + (inv.vendor || 'vendor'));
        const descriptionText = finalDesc + ' (Invoice: ' + (inv.invoice_number || 'N/A') + ')';
        const row = [];
        if (departmentValid) row.push({ id: 'widget17379650536220001', type: 'department', value: [{ name: pre.department, open_id: departmentOpenId }], ext: {} });
        row.push({ id: 'widget17168644567560001', type: 'contact', value: [DEPT_HEAD_ID] }, { id: 'widget17168638060470001', type: 'radioV2', value: paymentType }, { id: 'widget17270803199920001', type: 'radioV2', value: NO_MARKETING }, { id: 'widget17643090840670001', type: 'radioV2', value: NO_HR }, { id: 'widget17168643792430001', type: 'radioV2', value: CONTRACT_OPTION });
        if (pre.related_approval_id) row.push({ id: 'widget17168655594420001', type: 'connect', value: [pre.related_approval_id] });
        row.push({ id: 'widget17168645326090001', type: 'textarea', value: descriptionText }, { id: 'widget17168645408360001', type: 'radioV2', value: WAY_BANK_TRANSFER });
        if (isCryptoPath) {
        row.push({ id: 'widget17168648709360001', type: 'number', value: String(amountValue) });
        if (isDigitalAsset) row.push({ id: 'widget17241241332240001', type: 'radioV2', value: amountValue < 5000 ? 'm01uzre5-3vbzwd8wl3b-0' : (amountValue <= 50000 ? 'm01uzre5-pjmscdzhzbr-0' : 'm01uzre5-xcbztagc13-0') });
        } else if (formProblems.indexOf('currency_not_supported') === -1 && formProblems.indexOf('currency_missing') === -1) {
        row.push({ id: 'widget17168648705100001', type: 'amount', value: amountValue, currency: pre.shared_currency, ext: { currency: pre.shared_currency, currencyRange: ['USD', 'CNY', 'SGD'] } }, { id: 'widget17770125501800001', type: 'amount', value: amountValue, currency: pre.shared_currency, ext: { currency: pre.shared_currency, currencyRange: ['USD', 'SGD', 'CNY'] } });
        }
        row.push({ id: 'widget16487160384360001', type: 'date', value: paymentDateISO });
        if (isCryptoPath) {
        if (isDigitalAsset) row.push({ id: 'widget17241474102120001', type: 'input', value: pre.payer_information }, { id: 'widget17168664162730001', type: 'text', value: '当需要财务统一付款时，例如使用USDT付款，填写“财务”即可。当使用其他地址作为付款方时，例如项目自己管理的钱包地址，填写对应付款地址及地址类型，如TRC-20 地址 xxxxxxxx' });
        row.push({ id: 'widget17168664010280001', type: 'input', value: pre.recipient_address }, { id: 'widget17241474918880001', type: 'text', value: '本栏填写收币地址及地址类型，如TRC-20 地址 xxxxxxxx' });
        } else {
        row.push({ id: 'widget17168661650480001', type: 'input', value: inv.vendor || 'Unknown' }, { id: 'widget17168661652050001', type: 'input', value: inv.bank_name || 'TBD - please fill' }, { id: 'widget17168661653930001', type: 'input', value: inv.bank_account || 'TBD - please fill' }, { id: 'widget17168661664870001', type: 'input', value: inv.swift_code || 'TBD' });
        }
        row.push({ id: 'widget17168769083410001', type: 'textarea', value: finalDesc }, { id: 'widget17168764909530001', type: 'date', value: verifyDateISO }, { id: 'widget17168771264530001', type: 'text', value: '务必在验证时间内提交付款效果验证的审批。' });
        const formData = [{ id: 'widget17168633868040001', type: 'fieldList', value: [row] }];
        const aiDisclaimer = 'This approval was auto-generated by AI invoice recognition. Data reviewed and confirmed by submitter before submission.';
        let dupeNote = '';
        if (dedup.duplicate_hit) dupeNote = '\\n\\n[Dedup] POSSIBLE DUPLICATE of ' + dedup.matched_serial + ' (' + dedup.matched_status + ')'; else if (dedup.same_vendor_recent > 0) dupeNote = '\\n\\n[Dedup] Same-vendor history in recent ' + dedup.scanned + ' instances: ' + dedup.same_vendor_recent;
        const remarkValue = (pre.remark ? pre.remark + '\\n\\n' : '') + aiDisclaimer + dupeNote;
        formData.push({ id: 'widget16487161430270001', type: 'textarea', value: remarkValue });
        const historyOk = dedup.history_pagination_complete === true;
        const scanOk = dedup.dedup_scan_complete === true;
        const ready = formProblems.length === 0 && dedup.duplicate_hit === false && historyOk && scanOk;
        if (pre.mode === 'SUBMIT') { if (dedup.duplicate_hit === true) fail('FIN01_DUPLICATE_INVOICE:' + dedup.matched_serial); if (!historyOk) fail('FIN01_HISTORY_PAGINATION_EXCEEDED'); if (!scanOk) fail('FIN01_DEDUP_SCAN_INCOMPLETE'); if (formProblems.length > 0) fail('FIN01_NOT_READY:' + formProblems.join(',')); }
        console.log(JSON.stringify({ mode: pre.mode, run_date: pre.run_date, ready_for_submit: ready, problems: formProblems, invoice: inv, amount_value: amountValue, shared_currency: pre.shared_currency, shared_entity: pre.shared_entity, department: pre.department, department_open_id: departmentOpenId, dept_head_source: deptHeadSource, related_approval_id: pre.related_approval_id, duplicate_check: dedup, attachment_count: pre.attachment_count, attachment_upload_planned: pre.attachment_count > 0, form_summary: { field_list_rows: 1, populated_row_widgets: row.length, populated_widgets_after_attachment: row.length + 3, schema_child_widgets: 26, schema_required_widgets: 22, payment_type: isCryptoPath ? 'crypto' : 'fiat', includes_department: departmentValid, includes_department_head: true, includes_current_payment_amount: !isCryptoPath, includes_related_approval: pre.related_approval_id !== null, includes_bank_fields: !isCryptoPath, includes_attachment: pre.attachment_count > 0, includes_remark: true }, form_without_attachments: formData, approval_identity: { approval_code: cfg.approval_code, user_id: APPLICANT_ID, uuid: pre.approval_uuid } }));"}
    next: parse_form

  - id: parse_form
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: route_mode

  - id: route_mode
    type: switch
    parameters:
      on: "${steps.parse_form.json.mode}"
      branch.SUBMIT: build_attachment_upload_context
      branch.PREVIEW: preview_summary
      branch._default: preview_summary
    branches:
      SUBMIT: build_attachment_upload_context
      PREVIEW: preview_summary
      _default: preview_summary

  # ---- preview 分支：只报告附件将在 submit 时上传，零副作用 ----
  - id: preview_summary
    type: transform
    parameters:
      op: template
      template: >-
        {{ json({ workflow: 'fin_invoice_precheck_approval', mode: 'preview',
                  ready_for_submit: data.ready_for_submit, problems: data.problems,
                  extracted_invoice: data.invoice, amount_value: data.amount_value,
                  currency: data.shared_currency, payment_entity: data.shared_entity,
                  department: data.department, dept_head_source: data.dept_head_source,
                  duplicate_check: data.duplicate_check,
                  attachment_count: data.attachment_count,
                  attachment_upload_planned: data.attachment_upload_planned,
                  form_summary: data.form_summary,
                  side_effects: false }) }}
    next: done

  # ---- submit 分支：上传所有原始附件，注入 attachmentV2 后仅创建一次审批 ----
  - id: build_attachment_upload_context
    type: assign
    parameters:
      target: attachment_upload_context
      value: >-
        {"config_json":"${json(steps.config.output)}","documents":"${json(steps.extract_documents.output)}"}
    next: build_attachment_upload_requests

  - id: build_attachment_upload_requests
    type: tool_call
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.build_attachment_upload_context.output)}; let cfg = {}; try { cfg = JSON.parse(String(data.config_json || '')); } catch (e) {} const serviceSlug = String(cfg.lark_service_slug || 'api-lark-bot-2').trim(); if (serviceSlug !== 'api-lark-bot-2') throw new Error('FIN01_LARK_SERVICE_SLUG_INVALID'); const raw = data.documents; const parts = String(raw || '').split('\\n---\\n').filter(s => s.trim() !== ''); const requests = []; for (const part of parts) { let d; try { d = JSON.parse(part); } catch (e) { throw new Error('FIN01_ATTACHMENT_DESCRIPTOR_INVALID'); } const f = d && d.file; if (!f || (!f.file_id && !f.artifact_id) || !f.owner_run_id) throw new Error('FIN01_ATTACHMENT_DESCRIPTOR_INVALID'); const ref = { file_id: f.file_id || '', artifact_id: f.artifact_id || '', source_kind: f.source_kind || 'unspecified', source_message_id: f.source_message_id || '', source_resource_key: f.source_resource_key || '', created_at_unix_ms: Number(f.created_at_unix_ms || 0), expires_at_unix_ms: Number(f.expires_at_unix_ms || 0), owner_run_id: f.owner_run_id, owner_scope_id: f.owner_scope_id || '' }; requests.push(JSON.stringify({ file_ref: ref, slug: serviceSlug, path: 'approval/openapi/v2/file/upload', method: 'POST', file_field_name: 'content', form: { name: f.file_name || 'invoice', type: 'attachment' }, output: { kind: 'approval_file_code', selector: 'data.code' }, max_file_bytes: 31457280 })); } if (requests.length === 0) throw new Error('FIN01_NO_ATTACHMENTS'); console.log(JSON.stringify(requests));"}
    next: parse_attachment_upload_requests

  - id: parse_attachment_upload_requests
    type: transform
    parameters:
      op: json_parse
      path: output.stdout
    next: upload_attachments

  - id: upload_attachments
    type: foreach
    parameters:
      sub_step_type: tool_call
      sub_param_tool: workflow_file_submit
      sub_param_arguments: "${input}"
      min_concurrent_workers: "3"
      max_concurrent_workers: "3"
    next: merge_attachment_form_context

  - id: merge_attachment_form_context
    type: assign
    parameters:
      target: attachment_form_context
      value: >-
        {"built":${steps.parse_form.output},"uploaded":"${json(steps.upload_attachments.output)}"}
    next: merge_attachment_form

  - id: merge_attachment_form
    type: tool_call
    parameters:
      tool: code_execute
      arguments: >-
        {"language":"javascript","code":"const data = ${json(steps.merge_attachment_form_context.output)}; const built = data.built; const raw = data.uploaded; const parts = String(raw || '').split('\\n---\\n').filter(s => s.trim() !== ''); const codes = []; for (const part of parts) { let d; try { d = JSON.parse(part); } catch (e) { throw new Error('FIN01_ATTACHMENT_UPLOAD_FAILED'); } if (!d || d.success !== true || !d.output_code) throw new Error('FIN01_ATTACHMENT_UPLOAD_FAILED'); codes.push(String(d.output_code)); } if (codes.length !== Number(built.attachment_count || 0)) throw new Error('FIN01_ATTACHMENT_UPLOAD_INCOMPLETE'); const form = Array.isArray(built.form_without_attachments) ? built.form_without_attachments.slice() : []; form.push({ id: 'widget16487161419060001', type: 'attachmentV2', value: codes }); const identity = built.approval_identity; console.log(JSON.stringify({ query: { user_id_type: 'user_id' }, body: { approval_code: identity.approval_code, user_id: identity.user_id, uuid: identity.uuid, form: JSON.stringify(form) } }));"}
    next: create_approval

  - id: create_approval
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: POST
        path_template: /open-apis/approval/v4/instances
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
        risk: write
    parameters:
      tool: nyxid_proxy
    next: build_verify_request

  - id: build_verify_request
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.code != 0 || get(data.data, 'instance_code', '') == ''; number('FIN01_APPROVAL_NOT_CREATED_AFTER_ATTACHMENT_UPLOAD'); end ~}}
        {{ json({ path_params: { instance_code: data.data.instance_code }, query: { user_id_type: 'user_id' } }) }}
    next: verify_approval

  - id: verify_approval
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: 77d19bda-d635-4af5-bfba-cfcccfd6ba0b
        method: GET
        path_template: /open-apis/approval/v4/instances/{instance_code}
        query_parameters:
          - user_id_type
        header_parameters: []
        body_mode: none
        response_mode: text
        risk: read_only
    parameters:
      tool: nyxid_proxy
    next: merge_submit_results

  - id: merge_submit_results
    type: assign
    parameters:
      target: submit_results
      value: >-
        {"built":${steps.parse_form.output},"uploaded":"${json(steps.upload_attachments.output)}","created":${steps.create_approval.output},"verified":${steps.verify_approval.output}}
    next: summarize_submit

  - id: summarize_submit
    type: transform
    parameters:
      op: template
      template: >-
        {{~ if data.created.code != 0 || get(data.created.data, 'instance_code', '') == ''; number('FIN01_APPROVAL_NOT_CREATED_AFTER_ATTACHMENT_UPLOAD'); end ~}}
        {{~ verify_ok = data.verified.code == 0 ~}}
        {{ json({ workflow: 'fin_invoice_precheck_approval', mode: 'submit',
                  invoice: data.built.invoice, amount_value: data.built.amount_value,
                  currency: data.built.shared_currency, payment_entity: data.built.shared_entity,
                  department: data.built.department, dept_head_source: data.built.dept_head_source,
                  duplicate_check: data.built.duplicate_check,
                  attachment_count: data.built.attachment_count,
                  attachments_uploaded: true,
                  approval_created: true,
                  instance_code: data.created.data.instance_code,
                  approval_status: get(data.verified.data, 'status', 'UNKNOWN'),
                  verify_ok: verify_ok,
                  partial_failure: verify_ok == false,
                  retry_allowed: false,
                  side_effects: true }) }}
    next: done

  - id: done
    type: assign
    parameters:
      target: final
      value: "$input"
