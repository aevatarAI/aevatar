      branch.option_1: release_unselected_after_confirm_option_1
      branch.option_2: release_unselected_after_confirm_option_2
      branch.option_3: release_unselected_after_confirm_option_3
      branch.deposit: final_artifact_payment_blocked
      branch.deposit_required: final_artifact_payment_blocked
      branch.ambiguous: final_artifact_confirmation_ambiguous
      branch.await_choice: final_artifact_waiting_after_holds
      branch._default: final_artifact_waiting_after_holds
    branches:
      option_1: release_unselected_after_confirm_option_1
      option_2: release_unselected_after_confirm_option_2
      option_3: release_unselected_after_confirm_option_3
      deposit: final_artifact_payment_blocked
      deposit_required: final_artifact_payment_blocked
      ambiguous: final_artifact_confirmation_ambiguous
      await_choice: final_artifact_waiting_after_holds
