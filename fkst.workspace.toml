[workspace]
units = [".fkst/local-packages/*"]
packages = [".fkst/local-packages/*"]

[registries]
workspace = "workspace"

[[external_sources]]
id = "fkst-packages"
git = "https://github.com/ChronoAIProject/fkst-packages.git"
rev = "7e1defb04493d6f4478c569f4fe2b6aae2118b4b"
libraries = ["contract", "forge", "testkit", "workflow", "devloop"]
packages = [
  "github-proxy",
  "consensus",
  "github-devloop-decompose",
  "github-devloop-intake",
  "github-devloop-intake-default",
  "github-devloop",
  "github-devloop-pr",
  "github-devloop-ops",
]
