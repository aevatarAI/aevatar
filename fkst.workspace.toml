[workspace]
units = [".fkst/local-packages/*"]
packages = [".fkst/local-packages/*"]

[registries]
workspace = "workspace"

[[external_sources]]
id = "fkst-packages"
git = "https://github.com/eanz17/fkst-packages.git"
rev = "16c14ae0d84fd0b0bbc0e93cdd75320a36c3ba42"
libraries = ["contract", "forge", "testkit", "workflow", "devloop"]
packages = [
  "github-proxy",
  "consensus",
  "github-devloop-decompose",
  "github-devloop-intake",
  "github-devloop-intake-default",
  "github-devloop",
  "github-devloop-pr",
  "github-devloop-ops",
]
